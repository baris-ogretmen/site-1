<style>
:root{
  --bg1:#1a1240; --bg2:#2a1b63; --kart:#ffffff; --yazi:#1f1640; --acik:#f5f3ff;
  --mor:#7c3aed; --pembe:#ec4899; --turkuaz:#14b8a6; --sari:#facc15; --kirmizi:#ef4444;
  --yesil:#22c55e; --turuncu:#f97316; --mavi:#3b82f6;
  --f:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --logo:'Baloo 2','Nunito',system-ui,sans-serif;
  --alt:env(safe-area-inset-bottom,0px); --ust:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--f);font-weight:800;color:var(--acik);background:radial-gradient(120% 90% at 20% 0%,#3b2a8f 0%,var(--bg2) 38%,var(--bg1) 100%);
  font-variant-numeric:lining-nums tabular-nums;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:var(--f);font-weight:800;cursor:pointer;border:0;color:inherit}
#yildizlar{position:fixed;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(2px 2px at 10% 20%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 70% 12%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 40% 60%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 85% 70%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 25% 85%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 55% 35%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 92% 40%,#fff 50%,transparent 51%)}
.ekran{position:fixed;inset:0;display:flex;flex-direction:column}
[hidden]{display:none!important}

/* ===== ÜST BAŞLIK ===== */
#ust{display:flex;align-items:center;gap:.7rem;padding:calc(.6rem + var(--ust)) 1rem .6rem;flex:0 0 auto}
.logo{font-family:var(--logo);font-weight:800;font-size:1.9rem;line-height:1;letter-spacing:.5px;
  background:linear-gradient(90deg,#fde047,#fb7185,#a78bfa,#5eead4);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.logo-alt{font-size:.85rem;opacity:.8;font-weight:700}
.bosluk{flex:1}
.siteye{background:linear-gradient(180deg,#fff,#ede9fe);color:#3b2a8f;padding:.55rem .95rem;border-radius:999px;font-size:1rem;box-shadow:0 3px 0 #a78bfa;white-space:nowrap}
.siteye:active{transform:translateY(2px);box-shadow:0 1px 0 #a78bfa}

/* ===== MENÜ ===== */
#menu{flex:1;display:flex;flex-direction:column;min-height:0}
#menuUst{padding:.2rem 1rem .4rem;display:flex;flex-wrap:wrap;align-items:center;gap:.6rem}
.hos{font-size:1.15rem}
.seviye-cip{background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.25);padding:.35rem .8rem;border-radius:999px;font-size:.95rem}
#kartlar{flex:1;min-height:0;overflow-y:auto;padding:.4rem 1rem 1rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(13.5rem,1fr));gap:.9rem;align-content:start;grid-auto-rows:max-content;-webkit-overflow-scrolling:touch}
.okart{position:relative;text-align:left;background:var(--kart);color:var(--yazi);border-radius:1.3rem;padding:0;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.25);transition:transform .12s}
.okart:active{transform:translateY(4px) scale(.98)}
.okart .gorsel{height:6.6rem;display:flex;align-items:center;justify-content:center;font-size:3.6rem;position:relative}
.okart .gorsel canvas{position:absolute;inset:0;width:100%;height:100%}
.okart .gorsel span{position:relative;filter:drop-shadow(0 4px 0 rgba(0,0,0,.2))}
.okart .bilgi{padding:.6rem .8rem .75rem}
.okart h3{margin:0;font-size:1.18rem;line-height:1.15}
.okart p{margin:.25rem 0 0;font-size:.86rem;font-weight:700;color:#5b5378;line-height:1.25}
.okart .rozet{position:absolute;top:.5rem;right:.5rem;background:rgba(255,255,255,.92);color:#3b2a8f;border-radius:999px;padding:.15rem .55rem;font-size:.78rem}
.okart .yeni{position:absolute;top:.5rem;left:.5rem;background:#facc15;color:#422006;border-radius:999px;padding:.12rem .5rem;font-size:.72rem}
#menuAlt{display:flex;flex-wrap:wrap;gap:.45rem;justify-content:center;padding:.5rem .8rem calc(.6rem + var(--alt));flex:0 0 auto}
.kucuk{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.2);padding:.45rem .8rem;border-radius:999px;font-size:.92rem;opacity:.72}
.kucuk:hover,.kucuk:active{opacity:1}
#surumRozet{position:fixed;left:.5rem;bottom:calc(.4rem + var(--alt));font-size:.72rem;opacity:.45;background:rgba(0,0,0,.25);padding:.15rem .5rem;border-radius:999px;z-index:5}

/* ===== OYUN EKRANI ===== */
#oyun{flex:1;display:flex;flex-direction:column;min-height:0}
#hud{display:flex;align-items:center;gap:.7rem;padding:calc(.45rem + var(--ust)) .9rem .4rem;flex:0 0 auto}
#hudAd{font-family:var(--logo);font-size:1.45rem;line-height:1}
#hudBilgi{font-size:1.05rem;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#hudSkor{font-size:1.35rem;background:rgba(0,0,0,.28);padding:.25rem .8rem;border-radius:999px;white-space:nowrap}
#sahne{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
#cv{display:block;touch-action:none;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
#kontrol{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;align-items:stretch;padding:.5rem .6rem calc(.55rem + var(--alt))}
.kd{min-width:5.2rem;min-height:3.6rem;padding:.35rem .8rem;border-radius:1rem;font-size:1.05rem;line-height:1.05;color:#fff;
  box-shadow:0 5px 0 rgba(0,0,0,.35);background:#6d28d9;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;touch-action:none}
.kd small{display:block;font-size:.72rem;opacity:.95}
.kd.basili,.kd:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35);filter:brightness(1.12)}
.kd.yukari{background:#16a34a}.kd.asagi{background:#ea580c}.kd.sol{background:#2563eb}.kd.sag{background:#dc2626}
.kd.ana{background:linear-gradient(180deg,#f472b6,#db2777);min-width:7rem}
.kd.gri{background:rgba(255,255,255,.16);min-width:4.4rem}
.kd.parla{animation:parla 1s infinite}
@keyframes parla{50%{filter:brightness(1.5);box-shadow:0 0 0 5px #fde047,0 5px 0 rgba(0,0,0,.35)}}

/* ===== MODAL ===== */
#modal{position:fixed;inset:0;z-index:900;background:rgba(10,6,30,.62);display:flex;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(3px)}
.mkart{background:#fff;color:var(--yazi);border-radius:1.5rem;padding:1.2rem 1.3rem;width:min(40rem,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:gir .22s ease-out}
@keyframes gir{from{transform:translateY(30px);opacity:0}}
.mkart h2{margin:.1rem 0 .6rem;font-size:1.6rem;font-family:var(--logo)}
.mkart p,.mkart li{font-size:1.08rem;line-height:1.4;font-weight:700;color:#3f3760}
.dugmeler{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.9rem}
.dugmeler.dikey{flex-direction:column}.dugmeler.dikey .btn{flex:none}
.btn{flex:1 1 9rem;padding:.85rem 1rem;border-radius:1rem;font-size:1.12rem;background:#ede9fe;color:#3b2a8f;box-shadow:0 4px 0 #c4b5fd}
.btn.birincil{background:linear-gradient(180deg,#8b5cf6,#6d28d9);color:#fff;box-shadow:0 4px 0 #4c1d95}
.btn.yesil{background:linear-gradient(180deg,#34d399,#059669);color:#fff;box-shadow:0 4px 0 #065f46}
.btn:active{transform:translateY(3px);box-shadow:none}
.soru-baslik{font-size:1.05rem;color:#7c3aed}
.soru-metin{font-size:clamp(1.4rem,2.4vw + .6rem,2rem);line-height:1.25;margin:.35rem 0 .7rem;color:#1f1640}
.siklar{display:grid;gap:.7rem;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr))}
.sik{padding:.9rem .8rem;border-radius:1.1rem;font-size:clamp(1.2rem,1.6vw + .6rem,1.7rem);background:#f5f3ff;color:#1f1640;border:3px solid #ddd6fe;box-shadow:0 4px 0 #ddd6fe;min-height:4rem}
.sik .em{display:block;font-size:3.4rem;line-height:1.1}
.sik.dogru{background:#dcfce7;border-color:#22c55e;box-shadow:0 4px 0 #22c55e}
.sik.yanlis{background:#fee2e2;border-color:#ef4444;box-shadow:0 4px 0 #ef4444}
.dinle{background:#fef3c7;color:#92400e;padding:.45rem .8rem;border-radius:999px;font-size:1rem;box-shadow:0 3px 0 #fcd34d}
.secim-izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.2rem,1fr));gap:.6rem;margin:.6rem 0}
.secim{padding:.7rem .4rem;border-radius:1rem;background:#f5f3ff;border:3px solid #ddd6fe;font-size:1rem;color:#1f1640}
.secim.secili{border-color:#7c3aed;background:#ede9fe;box-shadow:0 0 0 3px #c4b5fd}
.bilye-top{width:2.6rem;height:2.6rem;border-radius:50%;margin:0 auto .3rem;box-shadow:inset -6px -8px 0 rgba(0,0,0,.18),inset 6px 6px 0 rgba(255,255,255,.35)}

/* ===== TOAST / BANNER ===== */
#toastlar{position:fixed;top:calc(.6rem + var(--ust));left:50%;transform:translateX(-50%);z-index:950;display:flex;flex-direction:column;gap:.4rem;align-items:center;pointer-events:none;width:min(92vw,40rem)}
.toast{background:rgba(20,12,50,.92);border:2px solid rgba(255,255,255,.2);padding:.55rem 1rem;border-radius:999px;font-size:1.05rem;animation:gir .2s;text-align:center}
#banner{position:fixed;top:calc(.5rem + var(--ust));left:50%;transform:translateX(-50%);z-index:960;background:#0f172a;border:2px solid #34d399;color:#d1fae5;padding:.5rem .6rem .5rem 1rem;border-radius:999px;font-size:.95rem;display:flex;gap:.6rem;align-items:center;max-width:94vw}
#banner button{background:rgba(255,255,255,.15);border-radius:999px;width:1.8rem;height:1.8rem}
#yeniSurum{position:fixed;top:calc(.5rem + var(--ust));right:.6rem;z-index:970;background:#dc2626;color:#fff;border-radius:999px;padding:.45rem .9rem;font-size:.95rem;animation:nabiz 1.2s infinite;display:flex;gap:.5rem;align-items:center}
@keyframes nabiz{50%{box-shadow:0 0 0 8px rgba(220,38,38,.35)}}
#yanCevir{position:fixed;inset:0;z-index:9800;background:#1a1240;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;text-align:center;padding:2rem}
#yanCevir .tel{font-size:4rem;animation:don 2s infinite}
@keyframes don{50%{transform:rotate(90deg)}}

/* ===== ÇOCUK BOYU ===== */
body.cocuk-boyu #menuUst{min-height:calc(34vh - 4.2rem);align-content:flex-end;align-items:flex-end}
body.cocuk-boyu #kartlar{flex:0 1 auto;max-height:52vh;grid-template-columns:repeat(auto-fill,minmax(11rem,1fr));gap:.6rem}
body.cocuk-boyu #menu{justify-content:flex-end}
body.cocuk-boyu .okart .gorsel{height:4.6rem;font-size:2.7rem}
body.cocuk-boyu .okart p{display:none}
body.cocuk-boyu #hud{min-height:36vh;align-items:flex-start;flex-wrap:wrap;align-content:flex-start}
body.cocuk-boyu #hud #hudAd{font-size:2.4rem}
body.cocuk-boyu #hud #hudSkor{font-size:2rem}
body.cocuk-boyu #hud #hudBilgi{font-size:1.5rem;white-space:normal;flex-basis:100%}
body.cocuk-boyu #sahne{align-items:flex-end}
body.cocuk-boyu #modal{align-items:flex-end}
body.cocuk-boyu .mkart{max-height:64vh}

/* telefon / kısa ekran */
@media (max-height:520px){
  #hud{padding-top:calc(.2rem + var(--ust));padding-bottom:.2rem}
  #hudAd{font-size:1.1rem}
  #kontrol{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding-top:.3rem;padding-bottom:calc(.3rem + var(--alt))}
  .kd{min-height:2.9rem;min-width:4.2rem;font-size:.92rem;flex:0 0 auto}
  .okart .gorsel{height:4.4rem;font-size:2.6rem}
  .mkart{max-height:96vh;padding:.8rem 1rem}
  #ust{padding-top:calc(.3rem + var(--ust));padding-bottom:.3rem}
  .logo{font-size:1.4rem}
}
@media print{html{zoom:1!important}}
</style>

/* ---------- CİHAZ + ÖLÇEK ---------- */
const CIHAZ=(function(){
  const ua=navigator.userAgent||'';
  const dpr=window.devicePixelRatio||1;
  const sw=Math.max(screen.width||0,screen.height||0);
  const fiz=sw*dpr;
  const dok=(navigator.maxTouchPoints||0)>0||('ontouchstart' in window);
  const win=/Windows/i.test(ua);
  const tahta=dok&&((sw>=1700&&dpr<=1.3)||(fiz>=3000&&(win||sw>=1500)));
  const buyukTahta=tahta&&fiz>=3800;
  return {dpr,sw,fiz,dok,win,tahta,buyukTahta};
})();
function olcekUygula(){
  let s=1;
  if(CIHAZ.buyukTahta) s=1.6; else if(CIHAZ.tahta) s=1.35;
  const kisa=Math.min(innerWidth,innerHeight);
  if(!CIHAZ.tahta){ if(kisa<420) s=0.82; else if(kisa<560) s=0.9; }
  document.documentElement.style.fontSize=(16*s)+'px';
}

/* ---------- SFX: WebAudio efektleri ---------- */
const SFX={
  ctx:null,acik:LS.get('mola_sfx','1')!=='0',_son:{},_gurBuf:null,
  init(){if(this.ctx)return;try{const A=window.AudioContext||window.webkitAudioContext;if(A)this.ctx=new A()}catch(e){this.ctx=null}},
  ton(f,d,tip,v,slide,gecik){
    const c=this.ctx;if(!c)return;
    const t=c.currentTime+(gecik||0);
    const o=c.createOscillator(),g=c.createGain();
    o.type=tip||'sine';o.frequency.setValueAtTime(f,t);
    if(slide&&slide!==1)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.12,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+0.03);
  },
  gurultu(d,v,f,q){
    const c=this.ctx;if(!c)return;
    if(!this._gurBuf){const n=c.sampleRate;const b=c.createBuffer(1,n,n);const a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;this._gurBuf=b}
    const t=c.currentTime;const s=c.createBufferSource();s.buffer=this._gurBuf;
    const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f||1200;bp.Q.value=q||1.2;
    const g=c.createGain();g.gain.setValueAtTime(v||0.15,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    s.connect(bp);bp.connect(g);g.connect(c.destination);s.start(t,Math.random()*0.5);s.stop(t+d+0.02);
  },
  cal(ad,p){
    if(!this.acik)return;
    this.init();if(!this.ctx)return;
    if(this.ctx.state==='suspended'){try{this.ctx.resume()}catch(e){}}
    const n=performance.now();if(this._son[ad]&&n-this._son[ad]<28)return;this._son[ad]=n;
    p=p||1;
    try{switch(ad){
      case 'pop':this.ton(520*p,0.09,'sine',0.22,0.35);this.gurultu(0.05,0.12,2400*p);break;
      case 'sek':this.ton(440*p,0.07,'square',0.05);break;
      case 'kir':this.gurultu(0.13,0.16,1700*p);this.ton(880*p,0.08,'triangle',0.07,0.5);break;
      case 'para':this.ton(988,0.07,'square',0.06);this.ton(1319,0.14,'square',0.06,1,0.07);break;
      case 'kristal':this.ton(1600*p,0.28,'sine',0.045,1.02);this.ton(2500*p,0.2,'sine',0.03);break;
      case 'zip':this.ton(290,0.18,'square',0.06,2.3);break;
      case 'dogru':[523,659,784].forEach((f,i)=>this.ton(f,0.15,'triangle',0.12,1,i*0.1));break;
      case 'yanlis':this.ton(320,0.28,'sawtooth',0.05,0.6);break;
      case 'kazan':[523,659,784,1047].forEach((f,i)=>this.ton(f,0.22,'triangle',0.12,1,i*0.12));break;
      case 'kayip':[392,330,262].forEach((f,i)=>this.ton(f,0.24,'triangle',0.1,1,i*0.16));break;
      case 'fisek':this.gurultu(0.7,0.22,420,0.7);this.ton(160,0.45,'sine',0.12,0.4);break;
      case 'firla':this.gurultu(0.5,0.06,2600,3);this.ton(300,0.5,'sine',0.03,3);break;
      case 'tik':this.ton(820,0.03,'square',0.035);break;
      case 'guc':this.ton(380,0.32,'sine',0.12,3);break;
      case 'whoosh':this.gurultu(0.3,0.12,700);break;
      case 'yer':this.ton(140,0.12,'sine',0.18,0.6);this.gurultu(0.08,0.1,500);break;
      case 'satir':[660,880,1100].forEach((f,i)=>this.ton(f*p,0.12,'square',0.05,1,i*0.06));break;
    }}catch(e){}
  }
};

/* ---------- UI: modal + toast ---------- */
const UI={
  acik:false,_kapanis:null,
  modal(html,opt){
    opt=opt||{};
    const m=$('#modal');m.innerHTML='<div class="mkart">'+html+'</div>';m.hidden=false;this.acik=true;
    this._kapanis=opt.kapaninca||null;
    m.onclick=e=>{if(opt.disKapat!==false&&e.target===m)UI.kapat()};
    return m.firstElementChild;
  },
  kapat(){
    const m=$('#modal');m.hidden=true;m.innerHTML='';this.acik=false;
    const f=this._kapanis;this._kapanis=null;if(f){try{f()}catch(e){console.error(e)}}
  },
  toast(t,sure){
    const k=$('#toastlar');const d=document.createElement('div');d.className='toast';d.textContent=t;k.appendChild(d);
    while(k.children.length>3)k.removeChild(k.firstChild);
    setTimeout(()=>{d.style.transition='opacity .4s';d.style.opacity='0';setTimeout(()=>d.remove(),450)},sure||2200);
  }
};

    else if(/Android/i.test(ua))os='Android';else if(/CrOS/i.test(ua))os='Chromebook';else if(/Windows/i.test(ua))os='Windows';

    else if(/Firefox\//.test(ua))tarayici='Firefox';else if(/Safari\//.test(ua))tarayici='Safari';
    const dpr=window.devicePixelRatio||1,sw=Math.max(screen.width,screen.height),dok=(navigator.maxTouchPoints||0)>0;
    let tur='Bilgisayar';
    if(dok&&((sw>=1700&&dpr<=1.3)||sw*dpr>=3000&&(os==='Windows'||sw>=1500)))tur='Akıllı Tahta';

    if(!r.ok)throw new Error('HTTP '+r.status);

    return j.filter(x=>x.document).map(x=>{const f=x.document.fields||{};const o={};['ad','soyad','sinif','sube','oyun','cihaz','os','tarayici','ekran','giris','son'].forEach(k=>o[k]=deger(f[k]));return o});

  }
  function filtreli(){
    const q=($('#zgAra')?.value||'').toLocaleLowerCase('tr-TR'),fo=$('#zgFo')?.value||'',fs=$('#zgFs')?.value||'',fc=$('#zgFc')?.value||'';
    return panelVeri.filter(r=>(!q||(r.ad+' '+r.soyad).toLocaleLowerCase('tr-TR').includes(q))&&(!fo||r.oyun===fo)&&(!fs||r.sinif===fs)&&(!fc||r.cihaz===fc));
  }
  function ciz(){
    const ic=$('#zgIc');if(!ic)return;
    const simdi=Date.now(),bugun=new Date().toDateString();
    const cevrim=r=>{const t=new Date(r.son).getTime();return simdi-t<5*60000};
    const farkli=new Set(panelVeri.map(r=>(r.ad+'|'+r.soyad+'|'+r.sinif+'|'+r.sube).toLocaleLowerCase('tr-TR'))).size;
    const bug=panelVeri.filter(r=>new Date(r.giris).toDateString()===bugun).length;
    const say=k=>panelVeri.filter(r=>r.cihaz===k).length;
    const uniq=k=>Array.from(new Set(panelVeri.map(r=>r[k]).filter(Boolean))).sort((a,b)=>String(a).localeCompare(String(b),'tr',{numeric:true}));
    const opt=(arr,ad)=>`<option value="">${ad}</option>`+arr.map(v=>`<option>${esc(v)}</option>`).join('');

      <div class="zg-oz"><b>${panelVeri.filter(cevrim).length}</b>🟢 Şu an oyunda</div><div class="zg-oz"><b>${bug}</b>Bugün</div>
      <div class="zg-oz"><b>${say('Telefon')}</b>📱 Telefon</div><div class="zg-oz"><b>${say('Tablet')}</b>📲 Tablet</div>

      <div class="zg-filtre"><input id="zgAra" placeholder="🔎 İsim ara"><select id="zgFo">${opt(uniq('oyun'),'Tüm oyunlar')}</select>
      <select id="zgFs">${opt(uniq('sinif'),'Tüm sınıflar')}</select><select id="zgFc">${opt(uniq('cihaz'),'Tüm cihazlar')}</select></div>
      <div style="overflow:auto;max-height:52vh"><table class="zg-tablo"><thead><tr><th>Öğrenci</th><th>Sınıf</th><th>Oyun</th><th>Cihaz</th><th>Giriş</th><th>Son görülme</th></tr></thead><tbody id="zgTb"></tbody></table></div>`;
    const tb=()=>{$('#zgTb').innerHTML=filtreli().map(r=>`<tr><td>${cevrim(r)?'<span class="zg-nokta"></span>':''}${esc(r.ad)} ${esc(r.soyad)}</td><td>${esc(r.sinif)}-${esc(r.sube)}</td><td>${esc(r.oyun)}</td><td>${esc(r.cihaz)}<br><small>${esc(r.os)} · ${esc(r.tarayici)}</small></td><td>${tarihYaz(r.giris)}</td><td>${tarihYaz(r.son)}</td></tr>`).join('')||'<tr><td colspan="6">Kayıt yok.</td></tr>'};

    if(navigator.clipboard)navigator.clipboard.writeText(t).then(ok,()=>yedekKopya(t,ok));else yedekKopya(t,ok);

/* ---------- 📲 QR ile paylaş ---------- */
function qrKutuphane(){
  return new Promise((ok,hata)=>{
    if(window.qrcode)return ok();
    const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js';
    s.onload=()=>ok();s.onerror=()=>hata(new Error('yuklenemedi'));document.head.appendChild(s);
  });
}
function ZIRVE_paylasAc(){
  const adres=(window.PAYLAS&&PAYLAS.url)||location.href.split('#')[0];
  if(!/^https?:/.test(location.protocol)||/localhost|127\.0\.0\.1/.test(location.hostname)){
    UI.modal(`<h2>📲 QR ile paylaş</h2><p>QR kodu oluşturmak için önce dosyayı GitHub Pages'e yükle. Yüklenince bu düğme adresi QR'a çevirir.</p><div class="dugmeler"><button class="btn birincil" onclick="UI.kapat()">Tamam</button></div>`);return;
  }
  UI.modal(`<h2>📲 QR ile paylaş</h2><div id="qrAlan" style="background:#fff;padding:1rem;border-radius:1rem;text-align:center">QR hazırlanıyor…</div>
    <p style="word-break:break-all;font-size:.95rem">${esc(adres)}</p>
    <div class="dugmeler"><button class="btn" id="qrKop">🔗 Linki kopyala</button><button class="btn" id="qrPng">⬇️ PNG indir</button><button class="btn birincil" onclick="UI.kapat()">Kapat</button></div>`);
  $('#qrKop').onclick=()=>{try{navigator.clipboard.writeText(adres).then(()=>UI.toast('🔗 Link kopyalandı'))}catch(e){}};
  qrKutuphane().then(()=>{
    const q=qrcode(0,'M');q.addData(adres);q.make();
    const n=q.getModuleCount(),k=8,p=4*k,cv=document.createElement('canvas');cv.width=cv.height=n*k+p*2;
    const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,cv.width,cv.height);c.fillStyle='#1a1240';
    for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))c.fillRect(p+x*k,p+y*k,k,k);
    cv.style.width='min(16rem,70vw)';cv.style.height='auto';const a=$('#qrAlan');if(!a)return;a.innerHTML='';a.appendChild(cv);
    $('#qrPng').onclick=()=>{const l=document.createElement('a');l.download='mola-parki-qr.png';l.href=cv.toDataURL('image/png');l.click()};
  }).catch(()=>{const a=$('#qrAlan');if(a)a.textContent='QR kütüphanesi yüklenemedi (internet yok olabilir). Linki kopyalayabilirsin.'});
}

const SURUM={
  damga:null,sonKontrol:0,
  async al(){
    if(!/^https?:/.test(location.protocol))return null;
    const u=location.href.split('#')[0].split('?')[0]+'?_v='+Date.now();
    try{let r=await fetch(u,{method:'HEAD',cache:'no-store'});if(!r.ok)r=await fetch(u,{cache:'no-store'});return r.headers.get('ETag')||r.headers.get('Last-Modified')}catch(e){return null}
  },
  async baslat(){
    this.damga=await this.al();
    setInterval(()=>this.kontrol(),120000);
    window.addEventListener('focus',()=>this.kontrol());
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)this.kontrol()});
  },
  async kontrol(elle){
    const n=Date.now();if(!elle&&n-this.sonKontrol<15000)return;this.sonKontrol=n;
    if(!this.damga){if(elle)UI.toast('ℹ️ Sürüm denetimi yalnız sitede (GitHub Pages) çalışır');return}
    const d=await this.al();
    if(d&&d!==this.damga){
      if($('#yeniSurum'))return;
      const b=document.createElement('div');b.id='yeniSurum';
      b.innerHTML='<button style="background:none;color:#fff;font-size:.95rem">🔴 Yeni sürüm yayınlandı · Yenile</button><button style="background:rgba(255,255,255,.2);border-radius:50%;width:1.6rem;height:1.6rem;color:#fff">✕</button>';
      document.body.appendChild(b);
      b.children[0].onclick=()=>{RUN.kaydet&&RUN.kaydet();location.href=location.href.split('#')[0].split('?')[0]+'?_r='+Date.now()};
      b.children[1].onclick=()=>b.remove();
    }else if(elle)UI.toast('✅ En güncel sürümü kullanıyorsun');
  }
};

function sahneBoyutla(){
  const s=$('#sahne');if(!s||$('#oyun').hidden)return;
  const vw=s.clientWidth-8,vh=s.clientHeight-8;if(vw<10||vh<10)return;
  const fit=Math.min(vw/RUN.W,vh/RUN.H);
  const dpr=window.devicePixelRatio||1;
  const SC=Math.max(1,Math.ceil(fit*dpr));
  RUN.fit=fit;RUN.SC=SC;
  if(cv.width!==RUN.W*SC)cv.width=RUN.W*SC;
  if(cv.height!==RUN.H*SC)cv.height=RUN.H*SC;
  cv.style.width=Math.floor(RUN.W*fit)+'px';cv.style.height=Math.floor(RUN.H*fit)+'px';
}

function kontrolKur(g){
  const k=$('#kontrol');k.innerHTML='';
  (g.kontroller||[]).forEach(d=>{
    const b=document.createElement('button');b.className='kd '+(d.cls||'');b.innerHTML=d.et;b.dataset.id=d.id;
    let basili=false;
    const bas=e=>{e.preventDefault();if(basili)return;basili=true;b.classList.add('basili');SFX.init();
      if(d.yon)API.yon(d.yon);try{g.dugme(d.id,true)}catch(er){console.error(er)}};
    const birak=e=>{if(!basili)return;basili=false;b.classList.remove('basili');try{g.dugme(d.id,false)}catch(er){console.error(er)}};
    b.addEventListener('pointerdown',bas);b.addEventListener('pointerup',birak);b.addEventListener('pointerleave',birak);b.addEventListener('pointercancel',birak);
    b.addEventListener('contextmenu',e=>e.preventDefault());
    k.appendChild(b);
  });
  const m=document.createElement('button');m.className='kd gri';m.innerHTML='⏸<small>Mola (P)</small>';m.onclick=duraklatAc;k.appendChild(m);
  const s=document.createElement('button');s.className='kd gri';s.innerHTML='🏠<small>Siteye Dön</small>';s.onclick=siteyeDon;k.appendChild(s);
}

function dongu(t){
  RUN.raf=requestAnimationFrame(dongu);
  const g=RUN.g;if(!g)return;
  let dt=(t-RUN.last)/1000;RUN.last=t;if(!(dt>0))dt=0;if(dt>0.05)dt=0.05;
  try{
    if(!RUN.duraklat&&!UI.acik){g.guncelle(dt);if(RUN.yon)RUN.yon.zaman-=dt}
    ctx.setTransform(RUN.SC,0,0,RUN.SC,0,0);ctx.imageSmoothingEnabled=false;
    g.ciz(ctx);
  }catch(e){
    RUN.hataSay++;console.error(e);
    if(RUN.hataSay===1)UI.toast('⚠️ Küçük bir hata oldu, oyun devam ediyor');
    if(RUN.hataSay>30){RUN.hataSay=0;oyunYenidenBaslat()}
  }
}

cv.addEventListener('pointerup',cvBirak);cv.addEventListener('pointercancel',cvBirak);

const YON_TUS={ArrowLeft:'SOL',KeyA:'SOL',ArrowRight:'SAG',KeyD:'SAG',ArrowUp:'YUKARI',KeyW:'YUKARI',ArrowDown:'ASAGI',KeyS:'ASAGI'};
const basiliTus={};
window.addEventListener('keydown',e=>{
  if(!RUN.g)return;

  if(UI.acik||RUN.duraklat)return;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab'].indexOf(e.code)>=0)e.preventDefault();
  const ilk=!basiliTus[e.code];basiliTus[e.code]=true;
  if(ilk&&YON_TUS[e.code]&&RUN.g.yonAdi)API.yon(RUN.g.yonAdi(YON_TUS[e.code]));
  SFX.init();
  try{RUN.g.tus&&RUN.g.tus(e.code,true,e.repeat)}catch(er){console.error(er)}
});
window.addEventListener('keyup',e=>{basiliTus[e.code]=false;if(!RUN.g)return;try{RUN.g.tus&&RUN.g.tus(e.code,false)}catch(er){console.error(er)}});

/* ---- ortak çizim yardımcıları ---- */
const PARCA={
  yeni(){return []},
  ekle(liste,x,y,o){o=o||{};const n=o.n||8;for(let i=0;i<n;i++){const a=rnd(0,Math.PI*2),h=rnd(o.hmin||40,o.hmax||220);
    liste.push({x,y,vx:Math.cos(a)*h,vy:Math.sin(a)*h-(o.yukari||0),r:rnd(o.rmin||2,o.rmax||5),renk:o.renk?(Array.isArray(o.renk)?pick(o.renk):o.renk):'#fff',
      omur:rnd(o.omin||0.5,o.omax||1.1),t:0,g:o.g==null?400:o.g,tip:o.tip||'daire',don:rnd(-8,8),aci:rnd(0,6.28)})}
    if(liste.length>900)liste.splice(0,liste.length-900)},
  guncelle(liste,dt){for(let i=liste.length-1;i>=0;i--){const p=liste[i];p.t+=dt;if(p.t>=p.omur){liste.splice(i,1);continue}
    p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.aci+=p.don*dt;p.vx*=1-1.2*dt}},
  ciz(c,liste){for(const p of liste){c.globalAlpha=Math.max(0,1-p.t/p.omur);c.fillStyle=p.renk;
    if(p.tip==='ucgen'){c.save();c.translate(p.x,p.y);c.rotate(p.aci);c.beginPath();c.moveTo(0,-p.r*1.6);c.lineTo(p.r*1.4,p.r);c.lineTo(-p.r*1.4,p.r);c.closePath();c.fill();c.restore()}
    else if(p.tip==='kare'){c.save();c.translate(p.x,p.y);c.rotate(p.aci);c.fillRect(-p.r,-p.r,p.r*2,p.r*2);c.restore()}
    else{c.beginPath();c.arc(p.x,p.y,p.r,0,Math.PI*2);c.fill()}}c.globalAlpha=1}
};

/* ==========================================================
   OYUN 1 — YILDIZLI ODA (tuğla kırma)
   Videodan: gece odası, gökkuşağı tuğlalar, mıknatıs / çoklu top
   ========================================================== */
oyunEkle({
  id:'tugla',ad:'Yıldızlı Oda',ikon:'🧱',renk:'linear-gradient(135deg,#312e81,#7c3aed 60%,#f472b6)',
  kisa:'Gökkuşağı tuğlaları kır, güçlendirmeleri yakala!',
  nasil:'Raketi parmağınla sürükle ya da ◀ SOL / SAĞ ▶ düğmeleriyle oynat. Topu ▲ FIRLAT ile at. Düşen kapsülleri yakala: 🟩 geniş raket, 🔴 çoklu top, 🧲 mıknatıs, 🐢 yavaş top, ❤️ can. Altın ❓ tuğla bilgi sorusu sorar; doğru cevap çoklu top kazandırır.',
  W:720,H:540,
  kontroller:[{id:'sol',et:'◀ SOL',cls:'sol',yon:'SOL'},{id:'firla',et:'▲ YUKARI<small>FIRLAT</small>',cls:'yukari',yon:'YUKARI'},{id:'sag',et:'SAĞ ▶',cls:'sag',yon:'SAG'}],
  yonAdi(d){return d==='ASAGI'?null:d},
  FX:160,FW:400,FY:38,PY:500,
  baslat(api){
    this.api=api;const z=api.zi();this.z=z;
    this.can=z===0?5:3;this.asama=1;this.skor=0;this.parca=[];this.guc=[];this.yazilar=[];
    this.raketTemel=[132,112,96,86,78][z];this.hizTemel=[240,280,320,360,400][z];
    this.raket={x:360,w:this.raketTemel};this.genisT=0;this.miknatisT=0;this.yavasT=0;
    this.sol=false;this.sag=false;this.hedefX=null;this.basX=0;this.basili=false;this.soruBekle=false;
    this.dekor();this.asamaKur();this.topHazirla();api.skor(0);this.hud();
  },
  dekor(){
    this.yildiz=[];for(let i=0;i<46;i++){const sol=Math.random()<0.5;this.yildiz.push({x:sol?rnd(6,150):rnd(570,714),y:rnd(8,300),r:rnd(1,2.6),f:rnd(0,6.28)})}
    this.sandikTop=[];const renk=['#ef4444','#f59e0b','#22c55e','#3b82f6','#a855f7','#ec4899'];
    for(let i=0;i<9;i++)this.sandikTop.push({x:58+rnd(-26,26),y:398+rnd(-12,4),r:rnd(7,11),c:pick(renk)});
  },
  hud(){this.api.hud('Aşama '+this.asama+' · '+'❤️'.repeat(Math.min(this.can,7))+(this.miknatisT>0?' · 🧲':'')+(this.genisT>0?' · 🟩':'')+(this.yavasT>0?' · 🐢':''))},
  hiz(){return this.hizTemel*Math.min(1.4,1+0.05*(this.asama-1))*(this.yavasT>0?0.7:1)},
  asamaKur(){
    const z=this.z,kol=z===0?8:10,sat=Math.min(9,(z===0?3:4)+this.asama+(z>=3?1:0));
    const pad=6,bw=(this.FW-pad*2)/kol,bh=z===0?24:19,renk=['#ef4444','#f97316','#facc15','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899','#f43f5e'];
    const desen=(this.asama-1)%4;this.tugla=[];
    for(let r=0;r<sat;r++)for(let c=0;c<kol;c++){
      let var_=true;
      if(desen===1)var_=c>=Math.floor(r/2)&&c<kol-Math.floor(r/2);
      else if(desen===2)var_=(r+c)%2===0||r<2;
      else if(desen===3){const m=(kol-1)/2,dx=Math.abs(c-m),ry=r/(sat-1);var_=ry<0.35?dx>0.6&&dx<m+0.2:dx<=m*(1.15-ry)}
      if(!var_)continue;
      const hp=(z>=2&&this.asama>=2&&r<2)?2:1;
      this.tugla.push({x:this.FX+pad+c*bw,y:this.FY+46+r*(bh+5),w:bw-4,h:bh,hp,hpMax:hp,renk:renk[r%renk.length],altin:false});
    }
    if(this.tugla.length<6){this.tugla=[];for(let c=0;c<kol;c++)this.tugla.push({x:this.FX+pad+c*bw,y:this.FY+60,w:bw-4,h:bh,hp:1,hpMax:1,renk:renk[c%9],altin:false})}
    const a=pick(this.tugla);a.altin=true;a.hp=1;a.hpMax=1;
    if(this.asama>=3){const b=pick(this.tugla);if(b!==a){b.altin=true;b.hp=1;b.hpMax=1}}
  },
  topHazirla(){this.toplar=[{x:this.raket.x,y:this.PY-8,vx:0,vy:0,r:7,yapisik:true,ofs:0,iz:[]}];this.hud()},
  firlat(){
    let f=false;for(const b of this.toplar)if(b.yapisik){b.yapisik=false;const a=rnd(-0.35,0.35),s=this.hiz();b.vx=Math.sin(a)*s;b.vy=-Math.cos(a)*s;f=true}
    if(f)this.api.sfx('zip');
  },
  dugme(id,b){if(id==='sol')this.sol=b;else if(id==='sag')this.sag=b;else if(id==='firla'&&b)this.firlat()},
  tus(k,b){if(k==='ArrowLeft'||k==='KeyA')this.sol=b;else if(k==='ArrowRight'||k==='KeyD')this.sag=b;else if(b&&(k==='Space'||k==='ArrowUp'||k==='KeyW'||k==='Enter'))this.firlat()},
  isaret(t,x,y,e){
    if(t==='bas'){this.basili=true;this.basX=x;this.hedefX=x}
    else if(t==='hareket'){if(this.basili||(e&&e.pointerType==='mouse'))this.hedefX=x}
    else if(t==='birak'){if(this.basili&&Math.abs(x-this.basX)<16)this.firlat();this.basili=false;if(!(e&&e.pointerType==='mouse'))this.hedefX=null}
  },
  gucVer(tip){
    const a=this.api;a.sfx('guc');
    if(tip==='genis'){this.genisT=12;a.toast('🟩 Geniş raket!')}
    else if(tip==='miknatis'){this.miknatisT=12;a.toast('🧲 Mıknatıs: top rakete yapışır, dokunup fırlat')}
    else if(tip==='yavas'){this.yavasT=10;this.hizYenile();a.toast('🐢 Yavaş top')}
    else if(tip==='can'){this.can=Math.min(7,this.can+1);a.toast('❤️ +1 can')}
    else if(tip==='coklu'){this.coklu();a.toast('🔴 Çoklu top!')}
    this.hud();
  },
  hizYenile(){const s=this.hiz();for(const b of this.toplar){if(b.yapisik)continue;const m=Math.hypot(b.vx,b.vy)||1;b.vx=b.vx/m*s;b.vy=b.vy/m*s}},
  coklu(){
    const s=this.hiz();const yeni=[];
    for(const b of this.toplar){
      if(b.yapisik){b.yapisik=false;b.vx=0;b.vy=-s}
      for(const d of [-0.4,0.4]){if(this.toplar.length+yeni.length>=9)break;const a=Math.atan2(b.vx,-b.vy)+d;yeni.push({x:b.x,y:b.y,vx:Math.sin(a)*s,vy:-Math.abs(Math.cos(a)*s),r:7,yapisik:false,ofs:0,iz:[]})}
    }
    this.toplar.push(...yeni);
  },
  guncelle(dt){
    const a=this.api,R=this.raket;
    if(this.genisT>0){this.genisT-=dt;if(this.genisT<=0)this.hud()}
    if(this.miknatisT>0){this.miknatisT-=dt;if(this.miknatisT<=0){this.hud();this.firlat()}}
    if(this.yavasT>0){this.yavasT-=dt;if(this.yavasT<=0){this.hizYenile();this.hud()}}
    const hedefW=this.raketTemel*(this.genisT>0?1.6:1);R.w+=(hedefW-R.w)*Math.min(1,dt*8);
    if(this.sol)R.x-=560*dt;if(this.sag)R.x+=560*dt;
    if(this.hedefX!=null&&!this.sol&&!this.sag)R.x+=(this.hedefX-R.x)*Math.min(1,dt*22);
    R.x=clamp(R.x,this.FX+R.w/2,this.FX+this.FW-R.w/2);
    // toplar
    for(let i=this.toplar.length-1;i>=0;i--){
      const b=this.toplar[i];
      if(b.yapisik){b.x=R.x+b.ofs;b.y=this.PY-b.r-1;continue}
      const sp=Math.hypot(b.vx,b.vy),adim=Math.max(1,Math.ceil(sp*dt/3));
      for(let s=0;s<adim;s++){
        b.x+=b.vx*dt/adim;b.y+=b.vy*dt/adim;
        if(b.x-b.r<this.FX){b.x=this.FX+b.r;b.vx=Math.abs(b.vx);a.sfx('sek',0.8)}
        if(b.x+b.r>this.FX+this.FW){b.x=this.FX+this.FW-b.r;b.vx=-Math.abs(b.vx);a.sfx('sek',0.8)}
        if(b.y-b.r<this.FY){b.y=this.FY+b.r;b.vy=Math.abs(b.vy);a.sfx('sek',0.8)}
        // raket
        if(b.vy>0&&b.y+b.r>=this.PY&&b.y+b.r<=this.PY+16&&b.x>=R.x-R.w/2-b.r&&b.x<=R.x+R.w/2+b.r){
          const o=clamp((b.x-R.x)/(R.w/2),-1,1),ang=o*1.05,s2=this.hiz();
          b.vx=Math.sin(ang)*s2;b.vy=-Math.cos(ang)*s2;b.y=this.PY-b.r;a.sfx('sek',1.2);
          if(this.miknatisT>0){b.yapisik=true;b.ofs=b.x-R.x}
          break;
        }
        // tuğla
        let vurdu=false;
        for(let j=0;j<this.tugla.length;j++){
          const t=this.tugla[j];
          const cx=clamp(b.x,t.x,t.x+t.w),cy=clamp(b.y,t.y,t.y+t.h);
          const dx=b.x-cx,dy=b.y-cy;if(dx*dx+dy*dy>b.r*b.r)continue;
          const ox=Math.min(b.x+b.r-t.x,t.x+t.w-(b.x-b.r)),oy=Math.min(b.y+b.r-t.y,t.y+t.h-(b.y-b.r));
          if(ox<oy){b.vx=b.x<t.x+t.w/2?-Math.abs(b.vx):Math.abs(b.vx);b.x+=b.x<t.x+t.w/2?-ox:ox}
          else{b.vy=b.y<t.y+t.h/2?-Math.abs(b.vy):Math.abs(b.vy);b.y+=b.y<t.y+t.h/2?-oy:oy}
          this.vur(t,j);vurdu=true;break;
        }
        if(vurdu)break;
      }
      // çok yatay gitmesin
      const s3=Math.hypot(b.vx,b.vy)||1;if(Math.abs(b.vy)<s3*0.28){b.vy=(b.vy<0?-1:1)*s3*0.28;const k=Math.sqrt(Math.max(0,s3*s3-b.vy*b.vy));b.vx=(b.vx<0?-1:1)*k}
      b.iz.push({x:b.x,y:b.y});if(b.iz.length>6)b.iz.shift();
      if(b.y-b.r>this.H)this.toplar.splice(i,1);
      if(this.soruBekle)break;
    }
    if(this.soruBekle){
      this.soruBekle=false;
      a.soru(d=>{if(d){this.skor+=50;a.skor(this.skor);this.coklu();a.toast('🎉 Doğru! +50 ve çoklu top')}else a.toast('💪 Olsun, oyun devam!')},'Altın tuğla sorusu');
      return;
    }
    if(!this.toplar.length){
      this.can--;a.sfx('kayip');
      if(this.can<=0){this.can=0;this.hud();a.bitir({baslik:'Oyun bitti 🌙',mesaj:'Aşama '+this.asama+'\'e kadar geldin!'});return}
      a.toast('💔 Top düştü — kalan can: '+this.can);this.topHazirla();
    }
    // güçlendirmeler
    for(let i=this.guc.length-1;i>=0;i--){
      const g=this.guc[i];g.y+=130*dt;g.f+=dt*4;
      if(g.y+12>=this.PY&&g.y-12<=this.PY+12&&Math.abs(g.x-R.x)<R.w/2+12){this.gucVer(g.tip);this.guc.splice(i,1);continue}
      if(g.y>this.H+20)this.guc.splice(i,1);
    }
    PARCA.guncelle(this.parca,dt);
    for(let i=this.yazilar.length-1;i>=0;i--){const y=this.yazilar[i];y.t+=dt;y.y-=30*dt;if(y.t>1)this.yazilar.splice(i,1)}
    if(!this.tugla.length){
      this.asama++;this.skor+=100*this.asama;a.skor(this.skor);a.sfx('kazan');a.toast('🌟 Aşama '+this.asama+'! +'+(100*this.asama));
      this.guc=[];this.asamaKur();this.topHazirla();
    }
  },
  vur(t,j){
    const a=this.api;t.hp--;
    if(t.hp>0){a.sfx('sek',1.5);return}
    this.tugla.splice(j,1);
    this.skor+=10*(this.z+1);a.skor(this.skor);a.sfx('kir',rnd(0.8,1.3));
    PARCA.ekle(this.parca,t.x+t.w/2,t.y+t.h/2,{n:10,renk:t.altin?'#fde047':t.renk,tip:'kare',rmin:2,rmax:4,hmax:180});
    this.yazilar.push({x:t.x+t.w/2,y:t.y,t:0,s:'+'+10*(this.z+1)});
    if(t.altin){this.soruBekle=true;return}
    if(Math.random()<0.15){const tip=pick(['genis','coklu','miknatis','yavas','genis','coklu',this.can<3?'can':'miknatis']);this.guc.push({x:t.x+t.w/2,y:t.y+t.h/2,tip,f:0})}
  },
  ciz(c){
    const W=this.W,H=this.H;
    // oda arka planı
    let g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#33246e');g.addColorStop(1,'#1a1240');c.fillStyle=g;c.fillRect(0,0,W,H);
    const t=performance.now()/1000;
    for(const s of this.yildiz){c.globalAlpha=0.5+0.5*Math.sin(t*2+s.f);c.fillStyle='#fff8d6';c.beginPath();c.arc(s.x,s.y,s.r,0,6.28);c.fill()}
    c.globalAlpha=1;
    // sol: ay + raf + sandık
    c.fillStyle='#fde68a';c.beginPath();c.arc(70,70,24,0,6.28);c.fill();c.fillStyle='#33246e';c.beginPath();c.arc(80,62,22,0,6.28);c.fill();
    c.fillStyle='#4c3a8a';c.fillRect(0,430,160,110);c.fillStyle='#5b4a9e';c.fillRect(0,425,160,10);
    c.fillStyle='#8b5a2b';yuvarlakDikdortgen(c,22,392,72,40,6);c.fill();c.fillStyle='#a8723a';c.fillRect(22,404,72,6);
    c.fillStyle='#facc15';c.fillRect(54,402,8,14);
    for(const b of this.sandikTop){c.fillStyle=b.c;c.beginPath();c.arc(b.x,b.y,b.r,0,6.28);c.fill();c.fillStyle='rgba(255,255,255,.45)';c.beginPath();c.arc(b.x-b.r*0.3,b.y-b.r*0.35,b.r*0.3,0,6.28);c.fill()}
    c.fillStyle='#6b4f9e';for(let i=0;i<4;i++){c.fillRect(110+i*11,370-i*6,9,58+i*6)}
    // sağ: masa lambası

oyunEkle({
  id:'fisek',ad:'Havai Fişek Gösterisi',ikon:'🎆',renk:'linear-gradient(135deg,#0f172a,#7c3aed 55%,#f43f5e)',
  kisa:'Gökyüzüne dokun, rengârenk havai fişekler patlat!',
  nasil:'Gökyüzünde nereye dokunursan fişek oraya uçup patlar. Parmağını sürüklersen maytap gibi ışık çizersin. 🎨 ŞEKİL ile kalp, yıldız, halka, gülen yüz seç; 🌈 GÖSTERİ ile 10 fişeklik gösteri başlat. Küçükler için fişekler sesli sayılır!',
  W:720,H:540,
  kontroller:[{id:'at',et:'🎆 FIRLAT',cls:'ana'},{id:'sekil',et:'🎨 ŞEKİL'},{id:'gosteri',et:'🌈 GÖSTERİ'}],
  SEKIL:['daire','kalp','yildiz','halka','gulen','karisik'],
  SEKIL_AD:{daire:'Daire',kalp:'Kalp',yildiz:'Yıldız',halka:'Halka',gulen:'Gülen yüz',karisik:'Karışık'},
  RENK:['#f43f5e','#fb923c','#facc15','#4ade80','#22d3ee','#60a5fa','#a78bfa','#f472b6','#ffffff'],
  baslat(api){this.api=api;this.z=api.zi();this.skor=0;this.roket=[];this.kivilcim=[];this.iz=[];this.sekil=5;this.kuyruk=[];this.sayac=0;
    this.yildiz=[];for(let i=0;i<90;i++)this.yildiz.push({x:rnd(0,720),y:rnd(0,380),r:rnd(0.6,1.8),f:rnd(0,6.28)});
    this.binalar=[];let x=0;while(x<720){const w=rnd(40,90);this.binalar.push({x,w,h:rnd(50,150),pencere:Math.random()});x+=w+rnd(2,8)}
    api.skor(0);this.hud()},
  hud(){this.api.hud('Şekil: '+this.SEKIL_AD[this.SEKIL[this.sekil]]+' · '+this.sayac+' fişek')},
  firlat(x,y){
    x=x==null?rnd(120,600):x;y=y==null?rnd(70,260):Math.min(y,360);
    this.roket.push({x:clamp(x+rnd(-60,60),40,680),y:this.H-60,hx:x,hy:y,t:0,sure:rnd(0.75,1.05),renk:pick(this.RENK),sekil:this.SEKIL[this.sekil]==='karisik'?pick(['daire','kalp','yildiz','halka','gulen']):this.SEKIL[this.sekil]});
    this.roket[this.roket.length-1].sx=this.roket[this.roket.length-1].x;
    this.api.sfx('firla');
  },
  patla(r){
    const n=r.sekil==='daire'?70:60,renk=r.renk,r2=pick(this.RENK);
    const ekle=(vx,vy,rk)=>this.kivilcim.push({x:r.hx,y:r.hy,px:r.hx,py:r.hy,vx,vy,renk:rk,t:0,omur:rnd(1.2,1.8)});
    if(r.sekil==='daire'){for(let i=0;i<n;i++){const a=rnd(0,6.28),h=rnd(60,230);ekle(Math.cos(a)*h,Math.sin(a)*h,Math.random()<0.7?renk:r2)}}
    else if(r.sekil==='halka'){for(let i=0;i<n;i++){const a=i/n*6.28;ekle(Math.cos(a)*200,Math.sin(a)*200,renk)}for(let i=0;i<30;i++){const a=i/30*6.28;ekle(Math.cos(a)*100,Math.sin(a)*100,r2)}}
    else if(r.sekil==='kalp'){for(let i=0;i<n;i++){const t=i/n*6.28,x=16*Math.pow(Math.sin(t),3),y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));ekle(x*12,y*12,i%3?'#f472b6':renk)}}
    else if(r.sekil==='yildiz'){for(let i=0;i<n;i++){const k=Math.floor(i/(n/10)),f=(i%(n/10))/(n/10),a1=k*Math.PI/5-Math.PI/2,a2=(k+1)*Math.PI/5-Math.PI/2,r1=k%2?90:210,r3=k%2?210:90;
      const x=lerp(Math.cos(a1)*r1,Math.cos(a2)*r3,f),y=lerp(Math.sin(a1)*r1,Math.sin(a2)*r3,f);ekle(x,y,'#fde047')}}
    else if(r.sekil==='gulen'){for(let i=0;i<40;i++){const a=i/40*6.28;ekle(Math.cos(a)*200,Math.sin(a)*200,'#facc15')}
      for(const ex of [-70,70])for(let i=0;i<8;i++){const a=i/8*6.28;ekle(ex+Math.cos(a)*16,-60+Math.sin(a)*16,'#fff')}
      for(let i=0;i<16;i++){const a=0.3+i/15*(Math.PI-0.6);ekle(Math.cos(a)*120,20+Math.sin(a)*90,'#fb923c')}}
    if(this.kivilcim.length>1400)this.kivilcim.splice(0,this.kivilcim.length-1400);
    this.api.sfx('fisek');this.sayac++;this.skor+=5;this.api.skor(this.skor);this.hud();
    if(this.z<=1&&this.sayac<=20)this.api.konus(String(this.sayac));
    if(this.sayac%15===0)this.api.toast('🧪 Havai fişeklerde renkleri metal tuzları verir: stronsiyum kırmızı, bakır mavi, baryum yeşil renk oluşturur.',6000);
  },
  dugme(id,b){if(!b)return;if(id==='at')this.firlat();else if(id==='sekil'){this.sekil=(this.sekil+1)%this.SEKIL.length;this.hud();this.api.sfx('tik');this.api.toast('🎨 '+this.SEKIL_AD[this.SEKIL[this.sekil]])}
    else if(id==='gosteri'){for(let i=0;i<10;i++)this.kuyruk.push(i*0.45);this.api.toast('🌈 Gösteri başlıyor!')}},
  tus(k,b,tekrar){if(!b||tekrar)return;if(k==='Space'||k==='Enter'||k==='ArrowUp')this.firlat();else if(k==='KeyS'||k==='ArrowRight'||k==='ArrowLeft')this.dugme('sekil',true);else if(k==='KeyG')this.dugme('gosteri',true)},
  isaret(t,x,y){
    if(t==='bas'){this.basili={x,y,t:performance.now(),yol:0}}
    else if(t==='hareket'&&this.basili){const d=Math.hypot(x-this.basili.x,y-this.basili.y);this.basili.yol+=d;this.basili.x=x;this.basili.y=y;
      if(this.basili.yol>20){for(let i=0;i<3;i++)this.iz.push({x:x+rnd(-4,4),y:y+rnd(-4,4),vx:rnd(-40,40),vy:rnd(-40,40),t:0,renk:pick(this.RENK)});if(this.iz.length>500)this.iz.splice(0,this.iz.length-500)}}
    else if(t==='birak'&&this.basili){if(this.basili.yol<20)this.firlat(x,y);this.basili=null}
  },
  guncelle(dt){
    for(let i=this.kuyruk.length-1;i>=0;i--){this.kuyruk[i]-=dt;if(this.kuyruk[i]<=0){this.kuyruk.splice(i,1);this.firlat()}}
    for(let i=this.roket.length-1;i>=0;i--){const r=this.roket[i];r.t+=dt;const f=Math.min(1,r.t/r.sure),e=1-Math.pow(1-f,2);r.x=lerp(r.sx,r.hx,e);r.y=lerp(this.H-60,r.hy,e);
      this.iz.push({x:r.x+rnd(-2,2),y:r.y+6,vx:rnd(-15,15),vy:rnd(20,60),t:0,renk:'#fde68a'});if(f>=1){this.patla(r);this.roket.splice(i,1)}}
    for(let i=this.kivilcim.length-1;i>=0;i--){const p=this.kivilcim[i];p.t+=dt;if(p.t>p.omur){this.kivilcim.splice(i,1);continue}p.px=p.x;p.py=p.y;p.vx*=Math.exp(-1.6*dt);p.vy=p.vy*Math.exp(-1.6*dt)+70*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}
    for(let i=this.iz.length-1;i>=0;i--){const p=this.iz[i];p.t+=dt;if(p.t>0.6){this.iz.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt}
  },
  ciz(c){
    const W=this.W,H=this.H,tt=performance.now()/1000;
    const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#020617');g.addColorStop(0.7,'#1e1b4b');g.addColorStop(1,'#4c1d95');c.fillStyle=g;c.fillRect(0,0,W,H);
    for(const s of this.yildiz){c.globalAlpha=0.4+0.4*Math.sin(tt*1.5+s.f);c.fillStyle='#fff';c.fillRect(s.x,s.y,s.r,s.r)}c.globalAlpha=1;
    c.fillStyle='#fef9c3';c.beginPath();c.arc(620,70,26,0,6.28);c.fill();c.fillStyle='#020617';c.beginPath();c.arc(632,62,24,0,6.28);c.fill();
    c.globalCompositeOperation='lighter';
    for(const p of this.kivilcim){const a=Math.max(0,1-p.t/p.omur);c.strokeStyle=p.renk;c.globalAlpha=a;c.lineWidth=2.4;c.beginPath();c.moveTo(p.px,p.py);c.lineTo(p.x,p.y);c.stroke();
      if(p.t>p.omur*0.6&&Math.random()<0.3){c.fillStyle='#fff';c.fillRect(p.x,p.y,1.5,1.5)}}
    for(const p of this.iz){c.globalAlpha=Math.max(0,1-p.t/0.6);c.fillStyle=p.renk;c.beginPath();c.arc(p.x,p.y,2,0,6.28);c.fill()}
    for(const r of this.roket){c.globalAlpha=1;c.fillStyle='#fff';c.beginPath();c.arc(r.x,r.y,3,0,6.28);c.fill()}
    c.globalAlpha=1;c.globalCompositeOperation='source-over';
    // şehir
    for(const b of this.binalar){c.fillStyle='#0b1023';c.fillRect(b.x,H-b.h,b.w,b.h);
      for(let yy=H-b.h+10;yy<H-10;yy+=16)for(let xx=b.x+6;xx<b.x+b.w-8;xx+=12){if(((xx*7+yy*13)%10)/10<b.pencere*0.6){c.fillStyle='rgba(253,224,71,.55)';c.fillRect(xx,yy,5,7)}}}
    if(this.sayac===0)yazi(c,'Gökyüzüne dokun!',W/2,H/2,34,'#fde68a','center',900,true,LOGOFONT);
    yazi(c,'🎆 '+this.sayac,60,30,22,'#fde68a','center',900,false);
  }
});

/* ==========================================================
   OYUN 9 — NEFES BALONU (sakinleşme)
   ========================================================== */
oyunEkle({
  id:'nefes',ad:'Nefes Balonu',ikon:'🎈',renk:'linear-gradient(135deg,#99f6e4,#93c5fd 55%,#c4b5fd)',
  kisa:'Balonla birlikte yavaşça nefes al, ver… sakinleş.',
  nasil:'▶ BAŞLA\'ya bas. Balon büyürken burnundan yavaşça nefes al, durunca nefesini tut, küçülürken ağzından yavaşça ver. 5 tur yap. Yavaş ve düzenli nefes almak, birçok kişinin daha sakin hissetmesine yardımcı olabilir.',
  W:720,H:540,
  kontroller:[{id:'basla',et:'▶ BAŞLA / DURDUR',cls:'ana'},{id:'tur',et:'🔢 TUR SAYISI'},{id:'sesli',et:'🗣️ SESLİ REHBER'}],
  baslat(api){this.api=api;this.z=api.zi();this.skor=0;this.calisiyor=false;this.evre=0;this.t=0;this.tur=0;this.hedefTur=5;this.sesli=LS.get('mola_nefes_sesli','1')!=='0';this.r=70;
    this.sure=this.z===0?[3,2,4]:this.z===1?[4,2,5]:[4,4,6];
    this.bulut=[];for(let i=0;i<6;i++)this.bulut.push({x:rnd(0,720),y:rnd(30,200),s:rnd(0.6,1.2),v:rnd(5,12)});
    this.kus=[];api.skor(0);this.hud()},
  EVRE:['Burnundan nefes al…','Nefesini tut…','Ağzından yavaşça ver…'],
  hud(){this.api.hud(this.calisiyor?('Tur '+(this.tur+1)+'/'+this.hedefTur+' · '+this.EVRE[this.evre]):'Hazır olunca ▶ BAŞLA · '+this.hedefTur+' tur · '+this.sure.join('-')+' saniye')},
  dugme(id,b){if(!b)return;
    if(id==='basla'){this.calisiyor=!this.calisiyor;if(this.calisiyor){this.evre=0;this.t=0;this.tur=0;this.soyle()}else{try{speechSynthesis.cancel()}catch(e){}}this.hud()}
    else if(id==='tur'){this.hedefTur=this.hedefTur===3?5:this.hedefTur===5?8:3;this.api.toast('🔢 '+this.hedefTur+' tur');this.hud()}
    else if(id==='sesli'){this.sesli=!this.sesli;LS.set('mola_nefes_sesli',this.sesli?'1':'0');this.api.toast('🗣️ Sesli rehber: '+(this.sesli?'Açık':'Kapalı'))}},
  tus(k,b,tekrar){if(b&&!tekrar&&(k==='Space'||k==='Enter'))this.dugme('basla',true)},
  isaret(t){if(t==='bas'&&!this.calisiyor)this.dugme('basla',true)},
  soyle(){if(this.sesli)this.api.konus(['Nefes al','Tut','Yavaşça ver'][this.evre]);SFX.cal('tik')},
  guncelle(dt){
    for(const b of this.bulut){b.x+=b.v*dt;if(b.x>780)b.x=-100}
    if(!this.calisiyor){this.r+=(70+Math.sin(performance.now()/900)*6-this.r)*Math.min(1,dt*3);return}
    this.t+=dt;const S=this.sure[this.evre];
    const f=Math.min(1,this.t/S),kolay=0.5-0.5*Math.cos(f*Math.PI);
    if(this.evre===0)this.r=70+120*kolay;else if(this.evre===1)this.r=190+Math.sin(this.t*6)*2;else this.r=190-120*kolay;
    if(this.t>=S){this.t=0;this.evre++;
      if(this.evre>2){this.evre=0;this.tur++;this.skor+=10;this.api.skor(this.skor);
        if(this.tur>=this.hedefTur){this.calisiyor=false;this.hud();this.api.sfx('kazan');
          this.api.bilgi('🌈 Harika iş çıkardın!',this.hedefTur+' tur yavaş nefes aldın. Kendini nasıl hissediyorsun? Yavaş nefes, birçok kişinin daha sakin hissetmesine yardımcı olabilir.',()=>{});return}}
      this.soyle();this.hud()}
  },
  ciz(c){
    const W=this.W,H=this.H;
    const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#bae6fd');g.addColorStop(1,'#e9d5ff');c.fillStyle=g;c.fillRect(0,0,W,H);
    c.fillStyle='rgba(255,255,255,.85)';for(const b of this.bulut){c.beginPath();c.arc(b.x,b.y,22*b.s,0,6.28);c.arc(b.x+26*b.s,b.y-10*b.s,28*b.s,0,6.28);c.arc(b.x+54*b.s,b.y,20*b.s,0,6.28);c.fill()}
    c.fillStyle='#86efac';c.beginPath();c.moveTo(0,H);c.lineTo(0,480);c.quadraticCurveTo(360,430,720,480);c.lineTo(720,H);c.fill();
    const cx=360,cy=260,r=this.r;
    // ip
    c.strokeStyle='#64748b';c.lineWidth=2;c.beginPath();c.moveTo(cx,cy+r*1.1);c.quadraticCurveTo(cx+20,cy+r*1.1+60,cx,H-60);c.stroke();
    const renk=['#fb7185','#fbbf24','#34d399'][this.calisiyor?this.evre:0];
    const bg=c.createRadialGradient(cx-r*0.35,cy-r*0.45,r*0.1,cx,cy,r*1.1);bg.addColorStop(0,'#fff');bg.addColorStop(0.35,renk);bg.addColorStop(1,renk);
    c.fillStyle=bg;c.beginPath();c.ellipse(cx,cy,r,r*1.1,0,0,6.28);c.fill();
    c.fillStyle=renk;c.beginPath();c.moveTo(cx-8,cy+r*1.1+8);c.lineTo(cx+8,cy+r*1.1+8);c.lineTo(cx,cy+r*1.1-4);c.fill();
    c.fillStyle='rgba(255,255,255,.55)';c.beginPath();c.ellipse(cx-r*0.4,cy-r*0.5,r*0.16,r*0.26,-0.5,0,6.28);c.fill();
    // yüz
    c.fillStyle='#1f2937';c.beginPath();c.arc(cx-r*0.25,cy-r*0.05,Math.max(2,r*0.05),0,6.28);c.arc(cx+r*0.25,cy-r*0.05,Math.max(2,r*0.05),0,6.28);c.fill();
    c.strokeStyle='#1f2937';c.lineWidth=Math.max(2,r*0.03);c.beginPath();c.arc(cx,cy+r*0.12,r*0.2,0.2,Math.PI-0.2);c.stroke();
    if(this.calisiyor){
      yazi(c,this.EVRE[this.evre],cx,60,32,'#1e3a8a','center',900,false);
      const kalan=Math.ceil(this.sure[this.evre]-this.t);yazi(c,String(kalan),cx,cy,Math.max(30,r*0.5),'rgba(255,255,255,.9)','center',900,true);
      for(let i=0;i<this.hedefTur;i++){c.fillStyle=i<this.tur?'#22c55e':'rgba(30,58,138,.25)';c.beginPath();c.arc(cx-(this.hedefTur-1)*14+i*28,H-30,9,0,6.28);c.fill()}
    }else{yazi(c,'Hazır olunca ▶ BAŞLA',cx,60,30,'#1e3a8a','center',900,false);yazi(c,'Al '+this.sure[0]+' sn · Tut '+this.sure[1]+' sn · Ver '+this.sure[2]+' sn',cx,98,20,'#334155','center',800,false)}
  }
});
