<style>
:root{--olcek:1;--tur:#f57c00;--tur2:#ffb74d;--koyu:#3e2723;--kagit:#fffdf7;--masa1:#f4efe6;--masa2:#e9e1d3;--yesil:#2e9d4b;--kirmizi:#e53935;--mavi:#1e78d6;--turuncu:#ef7d00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(16px * var(--olcek))}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:'Nunito',system-ui,'Segoe UI',Arial,sans-serif;font-weight:800;color:var(--koyu);font-variant-numeric:lining-nums tabular-nums;
 background:radial-gradient(120% 90% at 30% 10%,#fbf8f2 0%,var(--masa1) 45%,var(--masa2) 100%);user-select:none;-webkit-user-select:none;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
 background:repeating-linear-gradient(90deg,rgba(120,90,50,.035) 0 2px,transparent 2px 9px),repeating-linear-gradient(0deg,rgba(255,255,255,.4) 0 1px,transparent 1px 13px)}
button{font-family:inherit;font-weight:900;color:inherit;cursor:pointer;border:0}
.gizli{display:none!important}
.ekran{position:fixed;inset:0;display:flex;flex-direction:column;padding:max(.6rem,env(safe-area-inset-top)) max(.8rem,env(safe-area-inset-right)) max(.6rem,env(safe-area-inset-bottom)) max(.8rem,env(safe-area-inset-left))}
.logo{font-family:'Fredoka','Nunito',sans-serif;font-weight:700;letter-spacing:.5px}

/* ---------- KALEM ---------- */
.kalem{position:absolute;left:50%;top:50%;aspect-ratio:100/16;transform:translate(-50%,-50%) rotate(var(--a,0deg));transition:transform .28s cubic-bezier(.3,1.4,.5,1);filter:drop-shadow(.06rem .16rem .12rem rgba(60,40,20,.28));pointer-events:none}
.kalem svg{width:100%;height:100%;display:block;overflow:visible}
.kalem.hop{animation:hop .5s ease both}
@keyframes hop{0%,100%{translate:0 0}45%{translate:0 -18%}}

/* ---------- DESEN IZGARASI ---------- */
.izgara{display:grid;position:relative;margin:auto}
.slot{position:relative}

<script>
/* ======================================================================
   KALEM USTASI · DESEN ATÖLYESİ  —  ZİRVE oyun kurallarıyla
   ====================================================================== */
const APP={ad:'Kalem Ustası',surum:'1.1',tarih:'2026-11-03',satir:1009,kb:162,onceki:{surum:'1.0',satir:886,kb:148},
 yenilikler:['YENİ ⚡ Renk-Sayı Hızı modu: ekranın rengi + sayı → o renk kalemi o sıraya koy (tepki süresi, seri, dikkat tuzağı)','YENİ Sınıf Masası’nda ⚡ Renk-Sayı turu: gerçek nesnelerle sınıfça oynanır','Videodaki kalem deseni kopyalama etkinliği oyunlaştırıldı','9 oyun modu: Kopyala, Hafıza, Ayna, Döndür, Farkı Bul, Sıradaki, Kavram Avı, Sınıf Masası, İki Kişilik','Kalem Kutusu koleksiyonu + kalem orkestrası kutlaması','ZİRVE: öğrenci girişi, öğretmen paneli (2026), çocuk boyu, Siteye Dön, PWA ikonu']};
const SITE_URL=window.ZIRVE_SITE_URL||'https://baris-ogretmen.github.io/site-1/';
const LS={g(k,v){try{const x=localStorage.getItem(k);return x===null?v:JSON.parse(x)}catch(e){return v}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
 gr(k){try{return localStorage.getItem(k)}catch(e){return null}},sr(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
const karistir=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};

const RENK=[{ad:'Kırmızı',h:'#e53935',k:'#b71c1c',a:'#ff8a80'},{ad:'Mavi',h:'#1e88e5',k:'#0d47a1',a:'#82b1ff'},{ad:'Sarı',h:'#fdd835',k:'#f9a825',a:'#fff59d'},{ad:'Yeşil',h:'#43a047',k:'#1b5e20',a:'#a5d6a7'},
 {ad:'Turuncu',h:'#fb8c00',k:'#e65100',a:'#ffcc80'},{ad:'Mor',h:'#8e24aa',k:'#4a148c',a:'#ce93d8'},{ad:'Pembe',h:'#ec407a',k:'#ad1457',a:'#f8bbd0'},{ad:'Kahverengi',h:'#8d6e63',k:'#4e342e',a:'#d7ccc8'}];
// yön: 0 sağ, 1 sağ-yukarı, 2 yukarı, 3 sol-yukarı, 4 sol, 5 sol-aşağı, 6 aşağı, 7 sağ-aşağı
const YON=[{ad:'SAĞ',y:'sağa',renk:'#e53935'},{ad:'SAĞ-YUKARI çapraz',y:'sağ yukarı çapraza',renk:'#7e57c2'},{ad:'YUKARI',y:'yukarı',renk:'#2e9d4b'},{ad:'SOL-YUKARI çapraz',y:'sol yukarı çapraza',renk:'#7e57c2'},
 {ad:'SOL',y:'sola',renk:'#1e78d6'},{ad:'SOL-AŞAĞI çapraz',y:'sol aşağı çapraza',renk:'#7e57c2'},{ad:'AŞAĞI',y:'aşağı',renk:'#ef7d00'},{ad:'SAĞ-AŞAĞI çapraz',y:'sağ aşağı çapraza',renk:'#7e57c2'}];
const SINIFLAR=[{k:'ana',ad:'Anaokulu'},{k:'12',ad:'1–2. sınıf'},{k:'34',ad:'3–4. sınıf'},{k:'56',ad:'5–6. sınıf'},{k:'78',ad:'7–8. sınıf'}];
const SIRA=['ana','12','34','56','78'];
const sinifNo=()=>SIRA.indexOf(S.sinif);
const renkSayisi=()=>[4,5,6,7,8][sinifNo()];

const S={sinif:LS.gr('zirve_oyun_sinif')||null,mod:null,lvl:{},yildiz:LS.g('ku_yildiz',0),ses:LS.g('ku_ses',true),
 hedefL:null,amac:{},yer:{},tepsi:[],secTepsi:null,secili:null,imlec:0,kilit:false,ipucuS:0,hataS:0,cozuldu:false,faz:null};
S.lvl=LS.g('ku_lvl',{});

/* ---------------- KALEM SVG ---------------- */
let kid=0;
function kalemSVG(ci,uzunluk){
 const r=RENK[ci],u=uzunluk||1,x0=100-100*u+1,g='g'+(kid++);
 return `<svg viewBox="0 0 100 16" preserveAspectRatio="none"><defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${r.a}"/><stop offset=".38" stop-color="${r.h}"/><stop offset=".62" stop-color="${r.h}"/><stop offset="1" stop-color="${r.k}"/></linearGradient></defs>
 <rect x="${x0}" y="1" width="${74-x0}" height="14" rx="1.2" fill="url(#${g})"/>
 <rect x="${x0}" y="5.3" width="${74-x0}" height=".5" fill="rgba(0,0,0,.18)"/><rect x="${x0}" y="10.3" width="${74-x0}" height=".5" fill="rgba(0,0,0,.18)"/>
 <rect x="${x0-1.3}" y="1.6" width="2.6" height="12.8" rx="1" fill="${r.k}"/>
 <path d="M74 1 Q76.5 3.5 74 6 Q76.5 8 74 10 Q76.5 12.5 74 15 L91 10.2 L91 5.8 Z" fill="#f2cf9b"/>
 <path d="M74 1 L91 5.8 L91 7 L76 3.2 Z" fill="#fbe3bd"/><path d="M74 15 L91 10.2 L91 9.2 L76 13 Z" fill="#dcb07a"/>
 <path d="M89.6 5.4 L99 8 L89.6 10.6 Z" fill="${r.h}"/><path d="M89.6 5.4 L99 8 L91 7.2 Z" fill="${r.a}" opacity=".8"/>
 <text x="${Math.max(x0+3,20)}" y="9.6" font-size="4.3" font-family="Nunito,Arial" font-weight="900" fill="rgba(255,255,255,.55)">${uzunluk&&uzunluk<.8?'':'ZİRVE'}</text></svg>`;
}
function kalemEl(ci,d,uz){const e=document.createElement('div');e.className='kalem';e.style.setProperty('--a',(-d*45)+'deg');e.innerHTML=kalemSVG(ci,uz);return e}

/* ---------------- IZGARA ---------------- */
// L = {R,C,cw,ch,hucre:[{r,c,col,d,uz}]}
function izgaraCiz(el,L,opt={}){
 el.innerHTML='';el._L=L;
 el.style.gridTemplateColumns=`repeat(${L.C},1fr)`;el.style.gridTemplateRows=`repeat(${L.R},1fr)`;
 const kalemW=(0.9*Math.max(L.cw,L.ch)/L.cw*100)+'%';
 for(let r=0;r<L.R;r++)for(let c=0;c<L.C;c++){
  const s=document.createElement('div');s.className='slot';s.dataset.r=r;s.dataset.c=c;s.dataset.k=r+','+c;
  const h=(opt.harita||{})[r+','+c]||L.hucre.find(x=>x.r===r&&x.c===c&&!opt.harita);
  if(h){const k=kalemEl(h.col,h.d);k.style.width=h.uz?(parseFloat(kalemW)*h.uz)+'%':kalemW;s.appendChild(k)}
  el.appendChild(s);
 }
 el.dataset.oran=(L.C*L.cw)/(L.R*L.ch);
 requestAnimationFrame(()=>sigdir(el));
}
function sigdir(el){
 const p=el.parentElement;if(!p||!el.dataset.oran)return;
 const cs=getComputedStyle(p),pw=p.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),ph=p.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
 if(pw<=0||ph<=0)return;const o=+el.dataset.oran;let w=pw,h=pw/o;if(h>ph){h=ph;w=ph*o}
 el.style.width=w+'px';el.style.height=h+'px';
}
function gosterimBoyut(){const g=$('gosterim');if(!g||$('soru').classList.contains('gizli'))return;const ts=[...g.querySelectorAll(':scope>.tablet')];if(!ts.length)return;
 const gap=parseFloat(getComputedStyle(g).columnGap)||24,H=g.clientHeight-16,W=(g.clientWidth-16-gap*(ts.length-1))/ts.length;
 ts.forEach(t=>{const r=+t.dataset.oran||1.4;let h=H,w=h*r;if(w>W){w=W;h=W/r}t.style.width=w+'px';t.style.height=h+'px';t.style.aspectRatio='auto'})}
function hepsiniSigdir(){gosterimBoyut();document.querySelectorAll('.izgara[data-fit]').forEach(sigdir);document.querySelectorAll('.mini .izgara').forEach(sigdir)}
window.addEventListener('resize',()=>{hepsiniSigdir();yonKontrol()});

/* ---------------- SES ---------------- */
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function ton(f,t=.12,tip='sine',v=.18,gec=0){if(!S.ses)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),z=a.currentTime+gec;o.type=tip;o.frequency.value=f;g.gain.setValueAtTime(0,z);g.gain.linearRampToValueAtTime(v,z+.01);g.gain.exponentialRampToValueAtTime(.001,z+t);o.connect(g);g.connect(a.destination);o.start(z);o.stop(z+t+.02)}
function tik(){if(!S.ses)return;const a=ac();if(!a)return;const b=a.createBuffer(1,a.sampleRate*.05,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,6);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type='bandpass';f.frequency.value=2400;g.gain.value=.6;s.buffer=b;s.connect(f);f.connect(g);g.connect(a.destination);s.start()}
const NOTA=[523,587,659,698,784,880,988,1047];
function basariSes(){[523,659,784,1047].forEach((f,i)=>ton(f,.25,'triangle',.16,i*.1))}
function hataSes(){ton(220,.18,'sawtooth',.06);ton(196,.22,'sawtooth',.05,.12)}
let trSes=null;function konus(m){if(!S.ses||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(m);u.lang='tr-TR';u.rate=.95;u.pitch=1.05;if(!trSes)trSes=speechSynthesis.getVoices().find(v=>/tr/i.test(v.lang));if(trSes)u.voice=trSes;speechSynthesis.speak(u)}catch(e){}}
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>{trSes=speechSynthesis.getVoices().find(v=>/tr/i.test(v.lang))};
function tost(m){document.querySelectorAll('.tost').forEach(t=>t.remove());const t=document.createElement('div');t.className='tost';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2700)}

/* ---------------- MODLAR ---------------- */
const MODLAR=[
 {id:'kopya',ik:'🖍️',ad:'Kalemi Kopyala',ac:'Tabletteki deseni kâğıdına aynen kur.',min:0,tur:'yer'},
 {id:'hiz',ik:'⚡',ad:'Renk-Sayı Hızı',ac:'Ekran rengi + sayı: o renk kalemi o sıraya taşı!',min:0,tur:'hiz'},
 {id:'hafiza',ik:'🧠',ad:'Hafıza Kalemleri',ac:'Deseni ezberle, kapanınca kur.',min:0,tur:'yer'},
 {id:'fark',ik:'🔍',ad:'Farkı Bul',ac:'İki resim arasındaki farkı yakala.',min:0,tur:'soru'},
 {id:'sira',ik:'➡️',ad:'Sıradaki Kalem',ac:'Örüntüyü bul, sıradakini seç.',min:0,tur:'soru'},
 {id:'kavram',ik:'🧩',ad:'Kavram Avı',ac:'Uzun-kısa, az-çok, sağında-solunda…',min:0,tur:'soru'},
 {id:'ayna',ik:'🪞',ad:'Ayna Ustası',ac:'Deseni aynadaki gibi kur.',min:2,tur:'yer'},
 {id:'dondur',ik:'🔄',ad:'Döndür Ustası',ac:'Deseni saat yönünde çeyrek tur döndür.',min:3,tur:'yer'},
 {id:'masa',ik:'🏫',ad:'Sınıf Masası',ac:'Akıllı tahta + gerçek kalemlerle sınıfça oyna.',min:0,tur:'masa'},
 {id:'ikili',ik:'👫',ad:'İki Kişilik',ac:'Biri desen kurar, diğeri kopyalar.',min:0,tur:'yer'}
];
function lvl(){return (S.lvl[S.mod+'_'+S.sinif]||0)}
function lvlArt(){S.lvl[S.mod+'_'+S.sinif]=lvl()+1;LS.s('ku_lvl',S.lvl)}

/* ---------------- DESEN ÜRETİCİ ---------------- */
function renkSec(n){return karistir([...Array(renkSayisi()).keys()]).slice(0,n)}
function siraDesen(n,yonlu){const cs=renkSec(n);const h=cs.map((col,i)=>({r:0,c:i,col,d:yonlu?(Math.random()<.5?2:6):2}));if(yonlu&&!h.some(x=>x.d===6))h[rnd(n)].d=6;return {R:1,C:n,cw:46,ch:100,hucre:h,sira:true}}
function cerceveDesen(){const cs=renkSec(4);const p=[[0,1,'y'],[1,0,'d'],[1,2,'d'],[2,1,'y']];return {R:3,C:3,cw:100,ch:100,hucre:p.map((q,i)=>({r:q[0],c:q[1],col:cs[i],d:q[2]==='y'?(Math.random()<.5?0:4):(Math.random()<.5?2:6)}))}}
function serbestDesen(n,capraz){const cs=renkSec(n);const yer=karistir([...Array(9).keys()]).slice(0,n);
 return {R:3,C:3,cw:100,ch:100,capraz,hucre:yer.map((p,i)=>({r:Math.floor(p/3),c:p%3,col:cs[i],d:capraz?rnd(8):rnd(4)*2}))}}
function desenUret(izgaraSart,lv){
 const g=sinifNo(),l=lv===undefined?lvl():lv;let L;
 if(g===0)L=l<3?siraDesen(3,false):l<6?siraDesen(4,false):siraDesen(4,true);
 else if(g===1)L=l<3?siraDesen(4,true):l<6?cerceveDesen():serbestDesen(4,false);
 else if(g===2)L=l<3?cerceveDesen():serbestDesen(l<6?5:6,false);
 else if(g===3)L=serbestDesen(l<4?5:6,true);
 else L=serbestDesen(l<4?6:7,true);
 if(izgaraSart&&L.sira)L=g<2?cerceveDesen():serbestDesen(g>=3?5:4,g>=3);
 return L;
}
const aynala=d=>(4-d+8)%8, cevir90=d=>(d+6)%8;
function amacHesapla(L,mod){const m={};L.hucre.forEach(h=>{let r=h.r,c=h.c,d=h.d;
 if(mod==='ayna'){c=L.C-1-c;d=aynala(d)}if(mod==='dondur'){const r2=c,c2=L.R-1-r;r=r2;c=c2;d=cevir90(d)}m[r+','+c]={col:h.col,d}});return m}

/* ---------------- EKRANLAR ---------------- */
function ekranGoster(id){if(id!=='hiz')hizDur();if(id!=='masa')masaHizKapat();['menu','oyun','soru','masa','hiz'].forEach(x=>$(x).classList.toggle('gizli',x!==id));S.ekran=id;setTimeout(hepsiniSigdir,30);setTimeout(hepsiniSigdir,300)}
function menuGoster(){masaDur();S.mod=null;ekranGoster('menu');
 $('sinifAd').textContent=(SINIFLAR.find(x=>x.k===S.sinif)||{}).ad||'?';durumYaz();kutuCiz();
 $('modlar').innerHTML=MODLAR.map(m=>{const kil=sinifNo()<m.min;return `<button class="mod ${kil?'kilitli':''}" onclick="modBasla('${m.id}')"><span class="ik">${m.ik}</span><span><b>${m.ad}</b><small>${kil?('🔒 '+SINIFLAR[m.min].ad+' ve üstü için'):m.ac}</small></span>${(S.lvl[m.id+'_'+S.sinif]||0)?`<span class="yd2">Bölüm ${(S.lvl[m.id+'_'+S.sinif]||0)+1}</span>`:''}</button>`}).join('');
}
function modBasla(id){const m=MODLAR.find(x=>x.id===id);ac();
 if(sinifNo()<m.min){tost('Bu mod '+SINIFLAR[m.min].ad+' ve üstü için. 🎓 Sınıf düğmesinden değiştirebilirsin.');konus('Bu mod biraz daha büyükler için.');return}
 S.mod=id;if(m.tur==='yer')turBasla();else if(m.tur==='soru'){S.soruNo=0;S.soruDogru=0;soruBasla()}else if(m.tur==='hiz')hizBasla();else masaBasla();
}

/* ---------------- KALEM YERLEŞTİRME TURU ---------------- */
function turBasla(){
 ekranGoster('oyun');S.cozuldu=false;S.ipucuS=0;S.hataS=0;S.yer={};S.secTepsi=null;S.secili=null;S.imlec=0;S.kilit=false;
 $('hedefBeyaz').querySelectorAll('.perde,.aynaCizgi,.sayac').forEach(e=>e.remove());
 $('tekrarBak').classList.toggle('gizli',S.mod!=='hafiza');
 $('kontrolBt').textContent='✔ Kontrol Et';
 const m=MODLAR.find(x=>x.id===S.mod);$('oyunBaslik').textContent=m.ik;
 $('seviyeRozet').textContent='Bölüm '+(lvl()+1);yildizYaz();
 if(S.mod==='ikili'&&S.faz!=='kopya'){S.faz='tasarla';const n=sinifNo()===0?'sira':'izgara';
  S.hedefL=n==='sira'?{R:1,C:4,cw:46,ch:100,hucre:[],sira:true}:{R:3,C:3,cw:100,ch:100,hucre:[],capraz:sinifNo()>=3};
  S.amac={};izgaraCiz($('hedef'),{...S.hedefL,hucre:[]});
  const p=document.createElement('div');p.className='perde';p.innerHTML='<b>🎨</b>1. oyuncu: Tasarımcı<br><span style="font-size:1.1rem">Kâğıda kendi deseni kur, sonra <u>GÖREV YAP</u>.</span>';$('hedefBeyaz').appendChild(p);
  S.tepsi=[...Array(renkSayisi()).keys()].slice(0,S.hedefL.sira?4:Math.min(renkSayisi(),7)).map((col,i)=>({id:i,col,kul:false}));
  $('kontrolBt').textContent='✅ Görev Yap';
  gorevYaz('Tasarımcı: kâğıda bir desen kur. Kalemleri sürükle, uç yönünü düğmelerle seç.');
 } else {
  if(S.mod==='ikili'){/* faz kopya: hedef hazır */}
  else S.hedefL=desenUret(S.mod==='ayna'||S.mod==='dondur');
  S.amac=amacHesapla(S.hedefL,S.mod);
  izgaraCiz($('hedef'),S.hedefL);
  const renkler=S.hedefL.hucre.map(h=>h.col);
  if(sinifNo()>=4&&S.mod!=='ikili'){const kalan=[...Array(renkSayisi()).keys()].filter(x=>!renkler.includes(x));if(kalan.length)renkler.push(kalan[rnd(kalan.length)])}
  S.tepsi=karistir(renkler).map((col,i)=>({id:i,col,kul:false}));
  const metin={kopya:'Tabletteki deseni kâğıdına AYNEN kur: renk, yer ve uç yönü aynı olsun.',hafiza:'Deseni iyi bak ve aklında tut! Birazdan kapanacak.',
   ayna:'Deseni AYNADAKİ gibi kur: sağdaki sola, soldaki sağa geçer; uçlar da aynada döner.',dondur:'Deseni saat yönünde ÇEYREK TUR (90°) döndürülmüş hâliyle kur.',ikili:'2. oyuncu: arkadaşının desenini aynen kur!'}[S.mod];
  gorevYaz(metin);

function siraSoru(){const g=sinifNo();const n=g===0?5:6;const cs=renkSec(3);let dizi=[],ops=[];let ipucu='Renklerin nasıl tekrar ettiğine bak.';

 else{const adim=g===3?(Math.random()<.5?2:6):[1,2,3][rnd(3)]*(Math.random()<.5?1:-1);const bas=rnd(8);for(let i=0;i<=n;i++)dizi.push({col:cs[kalip[i%kalip.length]],d:((bas+adim*i)%8+8)%8});ipucu='Uç her seferinde aynı miktarda dönüyor. Kaç adım?'}
 const cev=dizi[n];const goster=dizi.slice(0,n);

 const yanlis=[];const nOp=g===0?1:2;
 const aday=[{col:cev.col,d:(cev.d+4)%8},{col:cs.find(c=>c!==cev.col),d:cev.d},{col:cs.find(c=>c!==cev.col)||cs[2],d:(cev.d+2)%8},{col:cev.col,d:(cev.d+2)%8}];
 if(g<=1){yanlis.push({col:cs.find(c=>c!==cev.col),d:2});if(nOp>1)yanlis.push({col:cs.find(c=>c!==cev.col&&c!==yanlis[0].col)||cs[2],d:2})}
 else{karistir(aday).forEach(a=>{if(yanlis.length<nOp&&!(a.col===cev.col&&a.d===cev.d)&&!yanlis.some(y=>y.col===a.col&&y.d===a.d))yanlis.push(a)})}
 const hepsi=karistir([cev,...yanlis]);
 return {metin:g===0?'Sırada hangi kalem gelmeli? (İki seçenek)':'Örüntüyü bul: “?” yerine hangi kalem gelmeli?',
  goster:el=>{const t=tabletKutu(el,L,`${(n+1)*46+40}/140`);const s=t.querySelector(`.slot[data-k="0,${n}"]`);s.innerHTML='<div style="position:absolute;inset:8%;border:.25rem dashed #ff9800;border-radius:.6rem;display:flex;align-items:center;justify-content:center;font-size:2.4rem;color:#ff9800">?</div>'},

  dogru:hepsi.indexOf(cev),ipucu,aciklama:''}}

function kavramSoru(){const g=sinifNo();const tip=g===0?['uzun','cok','yukari'][rnd(3)]:g===1?['say','konum','sira'][rnd(3)]:g===2?['say','komsu','orta'][rnd(3)]:['dondur','ayna','komsu'][rnd(g===3?3:2)];
 const [a,b]=renkSec(2);
 if(tip==='uzun'){const sor=Math.random()<.5?'UZUN':'KISA';const L={R:1,C:2,cw:60,ch:100,hucre:[{r:0,c:0,col:a,d:2},{r:0,c:1,col:b,d:2,uz:.55}]};
  return {metin:`Hangi kalem daha ${sor}?`,goster:el=>tabletKutu(el,L,'14/11'),sec:[a,b].map(c=>({html:renkSecenek(c)})),dogru:sor==='UZUN'?0:1,ipucu:'Kalemlerin boylarını karşılaştır.',aciklama:''}}
 if(tip==='cok'){const na=2+rnd(2),nb=na+1+rnd(2);const sor=Math.random()<.5?'ÇOK':'AZ';const hs=[];karistir([...Array(na).fill(a),...Array(nb).fill(b)]).forEach((c,i)=>hs.push({r:0,c:i,col:c,d:2}));
  const L={R:1,C:na+nb,cw:46,ch:100,hucre:hs};return {metin:`Hangi renk kalem daha ${sor}?`,goster:el=>tabletKutu(el,L,`${(na+nb)*46+40}/140`),sec:[a,b].map(c=>({html:renkSecenek(c)})),dogru:sor==='ÇOK'?1:0,ipucu:'Her renkten kaç tane var, parmağınla say.',aciklama:`${na} ${RENK[a].ad.toLowerCase()}, ${nb} ${RENK[b].ad.toLowerCase()} kalem var.`}}
 if(tip==='yukari'){const sor=Math.random()<.5?'YUKARI':'AŞAĞI';const L={R:1,C:2,cw:60,ch:100,hucre:[{r:0,c:0,col:a,d:2},{r:0,c:1,col:b,d:6}]};
  return {metin:`Hangi kalemin ucu ${sor} bakıyor?`,goster:el=>tabletKutu(el,L,'14/11'),sec:[a,b].map(c=>({html:renkSecenek(c)})),dogru:sor==='YUKARI'?0:1,ipucu:'Sivri ucun nereyi gösterdiğine bak.',aciklama:''}}
 if(tip==='say'){const L=g===1?siraDesen(5,true):serbestDesen(6,false);const yon=L.sira?[2,6][rnd(2)]:[0,2,4,6][rnd(4)];const n=L.hucre.filter(h=>h.d===yon).length;
  const ops=karistir([n,...karistir([0,1,2,3,4,5].filter(x=>x!==n)).slice(0,2)]);
  return {metin:`Kaç kalemin ucu ${YON[yon].y.toUpperCase()} bakıyor?`,goster:el=>tabletKutu(el,L,L.sira?'5/3':'1/1'),sec:ops.map(x=>({html:`<span style="font-size:2.4rem">${x}</span>`})),dogru:ops.indexOf(n),ipucu:'Sivri uçları tek tek say.',aciklama:`${n} kalemin ucu ${YON[yon].y} bakıyor.`}}
 if(tip==='konum'){const L=siraDesen(4,false);const i=rnd(3),j=i+1+rnd(3-i);const x=L.hucre[i].col,y=L.hucre[j].col;const sorulan=Math.random()<.5;
  return {metin:sorulan?`${RENK[x].ad} kalem, ${RENK[y].ad.toLowerCase()} kalemin SOLUNDA mı, SAĞINDA mı?`:`${RENK[y].ad} kalem, ${RENK[x].ad.toLowerCase()} kalemin SOLUNDA mı, SAĞINDA mı?`,goster:el=>tabletKutu(el,L,'5/3'),sec:[{html:'◀ Solunda'},{html:'Sağında ▶'}],dogru:sorulan?0:1,ipucu:'Sol elini kaldır; o taraf SOL.',aciklama:''}}
 if(tip==='sira'){const L=siraDesen(5,false);const i=rnd(5);const dog=L.hucre[i].col;const ops=karistir([dog,...karistir(L.hucre.map(h=>h.col).filter(c=>c!==dog)).slice(0,2)]);
  return {metin:`Soldan ${i+1}. kalem hangi renk?`,goster:el=>tabletKutu(el,L,'5/3'),sec:ops.map(c=>({html:renkSecenek(c)})),dogru:ops.indexOf(dog),ipucu:'Soldan başlayarak parmağınla say: 1, 2, 3…',aciklama:''}}
 if(tip==='komsu'){let L,h,k,yon,ad;for(let t=0;t<50;t++){L=serbestDesen(g>=3?6:5,g>=3);h=L.hucre[rnd(L.hucre.length)];const yonlar=[[-1,0,'ÜSTÜNDE'],[1,0,'ALTINDA'],[0,-1,'SOLUNDA'],[0,1,'SAĞINDA']];const y=yonlar[rnd(4)];k=L.hucre.find(z=>z.r===h.r+y[0]&&z.c===h.c+y[1]);if(k){ad=y[2];break}}
  if(!k)return kavramSoru();const ops=karistir([k.col,...karistir(L.hucre.map(z=>z.col).filter(c=>c!==k.col&&c!==h.col)).slice(0,2)]);
  return {metin:`${RENK[h.col].ad} kalemin hemen ${ad} hangi kalem var?`,goster:el=>tabletKutu(el,L,'1/1'),sec:ops.map(c=>({html:renkSecenek(c)})),dogru:ops.indexOf(k.col),ipucu:`Önce ${RENK[h.col].ad.toLowerCase()} kalemi bul, sonra ${ad.toLowerCase()} bak.`,aciklama:''}}
 if(tip==='orta'){let L=serbestDesen(5,false);if(!L.hucre.some(h=>h.r===1&&h.c===1)){L.hucre[0].r=1;L.hucre[0].c=1}const m=L.hucre.find(h=>h.r===1&&h.c===1);const ops=karistir([m.col,...karistir(L.hucre.map(z=>z.col).filter(c=>c!==m.col)).slice(0,2)]);
  return {metin:'TAM ORTADAKİ kalem hangi renk?',goster:el=>tabletKutu(el,L,'1/1'),sec:ops.map(c=>({html:renkSecenek(c)})),dogru:ops.indexOf(m.col),ipucu:'Ortadaki kutu: üstünde, altında, sağında ve solunda birer kutu olan yer.',aciklama:''}}
 // dondur / ayna (zihinde döndürme)
 const L=serbestDesen(g>=4?5:4,g>=3);const don=m=>({...L,hucre:Object.entries(amacHesapla(L,m)).map(([k,v])=>{const [r,c]=k.split(',').map(Number);return {r,c,col:v.col,d:v.d}})});
 const sagaDon=don('dondur');const ayna=don('ayna');const solaDon=(()=>{let X=L;for(let i=0;i<3;i++){const t=X;X={...t,hucre:Object.entries(amacHesapla(t,'dondur')).map(([k,v])=>{const [r,c]=k.split(',').map(Number);return {r,c,col:v.col,d:v.d}})}}return X})();
 const ters={...L,hucre:L.hucre.map(h=>({...h,d:(h.d+4)%8}))};
 const dog=tip==='dondur'?sagaDon:ayna;const yanl=tip==='dondur'?[ayna,solaDon]:[sagaDon,ters];
 const imza=X=>X.hucre.map(h=>h.r+','+h.c+','+h.col+','+h.d).sort().join('|');if(new Set([dog,...yanl].map(imza)).size<3)return kavramSoru();
 const ops=karistir([dog,...yanl]);
 return {metin:tip==='dondur'?'Bu desen saat yönünde ÇEYREK TUR dönünce hangisi olur?':'Bu desenin AYNADAKİ görüntüsü hangisi?',goster:el=>{const t=tabletKutu(el,L,'1/1');if(tip==='ayna'){const a=document.createElement('div');a.className='aynaCizgi';t.querySelector('.beyaz').appendChild(a)}},
  sec:ops.map(miniSecenek),dogru:ops.indexOf(dog),ipucu:tip==='dondur'?'Üstteki kalem sağ tarafa geçer; yatay kalemler dik olur.':'Aynada sağ ile sol yer değiştirir, üst ile alt değişmez.',aciklama:''}}

 return L.hucre.slice().sort((a,b)=>a.r-b.r||a.c-b.c).map(h=>`${konumAd(h.r+','+h.c,L)} ${RENK[h.col].ad.toLowerCase()} kalem, ucu ${YON[h.d].y} bakıyor`)}


/* ---------------- ⚡ RENK-SAYI HIZI (2. video) ----------------
   Tablet bir RENK + SAYI gösterir → çocuk o renkteki kalemi o numaralı sıraya taşır.
   Dikkat, işleyen bellek ve tepki hızı çalışması; 5. sınıftan sonra "dikkat tuzağı" (Stroop): yazıya değil RENGE bak. */
const H={N:4,sira:[],kart:null,aktif:false,t:null,kalan:0,sure:0,dogru:0,hata:0,no:0,tepkiler:[],seri:0,enSeri:0,sec:null,bas:0};
const KART_SAYI=12;
function hizSure(){const g=sinifNo();const taban=[0,8,6,5,4][g];return taban?Math.max(2.5,taban-lvl()*.3):0}

 H.sira=karistir([...Array(H.N).keys()]);H.dogru=0;H.hata=0;H.no=0;H.tepkiler=[];H.seri=0;H.enSeri=0;H.kart=null;H.sec=null;H.aktif=false;
 hizSatirCiz();hizSkorYaz();$('hizZaman').style.transform='scaleX(1)';$('hizBaslaBt').classList.remove('gizli');
 $('hizBeyaz').innerHTML=`<div class="hizKart" style="background:#fff8e1"><div style="font-size:1.6rem;text-align:center;padding:1rem;color:#5d4037">Ekran <b>hangi renkse</b> o renk kalemi,<br><b>sayının olduğu sıraya</b> taşı!${g>=3?'<br><span style="font-size:1.1rem;color:#c62828">Dikkat: Bazen yazı seni yanıltmaya çalışacak. YAZIYA değil, RENGE bak!</span>':''}</div><button class="bt ana" style="font-size:1.4rem" onclick="hizBaslat()">▶ Başla</button></div>`;
 const m=`Ekran hangi renkse o renk kalemi, ekrandaki sayının olduğu sıraya taşı! ${hizSure()?hizSure()+' saniyen var.':'Acele yok.'}`;$('hizGorev').textContent='Ekranın RENGİ + SAYI → o renk kalemi o sıraya taşı';S.gorevMetin=m;setTimeout(()=>konus(m),250)}
function hizSatirCiz(){const k=$('hizSatirlar');k.innerHTML='';
 for(let i=0;i<H.N;i++){const r=document.createElement('div');r.className='hsatir';r.dataset.i=i;
  r.innerHTML=`<span class="hno">${i+1}</span><div class="hyer${H.sec===i?' sec':''}"></div>`;const y=r.querySelector('.hyer');const ke=kalemEl(H.sira[i],0);ke.dataset.c=H.sira[i];y.appendChild(ke);
  y.addEventListener('pointerdown',e=>hizSurukle(e,i));r.addEventListener('click',()=>{if(H.sec!==null&&H.sec!==i&&!H._yeniSurukle){hizTasi(H.sec,i)}H._yeniSurukle=false});k.appendChild(r)}}

function hizBaslat(){if(H.aktif)return;ac();$('hizBaslaBt').classList.add('gizli');let k=3;const b=$('hizBeyaz');
 const yaz=()=>{b.innerHTML=`<div class="hizKart" style="background:#fff3e0"><div class="hizDaire" style="border-color:#f57c00;color:#f57c00">${k}</div></div>`;ton(660,.1,'sine',.12)};yaz();
 const t=setInterval(()=>{k--;if(k>0)yaz();else{clearInterval(t);ton(990,.15,'triangle',.15);H.aktif=true;hizKartYeni();clearInterval(H.t);H.t=setInterval(hizTik,100)}},700)}
function hizKartYeni(){if(H.no>=KART_SAYI){hizBitir();return}const g=sinifNo();let c,n;
 for(let t=0;t<30;t++){c=rnd(H.N);n=rnd(H.N);if(H.sira[n]!==c)break}
 const tuzak=g>=3&&H.no>=3&&Math.random()<.45;let kelime='';if(tuzak){let w;do{w=rnd(H.N)}while(w===c);kelime=RENK[w].ad.toLocaleUpperCase('tr-TR')}
 H.kart={c,n,tuzak};H.no++;H.bas=performance.now();H.sure=hizSure();H.kalan=H.sure;
 const R=RENK[c];const yaziRenk=c===2?'#111':'#111';
 $('hizBeyaz').innerHTML=`<div class="hizKart flas" style="background:${R.h}"><div class="hizDaire" style="color:${yaziRenk}">${n+1}</div>${g===0?`<div class="hizNokta">${'●'.repeat(n+1)}</div>`:''}${kelime?`<div class="hizKelime">${kelime}</div>`:''}</div>`;
 tik();if(g===0)konus(R.ad+', '+(n+1));
}
function hizKartOku(){if(H.kart)konus(RENK[H.kart.c].ad+' kalem, '+(H.kart.n+1)+'. sıraya');else konus(S.gorevMetin||'')}

 if(H.kalan<=0){H.hata++;H.seri=0;hataSes();tost('⏰ Süre bitti! '+RENK[H.kart.c].ad+' kalem '+(H.kart.n+1)+'. sıraya gidecekti.');hizSkorYaz();hizKartYeni()}}
function hizDur(){clearInterval(H.t);H.t=null;H.aktif=false}
function hizTasi(a,b){if(a===b)return;[H.sira[a],H.sira[b]]=[H.sira[b],H.sira[a]];H.sec=null;tik();hizSatirCiz();
 if(!H.aktif||!H.kart)return;const k=H.kart;const satir=$('hizSatirlar').children[k.n];
 if(H.sira[k.n]===k.c){const ms=performance.now()-H.bas;H.tepkiler.push(ms);H.dogru++;H.seri++;H.enSeri=Math.max(H.enSeri,H.seri);ton(NOTA[k.n%8],.15,'triangle',.16);ton(NOTA[(k.n+2)%8],.2,'triangle',.14,.08);
  satir.classList.add('dogruS');hizSkorYaz();if(H.seri>0&&H.seri%5===0){tost('🔥 '+H.seri+' seri! Harika dikkat!');konus('Harika! '+H.seri+' seri!')}
  setTimeout(hizKartYeni,350)}
 else{H.hata++;H.seri=0;hataSes();satir.classList.add('yanlis');hizSkorYaz();const m=k.tuzak?'Yazıya değil, ekranın RENGİNE bak!':`Ekran ${RENK[k.c].ad.toLowerCase()}: ${RENK[k.c].ad.toLowerCase()} kalemi ${k.n+1}. sıraya taşı.`;tost('💡 '+m);if(sinifNo()<=1)konus(m)}}

    <button class="zg-bt" id="zgEvet">✅ Evet, benim</button><button class="zg-bt ikinci" id="zgHayir">🙋 Ben değilim</button><div class="zg-alt"><button id="zgOgr">👩‍🏫 Öğretmen Paneli</button>${siteDon}</div></div>`);
    d.querySelector('#zgEvet').onclick=()=>{d.remove();bitir(k,coz)};d.querySelector('#zgHayir').onclick=()=>{d.remove();form(coz)};d.querySelector('#zgOgr').onclick=()=>panelAc()}
   else form(coz)})}
 function panelAc(){stilEkle();if(!ls.g('zirve_ogretmen_ok',false)){const d=ortu(`<div class="zg-kart"><h2>👩‍🏫 Öğretmen Paneli</h2><p>Şifreyi gir.</p><input id="zgPin" type="password" inputmode="numeric" maxlength="10"><div class="zg-hata" id="zgPh"></div><button class="zg-bt" id="zgPok">Aç</button><button class="zg-bt ikinci" id="zgPx">Vazgeç</button></div>`);
   const ok=()=>{if(d.querySelector('#zgPin').value===AYAR.pin){ls.s('zirve_ogretmen_ok',true);d.remove();panelGoster()}else d.querySelector('#zgPh').textContent='Şifre yanlış.'};
   d.querySelector('#zgPok').onclick=ok;d.querySelector('#zgPin').onkeydown=e=>{if(e.key==='Enter')ok()};d.querySelector('#zgPx').onclick=()=>d.remove();setTimeout(()=>d.querySelector('#zgPin').focus(),80);return}
  panelGoster()}
 let VERI=[];
 async function panelGoster(){const d=ortu(`<div class="zg-panel"><div style="display:flex;align-items:center;gap:.5rem;flex-wrap:wrap"><h2 style="margin:0;color:var(--zg);flex:1">👩‍🏫 Öğretmen Paneli · tüm oyunlar</h2>
  <button class="zg-bt" style="width:auto;margin:0;padding:.5rem .9rem;font-size:1rem" id="zgYen">🔄 Yenile</button><button class="zg-bt" style="width:auto;margin:0;padding:.5rem .9rem;font-size:1rem" id="zgKop">📋 Kopyala</button>
  <button class="zg-bt ikinci" style="width:auto;margin:0;padding:.5rem .9rem;font-size:1rem" id="zgUnut">🔒 Şifreyi unut</button><button class="zg-bt ikinci" style="width:auto;margin:0;padding:.5rem .9rem;font-size:1rem" id="zgKap">✕ Kapat</button></div>
  <div class="zg-ozet" id="zgOz"></div><div class="zg-filtre"><input id="zgAra" placeholder="🔎 İsim ara"><select id="zgFo"><option value="">Tüm oyunlar</option></select><select id="zgFs"><option value="">Tüm sınıflar</option></select><select id="zgFc"><option value="">Tüm cihazlar</option></select></div>
  <div id="zgTab">Yükleniyor…</div></div>`);
  const ciz=()=>{const a=d.querySelector('#zgAra').value.toLocaleLowerCase('tr-TR'),fo=d.querySelector('#zgFo').value,fs=d.querySelector('#zgFs').value,fc=d.querySelector('#zgFc').value;
   const L=VERI.filter(x=>(!a||(x.ad+' '+x.soyad).toLocaleLowerCase('tr-TR').includes(a))&&(!fo||x.oyun===fo)&&(!fs||x.sinif===fs)&&(!fc||x.cihaz===fc));const simdi=Date.now(),bugun=new Date().toDateString();
   const cih={};L.forEach(x=>cih[x.cihaz]=(cih[x.cihaz]||0)+1);const ik={'Telefon':'📱','Tablet':'📲','Bilgisayar':'💻','Akıllı Tahta':'🖥️'};
   d.querySelector('#zgOz').innerHTML=`<div>Toplam giriş<b>${L.length}</b></div><div>Farklı öğrenci<b>${new Set(L.map(x=>x.ad+'|'+x.soyad+'|'+x.sinif+'|'+x.sube)).size}</b></div><div>Şu an oyunda<b>${L.filter(x=>simdi-new Date(x.son)<300000).length}</b></div><div>Bugün<b>${L.filter(x=>new Date(x.giris).toDateString()===bugun).length}</b></div><div>Cihazlar<b style="font-size:1rem">${Object.entries(cih).map(([k,v])=>(ik[k]||'❔')+' '+v).join(' · ')||'-'}</b></div>`;
   const t=x=>{const z=new Date(x);return isNaN(z)?'':z.toLocaleString('tr-TR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})};
   d.querySelector('#zgTab').innerHTML=`<table class="zg-tablo"><tr><th>Öğrenci</th><th>Sınıf</th><th>Oyun</th><th>Cihaz</th><th>Giriş</th><th>Son görülme</th></tr>${L.map(x=>`<tr><td>${simdi-new Date(x.son)<300000?'<span class="zg-nok"></span>':''}${x.ad} ${x.soyad}</td><td>${x.sinif}-${x.sube}</td><td>${x.oyun}</td><td>${(ik[x.cihaz]||'')} ${x.cihaz} · ${x.os} · ${x.tarayici}</td><td>${t(x.giris)}</td><td>${t(x.son)}</td></tr>`).join('')}</table>`;d._L=L};
  const yukle=async()=>{d.querySelector('#zgTab').textContent='Yükleniyor…';try{VERI=await listele();const dol=(id,k)=>{const s=d.querySelector(id),v=s.value;s.innerHTML=s.options[0].outerHTML+[...new Set(VERI.map(x=>x[k]).filter(Boolean))].sort().map(x=>`<option>${x}</option>`).join('');s.value=v};dol('#zgFo','oyun');dol('#zgFs','sinif');dol('#zgFc','cihaz');ciz()}catch(e){d.querySelector('#zgTab').textContent='Liste alınamadı (internet ya da Firestore kuralı). '+e.message}};
  ['#zgAra','#zgFo','#zgFs','#zgFc'].forEach(s=>d.querySelector(s).addEventListener('input',ciz));
  d.querySelector('#zgYen').onclick=yukle;d.querySelector('#zgKap').onclick=()=>d.remove();d.querySelector('#zgUnut').onclick=()=>{ls.s('zirve_ogretmen_ok',false);d.remove()};
  d.querySelector('#zgKop').onclick=()=>{const L=d._L||[];const txt=['Ad\tSoyad\tSınıf\tŞube\tOyun\tCihaz\tİşletim\tTarayıcı\tEkran\tGiriş\tSon'].concat(L.map(x=>[x.ad,x.soyad,x.sinif,x.sube,x.oyun,x.cihaz,x.os,x.tarayici,x.ekran,x.giris,x.son].join('\t'))).join('\n');navigator.clipboard&&navigator.clipboard.writeText(txt).then(()=>alertsiz('Kopyalandı — Excel’e yapıştırabilirsin'))};
  yukle()}
 function alertsiz(m){const t=document.createElement('div');t.style.cssText='position:fixed;left:50%;top:1rem;transform:translateX(-50%);background:#222;color:#fff;padding:.6rem 1rem;border-radius:.8rem;z-index:9999;font-family:Nunito,sans-serif;font-weight:800';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)sonGoruldu()});window.addEventListener('online',bekleyenGonder);
 window.ZGIRIS={baslat,panelAc,cihaz,ayar:AYAR,ogrenci:null};
})();
