<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Poyraz'ın Büyük Macerası — Değişim Koleji</title>
<!-- sürüm 2: gerçekçi karakter (eklemli vücut, fotoğraftan yüz, katlı saç) -->
<style>
:root{--ui:1;--navy:#14213d;--gold:#f4b322;--blue:#2f6fd6;--card:rgba(15,25,50,.82)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1630;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;cursor:pointer;border:0}
.hidden{display:none!important}
/* ---------- HUD ---------- */
#hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:calc(8px*var(--ui));padding:calc(8px*var(--ui)) calc(10px*var(--ui));padding-top:max(calc(8px*var(--ui)),env(safe-area-inset-top));pointer-events:none;z-index:10}
#hud>*{pointer-events:auto}
.pill{background:var(--card);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);border-radius:999px;height:calc(44px*var(--ui));display:flex;align-items:center;gap:calc(6px*var(--ui));padding:0 calc(12px*var(--ui));font-size:calc(15px*var(--ui));font-weight:700;color:#fff}
.ibtn{width:calc(44px*var(--ui));padding:0;justify-content:center;font-size:calc(20px*var(--ui))}
#avatar{width:calc(32px*var(--ui));height:calc(32px*var(--ui));border-radius:50%;object-fit:cover;object-position:50% 40%;border:2px solid var(--gold)}
#badges{display:flex;gap:calc(4px*var(--ui))}
#badges span{width:calc(30px*var(--ui));height:calc(30px*var(--ui));border-radius:50%;display:grid;place-items:center;font-size:calc(16px*var(--ui));background:rgba(255,255,255,.08);border:2px dashed rgba(255,255,255,.25);filter:grayscale(1);opacity:.55}
#badges span.on{filter:none;opacity:1;border:2px solid var(--gold);background:radial-gradient(circle,#ffe08a,#f4b322);box-shadow:0 0 12px #f4b32299}
.sp{flex:1}
#gorev{position:fixed;left:50%;transform:translateX(-50%);top:calc(62px*var(--ui) + env(safe-area-inset-top));background:var(--card);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:calc(8px*var(--ui)) calc(14px*var(--ui));font-size:calc(14px*var(--ui));max-width:92vw;text-align:center;z-index:9;pointer-events:none}
#gorev b{color:var(--gold)}
/* controls */
#joy{position:fixed;left:calc(18px*var(--ui));bottom:calc(22px*var(--ui) + env(safe-area-inset-bottom));width:calc(130px*var(--ui));height:calc(130px*var(--ui));border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.22);z-index:10;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:calc(56px*var(--ui));height:calc(56px*var(--ui));margin:calc(-28px*var(--ui)) 0 0 calc(-28px*var(--ui));border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#9fb7e8);box-shadow:0 4px 12px #0006}
#acts{position:fixed;right:calc(16px*var(--ui));bottom:calc(22px*var(--ui) + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:flex-end;gap:calc(10px*var(--ui));z-index:10}
.abtn{width:calc(70px*var(--ui));height:calc(70px*var(--ui));border-radius:50%;font-size:calc(28px*var(--ui));background:var(--card);border:2px solid rgba(255,255,255,.25);color:#fff;box-shadow:0 6px 18px #0005}
.abtn small{display:block;font-size:calc(10px*var(--ui));font-weight:700;margin-top:-2px}
#btnGorev{width:auto;height:calc(60px*var(--ui));border-radius:999px;padding:0 calc(22px*var(--ui));font-size:calc(18px*var(--ui));font-weight:800;background:linear-gradient(135deg,#ffd257,#f49b22);color:#3a2300;border:0;animation:nabiz 1.1s infinite}
@keyframes nabiz{50%{transform:scale(1.07)}}
.row{display:flex;gap:calc(10px*var(--ui))}
/* toast */
#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);opacity:0;transition:.35s;font-size:calc(40px*var(--ui));font-weight:900;text-shadow:0 4px 0 #0005,0 0 24px #f4b322;color:#fff;z-index:30;pointer-events:none;text-align:center;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#mini{position:fixed;left:50%;bottom:calc(110px*var(--ui));transform:translateX(-50%);background:var(--card);padding:8px 16px;border-radius:12px;font-size:calc(14px*var(--ui));z-index:30;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
#mini.on{opacity:1}
/* ---------- modals ---------- */
.modal{position:fixed;inset:0;background:rgba(5,10,25,.6);display:flex;align-items:center;justify-content:center;z-index:40;padding:12px}
.box{background:linear-gradient(160deg,#1b2d57,#0f1a35);border:1px solid rgba(255,255,255,.15);border-radius:22px;width:min(560px,96vw);max-height:92vh;overflow:auto;padding:calc(18px*var(--ui));box-shadow:0 20px 60px #0008;position:relative;font-size:calc(15px*var(--ui))}
.box.wide{width:min(760px,97vw)}
.box h2{margin:0 0 6px;font-size:calc(22px*var(--ui))}
.box p{margin:6px 0;line-height:1.45;color:#dbe4ff}
.x{position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;font-size:18px}
.btn{background:linear-gradient(135deg,#3d7cf0,#2552c7);color:#fff;border-radius:14px;padding:calc(12px*var(--ui)) calc(18px*var(--ui));font-size:calc(16px*var(--ui));font-weight:800;box-shadow:0 4px 0 #173a8f}
.btn.gold{background:linear-gradient(135deg,#ffd257,#f49b22);color:#3a2300;box-shadow:0 4px 0 #b06a0a}
.btn.ghost{background:rgba(255,255,255,.1);box-shadow:none;font-weight:700}
.btn:active{transform:translateY(2px)}
input,select{width:100%;padding:12px 14px;border-radius:12px;border:2px solid rgba(255,255,255,.2);background:rgba(0,0,0,.25);color:#fff;font-size:16px;font-family:inherit;margin:6px 0}
select option{color:#000}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.srow button{min-width:120px}
.tag{display:inline-block;background:rgba(244,179,34,.18);color:#ffd36b;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;margin:2px}
/* login */
#giris{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 20%,#2f5fbf 0,#13244c 55%,#08122a 100%);padding:14px;overflow:auto}
#giris .box{text-align:center;width:min(480px,96vw)}
#girisFoto{width:120px;height:120px;border-radius:50%;object-fit:cover;object-position:50% 38%;border:5px solid var(--gold);box-shadow:0 0 0 6px #14213d,0 0 40px #f4b32288;margin-top:4px}
.logo{font-weight:900;letter-spacing:2px;color:var(--gold);font-size:13px;margin-top:6px}
.title{font-size:calc(30px*var(--ui));font-weight:900;line-height:1.05;margin:8px 0 2px;background:linear-gradient(180deg,#fff,#ffd56a);-webkit-background-clip:text;background-clip:text;color:transparent}
/* chess */
.cb{display:grid;grid-template-columns:repeat(8,1fr);width:min(400px,86vw,52vh);aspect-ratio:1;margin:10px auto;border:6px solid #5a3a1e;border-radius:8px;overflow:hidden}
.cb div{display:grid;place-items:center;font-size:min(38px,8vw);line-height:1;position:relative}
.cb .l{background:#f0d9b5}.cb .d{background:#b58863}
.cb .sel{box-shadow:inset 0 0 0 4px #2f6fd6}
.cb .hint{box-shadow:inset 0 0 0 4px #f4b322}
.cb .w{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 2px 3px #000}
.cb .b{color:#111;text-shadow:0 0 2px #fff}
/* robot grid */
.rg{display:grid;gap:4px;margin:10px auto;width:min(420px,88vw,40vh)}
.rg div{aspect-ratio:1;border-radius:10px;background:#21386b;display:grid;place-items:center;font-size:min(30px,7vw,5vh);transition:.2s}
.rg .wall{background:#5b3a2a}
.cmds{display:flex;flex-wrap:wrap;gap:6px;min-height:46px;background:rgba(0,0,0,.25);border-radius:12px;padding:6px;margin:8px 0}
.cmds span{background:#2f6fd6;border-radius:8px;padding:6px 10px;font-weight:800;font-size:18px}
.cmds span.now{background:#f4b322;color:#3a2300}
.pal button{font-size:22px;padding:10px 14px;margin:3px;border-radius:12px;background:#24427e;color:#fff;font-weight:800}
/* quiz */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opts button{padding:16px 8px;font-size:calc(20px*var(--ui));font-weight:800;border-radius:14px;background:#24427e;color:#fff;border:2px solid rgba(255,255,255,.15)}
.opts button.ok{background:#1f9d55}.opts button.no{background:#b4415a}
.q{font-size:calc(24px*var(--ui));font-weight:800;text-align:center;margin:14px 0 4px}
.prog{height:10px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#ffd257,#f49b22);transition:.3s}
/* ai lab */
.item{font-size:56px;text-align:center;margin:8px 0}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bins button{padding:16px;border-radius:16px;font-size:18px;font-weight:800;color:#fff}
.biliyor{background:rgba(47,111,214,.2);border-left:4px solid #5b9bff;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}
/* site iframe */
#siteKatman{position:fixed;inset:0;z-index:60;background:#fff;display:flex;flex-direction:column}
#siteKatman iframe{flex:1;border:0;width:100%}
#siteKatman .bar{background:#14213d;padding:8px;display:flex;gap:8px}
/* çocuk boyu */
body.cocukBoyu #hud{top:auto;bottom:calc(160px*var(--ui));flex-wrap:wrap;justify-content:center}
body.cocukBoyu #hud .sp{display:none}
body.cocukBoyu #gorev{top:auto;bottom:calc(220px*var(--ui))}
body.cocukBoyu .modal{align-items:flex-end}
body.cocukBoyu .box{max-height:62vh}
body.cocukBoyu #toast{top:60%}
#cbRozet{position:fixed;left:8px;bottom:4px;font-size:11px;opacity:.5;z-index:11;pointer-events:none}
#yukleniyor{position:fixed;inset:0;z-index:45;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b1630;gap:12px;font-weight:700}
.spin{width:46px;height:46px;border-radius:50%;border:5px solid rgba(255,255,255,.2);border-top-color:var(--gold);animation:dn 1s linear infinite}
@keyframes dn{to{transform:rotate(360deg)}}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px;border-bottom:1px solid rgba(255,255,255,.1);text-align:left}
#sertifika canvas{width:100%;border-radius:12px;display:block}
</style>
</head>

<canvas id="c"></canvas>

<!-- HUD -->
<div id="hud" class="hidden">
  <button class="pill ibtn" id="bHome" title="Ana menü">🏠</button>
  <div class="pill"><img id="avatar" alt=""><span>Poyraz</span></div>
  <div class="pill">⭐ <span id="yildiz">0</span></div>
  <div class="pill" id="badges"><span title="Satranç">♟️</span><span title="Robotik">🤖</span><span title="Akıl-Zekâ">🧠</span><span title="Yapay Zekâ">💡</span></div>
  <div class="sp"></div>
  <button class="pill ibtn" id="bKam" title="Kamera">🎥</button>
  <button class="pill ibtn" id="bSes" title="Ses">🔊</button>
  <button class="pill ibtn" id="bAyar" title="Ayarlar">⚙️</button>
</div>
<div id="gorev" class="hidden"></div>
<div id="joy" class="hidden"><div id="knob"></div></div>
<div id="acts" class="hidden">
  <button id="btnGorev" class="hidden">▶ Göreve Başla</button>
  <div class="row">
    <button class="abtn" id="bSut">⚽<small>ŞUT</small></button>
    <button class="abtn" id="bZipla">⤴️<small>ZIPLA</small></button>
  </div>
</div>
<div id="toast"></div>
<div id="mini"></div>
<div id="cbRozet" class="hidden">📏 Çocuk Boyu</div>
<div id="modal" class="modal hidden"><div class="box" id="mbox"></div></div>

<!-- GİRİŞ -->
<div id="giris">
  <div class="box">
    <img id="girisFoto" alt="Poyraz">
    <div class="logo">DEĞİŞİM KOLEJİ • ROBOTİK • SATRANÇ • AKIL-ZEKÂ</div>
    <div class="title">Poyraz'ın<br>Büyük Macerası</div>
    <p>Poyraz'la birlikte okulun 4 görevini tamamla, yıldızları topla ve kürsüde <b style="color:#ffd36b">altın madalyayı</b> kazan!</p>
    <input id="gAd" placeholder="Adın ve soyadın" autocomplete="off" maxlength="40">
    <select id="gSinif"><option value="">Sınıfını seç</option></select>
    <button class="btn gold" id="gBasla" style="width:100%;margin-top:8px;font-size:20px">🚀 Maceraya Başla</button>
    <p id="gUyari" style="color:#ffb4b4;min-height:20px;font-size:14px"></p>
    <button class="btn ghost" id="gOgretmen" style="font-size:13px">👨‍🏫 Öğretmen Paneli</button>
  </div>
</div>
<div id="yukleniyor" class="hidden"><div class="spin"></div><div id="yukMesaj">Değişim Koleji hazırlanıyor…</div></div>
