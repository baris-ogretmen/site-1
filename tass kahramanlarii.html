<style>
:root{
  --gok1:#140f3a;--gok2:#2c1868;--gok3:#5b2bb0;
  --mor:#6d28d9;--mor2:#8b5cf6;--altin:#f5b301;--altin2:#ffd451;
  --krem:#f7ead0;--bal:#c98a4b;--bal2:#a86a32;--cerceve:#5a3418;
  --yesil:#22c55e;--kirmizi:#ef4444;--mavi:#3b82f6;--turuncu:#f97316;
  --yazi:#1f1640;--beyaz:#fff;
  --f:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --tahta:min(70vh,52vw);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--f);font-weight:800;color:var(--beyaz);background:var(--gok1);
  font-variant-numeric:lining-nums tabular-nums;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:var(--f);font-weight:800;cursor:pointer;border:0;color:inherit}
@media print{html{zoom:1!important}}

/* ===== Gökyüzü sahnesi (özgün: akşam masal adası) ===== */
#gok{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 110%,#ff9a62 0%,#e3577f 18%,#7b3bb5 42%,var(--gok2) 68%,var(--gok1) 100%)}
#gok .yildiz{position:absolute;border-radius:50%;background:#fff;animation:pir 3s ease-in-out infinite}
@keyframes pir{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
#gok .ada{position:absolute;bottom:-4vh;width:46vw;height:20vh;border-radius:50% 50% 0 0/100% 100% 0 0;
  background:linear-gradient(#3c2a7d,#24184f);opacity:.75}
#gok .ada.a1{left:-8vw;height:24vh}#gok .ada.a2{right:-10vw;width:52vw;height:18vh;opacity:.6}
#gok .ay{position:absolute;right:9vw;top:9vh;width:9vh;height:9vh;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fffbe8,#ffe7a3 60%,#f6c56b);box-shadow:0 0 6vh #ffe7a399}
#gok .bulut{position:absolute;height:5vh;border-radius:5vh;background:#ffffff1c;filter:blur(1px);animation:bulut 60s linear infinite}
@keyframes bulut{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
#gok .kare-desen{position:absolute;inset:0;opacity:.05;
  background-image:linear-gradient(45deg,#fff 25%,transparent 25%,transparent 75%,#fff 75%),linear-gradient(45deg,#fff 25%,transparent 25%,transparent 75%,#fff 75%);
  background-size:8vh 8vh;background-position:0 0,4vh 4vh;mask-image:linear-gradient(transparent,#000 60%,transparent)}

/* ===== Ekranlar ===== */
.ekran{position:fixed;inset:0;z-index:5;display:none;flex-direction:column}
.ekran.acik{display:flex}

/* ===== Menü ===== */
#menu{align-items:center;padding:calc(env(safe-area-inset-top) + 1.6vh) 2vw 1.6vh}
.logo{display:flex;align-items:center;gap:1.2vw;margin-top:.6vh}
.logo h1{font-weight:900;font-size:clamp(26px,5.2vh,64px);line-height:1;letter-spacing:.5px;
  background:linear-gradient(180deg,#fff7d6 0%,#ffd451 45%,#f59e0b 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 .4vh 0 #7a3b00) drop-shadow(0 1vh 1.2vh #0007)}
.logo .alt{display:block;font-size:clamp(13px,2.2vh,26px);color:#e9dcff;font-weight:800;margin-top:.6vh;letter-spacing:.3px}
.kahraman-sira{display:flex;gap:.8vw;align-items:flex-end;height:19vh;margin:1.4vh 0 0}
.kahraman-sira .k{height:100%;aspect-ratio:3/4;animation:hop 2.4s ease-in-out infinite;cursor:pointer;filter:drop-shadow(0 .8vh .6vh #0006)}
.kahraman-sira .k:nth-child(2){animation-delay:.2s}.kahraman-sira .k:nth-child(3){animation-delay:.4s}
.kahraman-sira .k:nth-child(4){animation-delay:.6s}.kahraman-sira .k:nth-child(5){animation-delay:.8s}.kahraman-sira .k:nth-child(6){animation-delay:1s}
@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-1.2vh) rotate(-3deg)}55%{transform:translateY(-1.2vh) rotate(3deg)}}
.selam{font-size:clamp(14px,2.3vh,28px);color:#fff;background:#ffffff18;border:1px solid #ffffff30;padding:.6vh 1.6vw;border-radius:99px;margin:.8vh 0}
.selam b{color:var(--altin2)}
.kartlar{flex:1;width:min(1500px,96vw);display:grid;grid-template-columns:repeat(4,1fr);gap:1.4vh 1.2vw;align-content:center;padding-bottom:1vh}
.kart{position:relative;border-radius:2.4vh;padding:1.6vh 1.2vw 1.4vh;text-align:left;min-height:15vh;overflow:hidden;
  background:linear-gradient(160deg,var(--k1),var(--k2));box-shadow:0 .7vh 0 var(--k3),0 1.6vh 2.4vh #0006;transition:transform .15s}
.kart:active{transform:translateY(.5vh);box-shadow:0 .2vh 0 var(--k3),0 .8vh 1.2vh #0006}
.kart:hover{transform:translateY(-.3vh)}
.kart .ik{font-size:clamp(28px,5vh,60px);line-height:1;filter:drop-shadow(0 .3vh 0 #0003)}
.kart .ad{display:block;font-weight:900;font-size:clamp(16px,2.6vh,32px);margin-top:.6vh;text-shadow:0 .2vh 0 #0004}
.kart .ac{display:block;font-weight:700;font-size:clamp(12px,1.75vh,21px);opacity:.95;margin-top:.3vh;line-height:1.25}
.kart .rozet{position:absolute;right:1vw;top:1.2vh;background:#0004;border-radius:99px;padding:.3vh .8vw;font-size:clamp(11px,1.6vh,19px)}
.kart.kilit{filter:grayscale(.6) brightness(.8)}
.kart.kilit::after{content:'🔒 ' attr(data-kilit);position:absolute;inset:auto .8vw 1vh auto;font-size:clamp(11px,1.5vh,18px);background:#0006;padding:.2vh .7vw;border-radius:99px}
.menu-alt{display:flex;gap:.8vw;flex-wrap:wrap;justify-content:center;padding-bottom:calc(env(safe-area-inset-bottom) + .4vh)}
.soluk{background:#ffffff14;border:1px solid #ffffff26;color:#f3eaff;padding:.9vh 1.1vw;border-radius:99px;font-size:clamp(12px,1.75vh,21px);opacity:.75}
.soluk:hover{opacity:1}
.soluk.dön{background:#22c55e33;border-color:#22c55e88;opacity:.95}

/* ===== Oyun ekranı ===== */
#oyun{padding:calc(env(safe-area-inset-top) + .8vh) 1.4vw calc(env(safe-area-inset-bottom) + .8vh)}
.ust{display:flex;align-items:center;gap:1vw;min-height:7vh}
.ust .baslik{font-weight:900;font-size:clamp(16px,3vh,36px);white-space:nowrap}
.ust .gorev{flex:1;font-size:clamp(14px,2.4vh,30px);background:#ffffff16;border:1px solid #ffffff28;border-radius:1.6vh;padding:.8vh 1.2vw;line-height:1.25}
.ust .puan{display:flex;gap:.6vw}
.ust .puan span{background:#0005;border-radius:99px;padding:.6vh 1vw;font-size:clamp(14px,2.4vh,30px);white-space:nowrap}
.sahne{flex:1;display:flex;gap:1.6vw;align-items:center;justify-content:center;min-height:0;padding:.8vh 0}
.tahta-kap{position:relative;width:var(--tahta);height:var(--tahta);flex:none}
.cerceve{position:absolute;inset:0;border-radius:1.6vh;padding:calc(var(--tahta)*.045);
  background:
   repeating-linear-gradient(92deg,#ffffff08 0 2px,transparent 2px 9px),
   linear-gradient(145deg,#8a5427,var(--cerceve) 45%,#3d2210);
  box-shadow:inset 0 0 0 .35vh #e2b06f88,inset 0 .6vh 1vh #ffffff22,0 2vh 3vh #000a,0 .6vh 0 #2a1608}
.koord{position:absolute;color:#f3d6a6;font-size:calc(var(--tahta)*.028);font-weight:900;display:flex;opacity:.9}
.koord.h{left:calc(var(--tahta)*.045);right:calc(var(--tahta)*.045);bottom:calc(var(--tahta)*.006)}
.koord.h span{flex:1;text-align:center}
.koord.v{top:calc(var(--tahta)*.045);bottom:calc(var(--tahta)*.045);left:calc(var(--tahta)*.008);flex-direction:column;width:calc(var(--tahta)*.03)}
.koord.v span{flex:1;display:flex;align-items:center;justify-content:center}
.tahta{position:relative;width:100%;height:100%;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
  border-radius:.4vh;overflow:hidden;box-shadow:0 0 0 .3vh #2a1608}
.kr{position:relative}
.kr.a{background:
   repeating-linear-gradient(80deg,#ffffff10 0 1px,transparent 1px 7px),
   linear-gradient(135deg,#fbf0d8,#f1dfb8)}
.kr.k{background:
   repeating-linear-gradient(80deg,#00000010 0 1px,transparent 1px 6px),
   linear-gradient(135deg,#d39a5e,#b97a3e)}
.kr.son::before{content:'';position:absolute;inset:0;background:#facc1566}
.kr.sec::before{content:'';position:absolute;inset:0;background:#60a5fa77;box-shadow:inset 0 0 0 .5vh #2563eb}
.kr.sah::before{content:'';position:absolute;inset:0;background:radial-gradient(circle,#ef4444cc,#ef444400 70%)}
.kr.yol::before{content:'';position:absolute;inset:0;background:#22c55e88;animation:yolp .9s ease-out}
@keyframes yolp{from{background:#22c55e00;transform:scale(.4)}to{background:#22c55e88;transform:scale(1)}}
.kr.hedef::after{content:'';position:absolute;left:36%;top:36%;width:28%;height:28%;border-radius:50%;background:#16a34acc;box-shadow:0 0 0 .3vh #ffffffaa}
.kr.hedef.alim::after{left:6%;top:6%;width:88%;height:88%;background:transparent;box-shadow:inset 0 0 0 .55vh #16a34acc}
.kr.imlec{box-shadow:inset 0 0 0 .55vh #f472b6}
.kr.ipucu::before{content:'';position:absolute;inset:0;background:#f5b30199;animation:nab 1s infinite}
.kr.yanlis::before{content:'';position:absolute;inset:0;background:#ef444488;animation:nab .5s 2}
.kr.dogru::before{content:'';position:absolute;inset:0;background:#22c55e99}
@keyframes nab{50%{opacity:.35}}
.katman{position:absolute;inset:calc(var(--tahta)*.045);pointer-events:none}
.tas{position:absolute;width:12.5%;height:12.5%;display:flex;align-items:flex-end;justify-content:center;z-index:2}
.tas svg{width:96%;height:118%;margin-bottom:6%;overflow:visible;filter:drop-shadow(0 .5vh .3vh #0006)}
.tas.ucuyor{z-index:5}
.tas.dusuyor svg{animation:dus .5s ease-in forwards}
@keyframes dus{0%{transform:rotate(0)}60%{transform:rotate(80deg) translate(10%,8%)}80%{transform:rotate(74deg) translate(10%,8%)}100%{transform:rotate(82deg) translate(10%,9%)}}
.esya{position:absolute;width:12.5%;height:12.5%;display:flex;align-items:center;justify-content:center;z-index:1}
.esya svg{width:74%;height:74%}
.esya.yildiz svg{animation:ydon 2.4s ease-in-out infinite}
@keyframes ydon{50%{transform:scale(1.12) rotate(10deg)}}
.esya.patla{animation:patla .45s forwards}
@keyframes patla{to{transform:scale(2);opacity:0}}

.toz i{position:absolute;left:50%;bottom:12%;width:12%;height:12%;border-radius:50%;background:#fff6;animation:toz .55s ease-out forwards}
@keyframes toz{to{transform:translate(var(--dx),var(--dy)) scale(2.2);opacity:0}}
.balon-tahta{position:absolute;left:50%;top:6%;transform:translateX(-50%);z-index:8;background:#fff;color:var(--yazi);

@keyframes bt{from{transform:translateX(-50%) scale(.3)}}
.ok-svg{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:visible}

/* ===== Yan panel: karakter + konuşma ===== */
.yan{width:min(34vw,60vh);height:var(--tahta);display:flex;flex-direction:column;justify-content:flex-end;gap:1vh;flex:none}
.konusma{position:relative;background:#fff;color:var(--yazi);border-radius:2.4vh;padding:1.6vh 1.4vw;font-size:clamp(15px,2.55vh,32px);line-height:1.32;
  box-shadow:0 .8vh 0 #d9cff5,0 1.8vh 2.4vh #0005;min-height:9vh}
.konusma::after{content:'';position:absolute;left:18%;bottom:-2vh;border:1.2vh solid transparent;border-top:1.6vh solid #fff}
.konusma b{color:var(--mor)}.konusma .y{color:#15803d}.konusma .k{color:#dc2626}
.konusma .ad{display:block;font-size:.72em;color:#7c3aed;letter-spacing:.4px;margin-bottom:.3vh}
.karakter-kutu{height:30vh;display:flex;align-items:flex-end;gap:.4vw}
.karakter-kutu .buyuk{height:100%;aspect-ratio:3/4;animation:nefes 3s ease-in-out infinite;filter:drop-shadow(0 1.4vh 1vh #0007)}
.karakter-kutu .buyuk.konusuyor{animation:konus .35s ease-in-out infinite}
@keyframes nefes{50%{transform:translateY(-.8vh) scale(1.015)}}
@keyframes konus{50%{transform:translateY(-.5vh) rotate(-1.5deg)}}
.bilgi-kutu{flex:1;display:flex;flex-direction:column;gap:.8vh;justify-content:flex-end;min-width:0}
.cip{background:#ffffff1c;border:1px solid #ffffff30;border-radius:1.4vh;padding:.8vh .9vw;font-size:clamp(13px,2vh,25px);line-height:1.25}
.cip b{color:var(--altin2)}
.hamleler{max-height:16vh;overflow:auto;font-size:clamp(12px,1.9vh,23px);background:#0003;border-radius:1.2vh;padding:.6vh .8vw;line-height:1.5}
.secenekler{display:grid;grid-template-columns:1fr 1fr;gap:1vh .8vw}
.secenekler.tek{grid-template-columns:1fr}
.sec-btn{background:#fff;color:var(--yazi);border-radius:1.8vh;padding:1.6vh 1vw;font-size:clamp(17px,2.7vh,34px);box-shadow:0 .6vh 0 #c4b5fd;text-align:center;line-height:1.2}
.sec-btn .e{font-size:1.5em;display:block;line-height:1.1}
.sec-btn.dogru{background:#bbf7d0;box-shadow:0 .6vh 0 #16a34a}
.sec-btn.yanlis{background:#fecaca;box-shadow:0 .6vh 0 #dc2626;animation:sars .4s}
@keyframes sars{25%{transform:translateX(-1vw)}75%{transform:translateX(1vw)}}

/* ===== Alt kontrol çubuğu ===== */
.alt{display:flex;gap:.7vw;align-items:center;justify-content:center;flex-wrap:wrap;padding-top:.4vh}
.dg{background:linear-gradient(#fff,#efe8ff);color:var(--yazi);border-radius:1.8vh;padding:1.2vh 1.4vw;font-size:clamp(14px,2.3vh,28px);
  box-shadow:0 .55vh 0 #a78bfa,0 1vh 1.4vh #0004;min-height:6.4vh;display:inline-flex;align-items:center;gap:.5vw;white-space:nowrap}
.dg:active{transform:translateY(.4vh);box-shadow:0 .15vh 0 #a78bfa}
.dg.ana{background:linear-gradient(#ffe27a,#f5b301);box-shadow:0 .55vh 0 #b45309,0 1vh 1.4vh #0004}
.dg.yesil{background:linear-gradient(#86efac,#22c55e);box-shadow:0 .55vh 0 #15803d,0 1vh 1.4vh #0004}
.dg.don{background:linear-gradient(#bbf7d0,#4ade80);box-shadow:0 .55vh 0 #15803d}
.dg[disabled]{opacity:.45;pointer-events:none}

/* ===== Pencereler ===== */
.perde{position:fixed;inset:0;z-index:50;background:#0b0620cc;backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:2vh 2vw}
.perde.acik{display:flex}
.pencere{background:linear-gradient(170deg,#fff,#f4efff);color:var(--yazi);border-radius:3vh;padding:2.4vh 2vw;width:min(900px,94vw);max-height:92vh;overflow:auto;
  box-shadow:0 1vh 0 #c4b5fd,0 3vh 6vh #000a;font-size:clamp(15px,2.3vh,28px);line-height:1.4;animation:pac .3s}
@keyframes pac{from{transform:scale(.85);opacity:0}}
.pencere h2{font-weight:900;font-size:clamp(20px,3.6vh,44px);color:var(--mor);margin-bottom:1vh}
.pencere h3{font-weight:900;color:#7c3aed;margin:1.2vh 0 .4vh;font-size:1.05em}
.pencere p,.pencere li{font-weight:700}
.pencere ol,.pencere ul{padding-left:1.4em;margin:.6vh 0}
.pencere .dgler{display:flex;gap:.8vw;flex-wrap:wrap;justify-content:center;margin-top:1.6vh}
.pencere>.dgler:last-child{position:sticky;bottom:-2.4vh;background:linear-gradient(transparent,#f4efff 30%);padding:1.4vh 0 1.2vh;margin-bottom:-1vh}
.sinif-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1vh .8vw;margin-top:1vh}
.sinif-grid button{background:#ede9fe;border-radius:1.8vh;padding:1.6vh .4vw;font-size:clamp(14px,2.3vh,28px);color:var(--yazi);box-shadow:0 .5vh 0 #c4b5fd}
.sinif-grid button.sec{background:var(--mor);color:#fff;box-shadow:0 .5vh 0 #3b0f8c}
.sinif-grid button .e{display:block;font-size:1.6em}
.kupa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1vh}
.kupa{background:#fff;border-radius:1.8vh;padding:1.2vh;text-align:center;box-shadow:0 .4vh 0 #ddd6fe;font-size:.85em}
.kupa .e{font-size:2.2em;display:block}
.kupa.yok{opacity:.35;filter:grayscale(1)}
.ilerleme{height:1.2vh;background:#ede9fe;border-radius:99px;overflow:hidden;margin:.4vh 0 1vh}
.ilerleme i{display:block;height:100%;background:linear-gradient(90deg,#a78bfa,#f5b301)}
.seviye-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:1vh .8vw;margin-top:1vh}
.seviye-grid button{overflow-wrap:anywhere;hyphens:auto;line-height:1.2;background:#fff;color:var(--yazi);border-radius:1.8vh;padding:1.2vh .5vw;box-shadow:0 .5vh 0 #c4b5fd;font-size:clamp(14px,2.2vh,26px)}
.seviye-grid button small{display:block;color:#f59e0b;font-size:.85em;letter-spacing:1px}
.seviye-grid button.kilitli{opacity:.4;pointer-events:none}
.tas-sec{display:grid;grid-template-columns:repeat(6,1fr);gap:1vh .6vw;margin-top:1vh}
.tas-sec button{background:#fff;border-radius:2vh;padding:1vh .3vw .8vh;box-shadow:0 .5vh 0 #c4b5fd;color:var(--yazi);font-size:clamp(12px,1.9vh,23px)}
.tas-sec button svg{width:100%;height:12vh}
.tas-sec button small{display:block;color:#a16207}

/* ===== Taş Dizme tepsisi ===== */
.tepsi{display:grid;grid-template-columns:repeat(3,1fr);gap:.8vh .6vw}
.tepsi button{background:#ffffffee;border-radius:1.6vh;padding:.4vh .2vw;color:var(--yazi);position:relative;box-shadow:0 .5vh 0 #c4b5fd;font-size:clamp(12px,1.8vh,22px)}
.tepsi button svg{width:100%;height:8.5vh}
.tepsi button.sec{outline:.5vh solid var(--altin);background:#fff7d6}
.tepsi button .say{position:absolute;right:.4vw;top:.3vh;background:var(--mor);color:#fff;border-radius:99px;padding:0 .6vw;font-size:.9em}
.tepsi button[disabled]{opacity:.3}

/* ===== Tost, kutlama, Sıra Sende ===== */
#tost{position:fixed;left:50%;top:2vh;transform:translateX(-50%);z-index:90;background:#1f1640ee;color:#fff;padding:1vh 1.6vw;border-radius:99px;
  font-size:clamp(14px,2.3vh,28px);opacity:0;transition:.3s;pointer-events:none;border:1px solid #ffffff33;max-width:92vw;text-align:center}
#tost.acik{opacity:1}
#konfeti{position:fixed;inset:0;z-index:80;pointer-events:none}
.patlama{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;pointer-events:none}
.patlama.acik{display:flex}
.patlama .yazi{position:relative;font-weight:900;color:#3b1a00;font-size:clamp(34px,9vh,120px);text-align:center;line-height:1;padding:7vh 6vw;
  background:#ffd451;clip-path:polygon(50% 0,61% 16%,80% 6%,78% 27%,98% 30%,84% 47%,100% 62%,79% 66%,84% 88%,63% 80%,50% 100%,38% 81%,17% 90%,21% 67%,0 62%,16% 47%,3% 29%,22% 27%,19% 6%,39% 16%);
  animation:sp .6s cubic-bezier(.2,1.6,.4,1);filter:drop-shadow(0 1vh 0 #b45309)}
@keyframes sp{from{transform:scale(0) rotate(-20deg)}}

/* ===== Sürüm rozeti / banner / güncelleme ===== */
#surum-banner{pointer-events:none;position:fixed;left:50%;top:8vh;transform:translateX(-50%);z-index:95;background:#0f172aee;color:#e2e8f0;border:1px solid #334155;
  border-radius:1.4vh;padding:.8vh 1.2vw;font-size:clamp(12px,1.8vh,21px);display:none;gap:1vw;align-items:center;max-width:94vw}
#surum-banner.acik{display:flex}
#surum-rozet{position:fixed;left:.6vw;bottom:.6vh;z-index:40;background:#0006;color:#d1fae5;border-radius:99px;padding:.3vh .7vw;font-size:clamp(10px,1.4vh,16px);opacity:.55}
#yeni-surum{position:fixed;right:1vw;top:1vh;z-index:96;display:none;background:#dc2626;color:#fff;border-radius:99px;padding:.8vh 1.2vw;font-size:clamp(13px,2vh,24px);animation:nab 1.2s infinite;box-shadow:0 0 0 .4vh #fca5a566}
#yeni-surum.acik{display:inline-flex;gap:.6vw;align-items:center}
#yeni-surum i{font-style:normal;opacity:.8;padding-left:.5vw}
#yan-cevir{position:fixed;inset:0;z-index:99;background:var(--gok1);display:none;align-items:center;justify-content:center;flex-direction:column;gap:2vh;text-align:center;padding:4vw;font-size:20px}
@media (orientation:portrait) and (max-width:700px){#yan-cevir.goster{display:flex}}

/* ===== Dik ekran / küçük ekran uyumu ===== */
@media (orientation:portrait){
  #menu,#oyun{overflow-y:auto}
  .sahne{flex:none;flex-direction:column;gap:1vh}
  .yan{width:94vw;height:auto!important;flex-direction:column}
  .karakter-kutu{max-height:13vh!important;min-height:0}
  .kartlar{flex:none;grid-template-columns:repeat(2,1fr)}
  .kart{min-height:11vh}
  .ust{flex-wrap:wrap}
  .kahraman-sira{height:11vh}
}
@media (max-height:520px){
  .kahraman-sira{display:none}
  .kart{min-height:12vh;padding:1vh 1vw}
  .kart .ac{display:none}
}

/* ===== 🧒 Çocuk boyu: dokunulan her şey altta ===== */
body.cocuk-boyu #menu .kartlar{align-content:end}
body.cocuk-boyu .sahne{align-items:flex-end}
body.cocuk-boyu .yan{justify-content:flex-end}
body.cocuk-boyu .perde{align-items:flex-end;padding-bottom:1vh}
body.cocuk-boyu .pencere{max-height:62vh}
body.cocuk-alcak .pencere{max-height:50vh}
body.cocuk-alcak #menu .kahraman-sira{height:10vh}
body.cocuk-alcak #menu .kartlar{flex:none;margin-top:auto;grid-template-columns:repeat(4,1fr);gap:1vh .6vw}
body.cocuk-alcak #menu .kart{min-height:10vh;padding:1vh .7vw}
body.cocuk-alcak #menu .kart .ac{display:none}
body.cocuk-boyu .ust .gorev{pointer-events:none}
body.cocuk-boyu .kahraman-sira,body.cocuk-boyu .selam{pointer-events:none}
body.cocuk-boyu #surum-banner{top:auto;bottom:12vh}
.sembol{display:inline-block;height:1.5em;width:1.15em;vertical-align:-.35em}.sembol svg{width:100%;height:100%}
.sec-btn .coklu{display:flex;justify-content:center;gap:.3vw}.sec-btn .coklu svg{height:11vh;width:auto}

/* --- tek taşın (motorsuz) hareket hedefleri: yıldız/kaya/alma oyunları için --- */
// engel(i): '' boş | 'kaya' | 'yildiz' | 'rakip' | 'dost'
function tekHedef(tp, sq, engel, beyaz = true) {
  const r = sq >> 3, c = sq & 7, o = [];
  const ic = (rr, cc) => rr >= 0 && rr < 8 && cc >= 0 && cc < 8;
  const alinir = x => x === 'yildiz' || x === 'rakip';
  if (tp === 'p') {
    const d = beyaz ? -1 : 1, bas = beyaz ? 6 : 1;
    if (ic(r + d, c) && !engel((r + d) * 8 + c)) { o.push((r + d) * 8 + c); if (r === bas && ic(r + 2 * d, c) && !engel((r + 2 * d) * 8 + c)) o.push((r + 2 * d) * 8 + c); }
    for (const dc of [-1, 1]) if (ic(r + d, c + dc) && alinir(engel((r + d) * 8 + c + dc))) o.push((r + d) * 8 + c + dc);
    return o;
  }
  const AT = [[-2, -1], [-2, 1], [-1, -2], [-1, 2], [1, -2], [1, 2], [2, -1], [2, 1]];
  const D = [[-1, 0], [1, 0], [0, -1], [0, 1]], C = [[-1, -1], [-1, 1], [1, -1], [1, 1]];
  if (tp === 'n' || tp === 'k') {
    for (const [dr, dc] of tp === 'n' ? AT : D.concat(C)) { const rr = r + dr, cc = c + dc; if (!ic(rr, cc)) continue; const x = engel(rr * 8 + cc); if (!x || alinir(x)) o.push(rr * 8 + cc); }
    return o;
  }
  for (const [dr, dc] of tp === 'r' ? D : tp === 'b' ? C : D.concat(C)) {
    let rr = r + dr, cc = c + dc;
    while (ic(rr, cc)) { const x = engel(rr * 8 + cc); if (x) { if (alinir(x)) o.push(rr * 8 + cc); break; } o.push(rr * 8 + cc); rr += dr; cc += dc; }
  }
  return o;
}

/* ---------------- ortak: motorlu tahta etkileşimi ---------------- */
function motorTiklayici(o) { // o: {s(), oyuncu(s)->bool, hamle(m)}
  let sec = null;
  return {
    sifirla() { sec = null; },
    async onKare(i) {
      if (T.kilit) return; const s = o.s(); const p = s.b[i];
      if (sec !== null) {
        const ms = E.yasal(s, sec).filter(m => m.t === i);
        if (ms.length) {
          let m = ms[0]; if (ms.length > 1 && ms[0].pr) { const pr = await terfiSec(s.t === 'w'); m = ms.find(x => x.pr === pr) || ms[0]; }
          sec = null; T.temizle('sec', 'hedef', 'alim'); o.hamle(m); return;
        }
      }
      if (p && E.renk(p) === s.t && o.oyuncu(s)) {
        sec = i; T.temizle('sec', 'hedef', 'alim'); T.isaret('sec', [i]); const ms = E.yasal(s, i); T.hedefler(ms, s.b);
        if (!ms.length) Efekt.tost(E.sahAltinda(s) ? '⚠️ Şah tehdit altında! Önce şahı kurtar.' : 'Bu taş şu an hiçbir yere gidemiyor.');
        Ses.tik();
      } else if (sec !== null) { sec = null; T.temizle('sec', 'hedef', 'alim'); T.isaret('yanlis', [i]); setTimeout(() => T.temizle('yanlis'), 500); }
    }
  };
}
async function hamleCiz(s, m) { // motor hamlesini tahtada canlandır
  if (m.ep) T.tasSil(m.t + (s.t === 'w' ? 8 : -8), 'ucur');
  await T.tasTasi(m.f, m.t, { zipla: E.tip(m.p) === 'n' });
  if (m.x) Ses.al();
  if (m.rok === 'k') await T.tasTasi(m.t + 1, m.t - 1, { zipla: true, sure: 300 });
  if (m.rok === 'v') await T.tasTasi(m.t - 2, m.t + 1, { zipla: true, sure: 300 });
  if (m.pr) { T.tasDegistir(m.t, m.pr); Ses.yildiz(); }
}
