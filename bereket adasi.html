<style>
:root{
  --krem:#fff4dc;--krem2:#fbe6bf;--kahve:#7a4a22;--kahve2:#a86a35;--turuncu:#e8833a;--yesil:#4caf50;--mavi:#2f8fd8;
  --golge:0 4px 0 rgba(90,50,20,.35),0 8px 18px rgba(0,0,0,.18);--egt-z:1;
  --font:'Baloo 2',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#7fc4e8;font-family:var(--font);color:#4a2c12;user-select:none;-webkit-user-select:none;touch-action:none}
@media print{html{zoom:1!important}}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{zoom:var(--egt-z)}
button{font-family:var(--font);cursor:pointer}
/* ÜST GÖSTERGELER (yalnız gösterim) */
#ust{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:20}
.pill{background:linear-gradient(#fff8e6,#f6dfb2);border:3px solid var(--kahve2);border-radius:14px;padding:3px 12px;font-weight:800;font-size:18px;box-shadow:var(--golge);display:flex;align-items:center;gap:6px;white-space:nowrap}
.pill .ik{font-size:20px}
#solUst{display:flex;flex-direction:column;gap:6px}
#solUst .satir{display:flex;gap:6px;flex-wrap:wrap}
#svPill{font-size:15px}
#xpBar{width:70px;height:9px;background:#e8cfa0;border-radius:6px;overflow:hidden;border:1px solid #b98a52}
#xpBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7bd36b,#3fa64a);transition:width .4s}
#sagUst{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#harita{width:110px;height:110px;border-radius:50%;border:4px solid var(--kahve2);box-shadow:var(--golge);background:#5fb0c9}
#surumRozet{pointer-events:auto;font-size:11px;opacity:.55;background:#fff8e6;border:1px solid #c9a06a;border-radius:8px;padding:0 6px;align-self:flex-start;cursor:pointer}
/* ALT KONTROLLER (çocuk boyu) */
#alt{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(env(safe-area-inset-bottom) + 10px);display:flex;align-items:flex-end;justify-content:space-between;gap:10px;z-index:20;pointer-events:none}
#alt>*{pointer-events:auto}
#joy{width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,rgba(255,248,230,.55),rgba(255,236,200,.25));border:3px solid rgba(168,106,53,.6);position:relative;flex:none;touch-action:none}
#joyTop{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7e0,#e6b673);border:3px solid var(--kahve2);box-shadow:var(--golge)}
#ortaAlt{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:0}
#ipucu{background:rgba(74,44,18,.78);color:#fff6df;border-radius:12px;padding:2px 12px;font-size:15px;font-weight:700;opacity:0;transition:opacity .3s;max-width:100%;text-align:center}
#ipucu.on{opacity:1}
#hotbar{display:flex;gap:6px;background:linear-gradient(#f9e7c2,#e9c88d);border:3px solid var(--kahve2);border-radius:16px;padding:6px;box-shadow:var(--golge);max-width:100%;overflow-x:auto;scrollbar-width:none}
#hotbar::-webkit-scrollbar{display:none}
.slot{width:54px;height:54px;flex:none;border-radius:12px;background:#fff6e1;border:2px solid #d2a76d;display:flex;align-items:center;justify-content:center;font-size:30px;position:relative;cursor:pointer;transition:transform .12s}
.slot .n{position:absolute;right:2px;bottom:-2px;font-size:14px;font-weight:800;color:#5a3412;text-shadow:0 0 3px #fff}
.slot.sec{border-color:#e8833a;background:#fff;box-shadow:0 0 0 3px #f6b26b;transform:translateY(-4px)}
.slot.bos{opacity:.45}
.slot.kilit{filter:grayscale(1);opacity:.4}
#sagAlt{display:flex;flex-direction:column;align-items:center;gap:8px;flex:none}
#eylem{width:104px;height:104px;border-radius:50%;border:4px solid #fff3d6;background:radial-gradient(circle at 35% 30%,#ffd28a,#e8833a 70%);box-shadow:0 6px 0 #a3501a,0 12px 22px rgba(0,0,0,.25);font-size:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;line-height:1}
#eylem small{font-size:14px;font-weight:800;margin-top:2px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
#eylem:active{transform:translateY(3px);box-shadow:0 3px 0 #a3501a}
#eylem.pasif{filter:saturate(.35) brightness(1.05)}
.kucukBtnlar{display:flex;gap:8px}
.kBtn{width:52px;height:52px;border-radius:14px;border:3px solid var(--kahve2);background:linear-gradient(#fff8e6,#f1d6a2);box-shadow:var(--golge);font-size:24px;display:flex;align-items:center;justify-content:center;position:relative}
.kBtn .rozet{position:absolute;top:-6px;right:-6px;background:#e53935;color:#fff;border-radius:10px;font-size:12px;font-weight:800;padding:0 5px;border:2px solid #fff}
/* MODALLAR */
.ort{position:fixed;inset:0;background:rgba(40,22,8,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:14px}
.ort.on{display:flex}
.kart{background:linear-gradient(#fffaf0,#fbe9c6);border:4px solid var(--kahve2);border-radius:22px;box-shadow:0 10px 0 rgba(90,50,20,.35),0 20px 40px rgba(0,0,0,.3);width:min(560px,100%);max-height:88vh;overflow:auto;padding:18px 18px 16px;position:relative;animation:kartGel .28s cubic-bezier(.2,1.4,.5,1)}
@keyframes kartGel{from{transform:scale(.8) translateY(20px);opacity:0}to{transform:none;opacity:1}}
.kart h2{margin:0 0 8px;font-size:24px;color:#7a3e10;display:flex;align-items:center;gap:8px}
.kart .kapat{position:absolute;right:10px;top:8px;width:38px;height:38px;border-radius:50%;border:2px solid #c99a5f;background:#fff6e1;font-size:20px;font-weight:800;color:#7a4a22}
.btn{border:none;border-radius:14px;padding:10px 16px;font-size:18px;font-weight:800;color:#fff;background:linear-gradient(#ffad5c,#e8833a);box-shadow:0 4px 0 #a3501a;margin:4px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #a3501a}
.btn.yesil{background:linear-gradient(#7bd36b,#3e9e45);box-shadow:0 4px 0 #2b6f30}
.btn.mavi{background:linear-gradient(#6cbcf5,#2f8fd8);box-shadow:0 4px 0 #1d5d93}
.btn.gri{background:linear-gradient(#cdbca0,#a8916c);box-shadow:0 4px 0 #77654a}
.btn:disabled{filter:grayscale(1);opacity:.6}
/* Soru */
#soruKart .soruUst{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:#9a6a3a}
#soruMetin{font-size:24px;font-weight:800;margin:8px 0 6px;line-height:1.25}
#soruGorsel{font-size:44px;text-align:center;letter-spacing:4px;margin:4px 0 10px;line-height:1.2;word-break:break-word}
#siklar{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sik{border:3px solid #d8b07a;background:#fff;border-radius:16px;padding:12px 10px;font-size:20px;font-weight:700;color:#4a2c12;min-height:62px;box-shadow:0 4px 0 #d8b07a;text-align:center}
.sik:active{transform:translateY(2px)}
.sik.dogru{background:#d9f7d2;border-color:#3fa64a;box-shadow:0 4px 0 #3fa64a}
.sik.yanlis{background:#ffe0dc;border-color:#e0574a;box-shadow:0 4px 0 #e0574a}
#aciklama{margin-top:10px;padding:10px 12px;border-radius:14px;background:#fff;border:2px dashed #d8b07a;font-size:17px;display:none}
.sesBtn{border:2px solid #d8b07a;background:#fff;border-radius:12px;font-size:18px;padding:2px 8px}
/* listeler */
.liste{display:flex;flex-direction:column;gap:8px}
.satirK{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #e3c08e;border-radius:14px;padding:8px 10px}
.satirK .em{font-size:34px;width:44px;text-align:center}
.satirK .bil{flex:1;min-width:0}
.satirK .bil b{font-size:18px}
.satirK .bil div{font-size:14px;color:#8a5f35;line-height:1.25}
.sekmeler{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.sekme{border:2px solid #d8b07a;background:#fff6e1;border-radius:12px;padding:6px 12px;font-size:16px;font-weight:800;color:#7a4a22}
.sekme.on{background:var(--turuncu);color:#fff;border-color:#c56a26}
.menuIzgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.menuIzgara button{border:3px solid #e0b47a;background:#fff;border-radius:16px;padding:12px 6px;font-size:16px;font-weight:800;color:#5a3412;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 4px 0 #e0b47a}
.menuIzgara button span{font-size:32px}
.soluk{opacity:.6;font-size:13px}
.ilerle{height:12px;border-radius:8px;background:#f0dcb6;overflow:hidden;border:1px solid #d0a66c}
.ilerle i{display:block;height:100%;background:linear-gradient(90deg,#ffc35c,#e8833a)}
/* toast & uçan yazı */
#toastlar{position:fixed;top:calc(env(safe-area-inset-top) + 70px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:70;pointer-events:none}
.toast{background:rgba(255,248,230,.97);border:3px solid var(--kahve2);border-radius:14px;padding:6px 14px;font-weight:800;font-size:17px;box-shadow:var(--golge);animation:tGel .3s ease,tGit .4s ease 2.6s forwards;max-width:86vw;text-align:center}
@keyframes tGel{from{transform:translateY(-14px);opacity:0}}
@keyframes tGit{to{transform:translateY(-10px);opacity:0}}
.ucan{position:fixed;z-index:65;pointer-events:none;font-weight:800;font-size:20px;text-shadow:0 2px 0 #fff,0 0 6px #fff;animation:uc 1.3s ease-out forwards;white-space:nowrap}
@keyframes uc{to{transform:translateY(-60px);opacity:0}}
.ucanIkon{position:fixed;z-index:66;pointer-events:none;font-size:30px;transition:all .8s cubic-bezier(.5,-.3,.6,1)}
#banner{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:50%;transform:translateX(-50%);z-index:80;background:#fff8e6;border:2px solid #c9a06a;border-radius:12px;padding:4px 12px;font-size:13px;font-weight:700;box-shadow:var(--golge);display:none;max-width:92vw}
#banner button{border:none;background:none;font-size:16px;margin-left:6px}
/* Yükleniyor */
#yukle{position:fixed;inset:0;z-index:9000;background:radial-gradient(circle at 50% 30%,#ffd9a0,#e8833a 60%,#a3501a);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center}
#yukle h1{font-size:44px;margin:0;text-shadow:0 4px 0 #8a3f10}
#yukle p{font-size:18px;margin:6px 0 0}
#yukle .tohum{font-size:70px;animation:zipla 1s infinite ease-in-out}
@keyframes zipla{50%{transform:translateY(-16px) rotate(8deg)}}
/* kutlama */
#kutlama{position:fixed;inset:0;pointer-events:none;z-index:75;overflow:hidden}
.konfeti{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:dus 2.4s linear forwards}
@keyframes dus{to{transform:translateY(110vh) rotate(720deg)}}
.cocukMod #alt{padding-bottom:calc(env(safe-area-inset-bottom) + 4px)}
@media (max-width:560px){
  #joy{width:112px;height:112px}#joyTop{width:50px;height:50px;margin:-25px 0 0 -25px}
  #eylem{width:88px;height:88px;font-size:34px}
  .slot{width:46px;height:46px;font-size:25px}
  .kBtn{width:44px;height:44px;font-size:20px}
  #harita{width:84px;height:84px}
  .pill{font-size:15px;padding:2px 9px}
  #siklar{grid-template-columns:1fr}
  #soruMetin{font-size:21px}
}
@media (max-width:560px) and (orientation:portrait){#ortaAlt{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 128px)}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="yukle"><div class="tohum">🌱</div><h1>Bereket Adası</h1><p>Ada hazırlanıyor…</p></div>

<div id="ust" class="ui">
  <div id="solUst">
    <div class="satir">
      <div class="pill"><span class="ik">🪙</span><span id="altin">0</span></div>
      <div class="pill"><span class="ik">💎</span><span id="elmas">0</span></div>
    </div>
    <div class="pill" id="svPill"><span>⭐ Sv <b id="sv">1</b></span><div id="xpBar"><i></i></div></div>
    <div id="surumRozet" title="Sürüm bilgisi">v1.0 ✓</div>
  </div>
  <div id="sagUst">
    <div class="pill"><span id="gunYazi">Gün 1 · İlkbahar</span><span class="ik" id="gunIkon">☀️</span></div>
    <canvas id="harita" width="160" height="160"></canvas>
  </div>
</div>

<div id="toastlar" class="ui"></div>
<div id="banner"></div>
<div id="kutlama"></div>

<div id="alt" class="ui">
  <div id="joy"><div id="joyTop"></div></div>
  <div id="ortaAlt">
    <div id="ipucu"></div>
    <div id="hotbar"></div>
  </div>
  <div id="sagAlt">
    <div class="kucukBtnlar">
      <button class="kBtn" id="gorevBtn" title="Görevler">📜<span class="rozet" id="gorevRozet" style="display:none">!</span></button>
      <button class="kBtn" id="menuBtn" title="Menü">☰</button>
    </div>
    <button id="eylem"><span id="eylemIk">✋</span><small id="eylemYazi">Yürü</small></button>
  </div>
</div>

<!-- Soru -->
<div class="ort" id="soruOrt"><div class="kart" id="soruKart">
  <div class="soruUst"><span id="soruBaslik">💎 Bilgi Elması</span><span style="flex:1"></span><span id="soruDers"></span><button class="sesBtn" id="soruSes" title="Sesli oku">🔊</button></div>
  <div id="soruMetin"></div>
  <div id="soruGorsel"></div>
  <div id="siklar"></div>
  <div id="aciklama"></div>
  <div style="text-align:center;margin-top:8px"><button class="btn yesil" id="soruDevam" style="display:none">Devam ➜</button></div>
</div></div>

<!-- Genel modal -->
<div class="ort" id="modalOrt"><div class="kart" id="modalKart"><button class="kapat" id="modalKapat">✕</button><div id="modalIc"></div></div></div>

<!-- Karşılama -->
<div class="ort" id="karsilamaOrt"><div class="kart" style="text-align:center">
  <div style="font-size:60px;line-height:1">🏝️🌾</div>
  <h2 style="justify-content:center" id="karsilamaBaslik"></h2>
  <p id="karsilamaOzet" style="font-size:18px;margin:4px 0 10px"></p>
  <div id="karsilamaAdim" class="liste" style="text-align:left"></div>
  <button class="btn yesil" id="karsilamaTamam" style="margin-top:12px;font-size:22px">Hadi Başlayalım! 🌱</button>
</div></div>

(function(){
  const AYAR = window.ZGIRIS_AYAR || {projectId:'shaped-totem-481514-c5', apiKey:'', koleksiyon:'oyun_girisleri', pin:'2026'};
  const TABAN = 'https://firestore.googleapis.com/v1/projects/'+AYAR.projectId+'/databases/(default)/documents';
  const keyQ = AYAR.apiKey ? ('key='+encodeURIComponent(AYAR.apiKey)) : '';
  const LS = {ogr:'zirve_ogrenci', bek:'zirve_giris_bekleyen', ok:'zirve_ogretmen_ok'};
  let oyunAdi='Oyun', renk='#7c3aed', docAdi=null, timer=null, ogrenci=null;
  const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
  const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function cihaz(){
    const ua=navigator.userAgent||'', w=Math.round(screen.width*(1)), h=Math.round(screen.height), dpr=window.devicePixelRatio||1;
    let os='Diğer';
    if(/iPhone/.test(ua)) os='iPhone'; else if(/iPad/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1)) os='iPad';
    else if(/Android/.test(ua)) os='Android'; else if(/CrOS/.test(ua)) os='Chromebook'; else if(/Windows/.test(ua)) os='Windows';
    else if(/Macintosh/.test(ua)) os='Mac'; else if(/Linux/.test(ua)) os='Linux';
    const dokun=(navigator.maxTouchPoints||0)>0, uz=Math.max(w,h)*dpr, uzCss=Math.max(w,h);
    let tur='Bilgisayar';
    if(os==='iPhone'||(os==='Android'&&/Mobile/.test(ua))) tur='Telefon';
    else if(os==='iPad'||(os==='Android')) tur='Tablet';
    if(dokun && ((uzCss>=1700 && dpr<=1.3) || uz>=3000) && os!=='iPhone' && os!=='iPad') tur='Akıllı Tahta';
    let tarayici='Diğer';
    if(/Edg\//.test(ua)) tarayici='Edge'; else if(/OPR\//.test(ua)) tarayici='Opera'; else if(/Chrome\//.test(ua)) tarayici='Chrome';
    else if(/Firefox\//.test(ua)) tarayici='Firefox'; else if(/Safari\//.test(ua)) tarayici='Safari';
    return {os, tur, tarayici, ekran: w+'x'+h};
  }
  function fsDeger(v){ return {stringValue:String(v==null?'':v)}; }
  function belge(o){ const f={}; for(const k in o) f[k]=fsDeger(o[k]); return {fields:f}; }
  async function kaydet(kayit){
    try{
      const r=await fetch(TABAN+'/'+AYAR.koleksiyon+(keyQ?'?'+keyQ:''),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(belge(kayit))});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const j=await r.json(); docAdi=j.name; return true;
    }catch(e){
      const b=lsGet(LS.bek,[]); b.push(kayit); lsSet(LS.bek,b.slice(-50)); return false;
    }
  }
  async function bekleyenGonder(){
    const b=lsGet(LS.bek,[]); if(!b.length||!navigator.onLine) return;
    const kalan=[];
    for(const k of b){ try{ const r=await fetch(TABAN+'/'+AYAR.koleksiyon+(keyQ?'?'+keyQ:''),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(belge(k))}); if(!r.ok) kalan.push(k);}catch(e){kalan.push(k)} }
    lsSet(LS.bek,kalan);
  }
  async function guncelle(alanlar){
    if(!docAdi) return;
    try{
      const q=Object.keys(alanlar).map(f=>'updateMask.fieldPaths='+encodeURIComponent(f)).join('&');
      await fetch('https://firestore.googleapis.com/v1/'+docAdi+'?'+q+(keyQ?'&'+keyQ:''),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(belge(alanlar))});
    }catch(e){}
  }
  function sonGoruldu(){ if(document.visibilityState==='visible') guncelle({son:new Date().toISOString()}); }
  async function listele(){
    const body={structuredQuery:{from:[{collectionId:AYAR.koleksiyon}],orderBy:[{field:{fieldPath:'giris'},direction:'DESCENDING'}],limit:800}};
    const r=await fetch(TABAN+':runQuery'+(keyQ?'?'+keyQ:''),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    return j.filter(x=>x.document).map(x=>{const f=x.document.fields||{},o={};for(const k in f)o[k]=f[k].stringValue!=null?f[k].stringValue:(f[k].integerValue||'');return o;});
  }

/* B. duzMetin */
window.ZIRVE.duzMetin=function(str){
  let s=String(str||'');
  s=s.replace(/<br\s*\/?>/gi,'\n').replace(/<\/(p|div|li|h\d)>/gi,'\n').replace(/<li[^>]*>/gi,'• ').replace(/<[^>]+>/g,'');
  const t=document.createElement('textarea'); t.innerHTML=s; s=t.value;
  s=s.replace(/^#{1,6}\s*/gm,'').replace(/\*\*(.+?)\*\*/g,'$1').replace(/__(.+?)__/g,'$1').replace(/\*(.+?)\*/g,'$1').replace(/_(.+?)_/g,'$1')
     .replace(/`([^`]+)`/g,'$1').replace(/^>\s?/gm,'').replace(/^\s*[-*]\s+/gm,'• ').replace(/\[([^\]]+)\]\(([^)]+)\)/g,'$1 ($2)');
  return s.replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
};
/* 12. Cihaz/ekran ölçeği — yalnız arayüze uygulanır (3B tuval etkilenmez) */
window.ZIRVE_ekranMod=(function(){
  const MODLAR=[['oto','Otomatik',0],['tablet','Tablet',1],['tahta','Akıllı Tahta',1.35],['buyuk','Büyük Tahta',1.6]];
  function otoOlcek(){ const c=window.ZGIRIS?ZGIRIS.cihaz():{tur:''}; const w=Math.max(innerWidth,innerHeight);
    if(c.tur==='Akıllı Tahta') return w>=2600?1.6:1.35; return 1; }
  function uygula(){ let m='oto'; try{m=localStorage.getItem('zirve_ekran_mod')||'oto'}catch(e){}
    const z=m==='oto'?otoOlcek():(MODLAR.find(x=>x[0]===m)||[0,0,1])[2];
    document.documentElement.style.setProperty('--egt-z',z);
    document.body.classList.toggle('cocukMod', z>1);
    return m; }
  function ayarla(m){ try{localStorage.setItem('zirve_ekran_mod',m)}catch(e){} uygula(); }
  addEventListener('resize',()=>{let m='oto';try{m=localStorage.getItem('zirve_ekran_mod')||'oto'}catch(e){} if(m==='oto')uygula();});
  return {MODLAR,uygula,ayarla,aktif:()=>{try{return localStorage.getItem('zirve_ekran_mod')||'oto'}catch(e){return 'oto'}}};
})();

/* C. QR ile paylaş */
window.ZIRVE_paylasAc=function(){
  const url=(window.PAYLAS&&PAYLAS.url)||location.href.split('#')[0];
  const yerel=!/^https?:/.test(location.protocol)||/localhost|127\.0\.0\.1/.test(location.hostname);
  const ic=`<h2>📲 QR ile Paylaş</h2>
   ${yerel?'<p style="color:#b45309;font-weight:700">⚠️ Bu dosya henüz internette değil. QR’ın çalışması için önce GitHub Pages’e yükle.</p>':''}
   <div id="qrKutu" style="background:#fff;padding:16px;border-radius:16px;display:flex;justify-content:center;min-height:220px;align-items:center">QR hazırlanıyor…</div>
   <p style="word-break:break-all;font-size:14px;text-align:center">${url.replace(/</g,'&lt;')}</p>
   <div style="text-align:center"><button class="btn mavi" id="qrKop">🔗 Linki kopyala</button><button class="btn" id="qrPng">⬇️ PNG indir</button></div>`;
  UI.modal(ic);
  const ciz=()=>{ try{ const q=qrcode(0,'M'); q.addData(url); q.make(); const n=q.getModuleCount(), s=8, m=4*s, cv=document.createElement('canvas');
      cv.width=cv.height=n*s+m*2; const g=cv.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,cv.width,cv.height); g.fillStyle='#1d1206';
      for(let r=0;r<n;r++)for(let c=0;c<n;c++) if(q.isDark(r,c)) g.fillRect(m+c*s,m+r*s,s,s);
      cv.style.width='220px'; const k=document.getElementById('qrKutu'); if(!k) return; k.innerHTML=''; k.appendChild(cv);
      document.getElementById('qrPng').onclick=()=>{const a=document.createElement('a');a.download='bereket-adasi-qr.png';a.href=cv.toDataURL('image/png');a.click();};
    }catch(e){ const k=document.getElementById('qrKutu'); if(k) k.textContent='QR oluşturulamadı.'; } };
  document.getElementById('qrKop').onclick=()=>{ (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>UI.toast('🔗 Link kopyalandı')).catch(()=>UI.toast('Kopyalanamadı, adresi elle seç.')); };
  if(window.qrcode) return ciz();
  if(!navigator.onLine){ document.getElementById('qrKutu').textContent='İnternet yok — QR için bağlantı gerekli.'; return; }
  const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js'; s.onload=ciz;
  s.onerror=()=>{const k=document.getElementById('qrKutu'); if(k) k.textContent='QR aracı yüklenemedi (internet?).';}; document.head.appendChild(s);
};

const ADA={rx:26,rz:22};
function adaSekil(k,bozul){ const s=new THREE.Shape(); const N=96;
  for(let i=0;i<=N;i++){ const a=i/N*Math.PI*2, r=1+bozul*(Math.sin(a*5)*.035+Math.sin(a*9+1)*.025+Math.sin(a*3+2)*.03);
    const x=Math.cos(a)*ADA.rx*k*r, y=Math.sin(a)*ADA.rz*k*r; i?s.lineTo(x,y):s.moveTo(x,y); } return s; }
function adaYap(){

/* ---------- ÇİT ---------- */
const CIT={direk:[],ray:[]};
function citCiz(x0,z0,x1,z1,bosluk){ // düz çit hattı
  const L=Math.hypot(x1-x0,z1-z0), n=Math.max(1,Math.round(L/1.6)), ang=Math.atan2(z1-z0,x1-x0);
  for(let i=0;i<=n;i++){ const t=i/n, x=x0+(x1-x0)*t, z=z0+(z1-z0)*t; if(bosluk&&bosluk(x,z)) continue; CIT.direk.push([x,z]); }
  for(let i=0;i<n;i++){ const t=(i+.5)/n, x=x0+(x1-x0)*t, z=z0+(z1-z0)*t; if(bosluk&&bosluk(x,z)) continue; CIT.ray.push([x,z,ang,L/n]); }
}
function citTamamla(){
  const d=new THREE.InstancedMesh(GEO.kutu,mat(0xa8763f),CIT.direk.length), r=new THREE.InstancedMesh(GEO.kutu,mat(0xc08a4a),CIT.ray.length*2), o=new THREE.Object3D();
  CIT.direk.forEach((p,i)=>{ o.position.set(p[0],.42,p[1]); o.scale.set(.16,.84,.16); o.rotation.set(0,0,0); o.updateMatrix(); d.setMatrixAt(i,o.matrix); });
  CIT.ray.forEach((p,i)=>{ for(let k=0;k<2;k++){ o.position.set(p[0],.36+k*.3,p[1]); o.scale.set(p[3],.09,.07); o.rotation.set(0,-p[2],0); o.updateMatrix(); r.setMatrixAt(i*2+k,o.matrix);} });
  d.castShadow=r.castShadow=true; d.receiveShadow=r.receiveShadow=true; scene.add(d); scene.add(r);
}
