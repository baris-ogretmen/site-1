<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Barış Öğretmen · Dijital içerik</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#16a34a">
<style>
:root{--r:#16a34a;--bg:#f7fdf9;--kart:#fff;--yazi:#0f172a;--soluk:#475569;--cizgi:#e2e8f0}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--yazi);min-height:100vh}
header{padding:22px 16px 26px;text-align:center;color:#fff;background:linear-gradient(135deg,var(--r),#0ea5e9);border-radius:0 0 28px 28px}
header .set{display:inline-block;background:#ffffff2e;border:1.5px solid #ffffff66;border-radius:999px;padding:5px 12px;font-weight:800;font-size:.85rem}
header h1{margin:10px 0 4px;font-size:clamp(1.3rem,5.5vw,1.9rem)}header p{margin:0;opacity:.95}
main{max-width:720px;margin:0 auto;padding:16px 16px 40px}
.ana{display:flex;gap:14px;align-items:center;background:var(--kart);border-radius:22px;padding:14px;text-decoration:none;color:inherit;box-shadow:0 18px 34px -24px #0f172a;border:2px solid var(--r);margin-top:-6px}
.ana img,.ana .ph{width:120px;height:80px;border-radius:14px;object-fit:cover;background:#f1f5f9;flex:none;display:grid;place-items:center;font-size:2rem}
.ana b{display:block;font-size:1.15rem}.ana small{color:var(--soluk)}
.ana .bas{margin-left:auto;background:var(--r);color:#fff;border-radius:14px;padding:12px 16px;font-weight:900;white-space:nowrap}
h2{font-size:1.05rem;margin:24px 0 10px}
.liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.liste a{display:flex;flex-direction:column;background:var(--kart);border:1.5px solid var(--cizgi);border-radius:16px;overflow:hidden;text-decoration:none;color:inherit}
.liste img,.liste .ph{width:100%;aspect-ratio:16/9;object-fit:cover;background:#f1f5f9;display:grid;place-items:center;font-size:1.8rem}
.liste span{padding:10px 12px;font-weight:800;font-size:.95rem;line-height:1.3}
.alt{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:24px}
.alt a{border:1.5px solid var(--cizgi);background:var(--kart);border-radius:999px;padding:9px 14px;font-weight:800;text-decoration:none;color:inherit}
.bos{text-align:center;padding:30px 10px;color:var(--soluk)}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--kart:#111a2e;--yazi:#e2e8f0;--soluk:#94a3b8;--cizgi:#1e293b}}
</style></head><body>
<header><span class="set" id="set">Barış Öğretmen</span><h1 id="bas">Dijital içerik</h1><p id="alt">Bu sayfanın oyunu ve ilgili çalışmalar</p></header>
<main id="m"><div class="bos">Yükleniyor…</div></main>
<script>
(function(){'use strict';
/* Basılı kitaplardaki QR'lar buraya gelir: q.html?KOD. Hedefler veri/qr.json'dan; ilgili çalışmalar sitedeki içerik yedeğinden kendiliğinden eklenir.
   Böylece yeni bir çalışma eklendiğinde kitabı yeniden basmadan eski QR'lar onu da gösterir. */
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kod=(location.search.slice(1).split('&')[0].split('=').pop()||'').toLowerCase().replace(/[^a-z0-9-]/g,'');
const url=l=>/^https?:/.test(l)?l:l.split('/').map(encodeURIComponent).join('/');
const yerel=l=>{try{return decodeURIComponent(new URL(l,location.href).pathname.replace(/^.*?\/site-1\//,'').replace(/^\//,''))}catch(e){return l}};
const gun=new Date().toISOString().slice(0,10);
Promise.all([fetch('veri/qr.json?g='+gun,{cache:'no-cache'}).then(r=>r.json()),fetch('veri/icerik-yedek.json?g='+gun,{cache:'no-cache'}).then(r=>r.ok?r.json():{}).catch(()=>({}))]).then(([Q,Y])=>{
 const k=Q.kodlar[kod];const m=document.getElementById('m');
 if(!k){m.innerHTML=`<div class="bos">Bu kare kod bulunamadı.<br><br><a href="setler.html" style="font-weight:800">📚 Barış Öğretmen'in setlerine git</a></div>`;return}
 const S=Q.setler[k.set]||{};if(S.renk)document.documentElement.style.setProperty('--r',S.renk);
 document.getElementById('set').textContent=S.ad||'Barış Öğretmen';document.getElementById('bas').textContent=k.baslik;document.title=(S.ad?S.ad+' · ':'')+k.baslik;
 const hepsi=[];['projeler','videolar'].forEach(c=>Object.entries(Y[c]||{}).forEach(([id,x])=>{if(id[0]!=='_'&&x&&!x.arsivlendi&&!x.silindi&&x.yayinDurumu!=='taslak'&&x.link)hepsi.push({...x,col:c})}));
 const kayit=l=>{const y=yerel(l);return hepsi.find(x=>yerel(x.link)===y)};
 const resim=x=>x&&x.kapak&&!/^https?:/.test(x.kapak)?`<img loading="lazy" src="${E(url(x.kapak))}" alt="">`:x&&x.kapak?`<img loading="lazy" src="${E(x.kapak)}" alt="">`:'<div class="ph">🎮</div>';
 let h='';const goster=new Set();
 (k.ana||[]).forEach((a,i)=>{const r=kayit(a.link);goster.add(yerel(a.link));h+=`<a class="ana" href="${E(url(a.link))}">${resim(r)}<div><b>${E(r?.baslik||a.ad)}</b><small>${i===0?'Bu sayfanın dijital içeriği':'Ayrıca'}</small></div><span class="bas">▶ Aç</span></a>`+(i<(k.ana.length-1)?'<div style="height:10px"></div>':'')});
 if(k.oto){const kon=(k.oto.konu||'').toLocaleLowerCase('tr'),kad=new Set(k.oto.kademe||[]);
  const ilgili=hepsi.filter(x=>{const c=[...(x.kategoriler||[]),x.kategori||''];return c.some(v=>String(v).toLocaleLowerCase('tr')===kon)&&(!kad.size||c.some(v=>kad.has(v)))&&!goster.has(yerel(x.link))&&yerel(x.link)!==S.sayfa})
   .sort((a,b)=>String(b.tarih||'').localeCompare(String(a.tarih||''))).slice(0,9);
  if(ilgili.length)h+=`<h2>✨ İlgili diğer çalışmalar <small style="font-weight:600;color:var(--soluk)">(yeniler kendiliğinden eklenir)</small></h2><div class="liste">`+ilgili.map(x=>`<a href="${E(url(x.link))}">${resim(x)}<span>${E(x.baslik)}</span></a>`).join('')+'</div>'}
 h+=`<div class="alt">${S.sayfa?`<a href="${E(S.sayfa)}">📚 ${E(S.ad)}</a>`:''}<a href="setler.html">Bütün setler</a><a href="index.html">🏠 Barış Öğretmen</a></div>`;
 m.innerHTML=h}).catch(()=>{document.getElementById('m').innerHTML='<div class="bos">Bağlantı kurulamadı. Biraz sonra tekrar dene.<br><br><a href="index.html">🏠 Ana sayfa</a></div>'});
})();
</script></body></html>
