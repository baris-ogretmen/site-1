<noscript><div class="noscript">Satranç Evreni için tarayıcınızda JavaScript açık olmalıdır.</div></noscript>
<div class="app">
 <aside class="sidebar">
  <div class="brand"><span class="brandmark glyph">♜</span><div><strong>SATRANÇ EVRENİ</strong><small>Barış Öğretmen</small></div></div>
  <nav class="nav" aria-label="Ana menü" id="nav"></nav>
  <div class="sidebar-foot"><div class="between small"><span>Öğrenme puanın</span><b class="gold" id="sideXP">0</b></div><div class="spacer" style="height:10px"></div><div class="meter"><i id="sideMeter" style="width:0"></i></div><p class="small muted" style="margin:12px 0 0">Her doğru adım, yeni bir keşif.</p></div>
 </aside>
 <div class="main">
  <header class="topbar">
   <div class="grade-field"><label for="grade">Sınıfım</label><select id="grade" aria-label="Sınıf seç"></select></div>
   <div class="top-actions"><span class="pill"><span class="gold">✦</span> <b id="topXP">0</b> <span class="xp-label">puan</span></span><button class="icon ghost" id="voiceOpen" aria-label="Ses stüdyosunu aç" title="Ses stüdyosu">♫</button><button class="icon ghost" id="fullScreen" aria-label="Tam ekran" title="Tam ekran">⛶</button></div>
  </header>
  <main id="page" class="page"></main>
 </div>
</div>
<button class="bot-launcher" id="botToggle" aria-expanded="false" aria-controls="botPanel"><span class="glyph" id="botGlyph">♜</span><span id="botLabel">Kale-Bot</span></button>
<aside class="bot-panel hidden" id="botPanel" aria-label="Sınıf botu">
 <div class="between"><strong>Sınıf botun</strong><button class="ghost icon" id="botClose" aria-label="Botu kapat">×</button></div>

const PIECES={
r:{name:'Kale',glyph:'♜',value:5,tag:'Düz yolların ustası',short:'Ben kaleyim! İleri, geri, sağa ve sola düz giderim. Yolum açıksa istediğim kadar ilerlerim. Taşların üzerinden atlayamam.',rules:['Yatay ve dikey doğrultuda ilerler.','Yolu açıksa istediği kadar kare gider.','Taşların üzerinden atlayamaz.','Rakip taşı onun karesine giderek alır.'],story:'Satranç şehrinin düz yollarını korurum. Bir koridorda yürür gibi ilerlerim. Köşeden çapraz kaçmam; önüme bir taş çıkarsa durup düşünürüm.',detail:'Yaklaşık değerim beş piyondur. Açık hatlarda ve yedinci yatayda etkili olurum. Şahımla birlikte, koşulları sağlanırsa rok yapabilirim. Kendi taşımın olduğu kareye gidemem.'},
b:{name:'Fil',glyph:'♝',value:3,tag:'Çapraz yolların gezgini',short:'Ben filim! Çapraz giderim. Yolu açıksa çok uzağa gidebilirim. Hangi renk karede başladıysam hep o renkte kalırım. Taşların üzerinden atlayamam.',rules:['Yalnızca çapraz doğrultuda ilerler.','Yolu açıksa istediği kadar kare gider.','Her zaman aynı renk karelerde kalır.','Önündeki taşların üzerinden atlayamaz.'],story:'Benim yollarım köşeden köşeye uzanır. Açık renkli bir kareden başladıysam yolculuğum hep açık karelerde sürer. Arkadaşım diğer renkteki yolları korur.',detail:'Yaklaşık değerim üç piyondur. Uzun çaprazlar açıldığında güçlenirim. Açık konumlarda iki fil birlikte çok geniş bir alanı denetleyebilir.'},
n:{name:'At',glyph:'♞',value:3,tag:'Engelleri aşan gezgin',short:'Ben atım! İki kare düz, sonra yana bir kare giderim. Hareketim L harfine benzer. Taşların üzerinden atlayabilirim! İndiğim kare arkadaşımınsa oraya gidemem.',rules:['İki kare bir yönde, bir kare yan yönde gider.','Her hamlede farklı renkte bir kareye iner.','Taşların üzerinden atlayabilir.','İndiği karedeki rakip taşı alabilir.'],story:'Yol kalabalık mı? Ben yine de sıçrayabilirim! Önce iki adımı düşün, sonra yan tarafa bir adım ekle. Havada uğradığım taşları almam; yalnızca indiğim kare önemlidir.',detail:'Yaklaşık değerim üç piyondur. Merkezde en fazla sekiz kareye ulaşabilirim; köşede yalnızca iki. Çatalla aynı anda iki önemli taşa saldırabilirim.'},
q:{name:'Vezir',glyph:'♛',value:9,tag:'Düz ve çapraz yolların gücü',short:'Ben vezirim! Hem kale gibi düz hem fil gibi çapraz giderim. Yolum açıksa istediğim kadar ilerlerim. Ama at gibi atlayamam.',rules:['Yatay, dikey ve çapraz ilerler.','Yolu açıksa istediği kadar kare gider.','Taşların üzerinden atlayamaz.','Atın L hareketini yapamaz.'],story:'Şehrin düz yollarını da çapraz yollarını da bilirim. Çok güçlüyüm ama tek başıma bütün oyunu kazanamam. Arkadaşlarımla birlikte plan yaparım.',detail:'Yaklaşık değerim dokuz piyondur. Çok güçlü olduğum için gereksiz saldırılara açık bırakılmamalıyım. Açılışta erkenden tek başıma dolaşmak zaman kaybettirebilir.'},
k:{name:'Şah',glyph:'♚',value:0,tag:'Güvenliği her şeyden önce',short:'Ben şahım! Her yöne bir kare giderim. Tehlikeli bir kareye giremem. Beni korumak çok önemli! İki şah yan yana duramaz.',rules:['Normal hamlede her yöne bir kare gider.','Rakibin saldırdığı kareye gidemez.','İki şah yan yana gelemez.','Şah alınmaz; mat olduğunda oyun biter.'],story:'Küçük adımlarla ilerlerim ve her adımda güvenliğe bakarım. Arkadaşlarıma güveniyorum ama ben de dikkatliyim. Tehdit altındaysam önce güvenliğimi sağlamalıyız.',detail:'Şah çekilince tehdidi gideren yasal bir hamle zorunludur. Kaçmak, saldıran taşı almak ya da araya taş koymak mümkün olabilir. Atın şah tehdidine araya taş konulamaz.'},
p:{name:'Piyon',glyph:'♟',value:1,tag:'Küçük adımlardan büyük hayallere',short:'Ben piyonum! Boş kareye doğru bir adım ileri giderim. Başlangıç yerimdeysem ve yol boşsa iki adım da gidebilirim. Rakip taşı bir kare ileri çaprazda alırım. Geri gidemem.',rules:['Boş kareye bir kare ileri gider; geri dönemez.','Başlangıç yatayında, iki kare de boşsa iki ilerleyebilir.','Rakip taşı bir kare ileri çaprazda alır.','Son yataya ulaşınca vezir, kale, fil veya ata terfi eder.'],story:'Ben küçük bir yolcuyum. Düz yürürüm ama rakip taşı çaprazdan alırım. Tahtanın öbür ucuna ulaşırsam yeni bir güce kavuşurum. Bir şah olamam!',detail:'Beyaz piyonlar 8. yataya, siyah piyonlar 1. yataya ilerler. Terfide yalnızca daha önce alınan taşlarla sınırlı değilim. Geçerken alma, rakibin bitişiğime iki kare ilerlediği hamlenin hemen ardından mümkün olabilir.'}
};

L('bishop','Filin çapraz yolculuğu','Filin hareketini ve renk sınırını fark et.', [PIECES.b.short,'Tahtanın ortasına bir fil koy. Dört çapraz yolu izle. Kendi taşıyla karşılaştığı yönde durmak zorundadır. Rakip taşın üzerinden de atlayamaz.'],'Açık karedeki fil hangi karelere gidebilir?',['Yalnız açık karelere','Yalnız koyu karelere','Bütün karelere'],0,'Çapraz hareket eden fil başladığı renkte kalır.','stars:b'),
L('queen','Vezirle keşif','Vezirin iki hareket biçimini birleştir.', [PIECES.q.short,'Önce kale yollarını, sonra fil yollarını göster. Bu yolların toplamı vezirin yollarıdır. Vezir at gibi sıçrayamaz.'],'Vezir hangi iki taşın hareketini birleştirir?',['At ve piyon','Kale ve fil','Şah ve at'],1,'Vezir kale gibi düz ve fil gibi çapraz ilerler.','stars:q'),
L('king','Şahın güvenli adımı','Şahın güvenli kare zorunluluğunu öğren.', [PIECES.k.short,'Rakip taşın koruduğu bir taşı şah her zaman alamaz. Gideceği karenin saldırı altında olup olmadığını kontrol etmelidir. Rok, şahın normal bir karelik hareketinin özel istisnasıdır.'],'Şah rakibin saldırdığı boş bir kareye gidebilir mi?',['Evet','Hayır','Yalnız ilk hamlede'],1,'Şah, boş olsa bile saldırı altındaki kareye gidemez.','safe'),
L('knight','Atın L sıçrayışı','Atın varış karelerini bul.', [PIECES.n.short,'İki yukarı bir sağ, iki yukarı bir sol gibi yolları dene. Atın üzerinden atladığı taşlar alınmaz. Yalnız varış karesinde rakip taş varsa alınır.'],'Taşların üzerinden atlayabilen taş hangisidir?',['Fil','Kale','At'],2,'At diğer taşların üzerinden sıçrayabilir.','knight'),
L('pawn','Piyonun küçük adımları','Piyonun ilerleme ve alma farkını öğren.', [PIECES.p.short,'Piyonun önündeki kare doluysa ileri gidemez. Başlangıçtaki iki karelik hamlede hem üzerinden geçeceği hem varacağı kare boş olmalıdır.'],'Piyon rakip taşı nasıl alır?',['Bir kare ileri çaprazda','Bir kare düz ilerleyerek','Geriye giderek'],0,'Piyon boş kareye düz ilerler; rakip taşı bir kare ileri çaprazda alır.','pawn'),
L('capture','Taş almak','Yasal hareketle rakip taş al.', ['Bir taş, hareket kuralına uygun olarak rakip taşın karesine gittiğinde onu alır. Alınan taş tahtadan çıkar.','Kendi taşını alamazsın. Rakip şah da alınmaz. Amaç rakip şahı kaçamayacağı bir tehdide, yani mata ulaştırmaktır.'],'Hangi taş alınmaz?',['Piyon','Şah','Vezir'],1,'Satrançta şah alınmaz. Oyun mat ile sona erebilir.','capture'),
L('block','Yolu kapalı taşlar','Yol engelini kontrol et.', ['Kale, fil ve vezir başka bir taşın üzerinden geçemez. Piyon da önündeki dolu kareyi aşamaz.','At sıçrayabilir; ama kendi taşının üstüne inemez. Önce yol, sonra varış karesi, ardından şah güvenliği kontrol edilir.'],'At kendi taşının bulunduğu kareye inebilir mi?',['Evet, her zaman','Hayır','Sadece açılışta'],1,'At aradaki taşları aşar; kendi taşının olduğu kareye inemez.','map'),
L('setup','Taşları yerleştir','Başlangıç dizilişini kur.', ['Köşelere kaleler, yanlarına atlar, sonra filler gelir. Vezir kendi rengindeki başlangıç karesine yerleşir; kalan kare şahındır.','Beyaz vezir d1, beyaz şah e1; siyah vezir d8, siyah şah e8 karesindedir. Piyonlar beyazda 2., siyahta 7. yataya dizilir.'],'Beyaz vezirin başlangıç karesi hangisidir?',['e1','d1','d8'],1,'Vezir kendi rengindeki kareye yerleşir; beyaz vezir d1 karesindedir.','setup'),
L('coordinates','Karelerin adresleri','Harf ve sayıyla kare bul.', ['Dikeyler a, b, c, d, e, f, g, h; yataylar 1’den 8’e kadar adlandırılır. Karenin adresinde önce harf, sonra sayı söylenir.','Tahtayı çevirince karelerin adı değişmez. e4 karesi her iki oyuncu için de e4 karesidir.'],'Bir karenin doğru yazımı hangisidir?',['4e','e4','44'],1,'Önce dikeyin harfi, sonra yatayın sayısı yazılır.','coordinates'),
L('check','Şah tehdidi','Şah çekildiğini fark et.', ['Rakip taş şahına saldırıyorsa şah çekilmiştir. Bu durumda başka bir plan yapmadan önce tehdidi ortadan kaldırmalısın.','Şah çekmek oyunu hemen kazandırmaz. Rakibin tehdidi karşılayan yasal hamlesi varsa oyun sürer.'],'Şah çekilince önce ne yapmalısın?',['Bir piyon kazanmalıyım','Şah tehdidini gidermeliyim','İstediğim hamleyi yapmalıyım'],1,'Her yasal hamle kendi şahını güvende bırakmalıdır.','safe'),
L('escape','Şahtan kurtul','Üç savunma yolunu değerlendir.', ['Şahı güvenli kareye götür, saldıran taşı yasal biçimde al veya uygun olduğunda araya bir taş koy. Her konumda üçü birden mümkün olmayabilir.','Atın şah tehdidine araya taş koyarak engel olamazsın. Çifte şahta ise şah hareket etmek zorundadır.'],'At şah çekiyorsa hangi savunma yapılamaz?',['Şahı güvenli kareye kaçırmak','Uygunsa atı almak','Araya taş koymak'],2,'At sıçrayarak saldırır; araya taş koymak tehdidi kesmez.','safe'),
L('mate','Matı tanı','Şah ve mat arasındaki farkı açıkla.', ['Şah tehdit altındaysa ve tehdidi gideren hiçbir yasal hamle yoksa mattır. Mat yapan taraf kazanır.','Sadece kaçış karelerine bakmak yetmez. Saldıran taş alınabiliyor mu? Araya taş girebiliyor mu? Bütün yasal savunmaları kontrol et.'],'Mat için hangisi gerekir?',['Şah tehdit altında ve yasal kurtuluş yok','Şah köşede','Vezir alınmış'],0,'Mat, şah tehdidiyle birlikte yasal kurtuluşun bulunmamasıdır.','mate'),
L('stalemate','Pat tuzağı','Patın beraberlik olduğunu öğren.', ['Sırası gelen oyuncunun şahı tehdit altında değilse, fakat hiçbir yasal hamlesi yoksa pat olur. Sonuç beraberliktir.','Fazla taşınla kazanırken rakibin kalan hamlelerini kontrol et. Rakip şahı kuşatırken yanlışlıkla bütün hamleleri kapatabilirsin.'],'Şah tehdit altında değil; yasal hamle yok. Sonuç?',['Mat','Pat, beraberlik','Oyuncu sırasını atlar'],1,'Tehdit yoksa bu durum mat değil pattır.','quiz'),
L('castle','Rok atölyesi','Rokun koşullarını kontrol et.', ['Rokta şah kalesine doğru iki kare ilerler; kale şahın üzerinden geçtiği kareye gelir. Şah ve ilgili kale daha önce hiç oynamamış olmalı, aralarındaki kareler boş olmalıdır.','Şah şu anda tehdit altında olamaz; tehdit altındaki kareden geçemez ve böyle bir kareye varamaz. Kalenin tehdit altında olması tek başına rok yasağı değildir.'],'Şah tehdit altındayken rok yapılabilir mi?',['Hayır','Evet','Sadece uzun rok'],0,'Önce şah tehdidi başka bir yasal hamleyle giderilmelidir.','special:castle'),
L('enpassant','Geçerken alma','Hemen sonraki hamle koşulunu uygula.', ['Başlangıç yerindeki rakip piyon iki kare ilerleyip senin piyonunun yanına gelirse, onu yalnızca hemen sonraki hamlende, sanki bir kare ilerlemiş gibi alabilirsin.','Beyaz piyon e5, siyah piyon d7’de olsun. Siyah d5 oynarsa beyaz exd6 yapabilir. Siyah piyon d5’ten kaldırılır. Bu alma da şahını açıkta bırakamaz.'],'Geçerken alma ne zaman yapılabilir?',['İstediğimiz sonraki turda','Yalnızca iki karelik hamlenin hemen ardından','Sadece oyunun ilk hamlesinde'],1,'Hakkın doğduğu hamlenin hemen ardından kullanılmazsa o fırsat kaybolur.','special:enpassant'),
L('promotion','Piyonun terfisi','Dört terfi seçeneğini tanı.', ['Piyon son yataya ulaştığında aynı hamlede aynı renkte vezir, kale, fil veya at olur. Şah ya da piyon olarak kalamaz.','Terfi daha önce alınan taşlarla sınırlı değildir; iki vezirin olabilir. Bazen patı önlemek veya at çatalı yapmak için vezir dışı terfi seçilir.'],'Piyon hangisine terfi edemez?',['Ata','Vezire','Şaha'],2,'Terfi seçenekleri vezir, kale, fil ve attır.','special:promotion'),
L('values','Taşların yaklaşık değeri','Malzeme karşılaştırması yap.', ['Başlangıç için piyon 1, at 3, fil 3, kale 5, vezir 9 kabul edilebilir. Şaha bir değişim puanı verilmez.','Bu sayılar yaklaşık rehberdir. Şah güvenliği, taşların etkinliği ve taktikler nedeniyle bir hamle yalnızca puan sayarak değerlendirilemez.'],'Yaklaşık değeri en yüksek taş hangisidir?',['Kale','Vezir','Fil'],1,'Vezir yaklaşık 9 puandır; konum yine de belirleyicidir.','capture'),
L('notation','Hamleleri yaz','Temel uluslararası notasyonu oku.', ['Maç kayıtlarında uluslararası harfler kullanılır: K şah, Q vezir, R kale, B fil, N at. Piyon hamlesinde taş harfi yazılmaz: e4.','x alma, + şah, # mat, O-O kısa rok, O-O-O uzun rok anlamına gelir. Terfi e8=Q gibi yazılır. Gerekirse aynı tür taşları ayıran başlangıç bilgisi eklenir.'],'Nf3 hangi hamleyi anlatır?',['At f3’e gider','Şah f3’e gider','Piyon f3’e gider'],0,'Uluslararası notasyonda N atı belirtir.','notation'),
L('center','Merkezi keşfet','Merkez denetimini amaçla.', ['d4, e4, d5 ve e5 merkez kareleridir. Merkezdeki etkin taşlar farklı kanatlara daha kolay ulaşır.','Merkez yalnızca piyon koyarak tutulmaz; uzaktan taşlarla da denetlenebilir. Her hamlede rakibin tehdidini de izle.'],'Merkez karelerden biri hangisidir?',['a1','h8','d4'],2,'d4, e4, d5 ve e5 merkez kareleridir.','opening'),
L('development','Taşlarını oyuna kat','Açılışta etkin gelişim yap.', ['At ve fillerini yararlı karelere çıkar, merkezi denetle, şahını güvene al. Gelişim hamlesi taşına bir görev vermelidir.','Somut bir neden yoksa aynı taşı tekrar tekrar oynama. Veziri erkenden kovalanacağı yere çıkarmak zaman kaybettirebilir.'],'Açılışta genellikle hangi plan yararlıdır?',['At ve filleri geliştirip şahı güvene almak','Yalnız veziri dolaştırmak','Bütün kenar piyonlarını sürmek'],0,'Gelişim, merkez ve şah güvenliği birlikte düşünülür.','opening'),
L('safety','Şah güvenliği','Şah çevresindeki tehlikeyi izle.', ['Şahın önündeki piyonları gereksiz sürmek kalıcı zayıflıklar bırakabilir. Rakibin vezir ve taşları bu açıklıklardan yararlanabilir.','Rok çoğu konumda güvenliğe yardımcı olur, fakat otomatik karar değildir. Rok yapacağın kanadın güvenliğini önce incele.'],'Rok kararı verirken neye bakmalısın?',['Yalnız sıranın bana gelmesine','Rok yapılacak kanadın güvenliğine','Kalenin görünüşüne'],1,'Şahın varacağı kanadın saldırıya açık olup olmadığını kontrol et.','opening'),
L('fork','Çatal avcısı','Tek hamlede iki tehdidi bul.', ['Çatal, bir taşın aynı anda iki veya daha fazla rakip hedefe saldırmasıdır. At çatalı özellikle etkili olabilir.','Şaha ve vezire birlikte saldıran bir çatalda rakip önce şah tehdidini karşılamalıdır. Yine de atın alınabildiği savunmaları kontrol et.'],'Çatal ne demektir?',['Bir taşla birden fazla hedefe saldırmak','İki piyonu yan yana koymak','Rok yapmak'],0,'Çatal, tek taşın eşzamanlı birden fazla tehdididir.','tactic:fork'),
L('pin','Açmaz dedektifi','Arkada korunan hedefi fark et.', ['Bir taş çekilince arkasındaki şah saldırıya açılıyorsa mutlak açmaz vardır. O taş şahını açıkta bırakacak şekilde oynayamaz.','Arkadaki hedef vezir gibi başka değerli bir taşsa göreli açmazdır. Hamle yasal olabilir ama malzeme kaybettirebilir.'],'Mutlak açmazda arkadaki taş hangisidir?',['Şah','Piyon','At'],0,'Şahı açıkta bırakan hamle yasal olmadığı için bu açmaz mutlaktır.','tactic:pin'),
L('skewer','Şiş taktiği','Aynı hattaki iki hedefi incele.', ['Şişte öndeki değerli hedef saldırı altındadır. O çekilince arkadaki hedef alınabilir. Kale, fil ve vezir bu taktiği yapabilir.','Öndeki hedef şahsa rakip tehdidi gidermek zorundadır. Arkadaki taşın savunmasını ve kendi taşının güvenliğini de hesapla.'],'Şişte önce hangisi saldırı altındadır?',['Öndeki değerli hedef','Her zaman bir piyon','Kendi şahımız'],0,'Öndeki hedef çekilince arkasındaki hedef açığa çıkar.','tactic:skewer'),
L('discovered','Açarak saldırı','Öndeki taşla arkadaki hattı aç.', ['Bir taşını oynatarak arkasındaki fil, kale veya vezirin saldırısını açabilirsin. Buna açarak saldırı denir.','Öndeki taşın da tehdit oluşturduğu hamleler özellikle güçlüdür. Saldırı açılırken kendi şahının güvenliğini unutma.'],'Açarak saldırıda ne olur?',['Bir taş çekilerek arkasındaki saldırı hattını açar','Şah taş alır','Piyon her zaman terfi eder'],0,'Öndeki taşın hareketi arkadaki taşın hattını açar.','tactic:discovered'),
L('doublecheck','Çifte şah','İki eşzamanlı şah tehdidini tanı.', ['Aynı hamlede iki taş şah çekiyorsa çifte şah olur. Genellikle açarak saldırıyla oluşur.','Çifte şahtan kurtulmak için şah hareket etmelidir. Tek bir saldıranı almak ya da tek hatta araya girmek diğer tehdidi ortadan kaldırmaz.'],'Çifte şahta hangi taş hareket etmelidir?',['Şah','Vezir','İstediğimiz taş'],0,'İki tehdit birden bulunduğundan yasal yanıt bir şah hamlesidir.','tactic:double'),
L('hanging','Savunmasız taşı gör','Almadan önce karşılığı kontrol et.', ['Savunulmayan bir taş taktik hedef olabilir. Ancak onu almak seni mata götürüyorsa kazanç değildir.','Bir alma hamlesinden önce: Bu kare korunuyor mu? Rakip şah çekebilir mi? Daha büyük bir karşı tehdit var mı? diye sor.'],'Bir taşı almadan önce hangisi gerekir?',['Yalnız puanına bakmak','Rakibin karşılığını ve şah güvenliğini kontrol etmek','Hemen almak'],1,'Malzeme kazancı ancak rakibin güçlü karşılıkları incelenirse anlamlıdır.','capture'),
L('remove','Savunucuyu uzaklaştır','Bir hedefi kimin koruduğunu bul.', ['Bir hedefi savunan taşı almak, saptırmak veya başka bir görevle meşgul etmek hedefi savunmasız bırakabilir.','Önce savunucunun görevini belirle. Sonra değişimin sonunda hangi tarafın ne kazandığını hesapla.'],'Savunucuyu uzaklaştırmanın amacı nedir?',['Hedefin korumasını kaldırmak','Bütün taşları geri çekmek','Oyunu durdurmak'],0,'Koruma kalkınca hedefe yönelik taktik mümkün olabilir.','tactics'),
L('tempo','Zaman kazan','Tehditli gelişim hamlelerini seç.', ['Rakibin yanıtlamak zorunda olduğu tehditle gelişiyorsan tempo kazanabilirsin. Erken çıkan vezire gelişerek saldırmak buna örnektir.','Her tehdit iyi değildir. Rakibi daha iyi bir kareye zorlayıp kendi düzenini bozuyorsan zaman kazanmamış olabilirsin.'],'Tempo kazanarak gelişmeye örnek hangisidir?',['Atı geliştirirken rakip vezire saldırmak','Aynı taşı sebepsiz geri götürmek','Hamleyi atlamak'],0,'Tehdit ve gelişim tek hamlede birleşebilir.','opening'),
L('trade','Değişim hesabı','Alma dizisini sonuna kadar hesapla.', ['Önce benim aldığım taş, sonra rakibin aldığı taş, sonra devamındaki alışlar… Diziyi sakin biçimde sonuna kadar izle.','Malzeme öndeyken taş değişimi yararlı olabilir; fakat her değişim otomatik olarak iyi değildir. Piyon yapısı ve oyun sonu da önemlidir.'],'Vezirini yalnız bir kale için vermek, başka kazanç yoksa nasıldır?',['Yaklaşık 4 puan malzeme kaybı','Yaklaşık 4 puan kazanç','Eşit değişim'],0,'Vezir 9, kale 5 kabul edilir; başka gerekçe yoksa 4 puan kayıp vardır.','capture'),
L('plan','Konumdan plan çıkar','Üç soruyla hamle planla.', ['Rakip ne tehdit ediyor? En az etkin taşım hangisi? Nerede kalıcı bir hedef var? Bu sorular bir plan kurmana yardım eder.','Bir plan seçtikten sonra rakibin hamlesiyle yeniden kontrol et. Konum değiştiğinde planı güncellemek gerekir.'],'Her hamleden önce ilk kontrol hangisidir?',['Rakibin tehdidi','Sadece güzel görünen kare','Ezberlediğim sonraki hamle'],0,'Rakibin son hamlesi acil bir tehdide yol açmış olabilir.','arena'),
L('weak','Zayıf kare ve ileri karakol','Kalıcı kareleri değerlendirmeyi öğren.', ['Rakip piyonların kolayca süremediği, iyi korunan bir kare taşların için ileri karakol olabilir. Özellikle atlar bu karelerden yararlanır.','Bir karenin zayıflığı tek başına yeterli değildir. Oraya ulaşabilecek ve görev yapabilecek taşın olmalıdır.'],'İleri karakol için hangi durum elverişlidir?',['Rakip piyonun hemen sürebildiği kare','İyi korunan, piyonla kolayca kovalanamayan kare','Her köşe kare'],1,'Kalıcı ve korunmuş bir yerleşim taşın etkinliğini artırır.','arena'),
L('structure','Piyon zincirleri','Piyon yapısının kalıcı etkisini fark et.', ['Komşu dikeyde kendi piyonu olmayan piyon izole; aynı dikeyde kendi rengiyle üst üste duran piyonlar dubledir. Her yapı güçlü ve zayıf yanlar taşır.','Piyonlar geri gidemez. Sürüş yaparken bıraktıkları kareleri ve açılan hatları değerlendir.'],'İzole piyon ne demektir?',['Komşu dikeylerde kendi piyonu bulunmayan piyon','Son yataya ulaşan piyon','Şah çeken piyon'],0,'İzole piyon komşu dikeylerdeki kendi piyonlarından destek alamaz.','arena'),
L('passed','Geçer piyon','Terfi yolundaki engelleri değerlendir.', ['Aynı dikeyde veya komşu dikeylerde önünde ilerleyişini durdurabilecek rakip piyon bulunmayan piyon geçer piyondur.','Geçer piyonu destekle; rakibinkini uygun bir taşla bloke etmeyi düşün. Piyon sürmek kadar şahların ve kalelerin etkinliği de önemlidir.'],'Geçer piyonun temel hedefi nedir?',['Geri dönmek','Destekle son yataya ulaşıp terfi etmek','Yerinde sonsuza dek beklemek'],1,'Geçer piyon desteklenirse terfi tehdidi yaratabilir.','special:promotion'),
L('opposition','Şahların karşılaşması','Opozisyon fikrini tanı.', ['Aralarında bir kare bulunan aynı hat üzerindeki iki şah, birbirinin önünü kapatabilir. Böyle basit doğrudan opozisyonda sırası olmayan taraf çoğu zaman geçişi zorlar.','Opozisyon tek başına her konumu kazanmaz. Piyonların yeri, yedek hamleler ve hedef kareler sonucu değiştirir.'],'Opozisyon en çok hangi evrede önem kazanır?',['Şah ve piyon oyun sonlarında','Yalnız ilk hamlede','Taşlar kutudayken'],0,'Az taşlı şah ve piyon oyun sonlarında giriş karelerini belirlemeye yardımcı olur.','endgame'),
L('rookend','Kale oyun sonu','Etkin kaleyi ve şahı kullan.', ['Kaleyi pasif bir savunmaya hapsetmemeye çalış. Geçer piyonun arkasında etkin bir kale çoğu durumda yararlı bir ilk fikirdir.','Bu bir genel ilkedir, zorunlu kural değildir. Şahın güvenliği, yataydan şahlar ve terfi taktikleri somut olarak hesaplanır.'],'Kale oyun sonunda hangi yaklaşım genellikle yararlıdır?',['Etkin kale ve etkin şah','Kaleyi köşede unutmak','Sadece piyon saymak'],0,'Etkinlik, birçok kale oyun sonunda malzeme kadar önemlidir.','endgame'),
L('ladder','Merdiven matı','İki kaleyle alan daralt.', ['İki kale sırayla yatay ya da dikeyleri kapatarak rakip şahı kenara sürer. Bir kale keserken diğeri şah çekebilir.','Şahın kalelerine yaklaşmasına izin verme. Yaklaşırsa kaleyi güvenli uzaklığa taşı. Son hamlede gerçekten mat olduğunu kontrol et.'],'Merdiven matında temel fikir nedir?',['İki kaleyle sırayla alan daraltmak','Kaleleri şahın yanına korunmasız koymak','Piyonları geri sürmek'],0,'Kaleler birlikte hatları kapatır ve şahın alanını küçültür.','endgame'),
L('queenend','Vezirle temel mat','Şahını yardıma getir, patı önle.', ['Vezirle rakip şahın alanını daralt; kendi şahını destek için yaklaştır. Şahlar asla yan yana gelmez.','Rakibi kenara sıkıştırınca mat hamlesinden önce pat olup olmadığını kontrol et. Gereksiz yakın vezir hamlesi rakibe hiç yasal hamle bırakmayabilir.'],'Vezirle kazanırken özellikle hangi beraberlik tehlikesi vardır?',['Pat','Rok','Gelişim'],0,'Tehdit altında olmayan rakibe hiç hamle bırakmazsan pat olur.','endgame'),
L('backrank','Arka yatay matı','Şahın kaçış karelerini incele.', ['Kendi piyonlarının arkasında sıkışan şah, arka yataya giren kale veya vezire karşı savunmasız kalabilir.','Kaçış karesi oluşturmak bazen yararlıdır; fakat her piyon sürüşü güvenli değildir. Saldıran taşın alınmasını ve araya taş girilmesini de hesapla.'],'Arka yatay matını kolaylaştıran durum hangisidir?',['Şahın kendi piyonlarıyla kaçışsız kalması','Vezirin başlangıçta olması','Atların farklı renkte durması'],0,'Piyonlar şahın kaçış karelerini kapatabilir.','mate'),
L('calculation','Aday hamleler','Hesabı sıraya koy.', ['Önce rakibin tehdidini gör. Sonra şahları, alışları ve güçlü tehditleri aday olarak incele. Her aday için rakibin en iyi savunmasını ara.','İlk güzel görünen hamlede durma. Hesabın sonunda malzemeyi, şah güvenliğini ve taş etkinliğini yeniden değerlendir.'],'Hesaplarken rakip için hangi yanıtı aramalısın?',['En kötü yanıtını','En iyi savunmasını','Rastgele hamlesini'],1,'Bir plan rakibin güçlü yanıtlarına karşı da dayanmalıdır.','tactics'),
L('sacrifice','Fedanın gerekçesi','Karşılığı hesaplanmış fedayı ayırt et.', ['Feda, daha önemli bir hedef için malzemeyi bilinçli vermektir. Mat, kalıcı saldırı veya terfi gibi somut karşılıklar aranır.','Bir hamle yalnızca cesur göründüğü için iyi değildir. Zorunlu varyantı ve rakibin savunmalarını kontrol et.'],'Bir fedayı değerlendirirken ne gereklidir?',['Somut karşılığını ve savunmaları hesaplamak','Yalnız taşın rengine bakmak','Hep vezir vermek'],0,'Feda, hesaplanmış bir karşılığa dayanmalıdır.','tactics'),
L('draw','Beraberlikleri öğren','Talep ve otomatik sonuçları ayırt et.', ['Pat ve yetersiz mat malzemesi beraberliğe yol açabilir. Üç kez aynı konum ve her iki oyuncunun 50 hamle boyunca piyon oynamaması veya taş almaması belirli koşullarda beraberlik talebine temel olur.','Beş kez aynı konum ya da 75 hamlelik ilgili dizi otomatik beraberliktir; son hamle mat ise mat önceliklidir. Aynı konumda sıra, taşlar ve hamle hakları da aynı olmalıdır.'],'Aynı taş dizilişinde farklı rok hakları varsa konum tekrar sayımında aynı mıdır?',['Her zaman aynı','Hayır','Sadece beyaz için aynı'],1,'Sıra, taş konumları ve mümkün hamleleri etkileyen haklar aynı olmalıdır.','arena'),
L('sport','İyi bir oyun arkadaşı','Düşünmeye ve emeğe saygı göster.', ['Sıra rakibindeyken düşünmesine izin ver. Kazansan da kaybetsen de oyun sonunda emeğine teşekkür et.','Bir hatayı “kötü oyuncuyum” diye yorumlama. Konumu yeniden aç ve hangi tehdidi kaçırdığını bul. Hatalar çalışılacak konuyu gösterir.'],'Kaybettiğin bir oyundan sonra hangisi öğrenmene yardım eder?',['Rakibi suçlamak','Bir kritik hatayı incelemek','Bir daha oynamamak'],1,'Tek bir önemli hatayı anlamak bile sonraki oyununu güçlendirir.','arena'),
L('review','Maçını incele','Sonuçtan öğrenme hedefi çıkar.', ['Oyundan sonra ilk büyük tehdidi, boşa verilen taşı veya kaçan taktiği bul. Sadece son mat hamlesine bakma.','Kritik konumu yeniden kur. İki farklı aday hamle öner, rakibin karşılığını hesapla, bir sonraki çalışmanı buna göre seç.'],'Maç incelemesinin amacı nedir?',['Yalnız sonucu hatırlamak','Kararları anlayıp sonraki çalışmayı seçmek','Hataları gizlemek'],1,'İnceleme, yeni öğrenme hedefi belirlemek için yapılır.','arena')

<script id="app-code">'use strict';
const $=id=>document.getElementById(id);
const Chess=ChessLib.Chess;
const FILES='abcdefgh', TYPES=['r','n','b','q','k','p'];
const NAV=[['workshop','♜','Dev taş atölyesi'],['courses','▤','Ders yolculuğu'],['games','✦','Oyun adası'],['tactics','⌖','Taktik laboratuvarı'],['arena','⚑','Maç arenası'],['openings','♞','Açılış ve oyun sonu'],['exam','✓','Deneme sınavı'],['teacher','⚙','Öğretmen masası']];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>a.slice().sort(()=>Math.random()-.5);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const on=(id,event,fn)=>{const e=$(id);if(e)e.addEventListener(event,fn);};
const button=(text,id,cls)=>'<button id="'+id+'" class="'+(cls||'')+'">'+text+'</button>';
function readStore(){try{const v=JSON.parse(localStorage.getItem('baris-satranc-v1')||'{}');return v&&typeof v==='object'?v:{};}catch(e){return {};}}
const stored=readStore();
let grade=Number.isInteger(stored.grade)?clamp(stored.grade,0,8):0;
let prefs=Object.assign({sound:true,voice:'',rate:.88,pitch:.78,robot:true,calm:false,classroom:false,bot:'r'},stored.prefs||{});
let profiles=stored.profiles&&typeof stored.profiles==='object'?stored.profiles:{};
let currentPage='workshop',selectedPiece='r',studio=null,game=null,lessonIndex=0,puzzleState=null,openingState=null,exam=null;
const clipCache=new Map();
let timeouts=[],lastFocused=null,speechToken=0,isTalking=false,recordDB=null,audioCtx=null,audioSource=null,ringOsc=null,recorder=null,micStream=null;
let arena=null,aiWorker=null,aiJob=0,aiCallback=null;
function profile(){if(!profiles[grade]||typeof profiles[grade]!=='object')profiles[grade]={xp:0,correct:0,attempts:0,lessons:[],topics:{},pieces:[],puzzles:[],exams:[]};const p=profiles[grade];p.lessons=p.lessons||[];p.pieces=p.pieces||[];p.puzzles=p.puzzles||[];p.topics=p.topics||{};p.exams=p.exams||[];return p;}
function save(){try{localStorage.setItem('baris-satranc-v1',JSON.stringify({version:1,grade:grade,prefs:prefs,profiles:profiles}));}catch(e){toast('Bu tarayıcı ilerlemeyi saklayamadı. Öğretmen masasından yedek alabilirsiniz.');}}
function updateXP(){const p=profile();$('sideXP').textContent=p.xp||0;$('topXP').textContent=p.xp||0;$('sideMeter').style.width=((p.xp||0)%100)+'%';}
function award(topic,ok,points){const p=profile();p.attempts=(p.attempts||0)+1;p.correct=(p.correct||0)+(ok?1:0);p.xp=(p.xp||0)+(ok?(points||5):0);if(!p.topics[topic])p.topics[topic]={correct:0,attempts:0};p.topics[topic].attempts++;if(ok)p.topics[topic].correct++;save();updateXP();if(ok)chime('good');}
function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.add('hidden'),3500);}

function prepareBoardGame(){const g=game;g.done=false;g.selected=null;g.marked=[];g.roundMoves=0;if(g.id==='coordinates'||g.id==='color'){g.map={};g.target=g.id==='coordinates'?pick(allSquares().filter(s=>!g.used.includes(s))):null;g.color=Math.random()<.5?'Açık':'Koyu';return;}if(g.id==='setup'){g.map={};const initial=mapOf(new Chess());g.expected=Object.keys(initial).filter(s=>grade>2||initial[s].color==='w').map(s=>({sq:s,p:initial[s]}));g.remaining=shuffle(g.expected);g.setupTotal=g.remaining.length;g.ask=g.remaining[0].p;return;}g.from=g.id==='pawn'?'d2':g.id==='knight'?'d4':pick(['c3','d4','e5','f4']);g.map={[g.from]:{type:g.id==='pawn'?'p':g.id==='knight'?'n':g.type,color:'w'}};if(g.id==='stars'||g.id==='map'){if(grade>0){const spots=shuffle(allSquares().filter(s=>s!==g.from)).slice(0,g.id==='stars'?4:3);spots.forEach(s=>g.map[s]={type:'p',color:'w'});}if(!geometryMoves(g.type,g.from,g.map,'w').length){g.map={[g.from]:{type:g.type,color:'w'}};}if(g.id==='stars'){setStarTarget();g.stars=0;}}if(g.id==='knight'){g.visited=[g.from];g.type='n';}if(g.id==='pawn'){g.type='p';['e3','d5','c5','b7'].forEach(s=>g.map[s]={type:'p',color:'b'});}if(g.id==='capture'){g.type='q';g.from='d4';g.map={d4:{type:'q',color:'w'}};const base=geometryMoves('q','d4',g.map,'w'),spots=shuffle(base).slice(0,5);spots.forEach((s,i)=>g.map[s]={type:['q','r','b','n','p'][i],color:'b'});g.captures=geometryMoves('q',g.from,g.map,'w').filter(s=>g.map[s]);g.bestValue=Math.max(...g.captures.map(s=>PIECES[g.map[s].type].value));}}
function boardGameCopy(){const g=game;const desc={stars:'Taşına dokunmadan da varış karesini seçebilirsin. Beş yıldızı sırayla topla.',map:'Taşın tek hamlede gidebildiği bütün kareleri bul. Şah güvenliği bu hareket çalışmasının dışındadır.',knight:'Atla L çizerek daha önce uğramadığın 10 kareye ulaş. Başlangıç da bir duraktır.',pawn:'Piyonla düz ilerle, çaprazdaki rakibi al. Rakip taşlar bu hareket çalışmasında sabit durur.',capture:'Vezirin bir hamlede alabileceği en değerli taşı seç. Bu çalışmada karşı hamle yoktur.',coordinates:'İstenen adresi tahtada bul. Harf önce, sayı sonra gelir.',color:'İstenen renkte bir kareye dokun. Her turda yeni bir kare seç.',setup:'Söylenen taşı başlangıçtaki evine yerleştir. Vezir kendi rengindeki kareye gelir.'};let task='';if(g.id==='stars')task=PIECES[g.type].name+' ile '+g.target+' yıldızına ulaş. '+g.stars+' / 5 yıldız';if(g.id==='map')task=g.marked.length+' / '+geometryMoves(g.type,g.from,g.map,'w').length+' kare bulundu';if(g.id==='knight')task=g.visited.length+' / 10 durak';if(g.id==='pawn')task='Beyaz piyon yukarıya, 8. yataya ilerliyor.';if(g.id==='capture')task='Bir hamlede en yüksek yaklaşık puanı kazan.';if(g.id==='coordinates')task='Hedef adres: '+g.target;if(g.id==='color')task=g.color+' renkli, henüz seçmediğin bir kareyi bul.';if(g.id==='setup')task=(g.ask.color==='w'?'Beyaz ':'Siyah ')+PIECES[g.ask.type].name+' nereye yerleşir?';return{desc:desc[g.id],task:task};}
function renderBoardGame(){const g=game,info=boardGameCopy(),name=GAMES.find(x=>x.id===g.id).title;let selector=['stars','map'].includes(g.id)?'<label class="field">Çalışacağım taş<select id="gamePiece">'+['r','b','n','q','k'].map(t=>'<option value="'+t+'" '+(t===g.type?'selected':'')+'>'+PIECES[t].name+'</option>').join('')+'</select></label>':'';$('page').innerHTML=pageHead('OYUN ADASI',name,info.desc,button('Oyunlara dön','backGames','ghost'))+'<div class="game-layout"><div class="board-frame"><div id="gameBoard" class="board"></div></div><section class="stack"><div class="card"><span class="eyebrow">GÖREVİN</span><h2 id="gameTask">'+info.task+'</h2><div class="row"><span class="pill" id="gameCounter">'+g.moves+' hamle / seçim</span><span class="pill">'+(['stars','knight','pawn','setup'].includes(g.id)?'Kendi hızında çalış':(g.round+1)+' / '+(g.id==='map'?5:10)+' tur')+'</span></div><div class="spacer"></div>'+selector+'<div class="spacer"></div><div class="row">'+button('♫ Görevi dinle','gameSpeak','primary')+(!['color','setup','coordinates','capture','map'].includes(g.id)?button(g.showHints?'İpuçlarını gizle':'Gidebileceğim kareler','gameHint','ghost'):'')+'</div></div><div id="feedback" class="status">Hazır olduğunda tahtaya dokun.</div><div class="row">'+button('Yeni tur','gameNext','success')+button('Baştan başla','gameRestart','ghost')+'</div><div class="card"><h3>Birlikte düşün</h3><p class="muted" style="margin:0">'+(g.id==='pawn'?PIECES.p.short:g.id==='setup'?'Köşelerde kaleler, sonra atlar, sonra filler. Vezir kendi rengine, şah kalan kareye.':['color','coordinates'].includes(g.id)?'Tahta çevrilse de karelerin adresleri değişmez. Sağ alt köşe beyazdan bakınca h1, açık karedir.':PIECES[g.type].short)+'</p></div></section></div>';on('backGames','click',()=>navigate('games'));on('gameRestart','click',()=>startGame(g.id,g.type));on('gameSpeak','click',()=>speak(boardGameCopy().task+' '+info.desc));on('gameHint','click',()=>{g.showHints=!g.showHints;$('gameH function drawBoardGame(){const g=game;if(!g||!$('gameBoard'))return;const options={done:g.id==='knight'?g.visited:g.id==='map'?g.marked:g.used,selected:g.from};if(g.id==='stars'){options.tokens={[g.target]:'✦'};options.target=g.target;}if(g.showHints&&['stars','pawn','knight'].includes(g.id))options.hints=geometryMoves(g.type,g.from,g.map,'w').filter(s=>g.id!=='knight'||!g.visited.includes(s));renderBoard('gameBoard',g.map,options,s=>handleBoardGame(s));if($('gameTask'))$('gameTask').textContent=boardGameCopy().task;if($('gameCounter'))$('gameCounter').textContent=g.moves+' hamle / seçim';}

if(g.id==='color'||g.id==='coordinates'){if(g.used.includes(s)){status('Bu kareyi kullandın; başka bir kare seç.');return;}const[x,y]=squareXY(s),ok=g.id==='coordinates'?s===g.target:((x+y)%2===1)===(g.color==='Açık');if(!ok){drawBoardGame();return wrong(g.id==='coordinates'?'Harf ve sayıyı yeniden izle. Hedef '+g.target+'.':'Bu kare '+((x+y)%2===1?'açık':'koyu')+' renk. '+g.color+' kare ara.');}g.used.push(s);award(g.id==='coordinates'?'Koordinatlar':'Kare renkleri',true,3);drawBoardGame();return completeBoardGame('Doğru kare! Yeni hedef için sonraki tura geç.');}

function engineSearch(fen,level,maxMs){const c=new ChessLib.Chess(fen);const values={p:100,n:320,b:335,r:500,q:900,k:0};const start=Date.now();let nodes=0;const timeout={};function evaluate(){let total=0;c.board().flat().forEach(p=>{if(!p)return;const x=p.square.charCodeAt(0)-97,y=Number(p.square[1])-1,center=7-(Math.abs(x-3.5)+Math.abs(y-3.5)),adv=p.color==='w'?y:7-y;let bonus=0;if(p.type==='n')bonus=center*9;if(p.type==='b')bonus=center*4;if(p.type==='p')bonus=adv*9+center*2;if(p.type==='r')bonus=adv*2;total+=(p.color==='w'?1:-1)*(values[p.type]+bonus);});return total*(c.turn()==='w'?1:-1);}
function ordered(moves){return moves.sort((a,b)=>score(b)-score(a));}function score(m){return (m.captured?10*values[m.captured]-values[m.piece]:0)+(m.promotion?800:0)+(m.san.includes('#')?100000:m.san.includes('+')?35:0);}

t fen=openingState.fens[openingState.ply];newArena({mode:'bot',human:new Chess(fen).turn(),level:2},fen);navigate('arena');});drawOpening();}
function drawOpening(){const s=openingState,o=OPENINGS[s.index],c=new Chess(s.fens[s.ply]),m=s.ply?s.moves[s.ply-1]:null;renderBoard('openingBoard',mapOf(c),{last:m?[m.from,m.to]:[]},()=>{});$('openingStep').textContent=s.ply+' / '+o.line.length+' yarım hamle';$('openingMove').textContent=m?m.san:'Başlangıç konumu';$('openingNote').textContent=m?o.notes[s.ply-1]:'Önce merkezi, gelişimi ve şah güvenliğini düşün. Sonraki düğmesine dokun.';$('openingPrev').disabled=s.ply===0;$('openingNext').disabled=s.ply===o.line.length;$('openingAuto').textContent=s.auto?'Ⅱ Gösterimi durdur':'▶ Otomatik göster';$('openingSequence').innerHTML=o.line.map((san,i)=>'<span style="'+(i===s.ply-1?'background:#ffc56c;color:#201b13':'')+'">'+(i%2===0?Math.floor(i/2+1)+'. ':'')+san+'</span>').join('');}

function renderExamQuestion(){stopSpeech();const e=exam,q=e.questions[e.index];$('page').innerHTML=pageHead('DENEME SINAVI','Soru '+(e.index+1)+' / '+e.questions.length,'Cevabını seçtikten sonra ilerle.','<span class="pill" id="examTime">0:00</span>')+'<div class="quiz-center"><div class="meter"><i style="width:'+(e.index/e.questions.length*100)+'%"></i></div><div class="spacer"></div><section class="card"><div class="between"><span class="eyebrow">DÜŞÜN VE KARAR VER</span>'+button('♫ Soruyu dinle','examRead','ghost')+'</div><h2>'+q.question+'</h2><div class="stack">'+q.options.map((o,i)=>'<button class="option" data-exam-answer="'+i+'"><span class="letter">'+String.fromCharCode(65+i)+'</span>'+esc(o)+'</button>').join('')+'</div><div class="spacer"></div><div class="row">'+button(e.index===e.questions.length-1?'Denemeyi bitir':'Sonraki soru','examNext','primary')+button('Boş bırak','examSkip','ghost')+'</div><div class="spacer"></div><p class="small muted" style="margin:0">Doğru cevaplar deneme sonunda gösterilir.</p></section></div>';e.selected=null;$('examNext').disabled=true;document.querySelectorAll('[data-exam-answer]').forEach(b=>b.onclick=()=>{e.selected=Number(b.dataset.examAnswer);document.querySelectorAll('[data-exam-answer]').forEach(x=>{x.style.borderColor=x===b?'var(--gold)':'';x.style.background=x===b?'#3b3327':'';x.setAttribute('aria-pressed',x===b?'true':'false');});$('examNext').disabled=false;});on('examRead','click',()=>speak(q.question+'. '+q.options.map((o,i)=>String.fromCharCode(65+i)+': '+o).join('. ')));function advance(answer){e.answers.push(answer);award(q.topic||q.id||'Deneme',answer===q.answer,5);e.index++;if(e.index===e.questions.length)finishExam();else renderExamQuestion();}on('examNext','click',()=>advance(e.selected));on('examSkip','click',()=>advance(null));}
function finishExam(){const e=exam;e.finished=true;const correct=e.questions.filter((q,i)=>e.answers[i]===q.answer).length,blank=e.answers.filter(x=>x===null).length,wrong=e.questions.length-correct-blank;const record={date:new Date().toLocaleDateString('tr-TR'),correct:correct,total:e.questions.length,wrong:wrong,blank:blank};profile().exams.push(record);profile().exams=profile().exams.slice(-20);save();$('page').innerHTML=pageHead('DENEME SONUCU','Bir sonraki adımın belli.',GRADE_PLANS[grade].name+' · Tamamlandı',button('Yeni deneme','newExam','primary'))+'<div class="stats"><div class="card stat"><strong>'+correct+'</strong><span>Doğru</span></div><div class="card stat"><strong>'+wrong+'</strong><span>Yanlış</span></div><div class="card stat"><strong>'+blank+'</strong><span>Boş</span></div><div class="card stat"><strong>%'+Math.round(correct/e.questions.length*100)+'</strong><span>Başarı</span></div></div><div class="spacer"></div><h2>Cevaplarını incele</h2><div class="stack">'+e.questions.map((q,i)=>{const ok=e.answers[i]===q.answer;return '<section class="card"><span class="pill '+(ok?'green':'warm')+'">'+(i+1)+'. soru · '+(ok?'Doğru':e.answers[i]===null?'Boş':'Tekrar edelim')+'</span><h3 style="margin-top:13px">'+q.question+'</h3><p class="small muted">Senin cevabın: '+(e.answers[i]===null?'Boş':esc(q.options[e.answers[i]]))+'</p><p><b class="mint">Doğru cevap:</b> '+esc(q.options[q.answer])+'</p><p class="muted" style="margin:0">'+q.why+'</p></section>';}).join('')+'</div>';on('newExam','click',renderExamHome);}

pe="checkbox" id="classroomMode" '+(prefs.classroom?'checked':'')+'> Büyük yazı · akıllı tahta</label><label class="checklabel"><input type="checkbox" id="calmMode" '+(prefs.calm?'checked':'')+'> Sakin görünüm · hareketleri azalt</label><label class="field">Sınıf botu<select id="teacherBot"><option value="r">Kale-Bot</option><option value="n">Bilge At</option><option value="q">Vezir-Bot</option></select></label><div class="row">'+button('Ses stüdyosu','teacherVoice','primary')+button('Tahta kur','boardEditor','ghost')+button('Sınıf düellosu','teamGame','ghost')+'</div><p class="small muted">Anaokulunda kısa yönergeler, tek taş ve tekrar kullanın. Öğrencinin hazırbulunuşluğuna göre sınıf seçimini değiştirebilirsiniz.</p></section><section class="card"><h2>Çalışılan konular</h2><div class="topic-progress">'+(topics.length?topics.map(([id,t])=>'<div><div class="between"><span>'+esc(topicName(id))+'</span><span>'+t.correct+' / '+t.attempts+'</span></div><div class="meter"><i style="width:'+(t.correct/t.attempts*100)+'%"></i></div></div>').join(''):'<p class="muted">Bir oyun veya ders sorusu çözüldüğünde burada görünür.</p>')+'</div></section><section class="card"><h2>Keşif rozetleri</h2><div class="badge-grid">'+awards.map(a=>'<div class="award '+(a[2]?'earned':'')+'"><b class="glyph">'+a[0]+'</b><span class="small">'+a[1]+'</span><div class="small muted">'+(a[2]?'Kazanıldı':'Henüz değil')+'</div></div>').join('')+'</div></section></div><div class="spacer"></div><section class="card"><h2>Çalışmanı sakla</h2><p class="muted">Tüm sınıfların puanlarını, derslerini ve denemelerini yedekleyebilirsin. Ses kayıtlarını ses stüdyosundan ayrıca indir.</p><div class="row">'+button('İlerleme yedeğini indir','backupProgress','success')+'<label class="field" style="max-width:310px">İlerleme yedeği yükle<input id="restoreProgress" type="file" accept=".json,application/json"></label>'+button('Kullanım ve kaynaklar','aboutApp','ghost')+'</div></section><p class="footer-note">Satranç Evreni · Barış Öğretmen<br>Her hamlede düşün, her oyunda öğren.</p>';on('printReport','click',()=>window.print());on('teacherVoice','click',openVoice);on('boardEditor','click',openEditor);on('teamGame','click',()=>startGame('teams'));$('teacherBot').value=prefs.bot;on('teacherBot','change',e=>{prefs.bot=e.target.value;applyPrefs();});on('classroomMode','change',e=>{prefs.classroom=e.target.checked;applyPrefs();});on('calmMode','change',e=>{prefs.calm=e.target.checked;applyPrefs();});on('teacherPiece','change',e=>{selectedPiece=e.target.value;drawTeachingPlan();});on('lessonDuration','change',e=>{teachingTimer.duration=Number(e.target.value)*60;teachingTimer.left=teachingTimer.duration;teachingTimer.running=false;drawTeachingPlan();updateTeachingClock();});on('timerStart','click',()=>{teachingTimer.running=!teachingTimer.running;teachingTimer.last=performance.now();updateTeachingClock();});on('timerReset','click',()=>{teachingTimer.running=false;teachingTimer.left=teachingTimer.duration;updateTeachingClock();});on('backupProgress','click',()=>download('satranc-ilerlemem.json',JSON.stringify({version:1,profiles:profiles},null,2),'application/json'));on('restoreProgress','change',async e=>{const file=e.target.files[0];if(!file)return;if(file.size>2*1024*1024){toast('Yedek dosyası çok büyük.');return;}try{const incoming=validateProgress(JSON.parse(await file.text()));openModal('İlerleme yedeğini yükle','<p>Dosyadaki sınıfların ilerlemesi, bu cihazdaki aynı sınıfların kayıtlarının yerine geçecek.</p>'+button('Yedeği yükle','confirmRestore','primary'),true);on('confirmRestore','click',()=>{profiles=Object.assign({},profiles,incoming);save();updateXP();closeModal();renderTeacher();toast('İlerleme yedeği yüklendi.');});}catch(e){toast('Geçerli bir Satranç Evreni yedeği seçin.');}});on('aboutApp','click',aboutApp);$('lessonDuration').value=String(teachingTimer.duration/60);drawTeachingPlan();updateTeachingClock();}
function drawTeachingPlan(){const el=$('teachingPlan');if(!el)return;const minutes=Number($('lessonDuration').value),a=Math.max(2,Math.round(minutes*.15)),b=Math.round(minutes*.25),c=Math.round(minutes*.4),d=minutes-a-b-c;el.innerHTML='<ol class="steps"><li><b>'+a+' dk · Hatırla:</b> Taşı göster, adını ve bir hareketini sor.</li><li><b>'+b+' dk · Keşfet:</b> Dev '+PIECES[selectedPiece].name+' modelini döndür, kurallarını dinle.</li><li><b>'+c+' dk · Uygula:</b> '+(grade<3?'Hareket haritası ve yıldız rotası':'Bir taktik konumu ve kısa çalışma maçı')+' yap.</li><li><b>'+d+' dk · Paylaş:</b> “Bugün hangi hamleyi öğrendim?” sorusunu cevapla.</li></ol>';}

function validateProgress(v){if(!v||v.version!==1||!v.profiles||typeof v.profiles!=='object')throw Error();const out={},num=n=>Number.isFinite(n)&&n>=0?Math.min(n,10000000):0;for(const key of Object.keys(v.profiles)){if(!/^[0-8]$/.test(key))continue;const p=v.profiles[key];if(!p||typeof p!=='object')continue;const topics={};for(const [name,t]of Object.entries(p.topics||{}).slice(0,200)){if(t&&typeof t==='object'&&name!=='__proto__'&&name.length<100)topics[name]={correct:Math.min(num(t.correct),num(t.attempts)),attempts:num(t.attempts)};}out[key]={xp:num(p.xp),correct:Math.min(num(p.correct),num(p.attempts)),attempts:num(p.attempts),lessons:Array.isArray(p.lessons)?p.lessons.filter(id=>LESSONS.some(l=>l.id===id)):[],pieces:Array.isArray(p.pieces)?p.pieces.filter(t=>TYPES.includes(t)):[],puzzles:Array.isArray(p.puzzles)?p.puzzles.filter(id=>TACTICS.some(t=>t.id===id)||Object.keys(SPECIALS).some(k=>'special-'+k===id)):[],topics:topics,exams:Array.isArray(p.exams)?p.exams.filter(e=>e&&e.total>0&&e.total<=100&&e.correct>=0&&e.correct<=e.total).slice(-20).map(e=>({date:String(e.date).slice(0,20),correct:num(e.correct),total:num(e.total)})):[]};}if(!Object.keys(out).length)throw Error();return out;}
function mapToFen(map,turn,rights,ep){const rows=[];for(let y=8;y>=1;y--){let s='',empty=0;for(const x of FILES){const p=map[x+y];if(p){if(empty)s+=empty;empty=0;s+=p.color==='w'?p.type.toUpperCase():p.type;}else empty++;}if(empty)s+=empty;rows.push(s);}return rows.join('/')+' '+turn+' '+(rights||'-')+' '+(ep||'-')+' 0 1';}
function openEditor(){let map={},brush={type:'k',color:'w'};openModal('Çalışma tahtası kur','<p class="muted">Bir taşı seç, sonra yerleştireceğin kareye dokun. Oyuna geçmek için iki şah da bulunmalı.</p><div class="grid cols2"><div class="board-frame"><div id="editorBoard" class="board"></div></div><div class="stack"><div class="row" id="editorPalette">'+['w','b'].map(col=>TYPES.map(t=>'<button data-brush="'+col+t+'" aria-label="'+(col==='w'?'Beyaz ':'Siyah ')+PIECES[t].name+'" style="font-size:1.7rem;padding:5px 10px" class="glyph">'+(col==='w'?{r:'♖',b:'♗',n:'♘',q:'♕',k:'♔',p:'♙'}[t]:PIECES[t].glyph)+'</button>').join('')).join('')+'</div><div class="row">'+button('Silgi','editorErase','ghost')+button('Boşalt','editorClear','ghost')+button('Başlangıç dizilişi','editorInitial','ghost')+'</div><p class="small mint" id="editorBrush">Seçili: Beyaz şah</p><label class="field">Hamle sırası<select id="editorTurn"><option value="w">Beyaz</option><option value="b">Siyah</option></select></label><label class="field">Rok hakları (KQkq veya -)<input id="editorRights" value="-" maxlength="4"></label><label class="field">Geçerken alma hedefi (ör. d6 veya -)<input id="editorEP" value="-" maxlength="2"></label></div></div><div class="spacer"></div><div class="status" id="editorStatus">Rok haklarını yalnız şah ve ilgili kale hiç oynamadıysa ekleyin.</div><div class="spacer"></div>'+button('Bu konumla oyna','editorPlay','primary'));function draw(){renderBoard('editorBoard',map,{},s=>{if(brush)map[s]={...brush};else delete map[s];draw();});}document.querySelectorAll('[data-brush]').forEach(b=>b.onclick=()=>{brush={color:b.dataset.brush[0],type:b.dataset.brush[1]};$('editorBrush').textContent='Seçili: '+(brush.color==='w'?'Beyaz ':'Siyah ')+PIECES[brush.type].name;});on('editorErase','click',()=>{brush=null;$('editorBrush').textContent='Seçili: Silgi';});on('editorClear','click',()=>{map={};draw();});on('editorInitial','click',()=>{map=mapOf(new Chess());$('editorRights').value='KQkq';draw();});on('editorPlay','click',()=>{try{const fen=mapToFen(map,$('editorTurn').value,$('editorRights').value.trim(),$('editorEP').value.trim()),c=new Chess(fen),other=c.turn()==='w'?'b':'w',k=c.findPiece({type:'k',color:other})[0];if(c.isAttacked(k,c.turn()))throw Error('Sırası olmayan şah tehdit altında. Taşların yerini kontrol edin.');newArena({mode:'human'},fen);closeModal();navigate('arena');}catch(e){$('editorStatus').textContent='Konum açılamadı: '+e.message;}});draw();}
function aboutApp(){openModal('Satranç Evreni hakkında','<div class="stack"><p><b>Tek dosyada çalışma:</b> Taş modelleri, dersler, oyunlar ve satranç altyapısı dosyanın içindedir. Ana özellikler harici bir siteye veya API anahtarına ihtiyaç duymaz.</p><p><b>Ses:</b> Cihazın Türkçe konuşma sesi kullanılır. Sesin bulunması ve çevrimdışı çalışması cihaza bağlıdır. Mikrofon kaydı için tarayıcının izni gerekir; GitHub Pages gibi HTTPS sayfalarda kullanılabilir. Yüklenen veya kaydedilen gerçek seslere robot efekti uygulanır. Konuşma sesine uygulanan perde/hız ayarı bunun ayrı bir seçeneğidir.</p><p><b>İlerleme:</b> Kayıtlar bu tarayıcıya aittir. Sınıf değiştirince o sınıfın ilerlemesi gösterilir; bunlar ayrı öğrenci hesapları değildir. Tarayıcı verileri silinmeden önce yedek alın.</p><p><b>Maçlar:</b> Yerel eğitim botu ve aynı cihazda iki oyuncu bulunur. İnternet üzerinden eşleştirme yoktur. Bot değerlendirmeleri öğretim amaçlı sınırlı hesaplamalardır. Maç geçmişi sayfa yenilenince korunmaz; PGN indirerek saklayın.</p><p><b>Beraberlik:</b> Mat, pat ve temel yetersiz malzeme durumları denetlenir. Mevcut konumdaki üç tekrar / 50 hamle için talep düğmesi vardır; beş tekrar / 75 hamle otomatik uygulanır. Bu çalışma aracı, resmî turnuva hakemliğinin tüm talep ve itiraz süreçlerini yürütmez.</p><p><b>Öğretim:</b> Sınıf yolları önerilen çalışma sırasıdır; öğrencinin hazırbulunuşluğuna göre değiştirilebilir. Hareket oyunları sadeleştirilmiş alıştırmalardır; tam şah güvenliği maç ve taktik tahtalarında uygulanır.</p><p><b>Kaynaklar ve açık kaynak:</b> <a href="https://handbook.fide.com/chapter/E012023" target="_blank" rel="noopener">FIDE Satranç Kuralları</a> · <a href="https://jhlywa.github.io/chess.js/" target="_blank" rel="noopener">chess.js 1.4.0</a> · <a href="https://threejs.org/" target="_blank" rel="noopener">Three.js r158</a> · <a href="https://developer.mozilla.org/en-US/docs/Web/API/SpeechSynthesisUtterance" target="_blank" rel="noopener">Tarayıcı konuşma desteği</a>. Kütüphane lisansları bu HTML dosyasının kaynak kodunda korunmuştur.</p></div>');}
function boot(){
 $('nav').innerHTML=NAV.map(n=>'<button data-page="'+n[0]+'"><span class="navicon glyph">'+n[1]+'</span>'+n[2]+'</button>').join('');
 $('grade').innerHTML=GRADE_PLANS.map((g,i)=>'<option value="'+i+'">'+g.name+'</option>').join('');$('grade').value=String(grade);
 document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));
 on('grade','change',e=>{grade=Number(e.target.value);lessonIndex=0;save();updateXP();navigate(currentPage);toast(GRADE_PLANS[grade].name+' çalışma alanı seçildi.');});
 on('voiceOpen','click',openVoice);on('fullScreen','click',fullscreen);
 on('botToggle','click',()=>{const hidden=$('botPanel').classList.toggle('hidden');$('botToggle').setAttribute('aria-expanded',String(!hidden));});
 on('botClose','click',()=>{$('botPanel').classList.add('hidden');$('botToggle').setAttribute('aria-expanded','false');});
 on('botSelect','change',e=>{prefs.bot=e.target.value;updateBot();save();sayBot(PIECES[prefs.bot].short);});
 on('botRead','click',()=>speak($('botText').textContent));on('stopVoice','click',stopSpeech);
 $('botQuestions').innerHTML=BOT_FAQ.map((q,i)=>'<button data-faq="'+i+'">'+q[0]+'</button>').join('');
 document.querySelectorAll('[data-faq]').forEach(b=>b.onclick=()=>{const q=BOT_FAQ[Number(b.dataset.faq)];sayBot(q[1]);speak(q[1]);});
 if(window.speechSynthesis)speechSynthesis.addEventListener('voiceschanged',()=>{if($('voiceChoice'))$('voiceChoice').innerHTML=voiceOptions();});
 applyPrefs();updateXP();navigate('workshop');getVoiceDB().then(()=>TYPES.forEach(t=>clipGet('piece-'+t))).catch(()=>{});
 setInterval(()=>{tickClock();if(exam&&!exam.finished&&$('examTime')){const s=Math.floor((performance.now()-exam.start)/1000);$('examTime').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}if(teachingTimer.running){const now=performance.now();teachingTimer.left-=((now-teachingTimer.last)/1000);teachingTimer.last=now;if(teachingTimer.left<=0){teachingTimer.left=0;teachingTimer.running=false;chime('good');toast('Ders süresi tamamlandı. Kısa bir değerlendirme yapabilirsiniz.');}updateTeachingClock();}},200);
 document.addEventListener('visibilitychange',()=>{if(document.hidden&&arena&&arena.running)pauseArena();});
 window.addEventListener('beforeunload',()=>{if(micStream)micStream.getTracks().forEach(t=>t.stop());});
 try{const ctx=document.modelContext;if(ctx&&ctx.registerTool){const tool={name:'read_chess_learning_state',title:'Satranç öğrenme durumunu oku',description:'Seçili sınıfı, açık çalışma bölümünü ve bu cihazdaki ilerleme sayılarını okur.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute(input){if(input&&Object.keys(input).length)throw Error('Bu işlem parametre almaz.');const p=profile();return{grade:GRADE_PLANS[grade].name,page:currentPage,xp:p.xp,completedLessons:p.lessons.length,solvedPuzzles:p.puzzles.length};}};Promise.resolve(ctx.registerTool(tool)).catch(()=>{});}}catch(e){}
}
// Uygulamayı başlat.
boot();
</script>
