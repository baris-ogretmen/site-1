<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060a1c">
<title>Galaksi Akademi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060a1c; --cam:rgba(255,255,255,.07); --cam2:rgba(255,255,255,.12); --cizgi:rgba(255,255,255,.14);
  --yazi:#f4f6ff; --soluk:#a9b2d6; --mor:#9b6bff; --pembe:#ff5d8f; --sari:#ffd36b; --yesil:#2ed3a0; --mavi:#4f8cff; --turuncu:#ff8a3d;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:'Baloo 2',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--yazi);min-height:100vh;overflow-x:hidden;
  background:radial-gradient(1200px 700px at 85% -10%,rgba(155,107,255,.28),transparent 60%),
             radial-gradient(900px 600px at -10% 110%,rgba(79,140,255,.25),transparent 60%),
             radial-gradient(700px 500px at 50% 50%,rgba(255,93,143,.08),transparent 70%),var(--bg);
  -webkit-user-select:none;user-select:none}
input,select,textarea{-webkit-user-select:text;user-select:text;font-family:inherit}
#yildizlar{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.ekran{display:none;position:relative;z-index:1;min-height:100vh;padding:16px 16px 90px;max-width:1100px;margin:0 auto}
.ekran.aktif{display:block;animation:gir .45s ease}
@keyframes gir{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1,h2,h3{line-height:1.1}
.cam{background:var(--cam);border:1px solid var(--cizgi);border-radius:22px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btn{border:0;cursor:pointer;font:inherit;font-weight:800;color:#fff;border-radius:999px;padding:12px 22px;font-size:18px;
  background:linear-gradient(135deg,var(--pembe),var(--mor));box-shadow:0 8px 24px rgba(155,107,255,.35),inset 0 -3px 0 rgba(0,0,0,.18);
  transition:transform .12s ease,filter .2s}
.btn:active{transform:scale(.95)}
.btn.yesil{background:linear-gradient(135deg,#25d39a,#0f9c7a);box-shadow:0 8px 24px rgba(46,211,160,.35),inset 0 -3px 0 rgba(0,0,0,.18)}
.btn.sari{background:linear-gradient(135deg,#ffcf4d,#ff8a3d);box-shadow:0 8px 24px rgba(255,170,60,.35),inset 0 -3px 0 rgba(0,0,0,.18)}
.btn.mavi{background:linear-gradient(135deg,#56d8ff,#3b6dff)}
.btn.hayalet{background:var(--cam2);box-shadow:none;border:1px solid var(--cizgi)}
.btn.kucuk{padding:8px 14px;font-size:15px}
.ust-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.geri{width:46px;height:46px;border-radius:50%;border:1px solid var(--cizgi);background:var(--cam2);color:#fff;font-size:22px;cursor:pointer;flex:none}
.bosluk{flex:1}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-120px);z-index:9999;background:rgba(20,24,52,.96);border:1px solid var(--cizgi);
  padding:12px 20px;border-radius:16px;font-weight:700;box-shadow:0 12px 40px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.2,.9,.3,1.3);max-width:92vw;text-align:center}
.toast.goster{transform:translateX(-50%) translateY(0)}
/* robot */
.robot{overflow:visible;display:block}
.robot.oynak{animation:zipla 2.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes zipla{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-6px) rotate(-3deg)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(-4px) rotate(3deg)}}
.robot .anten{animation:yanson 1.4s infinite}
@keyframes yanson{50%{opacity:.35}}
.robot .alev{animation:alev .18s infinite alternate;transform-origin:50% 0}
@keyframes alev{to{transform:scaleY(1.35)}}
.robot .kalp{animation:kalp 1.2s infinite;transform-origin:60px 86px}
@keyframes kalp{50%{transform:scale(1.25)}}
.robot .pirilti{animation:pir 1.6s infinite}
@keyframes pir{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
/* açılış */
.acilis{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:calc(100vh - 110px);gap:18px}
.logo{font-size:clamp(40px,9vw,84px);font-weight:800;letter-spacing:.5px;
  background:linear-gradient(90deg,#ffd36b,#ff5d8f,#9b6bff,#56d8ff,#ffd36b);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:akis 6s linear infinite;
  filter:drop-shadow(0 6px 30px rgba(155,107,255,.45))}
@keyframes akis{to{background-position:300% 0}}
.slogan{color:var(--soluk);font-size:clamp(17px,3.6vw,24px);max-width:640px}
.acilis-robotlar{display:flex;gap:6px;align-items:flex-end;justify-content:center}
.acilis-robotlar .robot:nth-child(2){animation-delay:-.8s}.acilis-robotlar .robot:nth-child(3){animation-delay:-1.6s}
.yorunge{position:relative;width:260px;height:260px;display:grid;place-items:center}
.yorunge::before{content:"";position:absolute;inset:0;border:2px dashed rgba(255,255,255,.18);border-radius:50%;animation:don 30s linear infinite}
.yorunge .uydu{position:absolute;inset:0;animation:don 9s linear infinite}
.yorunge .uydu span{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:28px}
.yorunge .uydu.b{animation-duration:14s;animation-direction:reverse}.yorunge .uydu.b span{top:auto;bottom:-14px}
@keyframes don{to{transform:rotate(360deg)}}
.ogretmen-gizli{position:fixed;right:14px;top:14px;z-index:20;opacity:.45;font-size:13px}
/* giriş */
.giris-kutu{max-width:760px;margin:0 auto;padding:22px}
.alan-etiket{font-weight:700;color:var(--soluk);margin:10px 0 6px;display:block}
.girdi{width:100%;padding:14px 16px;font-size:19px;border-radius:16px;border:2px solid var(--cizgi);background:rgba(0,0,0,.25);color:#fff;outline:none}
.girdi:focus{border-color:var(--mor)}
select.girdi option{color:#000}
.iki{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.tasarim{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center;margin-top:12px}
.secim-sira{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.renk-top{width:40px;height:40px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.renk-top.sec{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.secim-btn{padding:6px 14px;border-radius:12px;border:2px solid var(--cizgi);background:var(--cam);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.secim-btn.sec{border-color:var(--sari);background:rgba(255,211,107,.15)}
.kahramanlar{display:flex;gap:8px;flex-wrap:wrap}
.kahraman-chip{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border-radius:999px;background:var(--cam2);border:1px solid var(--cizgi);cursor:pointer;font-weight:700}
/* harita */
.oyuncu-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
.oyuncu-ad{font-weight:800;font-size:20px;line-height:1}
.oyuncu-alt{color:var(--soluk);font-size:14px}
.yildiz-sayac{font-weight:800;font-size:22px;padding:6px 14px;border-radius:999px;background:rgba(255,211,107,.15);border:1px solid rgba(255,211,107,.4);color:var(--sari)}
.gorev-kart{display:flex;align-items:center;gap:14px;padding:14px 16px;margin:14px 0;background:linear-gradient(135deg,rgba(255,211,107,.18),rgba(255,93,143,.14));border:1px solid rgba(255,211,107,.35);border-radius:20px}
.gorev-kart .hediye{font-size:40px;animation:sallan 2s infinite}
@keyframes sallan{0%,100%{transform:rotate(0)}10%{transform:rotate(-12deg)}20%{transform:rotate(10deg)}30%{transform:rotate(-6deg)}40%{transform:rotate(0)}}
.yol{position:relative;display:flex;flex-direction:column;gap:6px;padding:10px 0 30px}
.durak{display:flex;align-items:center;gap:16px;width:min(560px,100%);cursor:pointer;padding:8px;border-radius:24px;transition:background .2s}
.durak:hover{background:rgba(255,255,255,.04)}
.durak:nth-child(even){align-self:flex-end;flex-direction:row-reverse;text-align:right}
.durak:nth-child(odd){align-self:flex-start}
.gezegen{position:relative;flex:none;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-size:38px;
  box-shadow:inset -14px -14px 26px rgba(0,0,0,.35),inset 10px 10px 20px rgba(255,255,255,.25),0 0 40px var(--parilti,rgba(155,107,255,.4));animation:suzul 5s ease-in-out infinite}
.gezegen::after{content:"";position:absolute;width:140%;height:26%;border:3px solid rgba(255,255,255,.45);border-radius:50%;transform:rotate(-18deg);left:-20%;top:37%;border-left-color:transparent;border-bottom-color:transparent}
@keyframes suzul{50%{transform:translateY(-7px)}}
.durak:nth-child(2n) .gezegen{animation-delay:-2.5s}
.durak-ad{font-weight:800;font-size:22px}
.durak-alt{color:var(--soluk);font-size:15px}
.ev-rozet{display:inline-block;font-size:13px;padding:2px 10px;border-radius:999px;background:var(--yesil);color:#03241a;font-weight:800;margin-top:3px}
.durak .yld{color:var(--sari);font-weight:800;font-size:15px}
/* gezegen merkezi */
.merkez-bas{display:flex;align-items:center;gap:18px;padding:18px;margin-bottom:16px;flex-wrap:wrap}
.merkez-bas .gezegen{width:110px;height:110px;font-size:48px}
.oyun-izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.oyun-kart{padding:18px;border-radius:22px;cursor:pointer;position:relative;overflow:hidden;border:1px solid var(--cizgi);background:var(--cam);transition:transform .15s}
.oyun-kart:active{transform:scale(.97)}
.oyun-kart .ik{font-size:48px;line-height:1;margin-bottom:6px;display:inline-block}
.oyun-kart:hover .ik{animation:sallan 1s}
.oyun-kart h3{font-size:22px}
.oyun-kart p{color:var(--soluk);font-size:15px;margin-top:4px}
.oyun-kart .en{position:absolute;right:14px;top:12px;color:var(--sari);font-size:18px;letter-spacing:1px}
.oyun-kart.tahta-kart{background:linear-gradient(135deg,rgba(255,93,143,.18),rgba(79,140,255,.18))}
/* soru */
.soru{padding:16px;border-radius:22px;background:var(--cam);border:1px solid var(--cizgi);margin-top:12px}
.soru-buyuk{font-size:clamp(36px,8vw,60px);text-align:center;letter-spacing:4px;line-height:1.25;margin:4px 0 8px;word-break:break-all}
.soru-metin{font-size:clamp(20px,4.4vw,28px);font-weight:800;text-align:center;margin-bottom:12px}
.mini-ses{border:0;background:var(--cam2);color:#fff;border-radius:50%;width:36px;height:36px;font-size:17px;cursor:pointer;vertical-align:middle;margin-left:4px}
.secenekler{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.secenek{font:inherit;font-weight:800;font-size:clamp(19px,4.2vw,26px);color:#fff;padding:14px 10px;border-radius:18px;border:2px solid var(--cizgi);cursor:pointer;
  background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));transition:transform .1s}
.secenek:active{transform:scale(.96)}
.secenek.dogru{background:linear-gradient(135deg,#25d39a,#0f9c7a);border-color:#7dffd0;animation:pop .4s}
.secenek.yanlis{background:linear-gradient(135deg,#ff5d6c,#c0263e);border-color:#ffa3ad;animation:titre .4s}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes titre{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
/* kodlama */
.bilgi-satir{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-weight:700}
.rozet{padding:4px 12px;border-radius:999px;background:var(--cam2);border:1px solid var(--cizgi)}
.tahta{position:relative;display:grid;width:min(94vw,440px);margin:0 auto;aspect-ratio:1;border-radius:20px;overflow:hidden;
  background:linear-gradient(135deg,#1b2459,#2a1957);border:3px solid rgba(255,255,255,.18);box-shadow:0 20px 50px rgba(0,0,0,.45)}
.hucre{display:grid;place-items:center;border:1px solid rgba(255,255,255,.06);font-size:clamp(20px,6vw,34px)}
.hucre.engel{background:rgba(0,0,0,.25)}
.hedef-yildiz{animation:pir2 1.4s infinite;display:inline-block}
@keyframes pir2{50%{transform:scale(1.18) rotate(12deg)}}
.k-robot{position:absolute;display:grid;place-items:center;transition:left .28s ease,top .28s ease;pointer-events:none;padding:4%}
.k-robot.carp{animation:titre .4s}
.program{display:flex;flex-wrap:wrap;gap:6px;min-height:58px;margin:14px auto 10px;padding:10px;border-radius:18px;background:rgba(0,0,0,.25);border:2px dashed var(--cizgi);max-width:640px}
.program:empty::before{content:"Okları seçerek programını buraya diz…";color:var(--soluk);font-weight:600;align-self:center;padding:0 6px}
.blok{padding:6px 10px;border-radius:12px;background:linear-gradient(135deg,#4f8cff,#9b6bff);font-weight:800;font-size:20px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.blok.calisiyor{background:linear-gradient(135deg,#ffd36b,#ff8a3d);transform:scale(1.12)}
.palet{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.ok-btn{width:68px;height:68px;border-radius:20px;border:0;font-size:32px;cursor:pointer;background:linear-gradient(180deg,#3b4a9e,#27306b);box-shadow:inset 0 -4px 0 rgba(0,0,0,.3);color:#fff}
.ok-btn:active{transform:scale(.92)}
.mesaj{text-align:center;font-weight:700;min-height:28px;margin-top:8px;color:var(--sari)}
/* satranç */
.s-tahta{display:grid;width:min(94vw,460px);aspect-ratio:1;margin:0 auto;border-radius:16px;overflow:hidden;border:4px solid #c9a46a;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.s-kare{position:relative;display:grid;place-items:center;font-size:clamp(20px,6vw,36px);cursor:pointer}
.s-kare.a{background:#f1dcb4}.s-kare.k{background:#b88a5a}
.s-kare.yasal::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(46,211,160,.75);box-shadow:0 0 12px rgba(46,211,160,.8);animation:kalp 1.2s infinite}
.s-tas{font-size:clamp(28px,9vw,52px);color:#2a1957;text-shadow:0 2px 0 #fff,0 0 10px rgba(255,255,255,.7);animation:pop .3s}
/* penaltı */
.saha{position:relative;border-radius:22px;overflow:hidden;padding:18px 12px 120px;
  background:repeating-linear-gradient(180deg,#1f9b4f 0 34px,#23ad58 34px 68px);border:3px solid rgba(255,255,255,.25)}
.saha::after{content:"";position:absolute;left:50%;bottom:-60px;width:220px;height:120px;transform:translateX(-50%);border:3px solid rgba(255,255,255,.5);border-radius:50%}
.kale{position:relative;margin:0 auto;width:min(92%,540px);aspect-ratio:2.6;border:7px solid #fff;border-bottom:none;border-radius:8px 8px 0 0;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.18) 0 2px,transparent 2px 14px),repeating-linear-gradient(-45deg,rgba(255,255,255,.18) 0 2px,transparent 2px 14px),rgba(0,0,0,.18)}
.kale.salla{animation:ag .5s}
@keyframes ag{25%{transform:scale(1.03,1.06)}50%{transform:scale(.99)}}
.bolgeler{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);z-index:3}
.bolge{border:2px dashed transparent;border-radius:10px;cursor:pointer;display:grid;place-items:center;font-size:26px}
.bolgeler.aktif .bolge{border-color:rgba(255,255,255,.55);background:rgba(255,211,107,.12);animation:yanson 1.1s infinite}
.kaleci{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);transition:transform .45s cubic-bezier(.2,.8,.3,1);z-index:2;width:22%}
.kaleci svg{width:100%;height:auto}
.top-k{position:absolute;bottom:26px;left:50%;font-size:46px;transform:translate(-50%,0);z-index:4;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
.yorum{position:absolute;left:0;right:0;bottom:58px;text-align:center;font-weight:800;font-size:clamp(20px,5vw,30px);text-shadow:0 3px 10px rgba(0,0,0,.6);z-index:5;padding:0 10px}
.yorum.gol{font-size:clamp(40px,11vw,80px);color:var(--sari);animation:pop .5s}
.skor-satir{display:flex;justify-content:center;gap:8px;margin-bottom:10px}
.skor-top{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--cam2);border:2px solid var(--cizgi);font-size:20px}
/* hafıza */
.h-yuz{display:flex;flex-direction:column;align-items:center;margin-bottom:10px}
.h-durum{font-weight:800;font-size:24px;margin-top:4px}
.h-izgara{display:grid;gap:14px;width:min(92vw,460px);margin:0 auto}
.h-pad{aspect-ratio:1.2;border-radius:26px;border:0;cursor:pointer;font-size:44px;opacity:.5;transition:opacity .12s,transform .12s,box-shadow .12s;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25)}
.h-pad.yan{opacity:1;transform:scale(1.06);box-shadow:0 0 40px currentColor,inset 0 -6px 0 rgba(0,0,0,.25)}
.h-pad:disabled{cursor:default}
.tur-cubuk{display:flex;gap:6px;justify-content:center;margin:10px 0}
.tur-cubuk i{width:30px;height:10px;border-radius:6px;background:var(--cam2)}
.tur-cubuk i.ok{background:var(--yesil)}
/* roket */
.roket-alan{display:grid;grid-template-columns:1fr 150px 1fr;gap:12px;align-items:start}
.takim{padding:12px;border-radius:22px;border:2px solid var(--cizgi);transition:box-shadow .3s}
.takim.t0{background:linear-gradient(180deg,rgba(255,77,109,.22),rgba(255,77,109,.06));border-color:rgba(255,120,140,.5)}
.takim.t1{background:linear-gradient(180deg,rgba(77,171,255,.22),rgba(77,171,255,.06));border-color:rgba(120,180,255,.5)}
.takim.parla{box-shadow:0 0 0 4px var(--sari),0 0 40px rgba(255,211,107,.6)}
.takim.kilitli{opacity:.5}
.takim h3{text-align:center;font-size:24px;margin-bottom:6px}
.takim .soru{background:rgba(0,0,0,.2);margin-top:0}
.takim .secenekler{grid-template-columns:1fr}
.pist{position:relative;height:520px;border-radius:24px;background:linear-gradient(180deg,#120a34,#1c2a6b);border:2px solid var(--cizgi);display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.pist .hedef-gez{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:44px;z-index:2;animation:suzul 3s infinite}
.serit{position:relative;border-right:1px dashed rgba(255,255,255,.15)}
.serit:last-child{border-right:0}
.roketc{position:absolute;bottom:2%;left:50%;font-size:44px;transform:translateX(-50%) rotate(-45deg);transition:bottom .6s cubic-bezier(.3,1.4,.5,1)}
.roketc::after{content:"🔥";position:absolute;font-size:24px;left:-12px;bottom:-12px;transform:rotate(45deg);animation:alev .15s infinite alternate}
.roketc.kirmizi{filter:hue-rotate(0deg) drop-shadow(0 0 10px #ff4d6d)}
.roketc.mavi{filter:hue-rotate(180deg) drop-shadow(0 0 10px #4dabff)}
.roket-skor{position:absolute;bottom:6px;left:0;right:0;display:flex;justify-content:space-around;font-weight:800;font-size:22px;z-index:2}
@media (max-width:760px){
  .roket-alan{grid-template-columns:1fr 1fr}
  .pist{grid-column:1/3;order:-1;height:220px}
  .takim .soru-metin{font-size:18px}
  .takim .secenek{font-size:18px;padding:10px 6px}
  .tasarim{grid-template-columns:1fr;justify-items:center;text-align:center}
  .tasarim .secim-sira{justify-content:center}
  .iki{grid-template-columns:1fr}
}
/* modal */
.perde{position:fixed;inset:0;background:rgba(3,5,18,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:500;display:none;align-items:center;justify-content:center;padding:16px}
.perde.acik{display:flex;animation:gir .3s}
.modal{width:min(560px,100%);max-height:92vh;overflow:auto;padding:24px;border-radius:28px;background:linear-gradient(160deg,#1a1f4d,#251543);border:1px solid var(--cizgi);box-shadow:0 30px 80px rgba(0,0,0,.6);text-align:center}
.modal h2{font-size:30px;margin-bottom:6px}
.buyuk-yildizlar{font-size:58px;letter-spacing:6px;margin:8px 0}
.buyuk-yildizlar span{display:inline-block;animation:yildizgel .6s both}
.buyuk-yildizlar span:nth-child(2){animation-delay:.25s}.buyuk-yildizlar span:nth-child(3){animation-delay:.5s}
@keyframes yildizgel{from{transform:scale(0) rotate(-180deg);opacity:0}to{transform:none;opacity:1}}
.sos{opacity:.22;filter:grayscale(1)}

.konfeti{position:fixed;inset:0;z-index:600;pointer-events:none}
/* garaj */
.garaj-ust{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:center;padding:18px}
.parca-izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.parca{padding:14px;border-radius:20px;text-align:center;border:2px solid var(--cizgi);background:var(--cam);cursor:pointer}
.parca .pe{font-size:40px}

/* öğretmen */

.sekme.sec{background:linear-gradient(135deg,var(--pembe),var(--mor));border-color:transparent}

table{width:100%;border-collapse:collapse;font-size:15px;-webkit-user-select:text;user-select:text}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid rgba(255,255,255,.07);white-space:nowrap}
th{position:sticky;top:0;background:#1a1f4d;font-weight:800}
tr:nth-child(even) td{background:rgba(255,255,255,.025)}

/* zirve dock */

.zpill{display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:999px;background:rgba(20,24,52,.85);border:1px solid var(--cizgi);color:#fff;font:inherit;font-size:13px;font-weight:700;opacity:.5;cursor:pointer}

<script>
/* =========================================================
   GALAKSİ AKADEMİ — Anaokulu → 8. Sınıf eğitsel oyun evreni
   Barış Öğretmen için hazırlandı · tek dosya · çevrimdışı çalışır
   ========================================================= */
const SURUM = 1;
// İsteğe bağlı: Firebase yapılandırmanı buraya bir kez yapıştırırsan TÜM cihazların girişleri tek panelde toplanır.
// Örnek: const GOMULU_FIREBASE = {apiKey:"...", authDomain:"...", projectId:"...", appId:"..."};
const GOMULU_FIREBASE = null;
const FB_KOLEKSIYON = 'galaksi_akademi';

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const sec = a => a[Math.floor(Math.random() * a.length)];
const karistir = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const etiketsiz = s => String(s).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

const SINIFLAR = ['Anaokulu', '1. Sınıf', '2. Sınıf', '3. Sınıf', '4. Sınıf', '5. Sınıf', '6. Sınıf', '7. Sınıf', '8. Sınıf'];
const GEZEGEN = [
  { ad: 'Minik Bulut', e: '☁️', r1: '#ffb3e1', r2: '#b96bff', alt: 'Saymak, renkler, ilk kodlar' },
  { ad: 'Şeker Adası', e: '🍭', r1: '#ffe08a', r2: '#ff6b9a', alt: 'Toplama, çıkarma, örüntü' },
  { ad: 'Zümrüt Orman', e: '🌳', r1: '#6ff0b4', r2: '#11866d', alt: 'İki basamaklı sayılar, ritmik sayma' },
  { ad: 'Turuncu Kanyon', e: '🏜️', r1: '#ffc070', r2: '#d84a26', alt: 'Çarpım tablosu, bölme' },
  { ad: 'Buz Kristali', e: '❄️', r1: '#c4f2ff', r2: '#3f7dff', alt: 'Çarpma, bölme, kesirler' },
  { ad: 'Volkan Dağı', e: '🌋', r1: '#ff9a6b', r2: '#a8102a', alt: 'Ondalık sayılar, yüzdeler' },
  { ad: 'Mavi Okyanus', e: '🌊', r1: '#6fe0ff', r2: '#1c45c9', alt: 'Tam sayılar, oranlar, kareler' },
  { ad: 'Mor Nebula', e: '🔮', r1: '#e1adff', r2: '#5326c9', alt: 'Denklemler, yüzde artış' },
  { ad: 'Altın Zirve', e: '🏆', r1: '#fff0a3', r2: '#c98200', alt: 'Üslü ve kareköklü ifadeler — LGS' }
];
const OYUNLAR = [
  { id: 'kod', ad: 'Kodlama Yolu', e: '🤖', acik: 'Okları sırala, robotunu yıldıza götür!' },
  { id: 'satranc', ad: 'Satranç Görevi', e: '♞', acik: 'Taşını doğru hamlelerle yürüt, yıldızları topla.' },
  { id: 'penalti', ad: 'Bilgi Penaltısı', e: '⚽', acik: 'Soruyu bil, köşeyi seç, GOOOL!' },
  { id: 'hafiza', ad: 'Robot Hafızası', e: '🧠', acik: 'Işıkların sırasını aklında tut, tekrar et.' },
  { id: 'roket', ad: 'Roket Yarışı', e: '🚀', acik: 'Akıllı tahtada iki takım! İlk bilen roketini uçurur.' }
];
const PARCALAR = [
  { id: 'jet', ad: 'Jet Çantası', e: '🚀', gerek: 5 },
  { id: 'tac', ad: 'Kral Tacı', e: '👑', gerek: 15 },
  { id: 'pelerin', ad: 'Kahraman Pelerini', e: '🦸', gerek: 30 },
  { id: 'iz', ad: 'Gökkuşağı', e: '🌈', gerek: 50 },
  { id: 'isilti', ad: 'Işıltılı Gözler', e: '✨', gerek: 80 },
  { id: 'altin', ad: 'Altın Gövde', e: '🥇', gerek: 120 }
];
const RENKLER = ['#4f8cff', '#ff5d8f', '#2ed3a0', '#ffb020', '#9b6bff', '#ff6b3d', '#22c3e6', '#8bc34a'];

/* ---------------- durum ---------------- */
let oyuncular = LS.get('ga_oyuncular', {});
let aktifId = LS.get('ga_aktif', null);
let taslak = { renk: RENKLER[0], kafa: 0, goz: 0, parca: {} };
let aktifGezegen = 0;
const oyuncu = () => oyuncular[aktifId];
function kaydet() { LS.set('ga_oyuncular', oyuncular); LS.set('ga_aktif', aktifId); }

/* ---------------- yardımcılar ---------------- */
let toastZ;
function toast(m, sure = 2600) { const t = $('#toast'); t.innerHTML = m; t.classList.add('goster'); clearTimeout(toastZ); toastZ = setTimeout(() => t.classList.remove('goster'), sure); }
function git(id) { if (id !== 's-oyun') oyunuDurdur(); $$('.ekran').forEach(e => e.classList.remove('aktif')); $('#' + id).classList.add('aktif'); window.scrollTo(0, 0); }
function modalAc(html) { $('#modal').innerHTML = html; $('#perde').classList.add('acik'); }
function modalKapat() { $('#perde').classList.remove('acik'); }
function cihazTuru() {
  const ua = navigator.userAgent, w = Math.max(screen.width, screen.height), dok = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  if (/iPhone|iPod|Android.+Mobile|Windows Phone/i.test(ua)) return 'Telefon';
  if (/iPad|Tablet|Android/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) return 'Tablet';
  if (dok && w >= 1600) return 'Akıllı Tahta';
  return 'Bilgisayar';
}
const yildizYaz = n => '★'.repeat(n) + '☆'.repeat(3 - n);

/* ---------------- ses ---------------- */
let AC = null, sesAcik = LS.get('ga_ses', true);
function acx() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
document.addEventListener('pointerdown', acx, { once: true });
function ton(f, d = .15, tip = 'sine', v = .16, gec = 0) {
  const a = acx(); if (!a || !sesAcik) return;
  const o = a.createOscillator(), g = a.createGain(); o.type = tip; o.frequency.value = f;
  const t = a.currentTime + gec; g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .05);
}
function gurultu(d = 1, v = .14) {
  const a = acx(); if (!a || !sesAcik) return;
  const b = a.createBuffer(1, a.sampleRate * d, a.sampleRate), c = b.getChannelData(0);
  for (let i = 0; i < c.length; i++) c[i] = (Math.random() * 2 - 1) * (1 - i / c.length);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = .6; g.gain.value = v;
  s.buffer = b; s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}
function ses(t, f) {
  if (t === 'tik') ton(700, .07, 'square', .05);
  else if (t === 'dogru') [523, 659, 784, 1046].forEach((x, i) => ton(x, .2, 'triangle', .15, i * .08));
  else if (t === 'yanlis') { ton(240, .22, 'sawtooth', .08); ton(170, .3, 'sawtooth', .07, .13); }
  else if (t === 'yildiz') [1046, 1318, 1568, 2093].forEach((x, i) => ton(x, .14, 'sine', .1, i * .06));
  else if (t === 'gol') { gurultu(1.6, .2); [392, 523, 659, 784, 1046].forEach((x, i) => ton(x, .25, 'triangle', .14, .1 + i * .09)); }
  else if (t === 'pad') ton(f, .32, 'triangle', .2);
  else if (t === 'whoosh') { gurultu(.5, .1); ton(300, .4, 'sine', .08); ton(600, .3, 'sine', .06, .1); }
  else if (t === 'zafer') [523, 659, 784, 659, 784, 1046].forEach((x, i) => ton(x, .25, 'triangle', .15, i * .13));
}
function sesDegis() { sesAcik = !sesAcik; LS.set('ga_ses', sesAcik); $$('#sesBtn,#sesBtn2').forEach(b => b && (b.textContent = sesAcik ? '🔊' : '🔇')); if (!sesAcik && 'speechSynthesis' in window) speechSynthesis.cancel(); }
function konus(t) {
  try {
    if (!('speechSynthesis' in window) || !sesAcik) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(etiketsiz(t)); u.lang = 'tr-TR'; u.rate = .95;
    const v = speechSynthesis.getVoices().find(v => /^tr/i.test(v.lang)); if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------------- yıldızlı gökyüzü ---------------- */
(function () {
  const c = $('#yildizlar'), x = c.getContext('2d'); let W, H, D, ys = [], kay = null;
  function boyut() { D = Math.min(devicePixelRatio || 1, 2); W = c.width = innerWidth * D; H = c.height = innerHeight * D;
    ys = Array.from({ length: 170 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: (Math.random() * 1.5 + .3) * D, f: Math.random() * 6.28, h: .4 + Math.random() * 1.6 })); }
  addEventListener('resize', boyut); boyut();
  function ciz(t) {
    if (document.hidden) { requestAnimationFrame(ciz); return; }
    x.clearRect(0, 0, W, H); x.fillStyle = '#fff';
    for (const s of ys) { x.globalAlpha = .3 + .7 * Math.abs(Math.sin(s.f + t / 1000 * s.h)); x.beginPath(); x.arc(s.x, s.y, s.r, 0, 6.283); x.fill(); }
    if (!kay && Math.random() < .005) kay = { x: Math.random() * W * .7, y: Math.random() * H * .4, vx: (7 + Math.random() * 6) * D, vy: (2 + Math.random() * 3) * D, o: 1 };
    if (kay) {
      x.globalAlpha = kay.o; const g = x.createLinearGradient(kay.x, kay.y, kay.x - kay.vx * 14, kay.y - kay.vy * 14);
      g.addColorStop(0, '#fff'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.strokeStyle = g; x.lineWidth = 2 * D;
      x.beginPath(); x.moveTo(kay.x, kay.y); x.lineTo(kay.x - kay.vx * 14, kay.y - kay.vy * 14); x.stroke();
      kay.x += kay.vx; kay.y += kay.vy; kay.o -= .013; if (kay.o <= 0) kay = null;
    }
    x.globalAlpha = 1; requestAnimationFrame(ciz);
  }
  requestAnimationFrame(ciz);
})();

function konfeti() {
  const c = document.createElement('canvas'); c.className = 'konfeti'; document.body.appendChild(c);
  const x = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  const R = ['#ff5d8f', '#ffd36b', '#5af0a8', '#56d8ff', '#b77dff', '#ff8a3d'];
  const p = Array.from({ length: 170 }, () => ({ x: innerWidth / 2, y: innerHeight * .38, vx: (Math.random() - .5) * 16, vy: -Math.random() * 15 - 4, r: 5 + Math.random() * 6, c: sec(R), a: Math.random() * 6, va: (Math.random() - .5) * .3 }));
  let t = 0;
  (function f() {
    x.clearRect(0, 0, c.width, c.height);
    for (const q of p) { q.x += q.vx; q.y += q.vy; q.vy += .36; q.vx *= .99; q.a += q.va; x.save(); x.translate(q.x, q.y); x.rotate(q.a); x.fillStyle = q.c; x.fillRect(-q.r / 2, -q.r / 2, q.r, q.r * 1.6); x.restore(); }
    if (++t < 170) requestAnimationFrame(f); else c.remove();
  })();
}

/* ---------------- robot çizimi ---------------- */
function robotSVG(av, boy = 120, oynak = true) {
  av = av || { renk: '#4f8cff', kafa: 0, goz: 0, parca: {} }; const p = av.parca || {};
  const govde = p.altin ? 'url(#altinG)' : av.renk;
  const h = typeof boy === 'number' ? boy * 1.25 : boy;
  let s = `<svg class="robot${oynak ? ' oynak' : ''}" viewBox="0 0 120 150" width="${boy}" height="${h}" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="altinG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3a8"/><stop offset=".5" stop-color="#ffc83d"/><stop offset="1" stop-color="#c98200"/></linearGradient>
  <filter id="parla" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;

/* ===== 2) SATRANÇ GÖREVİ ===== */
function oyunSatranc(g, alan, bitir) {
  const N = g <= 2 ? 5 : g <= 5 ? 6 : 8;
  const tas = g <= 1 ? 'kral' : g <= 3 ? 'kale' : 'at';
  const SIM = { kral: '♚', kale: '♜', at: '♞' };
  const ACIK = { kral: 'Şah (kral) her yöne sadece 1 kare gider.', kale: 'Kale düz çizgide (ileri, geri, sağa, sola) istediği kadar gider ama kayanın üstünden atlayamaz.', at: 'At “L” çizerek gider ve taşların üstünden atlayabilir.' };
  const hedefSay = [1, 2, 2, 3, 2, 3, 3, 3, 4][g], kayaSay = N === 5 ? 2 : N === 6 ? 4 : 7;
  const maxH = [4, 6, 6, 7, 7, 8, 9, 10, 12][g];
  let bulmaca = 0, toplam = 0, P, poz, alinan, hamle;
  const idx = (x, y) => y * N + x;
  function hamleler(p, kaya) {
    const x = p % N, y = Math.floor(p / N), r = [];
    const ok = (a, b) => a >= 0 && b >= 0 && a < N && b < N && !kaya.has(idx(a, b));
    if (tas === 'kral') { for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) if ((dx || dy) && ok(x + dx, y + dy)) r.push(idx(x + dx, y + dy)); }
    else if (tas === 'at') { for (const [dx, dy] of [[1, 2], [2, 1], [-1, 2], [-2, 1], [1, -2], [2, -1], [-1, -2], [-2, -1]]) if (ok(x + dx, y + dy)) r.push(idx(x + dx, y + dy)); }
    else for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { let a = x + dx, b = y + dy; while (ok(a, b)) { r.push(idx(a, b)); a += dx; b += dy; } }
    return r;
  }
  function enKisa(bas, hedefler, kaya) {
    const tam = (1 << hedefler.length) - 1, gor = new Map(), q = [[bas, 0, 0]]; gor.set(bas * 32, 1);
    while (q.length) { const [p, m, d] = q.shift(); if (m === tam) return d;
      for (const n of hamleler(p, kaya)) { let nm = m; hedefler.forEach((h, i) => { if (h === n) nm |= 1 << i; }); const k = n * 32 + nm; if (gor.has(k)) continue; gor.set(k, 1); q.push([n, nm, d + 1]); } }
    return -1;
  }
  function uret() {
    for (let k = 0; k < 900; k++) {
      const hucreler = karistir([...Array(N * N).keys()]);
      const bas = hucreler[0], hedefler = hucreler.slice(1, 1 + hedefSay), kaya = new Set(hucreler.slice(1 + hedefSay, 1 + hedefSay + kayaSay));
      const opt = enKisa(bas, hedefler, kaya);
      if (opt < 0 || opt > maxH || opt < hedefSay + (g >= 2 ? 1 : 0)) continue;
      return { bas, hedefler, kaya, opt };
    }
    return { bas: 0, hedefler: [N * N - 1], kaya: new Set(), opt: 4 };
  }
  function kur(yeni = true) {
    if (yeni) P = uret();
    poz = P.bas; alinan = new Set(); hamle = 0;
    alan.innerHTML = `<div class="bilgi-satir"><span class="rozet">Görev ${bulmaca + 1}/3</span><span class="rozet" id="sHamle"></span>
      <button class="btn hayalet kucuk" id="sBas">↺ Baştan</button></div>
      <div class="mesaj" style="margin:0 0 10px">${SIM[tas]} ${ACIK[tas]} Tüm yıldızları topla!</div>
      <div class="s-tahta" id="sTahta" style="grid-template-columns:repeat(${N},1fr)"></div><div class="mesaj" id="sMesaj"></div>`;
    $('#sBas').onclick = () => kur(false);
    if (g <= 3 && yeni) konus(ACIK[tas]);
    ciz();
  }
  function ciz() {
    const t = $('#sTahta'); t.innerHTML = ''; const yasal = new Set(hamleler(poz, P.kaya));
    for (let i = 0; i < N * N; i++) {
      const x = i % N, y = Math.floor(i / N), k = document.createElement('div');
      k.className = 's-kare ' + ((x + y) % 2 ? 'k' : 'a') + (yasal.has(i) ? ' yasal' : '');
      k.innerHTML = i === poz ? `<span class="s-tas">${SIM[tas]}</span>` : P.kaya.has(i) ? '🪨' : (P.hedefler.includes(i) && !alinan.has(i)) ? '<span class="hedef-yildiz">⭐</span>' : '';
      if (yasal.has(i)) k.onclick = () => yuru(i);
      t.appendChild(k);
    }
    $('#sHamle').textContent = `Hamle: ${hamle} · Yıldız: ${alinan.size}/${P.hedefler.length}`;
  }
  async function yuru(i) {
    poz = i; hamle++; ses('tik');
    if (P.hedefler.includes(i) && !alinan.has(i)) { alinan.add(i); ses('yildiz'); }
    ciz();
    if (alinan.size === P.hedefler.length) {
      const y = hamle <= P.opt ? 3 : hamle <= P.opt + 2 ? 2 : 1; toplam += y;
      $('#sMesaj').textContent = y === 3 ? `Usta hamle! En kısa yol: ${P.opt} hamle ⭐⭐⭐` : `Tebrikler! ${'⭐'.repeat(y)} (En kısa yol ${P.opt} hamleydi)`;
      ses('dogru');
      try { await bekle(1500); } catch (e) { return; }
      bulmaca++; if (bulmaca < 3) kur(); else bitir(Math.round(toplam / 3), { tas });
    }
  }
  kur();
}

/* ---------------- oyun bitti ---------------- */
function gununGorevi() {
  const d = new Date(), n = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5), o = OYUNLAR[n % 4];

}
function oyunBitti(g, id, y, detay) {

  let bonus = 0; const gv = gununGorevi();

  kaydet();

  logEkle({ olay: 'Oyun', oyun: oy.ad, gezegen: GEZEGEN[g].ad, yildiz: y + bonus, detay: detay ? Object.entries(detay).map(([k, v]) => `${k}: ${v}`).join(', ') : '' });

    <div class="buyuk-yildizlar">${[0, 1, 2].map(i => `<span class="${i < y ? '' : 'sos'}">⭐</span>`).join('')}</div>
    <div style="font-weight:800;font-size:20px">+${y} yıldız kazandın${y > eskiEn ? ' · Yeni rekor! 🏅' : ''}</div>

    ${yeniler.map(p => `<div class="hediye-kutu">🔓 Yeni parça açıldı: ${p.e} <b>${p.ad}</b>! Garajda robotuna tak!</div>`).join('')}

function baslaTik() { acx(); ses('whoosh'); girisAc(); }
function girisAc() {
  const sel = $('#gSinif'); if (sel.options.length < 2) SINIFLAR.forEach((s, i) => sel.insertAdjacentHTML('beforeend', `<option value="${i}">${s}</option>`));
  const liste = Object.values(oyuncular).sort((a, b) => (b.son || 0) - (a.son || 0)).slice(0, 12);

}
function tasarimCiz() {
  $('#onizleme').innerHTML = robotSVG(taslak, 140);
  $('#renkler').innerHTML = RENKLER.map(r => `<div class="renk-top${taslak.renk === r ? ' sec' : ''}" style="background:${r}" onclick="taslak.renk='${r}';tasarimCiz();ses('tik')"></div>`).join('');

  $('#gozler').innerHTML = ['● ●', '◠ ◠', '★ ★'].map((k, i) => `<button class="secim-btn${taslak.goz === i ? ' sec' : ''}" onclick="taslak.goz=${i};tasarimCiz();ses('tik')">${k}</button>`).join('');
}
function kahramanSec(id) { aktifId = id; oyuncular[id].son = Date.now(); kaydet(); logEkle({ olay: 'Giriş' }); haritaAc(); hosgeldin(); }
function girisYap() {
  const ad = $('#gAd').value.trim().replace(/\s+/g, ' '), si = $('#gSinif').value, sube = $('#gSube').value.trim().toUpperCase();
  const kelime = ad.split(' ').filter(k => k.length >= 2);
  if (kelime.length < 2) { ses('yanlis'); toast('✍️ Lütfen adını ve soyadını yaz (örn: Elif Yılmaz)'); $('#gAd').focus(); return; }
  if (si === '') { ses('yanlis'); toast('🏫 Lütfen sınıfını seç'); return; }
  const g = +si, sinifEt = SINIFLAR[g] + (sube ? ' ' + sube : '');
  const adDuz = ad.split(' ').map(k => k.charAt(0).toLocaleUpperCase('tr-TR') + k.slice(1).toLocaleLowerCase('tr-TR')).join(' ');
  const id = (adDuz.toLocaleLowerCase('tr-TR') + '|' + g + '|' + sube).replace(/\s/g, '_');
  if (!oyuncular[id]) oyuncular[id] = { id, ad: adDuz, sinif: g, sube, sinifEt, av: JSON.parse(JSON.stringify(taslak)), yildiz: 0, en: {}, ilk: Date.now() };
  else oyuncular[id].av = Object.assign(oyuncular[id].av, { renk: taslak.renk, kafa: taslak.kafa, goz: taslak.goz });
  oyuncular[id].son = Date.now(); aktifId = id; kaydet();
  logEkle({ olay: 'Giriş' });
  aktifGezegen = g; haritaAc(); hosgeldin();
}
function hosgeldin() { const o = oyuncu(); ses('dogru'); toast(`🚀 Hoş geldin ${o.ad.split(' ')[0]}! Gezegenin: ${GEZEGEN[o.sinif].e} ${GEZEGEN[o.sinif].ad}`); konus(`Hoş geldin ${o.ad.split(' ')[0]}`); }
function gezegenYildiz(g) { const o = oyuncu(); return OYUNLAR.reduce((t, x) => t + (o.en[g + '-' + x.id] || 0), 0); }
function haritaAc() {

    <div class="bosluk"></div><div class="yildiz-sayac">⭐ ${o.yildiz}</div>
    <button class="btn sari kucuk" onclick="garajAc()">🛠️ Garaj</button>
    <button class="geri" id="sesBtn" onclick="sesDegis()">${sesAcik ? '🔊' : '🔇'}</button>
    <button class="btn hayalet kucuk" onclick="girisAc()">👤 Değiştir</button>`;

  $('#yol').innerHTML = GEZEGEN.map((z, i) => `<div class="durak" onclick="gezegenAc(${i})">
      <div class="gezegen" style="background:radial-gradient(circle at 32% 30%,${z.r1},${z.r2});--parilti:${z.r2}88">${z.e}</div>
      <div><div class="durak-ad">${z.ad}</div><div class="durak-alt">${SINIFLAR[i]} · ${z.alt}</div>

function gezegenAc(g) {
  aktifGezegen = g; const z = GEZEGEN[g], o = oyuncu();
  $('#gzYildiz').textContent = '⭐ ' + o.yildiz;
  $('#merkezBas').innerHTML = `<div class="gezegen" style="background:radial-gradient(circle at 32% 30%,${z.r1},${z.r2});--parilti:${z.r2}88">${z.e}</div>
    <div><h2 style="font-size:32px">${z.ad}</h2><div class="oyuncu-alt" style="font-size:17px">${SINIFLAR[g]} seviyesi · ${z.alt}</div></div><div class="bosluk"></div>${robotSVG(o.av, 70)}`;
  $('#oyunIzgara').innerHTML = OYUNLAR.map(x => `<div class="oyun-kart${x.id === 'roket' ? ' tahta-kart' : ''}" onclick="oyunBaslat('${x.id}')">
    <div class="en">${x.id === 'roket' ? '📺' : yildizYaz(o.en[g + '-' + x.id] || 0)}</div><div class="ik">${x.e}</div><h3>${x.ad}</h3><p>${x.acik}</p></div>`).join('');

function garajAc() {
  const o = oyuncu(); const sonraki = PARCALAR.find(p => o.yildiz < p.gerek);
  const onceki = sonraki ? (PARCALAR[PARCALAR.indexOf(sonraki) - 1] || { gerek: 0 }).gerek : 0;
  const yuzde = sonraki ? Math.round((o.yildiz - onceki) / (sonraki.gerek - onceki) * 100) : 100;
  $('#garajIc').innerHTML = `<div class="cam garaj-ust"><div>${robotSVG(o.av, 200)}</div>
    <div><h2 style="font-size:28px">${o.ad.split(' ')[0]}'in Robotu</h2><div class="yildiz-sayac" style="display:inline-block;margin:8px 0">⭐ ${o.yildiz}</div>
    <div class="oyuncu-alt">${sonraki ? `Sıradaki sürpriz: ${sonraki.e} ${sonraki.ad} (${sonraki.gerek} ⭐)` : 'Efsane robot! Tüm parçalar açıldı 🏆'}</div>
    <div class="ilerleme"><b style="width:${Math.max(4, Math.min(100, yuzde))}%"></b></div>
    <div style="margin-top:10px"><span class="alan-etiket">Renk</span><div class="secim-sira">${RENKLER.map(r => `<div class="renk-top${o.av.renk === r ? ' sec' : ''}" style="background:${r}" onclick="oyuncu().av.renk='${r}';kaydet();garajAc();ses('tik')"></div>`).join('')}</div></div></div></div>
    <div class="parca-izgara">${PARCALAR.map(p => { const acik = o.yildiz >= p.gerek, tak = o.av.parca[p.id];
      return `<div class="parca${acik ? '' : ' kilit'}${tak ? ' takili' : ''}" onclick="parcaTak('${p.id}')"><div class="pe">${acik ? p.e : '🔒'}</div><b>${p.ad}</b><div class="oyuncu-alt">${acik ? (tak ? '✅ Takılı' : 'Takmak için dokun') : p.gerek + ' ⭐ gerekli'}</div></div>`; }).join('')}</div>`;
  git('s-garaj');
}
function parcaTak(id) {
  const o = oyuncu(), p = PARCALAR.find(x => x.id === id);
  if (o.yildiz < p.gerek) { ses('yanlis'); toast(`🔒 ${p.ad} için ${p.gerek - o.yildiz} yıldız daha topla!`); return; }
  o.av.parca[id] = !o.av.parca[id]; kaydet(); ses(o.av.parca[id] ? 'yildiz' : 'tik'); garajAc();
}

/* ---------------- kayıt & öğretmen paneli ---------------- */
let kayitlar = LS.get('ga_kayitlar', []);
function logEkle(e) {
  const o = oyuncu(); if (!o) return;
  const k = Object.assign({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ts: Date.now(), ad: o.ad, sinif: o.sinifEt, sinifNo: o.sinif, cihaz: cihazTuru(), toplamYildiz: o.yildiz }, e);
  kayitlar.push(k); if (kayitlar.length > 4000) kayitlar = kayitlar.slice(-4000); LS.set('ga_kayitlar', kayitlar);
  fbHazir().then(db => { if (db) db.collection(FB_KOLEKSIYON).doc(k.id).set(k).catch(er => { fbDurum = 'Yazma izni yok (' + (er.code || 'hata') + ')'; }); });
}
function fbConfig() { return GOMULU_FIREBASE || LS.get('ga_fb', null); }
function scriptYukle(src) { return new Promise((r, j) => { if (document.querySelector(`script[src="${src}"]`)) return r(); const s = document.createElement('script'); s.src = src; s.onload = r; s.onerror = j; document.head.appendChild(s); }); }
let fbDb = null, fbDurum = 'Bulut bağlantısı yok (yalnızca bu cihaz)';
async function fbHazir() {
  const cfg = fbConfig(); if (!cfg) return null; if (fbDb) return fbDb;
  try {
    await scriptYukle('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
    await scriptYukle('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
    const app = firebase.apps.find(a => a.name === 'galaksi') || firebase.initializeApp(cfg, 'galaksi');
    fbDb = app.firestore(); fbDurum = 'Buluta bağlı ☁️'; return fbDb;
  } catch (e) { fbDurum = 'Bulut yüklenemedi (internet?)'; return null; }
}
let ogrSekme = 'giris', bulutKayit = [];
function ogretmenGiris() {
  const pin = LS.get('ga_pin', '1234');
  modalAc(`<h2>👩‍🏫 Öğretmen Girişi</h2><p class="not">PIN kodunu yaz</p>
    <input class="girdi" id="pinG" type="password" inputmode="numeric" maxlength="8" style="text-align:center;font-size:28px;letter-spacing:8px;margin-top:10px">
    <div class="modal-btnler"><button class="btn" onclick="pinKontrol()">Giriş</button><button class="btn hayalet" onclick="modalKapat()">Vazgeç</button></div>`);
  setTimeout(() => { const i = $('#pinG'); i.focus(); i.onkeydown = e => { if (e.key === 'Enter') pinKontrol(); }; }, 80);
  window.pinKontrol = () => { if ($('#pinG').value === pin) { modalKapat(); ogretmenAc(); } else { ses('yanlis'); toast('PIN hatalı'); } };
}
function ogretmenCik() { if (oyuncu()) haritaAc(); else { acilisCiz(); git('s-acilis'); } }
function tumKayitlar() {
  const m = new Map(); [...kayitlar, ...bulutKayit].forEach(k => m.set(k.id, k));
  return [...m.values()].sort((a, b) => b.ts - a.ts);
}
function ogretmenAc() { git('s-ogretmen'); ogretmenCiz(); fbHazir().then(() => bulutYenile(true)); }
async function bulutYenile(sessiz) {
  const db = await fbHazir(); if (!db) { if (!sessiz) toast('Bulut ayarı yok — Ayarlar sekmesinden ekleyebilirsin'); return; }
  try { const q = await db.collection(FB_KOLEKSIYON).orderBy('ts', 'desc').limit(2000).get(); bulutKayit = q.docs.map(d => d.data()); fbDurum = `Buluta bağlı ☁️ (${bulutKayit.length} kayıt)`; if (!sessiz) toast('☁️ Buluttan güncellendi'); }
  catch (e) { fbDurum = 'Okuma izni yok (' + (e.code || 'hata') + ')'; if (!sessiz) toast('Buluttan okunamadı: ' + (e.code || e.message)); }
  if ($('#s-ogretmen').classList.contains('aktif')) ogretmenCiz();
}

    <div class="ozet"><b>${bugunGiris.length}</b><span>Bugünkü hareket</span></div>
    <div class="ozet"><b style="font-size:20px">${enAktif ? enAktif[0] : '—'}</b><span>En çok yıldız toplayan sınıf</span></div></div>

    <div class="sekmeler">${[['giris', '📋 Girişler'], ['ogrenci', '👦 Öğrenciler'], ['kupa', '🏆 Sınıf Kupası'], ['ayar', '⚙️ Ayarlar']].map(([k, v]) => `<button class="sekme${ogrSekme === k ? ' sec' : ''}" onclick="ogrSekme='${k}';ogretmenCiz()">${v}</button>`).join('')}</div>`;
  if (ogrSekme === 'giris') {
    const f = LS.get('ga_filtre', { s: '', a: '' });
    const liste = tum.filter(k => (f.s === '' || String(k.sinifNo) === f.s) && (!f.a || k.ad.toLocaleLowerCase('tr-TR').includes(f.a.toLocaleLowerCase('tr-TR'))));
    ic += `<div class="iki" style="margin-bottom:10px"><input class="girdi" placeholder="🔎 Öğrenci ara" value="${f.a}" oninput="filtre('a',this.value)">

      <div class="tablo-sar"><table><tr><th>Zaman</th><th>Ad Soyad</th><th>Sınıf</th><th>Cihaz</th><th>Olay</th><th>Oyun / Gezegen</th><th>⭐</th></tr>
      ${liste.slice(0, 400).map(k => `<tr><td>${new Date(k.ts).toLocaleString('tr-TR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</td><td>${k.ad}</td><td>${k.sinif}</td><td>${k.cihaz}</td><td>${k.olay}</td><td>${k.oyun ? k.oyun + ' · ' + k.gezegen : ''}</td><td>${k.olay === 'Oyun' ? k.yildiz : ''}</td></tr>`).join('') || '<tr><td colspan="7">Henüz kayıt yok.</td></tr>'}</table></div>`;
  } else if (ogrSekme === 'ogrenci') {
    const m = {}; tum.forEach(k => { const a = k.ad + '|' + k.sinif; const x = m[a] = m[a] || { ad: k.ad, sinif: k.sinif, giris: 0, oyun: 0, yildiz: 0, son: 0, cihaz: new Set() }; if (k.olay === 'Giriş') x.giris++; else { x.oyun++; x.yildiz += k.yildiz || 0; } x.son = Math.max(x.son, k.ts); x.cihaz.add(k.cihaz); });
    const l = Object.values(m).sort((a, b) => b.yildiz - a.yildiz);
    ic += `<div class="tablo-sar"><table><tr><th>#</th><th>Ad Soyad</th><th>Sınıf</th><th>Giriş</th><th>Oyun</th><th>⭐</th><th>Cihazlar</th><th>Son görülme</th></tr>
      ${l.map((x, i) => `<tr><td>${i + 1}</td><td>${x.ad}</td><td>${x.sinif}</td><td>${x.giris}</td><td>${x.oyun}</td><td>${x.yildiz}</td><td>${[...x.cihaz].join(', ')}</td><td>${new Date(x.son).toLocaleString('tr-TR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</td></tr>`).join('') || '<tr><td colspan="8">Henüz kayıt yok.</td></tr>'}</table></div>`;

  } else {
    ic += `<div class="cam" style="padding:16px;margin-bottom:12px"><h3>🔐 PIN değiştir</h3><div class="iki" style="margin-top:8px"><input class="girdi" id="yeniPin" inputmode="numeric" maxlength="8" placeholder="Yeni PIN"><button class="btn kucuk" onclick="pinKaydet()">Kaydet</button></div></div>

      <div class="cam" style="padding:16px;margin-bottom:12px"><h3>🧭 Yüzen düğmeler</h3><button class="btn hayalet kucuk" style="margin-top:8px" onclick="ZIRVE_kontrolleriGeriGetir()">Gizlenen düğmeleri geri getir</button></div>
      <div class="cam" style="padding:16px"><h3>🗑️ Bu cihazdaki veriler</h3><p class="not">Öğrenci profilleri ve bu cihazdaki giriş kayıtları silinir (buluttakiler kalır).</p>
      <button class="btn kucuk" style="margin-top:8px;background:linear-gradient(135deg,#ff5d6c,#c0263e)" onclick="veriSil()">Bu cihazdaki verileri sil</button></div>`;
  }
  $('#ogretmenIc').innerHTML = ic;

function filtre(k, v) { const f = LS.get('ga_filtre', { s: '', a: '' }); f[k] = v; LS.set('ga_filtre', f); clearTimeout(window._fz); window._fz = setTimeout(() => { const a = document.activeElement, pos = a && a.selectionStart; ogretmenCiz(); if (k === 'a') { const i = $('#ogretmenIc input'); i.focus(); try { i.setSelectionRange(pos, pos); } catch (e) {} } }, k === 'a' ? 350 : 0); }
function kayitMetin(ayr) { return [['Tarih', 'Ad Soyad', 'Sınıf', 'Cihaz', 'Olay', 'Oyun', 'Gezegen', 'Yıldız'].join(ayr), ...tumKayitlar().map(k => [new Date(k.ts).toLocaleString('tr-TR'), k.ad, k.sinif, k.cihaz, k.olay, k.oyun || '', k.gezegen || '', k.olay === 'Oyun' ? k.yildiz : ''].join(ayr))].join('\n'); }
function kayitKopyala() { navigator.clipboard.writeText(kayitMetin('\t')).then(() => toast('📋 Kopyalandı — Excel\'e yapıştırabilirsin'), () => toast('Kopyalanamadı')); }
function csvIndir() { const b = new Blob(['\ufeff' + kayitMetin(';')], { type: 'text/csv;charset=utf-8' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'galaksi_akademi_kayitlar.csv'; a.click(); }
function pinKaydet() { const v = $('#yeniPin').value.trim(); if (v.length < 4) return toast('PIN en az 4 haneli olmalı'); LS.set('ga_pin', v); toast('🔐 PIN güncellendi'); }
function fbKaydet() {
  const ham = $('#fbGirdi').value; const a = ham.indexOf('{'), b = ham.lastIndexOf('}');
  if (a < 0 || b < 0) return toast('Yapılandırma bulunamadı');
  try {
    const js = ham.slice(a, b + 1).replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g, '$1"$2":').replace(/'/g, '"').replace(/,\s*}/g, '}');
    const cfg = JSON.parse(js); if (!cfg.apiKey || !cfg.projectId) throw 0;
    LS.set('ga_fb', cfg); fbDb = null; toast('☁️ Kaydedildi, bağlanıyor…'); bulutYenile();
  } catch (e) { toast('Yapılandırma okunamadı — apiKey ve projectId olmalı'); }
}
function veriSil() {
  modalAc(`<h2>Emin misin?</h2><p class="not">Bu cihazdaki tüm öğrenci profilleri ve kayıtlar silinecek.</p>
    <div class="modal-btnler"><button class="btn" style="background:linear-gradient(135deg,#ff5d6c,#c0263e)" onclick="['ga_oyuncular','ga_aktif','ga_kayitlar'].forEach(k=>localStorage.removeItem(k));oyuncular={};aktifId=null;kayitlar=[];modalKapat();toast('Silindi');ogretmenCiz()">Evet, sil</button><button class="btn hayalet" onclick="modalKapat()">Vazgeç</button></div>`);
}

/* ---------------- ZİRVE: karşılama, QR, ekran modu, yüzen düğmeler ---------------- */
const KARSILAMA = {
  baslik: 'Galaksi Akademi\'ye hoş geldin! 🚀',
  ozet: '9 gezegen, 5 oyun: kodlama, satranç, penaltı, hafıza ve takım yarışı. Her oyun sınıf seviyene göre zorlaşır.',
  adimlar: ['Adını, soyadını ve sınıfını yaz — robotunu tasarla.', 'Haritada kendi gezegenine (veya istediğine) dokun.', 'Oyunları oyna, yıldız topla. Günün Görevi bonus verir!', 'Yıldızlarla garajda jet çantası, taç, pelerin… aç!', 'Öğretmen: sağ üstteki 👩‍🏫 düğmesinden paneli aç (PIN: 1234).']
};
function karsilamaGoster() {
  modalAc(`<div style="display:flex;justify-content:center;gap:4px">${robotSVG({ renk: '#9b6bff', kafa: 1, goz: 2, parca: { tac: 1, jet: 1 } }, 100)}</div><h2>${KARSILAMA.baslik}</h2><p class="not" style="font-size:16px">${KARSILAMA.ozet}</p>
    ${KARSILAMA.adimlar.map((a, i) => `<div class="karsilama-adim"><b>${i + 1}</b><div>${a}</div></div>`).join('')}
    <div class="modal-btnler"><button class="btn yesil" onclick="LS.set('zirve_karsilama_goruldu_galaksi',1);modalKapat()">Hadi başlayalım! 🌟</button></div>`);
}
let ekranModu = LS.get('zirve_ekran_modu', 'Otomatik');
function ekranUygula() {
  let z = 1; const w = Math.max(screen.width, screen.height), dok = navigator.maxTouchPoints > 0;
  if (ekranModu === 'Otomatik') z = w >= 3000 ? 1.6 : (dok && w >= 1600 && (devicePixelRatio || 1) <= 1.25) ? 1.35 : 1;
  else z = { Tablet: 1, 'Akıllı Tahta': 1.35, 'Büyük Tahta': 1.6 }[ekranModu] || 1;
  document.documentElement.style.zoom = z;
}
window.ZIRVE_ekranReset = () => document.documentElement.style.zoom = 1;
window.ZIRVE_ekranGeri = ekranUygula;
window.ZIRVE_kontroller = [
  { id: 'yardim', et: () => '?', is: karsilamaGoster },
  { id: 'qr', et: () => '📲 QR', is: () => ZIRVE_paylasAc() },
  { id: 'ekran', et: () => '📺 ' + ekranModu, is: () => { const s = ['Otomatik', 'Tablet', 'Akıllı Tahta', 'Büyük Tahta']; ekranModu = s[(s.indexOf(ekranModu) + 1) % s.length]; LS.set('zirve_ekran_modu', ekranModu); ekranUygula(); dockCiz(); toast('📺 Ekran modu: ' + ekranModu); } }
];
function dockCiz() {
  const gizli = LS.get('zirve_gizli_kontrol', []);
  $('#zdock').innerHTML = ZIRVE_kontroller.filter(k => !gizli.includes(k.id)).map(k => `<button class="zpill" data-k="${k.id}">${k.et()}<span class="zx" data-x="${k.id}">×</span></button>`).join('');
  $$('#zdock .zpill').forEach(b => b.onclick = e => {
    const x = e.target.dataset.x;
    if (x) { e.stopPropagation(); const g = LS.get('zirve_gizli_kontrol', []); g.push(x); LS.set('zirve_gizli_kontrol', g); dockCiz(); toast('Gizlendi — Öğretmen Paneli › Ayarlar\'dan geri getirebilirsin'); return; }
    ZIRVE_kontroller.find(k => k.id === b.dataset.k).is();
  });
}
window.ZIRVE_kontrolleriGeriGetir = () => { LS.set('zirve_gizli_kontrol', []); dockCiz(); toast('Düğmeler geri geldi'); };
const PAYLAS = { url: null };
window.ZIRVE_paylasAc = async function () {
  const url = PAYLAS.url || location.href;
  modalAc(`<h2>📲 QR ile Paylaş</h2><p class="not">Öğrenciler telefon ya da tabletle okutup oyuna girsin.</p><div id="qrKutu">Yükleniyor…</div>
    ${/^file:|localhost|127\.0\.0\.1/.test(url) ? '<p class="not">⚠️ Bu dosya şu an cihazında açık. QR\'ın herkeste çalışması için önce sitene yükle.</p>' : ''}
    <p class="not" style="word-break:break-all">${url}</p>
    <div class="modal-btnler"><button class="btn kucuk" onclick="navigator.clipboard.writeText('${url.replace(/'/g, '%27')}').then(()=>toast('🔗 Bağlantı kopyalandı'))">🔗 Kopyala</button>
    <button class="btn hayalet kucuk" id="qrIndir">⬇️ PNG</button><button class="btn hayalet kucuk" onclick="modalKapat()">Kapat</button></div>`);
  try {
    await scriptYukle('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js');
    const q = qrcode(0, 'M'); q.addData(url); q.make();
    const n = q.getModuleCount(), c = document.createElement('canvas'), s = 8, m = 4; c.width = c.height = (n + m * 2) * s;
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.fillStyle = '#0a0f2c';
    for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) x.fillRect((k + m) * s, (r + m) * s, s, s);
    $('#qrKutu').innerHTML = ''; $('#qrKutu').appendChild(c);
    $('#qrIndir').onclick = () => { const a = document.createElement('a'); a.href = c.toDataURL('image/png'); a.download = 'galaksi_akademi_qr.png'; a.click(); };
  } catch (e) { $('#qrKutu').textContent = 'QR için internet gerekli.'; }
};

/* ---------------- başlat ---------------- */
$('#perde').addEventListener('click', e => { if (e.target.id === 'perde' && !$('#modal .buyuk-yildizlar')) modalKapat(); });
addEventListener('online', () => toast('🌐 İnternet geri geldi'));
addEventListener('offline', () => toast('📴 İnternet kesildi — oyunlar çalışmaya devam eder'));
if (oyuncu()) taslak = JSON.parse(JSON.stringify(oyuncu().av));
ekranUygula(); dockCiz(); acilisCiz();
if (!LS.get('zirve_karsilama_goruldu_galaksi', 0)) setTimeout(karsilamaGoster, 700);
if ('speechSynthesis' in window) speechSynthesis.getVoices();
</script>
</body>
