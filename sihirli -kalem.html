<style>
:root{
  --ui:1;
  --kagit:#fffaf0;
  --murekkep:#2b2b2b;
  --vurgu:#ff8a3d;
  --vurgu2:#7c4dff;
  --yesil:#2ecc71;
  --kart:#ffffff;
  --golge:0 6px 0 rgba(0,0,0,.12);
  --font:'Baloo 2',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--kagit);color:var(--murekkep);font-family:var(--font);
  user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#sahne{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;
  background:
   radial-gradient(circle at 20% 15%,#fff3dc 0,transparent 40%),
   radial-gradient(circle at 85% 80%,#ffe9f2 0,transparent 45%),
   repeating-linear-gradient(0deg,transparent 0 33px,#eef3ff 33px 34px),
   var(--kagit)}
button{font-family:var(--font);cursor:pointer;border:0}
/* üst gösterim çubuğu (dokunmatik öğe yok — çocuk boyu kuralı) */
#ust{position:fixed;left:0;right:0;top:0;padding:calc(8px*var(--ui)) calc(14px*var(--ui));padding-top:calc(env(safe-area-inset-top) + 8px*var(--ui));
  display:flex;align-items:center;gap:calc(10px*var(--ui));pointer-events:none;z-index:5}
#ust .logo{font-weight:800;font-size:calc(22px*var(--ui));color:var(--vurgu);text-shadow:0 2px 0 #fff;white-space:nowrap}
#ust .orta{flex:1;display:flex;justify-content:center;gap:calc(6px*var(--ui));flex-wrap:wrap}
.faz{font-size:calc(14px*var(--ui));font-weight:700;padding:calc(3px*var(--ui)) calc(10px*var(--ui));border-radius:99px;background:#fff;color:#aaa;border:2px solid #eee}
.faz.aktif{background:var(--vurgu);color:#fff;border-color:var(--vurgu);transform:scale(1.08)}
.faz.bitti{color:var(--yesil);border-color:#c9f2da}
#yildizSay{font-weight:800;font-size:calc(20px*var(--ui));background:#fff;border-radius:99px;padding:calc(2px*var(--ui)) calc(12px*var(--ui));box-shadow:var(--golge);white-space:nowrap}
#surumMini{font-size:calc(11px*var(--ui));opacity:.45;white-space:nowrap}
#balon{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 58px*var(--ui));max-width:min(92vw,760px);
  background:#fff;border:3px solid var(--murekkep);border-radius:22px;padding:calc(6px*var(--ui)) calc(18px*var(--ui));
  font-size:calc(22px*var(--ui));font-weight:700;text-align:center;box-shadow:var(--golge);z-index:5;pointer-events:none;
  transition:opacity .25s;line-height:1.25}
#balon:empty{opacity:0}
/* alt çubuk: tüm dokunulan öğeler altta */
#alt{position:fixed;left:0;right:0;bottom:0;padding:calc(8px*var(--ui)) calc(12px*var(--ui));padding-bottom:calc(env(safe-area-inset-bottom) + 8px*var(--ui));
  display:flex;align-items:center;justify-content:space-between;gap:calc(10px*var(--ui));z-index:6;pointer-events:none}
#alt > *{pointer-events:auto}
.yuvarlak{width:calc(64px*var(--ui));height:calc(64px*var(--ui));border-radius:50%;background:#fff;box-shadow:var(--golge);
  font-size:calc(30px*var(--ui));display:grid;place-items:center;border:3px solid #f1e6d6;transition:transform .1s}
.yuvarlak:active{transform:scale(.92)}
.yuvarlak.kucuk{width:calc(52px*var(--ui));height:calc(52px*var(--ui));font-size:calc(24px*var(--ui));opacity:.75}
#altOrta{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 84px*var(--ui));display:flex;justify-content:center;align-items:flex-end;
  gap:calc(8px*var(--ui));padding:0 10px;z-index:6;pointer-events:none;--bw:min(calc(58px*var(--ui)),calc((100vw - 40px)/8 - 6px))}
#altOrta > *{pointer-events:auto}

<script>
/* =====================================================================
   ZGIRIS — ZİRVE zorunlu öğrenci girişi + öğretmen paneli (oyun_girisleri)

(function(){
  'use strict';
  const AYAR = Object.assign({projectId:'shaped-totem-481514-c5', apiKey:'', koleksiyon:'oyun_girisleri', pin:'2026'}, window.ZGIRIS_AYAR||{});
  const BASE = 'https://firestore.googleapis.com/v1/projects/'+AYAR.projectId+'/databases/(default)/documents';
  const keyQ = (u)=> AYAR.apiKey ? u+(u.indexOf('?')>-1?'&':'?')+'key='+encodeURIComponent(AYAR.apiKey) : u;
  const LS = {
    get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
    set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },
    del(k){ try{ localStorage.removeItem(k); }catch(e){} }
  };
  let ogr=null, oyunAdi='', renk='#7c4dff', docName=null, hb=null;

  function cihaz(){
    const ua=navigator.userAgent||'', mtp=navigator.maxTouchPoints||0, touch=mtp>0||('ontouchstart' in window);
    const sw=Math.max(screen.width,screen.height), sh=Math.min(screen.width,screen.height), dpr=window.devicePixelRatio||1;
    let os='Diğer';
    if(/iPhone/.test(ua)) os='iPhone';
    else if(/iPad/.test(ua)||(/Macintosh/.test(ua)&&mtp>1)) os='iPad';
    else if(/Android/.test(ua)) os='Android';
    else if(/CrOS/.test(ua)) os='Chromebook';
    else if(/Windows/.test(ua)) os='Windows';
    else if(/Macintosh|Mac OS/.test(ua)) os='Mac';
    else if(/Linux/.test(ua)) os='Linux';
    let tur='Bilgisayar';
    if(touch && ((sw>=1700 && dpr<=1.3) || sw>=3000)) tur='Akıllı Tahta';
    else if(os==='iPhone' || (os==='Android' && /Mobile/.test(ua))) tur='Telefon';
    else if(os==='iPad' || os==='Android') tur='Tablet';
    let tarayici='Diğer';
    if(/Edg\//.test(ua)) tarayici='Edge'; else if(/OPR\//.test(ua)) tarayici='Opera';
    else if(/Chrome\//.test(ua)) tarayici='Chrome'; else if(/Firefox\//.test(ua)) tarayici='Firefox';
    else if(/Safari\//.test(ua)) tarayici='Safari';
    return {os, tur, tarayici, ekran: screen.width+'x'+screen.height, touch, sw, sh, dpr};
  }

  const S = v => ({stringValue:String(v==null?'':v)});

  function alanlar(k){

  async function kaydet(k){
    const r = await fetch(keyQ(BASE+'/'+AYAR.koleksiyon), {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({fields:alanlar(k)})});
    if(!r.ok) throw new Error('HTTP '+r.status);

  }
  function kuyruk(k){ const q=LS.get('zirve_giris_bekleyen',[]); q.push(k); LS.set('zirve_giris_bekleyen', q.slice(-50)); }

    LS.set('zirve_giris_bekleyen', kalan);
  }
  async function patchAlan(alan, deger){
    if(!docName) return;

    const f={}; f[alan]=deger;
    try{ await fetch(u,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:f})}); }catch(e){}
  }

    catch(e){ kuyruk(k); }
    clearInterval(hb); hb=setInterval(sonGoruldu, 120000);
  }
  window.addEventListener('online', kuyruguGonder);

  const deger = f => !f ? '' : (f.stringValue!=null?f.stringValue:(f.timestampValue!=null?f.timestampValue:(f.integerValue!=null?f.integerValue:'')));
  async function listele(){

      for(const a of ['ad','soyad','sinif','sube','oyun','cihaz','os','tarayici','ekran','giris','son','ilerleme']) o[a]=deger(f[a]);
      return o; }).sort((a,b)=> (b.giris||'').localeCompare(a.giris||''));
  }

  /* ---------- Görünüm ---------- */
  const css = `
  .zg-ort{position:fixed;inset:0;z-index:9500;display:flex;align-items:center;justify-content:center;padding:16px;

  .zg-btn.ikincil{background:#eee;color:#333}

  .zg-panel{background:#fff;border-radius:22px;width:min(100%,1100px);max-height:94vh;overflow:auto;padding:18px;color:#222}
  .zg-ozet{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:10px 0}
  .zg-oz{background:#f6f3ff;border-radius:16px;padding:10px;text-align:center}
  .zg-oz b{display:block;font-size:26px;color:var(--zg)}
  .zg-fil{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}

      if(!(anaokul && soyad==='') && (soyad.length<2||!HARF.test(soyad))) return $('zgHata').textContent='Soyadını en az 2 harfle yaz.';

      LS.set('zirve_ogrenci',ogr); kapat(d); girisKaydet(); coz(ogr);

  function baslat(o){

/* ---------- Kodla & Oyna seviyeleri (5×5, S=başla, *=yıldız, #=kutu) ---------- */
const YON = {u:[0,-1,'⬆️'], d:[0,1,'⬇️'], l:[-1,0,'⬅️'], r:[1,0,'➡️'], ul:[-1,-1,'↖️'], ur:[1,-1,'↗️'], dl:[-1,1,'↙️'], dr:[1,1,'↘️']};
const KOMUTLAR = {robot:['u','d','l','r'], kale:['u','d','l','r'], piyon:['u'], fil:['ul','ur','dl','dr'],
  vezir:['ul','u','ur','l','r','dl','d','dr'], sah:['ul','u','ur','l','r','dl','d','dr']};
const KOD_SEVIYE = [
  {kim:'robot', not:'Robi yukarı gitsin!', h:['.....','.....','..*..','.....','..S..']},
  {kim:'robot', not:'Robi sağa gitsin!', h:['.....','.....','.....','.....','S..*.']},
  {kim:'robot', not:'Önce yukarı, sonra sağa!', h:['.....','.....','..*..','.....','S....']},
  {kim:'piyon', not:'Piyon yalnız ileri gider!', h:['..*..','.....','.....','.....','..S..']},
  {kim:'robot', not:'Kutunun etrafından dolaş!', h:['.....','.....','S.#.*','.....','.....']},
  {kim:'kale', not:'Kale dümdüz gider!', h:['.....','.*...','.....','...S.','.....']},
  {kim:'fil', not:'Fil çapraz gider!', h:['.....','.....','..*..','.....','S....']},
  {kim:'fil', not:'Kutuya çarpmadan çapraz git!', h:['....*','.....','..#..','.....','S....']},
  {kim:'vezir', not:'Vezir her yöne gider!', h:['*....','.....','.....','.....','....S']},
  {kim:'vezir', not:'Kutuların yanından geç!', h:['..*..','.###.','.....','.....','..S..']},
  {kim:'sah', not:'Şah her yöne bir kare gider!', h:['....*','.#.#.','.....','.#.#.','S....']},
  {kim:'robot', not:'Uzun yol! Dikkatle kodla.', h:['#*...','#.##.','.....','.##..','S....']}
];
function haritaCoz(h){ const t={engel:new Set(), start:null, hedef:null};
  h.forEach((s,r)=>[...s].forEach((ch,c)=>{ if(ch==='S') t.start={c,r}; else if(ch==='*') t.hedef={c,r}; else if(ch==='#') t.engel.add(c+','+r); })); return t; }
function kodCoz(lvl){ // en kısa komut dizisi (BFS)
  const t=haritaCoz(lvl.h), kom=KOMUTLAR[lvl.kim], q=[[t.start,[]]], gor=new Set([t.start.c+','+t.start.r]);
  while(q.length){ const [p,yol]=q.shift(); if(p.c===t.hedef.c&&p.r===t.hedef.r) return yol;
    for(const k of kom){ const c=p.c+YON[k][0], r=p.r+YON[k][1], key=c+','+r; if(c<0||r<0||c>4||r>4||t.engel.has(key)||gor.has(key)) continue; gor.add(key); q.push([{c,r},[...yol,k]]); } }
  return null; }

/* ---------- Yol ölçme (SVG) ---------- */
const olcuPath = $('olcuPath');
function hazirla(k){
  k.parcalar.forEach(p=>{
    if(p._yol) return;
    p._yol = new Path2D(p.d);
    olcuPath.setAttribute('d', p.d);
    let L=1; try{ L = olcuPath.getTotalLength(); }catch(e){}
    const n = Math.max(8, Math.round(L/1.1)), pts=[];
    for(let i=0;i<=n;i++){ const q=olcuPath.getPointAtLength(L*i/n); pts.push({x:q.x,y:q.y}); }
    p._pts = pts;
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; pts.forEach(q=>{x0=Math.min(x0,q.x);y0=Math.min(y0,q.y);x1=Math.max(x1,q.x);y1=Math.max(y1,q.y);});
    p._bb={x0,y0,x1,y1,cx:(x0+x1)/2,cy:(y0+y1)/2};
    if(!p.cizgi && (p.mod==='iz' || !p.oto)){
      const h=new Path2D(); let s=7; const rnd=()=>{ s=(s*16807)%2147483647; return s/2147483647; };
      for(let y=y0-40;y<y1+30;y+=2.1){ const j=rnd()*1.2; h.moveTo(x0-5,y+j); h.lineTo(x1+5,y+j+(x1-x0)*0.45); }
      p._tarama=h;
    }
  });
  k._ust = Math.min(...k.parcalar.map(p=>p._bb.y0));
  k._sag = Math.max(...k.parcalar.map(p=>p._bb.x1));
}
function grupListe(k){ const l=[]; k.parcalar.forEach(p=>{ if(p.grup && !l.includes(p.grup)) l.push(p.grup); }); return l; }
function tamHazirla(k, renkMap){ // tahta/önizleme için hazır, boyalı karakter
  hazirla(k); const m = renkMap || {};
  k.parcalar.forEach(p=>{ p._tamam=true; p._anim=null; p._pop=0; p._renk = p.grup ? (m[p.grup] || RENKLER[k.renk[p.grup]].hex) : null; });
}

/* ---------- Ses efektleri ---------- */
let AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
let sesAcik = LSx.get('sihirli_kalem_ses',true);
function ton(f,sure,tip,vol,f2){ const a=ac(); if(!a||!sesAcik) return; const o=a.createOscillator(), g=a.createGain(), t=a.currentTime;
  o.type=tip||'sine'; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+sure);
  g.gain.setValueAtTime(vol||.18,t); g.gain.exponentialRampToValueAtTime(.001,t+sure); o.connect(g).connect(a.destination); o.start(t); o.stop(t+sure+.02); }
let gurBuf=null;
function gurultu(sure,vol,frek){ const a=ac(); if(!a||!sesAcik) return;
  if(!gurBuf){ gurBuf=a.createBuffer(1,a.sampleRate*0.6,a.sampleRate); const d=gurBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain(), t=a.currentTime;
  s.buffer=gurBuf; f.type='bandpass'; f.frequency.value=frek||3500; f.Q.value=.8;
  g.gain.setValueAtTime(vol||.05,t); g.gain.exponentialRampToValueAtTime(.001,t+sure);
  s.connect(f).connect(g).connect(a.destination); s.start(t); s.stop(t+sure); }
const SFX = {
  kalem(){ gurultu(.07,.035,4200+Math.random()*1500); },
  ding(){ ton(880,.18,'sine',.16,1320); setTimeout(()=>ton(1320,.25,'sine',.13),110); },
  pop(){ ton(420,.12,'triangle',.2,900); },
  adim(){ ton(600,.08,'square',.06,700); },
  puf(){ gurultu(.5,.12,900); },
  boya(){ gurultu(.25,.05,1800); ton(520,.15,'sine',.08,780); },
  hata(){ ton(300,.2,'sine',.12,220); },
  zafer(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>ton(f,.3,'triangle',.15),i*120)); }
};

/* ---------- Konuşma ---------- */
let sonSoz='', trSes=null;
function sesSec(){ try{ const v=speechSynthesis.getVoices(); trSes = v.find(x=>/tr[-_]TR/i.test(x.lang)&&/Google|Yelda|Emel|Seda/i.test(x.name)) || v.find(x=>/^tr/i.test(x.lang)) || null; }catch(e){} }
if('speechSynthesis' in window){ sesSec(); speechSynthesis.onvoiceschanged=sesSec; }
function soyle(metin, yaz){
  sonSoz = metin;
  if(yaz!==false) $('balon').textContent = metin;
  if(!sesAcik || !('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(metin.replace(/[A-ZÇĞİÖŞÜ]{3,}/g,m=>m.toLocaleLowerCase('tr-TR')).replace(/[⬆️⬇️⬅️➡️↖️↗️↙️↘️▶]/g,''));
    u.lang='tr-TR'; if(trSes) u.voice=trSes; u.rate=.92; u.pitch=1.12; speechSynthesis.speak(u); }catch(e){}
}

/* ---------- Tuval ---------- */
const cv=$('sahne'), ctx=cv.getContext('2d');
const hitCtx=document.createElement('canvas').getContext('2d'); // birim koordinatta isabet testi
let W=0,H=0,DPR=1, KUTU={ox:0,oy:0,sc:1};
function uiOlcek(){ return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ui'))||1; }
function boyutla(){
  DPR=Math.min(window.devicePixelRatio||1,2.5); W=innerWidth; H=innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  const ui=uiOlcek();
  const ust = (W<640?96:110)*ui;
  const ao = $('altOrta').getBoundingClientRect().height || 0;
  const alt = Math.max(238*ui, ao + 100*ui);
  const kul = Math.max(160, H-ust-alt);
  const boy = Math.min(W*0.9, kul);
  KUTU.sc = boy/100; KUTU.ox = (W-boy)/2; KUTU.oy = ust + (kul-boy); // çocuk boyu: alta yasla
}
addEventListener('resize', ()=>{ ekranUygula(); boyutla(); });

/* Faz göstergesi */
function fazCiz(){
  let html='';
  if(G.k && G.faz!=='menu'){
    if(G.kod && !G.kod.gomulu){
      html = `<span class="faz ad" style="background:#fff8e6;color:#333;border-color:#ffd36e">🧩 Kodla & Oyna</span><span class="faz aktif">Seviye ${G.kod.idx+1}/${KOD_SEVIYE.length}</span>`;
    } else {
      const fazlar=[['ciz','✏️ Çiz'],['boya','🖍️ Boya'],['canlan','✨ Canlan'],[G.k.son,SON_FAZ_AD[G.k.son]]];

/* ---------- Karakter başlat ---------- */
function karakterBasla(k){
  hazirla(k);
  G.k = k; G.faz='ciz'; G.pIdx=0; G.ifade=null; G.secRenk=null; G.boyaGrupIdx=0; G.hataSay=0; G.bulutlar=[]; G.konfeti=[];

function parcaHazirla(){ const p=aktifParca(); if(!p) return; G.kapsam = new Uint8Array(p._pts.length); G.sonIlerleme = performance.now(); }
function parcaBitir(){

  SFX.ding(); G.pIdx++;

/* ---------- Boya ---------- */
function boyaBasla(){
  G.faz='boya'; fazCiz(); G.boyaGrupIdx=0; G.hataSay=0; G.secRenk=null;
  const a=altOrtaAyarla(Object.keys(RENKLER).map(key=>`<button class="boya" data-r="${key}" title="${RENKLER[key].ad}" style="background:${RENKLER[key].hex};--r:${RENKLER[key].hex}"></button>`).join(''));
  a.querySelectorAll('.boya').forEach(b=>b.onclick=()=>{ ac(); G.secRenk=b.dataset.r; a.querySelectorAll('.boya').forEach(x=>x.classList.toggle('secili',x===b)); SFX.pop();
    const ad=RENKLER[b.dataset.r].ad; soyle(ad.charAt(0)+ad.slice(1).toLocaleLowerCase('tr-TR'), false); });
  boyaTalimat(true);
}
function boyaTalimat(ilk){
  const gl=grupListe(G.k);
  if(SV().serbestBoya) soyle(ilk ? 'Şimdi boyayalım! Aşağıdan bir boya kalemi seç, sonra boyamak istediğin yere dokun.' : 'Boyamadığın yer kaldı. Hadi onu da boya!');
  else { const g=gl[G.boyaGrupIdx]; soyle(`${G.k.soz[g]} ${RENKLER[G.k.renk[g]].ad} boya!`); }
}
function boyaDokun(ux,uy){
  const gl=grupListe(G.k);
  const adaylar=G.k.parcalar.filter(p=>p.grup).sort((a,b)=>b.z-a.z);
  let vur=null; for(const p of adaylar){ if(hitCtx.isPointInPath(p._yol,ux,uy)){ vur=p; break; } }
  if(!vur) return;
  if(!G.secRenk){ SFX.hata(); soyle('Önce aşağıdan bir boya kalemi seç!'); return; }
  const g=vur.grup;
  if(!SV().serbestBoya){
    const hedef=gl[G.boyaGrupIdx];
    if(g!==hedef){ SFX.hata(); soyle(`Önce ${G.k.soz[hedef].toLocaleLowerCase('tr-TR')} ${RENKLER[G.k.renk[hedef]].ad} boyayalım!`); G.parlat=hedef; G.parlatT=performance.now(); return; }
    const istenen=G.k.renk[g];
    if(G.secRenk!==istenen){
      G.hataSay++; SFX.hata();
      soyle(`Bu ${RENKLER[G.secRenk].ad}. Biz ${RENKLER[istenen].ad} arıyoruz.`);
      if(G.hataSay>=SV().ipucuHata) kalemIpucu(istenen);
      return;
    }
  }
  const t=performance.now();
  G.k.parcalar.filter(p=>p.grup===g).forEach(p=>{ p._renk=RENKLER[G.secRenk].hex; p._anim={x:ux,y:uy,t}; });
  SFX.boya(); kalemIpucu(null); G.hataSay=0; G.parlat=null;
  if(SV().serbestBoya){
    const kalan=gl.filter(x=>!G.k.parcalar.find(p=>p.grup===x)._renk);
    if(kalan.length) soyle(rastgele(['Çok güzel!','Ne güzel renk!','Harika!'])+' Başka bir yeri de boya.'); else boyaBitti();
  } else {
    soyle(`Harika! ${RENKLER[G.secRenk].ad}!`);
    G.boyaGrupIdx++;
    if(G.boyaGrupIdx>=gl.length) boyaBitti(); else setTimeout(()=>boyaTalimat(false),1100);
  }
}
function kalemIpucu(key){ document.querySelectorAll('.boya').forEach(b=>b.classList.toggle('ipucu', !!key && b.dataset.r===key)); }
function boyaBitti(){
  G.k._renkler={}; grupListe(G.k).forEach(g=>{ G.k._renkler[g]=G.k.parcalar.find(p=>p.grup===g)._renk; });
  G.mesgul=true;
  setTimeout(()=>{ G.mesgul=false; altOrtaTemizle(); canlanBasla(); },1300);
}

function duyguBasla(){ G.faz='duygu'; fazCiz(); G.tur=0; G.turlar=karistir(Object.keys(DUYGULAR)).slice(0,SV().tur); duyguTur(); }
function duyguTur(){

function kartlarGoster(liste, sec){

function sayBasla(){

function koseBasla(){
  const k=G.k;
  if(!k.kose.length){ altOrtaTemizle(); G.ifade='mutlu'; soyle(k.koseSoz); setTimeout(karakterBitti,3200); return; }
  altOrtaTemizle();
  G.kose={say:0, isaret:new Array(k.kose.length).fill(0)};

function koseDokun(ux,uy){
  const k=G.k, K=G.kose; if(!K||K.bitti) return;
  let en=-1, ed=1e9;
  k.kose.forEach((q,i)=>{ if(K.isaret[i]) return; const d=Math.hypot(q[0]-ux,q[1]-uy); if(d<ed){ed=d;en=i;} });
  if(en<0 || ed>(seviye==='kolay'?18:13)) return;
  K.say++; K.isaret[en]=K.say; SFX.pop(); soyle(SAYI_SOZ[K.say].charAt(0).toLocaleUpperCase('tr-TR')+SAYI_SOZ[K.say].slice(1)+'!', false);
  $('balon').textContent = K.say;
  if(K.say===k.kose.length){
    K.bitti=true;
    setTimeout(()=>{
      const n=k.kose.length;
      if(seviye==='kolay'){ G.ifade='mutlu'; G.ziplaT=performance.now(); SFX.ding(); soyle(`${n}! ${k.koseSoz}`); setTimeout(karakterBitti,3400); return; }
      const secenek=karistir([n,...karistir([0,1,2,3,4,5,6].filter(x=>x!==n)).slice(0,SV().secenek-1)]);
      kartlarGoster(secenek.map(x=>({e:x, t:SAYI_SOZ[x], v:x})), (v,b)=>{
        if(v===n){ G.ifade='mutlu'; dogruKart(b, k.koseSoz, karakterBitti); }
        else yanlisKart(b,'Saydığın sayıları hatırla. Bir daha bak!');
      });
      soyle(k.koseAd==='ucu' ? 'Kaç uç saydın?' : 'Kaç köşe saydın?');
    },700);
  }
}

/* ---------- Satranç tahtası (5×5) ---------- */
const TB = {x:2.5, y:2.5, h:19};
function hamleler(kim,c,r,engel){
  const l=[], ic=(x,y)=>x>=0&&y>=0&&x<5&&y<5, bos=(x,y)=>!engel||!engel.has(x+','+y);
  const kay=(dirs)=>dirs.forEach(([dx,dy])=>{ let x=c+dx,y=r+dy; while(ic(x,y)&&bos(x,y)){ l.push({c:x,r:y}); x+=dx; y+=dy; } });
  const tek=(dirs)=>dirs.forEach(([dx,dy])=>{ const x=c+dx,y=r+dy; if(ic(x,y)&&bos(x,y)) l.push({c:x,r:y}); });
  const DUZ=[[0,-1],[0,1],[-1,0],[1,0]], CAP=[[1,1],[1,-1],[-1,1],[-1,-1]];
  if(kim==='piyon') tek([[0,-1]]);
  else if(kim==='kale') kay(DUZ);
  else if(kim==='fil') kay(CAP);
  else if(kim==='vezir') kay(DUZ.concat(CAP));
  else if(kim==='sah') tek(DUZ.concat(CAP));
  else if(kim==='at') tek([[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]]);
  else tek(DUZ);
  return l;
}
const ayni = (a,b) => a&&b&&a.c===b.c&&a.r===b.r;
function hucre(ux,uy){ const c=Math.floor((ux-TB.x)/TB.h), r=Math.floor((uy-TB.y)/TB.h); return (c>=0&&r>=0&&c<5&&r<5)?{c,r}:null; }
function tasGit(hedef, sonra){ const t=G.tahta; if(!t||!hedef) return; t.anim={from:{...t.pos}, to:{...hedef}, t0:performance.now(), dur:450}; SFX.adim();
  setTimeout(()=>{ t.pos={...hedef}; t.anim=null; sonra&&sonra(); },460); }

function hareketBasla(){
  G.faz='hareket'; fazCiz(); G.ifade=null; altOrtaTemizle();
  const kim=G.k.id, pos = kim==='piyon'?{c:2,r:4}:{c:2,r:2};
  G.tahta={kim, pos, hedef:null, engel:new Set(), anim:null, kirmizi:null, nokta:true, demoT:performance.now(), hata:0, tur:0, kilit:true};
  soyle(G.k.kural);
  setTimeout(()=>{ const t=G.tahta; if(!t||G.faz!=='hareket') return; t.demoT=0; t.kilit=false; hareketTur(); }, 5200);
}
function hareketTur(){
  const t=G.tahta, l=hamleler(t.kim,t.pos.c,t.pos.r);
  let aday=l;
  if(seviye==='zor' && t.kim!=='piyon'){
    const iki=[]; l.forEach(a=>hamleler(t.kim,a.c,a.r).forEach(b=>{ if(!ayni(b,t.pos) && !l.some(x=>ayni(x,b)) && !iki.some(x=>ayni(x,b))) iki.push(b); }));
    if(iki.length) aday=iki;
  }
  if(!aday.length){ karakterBitti(); return; }
  t.hedef=rastgele(aday); t.hata=0; t.nokta = seviye==='kolay';
  soyle(seviye==='zor'&&t.kim!=='piyon' ? `${G.k.adi} yıldıza götür! Belki iki hamle gerekir.` : `${G.k.adi} yıldıza götür! Gidebileceği bir kareye dokun.`);
}
function hareketDokun(ux,uy){
  const t=G.tahta; if(!t||t.kilit||t.anim) return;
  const h=hucre(ux,uy); if(!h) return;
  if(ayni(h,t.pos)){ G.ziplaT=performance.now(); return; }
  const l=hamleler(t.kim,t.pos.c,t.pos.r);
  if(l.some(x=>ayni(x,h))){
    t.kilit=true;
    tasGit(h, ()=>{
      t.kilit=false;
      if(ayni(t.pos,t.hedef)){ SFX.ding(); t.tur++; t.hedef=null; G.ziplaT=performance.now();
        if(t.tur>=SV().tur){ t.kilit=true; soyle(`Harika! ${G.k.ad} nasıl gider öğrendin!`); setTimeout(karakterBitti,1800); }
        else { soyle(rastgele(['Süper hamle!','Aferin!','Tam yıldızda!'])); t.kilit=true; setTimeout(()=>{ t.kilit=false; hareketTur(); },1300); } }
      else soyle('Güzel hamle! Şimdi yıldıza git.');
    });
  } else {
    SFX.hata(); t.kirmizi={...h, t0:performance.now()}; t.hata++;
    soyle(`${G.k.ad} oraya gidemez. ${G.k.kisa}!`);
    if((seviye==='orta'&&t.hata>=1)||(seviye==='zor'&&t.hata>=2)) t.nokta=true;
  }
}

/* ---------- Kodla ---------- */
function kodBasla(idx, gomulu){
  const lvl=KOD_SEVIYE[idx], m=haritaCoz(lvl.h), k=KAR(lvl.kim);
  if(!gomulu){ tamHazirla(k, (KAYIT.tamam[k.id]||{}).renkler); G.k=k; katmanKapat('album'); katmanKapat('anaMenu'); katmanKapat('bittiK'); }
  else if(G.k!==k){ tamHazirla(k, k._renkler); G.k=k; }
  G.faz='kodla'; G.ifade=null; G.konfeti=[]; G.bulutlar=[];
  G.kod={idx, gomulu, program:[], calisiyor:false, adim:-1, hata:0, cozum:null, gomuluSay: gomulu ? ((G.kod&&G.kod.gomulu)?G.kod.gomuluSay:0) : 0};
  G.tahta={kim:lvl.kim, pos:{...m.start}, start:m.start, hedef:m.hedef, engel:m.engel, anim:null, kirmizi:null, nokta:false, demoT:0, carp:null};
  fazCiz(); kodKontrolCiz();

  T.engel.forEach(key=>{ const [c,r]=key.split(',').map(Number), x=TB.x+c*h, y=TB.y+r*h;
    ctx.fillStyle='#c08443'; ctx.strokeStyle='#5b3a1e'; ctx.lineWidth=.8; ctx.fillRect(x+3,y+4,h-6,h-7); ctx.strokeRect(x+3,y+4,h-6,h-7);
    ctx.beginPath(); ctx.moveTo(x+3,y+4); ctx.lineTo(x+h-3,y+h-3); ctx.moveTo(x+h-3,y+4); ctx.lineTo(x+3,y+h-3); ctx.stroke(); });
  // kod ipucu izleri
  if(G.kod && G.kod.cozum){ let p={...T.start}; const nab=.45+.35*Math.sin(t/250);
    G.kod.cozum.forEach(k=>{ p={c:p.c+YON[k][0], r:p.r+YON[k][1]}; ctx.fillStyle=`rgba(124,77,255,${nab})`; ctx.beginPath(); ctx.arc(TB.x+(p.c+.5)*h,TB.y+(p.r+.5)*h,2.4,0,Math.PI*2); ctx.fill(); }); }
  // yasal hamle noktaları
  const demo = T.demoT && t>=T.demoT && t-T.demoT<5200;
  if((T.nokta||demo) && G.faz==='hareket' && !T.anim){
    const nab=.5+.5*Math.sin(t/220);
    hamleler(T.kim,T.pos.c,T.pos.r).forEach(q=>{ ctx.fillStyle=`rgba(46,204,113,${.45+.4*nab})`; ctx.beginPath(); ctx.arc(TB.x+(q.c+.5)*h,TB.y+(q.r+.5)*h,2.6+nab,0,Math.PI*2); ctx.fill(); });
  }
  // kırmızı uyarı
  if(T.kirmizi && t-T.kirmizi.t0<700){ ctx.fillStyle=`rgba(239,68,68,${.55*(1-(t-T.kirmizi.t0)/700)})`; ctx.fillRect(TB.x+T.kirmizi.c*h,TB.y+T.kirmizi.r*h,h,h); }
  // yıldız
  if(T.hedef){ const s=1+.12*Math.sin(t/200); yildizCiz(TB.x+(T.hedef.c+.5)*h,TB.y+(T.hedef.r+.5)*h,h*.36*s,'#facc15');
    ctx.save(); ctx.strokeStyle='#b45309'; ctx.lineWidth=.5; ctx.restore(); }
  // demo hayalet
  if(demo && G.faz==='hareket'){ const l=hamleler(T.kim,T.pos.c,T.pos.r); if(l.length){ const q=l[Math.max(0,Math.floor((t-T.demoT)/650))%l.length];
    ctx.save(); ctx.globalAlpha=.4; tasCizHucre(q.c,q.r,t,0); ctx.restore(); } }
  // taş
  let pc=T.pos.c, pr=T.pos.r, hop=0;
  if(T.anim){ const a=Math.max(0,Math.min(1,(t-T.anim.t0)/T.anim.dur)), e=a<.5?2*a*a:1-Math.pow(-2*a+2,2)/2;
    pc=T.anim.from.c+(T.anim.to.c-T.anim.from.c)*e; pr=T.anim.from.r+(T.anim.to.r-T.anim.from.r)*e; hop=Math.sin(a*Math.PI)*(T.kim==='at'?.9:.35); }
  if(T.carp){ const a=(t-T.carp.t0)/400; if(a<1){ const s=Math.sin(a*Math.PI)*.3; pc+=T.carp.dx*s; pr+=T.carp.dy*s; } }
  const zt=(t-G.ziplaT)/700; if(zt>=0&&zt<1) hop=Math.max(hop,Math.sin(zt*Math.PI)*.35);
  tasCizHucre(pc,pr-hop,t,hop);
  ctx.restore();
}
function tasCizHucre(c,r,t,hop){
  const h=TB.h, k=G.k;
  ctx.save(); ctx.fillStyle='rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(TB.x+(c+.5)*h,TB.y+(r+hop+.92)*h,h*.3,h*.06,0,0,Math.PI*2); ctx.fill(); ctx.restore();
  ctx.save(); ctx.translate(TB.x+c*h-h*.08, TB.y+r*h-h*.12); ctx.scale(h*1.16/100,h*1.16/100);
  karakterCiz(ctx,k,t,{statik:true, ifade:G.ifade, yuzGizle:!!G.ifade});
  ctx.restore();
}

/* ---------- Ana döngü ---------- */
function dongu(t){
  requestAnimationFrame(dongu);
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,W,H);
  const k=G.k;
  if(k && G.faz!=='menu'){
    ctx.save(); ctx.translate(KUTU.ox,KUTU.oy); ctx.scale(KUTU.sc,KUTU.sc);
    if(G.tahta && (G.faz==='hareket'||G.faz==='kodla')) tahtaCiz(t);
    else karakterSahne(t,k);
    ctx.restore();
    if(G.faz==='ciz') kalemImlec(t);
  }
  if(G.konfeti.length){ G.konfeti.forEach(p=>{ const a=(t-p.t)/1000; const y=p.y+p.vy*a, x=p.x+p.vx*a+Math.sin(a*3+p.a)*20; if(y>H+20) return;
    ctx.save(); ctx.translate(x,y); ctx.rotate(p.a+p.va*a); ctx.fillStyle=p.c; ctx.fillRect(-6,-3,12,6); ctx.restore(); });
    if(t-G.konfeti[0].t>6000) G.konfeti=[]; }
}
function karakterSahne(t,k){
  ctx.fillStyle='rgba(0,0,0,.07)'; ctx.beginPath(); ctx.ellipse(50,98,28,3.2,0,0,Math.PI*2); ctx.fill();
  let zipla=0, sq=0; const zt=(t-G.ziplaT)/700;
  if(zt>=0&&zt<1){ zipla=Math.sin(zt*Math.PI)*14; sq = zt<.12 ? -(.12-zt)*1.2 : 0; }
  const canli = ['duygu','bitti','say'].includes(G.faz)||(G.faz==='canlan'&&t-G.canT>1500);
  const nefes = canli ? Math.sin(t/600)*.015 : 0;
  let titre=0; if(G.faz==='canlan'){ const ct=t-G.canT; if(ct>600&&ct<1500) titre=Math.sin(ct/25)*1.2; }
  ctx.save(); ctx.translate(50+titre,98-zipla); ctx.scale(1+nefes-sq*.5,1-nefes+sq); ctx.translate(-50,-98);
  let kirp=0; if(canli && !G.ifade){ const b=(t%3200); if(b<140) kirp=Math.max(.1,Math.abs(b-70)/70); }
  karakterCiz(ctx,k,t,{ifade:G.ifade, yuzGizle:!!G.ifade, kirp});
  ctx.restore();

  if(G.faz==='ciz'){
    const p=aktifParca();
    if(p){
      const nab=.5+.5*Math.sin(t/220);
      if(p.mod==='iz'){
        ctx.save(); ctx.setLineDash([.4,2.6]); ctx.lineCap='round'; ctx.strokeStyle='rgba(124,77,255,.75)'; ctx.lineWidth=1.9; ctx.stroke(p._yol); ctx.restore();
        ctx.save(); ctx.strokeStyle=p.cizgiRenk||KOYU; ctx.lineWidth=p.lw||1.35; ctx.lineCap='round'; ctx.beginPath();
        const P=p._pts, K=G.kapsam;
        for(let i=0;i<P.length-1;i++){ if(K[i]&&K[i+1]){ ctx.moveTo(P[i].x,P[i].y); ctx.lineTo(P[i+1].x,P[i+1].y); } }
        ctx.stroke(); ctx.restore();
        let ilk=0; while(ilk<K.length&&K[ilk]) ilk++;
        if(ilk<K.length){ const q=P[ilk]; ctx.fillStyle=`rgba(46,204,113,${.55+.45*nab})`; ctx.beginPath(); ctx.arc(q.x,q.y,2.6+nab*1.4,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=.8; ctx.stroke(); }
      } else {
        const bb=p._bb, r=Math.max(4,(bb.x1-bb.x0)/2+2.5,(bb.y1-bb.y0)/2+2.5);
        ctx.save(); ctx.globalAlpha=.35; parcaCiz(ctx,p,t,{hepsi:true}); ctx.restore();
        ctx.save(); ctx.setLineDash([1.2,1.6]); ctx.strokeStyle=`rgba(124,77,255,${.5+.5*nab})`; ctx.lineWidth=1.1; ctx.beginPath(); ctx.arc(bb.cx,bb.cy,r+nab*1.5,0,Math.PI*2); ctx.stroke(); ctx.restore();
      }
    }
  }
  if(G.faz==='boya'){
    const hedef = SV().serbestBoya ? null : grupListe(k)[G.boyaGrupIdx];
    const parl = G.parlat && t-G.parlatT<2500 ? G.parlat : hedef;
    if(parl){ const nab=.5+.5*Math.sin(t/200); ctx.save(); ctx.strokeStyle=`rgba(250,204,21,${.35+.5*nab})`; ctx.lineWidth=3.2+nab*1.5; ctx.lineJoin='round';
      k.parcalar.filter(p=>p.grup===parl).forEach(p=>ctx.stroke(p._yol)); ctx.restore(); }
  }
  // köşe sayma işaretleri
  if(G.faz==='say' && G.kose){ const nab=.5+.5*Math.sin(t/220);
    k.kose.forEach((q,i)=>{ const n=G.kose.isaret[i];
      if(n){ ctx.fillStyle='#7c4dff'; ctx.beginPath(); ctx.arc(q[0],q[1],5.2,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#fff'; ctx.font='bold 7px "Baloo 2",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(n,q[0],q[1]+.3); }
      else { ctx.strokeStyle=`rgba(124,77,255,${.4+.6*nab})`; ctx.lineWidth=1.2; ctx.setLineDash([1.2,1.4]); ctx.beginPath(); ctx.arc(q[0],q[1],4.5+nab*1.5,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]); }
    }); }
  G.bulutlar.forEach(b=>{ const a=(t-b.t)/1100; if(a>1) return; ctx.fillStyle=`rgba(190,190,195,${.85*(1-a)})`;
    ctx.beginPath(); const x=b.x+b.vx*a, y=b.y+b.vy*a, r=b.r*(1+a*.8);
    ctx.arc(x,y,r,0,Math.PI*2); ctx.arc(x+r*.7,y-r*.3,r*.7,0,Math.PI*2); ctx.arc(x-r*.6,y-r*.4,r*.6,0,Math.PI*2); ctx.fill(); });
  if(G.faz==='canlan'){ const ct=(t-G.canT)/1000; if(ct>.5&&ct<3){ for(let i=0;i<8;i++){ const a=i/8*Math.PI*2+ct*2, rr=40+Math.sin(ct*4+i)*6;
    yildizCiz(50+Math.cos(a)*rr,58+Math.sin(a)*rr*.85,2.4+Math.sin(ct*6+i)*.8,'#facc15'); } } }
}
function kalemImlec(t){
  const p=aktifParca(), boy=Math.max(60,KUTU.sc*24);
  if(G.kalem) return kalemCiz(G.kalem.x,G.kalem.y,boy,-0.75);
  if(!p) return;
  let hp;
  if(p.mod==='iz'){
    const idle=t-G.sonIlerleme;
    if(idle>5000){ const K=G.kapsam, kalan=[]; for(let i=0;i<K.length;i++) if(!K[i]) kalan.push(i);
      const f=((idle-5000)/1800)%1; hp=p._pts[kalan[Math.floor(f*kalan.length)]||0]; }
    else { let i=0; while(i<G.kapsam.length&&G.kapsam[i]) i++; hp=p._pts[Math.min(i,p._pts.length-1)]; }
  } else hp={x:p._bb.cx,y:p._bb.cy};
  kalemCiz(KUTU.ox+hp.x*KUTU.sc+6, KUTU.oy+hp.y*KUTU.sc-6+Math.sin(t/300)*4, boy, -0.75);
}

/* ---------- Önizleme ---------- */
function onizlemeCiz(canvas,k){
  hazirla(k);
  const d=Math.min(2,window.devicePixelRatio||1), s=canvas.clientWidth||150; canvas.width=s*d; canvas.height=s*d;
  const c=canvas.getContext('2d'); c.setTransform(d*s/100,0,0,d*s/100,0,0);
  const kayit=KAYIT.tamam[k.id];
  const yedek=k.parcalar.map(p=>({t:p._tamam,r:p._renk,a:p._anim,pp:p._pop}));
  k.parcalar.forEach(p=>{ p._tamam=true; p._anim=null; p._pop=0; p._renk = kayit&&p.grup ? (kayit.renkler||{})[p.grup]||null : null; });
  if(!kayit) c.globalAlpha=.3;
  karakterCiz(c,k,0,{statik:true});
  k.parcalar.forEach((p,i)=>{ p._tamam=yedek[i].t; p._renk=yedek[i].r; p._anim=yedek[i].a; p._pop=yedek[i].pp; });
}

function adimAtla(){
  if(G.faz==='ciz'){ if(aktifParca()){ G.kapsam&&G.kapsam.fill(1); parcaBitir(); } }
  else if(G.faz==='boya'){ const gl=grupListe(G.k); gl.forEach(g=>{ if(!G.k.parcalar.find(p=>p.grup===g)._renk) G.k.parcalar.filter(p=>p.grup===g).forEach(p=>p._renk=RENKLER[G.k.renk[g]].hex); }); G.boyaGrupIdx=gl.length; boyaBitti(); }
  else if(G.faz==='duygu'){ G.tur++; if(G.tur<G.turlar.length) duyguTur(); else karakterBitti(); }
  else if(G.faz==='hareket'||G.faz==='say') karakterBitti();
  else if(G.faz==='kodla' && G.kod){ G.kod.cozum = kodCoz(KOD_SEVIYE[G.kod.idx]); G.kod.program=G.kod.cozum.slice(); kodKontrolCiz(); toast('Çözüm yerleştirildi — ▶️ ile çalıştır'); }
}
function resimKaydet(){

  x.fillStyle='#fffaf0'; x.fillRect(0,0,900,900);
  x.setTransform(7.2,0,0,7.2,90,40); karakterCiz(x,k,0,{statik:true, ifade:'mutlu', yuzGizle:true});

const MODULLER = {'Çizim takibi':()=>typeof kapsa,'Boyama':()=>typeof boyaDokun,'Canlanma':()=>typeof canlanBasla,'Duygular':()=>typeof duyguBasla,
  'Satranç hareketi':()=>typeof hareketBasla,'Kodlama':()=>typeof kodCalistir,'Köşe sayma':()=>typeof koseDokun,'Ana Menü':()=>typeof anaMenuAc,'Menü Turu':()=>typeof turBaslat,

function modulKontrol(){ const s=Object.entries(MODULLER).map(([a,f])=>[a,f()==='function']); return {s, ok:s.filter(x=>x[1]).length, top:s.length}; }
function surumDetay(){

}
function acilisBildirimi(){

}
let surumDamga=null;
async function damgaAl(){ try{ const u=location.href.split('#')[0]; const sep=u.includes('?')?'&':'?';
  let r=await fetch(u+sep+'_v='+Date.now(),{method:'HEAD',cache:'no-store'}); if(!r.ok) r=await fetch(u+sep+'_v='+Date.now(),{cache:'no-store'});
  return r.headers.get('etag')||r.headers.get('last-modified'); }catch(e){ return null; } }
async function surumKontrol(elle){
  if(!/^https?:/.test(location.protocol)){ if(elle) toast('Güncelleme denetimi yalnız sitede çalışır'); return; }
  const d=await damgaAl(); if(!d){ if(elle) toast('Denetlenemedi (internet?)'); return; }
  if(!surumDamga){ surumDamga=d; if(elle) toast('✅ En güncel sürüm'); return; }
  if(d!==surumDamga){ $('yeniSurum').style.display='block'; } else if(elle) toast('✅ En güncel sürüm');
}
