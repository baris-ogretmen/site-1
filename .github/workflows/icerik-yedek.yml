name: İçerik yedeği, Claude istekleri, Google sayfaları ve sağlık kontrolü
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['veri/claude-istekleri.json', '**.html', '**.pdf', '**.mp4', '_gelistirme/arac/**', '.github/workflows/icerik-yedek.yml', 'index.html', 'yonetici.html']
  schedule:
    - cron: '17 3 * * *'
    - cron: '27 8 * * *'   # Firestore günlük kotası (Pasifik gece yarısı = 08:00 UTC) sıfırlandıktan hemen sonra: bekleyen istekler işlenir
permissions:
  contents: write
concurrency: { group: icerik, cancel-in-progress: false }
jobs:
  isle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Claude isteklerini uygula
        run: python3 _gelistirme/arac/firestore_uygula.py
      - name: İçerik yedeği
        run: python3 _gelistirme/arac/firestore_yedek.py
      - name: Google sayfaları
        id: google
        run: |
          if ! node _gelistirme/arac/google_paketi.js 2> /tmp/ghata; then echo "GOOGLE_HATA=$(tr '\n' ' ' < /tmp/ghata | cut -c1-300)" >> $GITHUB_ENV; cat /tmp/ghata; fi
      - name: Yüklenen dosyalar listesi
        run: python3 _gelistirme/arac/dosya_listesi.py
      - name: Sağlık kontrolü
        run: python3 _gelistirme/arac/saglik.py
      - name: Kaydet
        run: |
          git config user.name "Barış Öğretmen (otomatik)"
          git config user.email "barisilkan6534@gmail.com"
          git add -A veri sayfa sitemap.xml robots.txt
          git diff --cached --quiet || (git commit -m "Otomatik: içerik yedeği, Google sayfaları, sağlık kontrolü" && git pull --rebase && git push)
