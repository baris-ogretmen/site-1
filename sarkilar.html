<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barış Öğretmen | Şarkılar</title><meta name="description" content="Barış Öğretmen | Şarkılar — Barış Öğretmen&#x27;in tarayıcıda ücretsiz çalışan eğitsel çalışması. baris-ogretmen.github.io/site-1"><meta property="og:title" content="Barış Öğretmen | Şarkılar"><meta property="og:description" content="Barış Öğretmen | Şarkılar — Barış Öğretmen&#x27;in tarayıcıda ücretsiz çalışan eğitsel çalışması. baris-ogretmen.github.io/site-1"><meta property="og:url" content="https://baris-ogretmen.github.io/site-1/sarkilar.html"><meta property="og:type" content="website">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body { margin: 0; font-family: 'Fredoka', sans-serif; background: #2e1065; color: white; padding-bottom: 20px; }
        
        /* MÜZİK ÇALAR HEADER */
        header { 
            background: linear-gradient(180deg, #4c1d95 0%, #2e1065 100%); 
            padding: 40px 20px; text-align: center; border-bottom: 1px solid #5b21b6;
        }
        .back-btn { display: inline-block; background: rgba(255,255,255,0.1); color: white; padding: 8px 15px; border-radius: 20px; text-decoration: none; font-size: 0.9rem; margin-bottom: 20px; backdrop-filter: blur(5px); }
        
        .album-art { 
            width: 150px; height: 150px; background: #db2777; border-radius: 20px; margin: 0 auto 20px; 
            display: flex; align-items: center; justify-content: center; font-size: 4rem; 
            box-shadow: 0 10px 30px rgba(219, 39, 119, 0.4); animation: pulse 3s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        
        h1 { margin: 0; font-size: 1.8rem; }
        .artist { color: #d8b4fe; margin-top: 5px; font-size: 1rem; }

        .container { max-width: 600px; margin: 0 auto; padding: 20px; }

        /* ŞARKI LİSTESİ */
        .track-list { list-style: none; padding: 0; margin-top: 20px; }
        .track-item { 
            display: flex; align-items: center; padding: 15px; border-radius: 15px; 
            margin-bottom: 10px; background: rgba(255,255,255,0.05); transition: 0.3s; cursor: pointer;
        }
        .track-item:hover { background: rgba(255,255,255,0.1); }
        
        .track-num { color: #a78bfa; margin-right: 15px; font-weight: bold; width: 20px; }
        .track-info { flex: 1; }
        .track-title { display: block; font-weight: bold; font-size: 1.1rem; }
        .track-meta { font-size: 0.8rem; color: #a78bfa; }
        
        .play-icon { 
            width: 40px; height: 40px; border-radius: 50%; background: #db2777; color: white; 
            display: flex; align-items: center; justify-content: center; font-size: 1rem;
        }

        /* PLAYER KONTROL (Görsel) */
        .player-bar { 
            position: fixed; bottom: 0; left: 0; width: 100%; background: #1e1b4b; 
            padding: 15px; border-top: 1px solid #4c1d95; display: flex; align-items: center; 
            justify-content: space-between; box-sizing: border-box; z-index: 100;
        }
        .now-playing { font-size: 0.9rem; font-weight: bold; }
        .progress { flex: 1; height: 4px; background: #4c1d95; margin: 0 15px; border-radius: 2px; position: relative; }
        .progress-bar { width: 30%; height: 100%; background: #db2777; border-radius: 2px; }

    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Ana Sayfa</a>
        <div class="album-art">🎵</div>
        <h1>Eğitici Şarkılar</h1>
        <div class="artist">Barış Öğretmen</div>
    </header>

    <div class="container">
        
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <span style="font-weight:bold; font-size:1.2rem;">Popüler Parçalar</span>
            <i class="fas fa-random" style="color:#a78bfa;"></i>
        </div>

        <ul class="track-list">
            <li class="track-item" onclick="alert('Çalıyor: Rakamlar Dans Ediyor...')">
                <span class="track-num">1</span>
                <div class="track-info">
                    <span class="track-title">Rakamlar Dans Ediyor</span>
                    <span class="track-meta">Matematik • 2:30</span>
                </div>
                <div class="play-icon"><i class="fas fa-play"></i></div>
            </li>

            <li class="track-item" onclick="alert('Çalıyor: Renkler Şarkısı...')">
                <span class="track-num">2</span>
                <div class="track-info">
                    <span class="track-title">Renkler Şarkısı</span>
                    <span class="track-meta">Kavramlar • 1:45</span>
                </div>
                <div class="play-icon"><i class="fas fa-play"></i></div>
            </li>

            <li class="track-item" onclick="alert('Yakında eklenecek!')">
                <span class="track-num">3</span>
                <div class="track-info">
                    <span class="track-title">Vücudumuz</span>
                    <span class="track-meta">Fen Bilgisi • Yakında</span>
                </div>
                <div class="play-icon"><i class="fas fa-lock"></i></div>
            </li>
        </ul>

    </div>

    <div class="player-bar">
        <div class="now-playing">Rakamlar Dans Ediyor</div>
        <div class="progress"><div class="progress-bar"></div></div>
        <i class="fas fa-pause-circle" style="font-size: 2rem; color: #db2777;"></i>
    </div>

</body>
</html>
