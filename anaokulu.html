    <style>
        body { margin: 0; font-family: 'Comic Neue', cursive; background: #fffbeb; color: #333; padding-bottom: 50px; }
        
        /* HEADER - MEVCUT TASARIM KORUNDU */
        header { 
            background: #f59e0b; padding: 20px; text-align: center; color: white; 
            border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; 
            box-shadow: 0 5px 15px rgba(245, 158, 11, 0.4); position: relative; 
        }
        header::after { content: '🎈'; font-size: 3rem; position: absolute; right: 20px; top: 20px; opacity: 0.5; transform: rotate(15deg); }
        header::before { content: '🧸'; font-size: 3rem; position: absolute; left: 20px; top: 20px; opacity: 0.5; transform: rotate(-15deg); }
        
        .back-btn { display: inline-block; background: white; color: #f59e0b; padding: 8px 15px; border-radius: 20px; text-decoration: none; font-weight: bold; margin-bottom: 10px; box-shadow: 0 3px 0 rgba(0,0,0,0.1); transition: 0.2s; }
        .back-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 0 rgba(0,0,0,0.1); }
        h1 { margin: 0; font-size: 2.2rem; text-shadow: 2px 2px 0px rgba(0,0,0,0.1); letter-spacing: 1px; }

        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }

        /* KATEGORİ BAŞLIKLARI */
        .section-title { text-align: center; margin: 40px 0 20px; }
        .section-title span { background: #10b981; color: white; padding: 10px 25px; border-radius: 50px; font-size: 1.3rem; font-weight: bold; box-shadow: 4px 4px 0 rgba(0,0,0,0.2); display: inline-block; transform: rotate(-2deg); }
        
        /* GRID */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 20px; }
        
        /* KART TASARIMI */
        .kid-card { 
            background: white; border-radius: 20px; padding: 20px; text-align: center; 
            border: 3px solid #fbbf24; box-shadow: 0 5px 0 #f59e0b; transition: 0.3s; 
            text-decoration: none; color: inherit; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; min-height: 160px; position: relative; overflow: hidden; 
        }
        .kid-card:hover { transform: translateY(-5px) rotate(2deg); background: #fffdf0; }
        
        .icon-area { font-size: 3.5rem; margin-bottom: 10px; transition: 0.3s; }
        .kid-card:hover .icon-area { transform: scale(1.2); }
        
        .card-title { font-weight: bold; font-size: 1.2rem; color: #d97706; line-height: 1.2; }
        .card-desc { font-size: 0.85rem; color: #78716c; margin-top: 5px; }
        
        /* MÜZİK PLAYER */
        .audio-player { background: #ec4899; color: white; padding: 15px 20px; border-radius: 20px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 5px 0 #be185d; transition: 0.2s; cursor: pointer; }
        .audio-player:hover { transform: scale(1.02); }
        .audio-player i { text-shadow: 2px 2px 0 rgba(0,0,0,0.1); }
        
        /* YÜKLENİYOR */
        .loading-area { text-align:center; color:#888; font-size:1.2rem; margin:20px; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Ana Sayfaya Dön</a>
        <h1>Minikler Dünyası</h1>
        <p style="margin:5px 0 0; font-size:1.1rem;">Oyna, Eğlen, Öğren!</p>
    </header>

    <div class="container">

        <div class="section-title"><span style="background:#3b82f6; box-shadow: 4px 4px 0 #1e3a8a;">🎮 Eğitici Oyunlar</span></div>
        <div id="oyun-listesi" class="grid">
            <div class="loading-area"><i class="fas fa-spinner fa-spin"></i> Yükleniyor...</div>
        </div>

        <div class="section-title"><span style="background:#ec4899; box-shadow: 4px 4px 0 #be185d;">🎵 Şarkılarla Öğren</span></div>
        
        <div class="audio-player">
            <div style="display:flex; align-items:center; gap:15px;">
                <i class="fas fa-music" style="font-size:1.5rem;"></i> 
                <strong>Rakamlar Dans Ediyor</strong>
            </div>
            <i class="fas fa-play-circle" style="font-size: 2.2rem;"></i>
        </div>
        <div class="audio-player" style="background:#8b5cf6; box-shadow: 0 5px 0 #6d28d9;">
            <div style="display:flex; align-items:center; gap:15px;">
                <i class="fas fa-music" style="font-size:1.5rem;"></i> 
                <strong>Renkler Şarkısı</strong>
            </div>
            <i class="fas fa-play-circle" style="font-size: 2.2rem;"></i>
        </div>

        <div class="section-title"><span style="background:#10b981; box-shadow: 4px 4px 0 #047857;">📝 Çizgi & Kavramlar</span></div>
        <div class="grid">
            <div class="kid-card" onclick="alert('İndirme linki yakında!')" style="border-color:#10b981; box-shadow:0 5px 0 #047857;">
                <div class="icon-area">✏️</div>
                <div class="card-title" style="color:#047857;">Çizgi Çalışması</div>
                <small style="color:#047857; font-weight:bold; margin-top:5px;">PDF İndir 📥</small>
            </div>
            <div class="kid-card" onclick="alert('İndirme linki yakında!')" style="border-color:#10b981; box-shadow:0 5px 0 #047857;">
                <div class="icon-area">1️⃣</div>
                <div class="card-title" style="color:#047857;">Rakamları Yazıyorum</div>
                <small style="color:#047857; font-weight:bold; margin-top:5px;">PDF İndir 📥</small>
            </div>
        </div>

    </div>

    <script>
        const db = firebase.firestore();
        const oyunListesi = document.getElementById("oyun-listesi");

        // Renk Paleti (Döngüsel kullanım için)
        const renkler = [
            { border: '#60a5fa', shadow: '#2563eb', icon: '🧠' }, // Mavi
            { border: '#f87171', shadow: '#dc2626', icon: '🎨' }, // Kırmızı
            { border: '#a78bfa', shadow: '#7c3aed', icon: '🧩' }, // Mor
            { border: '#34d399', shadow: '#059669', icon: '🐢' }, // Yeşil
            { border: '#fbbf24', shadow: '#d97706', icon: '⭐' }  // Sarı
        ];

        // VERİTABANINDAN ÇEK
        db.collection("projeler").orderBy("tarih", "desc").onSnapshot((snapshot) => {
            oyunListesi.innerHTML = ""; // Temizle
            
            // Önce Beyazıt'ın hafıza oyununu (sabit kart) ekleyelim
            oyunListesi.innerHTML += `
            <a href="beyazit.html" class="kid-card" style="border-color:#60a5fa; box-shadow:0 5px 0 #2563eb;">
                <div class="icon-area">🧠</div>
                <div class="card-title" style="color:#2563eb;">Hafıza Oyunu</div>
                <div class="card-desc">Eşini bul, kazan!</div>
            </a>`;

            let i = 1; // Renk sayacı (0. renk maviyi kullandık)

            snapshot.forEach((doc) => {
                const veri = doc.data();
                const k = (veri.kategori || "").toLowerCase();

                // Filtre: Anaokulu veya Okul Öncesi
                if (k.includes("anaokulu") || k.includes("okul öncesi") || k.includes("minik")) {
                    
                    // Beyazıt oyununu tekrar ekleme (zaten yukarıda ekledik)
                    if(veri.link === "beyazit.html") return;

                    // Renk seç
                    const stil = renkler[i % renkler.length];
                    i++;

                    // İkon belirle (Panelden geleni kullan yoksa varsayılan)
                    let ikonEmoji = stil.icon;
                    if(veri.baslik.toLowerCase().includes("boyama")) ikonEmoji = "🎨";
                    else if(veri.baslik.toLowerCase().includes("müzik")) ikonEmoji = "🎵";
                    else if(veri.baslik.toLowerCase().includes("sayı")) ikonEmoji = "🔢";

                    const html = `
                    <a href="${veri.link}" class="kid-card" style="border-color:${stil.border}; box-shadow:0 5px 0 ${stil.shadow};">
                        <div class="icon-area">${ikonEmoji}</div>
                        <div class="card-title" style="color:${stil.shadow};">${veri.baslik}</div>
                        <div class="card-desc">${veri.aciklama || 'Yeni etkinlik!'}</div>
                    </a>`;
                    
                    oyunListesi.innerHTML += html;
                }
            });
        });
    </script>
