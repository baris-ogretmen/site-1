const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
function makeQ(text,answer,others,explain,subject='Matematik',visual='',speak=''){
 answer=String(answer);return {text,answer,options:shuffle([answer,...[...new Set(others.map(String))].filter(x=>x!==answer).slice(0,2)]),explain,subject,visual,speak};
}
function numeric(text,a,explain,visual='',speak=''){return makeQ(text,a,shuffle([a+1,a+2,Math.max(0,a-1),Math.max(0,a-2),a+3]),explain,'Matematik',visual,speak)}

Object.assign(actions,{flip:b=>flip(+b.dataset.value)});
const simonSymbols=['🌞','🌊','🌿','🌸'],simonColors=['#785a30','#284e79','#2f644f','#74436c'],simonTones=[330,440,550,660];
function simonStart(){game={seq:[],input:0,round:0,lit:-1,showing:false,ready:false,target:grade===0||saved.support?3:grade<4?4:5,initial:grade===0?1:grade<4?2:3};main.innerHTML=top(titles.simon,'İzle, hatırla, aynı sırayla dokun')+'<div class="row spaced" style="margin-top:15px"><span class="tag" id="bg-simonRound">Hazır mısın?</span>'+button('simonRead','🔊 Yönerge')+'</div><div class="simonGrid">'+simonSymbols.map((s,i)=>button('simonTap',s,'simonKey','data-value="'+i+'" style="background:'+simonColors[i]+'" aria-label="'+['Güneş','Dalga','Yaprak','Çiçek'][i]+'"')).join('')+'</div><div id="bg-simonFeedback" role="status" aria-live="polite"><p>Parlayan şekilleri sırayla izle.</p></div><div class="row">'+button('simonBegin','▶ Başla','hot')+button('simonReplay','Sırayı tekrar göster')+'</div><div id="bg-end"></div>'}
function light(i){game.lit=i;root.querySelectorAll('[data-action=simonTap]').forEach((b,j)=>b.classList.toggle('lit',i===j));if(i>=0)tone(simonTones[i])}
function showSequence(){if(game.showing||game.finished||!game.seq.length)return;game.ready=false;game.showing=true;game.input=0;root.querySelector('#bg-simonFeedback').innerHTML='<p>👀 Sırayı izle…</p>';let idx=0,speed=grade===0?.9:.65;function next(){if(idx>=game.seq.length){game.showing=false;game.ready=true;root.querySelector('#bg-simonFeedback').innerHTML='<p>Senin sıran! Aynı sırayla dokun.</p>';return}light(game.seq[idx++]);later(()=>{light(-1);later(next,.22)},speed)}later(next,.4)}
function simonBegin(){if(game.showing||game.finished)return;if(!game.seq.length){for(let i=0;i<game.initial;i++)game.seq.push(rand(0,3));game.round=1}root.querySelector('#bg-simonRound').textContent='Tur '+game.round+' / '+game.target+' · '+game.seq.length+' şekil';root.querySelector('[data-action=simonBegin]').disabled=true;showSequence()}
function simonTap(i){if(!game.ready||game.showing||game.finished)return;light(i);later(()=>light(-1),.2);if(i!==game.seq[game.input]){game.ready=false;root.querySelector('#bg-simonFeedback').innerHTML='<p>Baştan birlikte izleyelim; puanın azalmadı.</p>';tone(220);later(showSequence,1);return}game.input++;if(game.input===game.seq.length){game.ready=false;award(12,1);if(game.round===game.target){result('Ritmi yakaladın!',game.seq.length+' şekillik diziyi doğru sırayla hatırladın.','Ritim Ustası');return}root.querySelector('#bg-simonFeedback').innerHTML='<p>🎉 Sıra doğru! Şimdi bir şekil daha ekleniyor.</p>';game.round++;game.seq.push(rand(0,3));later(()=>{root.querySelector('#bg-simonRound').textContent='Tur '+game.round+' / '+game.target+' · '+game.seq.length+' şekil';showSequence()},1.3)}}
Object.assign(actions,{simonBegin,simonReplay:()=>{if(!game.seq.length)simonBegin();else showSequence()},simonTap:b=>simonTap(+b.dataset.value),simonRead:()=>say('Parlayan şekilleri izle. Sonra aynı şekillere, aynı sırayla dokun.')});
function arenaStart(){game={round:0,scores:[0,0],team:0};main.innerHTML=top(titles.arena,'Aynı ekranda sırayla oynayın')+'<p>İki takım, altı soru. Her takımın üç sırası var. İlk denemede doğru yanıt takımına bir yıldız kazandırır.</p><div class="teams"><div class="team" id="bg-team0">🚀 Roket Takımı<strong>0</strong></div><div class="team" id="bg-team1">🌟 Yıldız Takımı<strong>0</strong></div></div><div id="bg-question"></div><div id="bg-end"></div>';arenaQuestion()}
function arenaQuestion(){for(let i=0;i<2;i++){let el=root.querySelector('#bg-team'+i);el.classList.toggle('turn',game.team===i);el.querySelector('strong').textContent=game.scores[i]}ask(nextQuestion(),first=>{if(first)game.scores[game.team]++;game.round++;for(let i=0;i<2;i++)root.querySelector('#bg-team'+i+' strong').textContent=game.scores[i];if(game.round>=6){let [a,b]=game.scores;result(a===b?'Birlikte kazandınız!':a>b?'Roket Takımı önde!':'Yıldız Takımı önde!','Roket '+a+' — '+b+' Yıldız. Her iki takım da altı yeni öğrenme fırsatını paylaştı.','Takım Ruhu')}else{game.team=1-game.team;arenaQuestion()}})}
function animate(now){let dt=Math.min(.04,(now-last)/1000||.016);last=now;if(!paused&&!document.hidden){clock+=dt;if(!saved.calm)t+=dt;let due=jobs.filter(j=>j.at<=clock),rest=jobs.filter(j=>j.at>clock);jobs=rest;due.forEach(j=>{if(j.session===session)j.fn()});if(ctx&&canvas?.isConnected){if(mode==='island')drawIsland();if(mode==='race')drawRace(dt)}}requestAnimationFrame(animate)}
window.addEventListener('resize',()=>{fitCanvas();if(mode==='home')drawHero()});if(typeof ResizeObserver!=='undefined')new ResizeObserver(()=>{fitCanvas();if(mode==='home')drawHero()}).observe(root);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&['island','race','robot','memory','simon','arena'].includes(mode)&&!paused)pause()});
root.addEventListener('keydown',e=>{if(e.key==='Escape'){pause();return}if(paused)return;if(mode==='robot'&&['ArrowUp','ArrowDown','ArrowRight','ArrowLeft'].includes(e.key)){e.preventDefault();actions.command({dataset:{value:{ArrowUp:'U',ArrowDown:'D',ArrowRight:'R',ArrowLeft:'L'}[e.key]}})}if(qstate&&['1','2','3'].includes(e.key)){e.preventDefault();let i=+e.key-1;if(i<qstate.q.options.length)answer(i)}});
home();requestAnimationFrame(animate);
})();
</script>
</body></html>
