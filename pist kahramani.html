<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--z:1;--bg:#0b1530;--kart:#14214a;--kart2:#1c2d63;--yazi:#f4f7ff;--soluk:#a9b6dd;--ana:#ff6b2c;--ana2:#ffb703;--yesil:#2ee59d;--kirmizi:#ff4d6d;--mavi:#3ab0ff;--egt-z:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--yazi);font-family:'Nunito',system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#sahne{position:fixed;inset:0;display:block;width:100%;height:100%}
.ui{zoom:var(--z)}
button{font-family:inherit;cursor:pointer}
.gizli{display:none!important}
h1,h2,h3{font-family:'Baloo 2',cursive;margin:0}

/* ---------- MENÜ ---------- */
#menu{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;overflow:auto;
 background:radial-gradient(1200px 600px at 20% -10%,#2b4bb3 0%,transparent 60%),radial-gradient(900px 500px at 110% 10%,#a3207a 0%,transparent 55%),linear-gradient(180deg,#0b1530,#060b1d)}
#menu .ust{padding:calc(18px + env(safe-area-inset-top)) 22px 6px;text-align:center}
.logo{display:inline-flex;align-items:center;gap:14px}
.logo .rozet{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#ff6b2c,#ffb703);display:grid;place-items:center;font-size:36px;box-shadow:0 10px 30px #ff6b2c55;animation:salla 3s ease-in-out infinite}
@keyframes salla{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.logo h1{font-size:44px;line-height:1;background:linear-gradient(90deg,#fff,#ffd27a);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;color:var(--soluk);font-weight:800;letter-spacing:.5px}
.selam{margin-top:6px;color:#ffd27a;font-weight:800}
#menu .orta{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding:12px 18px 18px;max-width:1300px;width:100%;margin:0 auto}
.grup h3{font-size:18px;color:#ffd27a;margin:0 0 6px 4px;display:flex;gap:8px;align-items:center}
.secimler{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.secim{background:linear-gradient(180deg,var(--kart2),var(--kart));border:3px solid transparent;border-radius:20px;padding:12px 10px;text-align:center;color:var(--yazi);transition:.15s;position:relative;min-height:96px}
.secim:active{transform:scale(.97)}
.secim .ik{font-size:40px;line-height:1.1}
.secim b{display:block;font-size:17px;font-family:'Baloo 2';margin-top:2px}
.secim span{display:block;font-size:12.5px;color:var(--soluk);margin-top:2px}
.secim.sec{border-color:var(--ana2);box-shadow:0 0 0 4px #ffb70333,0 12px 30px #0006;background:linear-gradient(180deg,#2c3f86,#1b2b66)}
.secim.sec::after{content:'✓';position:absolute;top:6px;right:10px;background:var(--ana2);color:#222;border-radius:50%;width:24px;height:24px;font-weight:900;display:grid;place-items:center;font-size:14px}
.basla-sat{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}
#baslaBtn{flex:1;min-width:240px;font-size:30px;font-family:'Baloo 2';font-weight:800;border:0;border-radius:24px;padding:16px;color:#1a1300;background:linear-gradient(90deg,#ffb703,#ff6b2c);box-shadow:0 10px 0 #a23d0b,0 18px 40px #ff6b2c66;transition:.1s}
#baslaBtn:active{transform:translateY(6px);box-shadow:0 4px 0 #a23d0b}
.kucukler{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;opacity:.6}
.kucukler button{background:#ffffff14;border:1px solid #ffffff22;color:#dfe6ff;border-radius:14px;padding:8px 12px;font-weight:800;font-size:14px}
.kucukler button:hover{opacity:1;background:#ffffff26}
.sinifEtiket{font-size:13px;color:var(--soluk);text-align:center}
#surumRozet{position:fixed;left:10px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:60;background:#ffffff14;border:1px solid #ffffff25;border-radius:12px;padding:4px 10px;font-size:12px;font-weight:800;color:#bfe9d4;cursor:pointer}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:20;pointer-events:none}
#hud .kutu{background:#0b1530cc;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid #ffffff22;border-radius:18px}
#hiz{position:absolute;left:14px;top:calc(12px + env(safe-area-inset-top));padding:8px 16px;min-width:150px;text-align:center}
#hiz .s{font-family:'Baloo 2';font-size:52px;font-weight:800;line-height:1}
#hiz .b{font-size:13px;color:var(--soluk);font-weight:800}
#hiz .lim{margin-top:4px;font-size:13px;font-weight:900;color:#ffd27a}
#skor{position:absolute;right:14px;top:calc(12px + env(safe-area-inset-top));padding:8px 14px;text-align:right;min-width:170px}
#skor .p{font-family:'Baloo 2';font-size:30px;font-weight:800;line-height:1.1}
#skor .r{font-size:15px;font-weight:800;color:#ffe08a}
#ilerleme{position:absolute;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top));width:min(44vw,520px);height:14px;border-radius:9px;background:#ffffff22;overflow:hidden;border:1px solid #ffffff30}
#ilerleme i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2ee59d,#3ab0ff)}
#ilerleme b{position:absolute;inset:0;font-size:10px;text-align:center;line-height:13px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000}
#soru{position:absolute;left:50%;transform:translateX(-50%);top:calc(36px + env(safe-area-inset-top));width:min(94vw,860px);padding:12px 16px;text-align:center;border:2px solid #ffd27a!important;animation:gel .35s}
@keyframes gel{from{transform:translate(-50%,-20px);opacity:0}}
#soru .q{font-family:'Baloo 2';font-size:26px;font-weight:800;line-height:1.15}
#soru .sec2{display:flex;gap:12px;margin-top:8px}
#soru .sec2 div{flex:1;padding:8px;border-radius:14px;font-weight:900;font-size:19px}
#soru .A{background:#3ab0ff33;border:2px solid #3ab0ff}

 g.add(serit(s0,s1,-YARIM,YARIM,.03,MAT.yol));
 if(S.harita==='sehir'){g.add(serit(s0,s1,-YARIM-4,-YARIM,.12,MAT.kaldirim));g.add(serit(s0,s1,YARIM,YARIM+4,.12,MAT.kaldirim))}
 else{g.add(serit(s0,s1,-YARIM-1.4,-YARIM,.02,MAT.banket));g.add(serit(s0,s1,YARIM,YARIM+1.4,.02,MAT.banket));
  g.add(serit(s0,s1,-YARIM-1.5,.9,0,MAT.korkuluk,true));if(S.harita!=='sahil')g.add(serit(s0,s1,YARIM+1.5,.9,0,MAT.korkuluk,true))}
 if(S.harita==='sahil'){g.add(serit(s0,s1,YARIM+1.4,YARIM+9,.01,MAT.kum));g.add(serit(s0,s1,YARIM+9,YARIM+420,.0,MAT.deniz))}
 const koy=(o,s,yan)=>{o.position.x=cx(s)+yan;o.position.z=-s;o.rotation.y=r()*6;g.add(o)};
 const say=S.harita==='sehir'?4:7;
 for(let i=0;i<say;i++){
  const s=s0+r()*CH,sol=r()<.5,uz=(S.harita==='sehir'?14+r()*10:9+r()*55)*(sol?-1:1);
  if(S.harita==='sahil'&&!sol){if(r()<.5){const p=palmiye(r);koy(p,s,YARIM+3+r()*4)}continue}
  let o;
  if(S.harita==='vadi')o=r()<.15?ev(r):agac(r);
  else if(S.harita==='sehir'){o=bina(r);o.position.x=cx(s)+uz;o.position.z=-s;g.add(o);continue}
  else if(S.harita==='sahil')o=r()<.6?palmiye(r):ev(r);
  else o=agac(r,true);
  koy(o,s,uz);
 }
 if(S.harita==='sehir'&&k%1===0){[-1,1].forEach(yn=>{const l=lamba();l.position.set(cx(s0+10)+yn*(YARIM+2),0,-(s0+10));l.rotation.y=yn>0?0:Math.PI;g.add(l)})}
 SC.add(g);PARCALAR.set(k,g);
}
function parcaSil(k){const g=PARCALAR.get(k);if(!g)return;SC.remove(g);g.traverse(o=>{if(o.geometry&&!Object.values(GEO).includes(o.geometry))o.geometry.dispose()});PARCALAR.delete(k)}
function parcalariGuncelle(s){
 const a=Math.floor((s-40)/CH),b=Math.floor((s+UZAK)/CH);
 for(let k=Math.max(0,a);k<=b;k++)if(!PARCALAR.has(k))parcaKur(k);
 for(const k of [...PARCALAR.keys()])if(k<a||k>b)parcaSil(k);
}

  const vz=kutu(MAT.cam,.34,.14,.1,0,2.08,-.18);ic.add(vz);

  g.userData={tekerler,onTeker,yatik:ic};return g;
 }

  g.userData={tekerler,onTeker};return g;
 }
 const spor=tip==='spor',boy=spor?4.4:4.2,yuk=spor?.55:.7;
 g.add(kutu(govde,2,yuk,boy,0,.45+yuk/2,0));
 g.add(kutu(MAT.cam,1.7,spor?.45:.6,spor?1.7:2,0,.45+yuk+(spor?.22:.3),spor?.3:.25));
 g.add(kutu(govde,1.72,.08,spor?1.5:1.8,0,.45+yuk+(spor?.47:.62),spor?.35:.25));
 if(spor){g.add(kutu(MAT.siyah,1.9,.08,.4,0,1.3,1.95));g.add(kutu(MAT.siyah,.1,.35,.1,-.7,1.1,1.95));g.add(kutu(MAT.siyah,.1,.35,.1,.7,1.1,1.95));g.add(kutu(MAT.beyaz,.3,.02,boy*.98,0,.46+yuk,0))}
 [-.65,.65].forEach(x=>{g.add(kutu(MAT.far,.4,.18,.08,x,.75,-boy/2-.01));g.add(kutu(MAT.stop,.45,.16,.08,x,.75,boy/2+.01))});

}

function fizik(dt){
 const p=G.p;
 girisTopla(dt);
 let gaz=GIRIS.gaz,fren=GIRIS.fren;
 if(G.kamGorulmedi>1.2){gaz=0;fren=Math.max(fren,.4)}
 // hız
 const yolMerkez=cx(p.s),sapma=p.x-yolMerkez,disari=Math.abs(sapma)-YARIM;
 let max=p.max;if(disari>0)max*=.45;
 const ivme=gaz*p.ivme*(1-p.v/max*.85);
 p.v+=ivme*dt-fren*p.ivme*2.4*dt-(.04*p.v+(disari>0?.6*p.v:0))*dt;
 if(p.v>max)p.v=lerp(p.v,max,dt*2);
 p.v=Math.max(0,p.v);
 // direksiyon
 p.dir=lerp(p.dir,GIRIS.dir,clamp(dt*8,0,1));
 const ra=yolAci(p.s),hizF=clamp(p.v/6,0,1);
 p.h+=p.dir*1.25*hizF*dt*(1-.35*clamp(p.v/p.max,0,1));
 // sürüş yardımı (seviyeye göre): aracı yolun yönüne hizalar
 p.h=lerp(p.h,ra,clamp(SV.yardim*dt*2.2*(1-Math.abs(p.dir)*.6),0,1));
 p.h=clamp(p.h,ra-.9,ra+.9);
 p.s+=Math.cos(p.h)*p.v*dt;p.x+=Math.sin(p.h)*p.v*dt;
 // yol kenarı korkuluk
 const sinir=YARIM+(S.harita==='sehir'?3:1.1);
 if(Math.abs(p.x-cx(p.s))>sinir){p.x=cx(p.s)+Math.sign(p.x-cx(p.s))*sinir;p.h=lerp(p.h,ra,.5);p.v*=.97;if(performance.now()-G.tostSon>2500){G.tostSon=performance.now();uyari('↔️ Yola geri dön!');setTimeout(()=>uyari(''),1500)}}
 if(disari>0&&S.harita!=='sehir'&&performance.now()-G.tostSon>3500&&p.v>4){G.tostSon=performance.now();tost('🌱 Yoldan çıktın, yola dön!','#ffd27a')}
 // trafiğe çarpma (zararsız tampon)
 p.bumpT-=dt;
 for(const t of G.trafik){const dx=(cx(t.s)+t.yan)-p.x,ds=t.s-p.s;if(Math.abs(dx)<1.9&&ds>0&&ds<4.4){p.v=Math.min(p.v,t.v*.6);p.s=t.s-4.4;if(p.bumpT<=0){p.bumpT=2.5;SES.carp();puanEkle(-10,'🚗 Dikkat! Takip mesafesini koru','#ffd27a');konus('Dikkat! Öndeki araçla aranda mesafe bırak.')}}}
 olaylar(dt);
 G.sure+=dt;
}

   }

   if(!o.gecti&&d<0){o.gecti=true;if(o.durum==='kirmizi')ihlal('Kırmızı ışıkta geçtin!','Kırmızı ışıkta geçmek tehlikelidir. Bir dahaki sefere dur.');o.bitti=true}

    else uyari('');

    else{G.yanlis++;tost('❌ Doğrusu: '+o.q.d,'#ffb3c1');SES.yanlis();konus('Doğru cevap: '+o.q.d.replace(/^[^\wÇĞİÖŞÜçğıöşü0-9]+/,'')+'. '+o.q.a,true)}}

function suruklenebilir(el,key,onTap){
 let bas=null;el.addEventListener('pointerdown',e=>{if(e.target.classList.contains('zx'))return;bas={x:e.clientX,y:e.clientY,l:el.offsetLeft,t:el.offsetTop,h:false};el.setPointerCapture(e.pointerId)});
 el.addEventListener('pointermove',e=>{if(!bas)return;const dx=e.clientX-bas.x,dy=e.clientY-bas.y;if(Math.hypot(dx,dy)>4)bas.h=true;if(bas.h){const z=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--z'))||1;const l=clamp(bas.l+dx/z,0,innerWidth/z-el.offsetWidth),t=clamp(bas.t+dy/z,0,innerHeight/z-el.offsetHeight);el.style.left=l+'px';el.style.top=t+'px'}});
 el.addEventListener('pointerup',e=>{if(!bas)return;if(bas.h)LS.set(key+'_pos',{l:el.offsetLeft,t:el.offsetTop});else onTap&&onTap();bas=null});
 const pos=LS.get(key+'_pos',null);if(pos){el.style.left=pos.l+'px';el.style.top=pos.t+'px';el.style.right='auto';el.style.bottom='auto'}
}
function fabKur(){
 const g=$('#fabgrup');g.innerHTML='';window.ZIRVE_kontroller.length=0;
 const tanim=[{id:'ekran',etiket:'Ekran modu',ikon:'📺',bayrak:'zirve_ekran_pill_gizli',sag:14,ust:14,tik:()=>{const m=localStorage.getItem('zirve_ekran_mod')||'oto';const i=EKRAN_MODLAR.findIndex(x=>x[0]===m);const y=EKRAN_MODLAR[(i+1)%EKRAN_MODLAR.length][0];localStorage.setItem('zirve_ekran_mod',y);ekranUygula();kucukTost('📺 '+EKRAN_MODLAR.find(x=>x[0]===y)[1])}},
  {id:'yardim',etiket:'Yardım',ikon:'❓',bayrak:'zirve_karsilama_gizli',sag:94,ust:14,tik:()=>yardimAc()},
  {id:'qr',etiket:'QR ile paylaş',ikon:'📲',bayrak:'zirve_qr_gizli',sag:174,ust:14,tik:()=>ZIRVE_paylasAc()},
  {id:'ayar',etiket:'Ayarlar',ikon:'⚙️',kalici:true,sag:254,ust:14,tik:()=>ayarAc()}];
 tanim.forEach(t=>{
  const b=document.createElement('div');b.className='fab';b.id='fab_'+t.id;b.style.left=t.sag+'px';b.style.top=`calc(${t.ust}px + env(safe-area-inset-top))`;
  b.title=t.etiket;b.innerHTML=`<span class="et">${t.ikon}</span>${t.kalici?'':'<span class="zx" title="Gizle">×</span>'}`;g.appendChild(b);
  const acik=()=>!t.bayrak||localStorage.getItem(t.bayrak)!=='1';
  const goster=()=>{try{localStorage.removeItem(t.bayrak)}catch(e){}b.style.display=''},gizle=()=>{if(t.kalici)return;try{localStorage.setItem(t.bayrak,'1')}catch(e){}b.style.display='none'};
  if(!acik())b.style.display='none';
  const zx=b.querySelector('.zx');if(zx)zx.addEventListener('click',e=>{e.stopPropagation();gizle();kucukTost('⚙️ Ayarlar’dan geri getirebilirsiniz')});
  suruklenebilir(b,'zirve_fab_'+t.id,t.tik);
  if(!t.kalici)ZIRVE_kontroller.push({id:t.id,etiket:t.etiket,ikon:t.ikon,goster,gizle,acikMi:acik});
 });
 ekranUygula();
}
function fabGoster(v){$('#fabgrup').style.display=v?'':'none'}
window.ZIRVE_kontrolleriGeriGetir=()=>{if(ZIRVE_kontroller.length){ZIRVE_kontroller.forEach(c=>c.goster());Object.keys(localStorage).filter(x=>x.startsWith('zirve_fab_')).forEach(x=>localStorage.removeItem(x));fabKur()}else{['zirve_ekran_pill_gizli','zirve_karsilama_gizli','zirve_qr_gizli'].forEach(k=>localStorage.removeItem(k));location.reload()}};
/* Sürüm rozeti + açılış bandı + modül öz-kontrolü */
const MODULLER=['ZGIRIS','kameraBaslat','kontrolHesapla','oyunBaslat','fizik','olaylar','trafikGuncelle','bitir','karsilamaAc','ZIRVE_paylasAc','ekranUygula','fabKur','surumKontrol','initPWA'];
function modulDurum(){return MODULLER.map(m=>{let ok=false;try{ok=typeof eval(m)!=='undefined'}catch(e){}return{m,ok}})}
function surumRozetiKur(){
 const md=modulDurum(),okS=md.filter(x=>x.ok).length;$('#surumRozet').textContent=`v${APP.surum} ${okS===md.length?'✓':'⚠'}`;
 const onc=localStorage.getItem('pist_surum');const b=document.createElement('div');b.id='acilisBant';
 b.innerHTML=(onc&&onc!==APP.surum?`🆕 v${onc}→v${APP.surum} · Kod: ${APP.onceki.satir}→${APP.satir} satır`:`✅ v${APP.surum} · en güncel sürüm`)+` · 🧪 ${okS}/${md.length} modül sağlam <span style="cursor:pointer;opacity:.7" onclick="this.parentNode.remove()">✕</span>`;
 document.body.appendChild(b);setTimeout(()=>{b.style.opacity=0;setTimeout(()=>b.remove(),600)},4500);
 try{localStorage.setItem('pist_surum',APP.surum)}catch(e){}
}
function surumDetay(){
 const md=modulDurum();
 modal(`<h2>📦 Sürüm v${APP.surum}</h2><p>${APP.tarih}</p><table class="tablo"><tr><td>📄</td><td>Önceki: v${APP.onceki.surum} · ${APP.onceki.satir} satır · ${APP.onceki.kb} KB<br>Şimdiki: <b>${APP.satir} satır · ${APP.kb} KB</b> (fark +${APP.satir-APP.onceki.satir})</td></tr></table>
 <h3 style="margin-top:12px">✨ Yenilikler</h3><ul>${APP.yenilikler.map(y=>`<li>${y}</li>`).join('')}</ul>
 <h3>🧪 Modüller</h3><p>${md.map(x=>`${x.ok?'✅':'❌'} ${x.m}`).join(' · ')}</p>
 <p>💾 Veri: ${ZGIRIS.ogrenci?'✅ öğrenci girişi':'⬜ giriş yok'} · ${Object.keys(LS.get('pist_rekor',{})).length} rekor kaydı</p>`);
}
/* Otomatik güncelleme uyarısı */
let SURUM_DAMGA=null;
async function surumDamga(){try{const u=location.href.split('#')[0].split('?')[0]+'?_v='+Date.now();let r=await fetch(u,{method:'HEAD',cache:'no-store'});if(!r.ok)r=await fetch(u,{cache:'no-store'});return r.headers.get('etag')||r.headers.get('last-modified')}catch(e){return null}}
async function surumBaslat(){if(!/^https?:/.test(location.protocol))return;SURUM_DAMGA=await surumDamga();setInterval(surumKontrol,120000);addEventListener('focus',()=>surumKontrol());document.addEventListener('visibilitychange',()=>{if(!document.hidden)surumKontrol()})}
let surumSon=0;
async function surumKontrol(elle){
 if(!/^https?:/.test(location.protocol)){if(elle)kucukTost('Güncelleme denetimi yalnızca yayındaki sitede çalışır');return}
 if(!elle&&Date.now()-surumSon<15000)return;surumSon=Date.now();
 const d=await surumDamga();if(d&&SURUM_DAMGA&&d!==SURUM_DAMGA){if(!$('#yeniSurum')){const b=document.createElement('button');b.id='yeniSurum';b.innerHTML='🔴 Yeni sürüm yayınlandı · Yenile <span id="ysx" style="opacity:.8">✕</span>';b.onclick=e=>{if(e.target.id==='ysx'){b.remove();return}location.href=location.href.split('#')[0].split('?')[0]+'?_r='+Date.now()};document.body.appendChild(b)}}
 else if(elle)kucukTost('✅ En güncel sürümü kullanıyorsunuz');
}
