<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;height:100%;overflow:hidden;background:#fff3e0;font-family:'Nunito','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;font-weight:800;font-variant-numeric:lining-nums tabular-nums;color:#4a2c1a;user-select:none;-webkit-user-select:none}
html{font-size:calc(16px * var(--ui,1))}
button{font:inherit;color:inherit;cursor:pointer;border:0}
#app{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding-top:env(safe-area-inset-top)}
#top{flex:none;display:flex;align-items:center;gap:.6rem;padding:.35rem .8rem;background:linear-gradient(#ffb877,#ff8a5c);color:#fff;min-height:2.6rem}
#top .ttl{font-size:1.2rem;letter-spacing:.3px;text-shadow:0 2px 0 rgba(0,0,0,.15)}
#top .sp{flex:1}
#top .chip{background:rgba(255,255,255,.28);border-radius:2rem;padding:.2rem .7rem;font-size:1rem}
body.cocuk-boyu #top,body.cocuk-alcak #top{flex:1;align-items:flex-start;padding-top:.8rem;background:linear-gradient(#8fd3ff,#ffe9c2 70%,#ffb877)}
body.cocuk-boyu #top .ttl,body.cocuk-alcak #top .ttl{font-size:1.6rem}
#stageWrap{position:relative;flex:1;min-height:0}
body.cocuk-boyu #stageWrap{flex:none;height:54vh}
body.cocuk-alcak #stageWrap{flex:none;height:42vh}
#stage{position:absolute;inset:0;overflow:hidden;touch-action:none}
#bg{position:absolute;inset:0}
#bg svg{position:absolute;inset:0;width:100%;height:100%}
#dim{position:absolute;inset:0;background:rgba(15,20,70,.5);opacity:0;pointer-events:none;transition:opacity .4s;z-index:5}
#dim.on{opacity:1}
.obj{position:absolute;transform:translate(-50%,-50%);cursor:grab;touch-action:none;line-height:1;text-align:center;filter:drop-shadow(0 .25rem .2rem rgba(0,0,0,.28))}
.obj.drag{cursor:grabbing;filter:drop-shadow(0 .8rem .5rem rgba(0,0,0,.35))}
.item{font-size:calc(var(--u,6px)*9)}
.char{width:calc(var(--u,6px)*15)}
.char svg{display:block;width:100%;height:auto}
.char .nm{position:absolute;left:50%;bottom:-1.1rem;transform:translateX(-50%);font-size:.8rem;background:rgba(255,255,255,.85);border-radius:1rem;padding:0 .5rem;white-space:nowrap;color:#4a2c1a}
.bob{animation:bob .6s ease}
@keyframes bob{0%{transform:translate(-50%,-50%) scale(1,1)}30%{transform:translate(-50%,-62%) scale(.92,1.1)}60%{transform:translate(-50%,-48%) scale(1.1,.9)}100%{transform:translate(-50%,-50%) scale(1,1)}}
.bub{position:absolute;left:50%;top:-1.6rem;transform:translateX(-50%);font-size:1.9rem;animation:up 1.7s ease forwards;pointer-events:none;z-index:50}
@keyframes up{0%{opacity:0;transform:translate(-50%,10px) scale(.5)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-26px)}}
.part{position:absolute;pointer-events:none;z-index:60;font-size:1.6rem;animation:part 1.2s ease-out forwards}
@keyframes part{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2)}}
.pop{animation:pop .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0)}100%{transform:translate(-50%,-50%) scale(1)}}
#tray{flex:none;display:flex;align-items:center;gap:.4rem;padding:.4rem .5rem;background:#fff;border-top:.2rem solid #ffd6b0;overflow-x:auto;scrollbar-width:none}
#tray.del{background:#ffd5d5}
#tray::-webkit-scrollbar{display:none}
.tb{flex:none;min-width:3.4rem;height:3.4rem;border-radius:1rem;background:#fff3e0;font-size:1.9rem;box-shadow:0 .2rem 0 #f0c9a0;display:flex;align-items:center;justify-content:center;padding:0 .5rem}
.tb:active{transform:translateY(.15rem);box-shadow:none}
.tb.big{font-size:1rem;gap:.3rem;background:#c9f2d0;box-shadow:0 .2rem 0 #8fcf9c}
.tb.pink{background:#ffd9e8;box-shadow:0 .2rem 0 #f0a9c8;font-size:1rem}
#rooms{overflow-x:auto;flex:none;display:flex;gap:.3rem;padding:.4rem .5rem calc(.4rem + env(safe-area-inset-bottom));background:#ff8a5c}
.rtab{flex:1;min-height:3.6rem;border-radius:1.1rem;background:#ffd9b8;font-size:.82rem;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;box-shadow:0 .2rem 0 #d9733f}
.rtab b{font-size:1.5rem;font-weight:800}
.rtab.on{background:#fff;transform:translateY(-.2rem)}
.rtab.hl{outline:.25rem dashed #fff}
.rtab.mis{flex:none;min-width:4.6rem;background:#ffe15c;box-shadow:0 .2rem 0 #d9a500;animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.rtab.menu{flex:none;min-width:3.4rem;background:#fff}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:9400;display:none;align-items:flex-end;justify-content:center;top:0;background:rgba(40,20,0,.4)}
.sheet.on{display:flex}
.card{width:min(46rem,100%);max-height:50vh;overflow:auto;background:#fff;border-radius:1.6rem 1.6rem 0 0;padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom));box-shadow:0 -.4rem 2rem rgba(0,0,0,.3)}
.card h2{margin:.1rem 0 .6rem;font-size:1.3rem}
.row{display:flex;flex-wrap:wrap;gap:.5rem;margin:.4rem 0}
.btn{min-height:3.2rem;padding:.4rem 1rem;border-radius:1rem;background:#ffe9d2;font-size:1.05rem;box-shadow:0 .2rem 0 #e8bf94}
.btn.on{background:#ffb877}
.btn.go{background:#6fd38a;box-shadow:0 .2rem 0 #3ea65b;color:#fff}
.btn.red{background:#ff8f8f;box-shadow:0 .2rem 0 #d65a5a;color:#fff}
.q{font-size:clamp(1.3rem,2.2vw,2rem);line-height:1.3;margin:.2rem 0 .7rem}
.opts{display:grid;gap:.6rem}
.opt{min-height:4rem;border-radius:1.1rem;background:#fff3e0;box-shadow:0 .25rem 0 #e8bf94;font-size:clamp(1.2rem,2vw,1.7rem);padding:.5rem .8rem;text-align:left;line-height:1.2}
.opts.two .opt{font-size:clamp(1.6rem,3vw,2.4rem);text-align:center;min-height:5.2rem}
.opt.bad{background:#ffd2d2;animation:shake .4s;opacity:.55}
.opt.good{background:#b5f0c0}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#info{position:fixed;left:.5rem;bottom:8.6rem;z-index:8000;max-width:min(22rem,60vw);background:#fff;border-left:.4rem solid #6fd38a;border-radius:1rem;padding:.5rem .8rem;font-size:.95rem;box-shadow:0 .3rem 1rem rgba(0,0,0,.25);display:none}
#info.on{display:block;animation:pop2 .3s}
@keyframes pop2{from{transform:scale(.8);opacity:0}}
#toast{position:fixed;left:50%;top:3.4rem;transform:translateX(-50%);z-index:9100;background:#4a2c1a;color:#fff;border-radius:2rem;padding:.4rem 1rem;font-size:1rem;display:none;max-width:90vw;text-align:center}
.sw{width:2.6rem;height:2.6rem;border-radius:50%;border:.2rem solid #fff;box-shadow:0 0 0 .15rem #cfa57a}
.sw.on{box-shadow:0 0 0 .3rem #ff6a2c}
.full{position:fixed;inset:0;z-index:9300;display:none;flex-direction:column;align-items:center;justify-content:flex-end;background:radial-gradient(circle at 50% 20%,#ffe9a8,#ffb877 60%,#ff8a5c);padding:1rem}
.full.on{display:flex}
.full .logo{font-size:clamp(2.2rem,6vw,4.4rem);text-shadow:0 .25rem 0 rgba(0,0,0,.15);color:#fff;margin:.2rem 0;text-align:center}
.full .sub{color:#fff;font-size:1.2rem;text-align:center;margin-bottom:.6rem}
.full .deco{font-size:clamp(3rem,10vw,6rem);margin:auto 0 .6rem}
.full .box{width:min(34rem,100%);background:#fff;border-radius:1.6rem;padding:1rem;box-shadow:0 .5rem 2rem rgba(0,0,0,.25)}
input,select{font:inherit;font-weight:800;width:100%;min-height:3.2rem;border:.15rem solid #f0c9a0;border-radius:.9rem;padding:.3rem .8rem;margin:.25rem 0;background:#fffaf3;color:#4a2c1a}
label{font-size:.9rem;color:#8a5a3a}
table{width:100%;border-collapse:collapse;font-size:.85rem}th,td{padding:.3rem;border-bottom:1px solid #eee;text-align:left}
.dot{display:inline-block;width:.7rem;height:.7rem;border-radius:50%;background:#bbb}.dot.on{background:#22c55e}
#ver{position:fixed;left:.4rem;bottom:calc(env(safe-area-inset-bottom) + 7.6rem);z-index:100;font-size:.7rem;opacity:.55;color:#fff;background:rgba(0,0,0,.2);border-radius:1rem;padding:0 .5rem}
#upd{position:fixed;right:.5rem;top:.5rem;z-index:9500;background:#e11;color:#fff;border-radius:2rem;padding:.4rem .9rem;display:none;animation:pulse 1.2s infinite}
#ban{position:fixed;left:50%;transform:translateX(-50%);top:3.2rem;z-index:9200;background:#fff;border-radius:1rem;padding:.4rem .9rem;font-size:.9rem;box-shadow:0 .3rem 1rem rgba(0,0,0,.25);display:none}
#rot{position:fixed;inset:0;z-index:9800;background:#ff8a5c;color:#fff;display:none;align-items:center;justify-content:center;flex-direction:column;font-size:1.4rem;text-align:center;padding:1rem}
@media (orientation:portrait) and (max-width:600px){#rot.show{display:flex}.rtab{font-size:.62rem;min-width:0}.rtab.mis,.rtab.menu{min-width:3rem}.rtab b{font-size:1.25rem}.tb{min-width:3rem}}
@media (max-height:500px){.card{max-height:88vh}}
</style>
</head>
<body>
<div id="app">
  <div id="top"><span class="ttl">🏡 Minik Mahalle</span><span class="sp"></span><span class="chip" id="chMode">🎈 Serbest</span><span class="chip" id="chStar">⭐ 0</span></div>
  <div id="stageWrap"><div id="stage"><div id="bg"></div><div id="dim"></div></div></div>
  <div id="tray"></div>
  <div id="rooms"></div>
</div>
<div id="info"></div><div id="toast"></div><div id="ban"></div><div id="upd">🔴 Yeni sürüm yayınlandı · <u>Yenile</u></div>
<div id="ver" onclick="surumAc()">v1.0 ✓</div>
<div id="rot">📱↻<br>Telefonu yan çevir, oyun daha büyük olur.<br><button class="btn" onclick="document.getElementById('rot').classList.remove('show');window.__rotOff=1">Devam et</button></div>

<!-- Başlangıç menüsü -->
<div class="full" id="start">
  <div class="deco">🏡🧸🌳</div>
  <div class="logo">Minik Mahalle</div>

function cihazTur(){const t=('ontouchstart' in window)||navigator.maxTouchPoints>0,w=Math.max(screen.width,screen.height),d=window.devicePixelRatio||1;
  if(t&&(w>=3000||(w>=1700&&d<=1.3)))return 'Akıllı Tahta';
  const mn=Math.min(screen.width,screen.height);
  if(t&&mn<600)return 'Telefon'; if(t)return 'Tablet'; return 'Bilgisayar';}
function uiOlcek(){const c=cihazTur();const w=Math.max(screen.width,screen.height);document.documentElement.style.setProperty('--ui',c==='Akıllı Tahta'?(w>=3000?1.6:1.35):1);}
function cocukModu(){const q=new URLSearchParams(location.search).get('cocuk');if(q==='0'||q==='1'||q==='2'){ls.s('zirve_cocuk_boyu',q);}
  let v=ls.g('zirve_cocuk_boyu',null);if(v==null)v=cihazTur()==='Akıllı Tahta'?'1':'0';return v;}
function cocukUygula(){const v=cocukModu();document.body.classList.toggle('cocuk-boyu',v==='1'||v==='2');document.body.classList.toggle('cocuk-alcak',v==='2');
  const e=$('#stCocuk');if(e)e.textContent='🧒 Çocuk boyu: '+(['Kapalı','Açık','Çok alçak'][+v]);olcuGuncelle();}
function cocukDon(){const v=(+cocukModu()+1)%3;ls.s('zirve_cocuk_boyu',String(v));cocukUygula();toast('🧒 Çocuk boyu: '+['Kapalı','Açık','Çok alçak (alt yarı)'][v]);}
function olcuGuncelle(){const s=$('#stage');if(s)document.documentElement.style.setProperty('--u',(Math.max(s.clientHeight,320)/100)+'px');
  const r=$('#rot');if(r&&!window.__rotOff&&matchMedia('(orientation:portrait) and (max-width:600px)').matches&&window.__basladi)r.classList.add('show');}

let AC=null;
function ses(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC}
function bip(f,d,t='sine',v=.15,dl=0){const a=ses();if(!a||ls.g('mm_ses','1')==='0')return;try{const o=a.createOscillator(),g=a.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,a.currentTime+dl);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dl+d);o.connect(g);g.connect(a.destination);o.start(a.currentTime+dl);o.stop(a.currentTime+dl+d+.02)}catch(e){}}
function sfx(t){({pop:()=>bip(520,.12,'triangle'),good:()=>{bip(523,.15,'triangle',.18);bip(659,.15,'triangle',.18,.12);bip(784,.25,'triangle',.18,.24)},bad:()=>{bip(220,.25,'sawtooth',.08)},water:()=>{for(let i=0;i<5;i++)bip(700+Math.random()*500,.08,'sine',.07,i*.06)},note:()=>{bip([523,587,659,784,880][Math.random()*5|0],.3,'triangle',.15)},tada:()=>{[523,659,784,1047].forEach((f,i)=>bip(f,.25,'triangle',.18,i*.1))},boing:()=>{bip(300,.2,'sine',.15);bip(450,.2,'sine',.12,.1)}}[t]||(()=>{}))();}
let VOICE=null;
function sesSec(){try{const vs=speechSynthesis.getVoices().filter(v=>/^tr/i.test(v.lang)&&!/female|emel|yelda|filiz|seda|zeynep|google|kad[ıi]n/i.test(v.name));VOICE=vs.find(v=>/\bmale\b|tolga|cem|ahmet|erkek/i.test(v.name))||null}catch(e){}}
function konus(t){if(ls.g('mm_sesli','1')==='0')return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(duz(t));u.lang='tr-TR';if(!VOICE)sesSec();if(!VOICE)return;u.voice=VOICE;u.pitch=.85;u.rate=.92;speechSynthesis.speak(u)}catch(e){}}
function duz(s){return String(s).replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim()}
try{speechSynthesis.onvoiceschanged=sesSec}catch(e){}

let DR=null,lastTap={id:0,t:0};
$('#stage').addEventListener('pointerdown',ev=>{const el=ev.target.closest('.obj');if(!el)return;ses();ev.preventDefault();
  const st=$('#stage').getBoundingClientRect(),k=el.dataset.k,id=+el.dataset.id;const arr=k==='i'?R().items:R().chars;const o=arr.find(z=>z.id===id);if(!o)return;

window.addEventListener('pointermove',ev=>{if(!DR)return;const dx=ev.clientX-DR.sx,dy=ev.clientY-DR.sy;if(!DR.moved&&Math.hypot(dx,dy)<7)return;DR.moved=true;
  const o=DR.o;o.x=Math.max(3,Math.min(97,DR.ox+dx/DR.st.width*100));o.y=Math.max(cocukModu()==='0'?8:24,Math.min(96,DR.oy+dy/DR.st.height*100));

  const under=document.elementFromPoint(ev.clientX,ev.clientY);document.querySelectorAll('.rtab').forEach(b=>b.classList.remove('hl'));$('#tray').classList.remove('del');
  const rt=under&&under.closest('.rtab[data-room]');if(rt&&rt.dataset.room!==S.room)rt.classList.add('hl');
  if(under&&under.closest('#tray'))$('#tray').classList.add('del');});

  if(!d.moved){tap(d);return}

  if(under&&under.closest('#tray')){const arr=d.k==='i'?R().items:R().chars;const i=arr.findIndex(z=>z.id===d.id);if(i>=0)arr.splice(i,1);d.el.remove();sfx('bad');toast('🗑️ Kaldırıldı');kaydet();return}

function tap(d){const now=Date.now();if(lastTap.id===d.id&&now-lastTap.t<380&&d.k==='i'){const z=[.8,1,1.4,1.9,2.6];const i=z.indexOf(d.o.s||1);d.o.s=z[(i+1)%z.length];pos(d.el,d.o,d.o.s);sfx('pop');kaydet();lastTap={id:0,t:0};return}

  if(a==='night'){R().dark=!R().dark;$('#dim').classList.toggle('on',R().dark);sfx('note');balon(d.el,R().dark?'💤':'☀️');kaydet();return}
  if(a==='water'){parcacik(d,['💧','💦'],7);sfx('water');return}
  if(a==='bubbles'){parcacik(d,['🫧'],8);sfx('water');return}

  if(a==='ring'){parcacik(d,['🔔','⏰'],4);bip(880,.12,'square',.08);bip(880,.12,'square',.08,.18);return}
  sfx('boing');parcacik(d,['✨'],3);}

let ETAG=null;
async function etag(){try{if(!/^https?:/.test(location.href))return null;const u=location.href.split('#')[0].split('?')[0]+'?_v='+Date.now();let r=await fetch(u,{method:'HEAD',cache:'no-store'});if(!r.ok)r=await fetch(u,{cache:'no-store'});return r.headers.get('etag')||r.headers.get('last-modified')}catch(e){return null}}
async function surumKontrol(elle){const e=await etag();if(!e){if(elle===true)toast('Denetlenemedi (çevrimdışı ya da yerel dosya)');return}if(ETAG===null){ETAG=e;if(elle===true)toast('✅ En güncel sürüm');return}if(e!==ETAG){const u=$('#upd');u.style.display='block';u.onclick=()=>{location.href=location.href.split('?')[0]+'?_r='+Date.now()}}else if(elle===true)toast('✅ En güncel sürüm')}
