    <style>

            --sari: #FFD700; --turuncu: #f97316; --mavi: #3b82f6; 
            --kirmizi: #ef4444; --yesil: #22c55e; --mor: #a855f7; 
            --pembe: #ec4899; --cyan: #06b6d4; --bg: #fffbe7; 
        }
        
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body { 
            margin: 0; padding: 0; 
            font-family: 'Fredoka', sans-serif; 
            background: var(--bg); 
            height: 100vh; height: 100dvh; 
            overflow: hidden; 
            display: flex; flex-direction: column; 
        }

        /* --- HEADER --- */
        header { 
            background: white; padding: 10px 20px;

        .logo { font-size: 1.3rem; font-weight: 700; color: #333; display: flex; align-items: center; gap: 10px; }
        .logo i { color: var(--mavi); font-size: 1.5rem; }
        
        .header-controls { display: flex; align-items: center; gap: 10px; }
        .fullscreen-btn {
            background: #f1f5f9; border: 2px solid #cbd5e1; border-radius: 12px;
            width: 40px; height: 40px; cursor: pointer; color: #64748b; font-size: 1rem;
            display: flex; align-items: center; justify-content: center;
        }
        .star-box { 
            background: var(--sari); padding: 8px 16px; border-radius: 25px; 
            font-weight: 800; font-size: 1.2rem; color: #422006; 
            box-shadow: 0 4px 0 #d97706; display: flex; align-items: center; gap: 8px;
            transition: transform 0.2s;
        }
        .star-box.animate { transform: scale(1.2); }

        /* --- ANA MENÜ (GRID SYSTEM) --- */
        #main-menu { 
            flex: 1; 
            display: grid; 
            gap: 20px; 
            padding: 20px;
            max-width: 1200px; 
            margin: 0 auto; 
            width: 100%; 
            align-content: center;
            overflow-y: auto;
        }

        /* Responsive Grid Ayarları */
        @media (min-width: 1024px) { #main-menu { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); } }
        @media (min-width: 601px) and (max-width: 1023px) { #main-menu { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) {
            #main-menu { grid-template-columns: 1fr; align-content: start; }
            .zone-card { flex-direction: row; justify-content: flex-start; padding-left: 20px; gap: 15px; text-align: left; min-height: 100px; }
            .zone-icon { font-size: 2.5rem; margin-bottom: 0; }
        }

        .zone-card {
            background: white; border-radius: 25px; position: relative; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; border: 4px solid; transition: transform 0.1s; 
            box-shadow: 0 6px 0 rgba(0,0,0,0.1); height: 100%; min-height: 140px;
        }
        .zone-card:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.1); }
        .zone-icon { font-size: 3.5rem; margin-bottom: 10px; }
        .zone-title { font-size: 1.3rem; font-weight: 700; color: #333; margin-bottom: 4px; }
        .zone-desc { font-size: 0.9rem; opacity: 0.8; font-weight: 600; }

        /* Kategori Renkleri */
        .z-math { border-color: var(--mavi); background: #eff6ff; color: var(--mavi); }
        .z-lang { border-color: var(--kirmizi); background: #fef2f2; color: var(--kirmizi); }
        .z-social { border-color: var(--yesil); background: #f0fdf4; color: var(--yesil); }
        .z-think { border-color: var(--mor); background: #faf5ff; color: var(--mor); }
        .z-emotion { border-color: var(--pembe); background: #fdf2f8; color: var(--pembe); }
        .z-nature { border-color: var(--turuncu); background: #fff7ed; color: var(--turuncu); }

        /* --- OYUN ALANI --- */
        #game-modal {
            position: fixed; inset: 0; background: var(--bg); z-index: 200;
            display: none; flex-direction: column; 
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .modal-header { 
            padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; 
            background: white; border-bottom: 3px solid #eee; flex-shrink: 0; height: 70px;
        }
        
        .header-title-group { display: flex; flex-direction: column; gap: 2px; }
        .progress-badge { 
            background: #f1f5f9; color: #475569; font-size: 0.9rem; padding: 4px 10px; 
            border-radius: 12px; font-weight: bold; align-self: flex-start; border: 1px solid #cbd5e1;
        }

        .home-btn { 
            background: #ffe4e6; color: #e11d48; border: none; padding: 10px 20px;
            font-size: 1rem; cursor: pointer; border-radius: 12px; font-weight: bold;

        .home-btn:active { transform: scale(0.95); }

        .game-content { 
            flex: 1; padding: 20px; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; text-align: center; 
            overflow-y: auto; width: 100%; max-width: 1000px; margin: 0 auto;
        }

        /* Oyun Elementleri */
        .question-text { font-size: 1.8rem; margin-bottom: 25px; color: #1e293b; font-weight: 700; line-height: 1.3; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 500px; }
        
        .opt-btn { 
            background: white; border: 4px solid #cbd5e1; border-radius: 20px; padding: 15px;

        .opt-btn.wrong { background: #fee2e2; border-color: #ef4444; box-shadow: 0 5px 0 #b91c1c; animation: shake 0.4s; }

        .math-visual {
            display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px;

        }

        .phil-card {
            background: white; padding: 30px; border-radius: 30px; border: 5px dashed var(--mor);

        .end-btn-group { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .end-btn {

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        @keyframes bounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

        function updateScore() {
            score += 10;
            document.getElementById('score').innerText = score;
            const box = document.getElementById('score-box');
            box.classList.add('animate');
            setTimeout(() => box.classList.remove('animate'), 300);
            if (typeof confetti === 'function') confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 } });
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Oyunu Başlat
        function startGame(type) {
            currentRound = 1;
            currentGameType = type;
            document.getElementById('game-modal').style.display = 'flex';
            document.getElementById('game-area').innerHTML = '';
            
            const title = document.getElementById('modal-title');
            if(type === 'math') title.style.color = "#3b82f6";
            else if(type === 'lang') title.style.color = "#ef4444";
            else if(type === 'social') title.style.color = "#22c55e";
            else if(type === 'think') title.style.color = "#a855f7";
            else if(type === 'emotion') title.style.color = "#ec4899";
            else if(type === 'nature') title.style.color = "#f97316";

            // SORU HAZIRLIĞI
            if (type === 'math') {
                // Matematik için özel hazırlık gerekmez, loadLevel'da dinamik üretilir.
                sessionQuestions = []; 
            } else {
                // Diğer kategoriler için:
                // 1. Havuzun kopyasını al
                let poolCopy = [...GAME_DATA[type]];
                // 2. Karıştır
                shuffleArray(poolCopy);
                // 3. İlk 10 tanesini seç ve oturum değişkenine ata
                sessionQuestions = poolCopy.slice(0, MAX_ROUNDS);
            }

            loadLevel();
        }

        function loadLevel() {
            const area = document.getElementById('game-area');
            const badge = document.getElementById('progress-badge');

            if (currentRound > MAX_ROUNDS) {
                showEndScreen();
                return;
            }

            badge.innerText = `Soru: ${currentRound} / ${MAX_ROUNDS}`;
            area.innerHTML = ''; 

            if (currentGameType === 'math') {
                loadMathGame(area);
            } else if (currentGameType === 'think') {
                // Felsefe için sessionQuestions sadece string dizisi
                loadThinkGame(area, sessionQuestions[currentRound - 1]);
            } else {
                // Diğerleri (lang, social, nature, emotion) nesne yapısında
                loadStandardGame(area, sessionQuestions[currentRound - 1], currentGameType);
            }
        }

        function closeGame() { document.getElementById('game-modal').style.display = 'none'; }

        function showEndScreen() {
            const area = document.getElementById('game-area');
            const badge = document.getElementById('progress-badge');
            badge.innerText = "Oyun Bitti!";
            
            area.innerHTML = `
                <div class="end-screen">
                    <div style="font-size:5rem; margin-bottom:10px;">🎉</div>
                    <div class="end-title">Tebrikler!</div>
                    <div class="end-score">Toplam Puan: <strong>${score}</strong></div>
                    <div class="end-btn-group">
                        <button class="end-btn btn-menu" onclick="closeGame()">🏠 Ana Menü</button>
                        <button class="end-btn btn-replay" onclick="startGame('${currentGameType}')">🔄 Tekrar Oyna</button>
                    </div>
                </div>
            `;
            if (typeof confetti === 'function') confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 } });
        }

        // --- MATEMATİK (Dinamik Üretim - Sonsuz Farklılık) ---
        function loadMathGame(area) {
            // Rastgelelik: Sayılar, İkon ve İşlem değişebilir (şimdilik sadece toplama)
            const n1 = Math.floor(Math.random() * 5) + 1; 
            const n2 = Math.floor(Math.random() * 5) + 1;
            const correct = n1 + n2;
            const icons = ['🍎', '🚙', '⭐', '🎈', '🍪', '🐱', '🦋', '⚽'];
            const icon = icons[Math.floor(Math.random() * icons.length)];
            
            // Görseli oluştur
            let v1 = Array(n1).fill(icon).join(' ');
            let v2 = Array(n2).fill(icon).join(' ');

            let html = `
                <div class="math-visual" style="color:#3b82f6;">
                    <span>${v1}</span>
                    <span style="color:#333; margin:0 15px;">➕</span>
                    <span>${v2}</span>
                </div>
                <div class="question-text">Toplam kaç tane var?</div>
                <div class="options-grid">
            `;
            
            // Şıkları oluştur ve karıştır
            let opts = new Set([correct]);
            while(opts.size < 4) {
                let r = Math.floor(Math.random() * 10) + 1; 
                if(r !== correct && r > 1) opts.add(r);
            }
            Array.from(opts).sort(() => Math.random() - 0.5).forEach(opt => {
                html += `<div class="opt-btn" onclick="checkAnswer(this, ${opt}, ${correct})">${opt}</div>`;
            });
            html += `</div>`;
            area.innerHTML = html;
        }

        // --- STANDART OYUN YAPISI (Lang, Social, Nature, Emotion) ---
        function loadStandardGame(area, data, type) {
            // data: { q: soru, a: cevap, o: şıklar, i: ikon }
            let html = `
                <div style="font-size:5rem; margin-bottom:15px;">${data.i}</div>
                <div class="question-text">${data.q}</div>
                <div class="options-grid" ${type==='lang' ? 'style="grid-template-columns:1fr;"' : ''}>
            `;
            
            // Şıkları karıştır
            let shuffledOpts = [...data.o]; // Kopyasını al
            shuffleArray(shuffledOpts); // Karıştır

            shuffledOpts.forEach(opt => {
                html += `<div class="opt-btn" onclick="checkAnswer(this, '${opt}', '${data.a}')">${opt}</div>`;
            });
            html += `</div>`;
            area.innerHTML = html;
        }

        // --- FELSEFE ---
        function loadThinkGame(area, questionText) {
            area.innerHTML = `
                <div class="phil-card">
                    <div style="font-size:4rem; margin-bottom:10px;">🤔</div>
                    <div class="phil-question">${questionText}</div>
                </div>
                <p style="color:#666; font-size:1.1rem; margin-top:20px;">Bunu yanındakiyle konuş.</p>
                <button class="spin-btn" onclick="nextRoundThink()">Sıradaki Soru ➡️</button>
            `;
        }

        function nextRoundThink() {
            currentRound++;
            loadLevel();
        }

        // --- CEVAP KONTROL ---
        function checkAnswer(btn, val, correct) {
            if (val == correct) {
                btn.classList.add('correct');
                updateScore();
                currentRound++; 
                setTimeout(() => loadLevel(), 1000); 
            } else {
                btn.classList.add('wrong');
            }
        }
    </script>
