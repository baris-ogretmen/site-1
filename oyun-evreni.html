const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
function makeQ(text,answer,others,explain,subject='Matematik',visual='',speak=''){
 answer=String(answer);return {text,answer,options:shuffle([answer,...[...new Set(others.map(String))].filter(x=>x!==answer).slice(0,2)]),explain,subject,visual,speak};
}
function numeric(text,a,explain,visual='',speak=''){return makeQ(text,a,shuffle([a+1,a+2,Math.max(0,a-1),Math.max(0,a-2),a+3]),explain,'Matematik',visual,speak)}
function gcd(a,b){while(b){[a,b]=[b,a%b]}return a}

 game.v+=gas*dt*8;game.v*=Math.exp(-dt*(gas?.32:1.8));game.v=Math.max(-3.5,Math.min(max,game.v));game.a+=steer*dt*1.65*Math.min(1,Math.abs(game.v)/2)*(game.v<0?-1:1);let nx=game.x-Math.sin(game.a)*game.v*dt,nz=game.z-Math.cos(game.a)*game.v*dt;
 let valid;if(this.kind==='drive3')valid=Math.abs(nx)<38&&Math.abs(nz)<38&&([-24,0,24].some(v=>Math.abs(nx-v)<3.2)||[-24,0,24].some(v=>Math.abs(nz-v)<3.2));else{let d=Math.sqrt((nx/26)**2+(nz/20)**2);valid=d>.84&&d<1.16}
 if(valid){game.x=nx;game.z=nz}else{game.v*=-.15;game.impact=.25}
 if(Math.hypot(game.x-target[0],game.z-target[1])<3.2)this.checkpoint();this.steer=steer; }
 updateFlight(dt){let p=this.target(),dx=(held3.right?1:0)-(held3.left?1:0),dy=(held3.up?1:0)-(held3.down?1:0);if(game.assist){game.x+=(p[0]-game.x)*dt*1.4;game.y+=(p[1]-game.y)*dt*1.4}else{game.x=Math.max(-18,Math.min(18,game.x+dx*dt*9));game.y=Math.max(3,Math.min(16,game.y+dy*dt*6))}game.z-=dt*(grade===0?6:9);game.v=9;this.steer=dx;if(Math.abs(game.z-p[2])<1.3&&Math.hypot(game.x-p[0],game.y-p[1])<2.8)this.checkpoint();else if(game.z<p[2]-5){game.z=p[2]+18;let note=root.querySelector('#bg-g3notice');if(note)note.textContent='Halka için yönünü düzelt. Yeniden yaklaşabilirsin.'} }
 updateDojo(dt){game.cool=Math.max(0,game.cool-dt);game.punch=Math.max(0,game.punch-dt);game.enemyPunch=Math.max(0,game.enemyPunch-dt);game.guard=!!held3.guard;game.x=Math.max(-3.8,Math.min(-.4,game.x+((held3.right?1:0)-(held3.left?1:0))*dt*2));game.energy=Math.min(100,game.energy+dt*8);game.enemyTimer-=dt;let note=root.querySelector('#bg-g3notice');if(game.enemyTimer<1&&game.enemyTimer>0){if(note)note.textContent='🛡 Robot hazırlanıyor! Savun düğmesini basılı tut.'}else if(note)note.textContent='Yaklaş, vuruşunu zamanla. İki isabetle öğrenme turunu aç.';
 if(game.enemyTimer<=0){game.enemyTimer=grade===0?5.2:4;game.enemyPunch=.5;if(game.enemyX-game.x<2.4){if(game.guard){game.energy=Math.min(100,game.energy+10);tone(780);if(note)note.textContent='✨ Başarılı savunma!'}else{game.rival++;game.impact=.4;tone(240)}}} }
 hit(){if(this.kind!=='dojo3'||qstate||game.finished||game.cool>0||paused)return;if(game.energy<12){notify('Enerjin biraz dolsun.');return}game.energy-=12;game.cool=.8;game.punch=.5;if(game.enemyX-game.x>2.2){notify('Biraz yaklaş, sonra vuruş yap.');return}if(game.enemyTimer<1&&game.enemyTimer>0){notify('Robot hazırlıkta; savunmayı dene.');return}game.points++;game.stageHits++;game.impact=.15;tone(600);if(game.stageHits>=2)later(()=>this.checkpoint(),.55)}
 robotItems(prefix,x,a,punch,guard,items){let lunge=punch>0?Math.sin(punch/.5*Math.PI)*.2:0;let base=model3(x-Math.sin(a)*lunge,.27,0,a),bob=Math.sin(this.elapsed*3)*.035,mesh=this.meshes;items.push({mesh:mesh[prefix+'body'],matrix:M4.mul(base,M4.translation(0,bob,0)),shine:.34});for(let side of [-1,1]){let foot=M4.mul(base,M4.translation(side*.23,.99,side*.15));items.push({mesh:mesh[prefix+'leg'],matrix:foot});let angle=guard?1.7:punch>0&&side===-1?Math.sin(punch/.5*Math.PI)*1.9:.4;let arm=M4.mul(base,M4.mul(M4.translation(side*.57,1.84+bob,0),M4.rx(angle)));items.push({mesh:mesh[prefix+'arm'],matrix:arm,shine:.24})}}
 frame(dt){if(this.lost)return;this.update(dt);let items=[{mesh:this.meshes.scene}],eye,target,fog=[.66,.79,.88],r=this.renderer;
 if(this.kind==='dojo3'){this.robotItems('p',game.x,-Math.PI/2,game.punch,game.guard,items);this.robotItems('e',game.enemyX,Math.PI/2,game.enemyPunch,game.enemyTimer<1,items);items.push({mesh:this.meshes.shadow,matrix:M4.mul(model3(game.x,.235,0),M4.scale(.6,1,.7))},{mesh:this.meshes.shadow,matrix:M4.mul(model3(game.enemyX,.235,0),M4.scale(.6,1,.7))});eye=game.camera?[6,3.8,7]:[0,3.5,8.6];target=[0,1.4,0];fog=[.7,.76,.79];if(game.punch>0&&game.impact>0)for(let i=0;i<5;i++){let a=i*Math.PI*2/5;items.push({mesh:this.meshes.gem,matrix:M4.mul(model3(game.enemyX-.5+Math.cos(a)*.4,1.8+Math.sin(a)*.4,-.1),M4.scale(.35,.35,.35)),shine:.4})}}
 else if(this.kind==='fly3'){let roll=game.assist?Math.max(-.3,Math.min(.3,(this.target()[0]-game.x)*-.04)):-this.steer*.25;items.push({mesh:this.meshes.jet,matrix:model3(game.x,game.y,game.z,0,roll),shine:.4});let p=this.target();if(!game.finished)items.push({mesh:this.meshes.ring,matrix:model3(p[0],p[1],p[2]),shine:.2});eye=game.camera?[game.x,game.y+2,game.z+4]:[game.x,game.y+3,game.z+11];target=[game.x,game.y,game.z-8]}
 else{let bike=this.kind==='bike3',base=model3(game.x,0,game.z,game.a,bike?-this.steer*.17:0);items.push({mesh:this.meshes.shadow,matrix:M4.mul(model3(game.x,0,game.z,game.a),M4.scale(bike?.4:.92,1,bike?1.3:2.05))},{mesh:this.meshes.body,matrix:base,shine:.56});let pos=bike?[[0,.43,-1],[0,.43,.9]]:[[-.91,.43,-1.22],[.91,.43,-1.22],[-.91,.43,1.26],[.91,.43,1.26]];for(let p of pos){let wm=M4.mul(base,M4.mul(M4.translation(...p),M4.rx(this.elapsed*game.v*1.5)));items.push({mesh:this.meshes.wheel,matrix:bike?M4.mul(wm,M4.scale(.7,1,1)):wm,shine:.22})}
 if(!bike){for(let [i,[x,z,a]]of this.traffic(dt).entries()){let b=model3(x,0,z,a);items.push({mesh:i%2?this.meshes.traffic:this.meshes.traffic2,matrix:b,shine:.3});for(let p of [[-.91,.43,-1.22],[.91,.43,-1.22],[-.91,.43,1.26],[.91,.43,1.26]])items.push({mesh:this.meshes.wheel,matrix:M4.mul(b,M4.translation(...p))})}}
 let p=this.target(),prev=game.round?game.pointsRoute[game.round-1]:bike?[0,20]:[0,24],a=Math.atan2(-(p[0]-prev[0]),-(p[1]-prev[1]));if(!game.finished)items.push({mesh:this.meshes.ring,matrix:model3(p[0],2.95,p[1],a),shine:.22});let dist=game.camera?4.7:bike?7.7:10.5,height=game.camera?2.9:bike?4:5;eye=[game.x+Math.sin(game.a)*dist,height,game.z+Math.cos(game.a)*dist];target=[game.x-Math.sin(game.a)*4,1.1,game.z-Math.cos(game.a)*4];if(bike)fog=[.76,.82,.8]}
 let smooth=saved.calm?1:Math.min(1,dt*5||1);this.camera=this.camera.map((v,i)=>v+(eye[i]-v)*smooth);r.frame(this.camera,target,items,fog);this.items=items;this.lastEye=[...this.camera];this.lastTarget=target;this.lastFog=fog;this.frameCount++;if(this.frameCount%5===0){this.updateHUD();this.drawMap();this.targetLabel()} }
 targetLabel(){let el=root.querySelector('#bg-g3target');if(!el||this.kind==='dojo3')return;let p=this.target(),point=this.kind==='fly3'?[p[0],p[1]+3.7,p[2]]:[p[0],6.5,p[1]],pr=this.renderer.project(point);if(!pr||game.finished||qstate){el.hidden=true;return}el.hidden=false;el.style.left=Math.max(25,Math.min(this.renderer.width-25,pr.x))+'px';el.style.top=Math.max(80,Math.min(this.renderer.height-70,pr.y))+'px';el.textContent='◆ '+Math.round(this.kind==='fly3'?Math.hypot(game.x-p[0],game.y-p[1],game.z-p[2]):Math.hypot(game.x-p[0],game.z-p[1]))+' m'}
 drawMap(){let el=root.querySelector('#bg-g3map');if(!el)return;let c=el.getContext('2d'),s=96;el.width=s;el.height=s;c.fillStyle='#112638df';c.fillRect(0,0,s,s);if(this.kind==='drive3'){c.strokeStyle='#768d9d';c.lineWidth=6;for(let a of [-24,0,24]){let p=48+a*1.1;c.beginPath();c.moveTo(p,6);c.lineTo(p,90);c.moveTo(6,p);c.lineTo(90,p);c.stroke()}}else if(this.kind==='bike3'){c.strokeStyle='#93a5a0';c.lineWidth=8;c.beginPath();c.ellipse(48,48,30,23,0,0,7);c.stroke()}else return;let target=this.target();c.fillStyle='#ffdb8c';c.beginPath();c.arc(48+target[0]*1.1,48+target[1]*1.1,4,0,7);c.fill();c.save();c.translate(48+game.x*1.1,48+game.z*1.1);c.rotate(-game.a);c.fillStyle='#a9ffed';c.beginPath();c.moveTo(0,-5);c.lineTo(4,4);c.lineTo(-4,4);c.fill();c.restore()}
}
function start3(kind){let fight=kind==='dojo3',fly=kind==='fly3';main.innerHTML=top(titles[kind],fight?'Refleks · Savunma · Bilgi':fly?'Yön bulma · Keşif · Öğrenme':'Sürüş · Dikkat · Matematik')+'<div class="g3-frame" id="bg-g3frame"><canvas id="bg-webgl" role="img" aria-label="'+(fight?'Hareketli üç boyutlu robot spor arenası':fly?'Üç boyutlu uçuş sahnesi':'Üç boyutlu araç sürüş sahnesi')+'"></canvas><div class="g3-top"><span id="bg-g3tag"></span><span id="bg-g3speed"></span></div>'+(!fight&&!fly?'<canvas id="bg-g3map" aria-label="Rota haritası"></canvas>':'')+'<div id="bg-g3target" class="g3-target" hidden></div><div class="g3-bottom"><span>'+(fight?'ENERJİ':fly?'KEŞİF':'TURBO')+'</span><div><i id="bg-g3energy"></i></div></div></div><p id="bg-g3notice" class="g3-notice" role="status">'+(fight?'Yaklaş, vuruşunu zamanla. İki isabetle öğrenme turunu aç.':fly?'Altın halkaya yönel. Uçak kendiliğinden ilerler.':'Gazı basılı tut, altın halkaya git. Virajlarda yavaşla.')+'</p><div class="g3-controls">'+(fight?'<div class="row">'+hold3('left','← Uzaklaş')+hold3('right','Yaklaş →')+'</div><div class="row">'+hold3('guard','🛡 Savun')+button('hit3','🥊 Vuruş','hot')+'</div>':fly?'<div class="row">'+hold3('left','←')+hold3('right','→')+'</div><div class="row">'+hold3('up','↑ Yüksel')+hold3('down','↓ Alçal')+'</div>':'<div class="row">'+hold3('left','← Sol')+hold3('right','Sağ →')+'</div><div class="row">'+hold3('brake','Fren / geri')+hold3('gas','Gaz ↑','hot')+hold3('turbo','⚡')+'</div>')+'</div><div class="row" style="margin-top:12px">'+button('camera3','📷 Kamera')+(!fight?button('assist3','Yardımlı sürüş'):button('dojoLesson3','💡 Spor kuralı'))+button('reset3','↻ Yeniden başlat','', 'data-value="'+kind+'"')+'</div><p class="note">'+(fight?'Klavye: A / D hareket · J vuruş · K savunma. Robotlarla puanlı spor antrenmanı.':fly?'Klavye: ← → yön · ↑ ↓ yükseklik. Yardımlı sürüş, küçük kaşifler için yönü ayarlar.':'Klavye: ↑ / W gaz · ↓ / S fren · ← → / A D direksiyon · Boşluk turbo. Yardımlı sürüş, aracı rotada ilerletir.')+'</p><div id="bg-question"></div><div id="bg-end"></div>';try{active3=new Game3(kind)}catch(e){active3=null;root.querySelector('#bg-g3frame').innerHTML='<div class="overlay"><h3>Bu önizlemede 3B görüntü açılamadı.</h3><p>Dosyayı güncel bir tarayıcıda açmayı deneyebilirsin. Diğer altı oyun da menüde hazır.</p>'+button('home','Diğer oyunlara dön','hot')+'</div>';root.querySelector('#bg-g3notice').textContent='3B için WebGL desteği gerekiyor.'}bind3Controls()}
function hold3(key,label,cls=''){return '<button class="'+cls+'" data-hold3="'+key+'" aria-label="'+({left:'Sola yönel',right:'Sağa yönel',gas:'Gaz ver',brake:'Fren veya geri',turbo:'Turbo',up:'Yüksel',down:'Alçal',guard:'Savun'}[key])+'">'+label+'</button>'}
function bind3Controls(){root.querySelectorAll('[data-hold3]').forEach(b=>{b.addEventListener('pointerdown',e=>{if(paused||qstate||game.finished)return;e.preventDefault();held3[b.dataset.hold3]=true;b.setPointerCapture?.(e.pointerId);b.classList.add('held')});for(let event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>{held3[b.dataset.hold3]=false;b.classList.remove('held')})})}
Object.assign(actions,{camera3:()=>{if(active3)game.camera=1-game.camera},assist3:()=>{if(!active3)return;game.assist=!game.assist;held3={};active3.updateHUD();active3.defaultNotice()},reset3:b=>play(b.dataset.value),hit3:()=>active3?.hit(),dojoLesson3:()=>notify('Spor mücadelesinde sıra, zamanlama ve kurallara saygı önemlidir.')});
root.addEventListener('keydown',e=>{if(!newModes3.includes(mode)||paused||qstate)return;let k=e.key.toLowerCase(),key=mode==='fly3'?{arrowleft:'left',arrowright:'right',arrowup:'up',arrowdown:'down',a:'left',d:'right',w:'up',s:'down'}[k]:{arrowleft:'left',arrowright:'right',arrowup:'gas',arrowdown:'brake',a:'left',d:'right',w:'gas',s:'brake',' ':'turbo',k:'guard'}[k];if(key){e.preventDefault();held3[key]=true}if(k==='j'&&!e.repeat)active3?.hit()});

home();requestAnimationFrame(animate);
})();
