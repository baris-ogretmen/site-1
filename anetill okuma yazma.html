<style>
:root{
  --bg:#fff7ec; --ink:#2b2a4a; --soft:#7a7598; --card:#ffffff; --line:#efe4d4;
  --pri:#ff7a3d; --pri2:#f9577a; --ok:#2fb36d; --bad:#ef5350;
  --g1:#ff6b6b; --g2:#ff9f40; --g3:#2fb36d; --g4:#339af0; --g5:#845ef7;
  --defter-ince:#b9cdee; --defter-ana:#e5534b;
  --kalem:#4a3cc9;
  font-size:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-weight:800;font-variant-numeric:lining-nums tabular-nums;overflow:hidden}
button{font-family:inherit;font-weight:800;cursor:pointer;border:0;color:inherit}
.okuma{font-family:'Andika','Nunito',sans-serif;font-weight:700}
.ekran{position:fixed;inset:0;display:none;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.ekran.acik{display:flex}
.ust{display:flex;align-items:center;gap:.6rem;padding:.7rem 1rem;flex-wrap:wrap}
.ust h1{margin:0;font-size:1.45rem;font-weight:900;letter-spacing:-.01em}
.ust .alt{font-size:.85rem;color:var(--soft)}
.dolgu{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto;padding:0 1rem 1rem}
.pill{display:inline-flex;align-items:center;gap:.35rem;background:#fff;border:2px solid var(--line);border-radius:999px;padding:.45rem .85rem;font-size:.95rem}
.pill.ana{background:var(--pri);border-color:var(--pri);color:#fff}
.pill.soluk{opacity:.55;font-size:.82rem;padding:.35rem .7rem}
.pill.soluk:hover{opacity:1}
.bos{flex:1}
/* MENÜ */
.devam{display:flex;align-items:center;gap:1rem;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-radius:1.4rem;padding:1rem 1.2rem;margin:.3rem 0 1rem;box-shadow:0 10px 24px -12px #f9577a99;text-align:left}
.devam .buyuk{font-family:'Andika';font-size:3.4rem;line-height:1;background:#fff;color:var(--ink);border-radius:1rem;min-width:5.4rem;text-align:center;padding:.4rem .5rem}
.devam b{display:block;font-size:1.3rem}
.devam small{opacity:.9;font-size:.95rem}
.grup{background:#fff;border-radius:1.2rem;padding:.8rem .9rem 1rem;margin-bottom:.8rem;border:2px solid var(--line)}
.grup h3{margin:0 0 .6rem;font-size:1rem;display:flex;align-items:center;gap:.5rem}
.grup h3 .rozet{color:#fff;border-radius:.6rem;padding:.15rem .55rem;font-size:.85rem}
.harfler{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.6rem,1fr));gap:.55rem}
.hk{position:relative;background:var(--bg);border:2px solid var(--line);border-radius:1rem;padding:.5rem .2rem .35rem;font-family:'Andika';font-size:2rem;line-height:1.1}
.hk small{display:block;font-family:'Nunito';font-size:.75rem;color:#e7a400;min-height:1em;letter-spacing:.05em}
.hk.tamam{border-color:var(--ok);background:#effaf3}
.hk.burada{border-color:var(--pri);box-shadow:0 0 0 3px #ff7a3d44}
.hk.burada::after{content:'buradasın';position:absolute;top:-.6rem;left:50%;transform:translateX(-50%);background:var(--pri);color:#fff;font-family:Nunito;font-size:.62rem;padding:.05rem .4rem;border-radius:.5rem;white-space:nowrap}
.menu-alt{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;padding:.6rem 1rem 1rem}
.sov-btn{flex:1 1 15rem;display:flex;align-items:center;gap:.8rem;background:var(--ink);color:#fff;border-radius:1.2rem;padding:.9rem 1.1rem;font-size:1.15rem;text-align:left}
.sov-btn span{font-size:2rem}
.sov-btn small{display:block;font-size:.8rem;opacity:.75}
/* HARF EVİ */
.harf-baslik{display:flex;align-items:center;gap:.7rem}
.harf-baslik .hb{font-family:'Andika';font-size:2.6rem;line-height:1;background:#fff;border:3px solid var(--pri);border-radius:1rem;padding:.2rem .7rem}
.sekmeler{display:flex;gap:.4rem;padding:.6rem 1rem calc(.7rem + env(safe-area-inset-bottom));overflow-x:auto;background:#fff;border-top:2px solid var(--line);flex-wrap:nowrap}
.sekmeler button{flex:1 1 0;min-width:3.4rem;border-radius:1rem;padding:.55rem .5rem;background:var(--bg);font-size:.95rem;display:flex;flex-direction:column;align-items:center;gap:.1rem;border:2px solid transparent}
.sekmeler button i{font-style:normal;font-size:1.5rem}
.sekmeler button.akt{border-color:var(--pri);background:#fff1e8}
.sekmeler button .tik{color:var(--ok);font-size:.7rem;height:.8rem}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;gap:.7rem;padding-top:.3rem}
.sahne{position:relative;background:#fffdf6;border:2px solid var(--line);border-radius:1.3rem;flex:1;min-height:14rem;display:flex;overflow:hidden}
.sahne svg{width:100%;height:100%;display:block;touch-action:none;user-select:none}
.kontrol{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
.btn{background:#fff;border:2px solid var(--line);border-radius:1rem;padding:.7rem 1rem;font-size:1.05rem;min-height:3.1rem}
.btn.ana{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.yesil{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sec{border-color:var(--kalem);background:#eeebff}
.ipucu{font-size:.95rem;color:var(--soft);text-align:center}
.anahtar{display:flex;gap:1rem;align-items:center;background:#fff;border:2px solid var(--line);border-radius:1.3rem;padding:1rem;flex-wrap:wrap;justify-content:center}
.anahtar .emo{font-size:5rem;line-height:1}
.anahtar .kel{font-size:3rem}
.anahtar .kel b{color:var(--pri)}
.kartlar{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));gap:.6rem}
.kk{background:#fff;border:2px solid var(--line);border-radius:1rem;padding:.6rem;font-size:1.6rem;text-align:center}
.kk .e{font-size:2.2rem;display:block}
.kk.cal{border-color:var(--pri);background:#fff1e8}
.kk b{color:var(--pri)}
.hece-kart{font-size:2.4rem;padding:.8rem .4rem}
.cumle{background:#fff;border:2px solid var(--line);border-radius:1rem;padding:.8rem 1rem;font-size:1.9rem;display:flex;flex-wrap:wrap;gap:.2rem .6rem;align-items:center}
.cumle .k{border-radius:.5rem;padding:0 .15rem;cursor:pointer}
.cumle .k.cal{background:#ffe08a}
.cumle button{margin-left:auto;font-size:1.3rem;background:var(--bg);border-radius:.8rem;padding:.3rem .6rem}
.baslik2{font-size:1rem;color:var(--soft);margin:.3rem 0 0}
/* OYUN */
.soru{display:flex;flex-direction:column;align-items:center;gap:.6rem;text-align:center;background:#fff;border:2px solid var(--line);border-radius:1.3rem;padding:1rem}
.soru .yon{font-size:1.4rem}
.soru .emo{font-size:4.6rem;line-height:1}
.sik-satir{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}
.sik{min-width:7.5rem;min-height:6.5rem;font-size:3rem;background:#fff;border:3px solid var(--line);border-radius:1.3rem;padding:.4rem 1rem}
.sik.dogru{border-color:var(--ok);background:#e8f8ef;animation:zipla .4s}
.sik.yanlis{border-color:var(--bad);background:#fdecec;animation:salla .35s}
@keyframes zipla{50%{transform:scale(1.08)}}
@keyframes salla{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.yuva-satir{display:flex;gap:.4rem;justify-content:center}
.yuva{width:3.6rem;height:4.4rem;border-bottom:4px solid var(--defter-ana);font-size:2.8rem;display:flex;align-items:flex-end;justify-content:center}
.tas{width:4.2rem;height:4.6rem;font-size:2.7rem;background:#fff;border:3px solid var(--line);border-radius:1rem}
.tas.kul{opacity:.25;pointer-events:none}
.ilerle{height:.7rem;background:var(--line);border-radius:1rem;overflow:hidden}
.ilerle i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:width .3s}
/* ŞOV */
#sSov{background:#1c1b2b;color:#fff}
#sSov .ust .alt{color:#bdb9dc}
#sSov .sahne{background:#f4f2ee;border-color:#2f2d45}
#sSov .pill{background:#2c2a44;border-color:#3a3858;color:#fff}
#sSov .pill.ana{background:var(--pri);border-color:var(--pri)}
#sSov .btn{background:#2c2a44;border-color:#3a3858;color:#fff}
#sSov .btn.ana{background:var(--pri);border-color:var(--pri)}
.sov-kontrol{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;padding:.6rem 1rem calc(.8rem + env(safe-area-inset-bottom))}

        if(kalem){const q=p.getPointAtLength(L*e);kalem.setAttribute('transform',`translate(${ox+q.x} ${oy+q.y})`)}
        if(k<1)requestAnimationFrame(ad);else res();
      }
      requestAnimationFrame(ad);
    });
    if(kim!==undefined&&kim!==animKimlik)return false;
    await bekle(120/hiz);
  }
  if(kalem)kalem.style.display='none';
  return true;
}
function numaraKoy(par,x,y,n){
  // üst üste binen numaraları sola kaydır
  par.__yer=par.__yer||[]; let dx=0;
  while(par.__yer.some(([a,b])=>Math.hypot(a-(x+dx),b-y)<18)) dx-=18;
  par.__yer.push([x+dx,y]); x+=dx;
  const g=el('g',{class:'numara'},par);
  el('circle',{cx:x-9,cy:y-9,r:7.5,fill:'#2fb36d'},g);
  const t=el('text',{x:x-9,y:y-6,'text-anchor':'middle','font-size':10,'font-family':'Nunito','font-weight':900,fill:'#fff'},g);
  t.textContent=n;
}

function bip(tur){

    const notlar=tur==='ok'?[660,880,1175]:tur==='yildiz'?[523,659,784,1046]:[300,220];

      g.gain.setValueAtTime(.0001,AC.currentTime+i*.09);g.gain.exponentialRampToValueAtTime(.18,AC.currentTime+i*.09+.02);

}

/* 3) YAZ — parmakla iz sürme */
let yazSeviye=1, yazBuyuk=false, murekkep=[], yazGeo=null;
function pYaz(){
  panel().innerHTML=`<div class="sahne" id="yzSahne"></div>
   <div class="kontrol">
     <button class="btn ${yazSeviye===1?'sec':''}" onclick="yazSeviye=1;pYaz()">1 · İzi takip et</button>
     <button class="btn ${yazSeviye===2?'sec':''}" onclick="yazSeviye=2;pYaz()">2 · Noktalı</button>
     <button class="btn ${yazSeviye===3?'sec':''}" onclick="yazSeviye=3;pYaz()">3 · Kendin yaz</button>
     <button class="btn" onclick="yazBuyuk=!yazBuyuk;pYaz()">${yazBuyuk?'küçüğe geç':'BÜYÜĞE geç'}</button>
   </div>
   <div class="kontrol"><button class="btn" onclick="yazGoster()">👀 Göster</button><button class="btn" onclick="murekkepSil()">🧽 Sil</button><button class="btn yesil" onclick="yazDegerlendir()">✅ Bitti</button></div>`;
  yazKur();
}
function yazKur(){
  const h=SIRA[HI], G=glif(h,yazBuyuk), sahne=document.getElementById('yzSahne');
  const VW=Math.max(G.w+80,130), x0=(VW-G.w)/2;
  sahne.innerHTML=''; murekkep=[];
  const svg=el('svg',{viewBox:`0 ${Y_UST} ${VW} ${Y_ALT-Y_UST}`,preserveAspectRatio:'xMidYMid meet'},sahne);
  defterCiz(svg,4,VW-4);
  const rehber=el('g',{},svg);
  if(yazSeviye===1) glifCiz(rehber,h,yazBuyuk,x0,{renk:'#e6e0f5',kal:16});
  if(yazSeviye<=2) glifCiz(rehber,h,yazBuyuk,x0,{renk:'#9d97b8',kal:2.2,dash:'1.5 5'});
  const gizli=glifCiz(svg,h,yazBuyuk,x0,{renk:'none',kal:1});
  // başlangıç noktaları + yön okları
  const ok=el('g',{},svg);
  [...gizli.querySelectorAll('path')].forEach((p,i)=>{
    if(yazSeviye===3&&i>0)return;
    const L=p.getTotalLength(), a=p.getPointAtLength(0);
    el('circle',{cx:x0+a.x,cy:a.y,r:4,fill:'#2fb36d'},ok);
    if(yazSeviye<3){ numaraKoy(ok,x0+a.x,a.y,i+1);
      if(L>12){const q=p.getPointAtLength(Math.min(L*.35,22)),q2=p.getPointAtLength(Math.min(L*.35,22)+3),ang=Math.atan2(q2.y-q.y,q2.x-q.x)*180/Math.PI;
        el('path',{d:'M-4 -4L2 0L-4 4',fill:'none',stroke:'#2fb36d','stroke-width':2,'stroke-linecap':'round',transform:`translate(${x0+q.x} ${q.y}) rotate(${ang})`},ok)}}
  });
  const ink=el('g',{},svg);
  const kalem=kalemOlustur(svg);
  // rehber noktaları (değerlendirme için)
  const pts=[...gizli.querySelectorAll('path')].map(p=>{const L=p.getTotalLength(),a=[];for(let s=0;s<=L;s+=2){const q=p.getPointAtLength(s);a.push([x0+q.x,q.y])}return a});
  yazGeo={svg,ink,pts,gizli,kalem,x0};
  let aktif=null, son=null;
  const nokta=e=>{const m=svg.getScreenCTM().inverse();const P=svg.createSVGPoint();P.x=e.clientX;P.y=e.clientY;const r=P.matrixTransform(m);return [r.x,r.y]};
  svg.addEventListener('pointerdown',e=>{e.preventDefault();svg.setPointerCapture(e.pointerId);const p=nokta(e);
    aktif={el:el('path',{fill:'none',stroke:'var(--kalem)','stroke-width':8,'stroke-linecap':'round','stroke-linejoin':'round',d:`M${p[0].toFixed(1)} ${p[1].toFixed(1)}l0 .1`},ink),d:`M${p[0].toFixed(1)} ${p[1].toFixed(1)}`,pts:[p]};murekkep.push(aktif.pts);son=p});
  svg.addEventListener('pointermove',e=>{if(!aktif)return;const p=nokta(e);if(Math.hypot(p[0]-son[0],p[1]-son[1])<.8)return;
    aktif.d+=`L${p[0].toFixed(1)} ${p[1].toFixed(1)}`;aktif.el.setAttribute('d',aktif.d);aktif.pts.push(p);son=p});
  const bit=()=>{aktif=null};
  svg.addEventListener('pointerup',bit);svg.addEventListener('pointercancel',bit);
}
function murekkepSil(){if(yazGeo){yazGeo.ink.innerHTML='';murekkep=[]}}
async function yazGoster(){if(!yazGeo)return;const kim=++animKimlik;const g=yazGeo.gizli;
  g.querySelectorAll('path').forEach(p=>{p.setAttribute('stroke','#ff7a3d');p.setAttribute('stroke-width',p.getAttribute('d').endsWith('l0 .1')?9:5)});
  await harfYazdir(g,yazGeo.kalem,{kimlik:kim,hiz:.9});
  if(kim===animKimlik){await bekle(600);g.querySelectorAll('path').forEach(p=>{p.setAttribute('stroke','none')})}}
function yogunlastir(cizgiler){const out=[];cizgiler.forEach(c=>{for(let i=0;i<c.length;i++){out.push(c[i]);if(i){const [a,b]=[c[i-1],c[i]],d=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.floor(d/2);for(let k=1;k<n;k++)out.push([a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n])}}});return out}
function izPuanla(rehber,cizgiler,tol){
  const u=yogunlastir(cizgiler); if(u.length<4)return {kapsama:0,isabet:0,puan:0};
  const enYakin=(p,dizi)=>{let m=1e9;for(const q of dizi){const d=(p[0]-q[0])**2+(p[1]-q[1])**2;if(d<m)m=d}return Math.sqrt(m)};
  // her kalem hareketi ayrı ayrı kaplanmalı: en zayıf parça belirleyicidir
  const kapsama=Math.min(...rehber.map(par=>par.filter(p=>enYakin(p,u)<=tol).length/par.length));
  // her parçanın başı ve sonu da yazılmış olmalı (ör. a'nın çubuğu dairenin yanında kaybolmasın)
  const uclar=rehber.flatMap(par=>par.length>2?[par[0],par[par.length-1]]:[]);
  const ucEksik=uclar.filter(p=>enYakin(p,u)>tol).length;
  const kapsamaSon=ucEksik?kapsama*Math.pow(.65,ucEksik):kapsama;
  const hepsi=rehber.flat();
  const isabet=u.filter(p=>enYakin(p,hepsi)<=tol*1.6).length/u.length;
  return {kapsama:kapsamaSon,isabet,puan:Math.min(kapsamaSon,isabet*1.05)};
}
function yazDegerlendir(){
  const h=SIRA[HI]; if(!yazGeo)return;

  const y=r.puan>=.85?3:r.puan>=.7?2:r.puan>=.5?1:0;
  const mesaj=y===3?'Harika! Tam yerinden yazdın.':y===2?'Çok güzel! Biraz daha çizgiye yakın yazalım.':y===1?'İyi bir başlangıç! Bir daha deneyelim.':(r.kapsama<.5?'Harfin her parçasını yazmayı unutma. Yeşil noktadan başla.':'Çizginin dışına taştı. Gri izin üstünden yavaşça git.');
  if(y){ilYaz(h,'yaz',y);bip('yildiz')}else bip('no');
  soyle(mesaj.split('!')[0]);
  modalAc(`<div class="sonuc-yildiz">${'⭐'.repeat(y)}${'☆'.repeat(3-y)}</div><h2 style="text-align:center">${mesaj}</h2>
   <p class="ipucu">Çizgiyi kaplama: %${Math.round(r.kapsama*100)} · Çizgide kalma: %${Math.round(r.isabet*100)}</p>
   <div class="satir"><button class="btn" onclick="modalKapat();murekkepSil()">🔁 Tekrar yaz</button>
   ${y>=2&&yazSeviye<3?`<button class="btn ana" onclick="modalKapat();yazSeviye++;pYaz()">Sonraki seviye →</button>`:''}
   ${y>=1?`<button class="btn yesil" onclick="modalKapat();sekmeAc('hece')">🧩 Heceye geç</button>`:''}</div>`);
  harfSekmeTikGuncelle();
}
function harfSekmeTikGuncelle(){const o=IL[SIRA[HI]]||{};document.querySelectorAll('#sekmeler button').forEach((b,i)=>{const k=SEKMELER[i][0];b.querySelector('.tik').textContent=o[k]?'✓'+(k==='yaz'||k==='oyun'?' '+'★'.repeat(o[k]):''):''})}

/* 5) OKU */

let OY=null;
function karistir(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pOyun(){
  const h=SIRA[HI];
  const kelimeler=kelimelerIcin(HI).filter(([k,e])=>e&&k.length<=6);
  const turlar=[];
  for(let r=0;r<6;r++){
    const t=['ses','ilk','kur'][r%3];
    if(t==='kur'&&kelimeler.length) turlar.push('kur');
    else if(t==='ses'&&tumHeceler(HI).length>=2) turlar.push('ses');
    else turlar.push('ilk');
  }
  OY={h,turlar,i:0,dogru:0,kelimeler};
  oyunTur();
}
function oyunTur(){
  const O=OY; if(O.i>=O.turlar.length)return oyunBitti();
  const n=sikSayisi(), tur=O.turlar[O.i], ilerle=`<div class="ilerle"><i style="width:${O.i/O.turlar.length*100}%"></i></div>`;
  let ust='', alt='';
  if(tur==='ses'){
    const tum=tumHeceler(HI), yeni=heceler(HI); const hedef=karistir(yeni.length?yeni:tum)[0];
    const siklar=karistir([hedef,...karistir(tum.filter(x=>x!==hedef)).slice(0,n-1)]);
    O.cevap=hedef; O.dinle=()=>soyle(hedef,.7);
    ust=`<div class="soru"><div class="yon">👂 Duyduğun heceye dokun</div><button class="btn ana" onclick="OY.dinle()">🔊 Tekrar dinle</button></div>`;
    alt=`<div class="sik-satir">${siklar.map(s=>`<button class="sik okuma" onclick="oyunCevap(this,'${s}')">${s}</button>`).join('')}</div>`;
  } else if(tur==='ilk'){
    const bil=[...bilinen(HI)].filter(x=>x!=='ğ');
    const adaylar=bil.map(x=>[x,ANAHTAR[x]]).filter(([x,[k]])=>k[0]===x);
    let [hedef,[kel,emo]]=(Math.random()<.5&&ANAHTAR[O.h][0][0]===O.h)?[O.h,ANAHTAR[O.h]]:karistir(adaylar)[0];
    const havuz=karistir(SIRA.filter(x=>x!==hedef&&x!=='ğ'&&(bil.includes(x)||bil.length<n+1)));
    const siklar=karistir([hedef,...havuz.slice(0,n-1)]);
    O.cevap=hedef; O.dinle=()=>soyle(kel,.8);
    ust=`<div class="soru"><div class="yon">🔎 Bu kelime hangi sesle başlıyor?</div><div class="emo">${emo}</div><button class="btn ana" onclick="OY.dinle()">🔊 ${kel}</button></div>`;
    alt=`<div class="sik-satir">${siklar.map(s=>`<button class="sik okuma" onclick="oyunCevap(this,'${s}')">${s}</button>`).join('')}</div>`;
  } else {
    const [kel,emo]=karistir(O.kelimeler)[0];
    let taslar=[...kel]; if(sinif()!=='ana'){const ek=karistir([...bilinen(HI)].filter(x=>!kel.includes(x)&&x!=='ğ'))[0];if(ek)taslar.push(ek)}
    O.cevap=kel; O.dolu=''; O.dinle=()=>soyle(kel,.8);
    ust=`<div class="soru"><div class="yon">🧩 Kelimeyi harflerle kur</div><div class="emo">${emo}</div><button class="btn ana" onclick="OY.dinle()">🔊 Dinle</button>
      <div class="yuva-satir okuma">${[...kel].map((_,i)=>`<span class="yuva" id="yv${i}"></span>`).join('')}</div></div>`;
    alt=`<div class="sik-satir">${karistir(taslar).map((t,i)=>`<button class="tas okuma" onclick="tasSec(this,'${t}')">${t}</button>`).join('')}</div>
      <div class="kontrol"><button class="btn" onclick="tasSifirla()">↺ Baştan</button></div>`;
  }
  panel().innerHTML=ilerle+ust+alt;
  setTimeout(()=>O.dinle(),300);
}
function oyunCevap(b,s){
  if(b.disabled)return;
  if(s===OY.cevap){b.classList.add('dogru');bip('ok');OY.dogru+=OY.hata?0:1;OY.hata=0;document.querySelectorAll('.sik').forEach(x=>x.disabled=true);setTimeout(()=>{OY.i++;oyunTur()},900)}

}
function tasSec(b,t){

  if(t===beklenen){OY.dolu+=t;document.getElementById('yv'+i).textContent=t;b.classList.add('kul');soyle(t==='ğ'?'yumuşak ge':t,1);

    try{const r=await fetch(`${TAB}/${AYAR.koleksiyon}${k?'?'+k:''}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:f})});
      if(!r.ok)throw 0; const j=await r.json(); docAd=j.name; bekleyenGonder();
    }catch(e){const q=ls.get('zirve_giris_bekleyen',[]);q.push({fields:f});ls.set('zirve_giris_bekleyen',q.slice(-50))}
  }
  async function bekleyenGonder(){const q=ls.get('zirve_giris_bekleyen',[]);if(!q.length)return;const kalan=[];
    for(const b of q){try{const r=await fetch(`${TAB}/${AYAR.koleksiyon}${k?'?'+k:''}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)throw 0}catch(e){kalan.push(b)}}
    ls.set('zirve_giris_bekleyen',kalan)}
  async function sonGoruldu(){
    if(!docAd||document.hidden)return;
    const yol=`https://firestore.googleapis.com/v1/${docAd}?updateMask.fieldPaths=son&updateMask.fieldPaths=ilerleme${k?'&'+k:''}`;
    try{await fetch(yol,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:{son:tv(new Date()),ilerleme:sv(ilerleme)}})})}catch(e){}
  }
  setInterval(sonGoruldu,120000);
  let ilerT=null;
  function ilerlemeGonder(s){ilerleme=s;clearTimeout(ilerT);ilerT=setTimeout(sonGoruldu,4000)}
  async function listele(){
    const r=await fetch(`${TAB}:runQuery${k?'?'+k:''}`,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({structuredQuery:{from:[{collectionId:AYAR.koleksiyon}],orderBy:[{field:{fieldPath:'giris'},direction:'DESCENDING'}],limit:800}})});
    if(!r.ok)throw new Error('Liste alınamadı ('+r.status+')');
    const j=await r.json(); const deg=v=>v?(v.stringValue??v.timestampValue??v.integerValue??''):'';
    return j.filter(x=>x.document).map(x=>{const f=x.document.fields||{};const o={};for(const a in f)o[a]=deg(f[a]);return o});
  }
  const css=`.zg-ort{position:fixed;inset:0;z-index:9500;display:flex;align-items:center;justify-content:center;padding:1rem;background:radial-gradient(circle at 30% 20%,#3a2a6b,#120f24 70%)}

  .zg-iki{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}

  .zg-ozet div{background:#f6f3ff;border-radius:1rem;padding:.6rem;text-align:center;font-weight:900;font-size:1.4rem}.zg-ozet small{display:block;font-size:.75rem;color:#6a6789}
  .zg-filtre{display:flex;gap:.4rem;flex-wrap:wrap}.zg-filtre>*{flex:1 1 8rem;width:auto!important;font-size:.95rem!important;padding:.45rem .6rem!important}
  .zg-tablo{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.6rem}.zg-tablo th,.zg-tablo td{border-bottom:1px solid #eee;padding:.4rem .3rem;text-align:left}
  .zg-tablo th{background:#f6f3ff;position:sticky;top:0}.zg-on{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;background:#2fb36d;margin-right:.3rem}
  .zg-ust{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}.zg-ust .zg-b{width:auto;margin:0;padding:.5rem .8rem;font-size:.9rem}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  function ort(html,renk){const d=document.createElement('div');d.className='zg-ort';d.style.setProperty('--zg',renk||'#7b4dff');d.innerHTML=html;
    d.addEventListener('keydown',e=>e.stopPropagation());d.addEventListener('keyup',e=>e.stopPropagation());document.body.appendChild(d);return d}
  const TR=/^[A-Za-zÇĞİÖŞÜçğıöşüÂâÎîÛû' -]{2,}$/;
  const basHarf=s=>s.trim().split(/\s+/).map(w=>w.charAt(0).toLocaleUpperCase('tr-TR')+w.slice(1).toLocaleLowerCase('tr-TR')).join(' ');
  function form(renk,coz){
    const d=ort(`<div class="zg-kart"><h2>✏️ Harf Yolculuğu</h2><p>Başlamadan önce kendini tanıt.</p>
      <div class="zg-iki"><div><label>Adın</label><input id="zgAd" autocomplete="given-name"></div><div><label>Soyadın</label><input id="zgSoyad" autocomplete="family-name"></div></div>
      <div class="zg-iki"><div><label>Sınıfın</label><select id="zgSinif"><option value="">Seç</option><option>Anaokulu</option>${Array.from({length:12},(_,i)=>`<option>${i+1}</option>`).join('')}<option>Öğretmen</option></select></div>
      <div><label>Şuben</label><select id="zgSube"><option value="">Seç</option>${'ABCDEFGH'.split('').map(s=>`<option>${s}</option>`).join('')}</select></div></div>
      <div class="zg-hata" id="zgHata"></div>
      <button class="zg-b" id="zgTamam">Başla 🚀</button>
      <div class="zg-iki"><button class="zg-b ik" id="zgPanel">👩‍🏫 Öğretmen Paneli</button><button class="zg-b ik" id="zgSite">🏠 Siteye Dön</button></div></div>`,renk);
    d.querySelector('#zgPanel').onclick=()=>panelAc(); d.querySelector('#zgSite').onclick=()=>window.ZIRVE_siteyeDon&&ZIRVE_siteyeDon();
    d.querySelector('#zgTamam').onclick=()=>{
      const ad=d.querySelector('#zgAd').value.trim(), soyad=d.querySelector('#zgSoyad').value.trim(), sinif=d.querySelector('#zgSinif').value, sube=d.querySelector('#zgSube').value, h=d.querySelector('#zgHata');
      if(!TR.test(ad))return h.textContent='Adını yaz (en az 2 harf).';
      if(!TR.test(soyad))return h.textContent='Soyadını yaz (en az 2 harf).';
      if(!sinif)return h.textContent='Sınıfını seç.'; if(!sube)return h.textContent='Şubeni seç.';
      const o={ad:basHarf(ad),soyad:soyad.toLocaleUpperCase('tr-TR'),sinif,sube};
      ls.set('zirve_ogrenci',o); d.remove(); coz(o);
    };
  }
  function baslat({oyun,renk}){
    oyunAdi=oyun; window.EGT&&(EGT.mesgul=true);
    return new Promise(coz=>{
      const bitir=o=>{API.ogrenci=o;window.EGT&&(EGT.mesgul=false);kaydet(o);coz(o)};
      const kayit=ls.get('zirve_ogrenci',null);
      if(kayit&&kayit.ad){
        const d=ort(`<div class="zg-kart" style="text-align:center"><h2>Tekrar hoş geldin! 👋</h2><p style="font-size:1.3rem;color:#2b2a4a">${kayit.ad} ${kayit.soyad}<br><small>${kayit.sinif}${kayit.sinif==='Anaokulu'||kayit.sinif==='Öğretmen'?'':'. sınıf'} · ${kayit.sube} şubesi</small></p>
          <button class="zg-b" id="zgEvet">Evet, benim ✔</button><button class="zg-b ik" id="zgHayir">Ben değilim</button>
          <div class="zg-iki"><button class="zg-b ik" id="zgPanel">👩‍🏫 Öğretmen Paneli</button><button class="zg-b ik" id="zgSite">🏠 Siteye Dön</button></div></div>`,renk);
        d.querySelector('#zgEvet').onclick=()=>{d.remove();bitir(kayit)};
        d.querySelector('#zgHayir').onclick=()=>{d.remove();ls.set('zirve_ogrenci',null);form(renk,bitir)};
        d.querySelector('#zgPanel').onclick=()=>panelAc(); d.querySelector('#zgSite').onclick=()=>window.ZIRVE_siteyeDon&&ZIRVE_siteyeDon();
      } else form(renk,bitir);
    });
  }
  function panelAc(){
    if(!ls.get('zirve_ogretmen_ok',false)){

    let veri=[];
    const fmt=s=>{if(!s)return '';const t=new Date(s);return isNaN(t)?s:t.toLocaleString('tr-TR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})};

    function suz(){const a=d.querySelector('#zgAra').value.toLocaleLowerCase('tr-TR'),fo=d.querySelector('#zgFo').value,fs=d.querySelector('#zgFs').value,fc=d.querySelector('#zgFc').value;
      return veri.filter(v=>(!a||(v.ad+' '+v.soyad).toLocaleLowerCase('tr-TR').includes(a))&&(!fo||v.oyun===fo)&&(!fs||v.sinif===fs)&&(!fc||v.cihaz===fc))}
    function ciz(){
      const l=suz(), simdi=Date.now(), bugun=new Date().toDateString();
      const cevrim=l.filter(v=>simdi-new Date(v.son)<5*60000).length, farkli=new Set(l.map(v=>v.ad+'|'+v.soyad+'|'+v.sinif)).size, bg=l.filter(v=>new Date(v.giris).toDateString()===bugun).length;
      const cs={};l.forEach(v=>cs[v.cihaz]=(cs[v.cihaz]||0)+1);
      d.querySelector('#zgOz').innerHTML=`<div>${l.length}<small>Toplam giriş</small></div><div>${farkli}<small>Farklı öğrenci</small></div><div>${cevrim}<small>Şu an oyunda</small></div><div>${bg}<small>Bugün</small></div>`+Object.entries(cs).map(([c,n])=>`<div>${ikon[c]||'❔'} ${n}<small>${c}</small></div>`).join('');
      d.querySelector('#zgListe').innerHTML=`<table class="zg-tablo"><tr><th>Öğrenci</th><th>Sınıf</th><th>Oyun</th><th>İlerleme</th><th>Cihaz</th><th>Giriş</th><th>Son görülme</th></tr>${l.map(v=>`<tr><td>${simdi-new Date(v.son)<5*60000?'<span class="zg-on"></span>':''}${v.ad} ${v.soyad}</td><td>${v.sinif}-${v.sube}</td><td>${v.oyun}</td><td>${v.ilerleme||''}</td><td>${ikon[v.cihaz]||''} ${v.cihaz} · ${v.os} · ${v.tarayici}</td><td>${fmt(v.giris)}</td><td>${fmt(v.son)}</td></tr>`).join('')}</table>`;
    }
    async function yukle(){d.querySelector('#zgListe').textContent='Yükleniyor…';
      try{veri=await listele();
        const dold=(id,al)=>{const s=d.querySelector(id),v=s.value;s.innerHTML=s.options[0].outerHTML+[...new Set(veri.map(x=>x[al]).filter(Boolean))].sort().map(x=>`<option>${x}</option>`).join('');s.value=v};
        dold('#zgFo','oyun');dold('#zgFs','sinif');dold('#zgFc','cihaz');ciz();
      }catch(e){d.querySelector('#zgListe').innerHTML=`<p class="zg-hata">${e.message||'İnternet bağlantısını kontrol et.'}</p>`}}
    ['#zgAra','#zgFo','#zgFs','#zgFc'].forEach(s=>d.querySelector(s).addEventListener('input',ciz));
    d.querySelector('#zgYen').onclick=yukle; d.querySelector('#zgKap').onclick=()=>d.remove();
    d.querySelector('#zgUnut').onclick=()=>{ls.set('zirve_ogretmen_ok',false);d.remove()};
    d.querySelector('#zgKop').onclick=()=>{const l=suz();const t=['Ad\tSoyad\tSınıf\tŞube\tOyun\tİlerleme\tCihaz\tOS\tTarayıcı\tGiriş\tSon'].concat(l.map(v=>[v.ad,v.soyad,v.sinif,v.sube,v.oyun,v.ilerleme||'',v.cihaz,v.os,v.tarayici,fmt(v.giris),fmt(v.son)].join('\t'))).join('\n');
      navigator.clipboard.writeText(t).then(()=>toast('📋 Kopyalandı — Excel\'e yapıştırabilirsin'))};
    yukle();
  }
  const API={baslat,panelAc,cihaz,ayar:AYAR,ogrenci:null,ilerlemeGonder};
  window.ZGIRIS=API;
})();

const MODULLER=['harfYazdir','izPuanla','sovBaslat','pYaz','pOyun','pOku','pHece','siteyeDon','cocukBoyuUygula','initPWA','qrAc'];
function modulKontrol(){const ok=MODULLER.filter(f=>typeof window[f]==='function').length;
  const veri=SIRA.length===29&&SIRA.every(h=>KUCUK[h]&&BUYUK[h]&&ANAHTAR[h]);return {ok,top:MODULLER.length,veri}}
function surumDetay(){const m=modulKontrol(),fark=APP.satir-APP.onceki.satir;
  modalAc(`<h2>📦 Sürüm v${APP.surum}</h2><p>Önceki: v${APP.onceki.surum} · ${APP.onceki.satir} satır → şimdi ${APP.satir} satır (${fark>=0?'+':''}${fark}) · ${APP.kb} KB</p>
  <p><b>Yenilikler</b></p><ol>${APP.yenilikler.map(y=>`<li>${y}</li>`).join('')}</ol>
  <p>🧪 Modüller: ${m.ok}/${m.top} ${m.ok===m.top?'✅':'❌'} · Harf verisi: ${m.veri?'✅ 29/29 harf':'❌ eksik'}</p>
  <div class="satir"><button class="btn ana" onclick="modalKapat()">Tamam</button></div>`)}
function acilisBildirimi(){let eski=null;try{eski=localStorage.getItem('anetil_surum');localStorage.setItem('anetil_surum',APP.surum)}catch(e){}
  const m=modulKontrol();toast(eski!==APP.surum?`🆕 v${APP.surum} · Kod: ${APP.onceki.satir}→${APP.satir} satır · 🧪 ${m.ok}/${m.top} modül sağlam`:`✅ v${APP.surum} · en güncel sürüm`,3200)}
let surumDamga=null;
async function surumAl(){try{const u=location.href.split('#')[0].split('?')[0]+'?_v='+Date.now();let r=await fetch(u,{method:'HEAD',cache:'no-store'});if(!r.ok)r=await fetch(u,{cache:'no-store'});return r.headers.get('ETag')||r.headers.get('Last-Modified')}catch(e){return null}}
async function surumBaslat(){if(!/^https?:/.test(location.protocol))return;surumDamga=await surumAl();
  const kontrol=async()=>{const d=await surumAl();if(d&&surumDamga&&d!==surumDamga&&!document.getElementById('yeniSurum')){const b=document.createElement('button');b.id='yeniSurum';b.textContent='🔴 Yeni sürüm yayınlandı · Yenile';
    b.style.cssText='position:fixed;top:.6rem;right:.6rem;z-index:9900;background:#e5534b;color:#fff;border-radius:1rem;padding:.5rem .9rem;font-size:.9rem;animation:zipla 1.2s infinite';b.onclick=()=>location.href=location.href.split('?')[0]+'?_r='+Date.now();document.body.appendChild(b)}};
  setInterval(kontrol,120000);addEventListener('focus',kontrol);document.addEventListener('visibilitychange',()=>{if(!document.hidden)kontrol()})}

/* klavye: ← → harf değiştir, Esc menü */
addEventListener('keydown',e=>{
  if(document.querySelector('.zg-ort'))return;
  if(e.key==='Escape'){if(document.getElementById('modal').classList.contains('acik'))modalKapat();else if(!document.getElementById('sMenu').classList.contains('acik'))menuyeDon()}
  if(document.getElementById('sHarf').classList.contains('acik')){if(e.key==='ArrowRight')harfKaydir(1);if(e.key==='ArrowLeft')harfKaydir(-1);
    const n=parseInt(e.key);if(n>=1&&n<=6)sekmeAc(SEKMELER[n-1][0]);}
});
let yenidenBoyut=null;
addEventListener('resize',()=>{clearTimeout(yenidenBoyut);yenidenBoyut=setTimeout(()=>{olcekUygula();if(document.getElementById('sSov').classList.contains('acik')&&!SOV.calisiyor)sovTablo()},250)});

/* AÇILIŞ */
olcekUygula(); cocukBoyuUygula(); initPWA(); menuCiz(); ekranGoster('sMenu');
ZGIRIS.baslat({oyun:'Harf Yolculuğu (ANETİL)',renk:'#ff7a3d'}).then(()=>{
  ZGIRIS.ilerlemeGonder(ilerlemeOzet()); menuCiz(); acilisBildirimi(); surumBaslat();
  let g=null;try{g=localStorage.getItem('anetil_karsilama')}catch(e){} if(!g)karsilamaAc();
});
