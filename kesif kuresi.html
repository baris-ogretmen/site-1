<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b1a;--panel:rgba(15,22,48,.82);--panel2:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);
  --tx:#f1f5ff;--tx2:#a9b6d8;--ac:#22d3ee;--ac2:#f472b6;--gold:#fbbf24;--ok:#34d399;--no:#fb7185;--tr:#e11d48;
  --r:18px;--ui:1;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:Nunito,system-ui,-apple-system,'Segoe UI',sans-serif}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:Nunito,system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
@media print{html{zoom:1!important}}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
#gl:active{cursor:grabbing}
#ui{position:fixed;inset:0;pointer-events:none;zoom:var(--ui)}
#ui>*{pointer-events:auto}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;font-weight:800;font-size:12px;color:#fff;text-shadow:0 1px 3px #000,0 0 8px rgba(0,0,0,.7);transition:opacity .25s;will-change:transform}
.lb.kita{font-family:'Baloo 2',Nunito,system-ui,sans-serif;font-size:19px;letter-spacing:.06em;text-transform:uppercase;color:#fff;opacity:.92}
.lb.okyanus{font-style:italic;font-size:14px;color:#9fd6ff;letter-spacing:.12em}
.lb.tr{color:#fff;background:var(--tr);padding:2px 8px;border-radius:10px;font-size:12px;text-shadow:none;box-shadow:0 2px 10px rgba(225,29,72,.6)}
.lb.sec{background:var(--gold);color:#1b1300;padding:3px 10px;border-radius:12px;font-size:14px;text-shadow:none;box-shadow:0 0 0 3px rgba(251,191,36,.35),0 6px 18px rgba(0,0,0,.5)}
.lb.ulke{font-size:11px;font-weight:700;color:#eef3ff;opacity:.9}
.lb.il{font-size:11px;font-weight:800;color:#fff}
.lb.il b{display:block;text-align:center;font-size:10px;color:#fde68a}
.lb.deniz{font-style:italic;color:#bae6fd;font-size:13px;letter-spacing:.1em}
.lb.ucak{font-size:22px;text-shadow:none;filter:drop-shadow(0 2px 4px #000)}

/* üst bar */
#top{position:absolute;left:0;right:0;top:0;padding:calc(10px + var(--safe-t)) 12px 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:linear-gradient(180deg,rgba(7,11,26,.85),rgba(7,11,26,0));pointer-events:none}
#top>*{pointer-events:auto}
.logo{font-family:'Baloo 2',Nunito,system-ui,sans-serif;font-weight:800;font-size:22px;display:flex;align-items:center;gap:6px;letter-spacing:.01em;margin-right:4px}
.logo span{background:linear-gradient(90deg,#22d3ee,#a78bfa,#f472b6,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.seg button{border:0;background:transparent;color:var(--tx2);font:800 15px Nunito,system-ui,sans-serif;padding:8px 14px;border-radius:999px;cursor:pointer;display:flex;gap:6px;align-items:center}
.seg button.on{background:linear-gradient(135deg,#22d3ee,#6366f1);color:#fff;box-shadow:0 4px 14px rgba(34,211,238,.35)}
.seg button.on.trm{background:linear-gradient(135deg,#e11d48,#f97316)}
.ara{position:relative;flex:1;min-width:180px;max-width:380px}
.ara input{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--tx);border-radius:999px;padding:10px 38px 10px 38px;font:700 15px Nunito,system-ui,sans-serif;outline:none;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.ara input:focus{border-color:var(--ac)}
.ara .ik{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.7}
.ara .x{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:rgba(255,255,255,.12);color:#fff;width:24px;height:24px;border-radius:50%;cursor:pointer;display:none}
.oneri{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#0f1733;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:none;max-height:50vh;overflow-y:auto;z-index:5;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.oneri div{padding:10px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;font-weight:700}
.oneri div:hover,.oneri div.on{background:rgba(34,211,238,.15)}
.oneri small{color:var(--tx2);margin-left:auto;font-weight:700}

/* sağ araç çubuğu */
#arac{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}
.ab{width:50px;height:50px;border-radius:16px;border:1px solid var(--line);background:var(--panel);color:#fff;font-size:22px;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);position:relative;transition:transform .15s,background .2s}
.ab:active{transform:scale(.92)}
.ab.on{background:rgba(34,211,238,.25);border-color:rgba(34,211,238,.6)}
.ab.big{background:linear-gradient(135deg,#f472b6,#f59e0b);border:0;box-shadow:0 6px 20px rgba(244,114,182,.45);width:58px;height:58px;font-size:27px}
.ab[data-tip]:hover::after{content:attr(data-tip);position:absolute;right:60px;top:50%;transform:translateY(-50%);background:#0b1230;border:1px solid var(--line);padding:6px 10px;border-radius:10px;font:800 13px Nunito,system-ui,sans-serif;white-space:nowrap}

/* alt soluk menü */
#altmenu{position:absolute;left:10px;bottom:calc(10px + var(--safe-b));display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sb{border:1px solid var(--line);background:rgba(15,22,48,.6);color:var(--tx2);font:800 12px Nunito,system-ui,sans-serif;padding:7px 10px;border-radius:999px;cursor:pointer;opacity:.62;transition:opacity .2s;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;gap:5px;align-items:center}
.sb:hover{opacity:1}
.sb .zx{margin-left:2px;opacity:.7;font-size:11px;padding:0 3px}
#rozet{color:#86efac}

/* bilgi paneli */
#panel{position:absolute;right:72px;top:calc(76px + var(--safe-t));width:min(400px,calc(100vw - 92px));max-height:calc(100vh - 160px - var(--safe-t));overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 20px 50px rgba(0,0,0,.5);transform:translateX(30px);opacity:0;pointer-events:none;transition:.3s cubic-bezier(.2,.8,.2,1)}
#panel.ac{transform:none;opacity:1;pointer-events:auto}
@media (max-width:760px){
  #panel{left:8px;right:8px;width:auto;top:auto;bottom:calc(8px + var(--safe-b));max-height:52vh;transform:translateY(40px);border-radius:24px 24px 18px 18px}
  #arac{top:auto;bottom:calc(62px + var(--safe-b));transform:none}
  .ab{width:44px;height:44px;font-size:19px;border-radius:14px}.ab.big{width:52px;height:52px}
  .logo{font-size:18px}.seg button{padding:7px 10px;font-size:13px}
  .ara{order:5;min-width:100%;max-width:none}
  #altmenu{flex-wrap:nowrap;right:66px;overflow-x:auto;scrollbar-width:none}
  #altmenu .t{display:none}
  .sb{padding:7px 9px;flex:none}
  body.panelacik #altmenu,body.panelacik #bolgeler{display:none!important}
  #bolgeler{right:10px;bottom:calc(52px + var(--safe-b))}
}
.ph{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.bayrak{width:64px;height:44px;border-radius:8px;object-fit:cover;box-shadow:0 4px 12px rgba(0,0,0,.4);background:#222;display:grid;place-items:center;font-size:38px;flex:none;overflow:hidden}
.ph h2{margin:0;font:800 23px 'Baloo 2',Nunito,system-ui,sans-serif;line-height:1.1}
.ph .alt{color:var(--tx2);font-weight:700;font-size:13px}
.kapat{margin-left:auto;align-self:flex-start;border:0;background:rgba(255,255,255,.1);color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;flex:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.kv{background:var(--panel2);border-radius:14px;padding:9px 11px}
.kv.tam{grid-column:1/-1}
.kv b{display:block;font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.kv span{font-weight:800;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;font:800 13px Nunito,system-ui,sans-serif;padding:6px 10px;border-radius:999px;cursor:pointer}
.chip:hover{background:rgba(34,211,238,.2)}
.uzak{background:linear-gradient(135deg,rgba(34,211,238,.18),rgba(99,102,241,.18));border:1px solid rgba(34,211,238,.35);border-radius:16px;padding:12px;margin:10px 0;display:flex;gap:12px;align-items:center}
.uzak .km{font:800 26px 'Baloo 2',Nunito,system-ui,sans-serif;color:#67e8f9;line-height:1}
.uzak small{color:var(--tx2);font-weight:700}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{border:0;border-radius:14px;padding:11px 14px;font:800 14px Nunito,system-ui,sans-serif;cursor:pointer;color:#fff;background:rgba(255,255,255,.1);display:inline-flex;gap:6px;align-items:center;text-decoration:none}
.btn.p{background:linear-gradient(135deg,#22d3ee,#6366f1)}
.btn.g{background:linear-gradient(135deg,#f472b6,#f59e0b)}
.btn.y{background:linear-gradient(135deg,#10b981,#059669)}
.btn:active{transform:scale(.96)}
.not{font-size:13px;color:var(--tx2);font-weight:700;line-height:1.45;margin-top:8px}
.meshur{background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);border-radius:14px;padding:10px 12px;font-weight:700;line-height:1.45;margin:8px 0}
.bolgetag{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:800;font-size:12px;color:#fff}
.plaka{display:inline-flex;align-items:center;border:2px solid #111;background:#fff;color:#111;border-radius:6px;font:800 18px 'Baloo 2',system-ui,system-ui,sans-serif;overflow:hidden;height:34px}
.plaka i{background:#1d4ed8;color:#fff;font-style:normal;font-size:10px;padding:0 5px;height:100%;display:grid;place-items:center;line-height:1}
.plaka span{padding:0 10px}
.inp{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;border-radius:12px;padding:10px 12px;font:700 14px Nunito,system-ui,sans-serif;outline:none}

/* bölge şeridi (Türkiye) */
#bolgeler{position:absolute;left:10px;right:76px;bottom:calc(52px + var(--safe-b));display:none;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
#bolgeler::-webkit-scrollbar{display:none}
#bolgeler button{flex:none;border:0;border-radius:999px;padding:8px 12px;font:800 13px Nunito,system-ui,sans-serif;color:#fff;cursor:pointer;opacity:.9;box-shadow:0 3px 10px rgba(0,0,0,.35)}
#bolgeler button.on{outline:3px solid #fff;opacity:1}

/* oyun HUD */
#hud{position:absolute;left:50%;top:calc(70px + var(--safe-t));transform:translateX(-50%);width:min(560px,calc(100vw - 20px));background:linear-gradient(135deg,rgba(99,102,241,.92),rgba(236,72,153,.92));border-radius:22px;padding:12px 14px;display:none;box-shadow:0 14px 40px rgba(0,0,0,.45);text-align:center}
@media (max-width:760px){#hud{top:calc(112px + var(--safe-t))}}
#hud .ust{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px;opacity:.95}
#hud .soru{font:800 22px 'Baloo 2',Nunito,system-ui,sans-serif;margin:4px 0 2px;line-height:1.2}
#hud .ipucu{font-weight:700;font-size:14px;min-height:20px;color:#fff7d6}
#hud .bar{height:6px;background:rgba(255,255,255,.25);border-radius:9px;overflow:hidden;margin-top:6px}
#hud .bar i{display:block;height:100%;background:#fde047;width:0;transition:width .4s}
#hud .cik{border:0;background:rgba(0,0,0,.25);color:#fff;font:800 12px Nunito,system-ui,sans-serif;padding:5px 10px;border-radius:999px;cursor:pointer}
#secenek{position:absolute;left:50%;bottom:calc(16px + var(--safe-b));transform:translateX(-50%);width:min(620px,calc(100vw - 20px));display:none;grid-template-columns:1fr 1fr;gap:10px}
#secenek button{border:0;border-radius:18px;padding:16px 12px;font:800 18px 'Baloo 2',system-ui,Nunito,system-ui,sans-serif;color:#13203f;background:#fff;cursor:pointer;box-shadow:0 6px 0 #c7d2fe,0 10px 24px rgba(0,0,0,.35);transition:transform .1s;min-height:64px;display:flex;align-items:center;justify-content:center;gap:8px;line-height:1.15}
#secenek button:active{transform:translateY(3px);box-shadow:0 3px 0 #c7d2fe}
#secenek button.dogru{background:#34d399;color:#04281b;box-shadow:0 6px 0 #059669}
#secenek button.yanlis{background:#fb7185;color:#3a0610;box-shadow:0 6px 0 #be123c;animation:sallan .4s}
#secenek img{width:46px;height:32px;object-fit:cover;border-radius:5px}
@keyframes sallan{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.buyukbayrak{display:block;margin:6px auto 2px;height:70px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.buyukemoji{font-size:64px;line-height:1.1}

/* modal */
.modal{position:fixed;inset:0;background:rgba(3,6,18,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:50;padding:14px;zoom:var(--ui)}
.modal.ac{display:flex}
.kart{background:linear-gradient(180deg,#121a3a,#0b1128);border:1px solid var(--line);border-radius:26px;padding:20px;width:min(720px,100%);max-height:calc(100vh - 40px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:gir .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes gir{from{transform:scale(.9) translateY(20px);opacity:0}}
.kart h2{margin:0 0 4px;font:800 26px 'Baloo 2',Nunito,system-ui,sans-serif}
.kart .alt{color:var(--tx2);font-weight:700;margin-bottom:12px}
.oyunlar{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.oy{border:0;border-radius:20px;padding:14px 10px;color:#fff;cursor:pointer;text-align:center;position:relative;font-family:Nunito;transition:transform .15s}
.oy:hover{transform:translateY(-3px)}
.oy .e{font-size:40px;display:block}
.oy b{display:block;font:800 17px 'Baloo 2',Nunito,system-ui,sans-serif;margin-top:4px}
.oy small{display:block;font-weight:700;opacity:.9;font-size:12px;margin-top:2px}
.oy .rek{position:absolute;top:8px;right:10px;font-size:11px;font-weight:800;background:rgba(0,0,0,.25);padding:2px 7px;border-radius:999px}
.oy.kilit{filter:grayscale(.7);opacity:.6}
.sekme{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sekme button{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--tx2);font:800 14px Nunito,system-ui,sans-serif;padding:8px 12px;border-radius:999px;cursor:pointer}
.sekme button.on{background:#fff;color:#111}
.bk{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.bkart{border-radius:20px;padding:14px;color:#fff;cursor:pointer;position:relative;overflow:hidden}
.bkart h3{margin:0 0 6px;font:800 19px 'Baloo 2',Nunito,system-ui,sans-serif;display:flex;gap:8px;align-items:center}
.bkart ul{margin:0;padding-left:18px;font-weight:700;font-size:13.5px;line-height:1.5}
.bkart .go{position:absolute;right:12px;top:12px;font-size:12px;font-weight:800;background:rgba(0,0,0,.25);padding:3px 8px;border-radius:999px}
.sinifsec{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.sinifsec button{border:2px solid var(--line);background:rgba(255,255,255,.05);color:#fff;border-radius:16px;padding:14px 6px;font:800 16px Nunito,system-ui,sans-serif;cursor:pointer}
.sinifsec button.on{border-color:var(--gold);background:rgba(251,191,36,.2)}
.adimlar{counter-reset:a;list-style:none;padding:0;margin:10px 0}
.adimlar li{counter-increment:a;display:flex;gap:12px;align-items:flex-start;padding:9px 0;font-weight:700;line-height:1.4}
.adimlar li::before{content:counter(a);flex:none;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#22d3ee,#a78bfa);display:grid;place-items:center;font-weight:800}
.son{text-align:center}
.son .yildiz{font-size:56px;letter-spacing:6px;margin:8px 0}
.son .puan{font:800 40px 'Baloo 2',system-ui,sans-serif;color:var(--gold)}

/* giriş/intro */
#intro{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;padding:0 16px calc(40px + var(--safe-b));z-index:20;pointer-events:none;zoom:var(--ui)}
#intro.ac{display:flex}
#intro .ik{pointer-events:auto;text-align:center;background:rgba(10,15,38,.55);border:1px solid var(--line);border-radius:28px;padding:20px 26px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);max-width:560px;animation:gir .6s}
#intro h1{margin:0;font:800 clamp(34px,7vw,56px) 'Baloo 2',Nunito,system-ui,sans-serif;line-height:1;background:linear-gradient(90deg,#22d3ee,#a78bfa,#f472b6,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent}
#intro p{color:var(--tx2);font-weight:700;margin:8px 0 16px}
#intro .btn{font-size:20px;padding:16px 30px;border-radius:20px}

#toast{position:fixed;left:50%;top:calc(120px + var(--safe-t));bottom:auto;--x:calc(90px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:#0f1733;border:1px solid var(--line);padding:11px 16px;border-radius:14px;font-weight:800;opacity:0;transition:.3s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
#toast.ac{opacity:1;transform:translateX(-50%)}
#konfeti{position:fixed;inset:0;pointer-events:none;z-index:55}
#banner{position:fixed;left:50%;top:calc(8px + var(--safe-t));transform:translateX(-50%);z-index:45;background:rgba(6,78,59,.92);border:1px solid #34d399;color:#d1fae5;padding:8px 14px;border-radius:14px;font-weight:800;font-size:13px;display:none;gap:10px;align-items:center;max-width:94vw}
#banner button{border:0;background:transparent;color:#fff;cursor:pointer;font-size:14px}
#yeniSurum{position:fixed;right:10px;top:calc(10px + var(--safe-t));z-index:46;display:none;background:#dc2626;color:#fff;border:0;border-radius:999px;padding:8px 14px;font:800 13px Nunito,system-ui,sans-serif;cursor:pointer;animation:nabiz 1.4s infinite}
@keyframes nabiz{50%{box-shadow:0 0 0 10px rgba(220,38,38,0)}0%{box-shadow:0 0 0 0 rgba(220,38,38,.6)}}
table.mod{width:100%;border-collapse:collapse;font-size:13px;font-weight:700}
table.mod td{padding:5px 6px;border-bottom:1px solid var(--line)}
.qrkutu{background:#fff;padding:16px;border-radius:16px;display:inline-block}
body.oyunda #altmenu,body.oyunda #bolgeler{display:none!important}
</style>
</head>

</div>

</div></div>

function mesafe(a,b){ // [lat,lon]
  const R=6371, dLa=(b[0]-a[0])*D2R, dLo=(b[1]-a[1])*D2R;
  const h=Math.sin(dLa/2)**2+Math.cos(a[0]*D2R)*Math.cos(b[0]*D2R)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));
}

  return (Math.atan2(y,x)*R2D+360)%360;
}

}

function renkAyar(hex,amt){let c=parseInt(hex.slice(1),16);let r=c>>16,g=c>>8&255,b=c&255;
  if(amt>0){r+=(255-r)*amt;g+=(255-g)*amt;b+=(255-b)*amt}else{r*=1+amt;g*=1+amt;b*=1+amt}
  return `rgb(${r|0},${g|0},${b|0})`}
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
function dunyaCiz(){
  const Wd=texCan.width,H=texCan.height,sx=Wd/360,sy=H/180;
  const gr=tctx.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,'#123a6b');gr.addColorStop(.5,'#1a6fb5');gr.addColorStop(1,'#123a6b');
  tctx.fillStyle=gr;tctx.fillRect(0,0,Wd,H);
  // enlem-boylam ağı
  tctx.strokeStyle='rgba(255,255,255,.07)';tctx.lineWidth=Wd/4096*1.5;
  for(let lo=-180;lo<=180;lo+=30){tctx.beginPath();tctx.moveTo((lo+180)*sx,0);tctx.lineTo((lo+180)*sx,H);tctx.stroke()}
  for(let la=-60;la<=60;la+=30){if(!la)continue;tctx.beginPath();tctx.moveTo(0,(90-la)*sy);tctx.lineTo(Wd,(90-la)*sy);tctx.stroke()}
  // dönenceler
  tctx.setLineDash([Wd/400,Wd/500]);tctx.strokeStyle='rgba(255,255,255,.18)';
  for(const la of [23.44,-23.44,66.56,-66.56]){tctx.beginPath();tctx.moveTo(0,(90-la)*sy);tctx.lineTo(Wd,(90-la)*sy);tctx.stroke()}
  tctx.setLineDash([]);
  const cizHalka=(r,ox)=>{tctx.moveTo((r[0][0]+180+ox)*sx,(90-r[0][1])*sy);for(let i=1;i<r.length;i++)tctx.lineTo((r[i][0]+180+ox)*sx,(90-r[i][1])*sy);tctx.closePath()};
  for(const u of ULKE_BUYUKTEN){
    let renk;
    const kv=S.kitaVurgu&&kitaUyar(u,S.kitaVurgu);
    if(S.sec&&S.sec.k===u.k) renk=u.k==='tur'?'#ff2d55':'#facc15';
    else if(S.vurgu&&S.vurgu.has(u.k)) renk=S.oyun?'#facc15':'#fde68a';
    else if(kv) renk='#fde68a';
    else if(u.k==='tur') renk='#e11d48';
    else {const base=(KITA[u.kita]||{renk:'#94a3b8'}).renk; renk=renkAyar(base,((hash(u.k)%7)-3)*0.055 - (S.kitaVurgu?0.45:0));}
    tctx.fillStyle=renk;tctx.beginPath();
    const [a,,c]=u.bb;
    for(const r of u.rings){cizHalka(r,0); if(a<-180)cizHalka(r,360); if(c>180)cizHalka(r,-360);}
    tctx.fill();
    tctx.strokeStyle=(S.sec&&S.sec.k===u.k)?'#fff':'rgba(255,255,255,.75)';tctx.lineWidth=Wd/4096*((S.sec&&S.sec.k===u.k)?4:1.6);tctx.lineJoin='round';tctx.stroke();
  }
  // ekvator
  tctx.strokeStyle='rgba(253,224,71,.55)';tctx.lineWidth=Wd/4096*3;tctx.setLineDash([Wd/300,Wd/400]);
  tctx.beginPath();tctx.moveTo(0,H/2);tctx.lineTo(Wd,H/2);tctx.stroke();tctx.setLineDash([]);
  globeTex.needsUpdate=true;
}

function yayKur(a,b){ // [lat,lon]

  const va=ll2v(a[0],a[1]),vb=ll2v(b[0],b[1]);const ang=va.angleTo(vb);if(ang<0.01)return;

    const s=Math.sin(ang);const v2=va.clone().multiplyScalar(Math.sin((1-t)*ang)/s).add(vb.clone().multiplyScalar(Math.sin(t*ang)/s));

      secEt.textContent=(S.sec.bay?S.sec.bay+' ':'')+S.sec.ad;secEt.style.opacity=dot>.1?1:0;secEt.style.transform=`translate(${x}px,${y}px) translate(-50%,-140%)`;yer.push([x,y-20,secEt.offsetWidth+10,30]);}
    else secEt.style.opacity=0;
    for(const e of wEt){
      let goster=S.isim&&S.basladi;
      if(goster){
        if(e.tip==='kita') goster=d>1.75; else if(e.tip==='okyanus') goster=d>1.5;
        else if(e.tip==='ulke'){const a=e.ul.alan; goster=(a>2e6&&d<3.4)||(a>6e5&&d<2.5)||(a>1.5e5&&d<1.9)||(a>3e4&&d<1.55)||d<1.32; if(S.sec&&S.sec.k===e.ul.k)goster=false; if(S.oyun&&S.oyun.gizliIsim)goster=false;}
        else if(e.tip==='tr') goster=!(S.oyun&&S.oyun.gizliIsim)&&!(S.sec&&S.sec.k==='tur');
      }
      if(!goster){e.el.style.opacity=0;continue}
      const n=e.v.clone().normalize().dot(camN);
      if(n<.25){e.el.style.opacity=0;continue}
      const [x,y]=ekranXY(e.v,wCam); const w=e.el.offsetWidth||60,h=16;
      if(e.tip!=='kita'&&e.tip!=='tr'&&carp(x,y,w,h)){e.el.style.opacity=0;continue}
      yer.push([x,y,w,h]);
      e.el.style.opacity=Math.min(1,(n-.25)*3);
      e.el.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%)`;
    }

      const k=Math.min(yayNokta.length-1,Math.floor(((yayT*0.5)%1)*yayNokta.length));const v=yayNokta[k];const dot=v.clone().normalize().dot(camN);
      const [x,y]=ekranXY(v,wCam);const nx=yayNokta[Math.min(k+1,yayNokta.length-1)];const [x2,y2]=ekranXY(nx,wCam);
      const ang=Math.atan2(y2-y,x2-x)*R2D+45;

  } else {
    wEt.forEach(e=>e.el.style.opacity=0); secEt.style.opacity=0; ucakEt.style.opacity=0;

  ILLER.map(p=>({ad:p.tam,ik:'🇹🇷',alt:String(p.plaka).padStart(2,'0')+' · '+p.bolge,f:()=>{modDegis('tr');setTimeout(()=>ilSec(p,true),200)}})),

let araSecili=0,araSonuc=[];
araI.oninput=()=>{
  const q=norm(araI.value.trim()); araX.style.display=araI.value?'block':'none';
  if(!q){oneri.style.display='none';return}
  const plk=/^\d{1,2}$/.test(q)?ILLER.find(p=>p.plaka===+q):null;
  araSonuc=ARA_LISTE.filter(x=>x.n.startsWith(q)).concat(ARA_LISTE.filter(x=>!x.n.startsWith(q)&&x.n.includes(q))).slice(0,8);
  if(plk) araSonuc.unshift(ARA_LISTE.find(x=>x.ad===plk.tam&&x.ik==='🇹🇷'));
  araSecili=0;
  oneri.innerHTML=araSonuc.length?araSonuc.map((x,i)=>`<div data-i="${i}" class="${i?'':'on'}"><span>${x.ik}</span>${esc(x.ad)}<small>${esc(x.alt)}</small></div>`).join(''):
    `<div data-osm="1"><span>🛰️</span>"${esc(araI.value)}" haritada ara<small>OpenStreetMap</small></div>`;
  oneri.style.display='block';
};
function araGit(i){const x=araSonuc[i];oneri.style.display='none';araI.blur();
  if(!x){window.open('https://www.openstreetmap.org/search?query='+encodeURIComponent(araI.value),'_blank','noopener');return}
  araI.value='';araX.style.display='none';if(S.oyun){toast('Oyun sırasında arama kapalı 🙂');return}x.f();}
oneri.onclick=e=>{const d=e.target.closest('div');if(!d)return;araGit(d.dataset.osm?-1:+d.dataset.i)};
araI.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter')araGit(araSonuc.length?araSecili:-1);
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){araSecili=(araSecili+(e.key==='ArrowDown'?1:-1)+araSonuc.length)%Math.max(1,araSonuc.length);oneri.querySelectorAll('div').forEach((d,i)=>d.classList.toggle('on',i===araSecili))}
  if(e.key==='Escape'){oneri.style.display='none';araI.blur()}};
araX.onclick=()=>{araI.value='';araX.style.display='none';oneri.style.display='none'};
araI.onblur=()=>setTimeout(()=>oneri.style.display='none',200);

  window._oyunBasliyor=1; if(d.mod) { if(S.mod!==d.mod) modDegis(d.mod); } window._oyunBasliyor=0; document.body.classList.add('oyunda');

function sonrakiSoru(){
  const O=S.oyun;if(!O)return; if(O.d.temizle&&O.i>=0) O.d.temizle();
  O.i++; if(O.i>=O.sorular.length) return oyunBitti();
  O.q=O.sorular[O.i]; O.deneme=0; O.kilit=false;
  const s=O.d.soru(O.q,O.L); O.s=s;
  $('#hSay').textContent=`${O.d.e} ${O.i+1}/${O.sorular.length}`; $('#hPuan').textContent='⭐ '+O.puan;
  $('#hSoru').innerHTML=esc(s.m)+(s.html||''); $('#hIpucu').textContent=s.alt||'';
  $('#hBar').style.width=(O.i/O.sorular.length*100)+'%';
  if(O.L<=1&&s.ses) konus(s.ses);
  if(O.d.tip==='secim'){
    O.dokun=()=>{};
    secKutu.style.display='grid'; secKutu.style.gridTemplateColumns=s.sec.length===3?'1fr 1fr 1fr':'1fr 1fr';
    secKutu.innerHTML=s.sec.map((x,i)=>`<button data-i="${i}">${esc(x.t)}</button>`).join('');
    secKutu.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      if(O.kilit) return; const x=s.sec[+b.dataset.i];
      if(x.ok){b.classList.add('dogru');dogruCevap()} else {b.classList.add('yanlis');b.disabled=true;yanlisCevap(O.d.id==='uzak'?'Tekrar düşün! Haritada ikisini de hayal et.':'Olmadı, tekrar dene!')}
    });
  } else {
    secKutu.style.display='none';
    O.dokun=h=>{ if(O.kilit) return; const r=O.d.kontrol(h,O.q,O.L);
      if(r.bos){$('#hIpucu').textContent=r.bos;return}
      if(r.ok) dogruCevap(); else yanlisCevap(r.ip); };
  }
}
function dogruCevap(){
  const O=S.oyun;O.kilit=true;const p=[10,6,3][O.deneme]||1;O.puan+=p;O.dogruSay++;
  ses('ok');konfeti(40);$('#hPuan').textContent='⭐ '+O.puan;
  $('#hIpucu').textContent=sec(['✅ Harika!','✅ Süpersin!','✅ Doğru!','✅ Aferin!','✅ Bravo!'])+` +${p}`+(O.d.sonra?' · '+O.d.sonra(O.q):'');
  O.d.goster&&O.d.goster(O.q); setTimeout(sonrakiSoru,O.d.sonra?2600:1700);
}

      halkaGrup.children.forEach(L=>{const r=1.02+e*1.4*L.userData.hiz;L.position.copy(L.userData.pos).multiplyScalar(r);L.material.opacity=Math.max(0,(1-e)*.9)});

      if(k>=1){giris=null;halkaGrup.visible=false;globeMat.transparent=false;globeMat.needsUpdate=true}}
    else if(!S.basladi){halkaGrup.children.forEach(L=>{const s=L.userData.s*(1+.28*Math.sin(t*.0015*L.userData.hiz+L.userData.faz));L.scale.set(s,s,s)});}
    const ss=Math.max(.035,Math.min(.075,.04*Math.pow(W.dist/1.6,.9)));

    if(yay){yayT+=dt;yay.geometry.setDrawRange(0,Math.min(yayNokta.length,Math.floor(yayT/1.2*yayNokta.length)))}
    renderer.render(wScene,wCam);
  } else {
    if(T.anim){const k=Math.min(1,(t-T.anim.t0)/T.anim.sure),e=ease(k);const a=T.anim.a,b=T.anim.b;
      for(const n of ['tx','ty','dist','az','tilt'])T[n]=a[n]+(b[n]-a[n])*e;if(k>=1)T.anim=null;}
    else if(P.map.size===0){T.az+=P.vel.x;P.vel.x*=.9;if(S.don&&bos&&!S.oyun&&!S.secIl)T.az+=dt*.06;}
    trKamera(); tScene.fog.near=T.dist+12; tScene.fog.far=T.dist+55;
    denizMat.uniforms.t.value=t/1000;
    ILLER.forEach(p=>{const m=ilMesh[p.ad],u=m.userData;u.z+=(u.hedefZ-u.z)*Math.min(1,dt*9);m.position.z=u.z});
    const s=Math.max(.32,Math.min(.95,T.dist*.04));trSimgeGrup.children.forEach(sp=>sp.scale.set(s,s,s));
    renderer.render(tScene,tCam);
  }
  simgeGrup.visible=S.simge&&S.basladi&&!S.oyun; trSimgeGrup.visible=S.simge&&!S.oyun;
  if(!isMobile||(etSay++&1)===0) etiketGuncelle();
  konfetiAdim();
}
