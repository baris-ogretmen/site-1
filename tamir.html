        <button onclick="duzelt()">KİTABI GÜNCELLE</button>

    <script>
        function duzelt() {
            const db = firebase.firestore();
            const durum = document.getElementById("durum");
            durum.innerText = "⏳ 11 Sayfa ve Resimler işleniyor...";
            durum.style.color = "orange";

            // SENİN KİTAP ID'N
            const kitapID = "dt8snrbRkivYCHnDPzKF";

            // 11 RESİM VE TAM METİN
            const yeniVeri = {
                baslik: "Kalplerin Kandili: İmam Rabbani’nin Yolculuğu",
                sayfalar: [
                    {
                        img: "rab1.jpg", 
                        text: "Çok uzun zaman önce, Hindistan’ın Sarhind kasabasında Ahmad adında bir çocuk yaşardı. Ahmad, akranları oyun oynarken bile elinden kitabını düşürmezdi. Babası Abdal-Ahad, oğlundaki bu öğrenme aşkını görünce gülümsedi."
                    },
                    {
                        img: "rab2.jpg",
                        text: "<b>'Bilgi, karanlıkta yolunu bulmanı sağlayan bir yıldızdır Ahmad,'</b> dedi. Küçük Ahmad, o gece yıldızlara bakarak içinden bir söz verdi: Sadece kendisi için değil, herkes için bir ışık olacaktı."
                    },
                    {
                        img: "rab3.jpg",
                        text: "Yıllar geçtikçe Ahmad’ın kalbindeki merak daha da büyüdü. Sadece kitaplardaki bilgileri değil, hayatın ve sevginin anlamını da merak ediyordu. Şehrin en büyük kütüphanelerinde sabahladı."
                    },
                    {
                        img: "rab4.jpg",
                        text: "Bir gün, <b>'Gerçek bilgi sadece zihinle değil, kalple öğrenilir,'</b> diye düşündü. Bu düşünceyle, ruhunu eğitecek büyük bir öğretmen aramaya karar verdi."
                    },
                    {
                        img: "rab5.jpg",
                        text: "Sonunda Delhi şehrine ulaştı ve bilge bir öğretmen olan Baqi ile tanıştı. Baqi, Ahmad’ın gözlerindeki kararlılığı gördü. Ona sabretmeyi, tevazuyu ve her canlının içindeki güzelliği görmeyi öğretti."
                    },
                    {
                        img: "rab6.jpg",
                        text: "Ahmad, hocasının yanında diz çöktü ve sessizliğin sesini dinlemeye başladı. Artık o, sadece öğrenen değil, olgunlaşan bir yolcuydu. Eğitimini tamamlayan Ahmad, Sarhind’e geri döndü."
                    },
                    {
                        img: "rab7.jpg",
                        text: "Artık insanlar ona <b>'İmam Rabbani'</b> diyordu, yani 'Kendini Allah'a adayan önder.' Genç yaşlı herkes onun etrafında toplanıyordu. Öğrencisi Sami'ye, <b>'En büyük ders, dürüstlük ve sevgiyle yoğrulmuş bir ahlaktır evladım,'</b> dedi."
                    },
                    {
                        img: "rab8.jpg",
                        text: "Zamanla insanlar doğruyu unutmaya başlamıştı. İmam Rabbani, haksızlıklara karşı cesurca durdu. Doğruyu söylediği için bir kaleye hapsedildi. Ancak o, karanlık zindanı bile bir okul haline getirdi."
                    },
                    {
                        img: "rab9.jpg",
                        text: "Zindandan çıktığında, o artık <b>'Bin Yılın Yenileyicisi'</b> olarak anılıyordu. Binlerce sayfalık mektuplar yazdı. Bu mektuplarda; doğruluğu, kardeşliği ve sevginin gücünü anlattı. Yazdığı her kelime, bir kalbi iyileştiriyordu."
                    },
                    {
                        img: "rab10.jpg",
                        text: "Bir gün Sami ile bahçede yürürken yerdeki bir karıncayı fark ettiler. İmam Rabbani durdu ve Sami’ye, <b>'Evrendeki her şey bir düzen içindedir. En küçük karıncadan en büyük yıldıza kadar her şey bize bir şeyler anlatır,'</b> dedi."
                    },
                    {
                        img: "rab11.jpg",
                        text: "İmam Rabbani’nin en büyük mirası, <b>'Mektubat'</b> eseriydi. Bugün bile, onun ektiği o tohumlar çiçek açmaya devam ediyor. <b>Kalbinde sevgi ve zihninde doğru bilgi olan hiç kimse, yolunu asla kaybetmez.</b> -SON-"
                    }
                ]
            };

            // GÜNCELLE
            db.collection("dijital_kitaplar").doc(kitapID).update(yeniVeri)
            .then(() => {
                durum.innerHTML = "✅ KİTAP GÜNCELLENDİ!";
                durum.style.color = "green";
                alert("Harika! 11 sayfa ve bütün resimlerin kitaba eklendi. Şimdi kontrol edebilirsin.");
            })
            .catch((error) => {
                durum.innerHTML = "Hata: " + error.message;
                durum.style.color = "red";
            });
        }
    </script>
