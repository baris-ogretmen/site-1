<style>
:root{--ana:#0ea5a4;--ana2:#0b3b46;--koyu:#0b1218;--panel:rgba(18,22,28,.86);--cizgi:rgba(255,255,255,.14);--yesil:#22c55e;--turuncu:#f97316;--mavi:#3b82f6;--kirmizi:#ef4444;--sari:#facc15}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1218;color:#fff;font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:800;font-variant-numeric:lining-nums tabular-nums;-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
button{font-family:inherit;font-weight:800;cursor:pointer;color:inherit}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.gizli{display:none!important}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud>*{pointer-events:auto}
.yb{width:3.1rem;height:3.1rem;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(20,24,30,.72);display:grid;place-items:center;font-size:1.35rem;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.yb:active{transform:scale(.93)}
#solUst{position:absolute;left:calc(.8rem + env(safe-area-inset-left));top:calc(.7rem + env(safe-area-inset-top));display:flex;flex-direction:column;gap:.5rem}
#solUst .satir{display:flex;gap:.5rem}
#yolcuPill{height:2.4rem;padding:0 .9rem;border-radius:1.2rem;background:rgba(20,24,30,.72);border:2px solid rgba(255,255,255,.2);display:flex;align-items:center;gap:.4rem;font-size:1.05rem;pointer-events:none}
#ustOrta{position:absolute;left:41%;top:calc(.6rem + env(safe-area-inset-top));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.45rem;pointer-events:none;max-width:46vw}
#durakPill{background:rgba(11,59,70,.88);border:2px solid rgba(94,234,212,.45);border-radius:1.4rem;padding:.4rem 1.1rem;font-size:1.1rem;white-space:nowrap;display:flex;gap:.6rem;align-items:center;box-shadow:0 .4rem 1.4rem rgba(0,0,0,.3)}
#durakPill b{color:#5eead4}
#bildirim{display:flex;flex-direction:column;gap:.4rem;align-items:center}
.toast{background:rgba(15,18,24,.92);border-left:.35rem solid var(--sari);border-radius:.8rem;padding:.55rem 1rem;font-size:1.05rem;line-height:1.3;max-width:44vw;text-align:center;animation:tin .25s ease-out;box-shadow:0 .5rem 1.5rem rgba(0,0,0,.35)}
.toast.iyi{border-left-color:var(--yesil)}.toast.kotu{border-left-color:var(--kirmizi)}.toast.bilgi{border-left-color:#38bdf8}
@keyframes tin{from{opacity:0;transform:translateY(-.5rem)}to{opacity:1;transform:none}}
/* ikon paneli (sağ üst) */
#ikonPanel{position:absolute;right:calc(.7rem + env(safe-area-inset-right));top:calc(.6rem + env(safe-area-inset-top));display:flex;align-items:stretch;background:linear-gradient(#2a2f36,#14181d);border:2px solid rgba(255,255,255,.12);border-radius:1rem;padding:.35rem;gap:.25rem;box-shadow:0 .6rem 1.6rem rgba(0,0,0,.4)}
#ikonIzgara{display:grid;grid-template-columns:repeat(9,2.45rem);grid-auto-rows:2.45rem;gap:.22rem}
#ikonPanel.kapali #ikonIzgara{display:none}
.ik{border:0;border-radius:.55rem;background:linear-gradient(#3a4049,#23282f);display:grid;place-items:center;position:relative;padding:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.ik svg{width:1.45rem;height:1.45rem;stroke:#e9eef3;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ik.acik{background:linear-gradient(#0f766e,#0b4d48);box-shadow:0 0 0 2px #5eead4 inset}
.ik.acik svg{stroke:#fff}
.ik .num{position:absolute;right:.2rem;bottom:.05rem;font-size:.7rem;color:#cbd5e1}
.ik:active{transform:scale(.92)}
#ikonKatla{border:0;border-radius:.55rem;width:1.6rem;background:#2b3138;font-size:1.1rem}
.ipucu{position:absolute;top:calc(100% + .3rem);right:0;background:#0f1419;padding:.25rem .6rem;border-radius:.5rem;font-size:.85rem;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s}
.ipucu.gor{opacity:1}
#miniHarita{position:absolute;left:calc(.8rem + env(safe-area-inset-left));top:calc(7.4rem + env(safe-area-inset-top));width:11rem;height:11rem;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:#1d2a22;box-shadow:0 .5rem 1.4rem rgba(0,0,0,.4);pointer-events:none}
/* alt kontroller */
#solAlt{position:absolute;left:calc(.6rem + env(safe-area-inset-left));bottom:calc(.6rem + env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:.5rem}
#direksiyon{width:11.5rem;height:11.5rem;border-radius:50%;position:relative;touch-action:none}
#direksiyon svg{width:100%;height:100%;filter:drop-shadow(0 .4rem .8rem rgba(0,0,0,.5))}
#direksiyon .ok{position:absolute;bottom:-.1rem;font-size:.85rem;padding:.15rem .45rem;border-radius:.5rem}
.yonBtn{width:5rem;height:5rem;border-radius:1.1rem;border:3px solid rgba(255,255,255,.35);font-size:1rem;line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;text-shadow:0 1px 2px rgba(0,0,0,.4);touch-action:none}
.yonBtn .y{font-size:1.6rem}
.yonBtn.sol{background:linear-gradient(#3b82f6,#1d4ed8)}

 // hedef bilgi
 if(OYUN.mod==='sefer'&&OYUN.hedef>=0){const D=DURAKLAR[OYUN.hedef];let ds=((D.s-B.s)%YOL.L+YOL.L)%YOL.L;if(ds>YOL.L-20)ds=0;$('#durakYazi').innerHTML=`Sonraki: <b>${D.ad}</b> · ${ds<15?'burada':Math.round(ds)+' m'} · ${OYUN.tamam}/6`}

}

function haritaCiz(){

/* ---------- YAN ÇEVİR ---------- */
let yanGecildi=false;
function yanKontrol(){const dik=innerHeight>innerWidth&&innerWidth<820;$('#yanCevir').classList.toggle('gizli',!dik||yanGecildi)}
$('#yanGec').onclick=()=>{yanGecildi=true;yanKontrol()};

/* ---------- BAŞLAT ---------- */
async function baslat(){
 initPWA();cocukUygula();
 const adim=(p,y)=>new Promise(r=>{yukIlerle(p,y);setTimeout(r,30)});
 await adim(.08,'Sahne kuruluyor');sahneKur();
 await adim(.2,'Yollar çiziliyor');yolKur();
 await adim(.38,'Köprüler yapılıyor');kopruKur();tabelaKur();
 await adim(.52,'Ağaçlar dikiliyor');agacKur();
 await adim(.7,'Duraklar hazırlanıyor');durakKur();
 await adim(.8,'Otobüs garajdan çıkıyor');otobusYap();otobusKonum(DURAKLAR[0].s-140,SERIT[1]);
 await adim(.9,'Trafik akıyor');trafikKur();
 ikonPanelKur();kontrollerKur();havaUygula();lcdCiz();
 addEventListener('resize',boyutla);
 await adim(1,'Hazır!');
 OYUN.durum='menu';KAM.sinemaA=OTO.h+1;camera.position.set(OTO.x+15,6,OTO.z+12);
 dongu();
 $('#yukleniyor').classList.add('gizli');
 surumBaslat();
 // menü düğmeleri
 $('#mSefer').onclick=()=>{SES.init();seferBaslat('sefer')};$('#mSerbest').onclick=()=>{SES.init();seferBaslat('serbest')};
 $('#mDefter').onclick=defterAc;$('#mYardim').onclick=()=>yardimAc();$('#mSinif').onclick=()=>sinifAc();$('#mQr').onclick=qrAc;$('#mAyar').onclick=()=>ayarAc();
 $('#mCocuk').onclick=()=>{rawSet('zirve_cocuk_boyu',cocukBoyu()?'0':'1');cocukUygula()};
 $('#mOgretmen').onclick=()=>window.ZGIRIS&&ZGIRIS.panelAc();$('#mSite').onclick=siteyeDon;
 const ogr=await ZGIRIS.baslat({oyun:'Bilgi Hattı Otobüs Simülatörü',renk:'#0f766e'});
 if(!SINIF){SINIF=sinifTahmin(ogr);}
 if(rawGet('bh_karsilama','')!=='1')karsilamaAc(menuGoster);else menuGoster();
}
window.addEventListener('beforeunload',ilerlemeKaydet);
document.addEventListener('visibilitychange',()=>{if(document.hidden){ilerlemeKaydet();if(OYUN.durum==='surus'&&!OYUN.mola&&!soruAcik)molaAc()}});
baslat();

</script>
