<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Çizim Atölyesi · Barış Öğretmen</title>
<meta name="description" content="Barış Öğretmen'in kitaplarını açık bir kitabın sayfalarında, kalemle çizerek öğren.">
<meta name="theme-color" content="#E9E5DC">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Caveat:wght@600;700&family=Lora:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{--masa:#E9E5DC;--masa2:#D9D3C6;--kagit:#FFFDF7;--kagit2:#FBF7EE;--murekkep:#2B2B2F;--soluk:#9A968C;--vurgu:#F39A2B;--mavi:#3F7FD1;--yesil:#59A14F;
 --ui:"Baloo 2",system-ui,sans-serif;--el:"Caveat","Baloo 2",cursive;--kitap:"Lora",Georgia,"Times New Roman",serif;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--masa:#2A2724;--masa2:#1F1D1A}}
:root[data-theme="dark"]{--masa:#2A2724;--masa2:#1F1D1A}
*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;font-family:var(--ui);color:var(--murekkep);background:radial-gradient(ellipse 70% 55% at 50% 42%,color-mix(in srgb,var(--masa) 80%,#fff),var(--masa) 60%,var(--masa2));display:flex;flex-direction:column;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;background-image:radial-gradient(rgba(0,0,0,.05) 1px,transparent 1.2px);background-size:3px 3px}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--mavi);outline-offset:3px}
/* üst şerit */
.ust{position:relative;z-index:2;display:flex;align-items:center;gap:8px;padding:10px 16px;flex-wrap:wrap}
.marka{margin-right:auto;display:flex;align-items:baseline;gap:10px;min-width:0;flex-wrap:wrap}
.marka h1{margin:0;font:700 clamp(30px,4.4vw,42px)/1 var(--el);color:var(--murekkep)}
.marka span{color:#6E6A61;font-weight:700;font-size:clamp(12px,1.5vw,15px)}
.dugme{border:0;background:#fff;border-radius:999px;padding:8px 14px;font-weight:800;font-size:15px;box-shadow:0 1px 0 rgba(0,0,0,.06),0 6px 14px rgba(60,45,20,.12);display:inline-flex;align-items:center;gap:6px;color:var(--murekkep);text-decoration:none}
.dugme:active{transform:translateY(1px)}.dugme.ana{background:var(--vurgu);color:#fff}.dugme.yesil{background:var(--yesil);color:#fff}.dugme[aria-pressed="true"]{background:var(--mavi);color:#fff}.dugme:disabled{opacity:.4;cursor:default}
/* raf */
.raf{position:relative;z-index:1;flex:1;padding:6px 16px 50px;max-width:1120px;width:100%;margin:0 auto}
.raf h2{font:700 clamp(36px,5vw,54px)/1 var(--el);text-align:center;margin:8px 0 4px}
.raf p.alt{text-align:center;color:#6E6A61;font-weight:700;margin:0 0 26px}
.kitaplar{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(180px,42vw),1fr));gap:26px 22px}
.kitap{border:0;padding:0;background:none;text-align:left;display:flex;flex-direction:column;gap:10px;transition:transform .25s}
.kitap:hover{transform:translateY(-6px)}
.kapak{position:relative;aspect-ratio:210/297;border-radius:3px 9px 9px 3px;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;color:#fff;font:700 27px/1.05 var(--el);box-shadow:inset 7px 0 0 rgba(0,0,0,.14),inset 9px 0 0 rgba(255,255,255,.12),3px 3px 0 #EDE8DC,6px 6px 0 #DCD5C6,0 22px 30px rgba(60,40,10,.3)}
.kapak img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.kapak::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,rgba(255,255,255,.18),transparent 30%,transparent 70%,rgba(0,0,0,.12))}
.kapak em{position:absolute;top:8px;right:8px;z-index:1;background:#fff;color:var(--murekkep);border-radius:999px;min-width:30px;height:30px;display:flex;align-items:center;justify-content:center;font:800 15px var(--ui);font-style:normal;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.kapak .rozet{position:absolute;left:8px;bottom:8px;z-index:1;background:rgba(0,0,0,.6);color:#fff;font:800 12px var(--ui);border-radius:999px;padding:3px 9px}
.kitap b{font-size:17px;line-height:1.2}.kitap small{color:#6E6A61;font-weight:700;margin-top:-6px}
.bos{background:#fff;border-radius:18px;padding:24px;text-align:center;font-weight:700;max-width:560px;margin:0 auto;grid-column:1/-1;box-shadow:0 10px 26px rgba(60,40,10,.12)}
/* açık kitap */
.masa{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;gap:16px;padding:6px 10px 120px}
.acik{--gen:min(96vw,calc((100dvh - 190px) * 1.414),1180px);position:relative;width:var(--gen);aspect-ratio:420/297;display:grid;grid-template-columns:1fr 1fr;filter:drop-shadow(0 28px 30px rgba(60,40,10,.28)) drop-shadow(0 4px 6px rgba(60,40,10,.18))}
.acik::before{content:"";position:absolute;left:3%;right:3%;bottom:-3.5%;height:9%;background:radial-gradient(ellipse at center,rgba(40,25,5,.32),transparent 70%);filter:blur(8px);z-index:-1}
.sayfa{position:relative;background:var(--kagit);display:flex;flex-direction:column;padding:5.2% 7% 6.4%;overflow:hidden;min-height:0}
.sayfa::after{content:"";position:absolute;inset:0;pointer-events:none}
.sol{border-radius:6px 0 0 6px;transform-origin:right center;transform:perspective(2600px) rotateY(5deg);box-shadow:-1px 1px 0 #EFEADF,-2px 2px 0 #FBF8F1,-3px 3px 0 #E8E2D4,-4px 4px 0 #F8F4EA,-5px 5px 0 #E1DACA}
.sag{border-radius:0 6px 6px 0;transform-origin:left center;transform:perspective(2600px) rotateY(-5deg);box-shadow:1px 1px 0 #EFEADF,2px 2px 0 #FBF8F1,3px 3px 0 #E8E2D4,4px 4px 0 #F8F4EA,5px 5px 0 #E1DACA}
.sol::after{background:linear-gradient(to left,rgba(40,30,10,.26) 0,rgba(40,30,10,.10) 2.5%,rgba(40,30,10,.03) 9%,transparent 16%),linear-gradient(to right,rgba(0,0,0,.04),transparent 5%),radial-gradient(ellipse at 20% 15%,rgba(255,255,255,.55),transparent 55%)}
.sag::after{background:linear-gradient(to right,rgba(40,30,10,.26) 0,rgba(40,30,10,.10) 2.5%,rgba(40,30,10,.03) 9%,transparent 16%),linear-gradient(to left,rgba(0,0,0,.04),transparent 5%),radial-gradient(ellipse at 80% 15%,rgba(255,255,255,.55),transparent 55%)}
.sirt{position:absolute;left:50%;top:-.6%;bottom:-.6%;width:2px;transform:translateX(-50%);background:linear-gradient(to bottom,transparent,rgba(30,20,5,.35) 6%,rgba(30,20,5,.35) 94%,transparent);pointer-events:none;z-index:3}
.bas{display:flex;justify-content:center;align-items:center;gap:8px;font:500 clamp(10px,1.15vw,13px)/1 var(--kitap);color:var(--soluk);margin-bottom:5%;letter-spacing:.04em;min-height:1em}
.bas .isaret{position:absolute;left:6%;top:4.2%;width:13px;height:18px;border:1.8px solid var(--soluk);border-bottom:0;clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%);background:transparent;cursor:pointer;padding:0}
.bas .isaret.on{background:#E5484D;border-color:#E5484D}
.no{position:absolute;bottom:3.4%;left:0;right:0;text-align:center;font:500 clamp(10px,1.1vw,13px) var(--kitap);color:var(--soluk)}
.ilerleme{position:absolute;left:50%;bottom:6.2%;transform:translateX(-50%);width:34%;height:4px;border-radius:4px;background:#ECE7DC;overflow:hidden;z-index:4;pointer-events:none}
.ilerleme i{display:block;height:100%;width:0;background:#2B2B2F;border-radius:4px;transition:width .5s}
.metin{flex:1;min-height:0;overflow:auto;font:500 clamp(14px,1.55vw,21px)/1.72 var(--kitap);text-align:justify;hyphens:auto;-webkit-hyphens:auto;color:#2A2A2E;padding-right:2px}
.metin p{margin:0 0 .7em;text-indent:1.4em}.metin p:first-child{text-indent:0}
.metin.ilk p:first-child::first-letter{float:left;font:600 3.1em/0.9 var(--kitap);padding:.06em .08em 0 0;color:#8B5A2B}
.metin span.k{opacity:.18;transition:opacity .25s,color .25s}.metin span.k.on{opacity:1}.metin span.k.simdi{color:#B4541A}
.metin.okundu span.k{opacity:1}
.cizim{position:relative;flex:1;min-height:0;border-radius:4px;background:#fff;overflow:hidden;touch-action:none;box-shadow:inset 0 0 0 1px #EEE8DC}
.cizim canvas{position:absolute;inset:0;width:100%;height:100%}
#cvRenk{opacity:0;transition:opacity 1.2s ease}
.cizim.cocuk #cvKopya{opacity:.3}.cizim.cocuk.kopya-yok #cvKopya{opacity:0}.cizim.cocuk{cursor:crosshair;box-shadow:inset 0 0 0 2px var(--vurgu)}
.kalem{position:absolute;left:0;top:0;width:56px;height:56px;pointer-events:none;transform:translate(-4px,-52px);filter:drop-shadow(2px 5px 3px rgba(0,0,0,.28));z-index:3}
.ipucu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#B5AFA2;font:700 clamp(20px,2.4vw,32px) var(--el);pointer-events:none}
.yukleniyor{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 clamp(18px,2vw,26px) var(--el);color:var(--soluk)}
/* yaprak çevirme */
.yaprak{position:absolute;top:0;bottom:0;width:50%;z-index:5;pointer-events:none;transform-style:preserve-3d}
.yaprak.ileri{left:50%;transform-origin:left center;animation:ileri .75s cubic-bezier(.45,.05,.3,1) forwards}
.yaprak.geri{left:0;transform-origin:right center;animation:geri .75s cubic-bezier(.45,.05,.3,1) forwards}
.yaprak::before,.yaprak::after{content:"";position:absolute;inset:0;backface-visibility:hidden;background:var(--kagit)}
.yaprak.ileri::before{border-radius:0 6px 6px 0;background:linear-gradient(to right,rgba(40,30,10,.2),transparent 18%),var(--kagit)}
.yaprak.ileri::after{transform:rotateY(180deg);border-radius:6px 0 0 6px;background:linear-gradient(to left,rgba(40,30,10,.2),transparent 18%),var(--kagit2)}
.yaprak.geri::before{border-radius:6px 0 0 6px;background:linear-gradient(to left,rgba(40,30,10,.2),transparent 18%),var(--kagit)}
.yaprak.geri::after{transform:rotateY(-180deg);border-radius:0 6px 6px 0;background:linear-gradient(to right,rgba(40,30,10,.2),transparent 18%),var(--kagit2)}
@keyframes ileri{0%{transform:perspective(2200px) rotateY(-5deg)}100%{transform:perspective(2200px) rotateY(-175deg)}}
@keyframes geri{0%{transform:perspective(2200px) rotateY(5deg)}100%{transform:perspective(2200px) rotateY(175deg)}}
/* telefon: kitap tek sayfa (resim üstte, metin altta) */
@media (max-width:820px){
 .acik{--gen:min(96vw,560px);aspect-ratio:auto;grid-template-columns:1fr;filter:drop-shadow(0 18px 22px rgba(60,40,10,.25))}
 .sol,.sag{transform:none;border-radius:4px}.sag{order:1;aspect-ratio:210/200;border-radius:6px 6px 0 0;box-shadow:none}.sol{order:2;border-radius:0 0 6px 6px;min-height:34dvh;box-shadow:0 3px 0 #EFEADF,0 6px 0 #E1DACA}
 .sol::after{background:linear-gradient(to bottom,rgba(40,30,10,.12),transparent 8%)}.sag::after{background:linear-gradient(to top,rgba(40,30,10,.12),transparent 8%)}
 .sirt{display:none}.yaprak{left:0!important;width:100%;transform-origin:left center!important}.ilerleme{bottom:1.4%;width:40%}
 .no{bottom:2%}.sayfa{padding:5% 6% 9%}
}
/* bağlantılı kitap: solda kitabın kendisi, sağda çizim sayfası */
.kitapFrame{flex:1;min-height:0;width:100%;border:0;border-radius:4px;background:#fff;box-shadow:inset 0 0 0 1px #EEE8DC}
.acik.link-mod .metin,.acik.link-mod .ilerleme{display:none}
@media (max-width:820px){.acik.link-mod .sol{order:1;min-height:62dvh;border-radius:6px 6px 0 0}.acik.link-mod .sag{order:2;border-radius:0 0 6px 6px}}
/* kontroller ve araçlar */
.kontrol{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.araclar{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;background:#fff;border-radius:22px;padding:12px 12px 10px;box-shadow:0 14px 34px rgba(40,25,5,.28);display:flex;flex-direction:column;gap:8px;width:max-content;max-width:calc(100% - 16px)}
.arac-satir{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
.arac{border:2px solid transparent;background:#F4F0E8;border-radius:14px;padding:6px 10px;font-weight:800;font-size:14px;display:inline-flex;gap:4px;align-items:center;color:var(--murekkep)}
.arac[aria-pressed="true"]{border-color:var(--murekkep);background:#fff}
.renk{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #DDD6C8;padding:0}.renk[aria-pressed="true"]{box-shadow:0 0 0 3px var(--murekkep)}
.boy{width:34px;height:34px;border-radius:50%;background:#F4F0E8;border:2px solid transparent;display:inline-flex;align-items:center;justify-content:center;padding:0}.boy i{display:block;border-radius:50%;background:var(--murekkep)}.boy[aria-pressed="true"]{border-color:var(--murekkep);background:#fff}
.kucult{position:absolute;top:-14px;right:16px;border:0;background:#fff;border-radius:999px;width:36px;height:28px;box-shadow:0 4px 10px rgba(0,0,0,.2);font-weight:900}
@media (max-width:640px){.araclar{padding:10px 8px 8px;gap:6px}.arac{padding:4px 7px;font-size:12px;border-radius:10px}.renk{width:26px;height:26px}.boy{width:28px;height:28px}.araclar.kucuk .arac-satir:last-child>*:not(.hep){display:none}}
body.cizimde .masa{padding-bottom:250px}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--murekkep);color:#fff;font-weight:700;padding:10px 16px;border-radius:999px;z-index:50;box-shadow:0 8px 20px rgba(0,0,0,.3);max-width:calc(100% - 24px);text-align:center}
.pencere{position:fixed;inset:0;z-index:40;background:rgba(40,28,10,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.pencere .kart{background:var(--kagit);border-radius:22px;padding:26px;text-align:center;max-width:480px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.pencere h3{margin:0 0 6px;font:700 40px/1 var(--el)}.pencere p{margin:0 0 16px;font-weight:600;line-height:1.5}.pencere .kontrol{gap:8px}
#baski{display:none}
@media (prefers-reduced-motion:reduce){.yaprak{animation-duration:.01s!important}#cvRenk{transition:none}.kitap{transition:none}}
@media print{@page{size:A4 portrait;margin:12mm}
 body>*:not(#baski){display:none!important}body{background:#fff}body::before{display:none}
 #baski{display:block!important;font-family:var(--kitap);color:#000}#baski h1{font:700 26pt var(--el);margin:0 0 4mm}#baski img{display:block;width:100%;max-height:165mm;object-fit:contain;border:1px solid #ccc;margin-bottom:6mm}#baski p{font-size:15pt;line-height:1.75;margin:0}#baski small{display:block;margin-top:6mm;color:#666;font:600 10pt var(--ui)}}
</style>
</head>
<body>
<header class="ust">
  <div class="marka"><h1>✏️ Çizim Atölyesi</h1><span>Barış Öğretmen’in kitapları</span></div>
  <button class="dugme" id="bKitaplar" hidden>📚 Kitaplar</button>
  <button class="dugme" id="bSes" aria-pressed="true">🔊 Ses</button>
  <button class="dugme" id="bTam">⛶ Tam ekran</button>
  <a class="dugme" id="bEv" href="./">🏠 Siteye dön</a>
</header>

<main class="raf" id="raf">
  <h2>Hangi kitabı çizelim?</h2>
  <p class="alt">Kitabı aç; kalem her sayfanın resmini senin için çizsin, sonra sıra sende!</p>
  <div class="kitaplar" id="kitaplar"><div class="bos">Kitaplar geliyor…</div></div>
</main>

<main class="masa" id="masa" hidden>
  <div class="acik" id="acik">
    <section class="sayfa sol" aria-label="Hikâye metni">
      <div class="bas"><button class="isaret" id="bIsaret" aria-label="Bu sayfayı işaretle" title="Kaldığım yer"></button><span id="kAd"></span></div>
      <div class="metin" id="metin" aria-live="polite"></div><iframe class="kitapFrame" id="kitapFrame" title="Kitap" hidden allow="fullscreen"></iframe>
      <div class="no" id="noSol"></div>
    </section>
    <section class="sayfa sag" aria-label="Resim ve çizim">
      <div class="bas"><span id="kResim">Resim</span></div>
      <div class="cizim" id="cizim">
        <canvas id="cvRenk" aria-hidden="true"></canvas><canvas id="cvKopya" aria-hidden="true"></canvas><canvas id="cvCocuk" aria-label="Çizim alanı"></canvas>
        <div class="ipucu" id="ipucu" hidden></div><div class="yukleniyor" id="yuk" hidden>Sayfa hazırlanıyor…</div>
        <svg class="kalem" id="kalem" viewBox="0 0 64 64" aria-hidden="true" hidden><g transform="rotate(35 32 32)"><rect x="26" y="2" width="12" height="40" rx="2" fill="#F39A2B" stroke="#2E3136" stroke-width="2"/><rect x="26" y="2" width="12" height="7" fill="#F2B8B5" stroke="#2E3136" stroke-width="2"/><path d="M26 42 L32 58 L38 42Z" fill="#F6D7A7" stroke="#2E3136" stroke-width="2" stroke-linejoin="round"/><path d="M30.5 54 L32 58 L33.5 54Z" fill="#2E3136"/></g></svg>
      </div>
      <div class="no" id="noSag"></div>
    </section>
    <div class="sirt" aria-hidden="true"></div>
    <div class="ilerleme" aria-hidden="true"><i id="ilerle"></i></div>
  </div>
  <div class="kontrol" id="kontrol">
    <button class="dugme" id="bOnceki" aria-label="Önceki sayfa">◀</button>
    <button class="dugme ana" id="bIzle">▶ Çiz ve anlat</button>
    <button class="dugme yesil" id="bBen">✏️ Şimdi ben çizeyim</button>
    <button class="dugme" id="bSonraki" aria-label="Sonraki sayfa">▶</button>
    <button class="dugme" id="bBastan" hidden>⏮ Baştan</button>
  </div>
</main>

<div class="araclar" id="araclar" hidden>
  <button class="kucult" id="bKucult" aria-label="Araçları küçült ya da büyüt">▾</button>
  <div class="arac-satir" id="renkler" role="group" aria-label="Renkler"></div>
  <div class="arac-satir">
    <button class="arac hep" data-arac="kalem" aria-pressed="true">✏️ Kalem</button>
    <button class="arac hep" data-arac="boya" aria-pressed="false">🪣 Boya</button>
    <button class="arac hep" data-arac="silgi" aria-pressed="false">🧽 Silgi</button>
    <span id="boylar" class="hep" style="display:inline-flex;gap:4px"></span>
    <button class="arac hep" id="bGeri">↶ Geri</button>
    <button class="arac" id="bKopya" aria-pressed="true">👁 Kopya çizgileri</button>
    <button class="arac" id="bOrijinal">🖼️ Orijinal (basılı tut)</button>
    <button class="arac" id="bTemizle">🗑️ Temizle</button>
    <button class="arac" id="bKaydet">💾 Kaydet</button>
    <button class="arac" id="bYazdir">🖨️ Boyama sayfası</button>
    <button class="arac hep" id="bBitir">✔ Bitirdim</button>
  </div>
</div>
<div id="baski" aria-hidden="true"></div>

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const P=new URLSearchParams(location.search);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const imgURL=u=>{u=String(u||'').trim();if(/^data:image\/(webp|jpeg|png);base64,/.test(u))return u;try{const x=new URL(u,location.href);return /^https?:$/.test(x.protocol)?x.href:''}catch{return ''}};
const LSg=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},LSs=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const S={db:null,kitaplar:[],kitap:null,sayfalar:[],n:0,run:0,ses:true,mod:'izle',arac:'kalem',renk:'#2E3136',boy:6,geri:[],cizimler:new Map(),hazir:null,pdf:null,cevir:false};
let toastT;function toast(t){let e=$('.toast');if(!e){e=document.createElement('div');e.className='toast';e.setAttribute('role','status');document.body.append(e)}e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,2800)}
/* ---------- Bağlantı: sitenin firebase-config.js dosyası ---------- */
const yukle=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error(src));document.head.append(s)});

function gomuluAdres(link){const u=String(link||'').trim();let m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/)||u.match(/drive\.google\.com\/open\?id=([\w-]+)/);if(m)return 'https://drive.google.com/file/d/'+m[1]+'/preview';m=u.match(/docs\.google\.com\/(document|presentation)\/d\/([\w-]+)/);if(m)return 'https://docs.google.com/'+m[1]+'/d/'+m[2]+'/preview';m=u.match(/canva\.com\/design\/([\w-]+)\/([\w-]+)/);if(m)return 'https://www.canva.com/design/'+m[1]+'/'+m[2]+'/view?embed';try{return u?new URL(u,location.href).href:''}catch{return ''}}
/* ---------- Sesli okuma ---------- */
function okunus(t){return String(t||'').replace(/\(\s*s\.?\s*a\.?\s*[vs]\.?\s*\)|\bs\.\s?a\.\s?v\.?|ﷺ/gi,' (sallallahu aleyhi ve sellem)').replace(/\(\s*a\.?\s*s\.?\s*\)/gi,' (aleyhisselam)').replace(/\(\s*r\.?\s*a\.?\s*\)/gi,' (radıyallahu anh)').replace(/\(\s*r\.?\s*anha\.?\s*\)/gi,' (radıyallahu anha)').replace(/\(\s*c\.?\s*c\.?\s*\)/gi,' (celle celalühu)').replace(/\bHz\.\s*/g,'Hazreti ').replace(/[ \t]{2,}/g,' ').trim()}
let sesTR=null;function sesBul(){const v=speechSynthesis.getVoices();sesTR=v.find(x=>/^tr/i.test(x.lang)&&/yelda|seda|filiz|female|kadın/i.test(x.name))||v.find(x=>/^tr/i.test(x.lang))||null}

function soyle(t,my){return new Promise(res=>{if(!S.ses||!('speechSynthesis' in window)||!t)return res();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(okunus(t));u.lang='tr-TR';if(sesTR)u.voice=sesTR;u.rate=.92;u.pitch=1.05;let bitti=false;const son=()=>{if(!bitti){bitti=true;res()}};u.onend=son;u.onerror=son;setTimeout(son,1500+t.length*95);if(my!==S.run)return res();speechSynthesis.speak(u)})}

async function pdfSayfa(p){if(p.img!==null&&p.text!==null)return;const pg=await S.pdf.getPage(p.pdf);const v=pg.getViewport({scale:1});const sc=Math.min(2.2,1400/Math.max(v.width,v.height));const vp=pg.getViewport({scale:sc});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:x,viewport:vp}).promise;p.img=c.toDataURL('image/jpeg',.9);try{const tc=await pg.getTextContent();p.text=tc.items.map(i=>i.str+(i.hasEOL?'\n':'')).join('').replace(/[ \t]+/g,' ').replace(/\n{2,}/g,'\n\n').trim()}catch{p.text=''}}

const cv={renk:$('#cvRenk'),kopya:$('#cvKopya'),cocuk:$('#cvCocuk')};const ctx={renk:cv.renk.getContext('2d'),kopya:cv.kopya.getContext('2d'),cocuk:cv.cocuk.getContext('2d',{willReadFrequently:true})};

function resimYukle(u){return new Promise(ok=>{if(!u)return ok(null);const im=new Image();if(!/^data:/.test(u))im.crossOrigin='anonymous';im.onload=()=>ok(im);im.onerror=()=>{if(im.crossOrigin){const j=new Image();j.onload=()=>{j._kirli=true;ok(j)};j.onerror=()=>ok(null);j.src=u}else ok(null)};im.src=u})}
function sigdir(im){const k=Math.min(W/im.width,H/im.height),w=im.width*k,h=im.height*k;return [(W-w)/2,(H-h)/2,w,h]}

function cizgiCikar(im){if(im._kirli)return null;const off=document.createElement('canvas');off.width=W;off.height=H;const o=off.getContext('2d',{willReadFrequently:true});o.fillStyle='#fff';o.fillRect(0,0,W,H);o.drawImage(im,...sigdir(im));let d;try{d=o.getImageData(0,0,W,H)}catch{return null}
 const n=W*H,g=new Float32Array(n),px=d.data;for(let i=0;i<n;i++)g[i]=.299*px[i*4]+.587*px[i*4+1]+.114*px[i*4+2];
 const b=new Float32Array(n);for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=y*W+x;b[i]=(g[i]*4+g[i-1]*2+g[i+1]*2+g[i-W]*2+g[i+W]*2+g[i-W-1]+g[i-W+1]+g[i+W-1]+g[i+W+1])/16}
 const m=new Float32Array(n);let top=0,kare=0,say=0;for(let y=2;y<H-2;y++)for(let x=2;x<W-2;x++){const i=y*W+x;const gx=b[i-W+1]+2*b[i+1]+b[i+W+1]-b[i-W-1]-2*b[i-1]-b[i+W-1],gy=b[i+W-1]+2*b[i+W]+b[i+W+1]-b[i-W-1]-2*b[i-W]-b[i-W+1];const v=Math.hypot(gx,gy);m[i]=v;top+=v;kare+=v*v;say++}

function kalemGoster(x,y){const k=$('#kalem');k.hidden=false;k.style.left=(x/DPR)+'px';k.style.top=(y/DPR)+'px'}
async function kalemleCiz(line,my){const T=Math.max(12,Math.round(Math.min(W,H)/32));const data=line.getContext('2d',{willReadFrequently:true}).getImageData(0,0,W,H).data;const karolar=[];
 for(let y=0;y<H;y+=T)for(let x=0;x<W;x+=T){let c=0;for(let yy=y;yy<Math.min(H,y+T);yy+=2)for(let xx=x;xx<Math.min(W,x+T);xx+=2)if(data[(yy*W+xx)*4+3]>60)c++;if(c>2)karolar.push([x,y])}

 while(kalan.size){let best=-1,bd=Infinity;for(const i of kalan){const [x,y]=karolar[i],dd=(x-bx)**2+(y-by)**2;if(dd<bd){bd=dd;best=i}}kalan.delete(best);sira.push(karolar[best]);[bx,by]=karolar[best]}
 const sure=Math.min(11000,Math.max(3500,sira.length*9)),bas=performance.now();let i=0;
 await new Promise(res=>{const adim=t=>{if(my!==S.run)return res();const hedef=Math.min(sira.length,Math.ceil((t-bas)/sure*sira.length));for(;i<hedef;i++){const [x,y]=sira[i];ctx.kopya.drawImage(line,x,y,T,T,x,y,T,T)}if(i>0){const [x,y]=sira[i-1];kalemGoster(x+T/2,y+T/2)}if(i<sira.length)requestAnimationFrame(adim);else res()};requestAnimationFrame(adim)});$('#kalem').hidden=true}
async function perdeyleGoster(im,my){const [x,y,w,h]=sigdir(im);const sure=2600,bas=performance.now();cv.renk.style.transition='none';cv.renk.style.opacity=1;await new Promise(res=>{const adim=t=>{if(my!==S.run)return res();const k=Math.min(1,(t-bas)/sure);ctx.renk.clearRect(0,0,W,H);ctx.renk.save();ctx.renk.beginPath();ctx.renk.rect(x,y,w*k,h);ctx.renk.clip();ctx.renk.drawImage(im,x,y,w,h);ctx.renk.restore();kalemGoster(x+w*k,y+h*(.5+.35*Math.sin(k*18)));if(k<1)requestAnimationFrame(adim);else res()};requestAnimationFrame(adim)});cv.renk.style.transition='';$('#kalem').hidden=true}

function geriKaydet(){S.geri.push(ctx.cocuk.getImageData(0,0,W,H));if(S.geri.length>25)S.geri.shift()}
let ciziyor=false,son=null;const nokta=e=>{const r=cv.cocuk.getBoundingClientRect();return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
cv.cocuk.addEventListener('pointerdown',e=>{if(S.mod!=='ciz')return;e.preventDefault();try{cv.cocuk.setPointerCapture(e.pointerId)}catch{}const [x,y]=nokta(e);geriKaydet();if(S.arac==='boya'){boya(Math.round(x),Math.round(y));return}ciziyor=true;son=[x,y];ciz(x,y,x+.1,y+.1)});
cv.cocuk.addEventListener('pointermove',e=>{if(!ciziyor)return;const ev=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const c of (ev.length?ev:[e])){const [x,y]=nokta(c);ciz(son[0],son[1],x,y);son=[x,y]}});
['pointerup','pointercancel','pointerleave'].forEach(t=>cv.cocuk.addEventListener(t,()=>{ciziyor=false;son=null}));
function ciz(x0,y0,x1,y1){const c=ctx.cocuk;c.lineCap='round';c.lineJoin='round';c.lineWidth=S.boy*DPR*(S.arac==='silgi'?2.4:1);c.globalCompositeOperation=S.arac==='silgi'?'destination-out':'source-over';c.strokeStyle=S.renk;c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.stroke();c.globalCompositeOperation='source-over'}
function boya(x,y){if(x<0||y<0||x>=W||y>=H)return;const kd=ctx.cocuk.getImageData(0,0,W,H),k=kd.data;let sinir=null;if(!$('#cizim').classList.contains('kopya-yok')){try{sinir=ctx.kopya.getImageData(0,0,W,H).data}catch{}}
 const hex=S.renk.replace('#','');const R=parseInt(hex.slice(0,2),16),G=parseInt(hex.slice(2,4),16),B=parseInt(hex.slice(4,6),16);const i0=(y*W+x)*4;const r0=k[i0],g0=k[i0+1],b0=k[i0+2],a0=k[i0+3];if(a0>200&&Math.abs(r0-R)+Math.abs(g0-G)+Math.abs(b0-B)<10)return;
 const ayni=i=>{if(sinir&&sinir[i+3]>90)return false;return Math.abs(k[i]-r0)+Math.abs(k[i+1]-g0)+Math.abs(k[i+2]-b0)+Math.abs(k[i+3]-a0)<60};
 const gor=new Uint8Array(W*H),yig=[[x,y]];while(yig.length){let [cx,cy]=yig.pop();let i=cy*W+cx;while(cx>=0&&!gor[i]&&ayni(i*4)){cx--;i--}cx++;i++;let ust=false,alt=false;while(cx<W&&!gor[i]&&ayni(i*4)){gor[i]=1;const j=i*4;k[j]=R;k[j+1]=G;k[j+2]=B;k[j+3]=255;if(cy>0){const u=i-W;if(!gor[u]&&ayni(u*4)){if(!ust){yig.push([cx,cy-1]);ust=true}}else ust=false}if(cy<H-1){const a=i+W;if(!gor[a]&&ayni(a*4)){if(!alt){yig.push([cx,cy+1]);alt=true}}else alt=false}cx++;i++}}
 ctx.cocuk.putImageData(kd,0,0)}
$('#renkler').onclick=e=>{const b=e.target.closest('[data-renk]');if(!b)return;S.renk=b.dataset.renk;$$('#renkler .renk').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));if(S.arac==='silgi')aracSec('kalem')};
$('#boylar').onclick=e=>{const b=e.target.closest('[data-boy]');if(!b)return;S.boy=+b.dataset.boy;$$('#boylar .boy').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))};
function aracSec(a){S.arac=a;$$('[data-arac]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.arac===a)))}
$$('[data-arac]').forEach(b=>b.onclick=()=>aracSec(b.dataset.arac));
$('#bGeri').onclick=()=>{const g=S.geri.pop();if(g)ctx.cocuk.putImageData(g,0,0)};
$('#bTemizle').onclick=()=>{geriKaydet();ctx.cocuk.clearRect(0,0,W,H)};
$('#bKopya').onclick=()=>{const yok=$('#cizim').classList.toggle('kopya-yok');$('#bKopya').setAttribute('aria-pressed',String(!yok))};
const orijinal=on=>{const h=S.hazir;if(!h||!h.im){if(on)toast('Bu sayfanın resmi yok.');return}if(on){ctx.renk.clearRect(0,0,W,H);ctx.renk.drawImage(h.im,...sigdir(h.im))}cv.renk.style.transition='none';cv.renk.style.opacity=on?1:0;setTimeout(()=>cv.renk.style.transition='',50)};
$('#bOrijinal').addEventListener('pointerdown',()=>orijinal(true));['pointerup','pointerleave','pointercancel'].forEach(t=>$('#bOrijinal').addEventListener(t,()=>orijinal(false)));
$('#bKaydet').onclick=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);if(!$('#cizim').classList.contains('kopya-yok'))x.drawImage(cv.kopya,0,0);x.drawImage(cv.cocuk,0,0);c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(S.kitap.baslik||'cizim').replace(/[^\p{L}\p{N}]+/gu,'-')+'-sayfa-'+(S.n+1)+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)},'image/png');toast('💾 Resmin kaydedildi.')};
$('#bYazdir').onclick=()=>{const h=S.hazir,p=S.sayfalar[S.n];let src='';if(h&&h.im){const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);if(h.line)x.drawImage(h.line,0,0);else{x.globalAlpha=.35;x.drawImage(h.im,...sigdir(h.im))}src=c.toDataURL('image/png')}$('#baski').innerHTML=`<h1>${esc(S.kitap.baslik||'')}</h1>${src?`<img src="${src}" alt="">`:'<div style="height:150mm;border:1px solid #ccc;margin-bottom:6mm"></div>'}<p>${esc(p.text||'')}</p><small>Barış Öğretmen · Çizim Atölyesi · Sayfa ${S.n+1}</small>`;setTimeout(()=>window.print(),120)};
$('#bBitir').onclick=()=>{sakla();cocukModu(false);toast('Harika! 🌟 Çizimin bu sayfada saklandı.');const h=S.hazir;if(h&&h.im){ctx.renk.clearRect(0,0,W,H);ctx.renk.drawImage(h.im,...sigdir(h.im));cv.renk.style.opacity=.35}};
$('#bKucult').onclick=()=>{const k=$('#araclar').classList.toggle('kucuk');$('#bKucult').textContent=k?'▴':'▾'};
/* ---------- Düğmeler ---------- */
$('#bOnceki').onclick=()=>git(-1);$('#bSonraki').onclick=()=>git(1);$('#bBastan').onclick=()=>{sakla();S.n=0;sayfaGoster(true,-1)};
$('#bIsaret').onclick=()=>{LSs('ca-yer-'+S.kitap.id,S.n);$('#bIsaret').classList.add('on');toast('🔖 Bu sayfa işaretlendi; kitabı açınca buradan devam edersin.')};
$('#bIzle').onclick=()=>{if($('#bIzle').textContent.startsWith('⏸')){S.run++;try{speechSynthesis.cancel()}catch{}$('#kalem').hidden=true;$('#bIzle').textContent='▶ Çiz ve anlat'}else izle()};
$('#bBen').onclick=()=>cocukModu(true);$('#bKitaplar').onclick=()=>{sakla();raf()};
$('#bSes').onclick=()=>{S.ses=!S.ses;$('#bSes').setAttribute('aria-pressed',String(S.ses));$('#bSes').textContent=S.ses?'🔊 Ses':'🔇 Ses';if(!S.ses)try{speechSynthesis.cancel()}catch{}};
$('#bTam').onclick=()=>{const d=document;if(d.fullscreenElement)d.exitFullscreen?.();else d.documentElement.requestFullscreen?.().catch(()=>{})};
document.addEventListener('keydown',e=>{if($('#masa').hidden||S.mod==='ciz'||e.target.closest('input,textarea'))return;if(e.key==='ArrowRight')git(1);else if(e.key==='ArrowLeft')git(-1)});
let x0=null;$('#acik').addEventListener('touchstart',e=>{if(S.mod==='ciz')return;x0=e.touches[0].clientX},{passive:true});$('#acik').addEventListener('touchend',e=>{if(x0===null||S.mod==='ciz')return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>60)git(dx<0?1:-1)});
let rT;window.addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{if($('#masa').hidden)return;if(boyutla()){const h=S.hazir;if(h&&h.im){h.line=cizgiCikar(h.im);ctx.kopya.clearRect(0,0,W,H);if(h.line&&S.mod==='ciz')ctx.kopya.drawImage(h.line,0,0);ctx.renk.clearRect(0,0,W,H);ctx.renk.drawImage(h.im,...sigdir(h.im));if(S.mod!=='ciz')cv.renk.style.opacity=1}}},200)});
if(window.top!==window){$('#bEv').onclick=e=>{e.preventDefault();try{window.parent.oyunKapat?.()}catch{}}}
(async()=>{await raf();const id=P.get('k')||P.get('kitap');if(id)kitapAc(id)})();
})();
</script>
