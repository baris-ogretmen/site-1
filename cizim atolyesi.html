<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Çizim Atölyesi · Barış Öğretmen</title>
<meta name="description" content="Barış Öğretmen'in kitaplarını A4 kâğıdın üzerinde sayfa sayfa çizerek öğren.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--masa1:#C9A57A;--masa2:#B88F62;--kagit:#FFFEFA;--cizgi:#DCE6F2;--kirmizi:#F2B8B5;--murekkep:#2E3136;--vurgu:#F39A2B;--mavi:#3F7FD1;--yesil:#59A14F;
 --ui:"Baloo 2",system-ui,sans-serif;--el:"Caveat","Baloo 2",cursive;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--masa1:#5E4630;--masa2:#4A3624}}
:root[data-theme="dark"]{--masa1:#5E4630;--masa2:#4A3624}
*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;font-family:var(--ui);color:var(--murekkep);background:var(--masa1);background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.035) 0 2px,transparent 2px 9px),repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 37px),linear-gradient(180deg,var(--masa1),var(--masa2));display:flex;flex-direction:column;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--mavi);outline-offset:3px}
.ust{display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.marka{margin-right:auto;display:flex;align-items:baseline;gap:10px;min-width:0;flex-wrap:wrap}
.marka h1{margin:0;font:700 clamp(30px,4.5vw,44px)/1 var(--el);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.marka span{color:#FFF6E6;font-weight:700;font-size:clamp(13px,1.6vw,16px);opacity:.9}
.dugme{border:0;background:#FFFDF6;border-radius:999px;padding:8px 14px;font-weight:800;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.18);display:inline-flex;align-items:center;gap:6px;color:var(--murekkep)}
.dugme:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.dugme.ana{background:var(--vurgu);color:#fff}.dugme.yesil{background:var(--yesil);color:#fff}.dugme[aria-pressed="true"]{background:var(--mavi);color:#fff}
.dugme:disabled{opacity:.45;cursor:default}
.raf{flex:1;padding:8px 16px 40px;max-width:1100px;width:100%;margin:0 auto}
.raf h2{font:700 clamp(34px,5vw,52px)/1 var(--el);color:#fff;text-align:center;margin:10px 0 4px;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.raf p.alt{text-align:center;color:#FFF6E6;font-weight:700;margin:0 0 22px}
.kitaplar{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(190px,42vw),1fr));gap:22px}
.kitap{border:0;padding:0;background:none;text-align:left;display:flex;flex-direction:column;gap:10px;transition:transform .2s}
.kitap:hover{transform:translateY(-4px) rotate(-1deg)}
.kapak{position:relative;aspect-ratio:210/297;border-radius:4px 10px 10px 4px;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;color:#fff;font:700 28px/1.05 var(--el);box-shadow:0 14px 26px rgba(40,20,0,.35),inset 8px 0 0 rgba(0,0,0,.12)}
.kapak img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.kapak em{position:absolute;top:8px;right:8px;background:#fff;color:var(--murekkep);border-radius:999px;min-width:30px;height:30px;display:flex;align-items:center;justify-content:center;font:800 16px var(--ui);font-style:normal;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.kitap b{color:#fff;font-size:18px;line-height:1.2;text-shadow:0 1px 0 rgba(0,0,0,.25)}.kitap small{color:#FFF6E6;font-weight:700;margin-top:-6px}
.bos{background:var(--kagit);border-radius:16px;padding:22px;text-align:center;font-weight:700;max-width:520px;margin:0 auto;grid-column:1/-1}
.masa{flex:1;display:flex;flex-direction:column;align-items:center;gap:14px;padding:4px 12px 130px}
.sayfa{position:relative;width:min(94vw,calc((100dvh - 210px) * 210 / 297),760px);aspect-ratio:210/297;background:var(--kagit);border-radius:2px;box-shadow:0 1px 0 rgba(0,0,0,.08),0 18px 40px rgba(50,30,10,.38),0 2px 6px rgba(50,30,10,.2);transform:rotate(-.4deg);display:flex;flex-direction:column;padding:4.2% 5.5% 4%;transform-origin:left center}
.sayfa::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.6),transparent 60%),radial-gradient(ellipse at 80% 90%,rgba(230,220,200,.35),transparent 60%);pointer-events:none;border-radius:inherit}
.sayfa.cevir{animation:cevir .7s ease}
@keyframes cevir{0%{transform:rotate(-.4deg) perspective(1600px) rotateY(0)}45%{transform:rotate(-.4deg) perspective(1600px) rotateY(-28deg) scale(.96);box-shadow:30px 18px 40px rgba(50,30,10,.3)}100%{transform:rotate(-.4deg) perspective(1600px) rotateY(0)}}
.ust-satir{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:800;font-size:clamp(11px,1.7vmin,15px);color:#8A8F98;border-bottom:1.5px solid var(--cizgi);padding-bottom:4px;margin-bottom:3%;position:relative}
.ust-satir b{color:var(--murekkep);font:700 clamp(18px,3vmin,26px) var(--el);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cizim{position:relative;flex:1 1 auto;min-height:0;border:2px dashed #E3E8EF;border-radius:6px;background:#fff;overflow:hidden;touch-action:none}
.cizim canvas{position:absolute;inset:0;width:100%;height:100%}
#cvRenk{opacity:0;transition:opacity 1.2s ease}
.cizim.cocuk #cvKopya{opacity:.32}.cizim.cocuk.kopya-yok #cvKopya{opacity:0}
.cizim.cocuk{border-color:var(--vurgu);cursor:crosshair}
.kalem{position:absolute;left:0;top:0;width:54px;height:54px;pointer-events:none;transform:translate(-4px,-50px);filter:drop-shadow(2px 4px 2px rgba(0,0,0,.25))}
.ipucu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#A0A7B1;font:700 clamp(20px,3.4vmin,30px) var(--el);pointer-events:none}
.metin{flex:0 0 auto;margin-top:3.2%;min-height:22%;max-height:34%;overflow:auto;font-weight:600;font-size:clamp(14px,2.35vmin,22px);line-height:2.05em;background:repeating-linear-gradient(transparent 0 calc(2.05em - 1.5px),var(--cizgi) calc(2.05em - 1.5px) 2.05em);padding-left:10%;position:relative}
.metin::before{content:"";position:absolute;left:7%;top:0;bottom:0;width:2px;background:var(--kirmizi)}
.metin span.k{opacity:.15;transition:opacity .25s}.metin span.k.on{opacity:1}
.alt-satir{margin-top:2%;text-align:center;font-size:clamp(10px,1.5vmin,13px);color:#A0A7B1;font-weight:700}
.kontrol{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.araclar{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;background:#FFFDF6;border-radius:22px;padding:10px 12px;box-shadow:0 10px 30px rgba(40,20,0,.35);display:flex;flex-direction:column;gap:8px;width:max-content;max-width:calc(100% - 16px)}
.arac-satir{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
.arac{border:2px solid transparent;background:#F3EEE4;border-radius:14px;padding:6px 10px;font-weight:800;font-size:14px;display:inline-flex;gap:4px;align-items:center;color:var(--murekkep)}
.arac[aria-pressed="true"]{border-color:var(--murekkep);background:#fff}
.renk{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #D9D2C3;padding:0}
.renk[aria-pressed="true"]{box-shadow:0 0 0 3px var(--murekkep)}
.boy{width:34px;height:34px;border-radius:50%;background:#F3EEE4;border:2px solid transparent;display:inline-flex;align-items:center;justify-content:center;padding:0}
.boy i{display:block;border-radius:50%;background:var(--murekkep)}.boy[aria-pressed="true"]{border-color:var(--murekkep);background:#fff}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--murekkep);color:#fff;font-weight:700;padding:10px 16px;border-radius:999px;z-index:50;box-shadow:0 8px 20px rgba(0,0,0,.3);max-width:calc(100% - 24px);text-align:center}
.bitti{position:fixed;inset:0;z-index:40;background:rgba(40,25,10,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.bitti .kart{background:var(--kagit);border-radius:22px;padding:24px;text-align:center;max-width:460px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.bitti h3{margin:0 0 6px;font:700 40px/1 var(--el)}.bitti p{margin:0 0 16px;font-weight:600}.bitti .kontrol{gap:8px}
@media (prefers-reduced-motion:reduce){.sayfa.cevir{animation:none}#cvRenk{transition:none}}
@media (max-width:640px){.araclar{padding:8px;gap:6px;border-radius:18px}.arac{padding:4px 7px;font-size:12px;border-radius:10px}.renk{width:26px;height:26px}.boy{width:28px;height:28px}.araclar.kucuk .arac-satir:last-child>*:not(.hep){display:none}}
.araclar .kucult{position:absolute;top:-14px;right:14px;border:0;background:#FFFDF6;border-radius:999px;width:34px;height:28px;box-shadow:0 4px 10px rgba(0,0,0,.25);font-weight:900}
body.cizimde .masa{padding-bottom:260px}
@media print{@page{size:A4 portrait;margin:0}
 body{background:#fff!important}.ust,.kontrol,.araclar,.raf,.toast,.bitti,.kalem,.ipucu{display:none!important}
 .masa{padding:0}.sayfa{width:210mm!important;height:297mm;transform:none!important;box-shadow:none!important;border-radius:0;padding:12mm 14mm}
 #cvRenk,#cvCocuk{display:none!important}#cvKopya{opacity:1!important}.metin{max-height:none}.metin span.k{opacity:1!important}.cizim{border:1.5px solid #ddd}}
</style>
</head>
<body>
<header class="ust">
  <div class="marka"><h1>✏️ Çizim Atölyesi</h1><span>Barış Öğretmen’in kitapları</span></div>
  <button class="dugme" id="bKitaplar" hidden>📚 Kitaplar</button>
  <button class="dugme" id="bSes" aria-pressed="true">🔊 Ses</button>
  <button class="dugme" id="bTam">⛶ Tam ekran</button>
  <a class="dugme" id="bEv" href="./" style="text-decoration:none">🏠 Siteye dön</a>
</header>

<main class="raf" id="raf">
  <h2>Hangi kitabı çizelim?</h2>
  <p class="alt">Kalem her sayfayı senin için çizsin, sonra sıra sende!</p>
  <div class="kitaplar" id="kitaplar"><div class="bos">Kitaplar geliyor…</div></div>
</main>

<main class="masa" id="masa" hidden>
  <article class="sayfa" id="sayfa" aria-live="polite">
    <div class="ust-satir"><b id="kAd"></b><span id="kSayfa"></span></div>
    <div class="cizim" id="cizim">
      <canvas id="cvRenk" aria-hidden="true"></canvas>
      <canvas id="cvKopya" aria-hidden="true"></canvas>
      <canvas id="cvCocuk" aria-label="Çizim alanı"></canvas>
      <div class="ipucu" id="ipucu" hidden></div>
      <svg class="kalem" id="kalem" viewBox="0 0 64 64" aria-hidden="true" hidden><g transform="rotate(35 32 32)"><rect x="26" y="2" width="12" height="40" rx="2" fill="#F39A2B" stroke="#2E3136" stroke-width="2"/><rect x="26" y="2" width="12" height="7" fill="#F2B8B5" stroke="#2E3136" stroke-width="2"/><path d="M26 42 L32 58 L38 42Z" fill="#F6D7A7" stroke="#2E3136" stroke-width="2" stroke-linejoin="round"/><path d="M30.5 54 L32 58 L33.5 54Z" fill="#2E3136"/></g></svg>
    </div>
    <div class="metin" id="metin"></div>
    <div class="alt-satir">Barış Öğretmen · Çizim Atölyesi</div>
  </article>
  <div class="kontrol" id="kontrol">
    <button class="dugme" id="bOnceki">◀ Önceki</button>
    <button class="dugme ana" id="bIzle">▶ Çiz ve anlat</button>
    <button class="dugme yesil" id="bBen">✏️ Şimdi ben çizeyim</button>
    <button class="dugme" id="bSonraki">Sonraki ▶</button>
  </div>
</main>

<div class="araclar" id="araclar" hidden><button class="kucult" id="bKucult" aria-label="Araçları küçült / büyüt">▾</button>
  <div class="arac-satir" id="renkler" role="group" aria-label="Renkler"></div>
  <div class="arac-satir">
    <button class="arac hep" data-arac="kalem" aria-pressed="true">✏️ Kalem</button>
    <button class="arac hep" data-arac="boya" aria-pressed="false">🪣 Boya</button>
    <button class="arac hep" data-arac="silgi" aria-pressed="false">🧽 Silgi</button>
    <span id="boylar" class="hep" style="display:inline-flex;gap:4px"></span>
    <button class="arac hep" id="bGeri">↶ Geri</button>
    <button class="arac" id="bKopya" aria-pressed="true">👁 Kopya çizgileri</button>
    <button class="arac" id="bOrijinal">🖼️ Orijinal (basılı tut)</button>
    <button class="arac" id="bTemizle">🗑️ Temizle</button>
    <button class="arac" id="bKaydet">💾 Kaydet</button>
    <button class="arac" id="bYazdir">🖨️ Boyama sayfası yazdır</button>
    <button class="arac hep" id="bBitir">✔ Bitirdim</button>
  </div>
</div>

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const P=new URLSearchParams(location.search);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const imgURL=u=>{u=String(u||'').trim();if(/^data:image\/(webp|jpeg|png);base64,/.test(u))return u;try{const x=new URL(u,location.href);return /^https?:$/.test(x.protocol)?x.href:''}catch{return ''}};
const S={db:null,kitaplar:[],kitap:null,sayfalar:[],n:0,run:0,ses:true,mod:'izle',arac:'kalem',renk:'#2E3136',boy:6,geri:[],cizimler:new Map(),hazir:null};
let toastT;function toast(t){let e=$('.toast');if(!e){e=document.createElement('div');e.className='toast';e.setAttribute('role','status');document.body.append(e)}e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,2800)}
/* ---------- Firebase: sitenin firebase-config.js dosyası kullanılır ---------- */
const yukle=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error(src));document.head.append(s)});
async function baglan(){if(S.db)return S.db;if(!window.firebase)await yukle('https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js');if(!firebase.firestore)await yukle('https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js');if(!firebase.apps.length)await yukle('firebase-config.js');S.db=firebase.firestore();return S.db}
/* ---------- Sesli okuma: kısaltmalar doğru okunur ---------- */
function okunus(t){return String(t||'').replace(/\(\s*s\.?\s*a\.?\s*[vs]\.?\s*\)|\bs\.\s?a\.\s?v\.?|ﷺ/gi,' (sallallahu aleyhi ve sellem)').replace(/\(\s*a\.?\s*s\.?\s*\)/gi,' (aleyhisselam)').replace(/\(\s*r\.?\s*a\.?\s*\)/gi,' (radıyallahu anh)').replace(/\(\s*r\.?\s*anha\.?\s*\)/gi,' (radıyallahu anha)').replace(/\(\s*c\.?\s*c\.?\s*\)/gi,' (celle celalühu)').replace(/\bHz\.\s*/g,'Hazreti ').replace(/[ \t]{2,}/g,' ').trim()}
let sesTR=null;function sesBul(){const v=speechSynthesis.getVoices();sesTR=v.find(x=>/^tr/i.test(x.lang)&&/yelda|seda|filiz|female|kadın/i.test(x.name))||v.find(x=>/^tr/i.test(x.lang))||null}
if('speechSynthesis' in window){sesBul();speechSynthesis.onvoiceschanged=sesBul}
function soyle(t,my){return new Promise(res=>{if(!S.ses||!('speechSynthesis' in window)||!t)return res();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(okunus(t));u.lang='tr-TR';if(sesTR)u.voice=sesTR;u.rate=.92;u.pitch=1.05;let bitti=false;const son=()=>{if(!bitti){bitti=true;res()}};u.onend=son;u.onerror=son;setTimeout(son,1500+t.length*95);if(my!==S.run)return res();speechSynthesis.speak(u)})}
/* ---------- Raf: yalnızca Barış Öğretmen'in kitapları ---------- */
const kapakHTML=k=>{const g=imgURL(k.kapak);const r=/^(#[\da-f]{3,8}|linear-gradient\([\w\s#%,.()\-]+\))$/i.test(k.renk||'')?k.renk:'linear-gradient(135deg,#3F7FD1,#2A5A9C)';return `<span class="kapak" style="background:${esc(r)}">${g?`<img src="${esc(g)}" alt="" loading="lazy">`:esc(k.baslik)}${k.seri&&k.seriNo?`<em>${esc(k.seriNo)}</em>`:''}</span>`};
async function raf(){S.run++;try{speechSynthesis.cancel()}catch{}$('#masa').hidden=true;$('#araclar').hidden=true;$('#raf').hidden=false;$('#bKitaplar').hidden=true;history.replaceState(null,'',location.pathname);
 try{if(!S.kitaplar.length){const db=await baglan();const snap=await db.collection('kitaplar').get();const anahtar=k=>(k.seri||k.baslik||'').toLocaleLowerCase('tr');S.kitaplar=snap.docs.map(d=>({id:d.id,...d.data()})).filter(k=>k.dijitalKitapId&&!k.arsivlendi&&k.cizim!==false).sort((a,b)=>anahtar(a).localeCompare(anahtar(b),'tr')||(Number(a.seriNo)||0)-(Number(b.seriNo)||0))}
  $('#kitaplar').innerHTML=S.kitaplar.length?S.kitaplar.map(k=>`<button class="kitap" data-k="${esc(k.dijitalKitapId)}">${kapakHTML(k)}<b>${esc(k.baslik)}</b>${k.seri?`<small>📚 ${esc(k.seri)} serisi${k.seriNo?' · '+esc(k.seriNo)+'. kitap':''}</small>`:k.altBaslik?`<small>${esc(k.altBaslik)}</small>`:''}</button>`).join(''):'<div class="bos">Henüz kitap yok. Yönetici panelinde “HİKAYE YAZ” ile yazdığın kitaplar burada kendiliğinden görünür.</div>';
  $$('#kitaplar [data-k]').forEach(b=>b.onclick=()=>kitapAc(b.dataset.k))}catch(e){$('#kitaplar').innerHTML='<div class="bos">Kitaplar yüklenemedi. İnternet bağlantını kontrol edip sayfayı yenile.</div>'}}
async function kitapAc(id){S.run++;try{const db=await baglan();const d=await db.collection('dijital_kitaplar').doc(id).get();if(!d.exists)throw 0;S.sayfalar=(d.data().sayfalar||[]).filter(p=>String(p.text||'').trim()||imgURL(p.img));if(!S.sayfalar.length)return toast('Bu kitabın sayfaları henüz eklenmemiş.');S.kitap=S.kitaplar.find(k=>k.dijitalKitapId===id)||{baslik:d.data().baslik||'Kitap',dijitalKitapId:id};S.n=0;S.cizimler.clear();S.geri=[];$('#raf').hidden=true;$('#masa').hidden=false;$('#bKitaplar').hidden=false;history.replaceState(null,'','?kitap='+encodeURIComponent(id));sayfaGoster(true)}catch(e){toast('Kitap açılamadı.');raf()}}
/* ---------- A4 sayfa ve tuvaller ---------- */
const cv={renk:$('#cvRenk'),kopya:$('#cvKopya'),cocuk:$('#cvCocuk')};const ctx={renk:cv.renk.getContext('2d'),kopya:cv.kopya.getContext('2d'),cocuk:cv.cocuk.getContext('2d',{willReadFrequently:true})};
let W=0,H=0,DPR=1;
function boyutla(){const r=$('#cizim').getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);const w=Math.max(10,Math.round(r.width*DPR)),h=Math.max(10,Math.round(r.height*DPR));if(w===W&&h===H)return false;const eski=W?cv.cocuk.toDataURL():null;W=w;H=h;Object.values(cv).forEach(c=>{c.width=W;c.height=H});if(eski){const im=new Image();im.onload=()=>ctx.cocuk.drawImage(im,0,0,W,H);im.src=eski}return true}
function metinYaz(t){const el=$('#metin');el.innerHTML='';const p=document.createElement('p');p.style.margin='0';String(t||'').split(/(\s+)/).forEach(w=>{if(!w)return;if(/^\s+$/.test(w)){p.append(w);return}const s=document.createElement('span');s.className='k';s.textContent=w;p.append(s)});el.append(p)}
/* Sayfanın resmini kurşun kalem çizgisine çevir (yalnızca kendi resimlerin kullanılır, yeni figür üretilmez) */
function resimYukle(u){return new Promise(ok=>{if(!u)return ok(null);const im=new Image();if(!/^data:/.test(u))im.crossOrigin='anonymous';im.onload=()=>ok(im);im.onerror=()=>{if(im.crossOrigin){const j=new Image();j.onload=()=>{j._kirli=true;ok(j)};j.onerror=()=>ok(null);j.src=u}else ok(null)};im.src=u})}
function sigdir(im){const k=Math.min(W/im.width,H/im.height),w=im.width*k,h=im.height*k;return [(W-w)/2,(H-h)/2,w,h]}
function cizgiCikar(im){if(im._kirli)return null;const off=document.createElement('canvas');off.width=W;off.height=H;const o=off.getContext('2d',{willReadFrequently:true});o.fillStyle='#fff';o.fillRect(0,0,W,H);o.drawImage(im,...sigdir(im));let d;try{d=o.getImageData(0,0,W,H)}catch{return null}
 const n=W*H,g=new Float32Array(n),px=d.data;for(let i=0;i<n;i++)g[i]=.299*px[i*4]+.587*px[i*4+1]+.114*px[i*4+2];
 const b=new Float32Array(n);for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=y*W+x;b[i]=(g[i]*4+g[i-1]*2+g[i+1]*2+g[i-W]*2+g[i+W]*2+g[i-W-1]+g[i-W+1]+g[i+W-1]+g[i+W+1])/16}
 const m=new Float32Array(n);let top=0,kare=0,say=0;for(let y=2;y<H-2;y++)for(let x=2;x<W-2;x++){const i=y*W+x;const gx=b[i-W+1]+2*b[i+1]+b[i+W+1]-b[i-W-1]-2*b[i-1]-b[i+W-1],gy=b[i+W-1]+2*b[i+W]+b[i+W+1]-b[i-W-1]-2*b[i-W]-b[i-W+1];const v=Math.hypot(gx,gy);m[i]=v;top+=v;kare+=v*v;say++}
 const ort=top/say,sap=Math.sqrt(Math.max(0,kare/say-ort*ort)),esik=Math.max(18,ort+sap*.9);
 const out=o.createImageData(W,H),q=out.data;for(let i=0;i<n;i++){const v=m[i];if(v>esik){q[i*4]=46;q[i*4+1]=49;q[i*4+2]=54;q[i*4+3]=Math.min(255,(v-esik)*2.4+70)}}
 const line=document.createElement('canvas');line.width=W;line.height=H;line.getContext('2d').putImageData(out,0,0);return line}
/* Kalemle çizme: çizgiler küçük parçalar hâlinde, en yakın komşu sırasıyla ortaya çıkar */
function kalemGoster(x,y){const k=$('#kalem');k.hidden=false;k.style.left=(x/DPR)+'px';k.style.top=(y/DPR)+'px'}
async function kalemleCiz(line,my){const T=Math.max(12,Math.round(Math.min(W,H)/32));const data=line.getContext('2d',{willReadFrequently:true}).getImageData(0,0,W,H).data;const karolar=[];
 for(let y=0;y<H;y+=T)for(let x=0;x<W;x+=T){let c=0;for(let yy=y;yy<Math.min(H,y+T);yy+=2)for(let xx=x;xx<Math.min(W,x+T);xx+=2)if(data[(yy*W+xx)*4+3]>60)c++;if(c>2)karolar.push([x,y])}
 if(!karolar.length)return;const sira=[],kalan=new Set(karolar.map((_,i)=>i));let bx=0,by=0;
 while(kalan.size){let best=-1,bd=Infinity;for(const i of kalan){const [x,y]=karolar[i],dd=(x-bx)**2+(y-by)**2;if(dd<bd){bd=dd;best=i}}kalan.delete(best);sira.push(karolar[best]);[bx,by]=karolar[best]}
 const sure=Math.min(11000,Math.max(3500,sira.length*9)),bas=performance.now();let i=0;
 await new Promise(res=>{const adim=t=>{if(my!==S.run)return res();const hedef=Math.min(sira.length,Math.ceil((t-bas)/sure*sira.length));for(;i<hedef;i++){const [x,y]=sira[i];ctx.kopya.drawImage(line,x,y,T,T,x,y,T,T)}if(i>0){const [x,y]=sira[i-1];kalemGoster(x+T/2,y+T/2)}if(i<sira.length)requestAnimationFrame(adim);else res()};requestAnimationFrame(adim)});$('#kalem').hidden=true}
/* Resmin pikselleri okunamazsa: perde açılır gibi göster */
async function perdeyleGoster(im,my){const [x,y,w,h]=sigdir(im);const sure=2600,bas=performance.now();cv.renk.style.transition='none';cv.renk.style.opacity=1;await new Promise(res=>{const adim=t=>{if(my!==S.run)return res();const k=Math.min(1,(t-bas)/sure);ctx.renk.clearRect(0,0,W,H);ctx.renk.save();ctx.renk.beginPath();ctx.renk.rect(x,y,w*k,h);ctx.renk.clip();ctx.renk.drawImage(im,x,y,w,h);ctx.renk.restore();kalemGoster(x+w*k,y+h*(.5+.35*Math.sin(k*18)));if(k<1)requestAnimationFrame(adim);else res()};requestAnimationFrame(adim)});cv.renk.style.transition='';$('#kalem').hidden=true}
/* ---------- Sayfa akışı ---------- */
async function sayfaGoster(otomatik){const my=++S.run;try{speechSynthesis.cancel()}catch{}cocukModu(false,true);const p=S.sayfalar[S.n];$('#kAd').textContent=S.kitap.baslik||'';$('#kSayfa').textContent=`Sayfa ${S.n+1} / ${S.sayfalar.length}`;$('#bOnceki').disabled=S.n===0;$('#bSonraki').disabled=S.n>=S.sayfalar.length-1;$('#bIzle').textContent='▶ Çiz ve anlat';
 const sy=$('#sayfa');sy.classList.remove('cevir');void sy.offsetWidth;sy.classList.add('cevir');await new Promise(r=>setTimeout(r,80));boyutla();S.geri=[];
 Object.values(ctx).forEach(c=>c.clearRect(0,0,W,H));cv.renk.style.opacity=0;S.hazir=null;metinYaz(p.text);$('#ipucu').hidden=true;
 const kayit=S.cizimler.get(S.n);if(kayit){const im=await resimYukle(kayit);if(im&&my===S.run)ctx.cocuk.drawImage(im,0,0,W,H)}
 const im=await resimYukle(imgURL(p.img));if(my!==S.run)return;S.hazir={im,line:im?cizgiCikar(im):null};
 if(!im){$('#ipucu').hidden=false;$('#ipucu').textContent='Bu sayfanın resmini sen çiz! ✏️'}
 if(otomatik)izle(my)}
async function izle(my){my=my||++S.run;cocukModu(false,true);const p=S.sayfalar[S.n],h=S.hazir;$('#bIzle').textContent='⏸ Durdur';const kel=$$('#metin .k');kel.forEach(k=>k.classList.remove('on'));
 const okuma=(async()=>{await new Promise(r=>setTimeout(r,900));const sure=Math.max(1800,String(p.text||'').length*62),bas=performance.now();const anim=new Promise(res=>{const adim=t=>{if(my!==S.run)return res();const k=Math.min(1,(t-bas)/sure),n=Math.ceil(k*kel.length);kel.forEach((e,i)=>e.classList.toggle('on',i<n));if(k<1)requestAnimationFrame(adim);else res()};requestAnimationFrame(adim)});await Promise.all([anim,soyle(p.text,my)]);kel.forEach(e=>e.classList.add('on'))})();
 if(h&&h.im){ctx.kopya.clearRect(0,0,W,H);ctx.renk.clearRect(0,0,W,H);cv.renk.style.opacity=0;if(h.line){await kalemleCiz(h.line,my);if(my!==S.run)return;ctx.renk.drawImage(h.im,...sigdir(h.im));cv.renk.style.opacity=1}else await perdeyleGoster(h.im,my)}
 await okuma;if(my!==S.run)return;$('#bIzle').textContent='🔁 Tekrar izle';if(S.n>=S.sayfalar.length-1)setTimeout(()=>{if(my===S.run)bitis()},900)}
function bitis(){const k=S.kitap,seri=S.kitaplar.filter(x=>x.seri&&x.seri===k.seri).sort((a,b)=>(a.seriNo||99)-(b.seriNo||99));const sonraki=seri[seri.findIndex(x=>x.dijitalKitapId===k.dijitalKitapId)+1];
 const d=document.createElement('div');d.className='bitti';d.innerHTML=`<div class="kart" role="dialog" aria-modal="true"><h3>🎉 Kitap bitti!</h3><p>“${esc(k.baslik)}” kitabını tamamladın. En sevdiğin sayfayı şimdi sen çiz!</p><div class="kontrol"><button class="dugme yesil" data-b="ben">✏️ Şimdi ben çizeyim</button>${sonraki?`<button class="dugme ana" data-b="sonraki">📚 Sıradaki: ${esc(sonraki.baslik)}</button>`:''}<button class="dugme" data-b="bastan">🔁 Baştan</button><button class="dugme" data-b="raf">📚 Kitaplar</button></div></div>`;document.body.append(d);d.querySelector('button').focus();
 d.onclick=e=>{const b=e.target.closest('[data-b]');if(!b&&e.target!==d)return;d.remove();const a=b?.dataset.b;if(a==='ben')cocukModu(true);else if(a==='sonraki')kitapAc(sonraki.dijitalKitapId);else if(a==='bastan'){S.n=0;sayfaGoster(true)}else if(a==='raf')raf()}}
function git(d){const m=S.n+d;if(m<0||m>=S.sayfalar.length)return;sakla();S.n=m;sayfaGoster(true)}
function sakla(){if(S.geri.length)S.cizimler.set(S.n,cv.cocuk.toDataURL())}
/* ---------- Çocuğun çizimi ---------- */
const RENKLER=['#2E3136','#E5484D','#F39A2B','#F5C518','#59A14F','#3F7FD1','#7B5BD6','#E76FA8','#8B5A2B','#FFFFFF'];
$('#renkler').innerHTML=RENKLER.map((r,i)=>`<button class="renk" data-renk="${r}" style="background:${r}" aria-label="Renk ${i+1}" aria-pressed="${i===0}"></button>`).join('');
$('#boylar').innerHTML=[[3,8],[6,13],[14,20]].map(([b,g],i)=>`<button class="boy" data-boy="${b}" aria-label="Kalınlık ${i+1}" aria-pressed="${i===1}"><i style="width:${g}px;height:${g}px"></i></button>`).join('');
function cocukModu(on,sessiz){S.mod=on?'ciz':'izle';document.body.classList.toggle('cizimde',on);$('#cizim').classList.toggle('cocuk',on);$('#araclar').hidden=!on;$('#kontrol').hidden=on;if(!on)return;S.run++;try{speechSynthesis.cancel()}catch{}$('#kalem').hidden=true;$('#bIzle').textContent='▶ Çiz ve anlat';$$('#metin .k').forEach(k=>k.classList.add('on'));const h=S.hazir;ctx.kopya.clearRect(0,0,W,H);if(h&&h.im){if(h.line)ctx.kopya.drawImage(h.line,0,0);else{ctx.kopya.globalAlpha=.5;ctx.kopya.drawImage(h.im,...sigdir(h.im));ctx.kopya.globalAlpha=1}}cv.renk.style.opacity=0;$('#ipucu').hidden=true;if(!sessiz)toast('Şimdi sen çiz! Kopya çizgilerin üzerinden geçebilir ya da kendi resmini yapabilirsin.')}
function geriKaydet(){S.geri.push(ctx.cocuk.getImageData(0,0,W,H));if(S.geri.length>25)S.geri.shift()}
let ciziyor=false,son=null;const nokta=e=>{const r=cv.cocuk.getBoundingClientRect();return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
cv.cocuk.addEventListener('pointerdown',e=>{if(S.mod!=='ciz')return;e.preventDefault();try{cv.cocuk.setPointerCapture(e.pointerId)}catch{}const [x,y]=nokta(e);geriKaydet();if(S.arac==='boya'){boya(Math.round(x),Math.round(y));return}ciziyor=true;son=[x,y];ciz(x,y,x+.1,y+.1)});
cv.cocuk.addEventListener('pointermove',e=>{if(!ciziyor)return;const ev=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const c of (ev.length?ev:[e])){const [x,y]=nokta(c);ciz(son[0],son[1],x,y);son=[x,y]}});
['pointerup','pointercancel','pointerleave'].forEach(t=>cv.cocuk.addEventListener(t,()=>{ciziyor=false;son=null}));
function ciz(x0,y0,x1,y1){const c=ctx.cocuk;c.lineCap='round';c.lineJoin='round';c.lineWidth=S.boy*DPR*(S.arac==='silgi'?2.4:1);c.globalCompositeOperation=S.arac==='silgi'?'destination-out':'source-over';c.strokeStyle=S.renk;c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.stroke();c.globalCompositeOperation='source-over'}
/* Boya kovası: kopya çizgileri ve çocuğun kendi çizgileri sınır kabul edilir */
function boya(x,y){if(x<0||y<0||x>=W||y>=H)return;const kd=ctx.cocuk.getImageData(0,0,W,H),k=kd.data;let sinir=null;if(!$('#cizim').classList.contains('kopya-yok')){try{sinir=ctx.kopya.getImageData(0,0,W,H).data}catch{}}
 const hex=S.renk.replace('#','');const R=parseInt(hex.slice(0,2),16),G=parseInt(hex.slice(2,4),16),B=parseInt(hex.slice(4,6),16);const i0=(y*W+x)*4;const r0=k[i0],g0=k[i0+1],b0=k[i0+2],a0=k[i0+3];if(a0>200&&Math.abs(r0-R)+Math.abs(g0-G)+Math.abs(b0-B)<10)return;
 const ayni=i=>{if(sinir&&sinir[i+3]>90)return false;return Math.abs(k[i]-r0)+Math.abs(k[i+1]-g0)+Math.abs(k[i+2]-b0)+Math.abs(k[i+3]-a0)<60};
 const gor=new Uint8Array(W*H),yig=[[x,y]];while(yig.length){let [cx,cy]=yig.pop();let i=cy*W+cx;while(cx>=0&&!gor[i]&&ayni(i*4)){cx--;i--}cx++;i++;let ust=false,alt=false;while(cx<W&&!gor[i]&&ayni(i*4)){gor[i]=1;const j=i*4;k[j]=R;k[j+1]=G;k[j+2]=B;k[j+3]=255;if(cy>0){const u=i-W;if(!gor[u]&&ayni(u*4)){if(!ust){yig.push([cx,cy-1]);ust=true}}else ust=false}if(cy<H-1){const a=i+W;if(!gor[a]&&ayni(a*4)){if(!alt){yig.push([cx,cy+1]);alt=true}}else alt=false}cx++;i++}}
 ctx.cocuk.putImageData(kd,0,0)}
$('#renkler').onclick=e=>{const b=e.target.closest('[data-renk]');if(!b)return;S.renk=b.dataset.renk;$$('#renkler .renk').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));if(S.arac==='silgi')aracSec('kalem')};
$('#boylar').onclick=e=>{const b=e.target.closest('[data-boy]');if(!b)return;S.boy=+b.dataset.boy;$$('#boylar .boy').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))};
function aracSec(a){S.arac=a;$$('[data-arac]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.arac===a)))}
$$('[data-arac]').forEach(b=>b.onclick=()=>aracSec(b.dataset.arac));
$('#bGeri').onclick=()=>{const g=S.geri.pop();if(g)ctx.cocuk.putImageData(g,0,0)};
$('#bTemizle').onclick=()=>{geriKaydet();ctx.cocuk.clearRect(0,0,W,H)};
$('#bKopya').onclick=()=>{const yok=$('#cizim').classList.toggle('kopya-yok');$('#bKopya').setAttribute('aria-pressed',String(!yok))};
const orijinal=on=>{const h=S.hazir;if(!h||!h.im){if(on)toast('Bu sayfanın resmi yok.');return}if(on){ctx.renk.clearRect(0,0,W,H);ctx.renk.drawImage(h.im,...sigdir(h.im))}cv.renk.style.transition='none';cv.renk.style.opacity=on?1:0;setTimeout(()=>cv.renk.style.transition='',50)};
$('#bOrijinal').addEventListener('pointerdown',()=>orijinal(true));['pointerup','pointerleave','pointercancel'].forEach(t=>$('#bOrijinal').addEventListener(t,()=>orijinal(false)));
$('#bKaydet').onclick=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);if(!$('#cizim').classList.contains('kopya-yok'))x.drawImage(cv.kopya,0,0);x.drawImage(cv.cocuk,0,0);c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(S.kitap.baslik||'cizim').replace(/[^\p{L}\p{N}]+/gu,'-')+'-sayfa-'+(S.n+1)+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)},'image/png');toast('💾 Resmin kaydedildi.')};
$('#bYazdir').onclick=()=>{const h=S.hazir;ctx.kopya.clearRect(0,0,W,H);if(h&&h.im){if(h.line)ctx.kopya.drawImage(h.line,0,0);else ctx.kopya.drawImage(h.im,...sigdir(h.im))}$$('#metin .k').forEach(k=>k.classList.add('on'));window.print()};
$('#bBitir').onclick=()=>{sakla();cocukModu(false);toast('Harika! 🌟 Çizimin bu sayfada saklandı.')};
/* ---------- Düğmeler ---------- */
$('#bKucult').onclick=()=>{const k=$('#araclar').classList.toggle('kucuk');$('#bKucult').textContent=k?'▴':'▾'};
$('#bOnceki').onclick=()=>git(-1);$('#bSonraki').onclick=()=>git(1);
$('#bIzle').onclick=()=>{if($('#bIzle').textContent.startsWith('⏸')){S.run++;try{speechSynthesis.cancel()}catch{}$('#kalem').hidden=true;$('#bIzle').textContent='▶ Çiz ve anlat'}else izle()};
$('#bBen').onclick=()=>cocukModu(true);
$('#bKitaplar').onclick=()=>{sakla();raf()};
$('#bSes').onclick=()=>{S.ses=!S.ses;$('#bSes').setAttribute('aria-pressed',String(S.ses));$('#bSes').textContent=S.ses?'🔊 Ses':'🔇 Ses';if(!S.ses)try{speechSynthesis.cancel()}catch{}};
$('#bTam').onclick=()=>{const d=document;if(d.fullscreenElement)d.exitFullscreen?.();else d.documentElement.requestFullscreen?.().catch(()=>{})};
document.addEventListener('keydown',e=>{if($('#masa').hidden||S.mod==='ciz'||e.target.closest('input,textarea'))return;if(e.key==='ArrowRight')git(1);else if(e.key==='ArrowLeft')git(-1)});
let x0=null;$('#sayfa').addEventListener('touchstart',e=>{if(S.mod==='ciz')return;x0=e.touches[0].clientX},{passive:true});$('#sayfa').addEventListener('touchend',e=>{if(x0===null||S.mod==='ciz')return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>60)git(dx<0?1:-1)});
let rT;window.addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{if($('#masa').hidden)return;if(boyutla()){const h=S.hazir;if(h&&h.im){h.line=cizgiCikar(h.im);ctx.kopya.clearRect(0,0,W,H);if(h.line&&S.mod==='ciz')ctx.kopya.drawImage(h.line,0,0);ctx.renk.clearRect(0,0,W,H);ctx.renk.drawImage(h.im,...sigdir(h.im));if(S.mod!=='ciz')cv.renk.style.opacity=1}}},200)});
/* Site içinde açıldıysa "Siteye dön" pencereyi kapatsın */
if(window.top!==window){$('#bEv').onclick=e=>{e.preventDefault();try{window.parent.oyunKapat?.()}catch{}}}
(async()=>{await raf();const id=P.get('kitap');if(id)kitapAc(id)})();
})();
</script>
