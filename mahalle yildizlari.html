<style>
:root{--kirmizi:#e63946;--sari:#ffd23f;--lacivert:#1d2b53;--krem:#fff4e0;--yesil:#2ec27e;--uiz:1;
  --font:'Nunito','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;--piksel:'Pixelify Sans','Nunito',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#14182b;overflow:hidden;font-family:var(--font);color:#fff;
  touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font-family:var(--font);cursor:pointer}
#cv{position:absolute;background:#000}
#cv.piksel{image-rendering:pixelated;image-rendering:crisp-edges}
.gizli{display:none!important}

/* ---------- Kontroller (çocuk boyu: hepsi altta) ---------- */
.kontrol{position:fixed;left:0;right:0;bottom:0;height:0;z-index:20;pointer-events:none}
.kbtn{position:fixed;pointer-events:auto;border:0;border-radius:18px;color:#fff;font-weight:700;
  background:rgba(20,24,43,.55);box-shadow:0 4px 0 rgba(0,0,0,.35),inset 0 0 0 3px rgba(255,255,255,.25);
  font-size:26px;width:74px;height:74px;display:flex;align-items:center;justify-content:center;zoom:var(--uiz);
  touch-action:none;backdrop-filter:blur(2px)}
.kbtn:active,.kbtn.basili{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35),inset 0 0 0 3px rgba(255,255,255,.5)}
#bSol{left:calc(14px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom))}
#bSag{left:calc(98px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom))}
#bEtk{right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));width:auto;min-width:96px;padding:0 16px;
  font-size:20px;background:linear-gradient(#ffd23f,#f4a300);color:#3b2400;box-shadow:0 4px 0 #a86a00,inset 0 0 0 3px #fff6}
#bEtk.pasif{opacity:.35;filter:grayscale(.6)}
#bEtk.nabiz{animation:nabiz 1s infinite}
@keyframes nabiz{50%{transform:scale(1.08)}}
#joy{position:fixed;pointer-events:auto;left:calc(18px + env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.12),rgba(20,24,43,.45));box-shadow:inset 0 0 0 3px rgba(255,255,255,.3);zoom:var(--uiz);touch-action:none}
#joyK{position:absolute;left:41px;top:41px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 3px 0 rgba(0,0,0,.3)}
#bPas{right:calc(112px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));background:linear-gradient(#4ea8ff,#1f6fd1);font-size:19px}
#bSut{right:calc(16px + env(safe-area-inset-right));bottom:calc(40px + env(safe-area-inset-bottom));width:88px;height:88px;background:linear-gradient(#ff6b6b,#d62839);font-size:21px}
#bSut.super{background:linear-gradient(#ffe066,#ff9f1c);color:#4a2500;animation:nabiz .7s infinite;box-shadow:0 0 18px #ffd23f,0 4px 0 #a86a00}
#bTek{right:calc(16px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));width:120px;height:96px;font-size:24px;background:linear-gradient(#2ec27e,#168a55)}

/* ---------- HUD (yalnız gösterim, üstte) ---------- */
#hud{position:fixed;top:calc(8px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));right:calc(10px + env(safe-area-inset-right));
  display:flex;justify-content:space-between;align-items:flex-start;z-index:15;pointer-events:none;zoom:var(--uiz)}
.hpill{background:rgba(20,24,43,.72);border-radius:12px;padding:6px 10px;font-size:15px;line-height:1.25;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}
.hpill b{color:var(--sari)}
#hudSag{display:flex;gap:6px;pointer-events:auto}
.hsite{background:linear-gradient(#4ea8ff,#1f6fd1)!important}
#mSite{border:0;border-radius:14px;padding:9px 18px;font-size:clamp(16px,2.2vw,20px);font-weight:800;color:#fff;background:linear-gradient(#4ea8ff,#1f6fd1);box-shadow:0 0 0 3px #13315c,0 5px 0 3px #13315c}
.hmini{border:0;background:rgba(20,24,43,.72);color:#fff;border-radius:12px;font-size:18px;width:40px;height:36px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}

/* ---------- Diyalog ---------- */
#dlg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(760px,calc(100% - 20px));
  background:var(--krem);color:#2a1d10;border-radius:14px;box-shadow:0 0 0 4px #3b2a1a,0 8px 0 4px rgba(0,0,0,.35);
  display:flex;gap:12px;padding:12px 14px;z-index:40;zoom:var(--uiz);pointer-events:auto}
#dlgYuz{width:76px;height:76px;flex:0 0 76px;image-rendering:pixelated;border-radius:10px;box-shadow:0 0 0 3px #3b2a1a}
#dlgSag{flex:1;min-width:0}
#dlgAd{display:inline-block;background:#7b4bd1;color:#fff;font-weight:700;padding:2px 10px;border-radius:8px;font-size:15px;margin-bottom:4px}
#dlgMetin{font-size:clamp(16px,2.3vw,21px);line-height:1.35;min-height:2.6em;white-space:pre-wrap}
#dlgIleri{position:absolute;right:14px;bottom:8px;font-size:18px;animation:zipla .6s infinite alternate}
@keyframes zipla{to{transform:translateY(-4px)}}
#dlgSec{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.secbtn{border:0;border-radius:12px;padding:10px 14px;font-size:clamp(15px,2vw,19px);font-weight:700;background:#ffd23f;color:#3b2400;box-shadow:0 4px 0 #b88a00}
.secbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #b88a00}
.secbtn.ikincil{background:#e7dcc8;box-shadow:0 4px 0 #a99b84}
.secbtn:disabled{opacity:.45}

/* ---------- Modal / Soru ---------- */
.modal{position:fixed;inset:0;background:rgba(10,12,25,.62);z-index:60;display:flex;align-items:flex-end;justify-content:center;pointer-events:auto;
  padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
.mkart{width:min(720px,100%);max-height:calc(100% - 10px);overflow:auto;background:var(--krem);color:#2a1d10;border-radius:16px;padding:16px 18px;
  box-shadow:0 0 0 4px #3b2a1a,0 10px 0 4px rgba(0,0,0,.35);zoom:var(--uiz);touch-action:pan-y;-webkit-user-select:text;user-select:text}
.mkart h2{margin:0 0 8px;font-size:clamp(20px,3vw,28px);color:#7b2e9e}
.mkart p{margin:6px 0;font-size:clamp(15px,2vw,19px);line-height:1.4}
.mbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.soruust{display:flex;justify-content:space-between;font-size:15px;color:#7a6346;font-weight:700}
.sorumetin{font-size:clamp(21px,3.1vw,32px);font-weight:800;margin:8px 0 14px;line-height:1.35;color:#1d1408;font-variant-numeric:lining-nums tabular-nums;letter-spacing:.2px}
.siklar{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sik{border:0;border-radius:14px;padding:14px 14px;font-size:clamp(19px,2.6vw,27px);font-weight:800;font-variant-numeric:lining-nums tabular-nums;background:#fff;color:#2a1d10;
  box-shadow:0 0 0 3px #3b2a1a,0 5px 0 3px #3b2a1a;text-align:left;min-height:58px}
.sik:active{transform:translateY(3px)}
.sik.dogru{background:#b8f2c9;box-shadow:0 0 0 3px #168a55,0 5px 0 3px #168a55}
.sik.yanlis{background:#ffc9c9;box-shadow:0 0 0 3px #b3261e,0 5px 0 3px #b3261e}
.aciklama{margin-top:10px;padding:10px 12px;border-radius:12px;background:#fff;font-size:clamp(15px,2vw,18px);line-height:1.4;box-shadow:inset 0 0 0 2px #e2d3b8}
.ilerleme{display:flex;gap:6px;margin-top:4px}.ilerleme i{width:22px;height:8px;border-radius:4px;background:#e2d3b8}.ilerleme i.d{background:#2ec27e}.ilerleme i.y{background:#e63946}
@media (max-width:560px){.siklar{grid-template-columns:1fr}}
.kartyuz{width:96px;height:96px;image-rendering:pixelated;border-radius:12px;box-shadow:0 0 0 3px #3b2a1a;float:left;margin:0 14px 6px 0}
.rozet{display:inline-block;background:#7b4bd1;color:#fff;border-radius:8px;padding:2px 8px;font-size:14px;margin:2px 4px 2px 0}
.stat{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:17px}.stat .bar{flex:1;height:12px;background:#e2d3b8;border-radius:6px;overflow:hidden}.stat .bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb703,#e63946)}
table.fik{width:100%;border-collapse:collapse;font-size:16px}table.fik td{padding:7px 6px;border-bottom:2px dashed #e2d3b8}

/* ---------- Başlık menüsü ---------- */
#menu{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:space-between;pointer-events:none;
  padding:calc(14px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
#logo{text-align:center;zoom:var(--uiz);margin-top:2vh;animation:logoGel .8s cubic-bezier(.2,1.6,.4,1)}
@keyframes logoGel{from{transform:scale(.4) rotate(-6deg);opacity:0}}
#logo .l1{font-family:var(--piksel);font-size:clamp(38px,8.5vw,92px);font-weight:700;line-height:.95;letter-spacing:2px;color:#ffd23f;
  text-shadow:0 4px 0 #e85d04,0 8px 0 #9d0208,4px 0 0 #2a0f0f,-4px 0 0 #2a0f0f,0 -4px 0 #2a0f0f,0 12px 0 #2a0f0f,0 14px 18px rgba(0,0,0,.4)}
#logo .l2{display:inline-block;margin-top:14px;font-size:clamp(18px,3vw,30px);font-weight:700;background:#2b3a67;color:#fff;padding:4px 16px;border-radius:10px;
  box-shadow:0 0 0 3px #fff,0 6px 0 3px rgba(0,0,0,.3);transform:rotate(-2deg)}
#menuAlt{display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:auto;zoom:var(--uiz)}
.buyuk{border:0;border-radius:18px;padding:14px 34px;font-size:clamp(22px,3.4vw,32px);font-weight:700;color:#3b2400;background:linear-gradient(#ffe066,#ffb703);
  box-shadow:0 0 0 4px #3b2a1a,0 8px 0 4px #3b2a1a;animation:nabiz 1.6s infinite}
.buyuk:active{transform:translateY(5px);box-shadow:0 0 0 4px #3b2a1a,0 3px 0 4px #3b2a1a}
.soluk{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;opacity:.72}
.soluk button{border:0;background:rgba(20,24,43,.7);color:#fff;border-radius:10px;padding:7px 10px;font-size:15px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.2)}
#surumRozet{position:fixed;left:calc(8px + env(safe-area-inset-left));bottom:calc(6px + env(safe-area-inset-bottom));font-size:12px;opacity:.5;border:0;background:rgba(0,0,0,.35);color:#fff;border-radius:8px;padding:3px 7px;pointer-events:auto}
#yeniSurum{position:fixed;right:10px;top:calc(10px + env(safe-area-inset-top));z-index:70;border:0;border-radius:12px;padding:8px 12px;background:#d62839;color:#fff;font-weight:700;animation:nabiz 1s infinite;pointer-events:auto}
#acilisBanner{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:65;background:rgba(20,24,43,.88);border-radius:12px;padding:7px 12px;font-size:14px;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.2);pointer-events:auto;max-width:calc(100% - 20px);text-align:center}

/* ---------- Diğer ---------- */
#altyazi{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:35;background:rgba(0,0,0,.72);color:#fff;

(function(){
  const AYAR=window.ZGIRIS_AYAR||{projectId:'shaped-totem-481514-c5',apiKey:'',koleksiyon:'oyun_girisleri',pin:'2026'};
  const BASE='https://firestore.googleapis.com/v1/projects/'+AYAR.projectId+'/databases/(default)/documents';
  const LS_OGR='zirve_ogrenci',LS_BEK='zirve_giris_bekleyen',LS_OK='zirve_ogretmen_ok';
  let ogrenci=null,docId=null,oyunAdi='',renk='#7b4bd1',sonTimer=null;
  const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
  const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
  const u=(p,q)=>{const a=[];if(q)a.push(q);if(AYAR.apiKey)a.push('key='+encodeURIComponent(AYAR.apiKey));return BASE+p+(a.length?'?'+a.join('&'):'')};
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function cihaz(){
    const ua=navigator.userAgent||'',w=Math.max(screen.width,screen.height),dpr=window.devicePixelRatio||1;
    const dok=('ontouchstart' in window)||navigator.maxTouchPoints>0;
    let os='Diğer';
    if(/iPhone/.test(ua))os='iPhone';else if(/iPad/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1))os='iPad';
    else if(/Android/.test(ua))os='Android';else if(/CrOS/.test(ua))os='Chromebook';else if(/Windows/.test(ua))os='Windows';
    else if(/Macintosh/.test(ua))os='Mac';else if(/Linux/.test(ua))os='Linux';
    let tur='Bilgisayar';
    if(dok&&((w*dpr>=1700&&dpr<=1.3&&w>=1700)||w>=3000))tur='Akıllı Tahta';
    else if(os==='iPhone'||(os==='Android'&&/Mobile/.test(ua)))tur='Telefon';
    else if(os==='iPad'||os==='Android')tur='Tablet';
    let tar='Diğer';
    if(/Edg\//.test(ua))tar='Edge';else if(/OPR\//.test(ua))tar='Opera';else if(/Chrome\//.test(ua)||/CriOS/.test(ua))tar='Chrome';

    return {os,tur,tarayici:tar,ekran:screen.width+'x'+screen.height};

    clearInterval(sonTimer);sonTimer=setInterval(sonGoruldu,120000);
  }
  async function sonGoruldu(){
    if(!docId||document.hidden)return;

  }
  async function bekleyenGonder(){
    const q=lsGet(LS_BEK,[]);if(!q.length||!navigator.onLine)return;const kalan=[];

    lsSet(LS_BEK,kalan);
  }
  window.addEventListener('online',bekleyenGonder);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)sonGoruldu()});
  async function listele(){
    const body={structuredQuery:{from:[{collectionId:AYAR.koleksiyon}],orderBy:[{field:{fieldPath:'giris'},direction:'DESCENDING'}],limit:800}};
    const r=await fetch(BASE+':runQuery'+(AYAR.apiKey?'?key='+encodeURIComponent(AYAR.apiKey):''),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();

const kullanildi={};
function soruSec(konu,adet){
  const lv=SB[seviye()]||SB['34'];let havuz=[];
  const kl=konu==='karisik'?['mat','tr','fen','gen']:[konu];
  kl.forEach(k=>(lv[k]||[]).forEach((q,i)=>havuz.push({q,id:seviye()+k+i})));
  let taze=havuz.filter(x=>!kullanildi[x.id]);if(taze.length<adet){havuz.forEach(x=>delete kullanildi[x.id]);taze=havuz}
  return karistir(taze).slice(0,adet).map(x=>{kullanildi[x.id]=1;return x.q});
}

let dlgCb=null,dlgYaziyor=false,dlgTam='',dlgTimer=null;

  const k=KIM[kim]||KIM.ben;$('#dlg').classList.remove('gizli');$('#dlgSec').innerHTML='';
  $('#dlgAd').textContent=k.ad();$('#dlgAd').style.background=k.renk;yuzCiz($('#dlgYuz'),kim);

const tus={},dok={sol:false,sag:false},joy={x:0,y:0};
window.addEventListener('keydown',e=>{

  if(!e.repeat&&sahne&&sahne.tus&&!blok())sahne.tus(c);
});
window.addEventListener('keyup',e=>{tus[e.code]=false});

function basiliTut(el,ad){
  const on=e=>{e.preventDefault();dok[ad]=true;el.classList.add('basili');try{el.setPointerCapture(e.pointerId)}catch(_){}};
  const off=()=>{dok[ad]=false;el.classList.remove('basili')};
  el.addEventListener('pointerdown',on);['pointerup','pointercancel','lostpointercapture'].forEach(t=>el.addEventListener(t,off));
}
basiliTut($('#bSol'),'sol');basiliTut($('#bSag'),'sag');
function dokun(el,fn){el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(!blok())fn()})}

(function(){
  const j=$('#joy'),k=$('#joyK');let id=null;
  const set=e=>{const r=j.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,R0=r.width/2-12;
    let dx=e.clientX-cx,dy=e.clientY-cy;const m=Math.hypot(dx,dy);if(m>R0){dx*=R0/m;dy*=R0/m}
    joy.x=dx/R0;joy.y=dy/R0;if(Math.hypot(joy.x,joy.y)<.18){joy.x=joy.y=0}
    const z=parseFloat(getComputedStyle(j).zoom)||1;k.style.transform=`translate(${dx/z}px,${dy/z}px)`};
  j.addEventListener('pointerdown',e=>{e.preventDefault();id=e.pointerId;try{j.setPointerCapture(id)}catch(_){}set(e)});
  j.addEventListener('pointermove',e=>{if(e.pointerId===id)set(e)});
  const bit=()=>{id=null;joy.x=joy.y=0;k.style.transform=''};['pointerup','pointercancel','lostpointercapture'].forEach(t=>j.addEventListener(t,bit));
})();
function yon(){
  let x=joy.x,y=joy.y;
  if(tus.ArrowLeft||tus.KeyA||dok.sol)x-=1;if(tus.ArrowRight||tus.KeyD||dok.sag)x+=1;
  if(tus.ArrowUp||tus.KeyW)y-=1;if(tus.ArrowDown||tus.KeyS)y+=1;
  const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}return {x,y};
}

let sahne=null,zaman=0;
function sahneAc(s){
  if(sahne&&sahne.cik)sahne.cik();sahne=s;
  ['kTown','kMac','kTek'].forEach(id=>$('#'+id).classList.add('gizli'));

  if(s.gir)s.gir();dikKontrol();

function boyut(){
  const vw=innerWidth,vh=innerHeight,s=Math.min(vw/W,vh/H);
  const dpr=window.devicePixelRatio||1;SC=clamp(Math.ceil(s*dpr),1,10);
  if(cv.width!==W*SC){cv.width=W*SC;cv.height=H*SC}
  cv.classList.toggle('piksel',SC===1);
  cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';
  cv.style.left=Math.floor((vw-W*s)/2)+'px';cv.style.top=Math.floor((vh-H*s)/2)+'px';
  balonKonum();dikKontrol();
}
let dikGec=false;
function dikKontrol(){const dik=innerHeight>innerWidth*1.1&&innerWidth<820;const oyun=sahne&&sahne.kontrol&&sahne.kontrol!=='yok';
  $('#dondur').classList.toggle('gizli',!(dik&&oyun&&!dikGec))}

window.addEventListener('resize',boyut);window.addEventListener('orientationchange',()=>setTimeout(boyut,200));
let onceki=performance.now();
function dongu(t){
  const dt=Math.min(.05,(t-onceki)/1000);onceki=t;zaman+=dt;
  if(sahne){try{sahne.guncelle&&sahne.guncelle(dt);G=ctx;ctx.setTransform(SC,0,0,SC,0,0);ctx.imageSmoothingEnabled=false;sahne.ciz&&sahne.ciz()}catch(e){console.error(e)}}
  requestAnimationFrame(dongu);
}

  b.onclick=()=>b.remove();document.body.appendChild(b);setTimeout(()=>b.remove(),4500);
  try{localStorage.setItem('mahalle_surum',APP.surum)}catch(e){}
}
/* Otomatik güncelleme uyarısı (ETag/Last-Modified) */
let surumDamga=null,surumSon=0;
async function damgaAl(){const u=location.href.split('#')[0].split('?')[0]+'?_v='+Date.now();
  try{let r=await fetch(u,{method:'HEAD',cache:'no-store'});if(!r.ok)r=await fetch(u,{cache:'no-store'});return r.headers.get('etag')||r.headers.get('last-modified')}catch(e){return null}}
async function surumBaslat(){if(!/^https?:/.test(location.protocol))return;surumDamga=await damgaAl();setInterval(surumKontrol,120000);window.addEventListener('focus',surumKontrol);document.addEventListener('visibilitychange',()=>{if(!document.hidden)surumKontrol()})}
async function surumKontrol(){if(!surumDamga||Date.now()-surumSon<15000)return;surumSon=Date.now();const d=await damgaAl();
  if(d&&d!==surumDamga&&!$('#yeniSurum')){const b=document.createElement('button');b.id='yeniSurum';b.textContent='🔴 Yeni sürüm yayınlandı · Yenile';b.onclick=()=>location.href=location.href.split('#')[0].split('?')[0]+'?_r='+Date.now();document.body.appendChild(b)}}


/* =====================================================================
   🏠 SİTEYE DÖN (ZİRVE kuralı): oyunu kapatmadan Barış Öğretmen sitesine dönüş
   iframe içinde → üst sayfaya haber + üst sayfayı siteye götür
   site tarafından yeni pencerede açıldıysa → o pencereye dön, bunu kapat
   siteden gelindiyse → geri git (site kaldığı yerden açılır) · aksi hâlde → site adresi
   ===================================================================== */
const SITE_URL=(window.ZIRVE_SITE_URL||'https://baris-ogretmen.github.io/site-1/');
function siteyeDon(){
  try{S.konum=ben.x;kaydet()}catch(e){}
  SES.tik();
  try{if(window.parent&&window.parent!==window){window.parent.postMessage({zirve:'siteyeDon',oyun:'Mahalle Yıldızları'},'*');try{window.top.location.href=SITE_URL}catch(e){}return}}catch(e){}
  try{if(window.opener&&!window.opener.closed){window.opener.focus();window.close();setTimeout(()=>{location.href=SITE_URL},300);return}}catch(e){}
  try{const r=document.referrer?new URL(document.referrer):null,site=new URL(SITE_URL);
    if(r&&r.origin===site.origin&&r.pathname.indexOf(site.pathname.replace(/\/$/,''))===0&&history.length>1){history.back();setTimeout(()=>{location.href=SITE_URL},700);return}}catch(e){}
  location.href=SITE_URL;
}
window.ZIRVE_siteyeDon=siteyeDon;window.ZGIRIS_SITEYE_DON=siteyeDon;
