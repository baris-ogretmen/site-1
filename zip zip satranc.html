<style>
:root{--egt-z:1;--mor:#6b4fd8;--mor2:#4d36b0;--yazi:#2b2545;--soluk:#7b7495;--kart:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#f4f1f8;color:var(--yazi);
  font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-weight:800;
  font-variant-numeric:lining-nums tabular-nums;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block}
button{font-family:inherit;font-weight:800;cursor:pointer;border:0}
.gizli{display:none!important}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:14px 18px;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
#hud .sol{zoom:var(--egt-z)}
#skor{font-size:56px;font-weight:900;line-height:1;color:#2b2545;letter-spacing:1px}
#rekor{font-size:17px;color:var(--soluk);margin-top:4px}
#tasKart{zoom:var(--egt-z);background:rgba(255,255,255,.86);border-radius:18px;padding:10px 14px;max-width:min(560px,62vw);box-shadow:0 6px 20px rgba(60,40,120,.10)}
#tasAd{font-size:22px;font-weight:900;display:flex;align-items:center;gap:8px}
#tasAd .sym{font-size:30px;line-height:1}
#tasKural{font-size:16px;color:#4b4466;margin-top:2px;line-height:1.3}
#hedef{font-size:19px;margin-top:6px;color:var(--mor2)}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);pointer-events:none;text-align:center;z-index:5}
#toast div{zoom:var(--egt-z);background:rgba(43,37,69,.9);color:#fff;font-size:22px;padding:10px 20px;border-radius:16px;margin:6px auto;max-width:88vw;animation:tin .25s ease-out}
@keyframes tin{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}

/* Alt kontrol çubuğu */
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:flex-end;gap:10px;pointer-events:none}
#bar .ic{zoom:var(--egt-z);display:flex;gap:10px;align-items:flex-end;pointer-events:auto}
.kbtn{background:rgba(255,255,255,.92);color:var(--yazi);font-size:18px;padding:12px 14px;border-radius:16px;box-shadow:0 4px 14px rgba(60,40,120,.15);min-width:58px}
.kbtn:active{transform:scale(.96)}
#zipla{background:linear-gradient(180deg,#8a6ff0,#5b3fd0);color:#fff;font-size:24px;padding:16px 34px;border-radius:22px;box-shadow:0 8px 24px rgba(91,63,208,.45);min-width:200px;line-height:1.1}
#zipla small{display:block;font-size:14px;opacity:.85;font-weight:700}
#zipla.basili{transform:scale(.95);filter:brightness(1.1)}

/* Güç göstergesi */
#metre{position:fixed;right:18px;bottom:110px;width:46px;height:210px;pointer-events:none;zoom:var(--egt-z)}
#metre .ic{position:relative;width:46px;height:210px;background:rgba(255,255,255,.85);border-radius:16px;box-shadow:0 4px 14px rgba(60,40,120,.15);overflow:hidden}
#metreBant{position:absolute;left:0;right:0;background:rgba(46,204,113,.55);border-top:3px solid #1e9e57;border-bottom:3px solid #1e9e57}

<script>
'use strict';
/* =========================================================
   Zıp Zıp Satranç · Barış Öğretmen · ZİRVE
   Oynanış bir "basılı tut–zıpla" mobil oyunundan esinlenmiştir;
   ad, görseller ve satranç kurallı hedef sistemi özgündür.
   ========================================================= */
const SURUM = 'v1.0';
const OYUN_ADI = 'Zıp Zıp Satranç';
const SITE_URL = window.ZIRVE_SITE_URL || 'https://baris-ogretmen.github.io/site-1/';
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : v; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
};

/* ---------------- Cihaz / akıllı tahta ---------------- */
const DPR = window.devicePixelRatio || 1;
const DOKUNMATIK = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const FIZIKSEL_GEN = Math.max(screen.width, screen.height) * DPR;
const WINDOWS = /Windows/i.test(navigator.userAgent);
const TAHTA = DOKUNMATIK && ((Math.max(screen.width, screen.height) >= 1700 && DPR <= 1.3) || FIZIKSEL_GEN >= 3000 && (WINDOWS || !/Android|iPhone|iPad/i.test(navigator.userAgent)));
if (TAHTA) document.documentElement.style.setProperty('--egt-z', FIZIKSEL_GEN >= 3800 ? '1.6' : '1.35');

/* ---------------- 🧒 Çocuk boyu ---------------- */
let CB_ONBELLEK = null;
function cocukBoyuAcik(){ if (CB_ONBELLEK === null){ const v = LS.get('zirve_cocuk_boyu', null); CB_ONBELLEK = v === null ? TAHTA : v === '1'; } return CB_ONBELLEK; }
function cocukBoyuUygula(){
  document.body.classList.toggle('cocuk-boyu', cocukBoyuAcik());
  document.querySelectorAll('.cbDurum').forEach(e => e.textContent = cocukBoyuAcik() ? 'Açık' : 'Kapalı');
}
function cocukBoyuDegis(){ LS.set('zirve_cocuk_boyu', cocukBoyuAcik() ? '0' : '1'); CB_ONBELLEK = null; cocukBoyuUygula(); toast('🧒 Çocuk boyu: ' + (cocukBoyuAcik() ? 'Açık' : 'Kapalı')); }

/* ---------------- 🏠 Siteye Dön ---------------- */
function siteyeDon(){
  try{ ilerlemeKaydet(); }catch(e){}
  try{
    if (window.self !== window.top){
      try{ window.parent.postMessage({zirve:'siteyeDon'}, '*'); }catch(e){}
      try{ window.top.location.href = SITE_URL; return; }catch(e){ return; }
    }
  }catch(e){}
  try{
    if (window.opener && !window.opener.closed){ window.opener.focus(); window.close(); setTimeout(()=>{ location.href = SITE_URL; }, 400); return; }
  }catch(e){}
  if (document.referrer && document.referrer.indexOf(SITE_URL) === 0 && history.length > 1){ history.back(); return; }
  location.href = SITE_URL;
}
window.ZIRVE_siteyeDon = siteyeDon;

/* ---------------- Ses ---------------- */
let AC = null;
function sesBaslat(){ if (!AC){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} } if (AC && AC.state === 'suspended') AC.resume(); }
function ton(f, sure, tip, vol, f2){
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = tip || 'sine'; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + sure);
  g.gain.setValueAtTime(vol || .15, t); g.gain.exponentialRampToValueAtTime(.001, t + sure);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + sure + .02);
}
let sarjOsc = null, sarjGain = null;
function sarjSesiBasla(){
  if (!AC) return;
  sarjOsc = AC.createOscillator(); sarjGain = AC.createGain();
  sarjOsc.type = 'triangle'; sarjOsc.frequency.setValueAtTime(180, AC.currentTime);
  sarjOsc.frequency.linearRampToValueAtTime(720, AC.currentTime + 3);
  sarjGain.gain.setValueAtTime(.06, AC.currentTime);
  sarjOsc.connect(sarjGain); sarjGain.connect(AC.destination); sarjOsc.start();
}
function sarjSesiDur(){ if (sarjOsc){ try{ sarjGain.gain.setTargetAtTime(0, AC.currentTime, .02); sarjOsc.stop(AC.currentTime + .1); }catch(e){} sarjOsc = null; } }
function konus(metin){
  try{
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(metin.replace(/[♚♛♜♝♞♟]/g, ''));
    u.lang = 'tr-TR'; u.rate = .95;
    const tr = speechSynthesis.getVoices().find(v => /tr/i.test(v.lang)); if (tr) u.voice = tr;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------------- Toast ---------------- */
function toast(m, sure){
  const t = document.getElementById('toast'); const d = document.createElement('div'); d.textContent = m; t.appendChild(d);
  while (t.children.length > 2) t.removeChild(t.firstChild);
  setTimeout(()=>{ d.remove(); }, sure || 2200);
}

/* ---------------- Sınıf seviyesi ---------------- */
const SINIFLAR = [['ana','Anaokulu'],['12','1–2. sınıf'],['34','3–4. sınıf'],['56','5–6. sınıf'],['78','7–8. sınıf']];
function sinif(){ return LS.get('zirve_oyun_sinif', '34'); }
function sinifAd(){ const s = SINIFLAR.find(x => x[0] === sinif()); return s ? s[1] : '3–4. sınıf'; }
const SEVIYE = { // pedestal yarı boyu, şarj hızı (kare/sn), ipucu hep açık mı
  ana:{h:.47, hiz:1.7, ipucu:true},  '12':{h:.45, hiz:1.95, ipucu:true},
  '34':{h:.41, hiz:2.25, ipucu:false}, '56':{h:.37, hiz:2.5, ipucu:false}, '78':{h:.34, hiz:2.7, ipucu:false}
};
function sev(){ return SEVIYE[sinif()] || SEVIYE['34']; }

/* ---------------- Taşlar ve kurallar ---------------- */
const TAS = {
  sah:  {ad:'Şah',  sym:'♚', not:'Ş', kisa:'Her yöne 1 kare', kural:'Şah her yöne yalnızca 1 kare gider: ileri, geri, yanlara ve çaprazlara.'},
  vezir:{ad:'Vezir',sym:'♛', not:'V', kisa:'Düz + çapraz, uzun', kural:'Vezir düz ve çapraz, istediği kadar kare gider. Kale ile filin hareketini birleştirir.'},
  kale: {ad:'Kale', sym:'♜', not:'K', kisa:'Düz, istediği kadar', kural:'Kale düz gider: ileri-geri ve sağa-sola, istediği kadar kare.'},
  fil:  {ad:'Fil',  sym:'♝', not:'F', kisa:'Çapraz, istediği kadar', kural:'Fil çapraz gider, istediği kadar kare. Hep aynı renk karelerde kalır.'},
  at:   {ad:'At',   sym:'♞', not:'A', kisa:'L çizer, atlar', kural:'At L çizer: 2 kare düz, 1 kare yana. Taşların üstünden atlayabilen tek taştır.'},
  piyon:{ad:'Piyon',sym:'♟', not:'',  kisa:'İleri 1 (ilk 2) kare', kural:'Piyon ileri gider, 1 kare; ilk hamlesinde 2 kare de gidebilir. Taş alırken çapraz ileri gider. Geri gitmez!'}
};
const TAS_SIRA = ['piyon','kale','fil','at','vezir','sah'];
const DOSYA = 'abcdefgh';
function kareAd(f, r){ return DOSYA[f] + (r + 1); }
function tahtada(f, r){ return f >= 0 && f < 8 && r >= 0 && r < 8; }

function yasalHamleler(tip, f, r, piyonIlk){
  const L = [];
  const kayan = (yonler) => { for (const [dx, dy] of yonler){ for (let k = 1; k < 8; k++){ const nf = f + dx*k, nr = r + dy*k; if (!tahtada(nf, nr)) break; L.push({f:nf, r:nr, d:k}); } } };
  const D = [[1,0],[-1,0],[0,1],[0,-1]], C = [[1,1],[1,-1],[-1,1],[-1,-1]];
  if (tip === 'kale') kayan(D);
  else if (tip === 'fil') kayan(C);
  else if (tip === 'vezir') kayan(D.concat(C));
  else if (tip === 'sah'){ for (const [dx, dy] of D.concat(C)) if (tahtada(f+dx, r+dy)) L.push({f:f+dx, r:r+dy, d:1}); }
  else if (tip === 'at'){ for (const [dx, dy] of [[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]]) if (tahtada(f+dx, r+dy)) L.push({f:f+dx, r:r+dy, d:2}); }
  else if (tip === 'piyon'){
    if (tahtada(f, r+1)) L.push({f, r:r+1, d:1});
    if (piyonIlk && r === 1) L.push({f, r:r+2, d:2});
  }
  return L;
}

/* ---------------- Sorular (sınıf seviyesine göre) ---------------- */
const SORU_A = [
  {s:'Hangi taş "L" harfi gibi gider?', o:['♞ At','♜ Kale','♟ Piyon']},
  {s:'Kale nasıl gider?', o:['Düz','Çapraz','L çizerek']},
  {s:'Fil nasıl gider?', o:['Çapraz','Düz','Sadece geri']},
  {s:'Şah bir hamlede kaç kare gider?', o:['1 kare','3 kare','İstediği kadar']},
  {s:'Piyon geri gidebilir mi?', o:['Hayır, hep ileri gider','Evet, geri de gider','Sadece sağa gider']},
  {s:'Düz ve çapraz, uzun uzun gidebilen taş hangisi?', o:['♛ Vezir','♟ Piyon','♚ Şah']}
];
const SORU_A2 = [{s:'Satranç tahtasında kaç kare vardır?', o:['64','32','100']}];
const SORU_B = [
  {s:'At nasıl gider?', o:['2 kare düz + 1 kare yana','Sadece çapraz','Her yöne 1 kare']},
  {s:'Vezir hangi iki taşın hareketini birleştirir?', o:['Kale ve Fil','At ve Piyon','Şah ve At']},
  {s:'Piyon taş alırken nasıl gider?', o:['Çapraz ileri 1 kare','Düz ileri 1 kare','Geri çapraz']},
  {s:'Piyon ilk hamlesinde kaç kare gidebilir?', o:['1 ya da 2 kare','Sadece 3 kare','İstediği kadar']},
  {s:'Diğer taşların üstünden atlayabilen taş hangisi?', o:['♞ At','♝ Fil','♜ Kale']},
  {s:'Fil hangi karelerde dolaşır?', o:['Hep aynı renk karelerde','Sadece kenar karelerde','Her hamlede renk değiştirir']},
  {s:'Tahtadaki sütunlar hangi harflerle gösterilir?', o:['a’dan h’ye','A’dan Z’ye','1’den 8’e']}
];
const SORU_C = [
  {s:'Boş tahtada d4’teki bir at kaç kareye gidebilir?', o:['8','4','6']},
  {s:'Köşedeki (a1) bir at kaç kareye gidebilir?', o:['2','4','8']},
  {s:'Boş tahtada kale, nerede olursa olsun kaç kareye gidebilir?', o:['14','8','16']},
  {s:'Boş tahtada d4’teki vezir kaç kareye gidebilir?', o:['27','21','14']},
  {s:'Boş tahtada d4’teki fil kaç kareye gidebilir?', o:['13','7','9']},
  {s:'Piyon son sıraya ulaşınca ne olur?', o:['Terfi eder (çoğunlukla vezir olur)','Oyundan çıkar','Başa döner']},
  {s:'Rok hangi iki taşla yapılır?', o:['Şah ve Kale','Vezir ve Fil','At ve Piyon']},
  {s:'"Geçerken alma" kuralı hangi taşa özeldir?', o:['Piyon','At','Fil']},
  {s:'Notasyonda "x" işareti ne anlama gelir?', o:['Taş alındı','Rok yapıldı','Oyun bitti']},
  {s:'Notasyonda "A" harfi hangi taşı gösterir?', o:['At','Fil','Kale']}
];
function soruHavuzu(){
  const s = sinif();
  if (s === 'ana') return SORU_A;
  if (s === '12') return SORU_A.concat(SORU_A2);
  if (s === '34') return SORU_A.slice(0,3).concat(SORU_A2, SORU_B);
  if (s === '56') return SORU_B.concat(SORU_C.slice(0,6));
  return SORU_C.concat(SORU_B.slice(0,3));
}

/* ================= TUVAL (akıllı tahta / 4K keskin) ================= */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, SC = 1;
function boyutla(){
  W = window.innerWidth; H = window.innerHeight;
  SC = Math.max(1, Math.ceil(Math.min(window.innerWidth / W, window.innerHeight / H) * (window.devicePixelRatio || 1)));
  cv.width = W * SC; cv.height = H * SC;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
}
window.addEventListener('resize', boyutla);
boyutla();

/* İzometrik izdüşüm: X = sütun yönü (a→h), Z = sıra yönü (1→8) */
const CX = .866, CY = .5;
const KAM = {x:0, z:0, U:60, hx:0, hz:0, hU:60};
function P(X, Y, Z){
  const ax = W / 2, ay = H * (cocukBoyuAcik() ? .64 : .56);
  return [ax + ((X - Z) - (KAM.x - KAM.z)) * CX * KAM.U,
          ay - ((X + Z) - (KAM.x + KAM.z)) * CY * KAM.U - Y * KAM.U * .95];
}

/* ---------------- Renkler ---------------- */
const PASTEL = ['#ffd2df','#cdeedd','#fff0b8','#dcd3ff','#ffdcc4','#cfe8ff','#f6d0f0','#d8f3c2'];
function koyult(hex, k){
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  r = Math.round(r * k); g = Math.round(g * k); b = Math.round(b * k);
  return 'rgb(' + Math.min(255,r) + ',' + Math.min(255,g) + ',' + Math.min(255,b) + ')';
}
const KARE_ACIK = '#f4e8d6', KARE_KOYU = '#c4a383';

const PROFIL = {

  fil:  {p:[[0,.30],[.07,.30],[.10,.25],[.14,.24],[.18,.17],[.50,.10],[.53,.17],[.57,.17],[.60,.09]], top:null, ek:'fil'},
  vezir:{p:[[0,.33],[.07,.33],[.10,.27],[.14,.26],[.19,.19],[.62,.11],[.66,.20],[.70,.20],[.72,.12],[.80,.21]],
         top:[[-.21,-.80],[-.23,-.93],[-.12,-.84],[-.07,-.97],[0,-.86],[.07,-.97],[.12,-.84],[.23,-.93],[.21,-.80]], ek:'vezir'},

const TAS_BOY = {piyon:1.05, kale:1, fil:1, vezir:1, sah:1, at:1};
const TAS_YUK = {piyon:.79, kale:.84, fil:1.02, vezir:1.06, sah:1.17, at:.99};

function tasCiz(c, tip, x, y, k, renk, o){
  o = o || {};
  const pr = PROFIL[tip];
  c.save();
  c.translate(x, y);
  if (o.alpha !== undefined) c.globalAlpha = Math.max(0, o.alpha);
  if (o.rot){ const yy = -.5 * k * TAS_YUK[tip]; c.translate(0, yy); c.rotate(o.rot); c.translate(0, -yy); }
  c.scale(k * (o.yon || 1) * (o.genis || 1), k * (o.sq || 1));
  const g = c.createLinearGradient(-.34, 0, .34, 0);
  g.addColorStop(0, renk.a); g.addColorStop(.45, renk.b); g.addColorStop(1, renk.c);
  c.fillStyle = g; c.strokeStyle = renk.c; c.lineWidth = .014; c.lineJoin = 'round';
  const pts = pr.p;
  c.beginPath();
  c.moveTo(-pts[0][1], -pts[0][0]);
  for (const q of pts) c.lineTo(-q[1], -q[0]);
  if (pr.top) for (const q of pr.top) c.lineTo(q[0], q[1]);
  for (let i = pts.length - 1; i >= 0; i--) c.lineTo(pts[i][1], -pts[i][0]);
  c.closePath(); c.fill(); c.stroke();
  const top = (cx0, cy0, r) => { c.beginPath(); c.arc(cx0, cy0, r, 0, Math.PI*2); c.fill(); c.stroke(); };
  if (pr.ek === 'piyon') top(0, -.64, .15);
  if (pr.ek === 'fil'){
    c.beginPath(); c.ellipse(0, -.76, .15, .18, 0, 0, Math.PI*2); c.fill(); c.stroke();
    top(0, -.97, .05);
    c.strokeStyle = renk.c; c.lineWidth = .03; c.beginPath(); c.moveTo(.06, -.86); c.lineTo(-.05, -.73); c.stroke();
  }
  if (pr.ek === 'vezir'){ top(0, -1.0, .055); top(-.23, -.94, .03); top(.23, -.94, .03); }
  if (pr.ek === 'sah'){
    c.beginPath(); c.rect(-.035, -1.17, .07, .25); c.fill(); c.stroke();
    c.beginPath(); c.rect(-.10, -1.09, .20, .06); c.fill(); c.stroke();
  }
  if (pr.ek === 'at'){
    c.beginPath();
    const A = [[.22,-.18],[.25,-.40],[.21,-.62],[.13,-.80],[.03,-.90],[-.01,-.99],[-.08,-.89],[-.20,-.81],[-.32,-.67],[-.35,-.58],[-.27,-.53],[-.15,-.56],[-.07,-.50],[-.15,-.38],[-.22,-.18]];
    c.moveTo(A[0][0], A[0][1]); for (const q of A) c.lineTo(q[0], q[1]); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = renk.a; c.beginPath(); c.arc(-.14, -.74, .03, 0, Math.PI*2); c.fill();
    c.strokeStyle = renk.a; c.lineWidth = .025; c.beginPath(); c.moveTo(.12, -.78); c.quadraticCurveTo(.2, -.5, .17, -.25); c.stroke();
  }
  // parlak çizgi
  c.globalAlpha *= .35; c.strokeStyle = '#fff'; c.lineWidth = .03;
  c.beginPath(); c.moveTo(-.12, -.12); c.lineTo(-.08, -.42); c.stroke();
  c.restore();
}

/* ================= OYUN DURUMU ================= */
const S = {
  mod:'yukleniyor', tas:'kale', karisik:false, skor:0, combo:0, basari:0, merkez:0, alinan:0,
  cur:null, tgt:null, peds:[], engeller:[], rakip:null, noktalar:[], yol:[],
  pos:{X:0, Y:.55, Z:0}, faz:'bos', sarjT:0, ziplama:null, dusme:null, fx:[], zaman:[],
  ipucuBu:false, piyonIlk:true, hamleler:[], arkaRenk:[244,241,248], oncekiKare:null, tanitildi:{}
};
const PED_H = .55, MAX_SARJ = 3.2;

function pedYap(f, r){
  const ac = (f + r) % 2 === 1; // a1 koyu kare
  return {f, r, X:f - 3.5, Z:r - 3.5, sekil: Math.random() < .55 ? 'kutu' : 'silindir', h:sev().h, H:PED_H,
          yan: PASTEL[Math.floor(Math.random()*PASTEL.length)], ust: ac ? KARE_ACIK : KARE_KOYU, acik: ac,
          yuk:0, bat:false, sik:0, yay:0, yayV:0};
}
function pedUst(p){ return Math.max(0, p.H * easeOutBack(Math.min(1, p.yuk)) * (1 - p.sik) + p.yay * .05); }
function easeOutBack(t){ const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
function pedIcinde(p, X, Z){ if (!p) return false; return p.sekil === 'kutu' ? (Math.abs(X - p.X) < p.h && Math.abs(Z - p.Z) < p.h) : Math.hypot(X - p.X, Z - p.Z) < p.h; }
function sonra(sn, fn){ S.zaman.push({t:sn, fn}); }

function rekorAnahtar(){ return 'zirve_zipsatranc_rekor_' + (S.karisik ? 'karisik' : S.tas); }
function rekor(){ return +LS.get(rekorAnahtar(), '0') || 0; }
function ilerlemeKaydet(){ if (S.skor > rekor()) LS.set(rekorAnahtar(), String(S.skor)); }

function oyunBaslat(tas, karisik){
  sesBaslat();
  S.karisik = !!karisik; S.tas = karisik ? TAS_SIRA[Math.floor(Math.random()*6)] : tas;
  S.skor = 0; S.combo = 0; S.basari = 0; S.merkez = 0; S.alinan = 0; S.fx = []; S.zaman = []; S.hamleler = [];
  S.engeller = []; S.rakip = null; S.dusme = null; S.ziplama = null; S.ipucuBu = false; S.oncekiKare = null;
  let f, r;
  if (S.tas === 'piyon'){ f = Math.floor(Math.random()*8); r = 1; }
  else { f = 1 + Math.floor(Math.random()*6); r = Math.floor(Math.random()*3); }
  S.piyonIlk = true;
  const p = pedYap(f, r); p.yuk = 1; S.peds = [p]; S.cur = p;
  S.pos = {X:p.X, Y:PED_H, Z:p.Z};
  KAM.x = KAM.hx = p.X; KAM.z = KAM.hz = p.Z;
  S.mod = 'oyun'; S.faz = 'bos';
  ekranGoster(null);
  hudGuncelle(); tasTanit(true);
  hedefSec();
}

function tasTanit(zorla){
  const t = TAS[S.tas];
  document.querySelector('#tasAd .sym').textContent = t.sym;
  document.getElementById('tasAdYazi').textContent = t.ad + ' · ' + t.kisa;
  document.getElementById('tasKural').textContent = t.kural;
  if (zorla || !S.tanitildi[S.tas]){ S.tanitildi[S.tas] = 1; toast(t.sym + ' ' + t.ad + ': ' + t.kisa, 2600); if (sinif() === 'ana' || sinif() === '12' || zorla) konus(t.kural); }
}

function hedefSec(){
  const c = S.cur; const tip = S.tas;
  S.engeller = []; S.rakip = null;
  let sec = null, alma = false;
  if (tip === 'piyon'){
    const caprazlar = [[c.f-1, c.r+1],[c.f+1, c.r+1]].filter(q => tahtada(q[0], q[1]));
    if (caprazlar.length && Math.random() < .33){
      const q = caprazlar[Math.floor(Math.random()*caprazlar.length)]; sec = {f:q[0], r:q[1]}; alma = true;
    } else {
      sec = (S.piyonIlk && c.r === 1 && Math.random() < .5) ? {f:c.f, r:c.r+2} : {f:c.f, r:c.r+1};
    }
  } else {
    let L = yasalHamleler(tip, c.f, c.r);
    if (S.oncekiKare && L.length > 2) L = L.filter(q => !(q.f === S.oncekiKare.f && q.r === S.oncekiKare.r));
    const agir = L.map(q => q.d <= 3 ? 1 : (q.d <= 5 ? .45 : .15));
    let top = agir.reduce((a, b) => a + b, 0), x = Math.random() * top;
    for (let i = 0; i < L.length; i++){ x -= agir[i]; if (x <= 0){ sec = L[i]; break; } }
    if (!sec) sec = L[0];
    alma = Math.random() < .25;
  }
  const p = pedYap(sec.f, sec.r);
  S.peds.push(p); S.tgt = p;
  if (alma){
    const tipler = ['piyon','at','fil','kale','vezir'];
    S.rakip = {tip: tipler[Math.floor(Math.random()*tipler.length)], ped:p, ucus:null};
  }
  // At: aradaki karelere engel taş koy (atın atladığını göstermek için)
  if (tip === 'at'){
    const dx = sec.f - c.f, dy = sec.r - c.r;
    const aday = Math.abs(dy) === 2 ? [[c.f, c.r + Math.sign(dy)], [c.f + dx, c.r + Math.sign(dy)]] : [[c.f + Math.sign(dx), c.r], [c.f + Math.sign(dx), c.r + dy]];
    for (const q of aday) if (tahtada(q[0], q[1]) && Math.random() < .8) S.engeller.push({f:q[0], r:q[1], X:q[0]-3.5, Z:q[1]-3.5});
    if (S.engeller.length && !S.atAtlamaGosterildi){ S.atAtlamaGosterildi = 1; sonra(.6, () => toast('♞ At, taşların üstünden atlayabilir!', 2600)); }
  }
  // Yol çizgisi
  const A = {X:c.X, Z:c.Z}, B = {X:p.X, Z:p.Z};
  if (tip === 'at'){
    const dx = sec.f - c.f, dy = sec.r - c.r;
    const ara = Math.abs(dy) === 2 ? {X:c.X, Z:p.Z} : {X:p.X, Z:c.Z};
    S.yol = [A, ara, B];
  } else S.yol = [A, B];
  // Yasal kareler (noktalar)
  if (tip === 'piyon'){
    S.noktalar = yasalHamleler('piyon', c.f, c.r, S.piyonIlk && c.r === 1);
    if (alma) S.noktalar.push({f:sec.f, r:sec.r});
  } else S.noktalar = yasalHamleler(tip, c.f, c.r);
  document.getElementById('hedef').textContent = '🎯 ' + kareAd(c.f, c.r) + ' → ' + kareAd(sec.f, sec.r) + (alma ? ' · rakip taşı al!' : '') + notasyonEki(sec, alma);
  ton(520, .08, 'sine', .06);
}
function notasyonEki(sec, alma){
  if (sinif() !== '56' && sinif() !== '78') return '';
  const t = TAS[S.tas];
  const n = S.tas === 'piyon' ? (alma ? DOSYA[S.cur.f] + 'x' + kareAd(sec.f, sec.r) : kareAd(sec.f, sec.r)) : t.not + (alma ? 'x' : '') + kareAd(sec.f, sec.r);
  return ' · Notasyon: ' + n;
}

function hizKareSn(){ return sev().hiz; }
function hedefYonu(){
  const dx = S.tgt.X - S.pos.X, dz = S.tgt.Z - S.pos.Z, d = Math.hypot(dx, dz) || 1;
  return {x:dx/d, z:dz/d, d};
}
function basariBandi(){
  if (!S.tgt) return null;
  const y = hedefYonu(); let t0 = null, t1 = null;
  for (let t = 0; t <= MAX_SARJ; t += .005){
    const m = t * hizKareSn(); const X = S.pos.X + y.x*m, Z = S.pos.Z + y.z*m;
    if (pedIcinde(S.tgt, X, Z)){ if (t0 === null) t0 = t; t1 = t; }
  }
  return t0 === null ? null : [t0, t1];
}

function sarjBasla(){
  if (S.mod !== 'oyun' || S.faz !== 'bos' || !S.tgt || S.tgt.yuk < .7) return;
  sesBaslat();
  S.faz = 'sarj'; S.sarjT = 0; sarjSesiBasla();
  document.getElementById('zipla').classList.add('basili');
}
function sarjBirak(){
  document.getElementById('zipla').classList.remove('basili');
  if (S.faz !== 'sarj') return;
  sarjSesiDur();
  const y = hedefYonu(); const mesafe = S.sarjT * hizKareSn();
  const X = S.pos.X + y.x*mesafe, Z = S.pos.Z + y.z*mesafe;
  let sonuc, inisY;
  if (pedIcinde(S.tgt, X, Z)){ sonuc = 'tamam'; inisY = S.tgt.H; }
  else if (pedIcinde(S.cur, X, Z)){ sonuc = 'kaldi'; inisY = S.cur.H; }
  else if (Math.abs(X) < 4 && Math.abs(Z) < 4){ sonuc = 'tahta'; inisY = 0; }
  else { sonuc = 'disari'; inisY = 0; }
  const sure = .42 + .045 * Math.min(mesafe, 7);
  S.ziplama = {t:0, sure, bas:{X:S.pos.X, Y:pedUst(S.cur), Z:S.pos.Z}, son:{X, Y:inisY, Z},
               yuk: 1.0 + .22 * mesafe + (S.tas === 'at' ? .5 : 0), sonuc, hata:Math.abs(mesafe - y.d), kisa: mesafe < y.d,
               yon: ((y.x - y.z) >= 0 ? 1 : -1)};
  S.cur.yayV = 9; // yay geri sıçrar
  S.faz = 'zipla'; S.ipucuBu = false;
  ton(330, .18, 'square', .05, 660);

function inis(){
  const z = S.ziplama; S.ziplama = null;
  S.pos = {X:z.son.X, Y:z.son.Y, Z:z.son.Z};
  if (z.sonuc === 'tamam'){
    const eski = S.cur; const yeni = S.tgt; const eski0 = eski;
    let puan = 1, merkez = z.hata < .13;
    if (merkez){ S.combo++; S.merkez++; puan = Math.min(10, 2 * S.combo); } else S.combo = 0;
    let alindi = false;
    if (S.rakip){ alindi = true; S.alinan++; puan += 1; S.rakip.ucus = {t:0, vx:(Math.random() < .5 ? -1 : 1) * 2.2, vz:1.5}; S.fx.push({tur:'rakipUc', r:S.rakip, t:0}); }
    S.skor += puan; S.basari++;
    S.hamleler.push(S.tas === 'piyon' ? (alindi ? DOSYA[eski0.f] + 'x' : '') + kareAd(yeni.f, yeni.r) : TAS[S.tas].not + (alindi ? 'x' : '') + kareAd(yeni.f, yeni.r));
    S.fx.push({tur:'yazi', X:S.pos.X, Y:S.pos.Y + 1.4, Z:S.pos.Z, t:0, m:'+' + puan + (merkez ? ' Tam merkez!' : '') + (alindi ? ' · Aldın!' : ''), renk: merkez ? '#e67e22' : '#5b3fd0'});
    S.fx.push({tur:'halka', X:yeni.X, Y:yeni.H, Z:yeni.Z, t:0, renk: merkez ? '#ffb02e' : '#ffffff'});
    if (merkez) ton(880, .25, 'sine', .14, 1320); else ton(600, .14, 'sine', .12, 760);
    if (alindi) setTimeout(() => ton(300, .2, 'triangle', .1, 160), 90);
    eski.bat = true; S.oncekiKare = {f:eski.f, r:eski.r};
    S.cur = yeni; S.tgt = null; S.rakip = alindi ? S.rakip : null;
    if (S.tas === 'piyon'){
      if (yeni.r !== 1) S.piyonIlk = false;
      if (yeni.r === 7){ terfi(); hudGuncelle(); return; }
    }
    hudGuncelle();
    if (S.basari % 6 === 0){ S.faz = 'soru'; sonra(.55, soruSor); return; }
    if (S.karisik && S.basari % 4 === 0) karisikDegis();
    S.faz = 'bos'; sonra(.25, () => { S.rakip = null; hedefSec(); });
  } else if (z.sonuc === 'kaldi'){
    S.combo = 0; S.faz = 'bos'; ton(240, .12, 'sine', .08);
    toast('Biraz kısa kaldı! Biraz daha uzun bas.');
    S.fx.push({tur:'halka', X:S.pos.X, Y:S.cur.H, Z:S.pos.Z, t:0, renk:'#ffffff'});
  } else {
    S.faz = 'dus';
    S.dusme = {t:0, disari: z.sonuc === 'disari', yon: z.yon, kisa: z.kisa};
    ton(220, .35, 'sawtooth', .07, 90);
  }
}

function terfi(){
  S.faz = 'terfi'; S.skor += 5; hudGuncelle();
  toast('👑 Terfi! Piyon son sıraya ulaştı ve vezir oldu. +5', 2800);
  if (sinif() === 'ana' || sinif() === '12') konus('Terfi! Piyon son sıraya ulaştı ve vezir oldu.');
  S.terfiGoster = 1.6;
  ton(660, .15, 'sine', .12); setTimeout(() => ton(880, .15, 'sine', .12), 150); setTimeout(() => ton(1100, .3, 'sine', .12), 300);
  sonra(1.7, () => {
    S.terfiGoster = 0;
    S.cur.bat = true;

function karisikDegis(){

function oyunBitti(){

/* ---------------- Soru ---------------- */
let sonSoru = -1;
function soruSor(){
  const H0 = soruHavuzu(); let i;
  do { i = Math.floor(Math.random()*H0.length); } while (H0.length > 1 && i === sonSoru);
  sonSoru = i;
  const q = H0[i]; const dogru = q.o[0];

  modalAc(`<div class="mBas">🧠 Satranç sorusu · +3 puan</div>

    <div class="satir"><button class="ikinciBtn" id="sDinle">🔊 Dinle</button></div>`);

  document.getElementById('sDinle').onclick = () => konus(q.s + '. ' + siklar.join(', '));
  let cevaplandi = false;
  document.querySelectorAll('.sik').forEach(b => b.onclick = () => {
    if (cevaplandi) return; cevaplandi = true;
    const ok = b.textContent === dogru;
    document.querySelectorAll('.sik').forEach(x => { if (x.textContent === dogru) x.classList.add('dogru'); });
    if (ok){ S.skor += 3; hudGuncelle(); ton(880, .2, 'sine', .14, 1320); toast('✅ Doğru! +3'); }
    else { b.classList.add('yanlis'); ton(200, .25, 'sine', .1); toast('Doğrusu: ' + dogru); }
    setTimeout(() => { modalKapat(); if (S.karisik && S.basari % 4 === 0) karisikDegis(); S.faz = 'bos'; S.rakip = null; hedefSec(); }, ok ? 1100 : 2000);
  });
}

/* ================= GÜNCELLEME ================= */
function guncelle(dt){
  // zamanlayıcılar
  for (let i = S.zaman.length - 1; i >= 0; i--){ const z = S.zaman[i]; z.t -= dt; if (z.t <= 0){ S.zaman.splice(i, 1); z.fn(); } }
  // pedestallar
  for (let i = S.peds.length - 1; i >= 0; i--){
    const p = S.peds[i];
    if (p.bat){ p.yuk -= dt * 2.6; if (p.yuk <= 0){ S.peds.splice(i, 1); continue; } }
    else if (p.yuk < 1) p.yuk = Math.min(1, p.yuk + dt * 2.8);
    // yay
    if (p.yayV || p.yay){ const k = 160, d = 12; const a = -k * p.yay - d * p.yayV; p.yayV += a * dt; p.yay += p.yayV * dt; if (Math.abs(p.yay) < .001 && Math.abs(p.yayV) < .01){ p.yay = 0; p.yayV = 0; } }
    p.sik = 0;
  }
  if (S.mod === 'oyun' || S.mod === 'bitti'){
    if (S.faz === 'sarj'){
      S.sarjT = Math.min(MAX_SARJ, S.sarjT + dt);
      S.cur.sik = .32 * Math.min(1, S.sarjT / 2.2);
    }
    if (S.cur){ const tep = pedUst(S.cur) + S.cur.yay * -.08; if (S.faz !== 'zipla' && S.faz !== 'dus' && S.faz !== 'bitti') S.pos.Y = Math.max(0, tep); }
    if (S.faz === 'zipla' && S.ziplama){
      const z = S.ziplama; z.t = Math.min(1, z.t + dt / z.sure);
      const t = z.t;
      S.pos.X = z.bas.X + (z.son.X - z.bas.X) * t;
      S.pos.Z = z.bas.Z + (z.son.Z - z.bas.Z) * t;
      S.pos.Y = z.bas.Y + (z.son.Y - z.bas.Y) * t + 4 * z.yuk * t * (1 - t);
      if (z.t >= 1) inis();
    }
    if (S.faz === 'dus' && S.dusme){
      const d = S.dusme; d.t += dt;
      if (d.disari) S.pos.Y -= dt * (2 + d.t * 9);
      if (d.t > 1.1){ S.dusme.bitti = true; if (S.mod === 'oyun') oyunBitti(); }
    }
    // kamera hedefi
    let fx = S.pos.X, fz = S.pos.Z;
    if (S.tgt){ fx = (S.pos.X + S.tgt.X) / 2; fz = (S.pos.Z + S.tgt.Z) / 2; }
    KAM.hx = fx; KAM.hz = fz;
    let spanX = 2.4, spanY = 2.4;
    if (S.tgt){ spanX = Math.abs((S.tgt.X - S.tgt.Z) - (S.pos.X - S.pos.Z)) * CX + 2.6; spanY = Math.abs((S.tgt.X + S.tgt.Z) - (S.pos.X + S.pos.Z)) * CY + 2.4; }
    const Ux = W * .86 / spanX, Uy = H * .44 / spanY;
    KAM.hU = Math.max(30, Math.min(Ux, Uy, Math.min(W, H) / 3.8));
  } else {
    // menü: tahtanın tamamı yavaşça döner gibi kayar
    const t = performance.now() / 1000;
    KAM.hx = Math.sin(t * .2) * .8; KAM.hz = Math.cos(t * .2) * .8;
    KAM.hU = Math.min(W / (8 * 2 * CX + 1.5), H / (8 * 2 * CY + 3.5)) * 1.05;
  }
  const k = 1 - Math.pow(.02, dt);
  KAM.x += (KAM.hx - KAM.x) * k; KAM.z += (KAM.hz - KAM.z) * k; KAM.U += (KAM.hU - KAM.U) * k;
  // efektler
  for (let i = S.fx.length - 1; i >= 0; i--){ const f = S.fx[i]; f.t += dt; if (f.t > 1.4) S.fx.splice(i, 1); }
  // arka plan rengi (puan arttıkça yumuşak değişir)
  const RENKLER = [[244,241,248],[249,236,242],[238,234,248],[236,244,247],[247,241,231],[240,247,236]];
  const hedefR = RENKLER[Math.floor(S.skor / 10) % RENKLER.length];
  for (let i = 0; i < 3; i++) S.arkaRenk[i] += (hedefR[i] - S.arkaRenk[i]) * Math.min(1, dt * 1.5);
}

/* ================= ÇİZİM ================= */
function poli(pts, dolgu, cizgi){
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath();
  if (dolgu){ ctx.fillStyle = dolgu; ctx.fill(); }
  if (cizgi){ ctx.strokeStyle = cizgi; ctx.lineWidth = 1; ctx.stroke(); }
}
function zarf(pts){ // dışbükey zarf
  pts = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
  const lo = [], up = [];
  for (const p of pts){ while (lo.length >= 2 && cr(lo[lo.length-2], lo[lo.length-1], p) <= 0) lo.pop(); lo.push(p); }
  for (let i = pts.length - 1; i >= 0; i--){ const p = pts[i]; while (up.length >= 2 && cr(up[up.length-2], up[up.length-1], p) <= 0) up.pop(); up.push(p); }
  up.pop(); lo.pop(); return lo.concat(up);
}

function tahtaCiz(){
  const M = 4.38, KAL = .32;
  // çerçeve gölgesi
  ctx.save(); ctx.globalAlpha = .12;
  poli([P(-M+.3, -KAL, -M-.2), P(M+.6, -KAL, -M-.2), P(M+.6, -KAL, M), P(-M+.3, -KAL, M)], '#3a2a5a');
  ctx.restore();
  // ahşap çerçeve
  poli([P(-M, 0, -M), P(M, 0, -M), P(M, 0, M), P(-M, 0, M)], '#9c6b47');
  poli([P(-M, 0, -M), P(-M, 0, M), P(-M, -KAL, M), P(-M, -KAL, -M)], '#b07c55');
  poli([P(-M, 0, -M), P(M, 0, -M), P(M, -KAL, -M), P(-M, -KAL, -M)], '#7d5234');
  // kareler
  for (let f = 0; f < 8; f++) for (let r = 0; r < 8; r++){
    const X = f - 4, Z = r - 4;
    poli([P(X, 0, Z), P(X+1, 0, Z), P(X+1, 0, Z+1), P(X, 0, Z+1)], (f + r) % 2 === 1 ? KARE_ACIK : KARE_KOYU);
  }
  // koordinatlar (canlı yazı)
  const fs = Math.max(11, KAM.U * .24);
  ctx.font = '900 ' + fs + 'px Nunito, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff3e0';
  for (let i = 0; i < 8; i++){
    let p = P(i - 3.5, 0, -4.19); ctx.fillText(DOSYA[i], p[0], p[1]);
    p = P(-4.19, 0, i - 3.5); ctx.fillText(String(i + 1), p[0], p[1]);
  }
}

function noktalarCiz(){
  if (S.mod !== 'oyun' || !S.noktalar) return;
  const r = KAM.U * .11;
  for (const q of S.noktalar){
    if (S.tgt && q.f === S.tgt.f && q.r === S.tgt.r) continue;
    const p = P(q.f - 3.5, .002, q.r - 3.5);
    ctx.beginPath(); ctx.ellipse(p[0], p[1], r * 1.4 * CX, r * 1.4 * CY, 0, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(107,79,216,.30)'; ctx.fill();
  }
  // yol
  if (S.yol && S.yol.length > 1 && S.tgt){
    ctx.save(); ctx.setLineDash([KAM.U * .12, KAM.U * .1]); ctx.lineWidth = Math.max(2, KAM.U * .05);
    ctx.strokeStyle = 'rgba(107,79,216,.55)'; ctx.lineCap = 'round';
    ctx.beginPath(); S.yol.forEach((q, i) => { const p = P(q.X, .004, q.Z); i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }); ctx.stroke();
    ctx.restore();
  }
}

function pedGolge(p){
  const top = pedUst(p); if (top <= .01) return;
  const off = top * .9, h = p.h;
  let pts = [];
  if (p.sekil === 'kutu'){
    for (const [a, b] of [[-h,-h],[h,-h],[h,h],[-h,h]]){ pts.push(P(p.X+a, 0, p.Z+b)); pts.push(P(p.X+a+off*.55, 0, p.Z+b-off*.55)); }
  } else {
    for (let i = 0; i < 16; i++){ const a = i / 16 * Math.PI * 2; const X = p.X + Math.cos(a)*h, Z = p.Z + Math.sin(a)*h; pts.push(P(X, 0, Z)); pts.push(P(X+off*.55, 0, Z-off*.55)); }
  }
  poli(zarf(pts), 'rgba(60,40,90,.16)');
}

function pedCiz(p){
  const top = pedUst(p); if (top <= .005) return;
  const h = p.h, yan = p.yan;
  if (p.sekil === 'kutu'){
    const a = P(p.X-h, top, p.Z-h), b = P(p.X+h, top, p.Z-h), c = P(p.X+h, top, p.Z+h), d = P(p.X-h, top, p.Z+h);
    const a0 = P(p.X-h, 0, p.Z-h), b0 = P(p.X+h, 0, p.Z-h), d0 = P(p.X-h, 0, p.Z+h);
    poli([a, d, d0, a0], koyult(yan.length === 7 ? yan : '#dddddd', .93));
    poli([a, b, b0, a0], koyult(yan, .80));
    poli([a, b, c, d], p.ust);
    // üst kenarda pastel şerit
    ctx.save(); ctx.globalAlpha = .9;
    const s = .14;
    poli([a, d, P(p.X-h, top-s, p.Z+h), P(p.X-h, top-s, p.Z-h)], yan);
    poli([a, b, P(p.X+h, top-s, p.Z-h), P(p.X-h, top-s, p.Z-h)], koyult(yan, .9));
    ctx.restore();
  } else {
    const rx = h * Math.SQRT2 * CX * KAM.U, ry = h * Math.SQRT2 * CY * KAM.U;
    const ct = P(p.X, top, p.Z), c0 = P(p.X, 0, p.Z);
    const g = ctx.createLinearGradient(ct[0]-rx, 0, ct[0]+rx, 0);
    g.addColorStop(0, koyult(yan, .97)); g.addColorStop(1, koyult(yan, .76));
    ctx.beginPath(); ctx.moveTo(ct[0]-rx, ct[1]); ctx.lineTo(c0[0]-rx, c0[1]);
    ctx.ellipse(c0[0], c0[1], rx, ry, 0, Math.PI, 0, true); ctx.lineTo(ct[0]+rx, ct[1]); ctx.closePath();
    ctx.fillStyle = g; ctx.fill();
    ctx.beginPath(); ctx.ellipse(ct[0], ct[1], rx, ry, 0, 0, Math.PI*2); ctx.fillStyle = p.ust; ctx.fill();
    ctx.lineWidth = Math.max(1.5, KAM.U * .035); ctx.strokeStyle = yan; ctx.stroke();
  }
  // hedef halkası
  if (p === S.tgt && S.mod === 'oyun'){
    const t = performance.now() / 1000; const pulse = .55 + .25 * Math.sin(t * 5);
    const c = P(p.X, top + .002, p.Z);
    ctx.beginPath(); ctx.ellipse(c[0], c[1], h * .55 * Math.SQRT2 * CX * KAM.U, h * .55 * Math.SQRT2 * CY * KAM.U, 0, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(107,79,216,' + pulse + ')'; ctx.lineWidth = Math.max(2, KAM.U * .045); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(c[0], c[1], h * .12 * Math.SQRT2 * CX * KAM.U, h * .12 * Math.SQRT2 * CY * KAM.U, 0, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,176,46,' + pulse + ')'; ctx.fill();
    // kare adı (canlı)
    const fs = Math.max(13, KAM.U * .26);
    ctx.font = '900 ' + fs + 'px Nunito, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const lp = P(p.X, top, p.Z - h - .02);
    ctx.fillStyle = 'rgba(43,37,69,.75)'; ctx.fillText(kareAd(p.f, p.r), lp[0] + fs * 1.1, lp[1] + fs * .4);
  }
}

function golgeElips(X, Y, Z, boy, alfa){
  const p = P(X + .18, Y, Z - .18);
  ctx.beginPath(); ctx.ellipse(p[0], p[1], KAM.U * .32 * boy, KAM.U * .16 * boy, -.35, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(40,25,70,' + alfa + ')'; ctx.fill();
}

function zeminY(X, Z){
  let y = 0;
  for (const p of S.peds) if (pedIcinde(p, X, Z)) y = Math.max(y, pedUst(p));
  return y;
}

function ciz(){
  ctx.setTransform(SC, 0, 0, SC, 0, 0);
  ctx.imageSmoothingEnabled = false;
  const r = S.arkaRenk;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `rgb(${r[0]|0},${r[1]|0},${r[2]|0})`);
  g.addColorStop(1, `rgb(${(r[0]*.94)|0},${(r[1]*.93)|0},${(r[2]*.97)|0})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  tahtaCiz();
  noktalarCiz();
  for (const p of S.peds) pedGolge(p);
  const oyunda = S.mod === 'oyun' || S.mod === 'bitti';
  // nesneleri derinliğe göre sırala (uzaktaki önce)
  const L = [];
  for (const p of S.peds) L.push({k:p.X + p.Z, d:() => pedCiz(p)});
  for (const e of S.engeller) L.push({k:e.X + e.Z - .01, d:() => { golgeElips(e.X, 0, e.Z, .8, .18); tasCiz(ctx, 'piyon', ...P(e.X, 0, e.Z), KAM.U * .85, RENK_ENGEL); }});
  if (S.rakip && !S.rakip.ucus){
    const rp = S.rakip.ped; L.push({k:rp.X + rp.Z - .02, d:() => { const y = pedUst(rp); if (y > .05) tasCiz(ctx, S.rakip.tip, ...P(rp.X, y, rp.Z), KAM.U * .8 * TAS_BOY[S.rakip.tip], RENK_RAKIP, {alpha:Math.min(1, rp.yuk)}); }});
  }
  if (oyunda && S.cur){
    const pz = S.pos;
    L.push({k:pz.X + pz.Z - .03, d:() => oyuncuCiz()});
  }
  if (S.mod === 'menu' || S.mod === 'yukleniyor') menuSahnesi(L);
  L.sort((a, b) => b.k - a.k);
  for (const it of L) it.d();
  // efektler
  for (const f of S.fx){
    if (f.tur === 'yazi'){
      const p = P(f.X, f.Y + f.t * .8, f.Z); const a = Math.max(0, 1 - f.t / 1.4);
      const fs = Math.max(18, KAM.U * .42);
      ctx.font = '900 ' + fs + 'px Nunito, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.globalAlpha = a; ctx.lineWidth = fs * .18; ctx.strokeStyle = '#fff'; ctx.strokeText(f.m, p[0], p[1]);
      ctx.fillStyle = f.renk; ctx.fillText(f.m, p[0], p[1]); ctx.globalAlpha = 1;
    } else if (f.tur === 'halka'){
      const p = P(f.X, f.Y + .01, f.Z); const s = .3 + f.t * 1.4; const a = Math.max(0, 1 - f.t / .8);
      ctx.beginPath(); ctx.ellipse(p[0], p[1], s * Math.SQRT2 * CX * KAM.U, s * Math.SQRT2 * CY * KAM.U, 0, 0, Math.PI*2);
      ctx.strokeStyle = f.renk; ctx.globalAlpha = a; ctx.lineWidth = Math.max(2, KAM.U * .06); ctx.stroke(); ctx.globalAlpha = 1;
    } else if (f.tur === 'rakipUc'){
      const rp = f.r.ped; const t = f.t;
      const X = rp.X + f.r.ucus.vx * t * .8, Z = rp.Z - f.r.ucus.vz * t * .8, Y = rp.H + 3 * t - 5 * t * t;
      tasCiz(ctx, f.r.tip, ...P(X, Y, Z), KAM.U * .8 * TAS_BOY[f.r.tip], RENK_RAKIP, {rot: t * 7 * Math.sign(f.r.ucus.vx), alpha: 1 - t / 1.4});
    }
  }
}

function oyuncuCiz(){
  const pz = S.pos; const tip = S.terfiGoster ? 'vezir' : S.tas;
  // gölge
  const zy = S.faz === 'zipla' ? zeminY(pz.X, pz.Z) : Math.min(pz.Y, zeminY(pz.X, pz.Z));
  if (!(S.dusme && S.dusme.disari)){
    const yuk = Math.max(0, pz.Y - zy);
    golgeElips(pz.X, zy, pz.Z, Math.max(.45, 1 - yuk * .15), Math.max(.06, .22 - yuk * .03));
  }
  const p = P(pz.X, pz.Y, pz.Z);
  let o = {sq:1, rot:0};
  if (S.faz === 'sarj') o.sq = 1 - .38 * Math.min(1, S.sarjT / 2.2), o.genis = 1 + .12 * Math.min(1, S.sarjT / 2.2);
  if (S.faz === 'zipla' && S.ziplama){ o.rot = S.ziplama.t * Math.PI * 2 * S.ziplama.yon; }
  if (S.dusme){
    const d = S.dusme; const t = Math.min(1, d.t / .45);
    o.rot = (d.kisa ? -1 : 1) * d.yon * t * Math.PI / 2;
    if (d.disari) o.alpha = Math.max(0, 1 - d.t / 1.1);
  }
  // titreşim (şarj)
  let x = p[0], y = p[1];
  if (S.faz === 'sarj' && S.sarjT > .3){ x += Math.sin(performance.now() / 22) * Math.min(2.5, S.sarjT) * .8; }
  tasCiz(ctx, tip, x, y, KAM.U * .95 * TAS_BOY[tip], RENK_OYUNCU, o);
  // şarj parçacıkları
  if (S.faz === 'sarj'){
    const n = 6, t = performance.now() / 1000;
    for (let i = 0; i < n; i++){
      const a = i / n * Math.PI * 2 + t * 2, rr = KAM.U * (.7 - ((t * 1.3 + i * .17) % 1) * .6);
      ctx.beginPath(); ctx.arc(x + Math.cos(a) * rr, y - KAM.U * .4 + Math.sin(a) * rr * .5, Math.max(1.5, KAM.U * .03), 0, Math.PI*2);
      ctx.fillStyle = 'rgba(164,140,255,.8)'; ctx.fill();
    }
  }
}

/* Menü arka sahnesi: tahtada 6 taş dizili */
const MENU_DIZILIS = [['piyon',1,1],['kale',0,0],['at',6,0],['fil',2,0],['vezir',3,0],['sah',4,0],['piyon',4,3],['at',5,2]];
function menuSahnesi(L){
  const t = performance.now() / 1000;
  MENU_DIZILIS.forEach(([tip, f, r], i) => {
    const X = f - 3.5, Z = r - 3.5; const z = Math.max(0, Math.sin(t * 2 + i)) * .35;
    L.push({k:X + Z, d:() => { golgeElips(X, 0, Z, .9 - z * .4, .18); tasCiz(ctx, tip, ...P(X, z, Z), KAM.U * .95 * TAS_BOY[tip], i % 2 ? RENK_RAKIP : RENK_OYUNCU); }});
  });
}

function kucukTasCiz(c, tip){

  function zaman(s){ if (!s) return ''; const d = new Date(s); return d.toLocaleDateString('tr-TR') + ' ' + d.toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'}); }
  const ikon = {'Telefon':'📱','Tablet':'📲','Bilgisayar':'💻','Akıllı Tahta':'🖥️'};
  function panelAc(){
    const oncekiAcik = !kat.classList.contains('gizli') ? kutu.innerHTML : null;
    if (LSG('zirve_ogretmen_ok', '0') !== '1'){
      ac(`<h2>👩‍🏫 Öğretmen Paneli</h2><p>Şifreyi yaz.</p><input id="zgPin" type="password" inputmode="numeric" maxlength="8">
        <div class="zgHata" id="zgHata"></div><button class="zgAna" id="zgPinOk">Aç</button>
        <div class="zgSatir"><button class="zgIk" id="zgVazgec">Vazgeç</button></div>`);
      const ok = () => { if (document.getElementById('zgPin').value === AYAR.pin){ LSS('zirve_ogretmen_ok', '1'); panelGoster(); } else document.getElementById('zgHata').textContent = 'Şifre yanlış.'; };
      document.getElementById('zgPinOk').onclick = ok;
      document.getElementById('zgPin').addEventListener('keydown', e => { if (e.key === 'Enter') ok(); });
      document.getElementById('zgVazgec').onclick = kapat;
      setTimeout(() => { const i = document.getElementById('zgPin'); if (i) i.focus(); }, 50);
    } else panelGoster();
  }
  let veri = [];
  async function panelGoster(){
    ac(`<h2>👩‍🏫 Öğretmen Paneli</h2><p>Oyun girişleri yükleniyor…</p>`, true);
    try{ veri = await listele(); }catch(e){ veri = null; }
    if (!veri){ ac(`<h2>👩‍🏫 Öğretmen Paneli</h2><p>Girişler yüklenemedi. İnternet bağlantısını kontrol et.</p><div class="zgSatir"><button class="zgIk" id="zgYen">🔄 Yenile</button><button class="zgIk" id="zgKap">Kapat</button></div>`, true);
      document.getElementById('zgYen').onclick = panelGoster; document.getElementById('zgKap').onclick = kapat; return; }
    const oyunlar = [...new Set(veri.map(v => v.oyun).filter(Boolean))].sort();
    const siniflar = [...new Set(veri.map(v => v.sinif).filter(Boolean))];
    ac(`<h2>👩‍🏫 Öğretmen Paneli</h2><div class="ozet" id="zgOzet"></div>
      <div class="filt"><input id="zgAra" placeholder="🔎 İsim ara">
        <select id="zgFO"><option value="">Tüm oyunlar</option>${oyunlar.map(o => `<option>${o}</option>`).join('')}</select>
        <select id="zgFS"><option value="">Tüm sınıflar</option>${siniflar.map(o => `<option>${o}</option>`).join('')}</select>
        <select id="zgFC"><option value="">Tüm cihazlar</option>${Object.keys(ikon).map(o => `<option>${o}</option>`).join('')}</select></div>
      <div class="tablo"><table><thead><tr><th>Öğrenci</th><th>Sınıf</th><th>Oyun</th><th>Cihaz</th><th>Giriş</th><th>Son görülme</th></tr></thead><tbody id="zgGovde"></tbody></table></div>
      <div class="zgSatir"><button class="zgIk" id="zgKopya">📋 Kopyala (Excel)</button><button class="zgIk" id="zgYen">🔄 Yenile</button><button class="zgIk" id="zgUnut">🔒 Şifreyi unut</button><button class="zgIk" id="zgKap">Kapat</button></div>`, true);
    const ciz = () => {
      const a = document.getElementById('zgAra').value.toLocaleLowerCase('tr'), fo = document.getElementById('zgFO').value, fs = document.getElementById('zgFS').value, fc = document.getElementById('zgFC').value;
      const L = veri.filter(v => (!a || (v.ad + ' ' + v.soyad).toLocaleLowerCase('tr').includes(a)) && (!fo || v.oyun === fo) && (!fs || v.sinif === fs) && (!fc || v.cihaz === fc));
      const simdi = Date.now(), bugun = new Date().toDateString();
      const cevrim = v => v.son && simdi - new Date(v.son).getTime() < 5 * 60000;
      const sayi = {}; L.forEach(v => sayi[v.cihaz] = (sayi[v.cihaz] || 0) + 1);
      document.getElementById('zgOzet').innerHTML =
        `<div><b>${L.length}</b>Toplam giriş</div><div><b>${new Set(L.map(v => v.ad + v.soyad + v.sinif + v.sube)).size}</b>Farklı öğrenci</div>` +
        `<div><b>${L.filter(cevrim).length}</b>Şu an oyunda</div><div><b>${L.filter(v => new Date(v.giris).toDateString() === bugun).length}</b>Bugün</div>` +
        `<div><b>${Object.keys(ikon).map(k => ikon[k] + (sayi[k] || 0)).join(' ')}</b>Cihazlar</div>`;
      document.getElementById('zgGovde').innerHTML = L.map(v => `<tr><td>${cevrim(v) ? '<span class="nokta"></span>' : ''}${v.ad || ''} ${v.soyad || ''}</td><td>${v.sinif || ''}${v.sube ? '-' + v.sube : ''}</td><td>${v.oyun || ''}</td><td>${ikon[v.cihaz] || ''} ${v.cihaz || ''} · ${v.os || ''} · ${v.tarayici || ''}</td><td>${zaman(v.giris)}</td><td>${zaman(v.son)}</td></tr>`).join('');
      return L;
    };
    let goru = ciz();
    ['zgAra','zgFO','zgFS','zgFC'].forEach(i => document.getElementById(i).addEventListener('input', () => { goru = ciz(); }));
    document.getElementById('zgKopya').onclick = () => {
      const t = ['Ad\tSoyad\tSınıf\tŞube\tOyun\tCihaz\tİşletim sistemi\tTarayıcı\tGiriş\tSon görülme'].concat(goru.map(v => [v.ad, v.soyad, v.sinif, v.sube, v.oyun, v.cihaz, v.os, v.tarayici, zaman(v.giris), zaman(v.son)].join('\t'))).join('\n');
      if (navigator.clipboard) navigator.clipboard.writeText(t).catch(() => {});
      document.getElementById('zgKopya').textContent = '✔ Kopyalandı';
    };
    document.getElementById('zgYen').onclick = panelGoster;
    document.getElementById('zgUnut').onclick = () => { LSS('zirve_ogretmen_ok', '0'); kapat(); };
    document.getElementById('zgKap').onclick = kapat;
  }
  window.ZGIRIS = {baslat, panelAc, cihaz, ayar:AYAR, ogrenci:null};
})();

/* ================= PWA + sürüm ================= */
(function(){
  try{
    const ikon = document.querySelector('link[rel="apple-touch-icon"]').href;
    const man = {name:'Zıp Zıp Satranç', short_name:'Zıp Satranç', start_url: location.href.split('#')[0], display:'standalone', orientation:'any',
      background_color:'#f4f1f8', theme_color:'#6b4fd8', icons:[{src:ikon, sizes:'512x512', type:'image/png', purpose:'any maskable'}]};
    const l = document.createElement('link'); l.rel = 'manifest';
    l.href = URL.createObjectURL(new Blob([JSON.stringify(man)], {type:'application/manifest+json'}));
    document.head.appendChild(l);
  }catch(e){}
  // ETag ile yeni sürüm kontrolü
  if (/^https?:/.test(location.protocol)){
    let ilk = null;
    const kontrol = async () => {
      try{
        const r = await fetch(location.href.split('#')[0], {method:'HEAD', cache:'no-store'});
        const et = r.headers.get('etag') || r.headers.get('last-modified'); if (!et) return;
        if (ilk === null) ilk = et;
        else if (et !== ilk && !document.getElementById('yeniSurum')){
          const d = document.createElement('div'); d.id = 'yeniSurum'; d.innerHTML = 'Yeni sürüm var <button>Yenile</button>';
          d.querySelector('button').onclick = () => location.reload(); document.body.appendChild(d);
        }
      }catch(e){}
    };
    kontrol(); setInterval(kontrol, 5 * 60000);
  }
})();

  const M = [
    ['Tuval', !!ctx], ['Taş çizimi', typeof tasCiz === 'function'], ['Satranç kuralları', yasalHamleler('at', 3, 3).length === 8 && yasalHamleler('kale', 0, 0).length === 14],
    ['Öğrenci girişi', !!window.ZGIRIS], ['Siteye Dön', typeof window.ZIRVE_siteyeDon === 'function'],
    ['Çocuk boyu', typeof cocukBoyuUygula === 'function'], ['Sorular', soruHavuzu().length > 3]
  ];
  const tamam = M.filter(m => m[1]).length;
  if (tamam < M.length) console.warn('Eksik modül:', M.filter(m => !m[1]).map(m => m[0]));
  return [tamam, M.length];
}
