<style>
:root{--z:1;--bg:#f3f5fc;--kart:#ffffff;--yazi:#1c2240;--soluk:#68708f;--cizgi:#e1e6f3;--ana:#4b5cf0;--ana2:#7b6cff;
--hareket:#4C97FF;--kontrol:#FFAB19;--algi:#2fa9cf;--gorunum:#9966FF;--yesil:#1f9d55;--turuncu:#ee8420;--mavi:#2f7de1;--kirmizi:#e5484d;--ust-h:4.2rem}
*{box-sizing:border-box}
html{font-size:calc(16px * var(--z));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--yazi);font-family:Nunito,"Segoe UI",system-ui,sans-serif;font-weight:700;font-variant-numeric:lining-nums tabular-nums;min-height:100vh;overflow-x:hidden}
button{font-family:inherit;font-weight:800;cursor:pointer;color:inherit}
a{color:var(--ana)}
.gizli{display:none!important}
/* ÜST */
.ust{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--cizgi);display:flex;align-items:center;gap:.8rem;padding:.55rem 1rem;min-height:var(--ust-h)}
.logo{display:flex;align-items:center;gap:.55rem;font-weight:900;font-size:1.15rem;white-space:nowrap}
.logo img{width:2.4rem;height:2.4rem;border-radius:.7rem}
.logo small{display:block;font-size:.72rem;color:var(--soluk);font-weight:800}
.nav{display:flex;gap:.3rem;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:transparent;padding:.55rem .8rem;border-radius:.8rem;font-size:.95rem;white-space:nowrap;color:var(--soluk)}
.nav button.aktif{background:#eceefe;color:var(--ana)}
.nav button:hover{background:#f1f3fd}
.ogr-chip{font-size:.85rem;background:#f1f3fb;border-radius:2rem;padding:.35rem .75rem;color:var(--soluk);white-space:nowrap}
main{max-width:84rem;margin:0 auto;padding:1.1rem 1rem 3rem}
.sayfa{display:none}.sayfa.aktif{display:block}
h1,h2,h3{margin:.2rem 0 .6rem;line-height:1.2}
h1{font-size:1.9rem;font-weight:900}h2{font-size:1.45rem;font-weight:900}h3{font-size:1.15rem}
.kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:1.2rem;padding:1.1rem;box-shadow:0 6px 22px rgba(40,50,110,.06)}
.btn{border:0;border-radius:.9rem;padding:.7rem 1.1rem;font-size:1rem;background:#eef0fb;color:var(--yazi);display:inline-flex;align-items:center;gap:.4rem;justify-content:center}
.btn.ana{background:var(--ana);color:#fff;box-shadow:0 4px 0 #3343c8}
.btn.yesil{background:#21a35b;color:#fff;box-shadow:0 4px 0 #14803f}
.btn:active{transform:translateY(2px)}
.soluk-btn{border:1px solid var(--cizgi);background:#fff;opacity:.72;border-radius:2rem;padding:.45rem .8rem;font-size:.85rem;color:var(--soluk)}
.soluk-btn:hover{opacity:1}
/* ANA */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:1.2rem;align-items:center;background:linear-gradient(135deg,#eef0ff,#f9f4ff 60%,#eefbf6);border:1px solid var(--cizgi);border-radius:1.6rem;padding:1.6rem 1.8rem;overflow:hidden}
.hero p{color:var(--soluk);font-size:1.08rem;line-height:1.55;margin:.3rem 0 1rem}
.hero-robot{display:flex;justify-content:center}
.ana-kartlar{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-top:1.1rem}
.ana-kart{border:1px solid var(--cizgi);background:#fff;border-radius:1.3rem;padding:1.2rem;text-align:left;display:flex;flex-direction:column;gap:.4rem;transition:transform .15s,box-shadow .15s;min-height:9.5rem}
.ana-kart:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(40,50,110,.1)}
.ana-kart .ik{font-size:2rem;width:3.2rem;height:3.2rem;border-radius:1rem;display:grid;place-items:center}
.ana-kart b{font-size:1.15rem}.ana-kart span{color:var(--soluk);font-size:.92rem;line-height:1.4}
.kucuk-btnler{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.1rem}
.istat{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.4rem}
.istat div{background:#fff;border:1px solid var(--cizgi);border-radius:1rem;padding:.45rem .8rem;font-size:.9rem}
/* DERSLER */
.sinif-pills{display:flex;gap:.45rem;flex-wrap:wrap;margin:.6rem 0 1rem}
.pill{border:1px solid var(--cizgi);background:#fff;border-radius:2rem;padding:.5rem .95rem;font-size:.95rem;color:var(--soluk)}
.pill.aktif{background:var(--ana);border-color:var(--ana);color:#fff}
.kurs-bas{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.ilerleme{height:.6rem;background:#e8ebf7;border-radius:1rem;overflow:hidden;min-width:10rem;flex:1;max-width:20rem}
.ilerleme i{display:block;height:100%;background:linear-gradient(90deg,#22b07d,#4b5cf0);border-radius:1rem}
.hafta-liste{display:grid;gap:.75rem;margin-top:1rem}
.hafta{display:grid;grid-template-columns:5.5rem 1fr auto;align-items:center;gap:1rem;background:#fff;border:1px solid var(--cizgi);border-radius:1.1rem;padding:.8rem 1rem;text-align:left;width:100%}
.hafta:hover{border-color:#c5ccf5}
.hafta .no{color:var(--soluk);font-size:.88rem}
.hafta .bas{font-size:1.1rem;font-weight:900;display:flex;gap:.5rem;align-items:center}
.hafta .alt{color:var(--soluk);font-size:.88rem;margin-top:.15rem}
.durum{font-size:.85rem;border-radius:2rem;padding:.3rem .7rem;background:#f1f3fb;color:var(--soluk);white-space:nowrap}
.durum.ok{background:#e3f7ec;color:#14804a}
/* DERS */
.geri-link{border:0;background:none;color:var(--ana);font-size:.95rem;padding:.2rem 0;margin-bottom:.4rem}
.ders-grid{display:grid;grid-template-columns:minmax(19rem,27rem) 1fr;gap:1rem;align-items:start}
.ders-metin{line-height:1.6;font-size:1.02rem}
.ders-metin ol{padding-left:1.3rem;margin:.4rem 0}.ders-metin li{margin:.35rem 0}
.not{border-radius:1rem;padding:.75rem .9rem;margin:.8rem 0;font-size:.98rem}
.not.ipucu{background:#fff6e2;border:1px solid #ffe2a6}
.not.gorev{background:#eaf7ff;border:1px solid #c4e7fb}
.not.ek{background:#f4f0ff;border:1px solid #ddd3ff}
.soru-kutu{background:#f7f8fd;border:1px solid var(--cizgi);border-radius:1rem;padding:.8rem;margin:.8rem 0}
.soru-kutu .s{font-size:1.15rem;font-weight:900;margin-bottom:.5rem}
.siklar{display:grid;gap:.45rem}
.siklar.iki{grid-template-columns:1fr 1fr}
.sik{border:2px solid var(--cizgi);background:#fff;border-radius:.9rem;padding:.7rem;font-size:1.1rem;text-align:left}
.sik.dogru{border-color:#22b07d;background:#e6f8ef}.sik.yanlis{border-color:#ef6b6e;background:#fdeced}
.dinle{border:0;background:#eef0fb;border-radius:2rem;padding:.35rem .7rem;font-size:.85rem;color:var(--ana)}
.ders-alt{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem}
/* ÇALIŞMA ALANI */
.calisma-kap{container-type:inline-size}
.calisma{display:grid;gap:.75rem;grid-template-columns:minmax(9.5rem,11.5rem) minmax(11rem,14rem) minmax(20rem,1fr);grid-template-areas:"palet program sahne" "palet program kontrol"}
@container (max-width:44rem){.calisma{grid-template-columns:minmax(9.5rem,12rem) 1fr;grid-template-areas:"sahne sahne" "kontrol kontrol" "palet program"}}
.panel{background:#fff;border:1px solid var(--cizgi);border-radius:1.1rem;padding:.7rem}
.palet{grid-area:palet;max-height:30rem;overflow:auto}
.program-kutu{grid-area:program;display:flex;flex-direction:column;min-height:16rem}
.panel h4{margin:.1rem 0 .45rem;font-size:.82rem;color:var(--soluk);text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between}
.kat{font-size:.78rem;color:var(--soluk);margin:.55rem 0 .2rem}
.program{flex:1;min-height:12rem;background:repeating-linear-gradient(0deg,#fafbff,#fafbff 22px,#f3f5fd 22px,#f3f5fd 23px);border-radius:.8rem;padding:.4rem;overflow:auto;max-height:30rem}
.program.aktif-kap{outline:2px dashed #b9c1f5}
.bos-yazi{color:#9aa1bd;font-size:.9rem;padding:.6rem;text-align:center}
.blok{--c:var(--hareket);background:var(--c);color:#fff;border-radius:.65rem;padding:.5rem .75rem;font-weight:900;font-size:1rem;margin:.28rem 0;box-shadow:0 3px 0 rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.25);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;position:relative;width:max-content;min-width:8.5rem;max-width:100%;text-shadow:0 1px 0 rgba(0,0,0,.15)}
.blok.c{padding:0}
.blok .b-ust{padding:.5rem .75rem;display:flex;align-items:center;gap:.35rem;flex-wrap:wrap}
.blok .b-ic{margin-left:1rem;min-height:2.3rem;background:#f6f7fd;border-radius:.45rem 0 0 .45rem;padding:.15rem .35rem;color:var(--yazi)}
.blok .b-ic.aktif-kap{outline:2px dashed #ffbf47;background:#fffaf0}
.blok .b-orta{padding:.25rem .75rem;font-size:.9rem}
.blok .b-alt{height:.75rem}
.blok select{font-family:inherit;font-weight:900;font-size:.95rem;border:0;border-radius:.45rem;padding:.12rem .25rem;background:#fff;color:#333}
.blok .kos{background:#d8f3fb}
.blok .sil{position:absolute;right:-.45rem;top:-.45rem;width:1.35rem;height:1.35rem;border-radius:50%;border:2px solid #fff;background:#333a;color:#fff;font-size:.75rem;line-height:1;display:grid;place-items:center;padding:0}
.blok.calisiyor{box-shadow:0 0 0 3px #ffe14d,0 0 18px #ffd20088}
.blok.parlat{animation:parla 1s ease-in-out 3}
@keyframes parla{50%{box-shadow:0 0 0 4px #fff,0 0 0 7px #ffcf33,0 0 22px #ffcf33}}
.blok.hatali{box-shadow:0 0 0 3px #ff4d6d}
.b-yuk{--c:var(--yesil)}.b-asa{--c:var(--turuncu)}.b-sol{--c:var(--mavi)}.b-sag{--c:var(--kirmizi)}
.b-kontrol{--c:var(--kontrol)}.b-algi{--c:var(--algi)}.b-gorunum{--c:var(--gorunum)}
.surukle-hayalet{position:fixed;z-index:9999;pointer-events:none;opacity:.9;transform:rotate(-2deg) scale(1.03)}
.yer-isareti{height:5px;background:#ffcc00;border-radius:3px;margin:2px 0}
.sahne-kutu{grid-area:sahne;position:relative;background:#2a2f45;border-radius:1.1rem;overflow:hidden;box-shadow:0 8px 24px rgba(30,30,70,.18)}
.sahne-kutu canvas{display:block;width:100%;aspect-ratio:4/3;height:auto;max-height:62vh;object-fit:contain}
.kontrol{grid-area:kontrol;display:flex;flex-direction:column;gap:.5rem}
.kontroller{display:flex;gap:.45rem;flex-wrap:wrap}
.kontroller .btn{padding:.65rem .85rem;font-size:.98rem}
.kontroller .calistir{font-size:1.1rem;padding:.7rem 1.3rem}
.mesaj{background:#fff;border:1px solid var(--cizgi);border-radius:1rem;padding:.6rem .8rem;font-size:1rem;min-height:2.6rem;display:flex;gap:.5rem;align-items:center}
.mesaj.iyi{background:#e8f8ef;border-color:#bfe9d1}.mesaj.kotu{background:#fff1ec;border-color:#ffd2c2}
/* ATÖLYE */
.seviye-pills{display:flex;gap:.4rem;flex-wrap:wrap;margin:.5rem 0 .9rem}
.sev{width:3.1rem;height:3.1rem;border-radius:.9rem;border:1px solid var(--cizgi);background:#fff;font-size:1.05rem;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.sev small{font-size:.62rem;color:#f0a400;margin-top:.15rem;letter-spacing:-.05em}
.sev.aktif{background:var(--ana);color:#fff;border-color:var(--ana)}
/* KUPA */
.dolap{background:linear-gradient(#7a4b26,#5d3818);border-radius:1.3rem;padding:1rem;box-shadow:inset 0 0 0 6px #8c5a30,0 12px 30px rgba(60,30,10,.25)}
.raf{background:linear-gradient(#fdf6ea,#f1e3cb);border-radius:.7rem;min-height:5.2rem;margin:.6rem 0;padding:.6rem .8rem 1rem;position:relative;display:flex;flex-wrap:wrap;gap:.5rem;align-items:flex-end;box-shadow:inset 0 -12px 0 #c89a62}
.raf .etk{position:absolute;left:.7rem;top:.35rem;font-size:.78rem;color:#7a5a36}
.raf .esya{font-size:2rem;filter:drop-shadow(0 4px 2px rgba(0,0,0,.25));margin-top:1.2rem;text-align:center}
.raf .esya small{display:block;font-size:.62rem;color:#6d5032;max-width:5rem}
.raf .bos{color:#b39572;font-size:.9rem;margin-top:1.4rem}
/* MODAL */
.modal-arka{position:fixed;inset:0;background:rgba(18,22,48,.5);z-index:9000;display:flex;align-items:center;justify-content:center;padding:1rem;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:1.4rem;max-width:34rem;width:100%;max-height:92vh;overflow:auto;padding:1.3rem;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.genis{max-width:62rem}
.modal .kapat{position:absolute;right:.8rem;top:.8rem;border:0;background:#f1f3fb;border-radius:50%;width:2.3rem;height:2.3rem;font-size:1rem}
.liste-btn{display:grid;gap:.5rem}
.liste-btn .btn{justify-content:flex-start;width:100%}
.yildizlar{font-size:2.6rem;letter-spacing:.2rem;text-align:center}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#1c2240;color:#fff;padding:.7rem 1.1rem;border-radius:1rem;z-index:9800;font-size:.95rem;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:fade .2s}
.surum-band{position:fixed;top:.6rem;left:50%;transform:translateX(-50%);z-index:9700;background:#1c2240;color:#fff;border-radius:1rem;padding:.6rem 1rem;font-size:.9rem;display:flex;gap:.7rem;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:94vw}
.surum-band button{border:0;background:#ffffff22;color:#fff;border-radius:.6rem;padding:.3rem .6rem}
.yan-uyari{position:fixed;inset:auto 0 0 0;background:#1c2240;color:#fff;padding:.8rem 1rem;z-index:8000;display:none;justify-content:space-between;align-items:center;gap:.6rem;font-size:.95rem}
@media (orientation:portrait) and (max-width:600px){.yan-uyari.goster{display:flex}}
/* ZGIRIS */
.zg-arka{position:fixed;inset:0;z-index:9500;background:radial-gradient(circle at 30% 20%,#3c3f9e,#14163a 70%);display:flex;align-items:center;justify-content:center;padding:1rem;overflow:auto}
.zg-kart{background:#fff;border-radius:1.6rem;padding:1.5rem;width:100%;max-width:30rem;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.zg-kart h2{display:flex;align-items:center;gap:.5rem}
.zg-kart label{display:block;font-size:.88rem;color:var(--soluk);margin:.6rem 0 .2rem}
.zg-kart input,.zg-kart select{width:100%;font-family:inherit;font-weight:800;font-size:1.15rem;border:2px solid var(--cizgi);border-radius:.8rem;padding:.65rem .75rem;background:#fafbff;color:var(--yazi)}
.zg-kart input:focus,.zg-kart select:focus{outline:none;border-color:var(--zg,#6c4cf0)}
.zg-satir{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.zg-hata{color:#d33;font-size:.9rem;min-height:1.2rem;margin-top:.4rem}
.zg-btn{width:100%;margin-top:.8rem;border:0;border-radius:1rem;padding:.85rem;font-size:1.15rem;background:var(--zg,#6c4cf0);color:#fff}
.zg-alt{display:flex;justify-content:space-between;margin-top:.8rem;gap:.5rem}
.zg-tablo{width:100%;border-collapse:collapse;font-size:.88rem}
.zg-tablo th,.zg-tablo td{padding:.45rem .5rem;border-bottom:1px solid var(--cizgi);text-align:left;vertical-align:top}
.zg-tablo th{background:#f6f7fd;position:sticky;top:0}
.zg-ozet{display:grid;grid-template-columns:repeat(auto-fit,minmax(7.5rem,1fr));gap:.5rem;margin:.6rem 0}
.zg-ozet div{background:#f6f7fd;border-radius:.9rem;padding:.6rem;text-align:center}
.zg-ozet b{display:block;font-size:1.4rem}
.zg-filtre{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0}
.zg-filtre input,.zg-filtre select{font-family:inherit;font-weight:700;border:1px solid var(--cizgi);border-radius:.6rem;padding:.45rem .55rem;font-size:.92rem}
.nokta{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;background:#22c55e;margin-right:.3rem}
/* RESPONSIVE */
@media (max-width:980px){.ana-kartlar{grid-template-columns:1fr 1fr}.hero{grid-template-columns:1fr}.hero-robot{display:none}.ders-grid{grid-template-columns:1fr}.logo small{display:none}}
@media (max-width:640px){.ust{flex-wrap:wrap;gap:.4rem;padding:.45rem .7rem}.nav{order:3;width:100%;margin-left:0}.ogr-chip{margin-left:auto}main{padding:.8rem .7rem 3rem}h1{font-size:1.5rem}.hafta{grid-template-columns:1fr auto}.hafta .no{grid-column:1/-1}.ana-kartlar{gap:.6rem}.ana-kart{min-height:8rem;padding:.9rem}}
/* ÇOCUK BOYU */
body.cocuk-boyu .nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-top:1px solid var(--cizgi);padding:.45rem .6rem;justify-content:center;margin:0;box-shadow:0 -6px 20px rgba(0,0,0,.06)}
body.cocuk-boyu .nav button{font-size:1.05rem;padding:.7rem 1rem}
body.cocuk-boyu main{padding-bottom:5.5rem}
body.cocuk-boyu .sayfa.aktif{min-height:calc(100vh - var(--ust-h) - 7rem);display:flex;flex-direction:column;justify-content:flex-end}
body.cocuk-boyu .modal-arka{align-items:flex-end;padding-bottom:5.5rem}
body.cocuk-boyu .zg-arka{align-items:flex-end}
body.cocuk-boyu .ders-grid{grid-template-columns:1fr}
body.cocuk-boyu .ders-metin{max-height:24vh;overflow:auto}
body.cocuk-boyu .ust{backdrop-filter:none;-webkit-backdrop-filter:none;position:relative}
body.cocuk-boyu .sahne-kutu canvas{max-height:44vh}
body.cocuk-boyu .palet,body.cocuk-boyu .program{max-height:44vh}
body.cocuk-boyu main{padding-top:.5rem}
body.cocuk-boyu .hero{display:none}
body.cocuk-boyu .ust-bilgi-ders{display:none}
</style>
</head>

const DX=[1,0,-1,0],DY=[0,1,0,-1];
const ABS_TOK=['sag','asa','sol','yuk'];
function rng(seed){let a=seed>>>0||1;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function segDirs(s,r=1){const d=[];for(let k=0;k<r;k++)for(const[dir,n]of s)for(let i=0;i<n;i++)d.push(dir);return d;}
function relCevir(dirs){const t=[];let f=0;for(const d of dirs){const df=(d-f+4)%4;if(df===1)t.push('saga');else if(df===3)t.push('sola');else if(df===2){t.push('saga','saga');}f=d;t.push('ileri');}return t;}

function atolyeCiz(){const b=SINIF?bandi(SINIF):(LS.raw('zirve_oyun_sinif')||'34');P.atolye[b]=P.atolye[b]||{};const durum=P.atolye[b];
 $('#s-atolye').innerHTML=`<h1>Robot Pisti 🛣️</h1><p style="color:var(--soluk);margin:.2rem 0">Pist pist ilerle: komutları sırala, Bitbit'i şarj istasyonuna yanaştır. <b>${BANT_AD[b]}</b></p>
 <div class="seviye-pills">${Array.from({length:12},(_,i)=>`<button class="sev${i===atolyeSev?' aktif':''}" data-i="${i}">${i+1}<small>${durum[i]?'★'.repeat(durum[i]):''}</small></button>`).join('')}<button class="soluk-btn" id="atSinif" style="margin-left:.4rem">🎓 Kademe değiştir</button></div><div id="atUyg"></div>`;
 $$('.sev',$('#s-atolye')).forEach(x=>x.onclick=()=>{atolyeSev=+x.dataset.i;atolyeCiz();});$('#atSinif').onclick=()=>sinifAc(()=>{atolyeSev=0;atolyeCiz();});
 const sev=atolyeSeviye(b,atolyeSev);
 calismaKur($('#atUyg'),sev,{basari:y=>{durum[atolyeSev]=Math.max(durum[atolyeSev]||0,y);ilerlemeKaydet();setTimeout(()=>sonucModal(y,`Robot Pisti · ${BANT_AD[b]} · Bölüm ${atolyeSev+1}`,null,atolyeSev<11?()=>{atolyeSev++;atolyeCiz();}:null),1300);}});
 if(b==='ana')CS.mesaj('🔊 Renkli yön bloklarına dokun, Bitbit\'i yeşil ışıklı istasyona götür!');}
function haftalikCiz(){const b=SINIF?bandi(SINIF):(LS.raw('zirve_oyun_sinif')||'34');const[yil,hf]=haftaNo();const key=`${yil}-${hf}-${b}`;
 const sev=seviyeOlustur(haftalikSpec(b),hashStr(key),`Hafta ${hf}`);
 $('#s-haftalik').innerHTML=`<h1>Pazartesi Meydan Okuması 🚩</h1><div class="kart" style="margin-bottom:1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap"><div style="font-size:2.6rem">${P.haftalik[key]?'🏆':'🎯'}</div><div style="flex:1;min-width:14rem"><b style="font-size:1.15rem">${yil} · ${hf}. hafta görevi — ${BANT_AD[b]}</b><div style="color:var(--soluk)">Bu görev her pazartesi yenilenir. ${haftalikSpec(b).kor?'Koşullu döngüyle her koridorda çalışan bir program yaz!':'Tüm pilleri topla ve istasyona var. Döngü kullanırsan daha çok yıldız!'}</div></div><span class="durum${P.haftalik[key]?' ok':''}">${P.haftalik[key]?'Kupa kazanıldı ✅':'Kupa bekliyor'}</span></div><div id="hfUyg"></div>`;
 calismaKur($('#hfUyg'),sev,{basari:y=>{const ilk=!P.haftalik[key];P.haftalik[key]=Math.max(P.haftalik[key]||0,y);ilerlemeKaydet();setTimeout(()=>sonucModal(y,`Pazartesi Meydan Okuması · ${hf}. hafta`,ilk?'Haftanın kupası Kupa Dolabı\'na kondu! 🏆':null,null),1300);}});}
function kupaCiz(){const rozet=[];for(const[k,a]of SINIFLAR){DERSLER[k].d.forEach((d,i)=>{if(P.ders[k+'-'+i])rozet.push({e:d.e,t:`${a} · ${d.t}`,y:P.ders[k+'-'+i]});});}
 const at=Object.entries(P.atolye).map(([b,o])=>({b,y:Object.values(o).reduce((a,c)=>a+c,0),n:Object.keys(o).length}));const hf=Object.entries(P.haftalik);
 const raf=(etk,ic,bos)=>`<div class="raf"><span class="etk">${etk}</span>${ic||`<span class="bos">${bos}</span>`}</div>`;
 $('#s-kupa').innerHTML=`<h1>Kupa Dolabı 🏅</h1><p style="color:var(--soluk)">Kazandığın her şey burada sergileniyor.</p><div class="dolap">
 ${raf('🔋 Şarj Rafı — toplanan piller: '+P.pil,Array.from({length:Math.min(P.pil,40)},()=>'<span class="esya" style="font-size:1.6rem">🔋</span>').join('')+(P.pil>40?`<span class="esya" style="font-size:1.1rem">+${P.pil-40}</span>`:''),'Henüz pil yok — bölümlerde pilleri topla!')}
 ${raf('🏅 Ders rozetleri',rozet.map(r=>`<span class="esya" title="${esc(r.t)}">${r.e}<small>${'⭐'.repeat(r.y)}</small></span>`).join(''),'Bir dersin uygulamasını çözünce rozet kazanırsın.')}
 ${raf('🛣️ Robot Pisti kupaları',at.filter(a=>a.n).map(a=>`<span class="esya">${a.n>=12?'🏆':a.n>=6?'🥈':'🥉'}<small>${BANT_AD[a.b]} · ${a.n}/12 · ⭐${a.y}</small></span>`).join(''),'Atölye bölümlerini çözdükçe kupa gelir (3 bölüm 🥉, 6 bölüm 🥈, 12 bölüm 🏆).')}
 ${raf('🏆 Pazartesi Meydan Okuması kupaları',hf.map(([k,y])=>`<span class="esya">🏆<small>${k.split('-')[1]}. hafta</small></span>`).join(''),'Her haftanın görevini çöz, kupa kazan!')}</div>`;}
function ayarlarAc(){const m=modal(`<h2>⚙️ Ayarlar</h2><div class="liste-btn">
 <button class="btn" data-a="yardim">❓ Nasıl kullanılır?</button><button class="btn" data-a="sinif">🎓 Sınıf: ${SINIF?SINIFLAR.find(s=>s[0]===SINIF)[1]:'seçilmedi'}</button>
 <button class="btn" data-a="cocuk">🧒 Çocuk boyu: ${cocukBoyuAcik()?'Açık':'Kapalı'}</button>
 <button class="btn" data-a="ekran">📺 Ekran modu: ${({oto:'Otomatik',normal:'Normal',tahta:'Akıllı Tahta',buyuk:'Büyük Tahta'})[LS.raw('zirve_ekran_modu')||'oto']}</button>
 <button class="btn" data-a="ses">${SES.acik?'🔊 Ses: Açık':'🔇 Ses: Kapalı'}</button><button class="btn" data-a="qr">📲 QR ile paylaş</button>
 <button class="btn" data-a="panel">👩‍🏫 Öğretmen Paneli</button><button class="btn" data-a="surum">📦 Sürüm v${APP.surum} · öz-kontrol</button>
 <button class="btn" data-a="cikis">👤 Öğrenci değiştir</button><button class="btn" data-a="site">🏠 Siteye Dön</button></div>
 <p style="color:var(--soluk);font-size:.85rem">Klavye: ok tuşları blok ekler, Enter çalıştırır, Geri Sil son bloğu siler, P mola.</p>`);
 $$('[data-a]',m).forEach(b=>b.onclick=()=>{const a=b.dataset.a;m.kapat();({yardim:karsilamaAc,sinif:()=>sinifAc(),cocuk:()=>{cocukBoyuDegistir();},ses:()=>{SES.acik=!SES.acik;LS.rawSet('ko_ses',SES.acik?'1':'0');toast(SES.acik?'🔊 Ses açık':'🔇 Ses kapalı');},
  ekran:()=>{const s=['oto','normal','tahta','buyuk'];const c=LS.raw('zirve_ekran_modu')||'oto';LS.rawSet('zirve_ekran_modu',s[(s.indexOf(c)+1)%4]);ekranModuUygula();ayarlarAc();},qr:qrAc,panel:ZGIRIS.panelAc,surum:surumBilgi,cikis:ZGIRIS.cikis,site:siteyeDon})[a]();});}
function molaAc(){const m=modal(`<h2>⏸ Mola</h2><div class="liste-btn"><button class="btn ana" data-m="devam">▶ Devam et</button><button class="btn" data-m="cocuk">🧒 Çocuk boyu: ${cocukBoyuAcik()?'Açık':'Kapalı'}</button><button class="btn" data-m="ayar">⚙️ Ayarlar</button><button class="btn" data-m="site">🏠 Siteye Dön</button></div>`);
 $$('[data-m]',m).forEach(b=>b.onclick=()=>{m.kapat();({devam:()=>{},cocuk:cocukBoyuDegistir,ayar:ayarlarAc,site:siteyeDon})[b.dataset.m]();});}

/* ========== 11. KLAVYE + BAŞLAT ========== */
document.addEventListener('keydown',e=>{if(window.EGT.mesgul||/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName))return;if(e.key==='p'||e.key==='P'){molaAc();return;}if(!CS||CS.kosuyor)return;
 const abs=CS.sev.kit[0]==='A';const m=abs?{ArrowUp:'yuk',ArrowDown:'asa',ArrowLeft:'sol',ArrowRight:'sag',w:'yuk',s:'asa',a:'sol',d:'sag'}:{ArrowUp:'ileri',ArrowLeft:'sola',ArrowRight:'saga',w:'ileri',a:'sola',d:'saga'};
 if(m[e.key]){e.preventDefault();CS.ekle(m[e.key]);}else if(e.key==='Enter'){e.preventDefault();calistir(CS);}else if(e.key==='Backspace'){e.preventDefault();CS.prog.pop();CS.aktif='main';CS.ciz();}});
$$('#nav button').forEach(b=>b.onclick=()=>{if(b.dataset.ayar)return ayarlarAc();if(b.dataset.git==='dersler'&&!SINIF)return sinifAc(()=>git('dersler'));git(b.dataset.git);});
async function baslat(){ekranModuUygula();cocukBoyuUygula();addEventListener('resize',()=>{});
 const o=await ZGIRIS.baslat({oyun:"Bitbit'in Kod Yolculuğu",renk:'#4b5cf0'});$('#ogrChip').textContent=`👤 ${o.ad} · ${o.sinif}${/^\d+$/.test(o.sinif)?'-':' '}${o.sube}`;
 if(!SINIF){if(o.sinif==='Anaokulu')sinifAyarla('A');else if(/^[1-8]$/.test(o.sinif))sinifAyarla(o.sinif);}
 ilerlemeKaydet();git('ana');if(LS.raw('zirve_karsilama_kodokulu')!=='1')karsilamaAc();else surumBandi();if(!LS.get('ko_yan_kapat',0))$('#yanUyari').classList.add('goster');yeniSurumKontrol();
 if(!SINIF&&LS.raw('zirve_karsilama_kodokulu')==='1')sinifAc();}
baslat();
</script>
