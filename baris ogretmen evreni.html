<style>
:root{--bg:#050816;--cam:rgba(13,20,44,.82);--cizgi:rgba(148,163,255,.22);--yazi:#eef2ff;--soluk:#a5b0d6;--vurgu:#ffd166}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
html,body{margin:0;height:100%;background:var(--bg);color:var(--yazi);overflow:hidden;
  font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:600;font-variant-numeric:lining-nums}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas#c.tut{cursor:grabbing}
button{font:inherit;color:inherit;cursor:pointer;border:0}
#ust{position:fixed;left:0;right:0;top:0;padding:calc(.7rem + env(safe-area-inset-top)) 1rem .6rem;text-align:center;pointer-events:none;
  background:linear-gradient(#050816d9,#05081600);z-index:5;transition:opacity .6s}
#ust h1{margin:0;font-size:1.25rem;font-weight:900;letter-spacing:.04em;
  background:linear-gradient(90deg,#7dd3fc,#c4b5fd,#fda4af,#fde68a);-webkit-background-clip:text;background-clip:text;color:transparent}
#sayac{font-size:.82rem;color:var(--soluk);margin-top:.15rem;font-weight:800}
#altyazi{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:6;pointer-events:none;text-align:center;
  font-size:1.5rem;font-weight:900;text-shadow:0 2px 18px #000;opacity:0;transition:opacity .5s;width:min(92vw,46rem)}
#altyazi.acik{opacity:1}
#alt{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;flex-wrap:wrap;justify-content:center;gap:.4rem;
  padding:.55rem .6rem calc(.55rem + env(safe-area-inset-bottom));background:linear-gradient(#05081600,#050816f2 38%)}
.dg{background:var(--cam);border:1px solid var(--cizgi);border-radius:999px;padding:.62rem .95rem;font-weight:800;font-size:.95rem;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:inline-flex;align-items:center;gap:.4rem;min-height:2.75rem;
  transition:transform .12s,background .2s,border-color .2s;white-space:nowrap}
.dg:active{transform:scale(.94)}
.dg.ana{background:linear-gradient(135deg,#6366f1,#a855f7);border-color:#c4b5fd}
.dg.altin{background:linear-gradient(135deg,#f59e0b,#f97316);border-color:#fde68a;color:#1a1005}
.dg.acik{border-color:var(--vurgu);color:var(--vurgu)}
.dg i{font-style:normal;font-size:1.15em}
@media(max-width:760px){#alt .dg .et{display:none}#alt .dg{padding:.62rem .8rem}#alt .dg.uzun .et{display:inline}}
@media(max-width:400px),(max-height:480px){#alt .dg.uzun .et{display:none}}
@media(max-height:480px){#alt .dg .et{display:none}#alt .dg{padding:.5rem .8rem;min-height:2.4rem}#ust h1{font-size:1rem}#alt{gap:.3rem;padding-top:.3rem}#kart{max-height:64vh;padding:.7rem .9rem}.kac{margin:.4rem 0 .5rem}.kemo{width:2.6rem;height:2.6rem;font-size:1.8rem}}
#kart{position:fixed;left:50%;bottom:var(--altY,4.6rem);transform:translate(-50%,130%);z-index:18;width:min(94vw,34rem);
  background:var(--cam);border:1px solid var(--cizgi);border-radius:1.4rem;padding:1rem 1.1rem;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 20px 60px #000a;transition:transform .45s cubic-bezier(.2,.9,.25,1.1),opacity .3s;opacity:0;max-height:52vh;overflow:auto}
#kart.acik{transform:translate(-50%,0);opacity:1}
body.cocuk-alcak #kart{max-height:44vh}
.kbas{display:flex;gap:.8rem;align-items:center}
.kemo{font-size:2.6rem;line-height:1;width:3.6rem;height:3.6rem;border-radius:50%;display:grid;place-items:center;flex:none;
  background:radial-gradient(circle at 32% 30%,#fff5,#0000 60%),var(--kr,#6366f1);box-shadow:0 0 26px var(--kr,#6366f1)}
.kad{font-size:1.3rem;font-weight:900;line-height:1.15}
.hap{display:inline-block;font-size:.75rem;font-weight:800;padding:.18rem .6rem;border-radius:999px;margin:.3rem .3rem 0 0;
  border:1px solid var(--kr,#888);color:var(--kr,#ccc)}
.hap.gri{border-color:#64748b;color:#cbd5e1}
.kac{margin:.7rem 0 .8rem;font-size:1.02rem;line-height:1.45;color:#dbe3ff}
.ksat{display:flex;flex-wrap:wrap;gap:.45rem}
.ksat .dg{flex:1 1 auto;justify-content:center}
#perde{position:fixed;inset:0;background:#02040cb8;z-index:40;display:none;align-items:center;justify-content:center;padding:1rem}
#perde.acik{display:flex}
body.cocuk-boyu #perde{align-items:flex-end;padding-bottom:calc(.8rem + env(safe-area-inset-bottom))}
#modal{width:min(96vw,40rem);max-height:86vh;overflow:auto;background:#0d1430;border:1px solid var(--cizgi);border-radius:1.4rem;padding:1.1rem 1.2rem;
  box-shadow:0 30px 80px #000c}
body.cocuk-boyu #modal{max-height:60vh}
body.cocuk-alcak #modal{max-height:50vh}
#modal h2{margin:0 0 .7rem;font-size:1.3rem;font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:.6rem}
#modal h3{margin:1rem 0 .45rem;font-size:.95rem;color:var(--vurgu);font-weight:900}
.kapat{background:#1e2a55;border-radius:50%;width:2.6rem;height:2.6rem;font-size:1.1rem;flex:none}
.liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(12.5rem,1fr));gap:.5rem}
.sat{display:flex;align-items:center;gap:.6rem;text-align:left;background:#141d42;border:1px solid var(--cizgi);border-radius:1rem;padding:.6rem .75rem;
  font-weight:800;font-size:.98rem;min-height:3rem;width:100%}
.sat small{display:block;color:var(--soluk);font-weight:600;font-size:.78rem}
.sat .e{font-size:1.5rem;flex:none}
.sat.tamam{border-color:#4ade80}
.seg{display:flex;flex-wrap:wrap;gap:.35rem}
.seg .dg{font-size:.85rem;padding:.5rem .8rem;min-height:2.5rem}
.cubuk{height:.55rem;border-radius:99px;background:#1e2a55;overflow:hidden;margin:.3rem 0 .1rem}
.cubuk b{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#22d3ee,#a78bfa,#f472b6)}
.adim{display:flex;gap:.7rem;align-items:flex-start;margin:.55rem 0;font-size:1.02rem;line-height:1.4}
.adim>b{flex:none;width:2.2rem;height:2.2rem;border-radius:50%;display:grid;place-items:center;background:#1e2a55;font-size:1.15rem}
.araKutu{position:relative;margin-bottom:.7rem}
.araKutu input{width:100%;font:inherit;font-weight:800;font-size:1.05rem;color:#fff;background:#141d42;border:1px solid var(--cizgi);border-radius:999px;padding:.75rem 3rem .75rem 1.1rem;outline:0}
.araKutu button{position:absolute;right:.4rem;top:50%;transform:translateY(-50%);width:2.2rem;height:2.2rem;border-radius:50%;background:#1e2a55;display:none}
.not{font-size:.85rem;color:var(--soluk);line-height:1.45}
#qrkutu{background:#fff;padding:1rem;border-radius:1rem;display:inline-block;margin:.4rem 0}
#qrkutu img{display:block;width:13rem;height:13rem;image-rendering:pixelated}
#toast{position:fixed;left:50%;top:calc(4.6rem + env(safe-area-inset-top));transform:translate(-50%,-1rem);z-index:60;background:#0d1430f2;border:1px solid var(--cizgi);
  padding:.6rem 1.1rem;border-radius:999px;font-weight:800;font-size:.9rem;opacity:0;pointer-events:none;transition:.35s;max-width:92vw;text-align:center}
#toast.acik{opacity:1;transform:translate(-50%,0)}
#yeniSurum{position:fixed;right:.7rem;top:calc(.7rem + env(safe-area-inset-top));z-index:55;display:none;background:#dc2626;color:#fff;border-radius:999px;
  padding:.5rem .9rem;font-weight:900;font-size:.85rem;animation:nabiz 1.4s infinite}
@keyframes nabiz{50%{box-shadow:0 0 0 .6rem #dc262600}0%,100%{box-shadow:0 0 0 0 #dc2626aa}}
#intro{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1.2rem;
  background:radial-gradient(ellipse at center,#05081600 30%,#050816cc 100%);transition:opacity .9s}
#intro.bitti{opacity:0;pointer-events:none}
.isatir{position:absolute;top:36%;left:50%;transform:translate(-50%,-50%);width:min(90vw,44rem);font-size:1.7rem;font-weight:800;opacity:0;
  transition:opacity 1s,letter-spacing 2.4s;text-shadow:0 2px 24px #000;letter-spacing:.01em}
.isatir.acik{opacity:1;letter-spacing:.05em}
#ibaslik{opacity:0;transform:scale(.86);transition:opacity 1.2s,transform 1.6s cubic-bezier(.2,.8,.2,1);margin-top:-12vh}
#ibaslik.acik{opacity:1;transform:none}
#ibaslik .kucuk{font-size:1rem;letter-spacing:.5em;color:#c4b5fd;font-weight:800;margin-right:-.5em}
#ibaslik .buyuk{font-size:clamp(2.6rem,11vw,6.2rem);font-weight:900;line-height:1;margin:.35rem 0;letter-spacing:.03em;
  background:linear-gradient(90deg,#7dd3fc,#c4b5fd 35%,#fda4af 65%,#fde68a);-webkit-background-clip:text;background-clip:text;color:transparent;

function araAc(){modalAc("🔎 Dünya Ara",`<div class="araKutu"><input id="araIn" type="text" placeholder="Örn: satranç, robot, kitap…" autocomplete="off"><button id="araSil" data-a="araSil" aria-label="Temizle">✕</button></div><div class="liste" id="araSonuc"></div>`);
  const i=$("#araIn");i.addEventListener("input",araYaz);araYaz()}
const araN=s=>slug(String(s).replace(/['’`]/g,""));
function araYaz(){const i=$("#araIn"),ks=araN(i.value).split("-").filter(Boolean),bos=!i.value.trim();$("#araSil").style.display=i.value?"block":"none";
  const s=P.filter(p=>{if(bos)return true;if(!ks.length)return false;const m=araN(p.ad+" "+p.kat.ad+" "+p.ack+" "+p.kademe);return ks.every(k=>m.includes(k))});$("#araSonuc").innerHTML=s.length?s.map(satir).join(""):`<div class="not">Bu adla bir dünya bulunamadı. Başka bir kelime dene.</div>`}
function rutbe(n){const y=n/P.length;return y>=1?"🌟 Evren Kâşifi":y>=.6?"🚀 Galaksi Gezgini":y>=.3?"🛰️ Yıldız Yolcusu":n>0?"🔭 Gözlemci":"🌱 Yeni Yolcu"}
function pasaportAc(){const n=gezilen.size;modalAc("🛂 Keşif Pasaportu",`<div style="font-size:1.15rem;font-weight:900">${rutbe(n)}</div><div class="cubuk"><b style="width:${n/P.length*100}%"></b></div>
  <div class="not">${n} / ${P.length} dünya keşfedildi. Bir dünyaya dokunduğunda pasaportuna işlenir; kayıt yalnızca bu cihazda tutulur.</div>`+
  KAT.map(k=>{const g=k.uyeler.filter(u=>gezilen.has(u.slug)).length;return `<h3 style="color:${k.renk}">${k.ikon} ${esc(k.ad)} · ${g}/${k.uyeler.length} ${g===k.uyeler.length?"🏅":""}</h3><div class="liste">${k.uyeler.map(satir).join("")}</div>`}).join(""))}
const KARSILAMA={baslik:"🌌 Evrende Nasıl Gezilir?",ozet:"Buradaki her gezegen, Barış Öğretmen'in hazırladığı bir eğitim oyunu ya da uygulamasıdır.",adimlar:[
  ["👆","Parmağınla (ya da fareyle) sürükle: galaksi döner. İki parmakla ya da tekerlekle yaklaş-uzaklaş."],
  ["🪐","Bir gezegene dokun: ne olduğunu oku, <b>Bu Dünyaya Git</b> ile aç."],
  ["🎲","<b>Beni Şaşırt</b> seni hiç gitmediğin bir dünyaya ışınlar; <b>Evren Turu</b> kendi kendine gezdirir."],
  ["🛂","Gezdiğin her dünya <b>Pasaport</b>'una işlenir. Bir takımyıldızı tamamla, madalyayı al."],
  ["◀▶","Alttaki oklarla sıradaki dünyaya geç — boyu yetişmeyen kâşifler için her şey aşağıda."]]};
function karsilamaAc(){modalAc(KARSILAMA.baslik,`<div class="not" style="font-size:1rem;color:#dbe3ff">${KARSILAMA.ozet}</div>`+KARSILAMA.adimlar.map(a=>`<div class="adim"><b>${a[0]}</b><span>${a[1]}</span></div>`).join("")+
  `<div class="ksat" style="margin-top:.8rem"><button class="dg ana" data-a="modalKapat">Anladım, başlayalım 🚀</button></div>`);LS.yaz("zirve_evren_karsilama","1")}
window.ZIRVE_karsilamaAc=karsilamaAc;

/* ---------- QR ile paylaş ---------- */
const PAYLAS={url:""};
function qrAc(){const u=PAYLAS.url||location.href.split("#")[0];if(!/^https?:/.test(u)||/localhost|127\.0\.0\.1/.test(u)){modalAc("📲 QR ile Paylaş",`<div class="not" style="font-size:1rem">QR kod, sayfa internete yüklendikten sonra çalışır. Önce dosyayı GitHub Pages'e (sitene) yükle, sonra buradan QR üret.</div>`);return}
  modalAc("📲 QR ile Paylaş",`<div style="text-align:center"><div id="qrkutu"><div class="not" style="color:#333">QR hazırlanıyor…</div></div><div class="not" style="word-break:break-all">${esc(u)}</div>
  <div class="ksat" style="margin-top:.7rem"><button class="dg" data-a="qrKopya">🔗 Linki kopyala</button><button class="dg" data-a="qrIndir">⬇️ PNG indir</button></div></div>`);
  const ciz_=()=>{try{const q=window.qrcode(0,"M");q.addData(u);q.make();const n=q.getModuleCount(),b=8,k=4,c=document.createElement("canvas");c.width=c.height=(n+k*2)*b;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.fillStyle="#0b1030";
    for(let r=0;r<n;r++)for(let s=0;s<n;s++)if(q.isDark(r,s))x.fillRect((s+k)*b,(r+k)*b,b,b);PAYLAS.png=c.toDataURL("image/png");const kutu=$("#qrkutu");if(kutu)kutu.innerHTML=`<img alt="QR kod" src="${PAYLAS.png}">`}catch(e){qrHata()}};
  const qrHata=()=>{const kutu=$("#qrkutu");if(kutu)kutu.innerHTML=`<div class="not" style="color:#333;max-width:13rem">QR kütüphanesi yüklenemedi (internet yok olabilir). Linki kopyalayıp paylaşabilirsin.</div>`};
  if(window.qrcode)ciz_();else{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js";s.onload=ciz_;s.onerror=qrHata;document.head.appendChild(s)}}
window.ZIRVE_paylasAc=qrAc;

const MODULLER=[["3B galaksi çizimi",()=>typeof ciz==="function"],["Evren Turu",()=>typeof turBasla==="function"],["Beni Şaşırt",()=>typeof sasirt==="function"],["Keşif Pasaportu",()=>typeof pasaportAc==="function"],
  ["Arama",()=>typeof araAc==="function"],["QR ile Paylaş",()=>typeof qrAc==="function"],["Siteye Dön",()=>typeof siteyeDon==="function"],["Karşılama rehberi",()=>typeof karsilamaAc==="function"],
  ["Ekran modu + Çocuk boyu",()=>typeof ekranUygula==="function"],["Düz metin (ZIRVE.duzMetin)",()=>typeof window.ZIRVE.duzMetin==="function"],["Ana ekran simgesi (PWA)",()=>typeof initPWA==="function"],["Sürüm denetimi",()=>typeof surumKontrol==="function"],
  ["Veri bütünlüğü ("+DUNYA.length+" dünya)",()=>P.length===DUNYA.length&&new Set(P.map(p=>p.slug)).size===P.length&&P.every(p=>p.kat)]];
function seg(ad,secenek,simdi){return `<div class="seg">`+secenek.map(([d,e])=>`<button class="dg ${String(d)===String(simdi)?"acik":""}" data-a="${ad}:${d}">${e}</button>`).join("")+`</div>`}
function ayarAc(){const saglam=MODULLER.filter(m=>{try{return m[1]()}catch(e){return false}}).length;
  modalAc("⚙️ Ayarlar",`<h3>🧰 Araçlar</h3><div class="seg"><button class="dg" data-a="qr">📲 QR ile Paylaş</button><button class="dg" data-a="karsila">❓ Nasıl Gezilir?</button><button class="dg" data-a="introTekrar">🎞️ Açılışı Yeniden İzle</button></div>
  <h3>🔊 Ses</h3>${seg("ses",[[1,"Açık"],[0,"Kapalı"]],sesAcik?1:0)}
  <h3>✨ Hareket</h3>${seg("hareket",[[0,"Tam"],[1,"Az (eski cihazlar)"]],azHareket?1:0)}

  <h3>📦 Sürüm</h3><div class="not">v${APP.surum} · ${APP.tarih} · ${APP.satir} satır · ${APP.kb} KB (önceki: ${APP.onceki.surum})<br>🧪 ${saglam}/${MODULLER.length} modül sağlam<br>${MODULLER.map(m=>{let ok=false;try{ok=m[1]()}catch(e){}return (ok?"✅ ":"❌ ")+esc(m[0])}).join("<br>")}</div>
  <div class="seg" style="margin-top:.5rem"><button class="dg" data-a="guncelle">🔄 Güncellemeleri Denetle</button></div>`)}

/* ---------- sürüm denetimi (ETag) ---------- */
let surumDamga=null;
async function damgaAl(){if(!/^https?:$/.test(location.protocol))return null;try{const u=location.href.split("#")[0].split("?")[0]+"?_v="+Date.now();let r=await fetch(u,{method:"HEAD",cache:"no-store"});
  if(!r.ok)r=await fetch(u,{cache:"no-store"});return r.headers.get("etag")||r.headers.get("last-modified")}catch(e){return null}}
async function surumBaslat(){surumDamga=await damgaAl()}
async function surumKontrol(elle){const d=await damgaAl();if(d&&surumDamga&&d!==surumDamga){$("#yeniSurum").style.display="block";return}if(elle)toast(d?"✅ v"+APP.surum+" · en güncel sürüm":"Denetlenemedi (çevrim dışı ya da yerel dosya)")}
function surumYenile(){const q=new URLSearchParams(location.search);q.set("_r",Date.now());location.href=location.pathname+"?"+q}
let sonKontrol=0;function oto(){if(document.hidden||Date.now()-sonKontrol<15000)return;sonKontrol=Date.now();surumKontrol()}
addEventListener("focus",oto);document.addEventListener("visibilitychange",oto);setInterval(oto,120000);
addEventListener("online",()=>toast("🟢 İnternet bağlantısı geri geldi"));addEventListener("offline",()=>toast("🔴 İnternet bağlantısı kesildi · evren gezilmeye devam eder"));

/* ---------- düğmeler (tek dinleyici) ---------- */
const ISLER={
  basla:()=>introBitir(),onceki:()=>komsu(-1),sonraki:()=>komsu(1),takim:takimAc,sasirt,tur:()=>tur?turDur():turBasla(),ara:araAc,pasaport:pasaportAc,ayar:ayarAc,site:siteyeDon,
  modalKapat,kartKapat,genel:()=>{modalKapat();genel()},kat:i=>{modalKapat();katSec(KAT[+i])},git:n=>{modalKapat();sec(P[+n])},
  ac:()=>secili&&dunyaAc(secili),paylas:()=>secili&&paylas(secili),araSil:()=>{$("#araIn").value="";araYaz();$("#araIn").focus()},
  qr:qrAc,qrKopya:()=>kopyala(PAYLAS.url||location.href.split("#")[0],"🔗 Link kopyalandı"),qrIndir:()=>{if(!PAYLAS.png)return toast("QR henüz hazır değil");const a=document.createElement("a");a.href=PAYLAS.png;a.download="baris-ogretmen-evreni-qr.png";a.click()},
  karsila:karsilamaAc,introTekrar:()=>{modalKapat();introBasla(true)},ses:v=>{sesAyar(v==="1");ayarAc()},hareket:v=>{azHareket=v==="1";LS.yaz("evren_az",v);tozKur(azHareket);ayarAc()},
  mod:m=>{window.ZIRVE_ekranMod.ayarla(m);ayarAc()},cocuk:v=>{LS.yaz("zirve_cocuk_boyu",v);ekranUygula();ayarAc()},yukle:pwaYukle,guncelle:()=>surumKontrol(true),yenile:surumYenile,
  sifirla:()=>{const d=$("#sifirDg");if(d.dataset.emin){gezilen.clear();LS.sil("evren_gezilen");sayacYaz();genel();toast("Pasaport sıfırlandı");ayarAc()}else{d.dataset.emin="1";d.textContent="Emin misin? Tekrar dokun";d.classList.add("acik")}}
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b){if(e.target.id==="perde")modalKapat();return}const [ad,arg]=b.dataset.a.split(":");sesBaslat();if(ISLER[ad])ISLER[ad](arg)});

/* ---------- açılış ---------- */
let introZ=[];
function introBasla(tam){clearTimeout(sasirtZ);turDur();introZ.forEach(clearTimeout);introZ=[];basladi=false;const I=$("#intro");I.classList.remove("bitti");$("#ust").style.opacity=0;$("#alt").style.visibility="hidden";$("#kart").classList.remove("acik");
  secili=null;aktifKat=null;form=0;cam.dist=560;cam.g={tx:0,ty:0,tz:0,dist:215};cam.pitch=.95;$("#ibaslik").classList.remove("acik");$("#ibasla").classList.remove("acik");
  $("#ialtyazi").textContent=`${P.length} dünya · ${KAT.length} takımyıldız · tek gökyüzü`;const s=[...document.querySelectorAll(".isatir")];s.forEach(x=>x.classList.remove("acik"));
  if(tam){formHiz=.105;s.forEach((x,i)=>{introZ.push(setTimeout(()=>x.classList.add("acik"),500+i*2600));introZ.push(setTimeout(()=>x.classList.remove("acik"),2700+i*2600))});
    introZ.push(setTimeout(()=>$("#ibaslik").classList.add("acik"),8600));introZ.push(setTimeout(()=>$("#ibasla").classList.add("acik"),9700))}
  else{formHiz=.45;introZ.push(setTimeout(()=>$("#ibaslik").classList.add("acik"),300));introZ.push(setTimeout(()=>$("#ibasla").classList.add("acik"),1200))}}
function hashDunya(){let h="";try{h=decodeURIComponent(location.hash.slice(1)).toLocaleLowerCase("tr")}catch(e){}return h?(P.find(x=>x.slug===h)||(h===gunes.slug?gunes:null)):null}
addEventListener("hashchange",()=>{if(!basladi)return;const p=hashDunya();if(p&&p!==secili){modalKapat();sec(p)}});
function introBitir(){if(basladi)return;introZ.forEach(clearTimeout);basladi=true;$("#intro").classList.add("bitti");$("#ust").style.opacity=1;$("#alt").style.visibility="visible";form=Math.max(form,.75);formHiz=.6;
  sesBaslat();bip(660,.25,"triangle");boyut();LS.yaz("evren_intro","1");
  const p=hashDunya(),ilk=!p&&LS.al("zirve_evren_karsilama","0")!=="1";if(p)setTimeout(()=>sec(p),500);else{if(location.hash.length>1)hashYaz("");if(ilk)setTimeout(karsilamaAc,1400)}
  if(!ilk)setTimeout(()=>toast(`✅ v${APP.surum} · ${APP.satir} satır · 🧪 ${MODULLER.filter(m=>{try{return m[1]()}catch(e){return false}}).length}/${MODULLER.length} modül sağlam`,3200),p?2600:400)}

tozKur(azHareket);ekranUygula();sayacYaz();initPWA();surumBaslat();linkleriDenetle();
addEventListener("resize",ekranUygula);addEventListener("orientationchange",()=>setTimeout(ekranUygula,250));
requestAnimationFrame(dongu);
if(hashDunya()){introBasla(false);form=.9;introBitir()}else introBasla(LS.al("evren_intro","0")!=="1");
</script>
