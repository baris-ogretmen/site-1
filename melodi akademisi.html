<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<title>Melodi Akademisi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Noto+Music&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1f1d1a;--mute:#77716a;--line:#e7e1d6;--acc:#d7263d;--acc2:#2b59c3;--gold:#f5b301;--ok:#22a06b;--bad:#e5484d;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100vh;padding-bottom:40px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font:inherit}
.hidden{display:none!important}
/* üst bar */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(244,241,234,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px;letter-spacing:-.2px;cursor:pointer}
.logo i{font-style:normal;display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#d7263d,#f5853f);color:#fff;font-size:18px;box-shadow:0 6px 14px -6px #d7263d}
.sp{flex:1}
.uchip{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;max-width:52vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.uchip b{color:#b07a00}
.ibtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:#fff;border:1px solid var(--line)}
.ibtn.soluk{opacity:.55}
main{max-width:1100px;margin:0 auto;padding:16px}
h1,h2,h3{margin:0;letter-spacing:-.3px}
.bar{display:flex;align-items:center;gap:10px;margin:4px 0 14px;flex-wrap:wrap}
.bar h2{font-size:22px;font-weight:900}
.back{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 10px 30px -22px rgba(0,0,0,.35)}
.muted{color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:14px;font-weight:800;background:#fff;border:1px solid var(--line);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.red{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.act{background:#fff3d6;border-color:#f0c35a}
.btn.big{padding:15px 22px;font-size:18px;border-radius:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:800;font-size:14px;white-space:nowrap}
.chip.act{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip[disabled]{opacity:.4}
/* giriş */
.giris{max-width:520px;margin:4vh auto}
.giris h1{font-size:30px;font-weight:900;text-align:center}
.giris .hero{font-size:56px;text-align:center;margin-bottom:6px}
.inp{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:18px;font-weight:700;outline:none}
.inp:focus{border-color:var(--ink)}
.sgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sgrid button{padding:12px 4px;border-radius:12px;background:#fff;border:1.5px solid var(--line);font-weight:800;font-size:14px}
.sgrid button.act{background:var(--ink);color:#fff;border-color:var(--ink)}
.sgrid button.wide{grid-column:span 2}
/* ana */
.hello{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.hello h1{font-size:26px;font-weight:900}
.lvl{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.akt{text-align:left;background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px -24px rgba(0,0,0,.4);transition:transform .12s}
.akt:active{transform:scale(.98)}
.akt .em{flex:none;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:var(--t)}
.akt b{display:block;font-size:17px;font-weight:900}
.akt small{color:var(--mute);font-weight:700;font-size:13px;line-height:1.3;display:block;margin-top:2px}
/* sahne genel */
.stagehost{margin-top:12px}
.stage{user-select:none;-webkit-user-select:none;touch-action:none}
.hscroll{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;touch-action:pan-x}
.lab{font-weight:900;font-size:12px;line-height:1;pointer-events:none;white-space:nowrap}
.kl{font-size:10px;color:#999;font-weight:800;pointer-events:none}
.lab-renk .lab{background:var(--kc);color:var(--kt,#fff);border-radius:999px;padding:3px 6px}
.lab-yok .lab{display:none}
@keyframes nabiz{0%,100%{box-shadow:0 0 0 3px var(--kc),0 0 14px var(--kc)}50%{box-shadow:0 0 0 6px var(--kc),0 0 30px var(--kc)}}
/* piyano */
.piano{background:linear-gradient(#2b2a2f,#121214);border-radius:18px;padding:12px 12px 14px;box-shadow:0 22px 44px -22px rgba(0,0,0,.6)}
.pbrand{color:#cfae6d;font:700 11px/1 Georgia,serif;letter-spacing:.35em;text-align:center;margin:2px 0 10px}
.felt{height:6px;background:#8b1424;border-radius:3px 3px 0 0;min-width:calc(var(--nw,18)*34px)}
.kb{position:relative;height:clamp(150px,28vw,230px);display:flex;min-width:calc(var(--nw)*34px)}
.kb .w{flex:1;position:relative;background:linear-gradient(#fff,#f4f4f4 80%,#dcdcdc);border:1px solid #b9b9b9;border-top:none;border-radius:0 0 7px 7px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;padding-bottom:10px;transition:background .06s}
.kb .b{position:absolute;top:0;height:62%;background:linear-gradient(#3a3a3a,#050505);border-radius:0 0 5px 5px;z-index:2;box-shadow:inset 0 -6px 0 #222,0 4px 6px rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
.kb .b .lab{font-size:9px;background:#555!important;color:#fff!important}
.kb .w.on{background:linear-gradient(color-mix(in srgb,var(--kc) 45%,#fff),color-mix(in srgb,var(--kc) 30%,#fff));transform:translateY(1px)}
.kb .b.on{background:linear-gradient(color-mix(in srgb,var(--kc) 60%,#000),#111);box-shadow:inset 0 -2px 0 #222}
.kb .hint{animation:nabiz .9s infinite;z-index:3}
/* akordeon */
.acc{max-width:640px;margin:0 auto}
.marble{background:radial-gradient(ellipse 30% 20% at 18% 30%,rgba(255,140,155,.75),transparent 70%),radial-gradient(ellipse 25% 35% at 72% 62%,rgba(255,170,180,.6),transparent 70%),radial-gradient(ellipse 35% 25% at 45% 85%,rgba(110,0,18,.8),transparent 70%),radial-gradient(ellipse 20% 30% at 88% 20%,rgba(120,0,20,.7),transparent 70%),radial-gradient(ellipse 22% 16% at 35% 55%,rgba(255,205,210,.45),transparent 70%),linear-gradient(135deg,#c8102e,#9e0b22 45%,#d81f3a)}
.acc-top{border-radius:16px 16px 6px 6px;padding:12px 12px 10px;box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 6px 16px -8px rgba(0,0,0,.5);border:2px solid #7d0a1b}
.acc-top .kb{height:clamp(120px,22vw,170px)}
.acc-top .hscroll{border-radius:6px;background:#111;padding:3px}
.acc-bellows{padding:0 10px;transform-origin:top;transition:transform .2s}
.fold{height:15px;background:linear-gradient(#fdfdfd,#e2e2e2 60%,#c7c7c7);border-left:10px solid #9a9a9a;border-right:10px solid #9a9a9a;position:relative}
.fold:nth-child(even){background:linear-gradient(#d0d0d0,#f1f1f1 50%,#d0d0d0)}
.fold::before,.fold::after{content:"";position:absolute;top:2px;width:8px;height:8px;background:linear-gradient(135deg,#eee,#888);transform:rotate(45deg)}
.fold::before{left:-9px}.fold::after{right:-9px}
.acc.nefes .acc-bellows{animation:korul .8s ease-in-out infinite}
@keyframes korul{50%{transform:scaleY(1.18)}}
.acc-bot{border-radius:6px 6px 22px 22px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid #7d0a1b}
.grille{background:linear-gradient(#efece6,#c4beb2);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:repeat(6,auto);gap:8px;box-shadow:inset 0 2px 4px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.5)}
.bass{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ddd8cf 55%,#a49e93);border:1px solid #847e72;font-size:11px;font-weight:900;color:#333;box-shadow:0 3px 0 #7b766c}
.bass.on{transform:translateY(2px);box-shadow:0 1px 0 #7b766c;background:radial-gradient(circle at 35% 30%,#fff,#ffd27a 60%,#c9952a)}
.acc-cap{color:#ffe1e5;font-size:12px;font-weight:800}
.strap{width:44%;height:34px;margin:-4px auto 0;border:9px solid #2f2f33;border-top:none;border-radius:0 0 90px 90px}
/* ksilofon */
.xylo{background:linear-gradient(#f9f2e6,#efe2c9);border-radius:20px;padding:16px 12px;box-shadow:0 18px 40px -26px rgba(80,50,10,.6);border:1px solid #e1cfaa}
.xbars{display:flex;gap:6px;align-items:center;height:clamp(190px,34vw,280px);min-width:640px;position:relative;padding:0 6px}
.xbars::before,.xbars::after{content:"";position:absolute;left:0;right:0;height:12px;background:linear-gradient(#8a5a2b,#5e3a16);border-radius:6px;z-index:0}
.xbars::before{top:24%}.xbars::after{bottom:24%}
.xbar{flex:1;height:var(--hh);border-radius:9px;background:linear-gradient(90deg,color-mix(in srgb,var(--kc) 75%,#000),var(--kc) 30%,color-mix(in srgb,var(--kc) 65%,#fff) 55%,var(--kc) 75%,color-mix(in srgb,var(--kc) 75%,#000));position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;box-shadow:0 4px 8px rgba(0,0,0,.25);transition:transform .06s}
.xbar::before,.xbar::after{content:"";position:absolute;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:radial-gradient(#fff,#999);top:12%}
.xbar::after{top:auto;bottom:22%}
.xbar .lab{background:rgba(255,255,255,.92)!important;color:#222!important;border-radius:999px;padding:3px 5px}
.lab-yok .xbar .lab{display:none}
.xbar.on{transform:translateY(3px) scale(.98);filter:brightness(1.2)}
.xbar.hint{animation:nabiz .9s infinite}
/* flüt */
.flute{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px}
.rec{position:relative;width:58px;height:340px;border-radius:24px 24px 14px 14px;background:linear-gradient(90deg,#d6bb8a,#fbf0d6 35%,#f6e5c2 60%,#c9a86f);box-shadow:0 14px 30px -16px rgba(80,50,10,.7);display:flex;flex-direction:column;align-items:center;padding-top:74px;gap:11px}
.rhead{position:absolute;top:0;left:0;right:0;height:62px;border-radius:24px 24px 6px 6px;background:linear-gradient(90deg,#3b2a1a,#6b4b2a 40%,#3b2a1a);border-bottom:3px solid #2a1d10}
.win{position:absolute;bottom:10px;left:50%;width:18px;height:9px;margin-left:-9px;background:#111;border-radius:2px 2px 6px 6px}
.hole{width:20px;height:20px;border-radius:50%;border:2.5px solid #6b5432;background:#fffdf7;transition:background .08s}
.hole.k{background:#2b1c0c}
.hole.y{background:linear-gradient(90deg,#2b1c0c 50%,#fffdf7 50%)}
.hole.thumb{position:absolute;left:-30px;top:78px;border-style:dashed}
.hole.thumb::after{content:"B";position:absolute;left:-14px;top:1px;font-size:11px;font-weight:900;color:#6b5432}
.hole:nth-child(6){margin-top:10px}
.rbell{position:absolute;bottom:-6px;width:70px;height:16px;border-radius:0 0 30px 30px;background:linear-gradient(90deg,#3b2a1a,#6b4b2a,#3b2a1a)}
.fnotes{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;flex:1;min-width:240px;max-width:560px}
.fn{height:64px;border-radius:16px;background:color-mix(in srgb,var(--kc) 16%,#fff);border:2px solid color-mix(in srgb,var(--kc) 55%,#fff);display:grid;place-items:center}
.fn.on{background:var(--kc);transform:scale(.96)}
.fn.hint{animation:nabiz .9s infinite}
.fcap{grid-column:1/-1;font-size:12px;color:var(--mute);font-weight:700}
/* bağlama */
.bag{position:relative;height:230px;min-width:820px;margin:6px 0}
.bhead{position:absolute;left:0;top:78px;width:70px;height:74px;background:linear-gradient(#6d4421,#3e230d);border-radius:10px 4px 4px 10px;display:grid;grid-template-columns:1fr 1fr 1fr;align-content:space-between;padding:4px 6px}
.bhead i{width:12px;height:12px;border-radius:50%;background:radial-gradient(#f3d8a8,#a57a3e);justify-self:center}
.bneck{position:absolute;left:68px;right:250px;top:90px;height:52px;background:linear-gradient(#5a3a1c,#7a5128 30%,#4a2c12);border-radius:3px;display:flex;box-shadow:0 6px 12px -6px rgba(0,0,0,.6);z-index:2}
.fret{border-right:3px solid #d9c9a5;display:flex;align-items:center;justify-content:center;position:relative}
.fret.on{background:color-mix(in srgb,var(--kc) 55%,transparent)}
.fret.hint{animation:nabiz .9s infinite;z-index:3}
.bbody{position:absolute;right:0;top:20px;width:270px;height:190px;border-radius:52% 48% 48% 52%/50%;background:repeating-linear-gradient(90deg,#8a5528 0 22px,#b07338 22px 24px,#7a4a22 24px 46px,#c2843f 46px 48px);box-shadow:inset -20px -10px 40px rgba(0,0,0,.35),0 16px 30px -18px rgba(0,0,0,.7)}
.bbody::before{content:"";position:absolute;inset:16px 34px 16px 22px;border-radius:50%;background:linear-gradient(135deg,#e8c48f,#c8964f);box-shadow:inset 0 0 0 3px #6b3f17}
.bhole{position:absolute;left:44%;top:40%;width:34px;height:34px;border-radius:50%;background:#2a1607;box-shadow:0 0 0 4px #6b3f17;z-index:1}
.bstr{position:absolute;left:58px;right:40px;height:1.5px;background:linear-gradient(90deg,#ddd,#fff,#bbb);z-index:4;pointer-events:none}
.bag.on .bstr{animation:titre .12s linear 3}
@keyframes titre{50%{transform:translateY(1px)}}
.bbridge{position:absolute;right:58px;top:96px;width:8px;height:40px;background:#f1e2c0;z-index:3;border-radius:2px}
/* keman */
.vio{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px}
.vfb{flex:1;background:linear-gradient(#232323,#0d0d0d);border-radius:12px 40px 40px 12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.vrow{position:relative;display:grid;grid-template-columns:62px repeat(5,1fr);align-items:center;gap:6px;min-height:58px}
.vstr{position:absolute;left:62px;right:0;top:50%;height:2px;background:linear-gradient(90deg,#c9c9c9,#fff,#a8a8a8);pointer-events:none}
.vname{color:#e8d7b0;font-size:12px;font-weight:900}
.vdot{position:relative;z-index:1;height:52px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12)}
.vdot small{color:#bbb;font-size:9px;font-weight:800}
.vdot.on{background:color-mix(in srgb,var(--kc) 60%,#000)}
.vdot.hint{animation:nabiz .9s infinite}
.vbody{position:relative;width:150px;height:240px;flex:none}
.vbody::before{content:"";position:absolute;inset:0 18px 120px;border-radius:50% 50% 40% 40%;background:radial-gradient(circle at 40% 35%,#e08a3c,#a6461b 70%,#6d260b)}
.vbody::after{content:"";position:absolute;inset:100px 6px 0;border-radius:45% 45% 50% 50%;background:radial-gradient(circle at 40% 35%,#e08a3c,#a6461b 70%,#6d260b)}
.vf{position:absolute;top:96px;width:6px;height:60px;border-radius:6px;background:#2a1205;z-index:2}
.vf.l{left:48px;transform:rotate(-8deg)}.vf.r{right:48px;transform:rotate(8deg)}
.vbridge{position:absolute;left:52px;right:52px;top:140px;height:10px;background:#f2e2c0;border-radius:4px;z-index:2}
.bow{position:absolute;left:-30px;right:-30px;top:120px;height:6px;background:linear-gradient(#5c3412,#2b1406);border-radius:4px;z-index:3;transform:rotate(-6deg);transition:transform .4s}
.vio.on .bow{animation:yay .7s ease-in-out infinite alternate}
@keyframes yay{to{transform:rotate(-6deg) translateX(34px)}}
@media(max-width:640px){.vbody{display:none}.vrow{grid-template-columns:46px repeat(5,1fr)}.vstr{left:46px}}
/* kalimba */
.kal{max-width:560px;margin:0 auto;background:radial-gradient(circle at 50% 120%,#a86a35,transparent 60%),linear-gradient(#e7b77e,#c88a4d);border-radius:26px 26px 60px 60px;padding:14px 14px 80px;position:relative;box-shadow:0 20px 40px -24px rgba(80,40,10,.8)}
.kbridge{height:14px;background:linear-gradient(#ddd,#888);border-radius:6px;margin:16px 6px 0}
.tines{display:flex;gap:4px;align-items:flex-start;height:230px;padding:0 6px}
.tine{flex:1;height:var(--L);background:linear-gradient(90deg,#8e959b,#f4f6f7 45%,#9aa1a7);border-radius:0 0 10px 10px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;transition:transform .06s}
.tine .lab{font-size:9px;padding:2px 3px}
.tine.on{transform:translateY(3px);filter:brightness(1.15)}
.tine.hint{animation:nabiz .9s infinite}
.khole{position:absolute;left:50%;bottom:20px;width:44px;height:44px;margin-left:-22px;border-radius:50%;background:#3b200a;box-shadow:inset 0 4px 8px #000}
/* darbuka */
.darb{display:flex;flex-direction:column;align-items:center;gap:12px}
.dhead{position:relative;width:min(84vw,330px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#f5efe2 0 60%,#e7dcc6 61% 66%,#c9c2b2 67% 70%,#8a8a8f 71% 76%,#d9d9de 77% 80%,#6e6e74 81%);box-shadow:0 20px 40px -20px rgba(0,0,0,.6);display:grid;place-items:center}
.dhead.on{filter:brightness(1.08)}
.dcenter{width:52%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fffaf0,#efe4cd);border:2px dashed #cdbf9f;display:grid;place-items:center;font-size:22px;color:#7a6a4a}
.dcenter.on{background:radial-gradient(circle,#ffe2a8,#f2c46b);transform:scale(.97)}
.tlabel{position:absolute;top:9%;font-weight:900;color:#7a6a4a;font-size:16px;pointer-events:none}
.kapad{padding:14px 34px;border-radius:999px;background:linear-gradient(#e9e9ee,#b9b9c2);font-weight:900;font-size:18px;box-shadow:0 4px 0 #8f8f97}
.kapad.on{transform:translateY(3px);box-shadow:0 1px 0 #8f8f97}
.pcap{font-size:13px;color:var(--mute);font-weight:700;text-align:center}
.hit{animation:nabiz .5s 1}
/* bateri */
.kit{position:relative;width:100%;max-width:680px;margin:0 auto;aspect-ratio:16/11;background:radial-gradient(ellipse at 50% 70%,#3a3f4a,#1c1f26);border-radius:24px}
.drum{position:absolute;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;font-weight:900;font-size:12px;color:#333;background:radial-gradient(circle,#fbfbf7 0 62%,#ddd 63% 66%,#c62828 67% 100%);box-shadow:0 10px 18px -8px #000;transition:transform .05s}
.drum span{pointer-events:none;padding:2px}
.d-crash,.d-ride,.d-hihat{background:radial-gradient(circle,#fff6d0 0 6%,#d8a93a 7% 20%,#f0cc6a 21% 40%,#c99a2e 41% 60%,#e9c25d 61% 100%);color:#3a2a00}
.d-kick{background:radial-gradient(circle,#fbfbf7 0 55%,#ccc 56% 58%,#1f3c88 59% 100%)}
.drum.on{transform:scale(.94);filter:brightness(1.2)}
/* şarkı şeridi */
.strip{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;max-height:170px;overflow:auto}
.nb{min-width:40px;height:40px;padding:0 8px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:14px;background:color-mix(in srgb,var(--kc) 18%,#fff);border:2px solid color-mix(in srgb,var(--kc) 50%,#fff);transition:transform .1s}
.nb.rest{background:#f2f2f2;border-color:#e6e6e6;color:#aaa;min-width:22px}
.nb.ok{opacity:.45}
.nb.cur{transform:scale(1.18);background:var(--kc);color:var(--kt,#fff);box-shadow:0 6px 14px -6px var(--kc)}
.nb.salla{animation:salla .35s}
@keyframes salla{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.strip.gizli .nb:not(.ok):not(.cur){color:transparent}
.phb{width:100%;height:0}
.tip{background:#fff7e0;border:1px solid #f2dc9b;border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px;margin-bottom:10px}
.durum{font-weight:900;font-size:18px;text-align:center;min-height:28px;margin:10px 0}
.tempo{display:flex;align-items:center;gap:8px;font-weight:800}
.tempo input{flex:1;accent-color:var(--ink)}
.slist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.scard{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px}
.scard .em{font-size:30px;width:50px;height:50px;border-radius:14px;display:grid;place-items:center;background:#f6f1e7;flex:none}
.scard b{display:block;font-size:16px}
.scard small{color:var(--mute);font-weight:700}
.stars{color:var(--gold);letter-spacing:1px;font-size:14px}
.badge{display:inline-block;font-size:11px;font-weight:900;padding:2px 8px;border-radius:999px;background:#eef3ff;color:#2b59c3;margin-left:4px}
.badge.my{background:#e7f8ef;color:#137a4b}
/* hafıza */
.info3{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.info3 div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 14px;font-weight:900}
/* ritim */
.tl{position:relative;height:84px;background:#fff;border:1px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden}
.tl .beat{position:absolute;top:0;bottom:0;width:1px;background:#eee}
.tl .beat.g{background:#d6d0c4}
.tl .ex,.tl .us{position:absolute;width:18px;height:18px;margin-left:-9px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:900;color:#fff}
.tl .ex{top:12px}.tl .us{top:50px;opacity:.85}
.tl .cur{position:absolute;top:0;bottom:0;width:3px;background:var(--acc);left:0}
.tl .lbl{position:absolute;left:6px;font-size:10px;font-weight:900;color:#aaa}
/* kulak */
.qcard{max-width:640px;margin:0 auto;text-align:center}
.qcard h3{font-size:22px;font-weight:900;margin:8px 0 14px}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.qopts button{padding:16px 10px;border-radius:16px;background:#fff;border:2px solid var(--line);font-weight:900;font-size:17px}
.qopts button.dog{background:#e7f8ef;border-color:var(--ok)}
.qopts button.yan{background:#fdecec;border-color:var(--bad)}
.prog{height:8px;background:#ece6da;border-radius:99px;overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#f5853f,#d7263d);transition:width .3s}
/* nota okuma */
.porte{display:flex;justify-content:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:8px}
.porte svg{width:min(100%,380px);height:auto}
.renkhedef{width:150px;height:150px;border-radius:50%;margin:6px auto;display:grid;place-items:center;font-size:34px;font-weight:900;color:#fff;box-shadow:0 14px 30px -12px var(--kc);background:var(--kc)}
/* beste */
.grid16{display:grid;grid-template-columns:54px repeat(16,minmax(26px,1fr));gap:4px;min-width:600px}
.grid16 .rl{font-weight:900;font-size:12px;display:grid;place-items:center;border-radius:8px;color:#fff;background:var(--kc)}
.cell{aspect-ratio:1;border-radius:8px;background:#f1ece2;border:1px solid #e4dccd}
.cell:nth-child(17n+6),.cell:nth-child(17n+10),.cell:nth-child(17n+14){}
.cell.on{background:var(--kc);border-color:transparent;box-shadow:0 3px 8px -3px var(--kc)}
.cell.col{outline:2px solid var(--ink)}
.cell.q4{margin-left:6px}
/* müze */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.mcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;text-align:center}
.mcard .em{font-size:40px}
.mcard b{display:block;margin-top:4px}
.mcard small{color:var(--mute);font-weight:700}
.tr{font-size:11px;font-weight:900;color:#c62828}
/* rozet */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.rz{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;text-align:center}
.rz .em{font-size:38px}
.rz.kilit{opacity:.4;filter:grayscale(1)}
/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(20,18,15,.45);display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.mbox{background:#fff;border-radius:22px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:20px;box-shadow:0 30px 70px -20px rgba(0,0,0,.5);position:relative}
.mbox h2{font-size:22px;font-weight:900;margin-bottom:10px}
.mx{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;background:#f3f0ea;font-size:18px}
.steps{display:grid;gap:8px;margin:12px 0}
.steps div{display:flex;gap:10px;align-items:center;background:#faf7f1;border-radius:14px;padding:10px 12px;font-weight:800}
.steps i{font-style:normal;font-size:24px}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #f0ebe2;font-weight:800}
.set:last-child{border-bottom:none}
.sw{width:50px;height:30px;border-radius:99px;background:#ddd;position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.sw.on{background:var(--ok)}.sw.on::after{left:23px}
.sec{font-size:13px;font-weight:900;color:var(--mute);margin:14px 0 2px;text-transform:uppercase;letter-spacing:.06em}
/* büyük ekran */
.buyuk{position:fixed;inset:0;z-index:70;background:radial-gradient(circle at 50% 30%,#2c2f45,#14151f);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:20px}
.buyuk .btn{color:var(--ink)}
.buyuk h1{font-size:clamp(26px,5vw,56px);font-weight:900}
.bph{display:flex;gap:clamp(6px,1.4vw,18px);flex-wrap:wrap;justify-content:center;position:relative;padding-top:60px}
.bph .nb{min-width:clamp(54px,8vw,120px);height:clamp(54px,8vw,120px);font-size:clamp(18px,3vw,40px);border-radius:24px}
.top-ball{position:absolute;top:0;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffcf3f 60%,#e09400);transition:left .18s ease-out;animation:zipla .4s ease-in-out infinite alternate}
@keyframes zipla{to{transform:translateY(22px)}}
/* dock, toast, konfeti */
#dock{position:fixed;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:40;display:flex;flex-direction:column;gap:8px}
#dock .db{position:relative;width:46px;height:46px;border-radius:14px;background:#fff;border:1px solid var(--line);box-shadow:0 8px 20px -10px rgba(0,0,0,.4);font-size:20px;opacity:.75}
#dock .db em{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#555;color:#fff;font-size:11px;font-style:normal;display:grid;place-items:center}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;z-index:90;background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:800;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#konfeti{position:fixed;inset:0;pointer-events:none;z-index:95}
.surum{position:sticky;top:58px;z-index:29;background:#2b59c3;color:#fff;text-align:center;padding:8px;font-weight:800;cursor:pointer}
table.ot{width:100%;border-collapse:collapse;font-size:14px}
table.ot th,table.ot td{text-align:left;padding:8px 6px;border-bottom:1px solid #eee}
table.ot tr{cursor:pointer}
.tablewrap{overflow-x:auto}
textarea.inp{font-size:13px;min-height:110px}
@media(max-width:520px){.sgrid{grid-template-columns:repeat(3,1fr)}.sgrid button.wide{grid-column:span 3}.bar h2{font-size:19px}.hello h1{font-size:22px}}
@media print{html{zoom:1!important}}

EKRAN.sarki = (app, { id }) => {
  const s = SARKILAR.find(x => x.id === id) || SARKILAR[0], N = s.notlar, g = grup();
  let inst = sonEnst(MELODIK); if (s.diyez && !INST[inst].notlar.some(isB)) inst = 'piyano';
  let tempo = g === 0 ? 0.8 : 1, st;
  const S = { mod: null, idx: 0, hata: 0, ard: 0, dinliyor: false };
  app.appendChild(h(`<div>${ustBar(`${s.emo} ${esc(s.ad)}`, 'sarkilar', '← Şarkılar')}
    <div class="chips" id="ch"></div>
    <div class="strip" id="strip"></div>
    <div class="row" style="margin-top:10px" id="modlar">
      <button class="btn" data-mod="dinle">👂 Dinle</button><button class="btn" data-mod="birlikte">🎯 Birlikte Çal</button>
      <button class="btn" data-mod="cumle">🔁 Cümle Cümle</button><button class="btn" data-mod="ezber">🧠 Ezberden</button>
      <button class="btn" data-mod="buyuk">🎤 Hep Birlikte Söyle</button><button class="btn" data-mod="dur">⏹</button></div>
    <div class="durum" id="du">Önce 👂 Dinle, sonra 🎯 Birlikte Çal!</div>
    <div class="tempo"><span>🐢</span><input type="range" id="tmp" min="0.5" max="1.4" step="0.05" value="${tempo}"><span>🐇</span></div>
    <div class="stagehost" id="sh"></div>
    <p class="muted" style="font-size:12px;font-weight:700;text-align:center">${esc(s.kaynak)} · ${s.cumle} cümle · ${N.filter(n => n.m != null).length} nota</p></div>`));
  const strip = $('#strip'); let son = -1;
  strip.innerHTML = N.map((n, i) => (i > 0 && n.ph !== N[i - 1].ph ? '<span class="phb"></span>' : '') + (n.m == null ? `<span class="nb rest" data-i="${i}">·</span>` : `<span class="nb" data-i="${i}" style="--kc:${RENK[pc(n.m)]};--kt:${yaziRengi(n.m)}">${adi(n.m) || '●'}</span>`)).join('');
  const nbs = $$('.nb', strip);
  const cur = i => { nbs.forEach((b, j) => { b.classList.toggle('cur', j === i); b.classList.toggle('ok', j < i); }); const b = nbs[i]; if (b) strip.scrollTop = b.offsetTop - strip.offsetTop - 50; son = i; };
  const du = t => { $('#du').textContent = t; };
  const kur = () => { durdurHepsi(); S.mod = null; st = sahne($('#sh'), inst); LS.set('mu_sonEnst', inst); st.onNote = notaGeldi; };
  enstChips($('#ch'), MELODIK, inst, k => { if (s.diyez && !INST[k].notlar.some(isB)) { toast('♯ Bu şarkıda diyez notalar var — Piyano, Akordeon’da çalınır.'); return false; } inst = k; kur(); });
  kur();
  $('#tmp').oninput = e => { tempo = +e.target.value; };
  const bpm = () => s.bpm * tempo;
  const ilerle = () => {
    while (S.idx < N.length && N[S.idx].m == null) S.idx++;
    if (S.idx >= N.length) return bitir();
    cur(S.idx);
    st.ipucu(S.mod === 'birlikte' || S.ard >= 2 ? N[S.idx].m : null);
  };
  const cumleAralik = p => { let a = N.findIndex(n => n.ph === p), b = a; while (b < N.length && N[b].ph === p) b++; return [a, b]; };
  const cumleBasla = p => {
    S.ph = p; const [a, b] = cumleAralik(p); S.dinliyor = true; st.ipucu(null); du(`👂 ${p + 1}. cümleyi dinle…`);
    oynat(st, N, bpm(), { bas: a, son: b, onAdim: cur, bitti: () => { S.dinliyor = false; S.idx = a; S.ard = 0; du(`🎯 Şimdi sen tekrar et! (${p + 1}/${s.cumle})`); ilerle(); } });
  };
  function notaGeldi(m) {
    if (!S.mod || S.mod === 'dinle' || S.dinliyor || S.idx >= N.length) return;
    const e = N[S.idx];
    if (eslesir(st, m, e.m, AYAR.oktav || g <= 1)) {
      S.ard = 0; S.idx++;
      if (S.mod === 'cumle' && (S.idx >= N.length || N[S.idx].ph !== e.ph)) {
        st.ipucu(null); cur(S.idx);
        if (e.ph + 1 < s.cumle) { du('✅ Süper! Sıradaki cümle geliyor…'); zaman(() => cumleBasla(e.ph + 1), 900); } else bitir();

      }

    } else {

      if (S.ard >= 2) { st.ipucu(e.m); du('💡 Parlayan tuşa bas!'); } else du('Tekrar dene 🙂');
    }
  }
  function bitir() {
    const mod = S.mod; S.mod = null; st.ipucu(null); cur(N.length); strip.classList.remove('gizli');
    const y = S.hata <= 1 ? 3 : S.hata <= 4 ? 2 : 1;
    const xp = y * 5 + (mod === 'ezber' ? 10 : mod === 'cumle' ? 5 : 0);
    const p = prof(); p.stars[s.id] = Math.max(p.stars[s.id] || 0, y); profKaydet(true);
    const modAd = { birlikte: 'Birlikte Çal', cumle: 'Cümle Cümle', ezber: 'Ezberden' }[mod] || '';
    kayit('sarki', `${s.ad} — ${modAd} — ${y}★ (${S.hata} hata)`, xp);
    du('🎉 Şarkı bitti!');
    const idx = SARKILAR.indexOf(s), sonraki = SARKILAR[idx + 1];
    sonucGoster({ baslik: y === 3 ? 'Mükemmel çaldın!' : y === 2 ? 'Çok güzel!' : 'Bitirdin, aferin!', yildiz: y, metin: `${modAd} · ${S.hata} hata`, xp, tekrar: () => basla(mod), sonraki: sonraki ? () => git('sarki', { id: sonraki.id }) : null });
  }
  function basla(mod) {
    durdurHepsi(); sesBaslat(); strip.classList.toggle('gizli', mod === 'ezber');
    Object.assign(S, { mod, idx: 0, hata: 0, ard: 0, dinliyor: false });
    $$('#modlar .btn').forEach(b => b.classList.toggle('act', b.dataset.mod === mod));
    if (mod === 'dinle') { S.mod = 'dinle'; st.ipucu(null); du('👂 Dinle ve tuşları izle…'); oynat(st, N, bpm(), { onAdim: cur, bitti: () => { S.mod = null; du('Şimdi sıra sende! 🎯 Birlikte Çal’a bas.'); $$('#modlar .btn').forEach(b => b.classList.remove('act')); } }); }
    else if (mod === 'birlikte') { du('🎯 Parlayan tuşa bas — şarkı seni bekler.'); ilerle(); }
    else if (mod === 'cumle') cumleBasla(0);
    else if (mod === 'ezber') { du('🧠 Ezberden çal! Takılırsan ipucu gelir.'); ilerle(); }
  }
  $('#modlar').onclick = e => {
    const b = e.target.closest('[data-mod]'); if (!b) return; const mod = b.dataset.mod;
    if (mod === 'dur') { durdurHepsi(); S.mod = null; st.ipucu(null); du('Durduruldu.'); $$('#modlar .btn').forEach(x => x.classList.remove('act')); return; }
    if (mod === 'buyuk') return buyukEkran(s, st, bpm());
    basla(mod);
  };
};

  for (let k = 0; k < 5; k++) s += `<line x1="10" x2="310" y1="${y0 - k * 16}" y2="${y0 - k * 16}" stroke="#333" stroke-width="1.6"/>`;
  s += `<text x="14" y="${y0 + 14}" font-size="92" font-family="'Noto Music',serif" fill="#222">𝄞</text>`;
  for (let dd = E4 - 2; dd >= d; dd -= 2) s += `<line x1="${x - 20}" x2="${x + 20}" y1="${y0 - (dd - E4) * st}" y2="${y0 - (dd - E4) * st}" stroke="#333" stroke-width="1.6"/>`;
  for (let dd = E4 + 10; dd <= d; dd += 2) s += `<line x1="${x - 20}" x2="${x + 20}" y1="${y0 - (dd - E4) * st}" y2="${y0 - (dd - E4) * st}" stroke="#333" stroke-width="1.6"/>`;
  if (isB(m)) s += `<text x="${x - 34}" y="${y + 8}" font-size="26" font-weight="700" fill="#222">♯</text>`;
  const up = d < E4 + 4;
  s += up ? `<line x1="${x + 10}" x2="${x + 10}" y1="${y}" y2="${y - 50}" stroke="#222" stroke-width="2.4"/>` : `<line x1="${x - 10}" x2="${x - 10}" y1="${y}" y2="${y + 50}" stroke="#222" stroke-width="2.4"/>`;

  };
  $('#fS').onchange = e => { filtre = e.target.value; ciz(); };
  $('#fA').oninput = e => { ara = e.target.value.toLocaleLowerCase('tr'); ciz(); };
  $('#oY').onclick = yukle;
  $('#tb').onclick = e => { const tr = e.target.closest('[data-id]'); if (!tr) return; const r = veri[tr.dataset.id]; modalAc(`<h2>${esc(r.ad)}</h2><p class="muted" style="font-weight:800">${esc(r.sinif)} · ⭐ ${r.xp || 0} · 🌟 ${r.yildiz || 0} · 🎵 ${r.sarki || 0} şarkı · 🏅 ${r.rozet || 0} rozet<br>🔁 ${r.simon || 0} tur · 🥁 %${r.ritim || 0} · 👂 ${r.kulak || 0}/10 · 🎼 ${r.nota || 0}/10</p><div class="steps">${(r.etk || []).map(x => `<div><i>🕒</i><span>${tarih(x.z)} — ${esc(x.detay || x.tur)}</span></div>`).join('')}</div>`); };
  $('#oK').onclick = () => { const L = $('#tb').L || []; const t = ['Ad Soyad\tSınıf\tGiriş\tPuan\tYıldız\tSon Etkinlik\tSon Giriş'].concat(L.map(r => [r.ad, r.sinif, r.giris || 0, r.xp || 0, r.yildiz || 0, ((r.etk || [])[0] || {}).detay || '', tarih(r.son)].join('\t'))).join('\n'); navigator.clipboard.writeText(t).then(() => toast('📋 Kopyalandı — Excel’e yapıştırabilirsiniz')).catch(() => toast('Kopyalanamadı')); };
  $('#oSif').onclick = () => { const s = prompt('Yeni öğretmen şifresi (en az 4 karakter):'); if (s && s.length >= 4) { LS.set('mu_ogrSifre', s); toast('🔑 Şifre değişti'); } };
  $('#oTem').onclick = () => { if (confirm('Bu cihazdaki öğrenci kayıtları silinsin mi? (Buluttakiler silinmez)')) { LS.set('mu_ogr', {}); yukle(); } };
  $('#oSurum').onclick = async () => { if (!BULUT.db) { toast('Önce bulut bağlantısını kurun'); return; } try { await BULUT.db.collection('muzik_ayarlar').doc('merkez').set({ surum: LOCAL_SURUM, ts: Date.now() }, { merge: true }); toast(`🚀 Sürüm ${LOCAL_SURUM} yayınlandı. Yeni dosyayı sitenize de yüklemeyi unutmayın.`, 4000); } catch (e) { toast('Yazılamadı: ' + (e.code || e.message)); } };
  $('#oBulut').onclick = () => {
    const m = modalAc(`<h2>☁️ Bulut Bağlantısı</h2><p style="font-weight:700;line-height:1.5">Firebase projenizin <b>firebaseConfig</b> bilgisini buraya yapıştırın. Böylece hangi cihazdan girilirse girilsin tüm öğrenciler bu panelde görünür. Kayıtlar <b>muzik_ogrenciler</b> koleksiyonuna yazılır.</p>
      <textarea class="inp" id="cfg" placeholder='const firebaseConfig = { apiKey: "...", authDomain: "...", projectId: "...", ... };'></textarea>
      <div class="row" style="margin-top:10px"><button class="btn pri" id="cK">Kaydet ve Bağlan</button><button class="btn" id="cS">Bağlantıyı Kaldır</button></div>`);
    const c = bulutCfg(); if (c) $('#cfg', m).value = JSON.stringify(c, null, 1);
    $('#cK', m).onclick = async () => {
      const t = $('#cfg', m).value, o = {}; let r; const re = /["']?(\w+)["']?\s*:\s*["']([^"']+)["']/g; while ((r = re.exec(t))) o[r[1]] = r[2];
      if (!o.apiKey || !o.projectId) { toast('apiKey ve projectId bulunamadı'); return; }
      LS.set('mu_fbcfg', o); const ok = await bulutBaslat(); toast(ok ? '✅ Buluta bağlandı' : '⚠️ Bağlanamadı, bilgileri kontrol edin'); modalKapat(); yukle();
    };
    $('#cS', m).onclick = () => { LS.set('mu_fbcfg', null); toast('Bağlantı bilgisi silindi; sayfayı yenileyin'); modalKapat(); };
  };
  yukle();
};

/* ===================== ZİRVE: karşılama, ayarlar, araçlar, QR, ekran ===================== */
function karsilamaAc() {
  const m = modalAc(`<div style="text-align:center"><div style="font-size:58px">🎶🪗🎻</div><h2>Melodi Akademisi’ne hoş geldin!</h2>
    <p class="muted" style="font-weight:700">Anaokulundan 8. sınıfa kadar herkes için müzik oyunu.</p></div>
    <div class="steps"><div><i>✍️</i>Adını, soyadını ve sınıfını yaz</div><div><i>🎹</i>Bir enstrüman seç: piyano, akordeon, bağlama, keman, flüt, ksilofon, kalimba, darbuka, bateri</div>
    <div><i>👂</i>Önce <b>dinle</b>, sonra 🎯 aynısını <b>sen çal</b> — parlayan tuş sana yol gösterir</div><div><i>⭐</i>Yıldız ve rozet topla; öğretmenin ilerlemeni görsün</div></div>
    <p class="muted" style="font-size:13px;font-weight:700">Akıllı tahtada, tablette, telefonda ve bilgisayarda çalışır. iPhone’da ses gelmezse sesi açın ve ekrana bir kez dokunun.</p>
    <button class="btn pri big" data-kapat style="width:100%">Haydi başlayalım! 🎵</button>`);
  LS.set('zirve_karsilama_goruldu', true);
  return m;
}
const EKRAN_MODLAR = [['oto', 'Otomatik'], ['tablet', 'Tablet / Telefon'], ['tahta', 'Akıllı Tahta'], ['buyuk', 'Büyük Tahta']];
function ekranOtoZoom() {
  const w = Math.max(window.innerWidth, screen.width || 0), dok = ('ontouchstart' in window) || navigator.maxTouchPoints > 0, dpr = window.devicePixelRatio || 1;
  if (w >= 2500 && dpr <= 1.25) return 1.6; if (w >= 1500 && dok && dpr <= 1.25) return 1.35; return 1;
}
function ekranUygula() { const z = { oto: ekranOtoZoom(), tablet: 1, tahta: 1.35, buyuk: 1.6 }[AYAR.ekranMod] || 1; document.documentElement.style.zoom = z === 1 ? '' : z; }
function ekranDongu() { const i = EKRAN_MODLAR.findIndex(x => x[0] === AYAR.ekranMod); AYAR.ekranMod = EKRAN_MODLAR[(i + 1) % EKRAN_MODLAR.length][0]; ayarKaydet(); ekranUygula(); toast('📺 Ekran: ' + EKRAN_MODLAR.find(x => x[0] === AYAR.ekranMod)[1]); }
let ZOOM_YEDEK = '';
window.ZIRVE_ekranReset = () => { ZOOM_YEDEK = document.documentElement.style.zoom; document.documentElement.style.zoom = ''; };
window.ZIRVE_ekranGeri = () => { document.documentElement.style.zoom = ZOOM_YEDEK; };
window.addEventListener('resize', () => { if (AYAR.ekranMod === 'oto') ekranUygula(); });
function tamEkran() { const d = document.documentElement; try { if (!document.fullscreenElement) (d.requestFullscreen || d.webkitRequestFullscreen).call(d); else document.exitFullscreen(); } catch (e) { toast('Bu cihaz tam ekranı desteklemiyor'); } }
async function qrAc() {
  const url = location.href.split('#')[0];
  const m = modalAc(`<h2>📲 QR ile Paylaş</h2><div id="qrK" style="display:grid;place-items:center;background:#fff;padding:14px;border-radius:16px;min-height:200px">Yükleniyor…</div>
    ${location.protocol === 'file:' ? '<p style="color:#c62828;font-weight:800">⚠️ Bu dosya bilgisayardan açılmış; QR’ın çalışması için sitenizde yayınlanmış adresi kullanın.</p>' : ''}
    <p style="word-break:break-all;font-size:13px;font-weight:700" class="muted">${esc(url)}</p><div class="row"><button class="btn" id="qK">🔗 Linki Kopyala</button><button class="btn" id="qI">⬇️ PNG İndir</button></div>`);
  $('#qK', m).onclick = () => navigator.clipboard.writeText(url).then(() => toast('🔗 Kopyalandı')).catch(() => toast(url));
  try {
    await scriptYukle('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js');
    const q = qrcode(0, 'M'); q.addData(url); q.make(); const src = q.createDataURL(8, 16);
    $('#qrK', m).innerHTML = `<img src="${src}" alt="QR" style="width:min(70vw,260px);image-rendering:pixelated">`;
    $('#qI', m).onclick = () => { const a = document.createElement('a'); a.href = src; a.download = 'melodi-akademisi-qr.png'; a.click(); };
  } catch (e) { $('#qrK', m).textContent = 'QR yüklenemedi (internet gerekli).'; }
}
window.ZIRVE_paylasAc = qrAc;
const ARACLAR = [['qr', '📲', 'QR ile paylaş', qrAc], ['ekran', '📺', 'Ekran modu', ekranDongu], ['tam', '⛶', 'Tam ekran', tamEkran], ['yukari', '⬆️', 'Yukarı çık', () => window.scrollTo({ top: 0, behavior: 'smooth' })]];
window.ZIRVE_kontroller = ARACLAR.map(a => a[0]);
function dockCiz() {
  const d = $('#dock'); d.innerHTML = ARACLAR.filter(a => AYAR.araclar[a[0]]).map(a => `<button class="db" data-a="${a[0]}" title="${a[2]}">${a[1]}<em data-x="${a[0]}">×</em></button>`).join('');
}
$('#dock').addEventListener('click', e => {
  const x = e.target.closest('[data-x]'); if (x) { AYAR.araclar[x.dataset.x] = false; ayarKaydet(); dockCiz(); toast('Gizlendi — Ayarlar › Araçlar’dan geri açabilirsin'); return; }
  const b = e.target.closest('[data-a]'); if (b) ARACLAR.find(a => a[0] === b.dataset.a)[3]();
});
window.ZIRVE_kontrolleriGeriGetir = () => { ARACLAR.forEach(a => { AYAR.araclar[a[0]] = true; }); ayarKaydet(); dockCiz(); };
function ayarlarAc() {
  const sw = (k, on) => `<button class="sw ${on ? 'on' : ''}" data-sw="${k}"></button>`;
  const m = modalAc(`<h2>⚙️ Ayarlar</h2>
    <div class="sec">Ses</div><div class="set"><span>🔊 Ses seviyesi</span><input type="range" id="aVol" min="0" max="1" step="0.05" value="${AYAR.vol}" style="width:50%"></div>
    <div class="sec">Görünüm</div>
    <div class="set"><span>🏷️ Nota etiketleri</span><select id="aEt" class="chip"><option value="renk">Renkli Do-Re-Mi</option><option value="solfej">Do-Re-Mi</option><option value="harf">C-D-E (harf)</option><option value="yok">Etiket yok</option></select></div>
    <div class="set"><span>⌨️ Klavye harflerini tuşlarda göster</span>${sw('klavye', AYAR.klavye)}</div>
    <div class="set"><span>🎯 Oktav esnek (aynı notanın ince/kalını da kabul)</span>${sw('oktav', AYAR.oktav)}</div>
    <div class="set"><span>📺 Ekran modu</span><button class="btn" id="aEk">${EKRAN_MODLAR.find(x => x[0] === AYAR.ekranMod)[1]}</button></div>
    <div class="sec">🧰 Araçlar (yüzen düğmeler)</div>
    ${ARACLAR.map(a => `<div class="set"><span>${a[1]} ${a[2]}</span><span class="row"><button class="btn" data-run="${a[0]}" style="padding:7px 10px">Aç</button>${sw('arac_' + a[0], AYAR.araclar[a[0]])}</span></div>`).join('')}
    <div class="set"><span>Tüm yüzen düğmeleri geri getir</span><button class="btn" id="aGeri">Getir</button></div>
    <div class="sec">Diğer</div>
    <div class="row" style="margin-top:6px"><button class="btn" id="aKar">❓ Nasıl oynanır</button><button class="btn" id="aOgr">👩‍🏫 Öğretmen Paneli</button>${USER ? '<button class="btn red" id="aCik">🚪 Öğrenci Değiştir</button>' : ''}</div>
    <p class="muted" style="font-size:12px;font-weight:700;margin-top:12px">Melodi Akademisi · sürüm ${LOCAL_SURUM}</p>`);
  $('#aEt', m).value = AYAR.etiket;
  $('#aVol', m).oninput = e => sesSeviye(+e.target.value);
  $('#aEt', m).onchange = e => { AYAR.etiket = e.target.value; ayarKaydet(); yenidenCiz(); };
  $('#aEk', m).onclick = e => { ekranDongu(); e.target.textContent = EKRAN_MODLAR.find(x => x[0] === AYAR.ekranMod)[1]; };
  m.addEventListener('click', e => {
    const s = e.target.closest('[data-sw]'); if (s) { const k = s.dataset.sw; if (k.startsWith('arac_')) { const a = k.slice(5); AYAR.araclar[a] = !AYAR.araclar[a]; s.classList.toggle('on', AYAR.araclar[a]); dockCiz(); } else { AYAR[k] = !AYAR[k]; s.classList.toggle('on', AYAR[k]); if (k === 'klavye') yenidenCiz(); } ayarKaydet(); }
    const r = e.target.closest('[data-run]'); if (r) { modalKapat(); ARACLAR.find(a => a[0] === r.dataset.run)[3](); }
  });
  $('#aGeri', m).onclick = () => { window.ZIRVE_kontrolleriGeriGetir(); modalKapat(); };
  $('#aKar', m).onclick = karsilamaAc;
  $('#aOgr', m).onclick = () => { modalKapat(); git('ogretmen'); };
  const c = $('#aCik', m); if (c) c.onclick = () => { modalKapat(); USER = null; PROF = null; LS.set('mu_user', null); ustGuncelle(); git('giris'); };
}
function yenidenCiz() { if (AKTIF_EKRAN && !['giris', 'ogretmen'].includes(AKTIF_EKRAN)) { const p = (AKTIF_EKRAN === 'sarki') ? { id: (SARKILAR.find(s => document.querySelector('.bar h2') && document.querySelector('.bar h2').textContent.includes(s.ad)) || {}).id } : {}; git(AKTIF_EKRAN, p); } }

/* ===================== BAŞLAT ===================== */
$('#ayarBtn').onclick = ayarlarAc;
$('#yardimBtn').onclick = karsilamaAc;
$('#uchip').onclick = () => git('rozetler');
$('#logo').onclick = () => git(USER ? 'ana' : 'giris');
document.addEventListener('pointerdown', () => sesBaslat(), { once: true, capture: true });
(function basla() {
  ekranUygula(); ustGuncelle(); dockCiz();
  git(USER ? 'ana' : 'giris');
  if (USER) kayit('giris', 'Oyuna girdi');
  if (!LS.get('zirve_karsilama_goruldu', false)) karsilamaAc();
  bulutBaslat().then(ok => { if (ok && USER) { const r = LS.get('mu_ogr', {})[USER.id]; if (r) bulutYaz(USER.id, r); } });
})();

</script>
</body>
</html>
