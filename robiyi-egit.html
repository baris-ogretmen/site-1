<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14123a">
<title>Robi'yi Eğit — Yapay Zekâ Okulu</title>
<meta name="description" content="Robot Robi'ye örneklerle öğret, tahminlerini dene. Anaokulundan 8. sınıfa adım adım yapay zekânın nasıl öğrendiğini keşfeden oyun.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" defer></script>
<style>
:root{--ui:1;--mor:#6c4cf0;--mor2:#4a2fc0;--lac:#14123a;--yaz:#1b2340;--yesil:#18a957;--kirmizi:#e2477c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--lac);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:800;font-variant-numeric:lining-nums;color:#fff;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font-family:inherit}
/* ---------- SAHNE: robot atölyesi ---------- */
#sahne{position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(120% 80% at 50% 0%,#2b2670 0%,#14123a 60%,#0c0a26 100%)}
#sahne::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;pointer-events:none}
#ust{position:relative;z-index:3;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 12px 6px}
#ust .bilgi{flex:1;min-width:0}
#gorevAd{font-size:calc(18px*var(--ui));font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gorevAlt{font-size:calc(13px*var(--ui));opacity:.75}
.ub{min-width:54px;min-height:54px;border-radius:16px;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:calc(22px*var(--ui));cursor:pointer;display:flex;align-items:center;justify-content:center}
.ub:active{transform:translateY(2px)}
#adimlar{display:flex;gap:6px;align-items:center}
#adimlar i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.2);display:block}
#adimlar i.ok{background:#3ee08a}#adimlar i.su{background:#ffd34d;box-shadow:0 0 0 4px rgba(255,211,77,.25)}
/* robot + hafıza rafı */
#ortaAlan{position:relative;z-index:2;flex:1;display:grid;grid-template-columns:minmax(150px,30%) 1fr;gap:10px;padding:4px 12px;min-height:0}
#robiKutu{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
#robi{width:min(100%,calc(220px*var(--ui)));height:auto;max-height:100%;overflow:visible;filter:drop-shadow(0 14px 18px rgba(0,0,0,.45))}
#robi .goz{transform-origin:center;transform-box:fill-box;animation:kirp 4.5s infinite}
@keyframes kirp{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
#robi .noron{fill:#5b54c9;transition:fill .2s}
#robi.dusun .noron{animation:yan .5s infinite alternate}
#robi.dusun .noron:nth-child(2n){animation-delay:.15s}#robi.dusun .noron:nth-child(3n){animation-delay:.3s}
@keyframes yan{from{fill:#5b54c9}to{fill:#ffe066}}
#robi.mutlu #agiz{d:path('M86 132 Q100 146 114 132')}
#robi.uzgun #agiz{d:path('M88 140 Q100 130 112 140')}
#robi .anten{transform-origin:100px 40px;animation:sallan 3s ease-in-out infinite}
@keyframes sallan{50%{transform:rotate(6deg)}}
#balon{position:relative;margin-top:6px;background:#fff;color:var(--yaz);border-radius:18px;padding:8px 12px;font-size:calc(16px*var(--ui));line-height:1.3;text-align:center;max-width:100%;min-height:44px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#balon::before{content:'';position:absolute;top:-10px;left:50%;margin-left:-10px;border:10px solid transparent;border-top:0;border-bottom-color:#fff}
#balon b{color:var(--mor)}
#raf{position:relative;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.12);border-radius:22px;padding:8px 10px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
#rafBas{font-size:calc(14px*var(--ui));opacity:.85;display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
#rafSiniflar{flex:1;display:grid;gap:8px;min-height:0;overflow:auto}
.rs{background:rgba(0,0,0,.18);border-radius:16px;padding:6px 8px;min-height:0}
.rs h4{margin:0 0 4px;font-size:calc(14px*var(--ui));display:flex;align-items:center;gap:6px}
.rs h4 i{width:12px;height:12px;border-radius:4px;display:inline-block}
.rs .ornekler{display:flex;flex-wrap:wrap;gap:4px}
.orn{width:calc(46px*var(--ui));height:calc(46px*var(--ui));border-radius:12px;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;font-size:calc(28px*var(--ui));position:relative;border:0;padding:0;cursor:default;transition:transform .2s,box-shadow .2s;animation:rafGir .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes rafGir{from{transform:scale(.3)}to{transform:none}}
.orn.yakin{box-shadow:0 0 0 4px #ffe066,0 0 18px #ffe066;transform:scale(1.08);z-index:2}
.orn.duzeltilebilir{cursor:pointer}
.orn.duzeltilebilir::after{content:'↺';position:absolute;right:-4px;bottom:-4px;background:var(--mor);color:#fff;font-size:12px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.orn.hatali{outline:3px dashed #ff6b8b;outline-offset:1px}
/* bant + gelen eşya */
#bantAlan{position:relative;z-index:2;height:calc(150px*var(--ui));max-height:26vh;min-height:110px;margin:4px 0}
#bant{position:absolute;left:0;right:0;bottom:12px;height:34px;background:repeating-linear-gradient(90deg,#3b3a55 0 26px,#2b2a40 26px 52px);border-top:4px solid #57567a;border-bottom:4px solid #1b1a2c;animation:bantAk 1.2s linear infinite paused;box-shadow:0 10px 20px rgba(0,0,0,.4)}
#bant.akiyor{animation-play-state:running}
@keyframes bantAk{to{background-position:52px 0}}
#esya{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);width:calc(110px*var(--ui));height:calc(110px*var(--ui));max-height:calc(26vh - 50px);max-width:calc(26vh - 50px);min-width:64px;min-height:64px;border-radius:24px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:calc(68px*var(--ui));box-shadow:0 12px 24px rgba(0,0,0,.35);transition:left .55s cubic-bezier(.2,.8,.2,1),transform .45s,opacity .3s}
#esya.gizli{opacity:0}
#esya.gel{animation:gel .6s cubic-bezier(.2,.8,.2,1)}
@keyframes gel{from{left:-20%}}
#tarama{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);width:calc(130px*var(--ui));height:calc(130px*var(--ui));max-height:calc(26vh - 40px);pointer-events:none;opacity:0;border-radius:24px;overflow:hidden}
#tarama.acik{opacity:1}
#tarama::after{content:'';position:absolute;left:0;right:0;height:18px;background:linear-gradient(transparent,rgba(120,255,200,.75),transparent);animation:tara .9s ease-in-out infinite alternate}
@keyframes tara{from{top:-10px}to{top:calc(100% - 8px)}}
#ozellikler{position:absolute;left:8px;width:calc(50% - 70px*var(--ui));bottom:52px;display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;align-content:flex-end;pointer-events:none;z-index:3}
.oz{background:rgba(255,255,255,.14);border-radius:999px;padding:3px 9px;font-size:calc(12px*var(--ui))}
.oz.var{background:#ffe066;color:#3a2c00}
.oz.yok{opacity:.55;text-decoration:line-through}
@media (max-width:560px){#adimlar{display:none}#gorevAd{font-size:calc(16px*var(--ui))}.sec{font-size:calc(18px*var(--ui))}.sec .em{font-size:calc(28px*var(--ui))}}
#cizgiler{position:fixed;inset:0;pointer-events:none;z-index:4}
/* harita (7–8. sınıf) */
#harita{position:relative;z-index:2;flex:1;margin:4px 12px;display:none;min-height:0}
#harita canvas{width:100%;height:100%;display:block;border-radius:22px;background:#f8f9ff;touch-action:none}
/* alt düğmeler — her zaman altta (Çocuk Boyu dostu) */
#alt{position:relative;z-index:5;padding:6px 12px calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-direction:column;gap:8px}
#yonerge{text-align:center;font-size:calc(17px*var(--ui));line-height:1.3;min-height:1.3em;opacity:.95}
#secenekler{display:flex;gap:10px;flex-wrap:wrap}
.sec{flex:1 1 140px;min-height:clamp(72px,12vmin,calc(120px*var(--ui)));border:0;border-radius:22px;color:#fff;font-weight:900;font-size:calc(22px*var(--ui));cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 10px;box-shadow:0 6px 0 rgba(0,0,0,.3);line-height:1.1;text-align:center}
.sec .em{font-size:calc(34px*var(--ui))}
.sec:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.sec:disabled{opacity:.4}
.sec.k0{background:#2a7de1}.sec.k1{background:#e2477c}.sec.k2{background:#18a957}.sec.k3{background:#f08a24}
.sec.dogru{background:#18a957}.sec.yanlis{background:#e2477c}.sec.notr{background:#6c4cf0}.sec.gri{background:#4b4f72}
.sec.parla{outline:5px solid #ffe066;outline-offset:2px}
.sec small{display:block;font-size:calc(13px*var(--ui));opacity:.9}
.sinif0{background:#2a7de1}.sinif1{background:#e2477c}.sinif2{background:#18a957}.sinif3{background:#f08a24}
/* uçan eşya */
.ucan{position:fixed;z-index:9;font-size:calc(46px*var(--ui));pointer-events:none;transition:left .55s cubic-bezier(.3,.7,.3,1),top .55s cubic-bezier(.5,-0.3,.6,1),transform .55s;}
/* bilgi kartı */
#bilgi{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px*var(--ui));transform:translate(-50%,-10px);opacity:0;transition:.3s;z-index:12;background:#fff;color:var(--yaz);border-radius:20px;padding:12px 18px;width:min(92vw,calc(560px*var(--ui)));font-size:calc(17px*var(--ui));line-height:1.35;box-shadow:0 10px 30px rgba(0,0,0,.35);pointer-events:none}
#bilgi.acik{opacity:1;transform:translate(-50%,0)}
#bilgi b{color:var(--mor)}
body.cb1 #bilgi,body.cb2 #bilgi{top:auto;bottom:calc(env(safe-area-inset-bottom) + 190px*var(--ui))}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 120px*var(--ui));transform:translate(-50%,-20px);opacity:0;transition:opacity .25s,transform .25s;z-index:30;pointer-events:none;background:#fff;color:var(--yaz);border-radius:20px;padding:12px 22px;font-size:calc(20px*var(--ui));font-weight:900;box-shadow:0 8px 24px rgba(0,0,0,.3);text-align:center;max-width:92vw}
#toast.acik{opacity:1;transform:translate(-50%,0)}
/* ---------- Çocuk Boyu: üst çubuktaki düğmeler aşağı iner ---------- */
body.cb1 #ust .ub,body.cb2 #ust .ub{display:none}
#altUb{display:none;gap:8px;justify-content:center}
body.cb1 #altUb,body.cb2 #altUb{display:flex}
body.cb2 #ortaAlan{flex:.8}
#cbRozet{position:fixed;right:8px;top:calc(env(safe-area-inset-top) + 4px);font-size:11px;opacity:.45;z-index:4;display:none}
body.cb1 #cbRozet,body.cb2 #cbRozet{display:block}
/* ---------- EKRANLAR (pencere) ---------- */
#ekran{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(6,6,28,.55);padding:calc(env(safe-area-inset-top) + 10px) 10px calc(env(safe-area-inset-bottom) + 10px)}
body.cb1 #ekran,body.cb2 #ekran{align-items:flex-end}
.panel{background:#fff;color:var(--yaz);border-radius:28px;width:min(calc(860px*var(--ui)),97vw);max-height:92vh;overflow:auto;padding:20px;box-shadow:0 18px 50px rgba(0,0,0,.45);animation:pop .25s cubic-bezier(.34,1.56,.64,1);-webkit-overflow-scrolling:touch}
body.cb1 .panel{max-height:62vh}body.cb2 .panel{max-height:48vh}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.panel h1{margin:0 0 4px;font-size:calc(32px*var(--ui));font-weight:900;color:var(--mor);line-height:1.1}
.panel h2{margin:0 0 10px;font-size:calc(25px*var(--ui));font-weight:900}
.panel h3{margin:12px 0 6px;font-size:calc(19px*var(--ui))}
.panel p{margin:6px 0 12px;font-size:calc(18px*var(--ui));line-height:1.4;color:#3a4366;font-weight:700}
.btn{min-height:clamp(64px,10vmin,calc(104px*var(--ui)));border:0;border-radius:20px;font-weight:900;font-size:calc(20px*var(--ui));padding:10px 18px;background:var(--mor);color:#fff;box-shadow:0 5px 0 var(--mor2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;line-height:1.15}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--mor2)}
.btn.ik{background:#eef2ff;color:var(--yaz);box-shadow:0 5px 0 #c9d2f0}
.btn.yesil{background:#18a957;box-shadow:0 5px 0 #0f7a3d}
.btn.mavi{background:#2a7de1;box-shadow:0 5px 0 #1b59a6}
.btn.turuncu{background:#f08a24;box-shadow:0 5px 0 #b8620f}
.btn:disabled{opacity:.45}
.izgara{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:14px}
.izgara2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.mod{flex-direction:column;min-height:clamp(120px,18vmin,200px);font-size:calc(22px*var(--ui))}
.mod span.em{font-size:calc(42px*var(--ui))}
.mod small{font-size:calc(14px*var(--ui));font-weight:800;opacity:.92}
.satir{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.satir>.btn{flex:1 1 150px}
.soluklar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.soluk{min-height:56px;min-width:56px;border:0;background:transparent;color:#8a93b5;font-weight:800;font-size:calc(15px*var(--ui));border-radius:16px;padding:6px 12px;cursor:pointer}
.soluk:active{background:#f1f3fb}
:focus-visible{outline:4px solid #3aa0ff;outline-offset:3px}
label.alan{display:block;margin:8px 0;font-size:calc(17px*var(--ui))}
input,select{font-family:inherit;font-weight:800;font-size:calc(20px*var(--ui));padding:12px 14px;border-radius:14px;border:3px solid #d8def2;width:100%;min-height:60px;color:var(--yaz);background:#fff}
input:focus,select:focus{border-color:var(--mor);outline:none}
.ikili{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yildiz{color:#ffb400;font-size:calc(22px*var(--ui));letter-spacing:2px}
.istat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 0}
.istat div{background:#f3f5fc;border-radius:16px;padding:10px;text-align:center;font-size:calc(14px*var(--ui));color:#56608a}
.istat b{display:block;font-size:calc(28px*var(--ui));color:var(--yaz)}
table{width:100%;border-collapse:collapse;font-size:calc(14px*var(--ui))}
th,td{padding:7px 6px;border-bottom:1px solid #eef0f8;text-align:left}th{color:#56608a}
.anahtar{display:flex;gap:8px;flex-wrap:wrap}
.anahtar .btn{flex:1 1 90px;min-height:60px;font-size:calc(17px*var(--ui))}
.anahtar .btn.sec2{background:var(--mor);color:#fff;box-shadow:0 5px 0 var(--mor2)}
.oneri{animation:nabiz 1.2s ease-in-out infinite}
@keyframes nabiz{50%{transform:scale(1.05)}}
.kademe{border:3px solid #eef0f8;border-radius:22px;padding:12px;margin-bottom:10px;background:#fafbff}
.kademe h3{margin:0 0 8px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.kademe h3 small{font-size:calc(13px*var(--ui));color:#8a93b5}
.gorevler{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:10px}
.gbtn{min-height:76px;border:0;border-radius:18px;background:#eef2ff;color:var(--yaz);font-weight:900;font-size:calc(17px*var(--ui));padding:10px 12px;text-align:left;cursor:pointer;box-shadow:0 4px 0 #c9d2f0;display:flex;gap:10px;align-items:center}
.gbtn .em{font-size:calc(30px*var(--ui))}
.gbtn small{display:block;font-weight:700;color:#56608a;font-size:calc(13px*var(--ui))}
.gbtn.ok{background:#e7f8ef;box-shadow:0 4px 0 #b6e6c9}
.gbtn.oneri{outline:4px solid #ffd34d}
.notkutu{background:#f4f1ff;border-radius:16px;padding:10px 14px;margin:8px 0;color:#3a3366;font-size:calc(16px*var(--ui));line-height:1.4}
.notkutu b{color:var(--mor)}
.sertifika{border:6px double #c9b3ff;border-radius:22px;padding:20px;text-align:center;background:linear-gradient(#fff,#f7f3ff)}
.sertifika .ad{font-size:calc(34px*var(--ui));color:var(--mor);margin:8px 0}
#siteKatman{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;background:#fff}
#siteKatman iframe{flex:1;border:0;width:100%}
#siteKatman .ust{display:flex;gap:8px;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;background:var(--lac)}
@media (prefers-reduced-motion:reduce){.oneri,.panel,#robi .goz,#robi .anten,#bant{animation:none!important}}
body.hareketsiz .oneri,body.hareketsiz #robi .anten{animation:none}
@media print{#sahne,#alt{display:none}#ekran{position:static;background:none}.panel{box-shadow:none;max-height:none}}
</style>
</head>
<body class="cb0">
<div id="sahne">
 <div id="ust">
  <button class="ub" data-ust="ev" aria-label="Ana menü">🏠</button>
  <div class="bilgi"><div id="gorevAd">Robi'yi Eğit</div><div id="gorevAlt">Yapay Zekâ Okulu</div></div>
  <div id="adimlar" aria-label="Görev adımları"></div>
  <button class="ub" data-ust="ses" id="sesUb" aria-label="Ses">🔊</button>
  <button class="ub" data-ust="mola" aria-label="Mola">⏸</button>
 </div>
 <div id="ortaAlan">
  <div id="robiKutu">
   <svg id="robi" viewBox="0 0 200 230" aria-label="Robot Robi">
    <defs><linearGradient id="gv" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#e9ecff"/><stop offset="1" stop-color="#b8bff0"/></linearGradient>
    <linearGradient id="gk" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#8f86ff"/><stop offset="1" stop-color="#5a4fe0"/></linearGradient></defs>
    <g class="anten"><line x1="100" y1="42" x2="100" y2="16" stroke="#b8bff0" stroke-width="6" stroke-linecap="round"/><circle cx="100" cy="12" r="9" fill="#ffe066"/></g>
    <rect x="38" y="40" width="124" height="112" rx="34" fill="url(#gv)"/>
    <g id="beyin"><circle class="noron" cx="72" cy="58" r="5"/><circle class="noron" cx="90" cy="52" r="5"/><circle class="noron" cx="110" cy="52" r="5"/><circle class="noron" cx="128" cy="58" r="5"/><circle class="noron" cx="100" cy="64" r="4"/></g>
    <rect x="54" y="74" width="92" height="50" rx="22" fill="#1d1a4d"/>
    <ellipse class="goz" cx="80" cy="99" rx="10" ry="12" fill="#7cf5d0"/><ellipse class="goz" cx="120" cy="99" rx="10" ry="12" fill="#7cf5d0"/>
    <path id="agiz" d="M88 136 Q100 142 112 136" stroke="#5a4fe0" stroke-width="5" fill="none" stroke-linecap="round"/>
    <rect x="58" y="156" width="84" height="56" rx="20" fill="url(#gk)"/>
    <circle cx="100" cy="182" r="10" fill="#ffe066" opacity=".9"/>
    <rect x="22" y="160" width="30" height="14" rx="7" fill="#b8bff0"/><rect x="148" y="160" width="30" height="14" rx="7" fill="#b8bff0"/>
   </svg>
   <div id="balon">Merhaba! Ben <b>Robi</b>. Bana örneklerle öğret!</div>
  </div>
  <div id="raf"><div id="rafBas"><span>🧠 Robi'nin hafızası</span><span id="rafSay">0 örnek</span></div><div id="rafSiniflar"></div></div>
 </div>
 <div id="harita"><canvas id="hc"></canvas></div>
 <div id="bantAlan"><div id="ozellikler"></div><div id="bant"></div><div id="tarama"></div><div id="esya" class="gizli"></div></div>
 <div id="alt">
  <div id="yonerge"></div>
  <div id="secenekler"></div>
  <div id="altUb"><button class="ub" data-ust="ev" aria-label="Ana menü">🏠</button><button class="ub" data-ust="ses" aria-label="Ses">🔊</button><button class="ub" data-ust="mola" aria-label="Mola">⏸</button></div>
 </div>

  const cmp=ac.createDynamicsCompressor();cmp.threshold.value=-20;cmp.ratio.value=4;ana=ac.createGain();ana.connect(lp);lp.connect(cmp);cmp.connect(ac.destination);
  muzikG=ac.createGain();muzikG.gain.value=0;muzikG.connect(ana);sesSeviye();muzikBaslat();}catch(e){ac=null;}}

  o.type=tip;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(ses,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+sure);o.connect(g);g.connect(hedef||ana);o.start(t);o.stop(t+sure+.03);}

/* ---------- sahne yardımcıları ---------- */
function balon(h){$('balon').innerHTML=h;}
function yonerge(h){$('yonerge').innerHTML=h;}
function robiDurum(d){const r=$('robi');r.classList.remove('dusun','mutlu','uzgun');if(d)r.classList.add(d);}
function secenekler(L){const k=$('secenekler');k.innerHTML='';L.forEach((o,n)=>{const b=document.createElement('button');b.className='sec '+(o.cls||'k'+n);b.innerHTML=o.html;if(o.dis)b.disabled=true;b.onclick=()=>{if(b.disabled)return;SES.dokun();o.fn(b);};k.appendChild(b);});}
function secKapat(){document.querySelectorAll('#secenekler .sec').forEach(b=>b.disabled=true);}
function bilgi(h,ms=4200){const b=$('bilgi');b.innerHTML=h;b.classList.add('acik');clearTimeout(bilgi.t);bilgi.t=setTimeout(()=>b.classList.remove('acik'),ms);}
function adimlarCiz(n,i){$('adimlar').innerHTML=Array.from({length:n},(_,j)=>`<i class="${j<i?'ok':j===i?'su':''}"></i>`).join('');}
function esyaGoster(o){const e=$('esya');e.classList.remove('gizli','gel');void e.offsetWidth;e.textContent=o?o.e:'';e.title=o?o.ad:'';if(o){e.classList.add('gel');$('bant').classList.add('akiyor');setTimeout(()=>$('bant').classList.remove('akiyor'),600);SES.bant();}else e.classList.add('gizli');}

 k.innerHTML=ds.siniflar.map((s,n)=>`<div class="rs" data-s="${n}"><h4><i class="sinif${n}"></i>${s.em} ${esc(s.ad)} <small style="opacity:.6">(${G.egitim.filter(x=>x.s===n).length})</small></h4><div class="ornekler">${G.egitim.map((x,j)=>x.s===n?`<button class="orn ${duzeltilebilir?'duzeltilebilir':''}" data-j="${j}" title="${esc(x.ad)}" aria-label="${esc(x.ad)}, ${esc(s.ad)} olarak öğretildi">${x.e}</button>`:'').join('')}</div></div>`).join('');
 $('rafSay').textContent=G.egitim.length+' örnek';
 if(duzeltilebilir)k.querySelectorAll('.orn').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;const x=G.egitim[j];x.s=(x.s+1)%ds.siniflar.length;x.degisti=!x.degisti;SES.dokun();rafCiz(true);});}
function rafOgesi(j){return document.querySelector(`#rafSiniflar .orn[data-j="${j}"]`);}

/* ---------- Yapay zekâ: en yakın komşu ---------- */
function mesafe(a,b){if(a.x!=null)return Math.hypot(a.x-b.x,a.y-b.y);let d=0;for(let i=0;i<a.f.length;i++)d+=a.f[i]!==b.f[i]?1:0;return d;}
function tahmin(o,k){const L=G.egitim.map((x,j)=>({j,d:mesafe(o,x),s:x.s})).sort((a,b)=>a.d-b.d||a.j-b.j);
 if(!L.length)return null;k=Math.min(k||3,L.length);const kom=L.slice(0,k);const oy=G.ds.siniflar.map(()=>0);kom.forEach(x=>oy[x.s]++);
 let en=0;oy.forEach((v,i)=>{if(v>oy[en])en=i;});const esit=oy.filter(v=>v===oy[en]).length>1;if(esit)en=kom[0].s;
 return{s:en,oy,kom,k,guven:oy[en]/k};}

/* ---------- veri hazırlama ---------- */
const ogeYap=a=>({e:a[0],ad:a[1],s:a[2],f:a[3]});
const hOge=a=>({e:a[0],ad:a[1],x:a[2],y:a[3],s:a[4]});
function bol(ds,egN,testN,once){const L=karistir(ds.ogeler.map(ogeYap));const S=ds.siniflar.length;
 const onc=(once||[]).map(e=>L.find(x=>x.e===e)).filter(Boolean);let kalan=L.filter(x=>!onc.includes(x));
 const eg=[];for(let i=0;eg.length<egN&&i<50;i++){const s=i%S;const x=kalan.find(y=>y.s===s);if(x){eg.push(x);kalan=kalan.filter(y=>y!==x);}}
 const test=onc.concat(kalan).slice(0,testN);return{eg:karistir(eg),test:karistir(test)};}

 for(let i=0;i<liste.length;i++){dur(t);const o=liste[i];adimlarCiz(liste.length,i);yonerge(`Test ${i+1}/${liste.length} · Robi <b>yeni</b> bir şey görüyor.`);secenekler([{html:'⏳ Robi düşünüyor…',cls:'gri',dis:true,fn:()=>{}}]);

   G.soruN++;if(c===dogru){G.dogru++;SES.dogru();}else{SES.yanlis();}
   if(dogru){robiDurum('mutlu');balon(c?'Yaşasın, doğru bildim! 🎉':`Aslında doğru bildim: ${esc(o.ad)} → ${esc(ds.siniflar[o.s].ad)} 🙂`);}

    yonerge(`Robi yanıldı. <b>${esc(o.ad)}</b> aslında hangisi? Doğrusunu öğret:`);
    const s=await new Promise(r=>secenekler(ds.siniflar.map((cc,n)=>({html:`<span class="em">${cc.em}</span>${esc(cc.ad)}`,cls:'k'+n,fn:()=>r(n)}))));dur(t);secKapat();
    G.egitim.push(Object.assign({},o,{s,gercek:o.s}));if(s!==o.s)G.yanlisOgretilen++;cizgiTemizle();rafCiz();SES.ogren();balon('Teşekkürler, bunu da öğrendim! 📚');}
  }else{await bekle(700);dur(t);robiDurum(dogru?'mutlu':'uzgun');balon(dogru?`Doğru! ${esc(o.ad)} → <b>${esc(ds.siniflar[o.s].ad)}</b> ✅`:`Yanıldım: ${esc(o.ad)} aslında <b>${esc(ds.siniflar[o.s].ad)}</b> ❌`);dogru?SES.dogru():SES.yanlis();
   if(serbest&&!dogru){await bekle(800);G.egitim.push(Object.assign({},o,{gercek:o.s}));rafCiz();balon('Bunu hafızama ekledim. 📚');}}
  sonuc.push({o,p,dogru});await bekle(sor?900:1300);dur(t);cizgiTemizle();}
 return{robDogru,n:liste.length,sonuc};}

 G.egitim=hatali.concat(eg.map((_,j)=>j).filter(j=>!hatali.includes(j))).map(j=>Object.assign({},eg[j],{gercek:eg[j].s,hataliIlk:hatali.includes(j),s:hatali.includes(j)?(eg[j].s+1)%ds.siniflar.length:eg[j].s}));rafCiz();
 balon('Dalgın Dede bana bazı şeyleri öğretti ama… sanki karıştırdı! 😅');bilgi(NOT.veri,5200);yonerge('Önce Robi\'yi deneyelim.');await new Promise(r=>secenekler([{html:'▶ Robi\'yi dene',cls:'notr',fn:()=>r()}]));dur(t);

 let bz=0,duz=0,boz=0;G.egitim.forEach(x=>{if(x.s!==x.gercek)bz++;if(x.hataliIlk&&x.s===x.gercek)duz++;if(!x.hataliIlk&&x.s!==x.gercek)boz++;});G.soruN=g.hata+boz;G.dogru=duz;rafCiz();

 const T2=await testTuru(t,test,false);dur(t);G.test2=T2.robDogru;bitir({robDogru:T2.robDogru,n:T2.n,once:T1.robDogru});}

/* ============ HARİTA (6–8. sınıf): en yakın komşu ============ */
const hc=$('hc'),hx=hc.getContext('2d');let HD={noktalar:[],test:null,kom:[],k:1,cizim:0};
const RENK=['#2a7de1','#e2477c','#18a957','#f08a24'];
function haritaBoyut(){const r=$('harita').getBoundingClientRect();const d=Math.min(3,Math.ceil(devicePixelRatio||1));hc.width=Math.max(10,Math.round(r.width*d));hc.height=Math.max(10,Math.round(r.height*d));hc._d=d;haritaCiz();}
addEventListener('resize',()=>{if($('harita').style.display==='block')haritaBoyut();});
function hP(x,y){const W=hc.width,H=hc.height,m=46*(hc._d||1);return[m+x*(W-m*1.6),H-m-y*(H-m*1.6)];}
function haritaCiz(){const W=hc.width,H=hc.height,d=hc._d||1;hx.clearRect(0,0,W,H);hx.fillStyle='#f8f9ff';hx.fillRect(0,0,W,H);
 if(!G||!G.ds)return;const ds=G.ds;
 /* hafif bölge boyama: Robi'nin karar haritası */
 if(G.egitim.length>=2&&HD.bolge){const n=26;for(let i=0;i<n;i++)for(let j=0;j<n;j++){const x=(i+.5)/n,y=(j+.5)/n;const p=tahmin({x,y},HD.k);const [a,b]=hP(i/n,(j+1)/n),[c,e]=hP((i+1)/n,j/n);hx.fillStyle=RENK[p.s]+'22';hx.fillRect(a,b,c-a+1,e-b+1);}}
 hx.strokeStyle='#c9d2f0';hx.lineWidth=2*d;const [x0,y0]=hP(0,0),[x1,y1]=hP(1,1);hx.beginPath();hx.moveTo(x0,y1);hx.lineTo(x0,y0);hx.lineTo(x1,y0);hx.stroke();
 hx.fillStyle='#56608a';hx.font=`800 ${14*d}px Nunito,sans-serif`;hx.textAlign='right';hx.fillText(ds.x,x1,y0+28*d);hx.save();hx.translate(x0-26*d,y1);hx.rotate(-Math.PI/2);hx.textAlign='right';hx.fillText(ds.y,0,0);hx.restore();
 /* komşu çizgileri */
 if(HD.test&&HD.kom.length){const [tx,ty]=hP(HD.test.x,HD.test.y);hx.setLineDash([8*d,7*d]);hx.lineWidth=3*d;HD.kom.forEach(k=>{const o=G.egitim[k.j];const [ax,ay]=hP(o.x,o.y);hx.strokeStyle='#b48a00';hx.beginPath();hx.moveTo(tx,ty);hx.lineTo(ax,ay);hx.stroke();});hx.setLineDash([]);
  const r=Math.max(...HD.kom.map(k=>{const o=G.egitim[k.j];const [ax,ay]=hP(o.x,o.y);return Math.hypot(ax-tx,ay-ty);}));hx.strokeStyle='#ffd34d';hx.lineWidth=3*d;hx.beginPath();hx.arc(tx,ty,r+10*d,0,Math.PI*2);hx.stroke();}
 const fs=26*d;hx.textAlign='center';hx.textBaseline='middle';
