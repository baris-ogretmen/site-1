.alt-logo{background:#1b2f86;padding:4px 14px;border-radius:8px;font-size:clamp(13px,1.8vw,20px);transform:rotate(-4deg);margin:10px 0 18px;letter-spacing:.5px}
.kartlar{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.mkart{width:210px;border-radius:22px;padding:14px 14px 16px;text-align:center;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.25),0 14px 30px rgba(0,0,0,.25);transition:transform .12s}
.mkart:active{transform:translateY(4px)}
.mkart .ik{font-size:46px;display:block}
.mkart .bs{font-size:21px;display:block;margin-top:4px}
.mkart .ac{font-size:14px;font-weight:700;opacity:.92;display:block;margin-top:4px;line-height:1.25}
.k1{background:linear-gradient(160deg,#ff9a3c,#e8541f)}.k2{background:linear-gradient(160deg,#25c3c9,#127a9e)}.k3{background:linear-gradient(160deg,#9b6cff,#5b34d6)}
.soluk{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.soluk button{background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:9px 14px;font-size:15px;opacity:.72;border:1px solid rgba(255,255,255,.3)}
.soluk button:hover{opacity:1}
.panel{background:linear-gradient(180deg,#2c3fb8,#1d2a86);border:3px solid #5a74ff;border-radius:22px;padding:18px 20px;max-width:min(560px,94vw);width:100%;box-shadow:0 18px 40px rgba(0,0,0,.4);text-align:center;max-height:92vh;overflow:auto}
.panel h2{font-family:"Lilita One","Arial Black",Nunito,system-ui,sans-serif;font-weight:400;font-size:clamp(30px,5vw,46px);margin:2px 0 10px;color:#ffcf3a;text-shadow:0 3px 0 #b5243f;transform:rotate(-2deg)}
.panel p{margin:6px 0;font-size:18px;line-height:1.35}
.btn{border-radius:16px;padding:13px 22px;font-size:20px;color:#2a1800;background:linear-gradient(180deg,#ffd84a,#f5a623);box-shadow:0 5px 0 #b56d00;margin:6px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b56d00}
.btn.mavi{background:linear-gradient(180deg,#5fb3ff,#2f6fd6);color:#fff;box-shadow:0 5px 0 #1a3f8f}
.btn.gri{background:linear-gradient(180deg,#e9ecf5,#b9c0d6);color:#1d2a50;box-shadow:0 5px 0 #7d86a3}
.btn.yesil{background:linear-gradient(180deg,#5ee08a,#22a755);color:#06301a;box-shadow:0 5px 0 #11703a}
.cubuk{height:16px;background:rgba(255,255,255,.18);border-radius:9px;overflow:hidden;margin:6px 0}
.cubuk i{display:block;height:100%;background:linear-gradient(90deg,#ffd84a,#f5a623);border-radius:9px}
.satir{display:flex;justify-content:space-between;font-size:16px;opacity:.9;text-transform:uppercase;letter-spacing:.5px}
.yildizlar{font-size:48px;letter-spacing:6px;margin:4px 0}
.yildizlar .s{filter:grayscale(1) brightness(.6)}
.cipler{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.cip{background:rgba(255,255,255,.14);color:#fff;border-radius:14px;padding:10px 14px;font-size:17px;border:2px solid transparent}
.cip.on{background:#ffcf3a;color:#2a1800;border-color:#fff}
.cip[disabled]{opacity:.35}
.adimlar{text-align:left;font-size:17px;line-height:1.4;margin:8px auto;max-width:460px;padding-left:22px}
/* oyun içi DOM */
#ust-sol{position:fixed;left:12px;top:max(10px,env(safe-area-inset-top));z-index:30;display:flex;gap:8px}
.yuvarlak{width:52px;height:52px;border-radius:14px;background:linear-gradient(180deg,#3a52d8,#22339a);color:#fff;font-size:22px;box-shadow:0 4px 0 #15206a;border:2px solid #6f86ff}
#kontrol{position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));z-index:30;display:flex;justify-content:space-between;align-items:flex-end;padding:0 12px;pointer-events:none}
#kontrol .grup{display:flex;gap:10px;pointer-events:auto;align-items:flex-end}
.yon{min-width:118px;height:84px;border-radius:20px;color:#fff;font-size:20px;line-height:1.05;box-shadow:0 5px 0 rgba(0,0,0,.3);border:3px solid rgba(255,255,255,.55);opacity:.88;touch-action:none}
.yon.basili{transform:translateY(3px);opacity:1;filter:brightness(1.15)}
.yon.sol{background:#2f7cf0}.yon.sag{background:#e53935}.yon.ileri{background:#22a755}.yon.geri{background:#f08a1c}
.yon.ipucu{animation:parla .6s infinite alternate}
@keyframes parla{to{box-shadow:0 0 0 6px #fff,0 0 26px #fff}}
#k-orta{display:flex;gap:8px;pointer-events:auto}
.kucuk{height:56px;border-radius:16px;padding:0 14px;background:rgba(20,30,90,.7);color:#fff;font-size:17px;border:2px solid rgba(255,255,255,.4)}
/* çocuk boyu */
body.cocuk-boyu #ust-sol{top:auto;bottom:108px}
body.cocuk-boyu .ekran{justify-content:flex-end;padding-bottom:18px}
body.cocuk-alcak .panel{max-height:50vh}
body.cocuk-alcak .ekran .logo{font-size:clamp(28px,5vw,60px)}
/* bildirim / rozet */
#rozet{position:fixed;left:8px;bottom:6px;z-index:60;font-size:12px;opacity:.45;background:rgba(0,0,0,.25);padding:3px 8px;border-radius:9px;cursor:pointer}
body.oyunda #rozet{display:none}
#bant{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:70;background:#14205e;border:2px solid #5a74ff;border-radius:14px;padding:8px 14px;font-size:14px;display:flex;gap:10px;align-items:center;max-width:94vw}
#bant button{background:none;color:#fff;font-size:18px}
#yeniSurum{position:fixed;right:10px;top:10px;z-index:80;background:#e11d48;color:#fff;border-radius:999px;padding:8px 14px;font-size:14px;animation:nabiz 1s infinite alternate}
@keyframes nabiz{to{box-shadow:0 0 0 8px rgba(225,29,72,.25)}}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(10,20,60,.9);padding:10px 16px;border-radius:12px;z-index:90;font-size:16px;transition:opacity .3s;pointer-events:none}
#qrKutu{background:#fff;padding:14px;border-radius:14px;display:inline-block;margin:8px 0}
#qrKutu img{display:block;width:220px;height:220px;image-rendering:pixelated}
.tablo{width:100%;border-collapse:collapse;font-size:13px;text-align:left}
.tablo th,.tablo td{padding:5px 6px;border-bottom:1px solid rgba(255,255,255,.15)}
input,select{font-family:inherit;font-weight:800;font-size:18px;border-radius:12px;border:2px solid #5a74ff;padding:10px 12px;background:#fff;color:#14205e;width:100%}
#yanCevir{z-index:95}
@media (max-height:520px){.mkart{width:170px;padding:10px}.mkart .ik{font-size:34px}.mkart .ac{display:none}.yon{min-width:92px;height:64px;font-size:16px}.kucuk{height:46px}.yuvarlak{width:44px;height:44px}}
@media print{html{zoom:1!important}}
</style>
</head>

const CAM={x:0,y:0,z:0,rx:1,rz:0,ux:0,uy:1,uz:0,fx:0,fy:0,fz:1,F:600,cx:0,cy:0};
const NEAR=.6;
function kamKur(px,py,pz,tx,ty,tz){
 CAM.x=px;CAM.y=py;CAM.z=pz;let fx=tx-px,fy=ty-py,fz=tz-pz;const l=Math.hypot(fx,fy,fz);fx/=l;fy/=l;fz/=l;
 let rx=fz,rz=-fx;const rl=Math.hypot(rx,rz)||1;rx/=rl;rz/=rl;
 CAM.fx=fx;CAM.fy=fy;CAM.fz=fz;CAM.rx=rx;CAM.rz=rz;CAM.ux=fy*rz;CAM.uy=fz*rx-fx*rz;CAM.uz=-fy*rx;
 CAM.F=H*1.02;CAM.cx=W/2;CAM.cy=H*.40;
}
function tc(x,y,z){const dx=x-CAM.x,dy=y-CAM.y,dz=z-CAM.z;return[dx*CAM.rx+dz*CAM.rz,dx*CAM.ux+dy*CAM.uy+dz*CAM.uz,dx*CAM.fx+dy*CAM.fy+dz*CAM.fz]}
function pr(c){return[CAM.cx+c[0]/c[2]*CAM.F,CAM.cy-c[1]/c[2]*CAM.F]}
function kirp(c){const o=[];for(let i=0;i<c.length;i++){const a=c[i],b=c[(i+1)%c.length],ai=a[2]>NEAR,bi=b[2]>NEAR;if(ai)o.push(a);if(ai!==bi){const t=(NEAR-a[2])/(b[2]-a[2]);o.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,NEAR])}}return o}
function poligon(camPts,fill,stroke,lw){
 let hepsi=true;for(const p of camPts)if(p[2]<=NEAR){hepsi=false;break}
 const c=hepsi?camPts:kirp(camPts);if(c.length<3)return false;
 ctx.beginPath();for(let i=0;i<c.length;i++){const s=pr(c[i]);if(i)ctx.lineTo(s[0],s[1]);else ctx.moveTo(s[0],s[1])}ctx.closePath();
 if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke()}return true;
}
function rgb(c,k,sis,sr){let r=c[0]*k,g=c[1]*k,b=c[2]*k;if(sis>0){r=lerp(r,sr[0],sis);g=lerp(g,sr[1],sis);b=lerp(b,sr[2],sis)}return'rgb('+(r|0)+','+(g|0)+','+(b|0)+')'}
function hex(h){h=h.replace('#','');return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]}

const R={aktif:false};

function rallyKur(seviye,demo){
 const s=sinif(),ana=s==='ana';
 const rng=mulberry(seviye*977+13+(demo?5:0));
 Object.assign(R,{aktif:true,demo:!!demo,seviye,tema:TEMA[Math.min(2,Math.floor((seviye-1)/3))],L:4,
  W:ana?19:(s==='12'?16.5:14),t:0,puan:0,para:0,kombo:1,komboT:0,dogruSay:0,kapiSay:0,olaylar:[],iz:[],duman:[],parcacik:[],afis:null,bitti:false,dustu:false,dusT:0,kontrol:0,yildizBildirim:0});
 R.hw=R.W/2;
 const N=demo?1400:(380+seviye*55);R.N=N;
 // kapılar
 R.kapilar=[];if(!demo){const ara=ana?110:95;for(let g=90;g<N-50;g+=ara+Math.floor(rng()*20))R.kapilar.push({i:g,q:soruUret(rng),gecti:false,sonuc:-1,soyle:false})}
 const duz=new Set();R.kapilar.forEach(k=>{for(let j=k.i-16;j<=k.i+8;j++)duz.add(j)});
 // eğrilik planı
 const plan=[],haz=[];for(let i=0;i<34;i++){plan.push(0);haz.push(0)}
 let h=0;const tahmin=()=>{let a=0;for(const d of plan)a+=d;return a};
 while(plan.length<N){
  const t=rng();const yon=(Math.abs(h)>.45?-Math.sign(h):(rng()<.5?-1:1));
  if(t<.34){const n=14+Math.floor(rng()*22);for(let i=0;i<n;i++){plan.push(0);haz.push(0)}}
  else if(t<.72){const n=16+Math.floor(rng()*20),d=yon*(.022+rng()*.026)*(ana?.6:1);for(let i=0;i<n;i++){plan.push(d);haz.push(0)}}
  else{const n=6+Math.floor(rng()*4),d=yon*(ana?.055:(.072+Math.min(seviye,10)*.003));for(let i=0;i<n;i++){plan.push(d);haz.push(1)}for(let i=0;i<8;i++){plan.push(0);haz.push(0)}}
  h=tahmin();
 }
 // noktalar
 R.p=[];let x=0,z=0;h=0;
 for(let i=0;i<N;i++){const d=duz.has(i)?0:plan[i];h=clamp(h+d,-1.15,1.15);R.p.push({x,z,h,haz:duz.has(i)?0:haz[i]});x+=Math.sin(h)*R.L;z+=Math.cos(h)*R.L}
 // kenar noktaları
 const kenar=(i,l)=>{const p=R.p[i];return[p.x+Math.cos(p.h)*l,p.z-Math.sin(p.h)*l]};R.kenar=kenar;
 // paralar
 R.paralar=[];for(let i=50;i<N-30;i+=28+Math.floor(rng()*14)){if(duz.has(i))continue;const off=(rng()-.5)*R.W*.5;for(let k=0;k<5;k++){const j=i+k*2;const p=R.p[j];R.paralar.push({i:j,l:off+Math.sin(k*.8)*1.2,al:false,x:p.x+Math.cos(p.h)*off,z:p.z-Math.sin(p.h)*off})}}
 // binalar
 R.binalar=[];for(let i=0;i<N;i+=3){for(const yan of[-1,1]){if(rng()<.25)continue;const p=R.p[i];const l=yan*(R.hw+14+rng()*rng()*130);const cx=p.x+Math.cos(p.h)*l,cz=p.z-Math.sin(p.h)*l;
  const w=8+rng()*20,d=8+rng()*20;const uz=Math.abs(l);const ust=uz<40?-(25+rng()*160):-(8+rng()*190);
  R.binalar.push({x0:cx-w/2,x1:cx+w/2,z0:cz-d/2,z1:cz+d/2,ust,alt:-1200,r:R.tema.bina[Math.floor(rng()*R.tema.bina.length)],kat:6+Math.floor(rng()*4),cati:rng()<.35})}}
 // bulutlar
 R.bulutlar=[];for(let i=0;i<N;i+=5){const n=1+Math.floor(rng()*2);for(let k=0;k<n;k++){const p=R.p[i];const l=(rng()-.5)*320;R.bulutlar.push({x:p.x+Math.cos(p.h)*l,z:p.z-Math.sin(p.h)*l+(rng()-.5)*20,y:-(40+rng()*170),s:30+rng()*60,v:Math.floor(rng()*4)})}}
 for(let i=0;i<N;i+=11){if(rng()<.5)continue;const p=R.p[i];const l=(rng()<.5?-1:1)*(R.hw+30+rng()*50);R.bulutlar.push({x:p.x+Math.cos(p.h)*l,z:p.z-Math.sin(p.h)*l,y:-4+rng()*8,s:14+rng()*12,v:Math.floor(rng()*4),ust:true})}
 // araba
 const p0=R.p[2];R.car={x:p0.x,z:p0.z,y:0,a:p0.h,vd:p0.h,v:0,idx:2,lat:0,vy:0,kayma:0,driftPuan:0,driftT:0,s:0};
 R.camA=p0.h;R.cp=2;R.camPos=null;
 if(!demo){R.hedef2=R.kapilar.length*450+N*2;R.hedef3=R.kapilar.length*700+N*5}

function rallyGuncelle(dt){
 const c=R.car;R.t+=dt;
 if(R.bitti)return;
 const vmax=(R.demo?26:HIZ[sinif()])*(1+(R.seviye-1)*.025);
 // giriş
 let s=0;
 if(R.demo||oto.acik){const j=Math.min(R.N-1,c.idx+5);let hedefLat=0;if(oto.acik){const k=R.kapilar.find(k=>!k.gecti&&k.i>c.idx);if(k&&k.i-c.idx<60){const n=k.q.secenek.length;hedefLat=-R.hw+(k.q.dogru+.5)*R.W/n}}const da=R.p[j].h-clamp((c.lat-hedefLat)*.09,-.5,.5)-(c.vd*.6+c.a*.4);s=clamp(da*2.6,-1,1)}
 else s=(tus.sag?1:0)-(tus.sol?1:0);
 c.s=lerp(c.s,s,clamp(dt*10,0,1));
 if(c.dustu){c.vy-=9.81*3.2*dt;c.y+=c.vy*dt;c.x+=Math.sin(c.vd)*c.v*dt;c.z+=Math.cos(c.vd)*c.v*dt;c.v*=.99;R.dusT+=dt;if(R.dusT>1.4&&!R.dustu){R.dustu=true;if(R.demo){rallyKur(R.seviye,true)}else rallyDustu()}return}
 c.v=Math.min(vmax,c.v+vmax*.55*dt);
 const hizOran=c.v/vmax;
 c.a+=c.s*(1.55+hizOran*.6)*dt*(sinif()==='ana'?.85:1);
 // kayma
 let tut=9;if(Math.abs(c.s)>.55&&hizOran>.6)tut=sinif()==='ana'?5.5:3.8;
 let fark=c.a-c.vd;c.vd+=fark*clamp(tut*dt,0,1);fark=c.a-c.vd;c.kayma=fark;
 if(sinif()==='ana'||sinif()==='12'){if(!s){const ph=R.p[Math.min(R.N-1,c.idx+3)].h;c.a+=((ph-c.a)*1.1-c.lat*.035)*dt*(sinif()==='ana'?1.4:.6)}}
 if((sinif()==='ana'||sinif()==='12')&&Math.abs(c.lat)>R.hw-1.6){const ph=R.p[c.idx].h;const ic=-Math.sign(c.lat);c.vd+=ic*.9*dt*Math.sign(Math.cos(c.vd-ph)||1);c.a+=ic*.6*dt}
 c.x+=Math.sin(c.vd)*c.v*dt;c.z+=Math.cos(c.vd)*c.v*dt;
 // yol üzerinde konum
 for(let k=0;k<8;k++){const i=c.idx;if(i>=R.N-2)break;const p=R.p[i];const dx=c.x-p.x,dz=c.z-p.z;const ileri=dx*Math.sin(p.h)+dz*Math.cos(p.h);if(ileri>R.L){c.idx++;kapiKontrol(c.idx)}else if(ileri<0&&i>0)c.idx--;else break}
 {const p=R.p[c.idx];const dx=c.x-p.x,dz=c.z-p.z;c.lat=dx*Math.cos(p.h)-dz*Math.sin(p.h)}
 // drift puanı
 const kay=Math.abs(fark);
 if(kay>.13&&c.v>vmax*.5){c.driftT+=dt;c.driftPuan+=c.v*kay*dt*5;R.komboT=0;
  if(Math.random()<dt*30){const yanY=Math.cos(c.a),yanZ=-Math.sin(c.a);for(const k of[-1,1]){const rx=c.x-Math.sin(c.a)*1.7+yanY*k,rz=c.z-Math.cos(c.a)*1.7+yanZ*k;R.duman.push({x:rx,y:.4,z:rz,r:.6,o:.5,t:0});R.iz.push([rx,rz,c.x-Math.sin(c.a)*1.7+yanY*k-Math.sin(c.vd)*.8,rz-Math.cos(c.vd)*.8])}if(R.iz.length>500)R.iz.splice(0,R.iz.length-500)}}
 else{if(c.driftPuan>20&&c.driftT>.25){const p=Math.round(c.driftPuan/5)*5;R.puan+=p*R.kombo;olay('KAYMA +'+p*R.kombo,'#7fe3ff');R.kombo=Math.min(10,R.kombo+1);if(!R.demo)SFX.kombo()}c.driftPuan=0;c.driftT=0;R.komboT+=dt;if(R.komboT>6&&R.kombo>1){R.kombo=1}}
 // paralar
 for(const m of R.paralar){if(m.al||Math.abs(m.i-c.idx)>3)continue;if(Math.hypot(m.x-c.x,m.z-c.z)<2.4){m.al=true;R.para++;R.puan+=10;if(!R.demo)SFX.para()}}
 // kenardan düşme
 if(Math.abs(c.lat)>R.hw+.7){c.dustu=true;c.vy=2;R.dusT=0;R.cp=Math.max(R.cp,c.idx-10);if(!R.demo)SFX.dus();R.kombo=1}
 // yıldız bildirimi
 if(!R.demo){if(R.yildizBildirim<1&&R.puan>=R.hedef2){R.yildizBildirim=1;afis('İKİ YILDIZ PUANI!','#ffd84a')}if(R.yildizBildirim<2&&R.puan>=R.hedef3){R.yildizBildirim=2;afis('ÜÇ YILDIZ PUANI!','#ffd84a')}}

 // duman / parçacık

 for(const p of R.parcacik){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=600*dt}R.parcacik=R.parcacik.filter(p=>p.t<1.2);
 R.olaylar.forEach(o=>o.t+=dt);R.olaylar=R.olaylar.filter(o=>o.t<2.6);
 if(R.afis){R.afis.t+=dt;if(R.afis.t>2)R.afis=null}
 // ses
 motorAyar(55+c.v*3.2+Math.abs(c.s)*12,R.demo?0:.05,kay>.13?.06:0);
}

 if(window.qrcode)ciz();else{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js';s.onload=ciz;s.onerror=()=>$('qrKutu').textContent='İnternet yok — QR yüklenemedi.';document.head.appendChild(s)}}
window.ZIRVE_paylasAc=paylasAc;

/* PWA */
function initPWA(){try{const m={name:'Bulut Rallisi · Gökyüzü Turu',short_name:'Bulut Rallisi',start_url:location.href.split('#')[0],display:'standalone',orientation:'landscape',background_color:'#2f6fd6',theme_color:'#2f6fd6',icons:[{src:ICONS.i192,sizes:'192x192',type:'image/png'},{src:ICONS.i512,sizes:'512x512',type:'image/png'},{src:ICONS.i512,sizes:'512x512',type:'image/png',purpose:'maskable'}]};
 const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(l);
 [['icon',ICONS.i512,'512x512'],['shortcut icon',ICONS.i192]].forEach(([r,h,s])=>{const k=document.createElement('link');k.rel=r;k.href=h;if(s)k.sizes=s;document.head.appendChild(k)});
 [['msapplication-TileColor','#2f6fd6'],['msapplication-TileImage',ICONS.i192],['msapplication-config','none']].forEach(([n,c])=>{const k=document.createElement('meta');k.name=n;k.content=c;document.head.appendChild(k)})}catch(e){}}

/* Sürüm rozeti + öz-kontrol + yeni sürüm uyarısı */
const MODULLER=['rallyKur','rallyGuncelle','rallyCiz','ucusKur','ucusGuncelle','ucusCiz','soruUret','siteyeDon','paylasAc','initPWA','cocukUygula','karsilamaAc'];
function modulKontrol(){return MODULLER.map(m=>[m,typeof window[m]==='function'])}
function surumBanner(){const once=LS.get('bulut_surum',null);const mk=modulKontrol();const ok=mk.filter(x=>x[1]).length;
 const b=document.createElement('div');b.id='bant';b.className='ui';
 b.innerHTML=(once&&once!==APP.surum?`🆕 v${once} → v${APP.surum} · Kod: ${APP.onceki.satir}→${APP.satir} satır`:`✅ v${APP.surum} · en güncel sürüm`)+` · 🧪 ${ok}/${mk.length} modül sağlam <button>✕</button>`;
 document.body.appendChild(b);b.querySelector('button').onclick=()=>b.remove();setTimeout(()=>b.remove(),5000);LS.set('bulut_surum',APP.surum);
 $('rozet').textContent='v'+APP.surum+' ✓';$('rozet').onclick=()=>{const mk=modulKontrol();pencere(`<h2>v${APP.surum}</h2><p style="font-size:15px">Önceki: v${APP.onceki.surum} · ${APP.onceki.satir} satır · ${APP.onceki.kb} KB<br>Şimdiki: ${APP.satir} satır · ${APP.kb} KB (+${APP.satir-APP.onceki.satir})</p><ul class="adimlar">${APP.yenilikler.map(y=>`<li>${y}</li>`).join('')}</ul><p style="font-size:14px">${mk.map(m=>(m[1]?'✅ ':'❌ ')+m[0]).join(' · ')}</p>`)}}
let damga=null;
async function surumDamga(){if(!/^https?:/.test(location.protocol))return null;try{let r=await fetch(location.href.split('#')[0].split('?')[0]+'?_v='+Date.now(),{method:'HEAD',cache:'no-store'});if(!r.ok)r=await fetch(location.href.split('#')[0].split('?')[0]+'?_v='+Date.now(),{cache:'no-store'});return r.headers.get('etag')||r.headers.get('last-modified')}catch(e){return null}}
async function surumKontrol(){if(surumKontrol.son&&Date.now()-surumKontrol.son<15000)return;surumKontrol.son=Date.now();const d=await surumDamga();if(!d)return;if(!damga){damga=d;return}if(d!==damga&&!$('yeniSurum')){const b=document.createElement('button');b.id='yeniSurum';b.textContent='🔴 Yeni sürüm yayınlandı · Yenile';b.onclick=()=>{location.href=location.href.split('#')[0].split('?')[0]+'?_r='+Date.now()};document.body.appendChild(b)}}
addEventListener('focus',surumKontrol);document.addEventListener('visibilitychange',()=>{if(!document.hidden)surumKontrol()});setInterval(surumKontrol,120000);

let son=performance.now();
function dongu(t){
 const dt=Math.min(.05,(t-son)/1000);son=t;dtSon=dt;
 ctx.setTransform(DPR,0,0,DPR,0,0);
 if(durum==='rally'){rallyGuncelle(dt);rallyCiz();rallyHUD()}
 else if(durum==='ucus'){ucusGuncelle(dt);ucusCiz()}
 else if(durum==='mola'||durum==='bitti'||durum==='dustu'){if(molaOnce==='ucus'&&F.aktif||(!R.aktif&&F.aktif)){ucusCiz()}else if(R.aktif){if(durum==='dustu'||durum==='bitti')rallyGuncelle(dt);rallyCiz();rallyHUD()}}
 else{if(R.aktif){rallyGuncelle(dt);rallyCiz()}}
 // parçacıklar (rally HUD dışında)
 requestAnimationFrame(dongu);
}
addEventListener('resize',()=>{boyut();if(F.aktif){KS=H/LH;LW=W/KS}yanKontrol()});
function yanKontrol(){const tel=Math.min(screen.width,screen.height)<600&&('ontouchstart' in window);$('yanCevir').classList.toggle('gizli',!(tel&&innerHeight>innerWidth&&LS.get('bulut_yan_tamam','0')!=='1'))}
boyut();bulutUret();initPWA();cocukUygula();
rallyKur(2,true);durumAyarla('menu');requestAnimationFrame(dongu);
ZGIRIS.baslat({oyun:OYUN_ADI,renk:'#2f6fd6'}).then(()=>{ogrenciSinifindan();menuAc();surumBanner();if(!karsilamaAc(false))yanKontrol();surumKontrol()});
