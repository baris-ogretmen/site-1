<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Hikaye Yükleyici - İmam Rabbani</title><meta name="description" content="Hikaye Yükleyici - İmam Rabbani — Barış Öğretmen&#x27;in tarayıcıda ücretsiz çalışan eğitsel çalışması. baris-ogretmen.github.io/site-1"><meta property="og:title" content="Hikaye Yükleyici - İmam Rabbani"><meta property="og:description" content="Hikaye Yükleyici - İmam Rabbani — Barış Öğretmen&#x27;in tarayıcıda ücretsiz çalışan eğitsel çalışması. baris-ogretmen.github.io/site-1"><meta property="og:url" content="https://baris-ogretmen.github.io/site-1/hikaye-yukle.html"><meta property="og:type" content="website">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #fff7ed; }
        .box { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; border: 3px solid #ea580c; max-width: 600px; }
        h1 { color: #c2410c; margin-bottom: 15px; }
        p { color: #4b5563; font-size: 1.1rem; }
        button { background: #ea580c; color: white; border: none; padding: 15px 30px; font-size: 1.3rem; font-weight: bold; border-radius: 10px; cursor: pointer; transition: 0.3s; margin-top: 20px; width: 100%; box-shadow: 0 5px 15px rgba(234, 88, 12, 0.3); }
        button:hover { background: #c2410c; transform: translateY(-2px); }
        #status { margin-top: 20px; font-weight: bold; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div class="box">
        <h1>📚 "Kalplerin Kandili" Kitabını Yükle</h1>
        <p>Aşağıdaki butona bastığın an hikaye veritabanına işlenecek, <b>Mavi Kutu'ya</b> ve <b>E-Kitaplarım</b> listesine otomatik olarak eklenecektir.</p>
        <button onclick="kitabiYukle()">HİKAYEYİ YAYINLA 🚀</button>
        <div id="status"></div>
    </div>

    <script>
        function kitabiYukle() {
            const db = firebase.firestore();
            const status = document.getElementById("status");
            status.innerHTML = "⏳ İşleniyor... Lütfen bekleyin.";
            status.style.color = "orange";

            // --- SENİN HİKAYEN (Renklendirilmiş ve Düzenlenmiş Hali) ---
            const kitapVerisi = {
                baslik: "Kalplerin Kandili: İmam Rabbani’nin Yolculuğu",
                tarih: firebase.firestore.FieldValue.serverTimestamp(),
                sayfalar: [
                    {
                        // SAYFA 1
                        img: "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiQ5yN7j4t8gXqJq5Z8kL9mN0oP1qR2sT3uV4wX5yZ6aB7cC8dD9eE0fF1gH2iJ3kL4mN5oP6qR7sT8uV9wX0yZ1aB2cC3dD4eE5fF6gH7iJ8kL9mN0oP1qR2/s1600/imam-rabbani.jpg", 
                        text: "<h2 style='color:#ea580c;'>Kalplerin Kandili</h2><br>Çok uzun zaman önce, Hindistan’ın Sarhind kasabasında <b>Ahmad</b> adında bir çocuk yaşardı. Ahmad, akranları oyun oynarken bile elinden kitabını düşürmezdi.<br><br>Babası Abdal-Ahad, oğlundaki bu öğrenme aşkını görünce gülümsedi:<br><br><b style='color:#d97706; font-size:1.2rem;'>'Bilgi, karanlıkta yolunu bulmanı sağlayan bir yıldızdır Ahmad.'</b><br><br>Küçük Ahmad o gece söz verdi: Sadece kendisi için değil, herkes için bir ışık olacaktı."
                    },
                    {
                        // SAYFA 2
                        img: "https://img.freepik.com/free-vector/gradient-library-interior-background_23-2149330623.jpg", 
                        text: "Yıllar geçtikçe Ahmad’ın kalbindeki merak daha da büyüdü. Sadece kitaplardaki bilgileri değil, hayatın ve sevginin anlamını da merak ediyordu.<br><br>Bir gün şöyle düşündü:<br><b style='color:#2563eb;'>'Gerçek bilgi sadece zihinle değil, kalple öğrenilir.'</b><br><br>Bu düşünceyle, ruhunu eğitecek büyük bir öğretmen aramaya karar verdi."
                    },
                    {
                        // SAYFA 3
                        img: "https://img.freepik.com/free-vector/teacher-standing-near-blackboard-holding-stick-isolated-flat-vector-illustration-cartoon-woman-character-near-chalkboard-school-learning-concept_74855-13272.jpg", 
                        text: "Sonunda Delhi'de bilge öğretmen Baqi ile tanıştı. Baqi ona sabretmeyi ve her canlının içindeki güzelliği görmeyi öğretti.<br><br>Eğitimini tamamlayan Ahmad, artık <b>'İmam Rabbani'</b> (Kendini Allah'a adayan önder) olarak anılıyordu.<br><br>Genç öğrencisi Sami'ye en büyük dersi şöyle verdi:<br><b style='color:#059669; font-size:1.2rem;'>'Dürüstlük ve sevgiyle yoğrulmuş bir ahlaktır evladım.'</b>"
                    },
                    {
                        // SAYFA 4
                        img: "https://img.freepik.com/free-vector/hand-drawn-essay-illustration_23-2150268421.jpg", 
                        text: "Zamanla haksızlıklar artınca İmam Rabbani doğruyu söylediği için bir kaleye hapsedildi. Ancak o, karanlık zindanı bile bir okul haline getirdi.<br><br>Zindandan çıktığında artık <b>'Bin Yılın Yenileyicisi'</b> olarak anılıyordu. Binlerce sayfalık mektuplar yazdı.<br><br><b style='color:#dc2626;'>Yazdığı her kelime, bir kalbi iyileştiriyordu.</b>"
                    },
                    {
                        // SAYFA 5 (SON)
                        img: "https://img.freepik.com/free-vector/mosque-landscape-background_1308-27807.jpg", 
                        text: "İmam Rabbani’nin en büyük mirası, yazdığı <b>'Mektubat'</b> isimli eseriydi. O, 'Bilgi paylaştıkça çoğalan bir hazinedir,' derdi.<br><br>Bugün bile bir çocuk dürüst olduğunda, İmam Rabbani’nin ektiği o tohumlar çiçek açıyor.<br><br><b style='color:#ea580c;'>Kalbinde sevgi ve zihninde doğru bilgi olan hiç kimse, yolunu asla kaybetmez.</b><br><br><b>-SON-</b>"
                    }
                ]
            };

            // 1. KİTABI YARAT (Dijital Kütüphane)
            db.collection("dijital_kitaplar").add(kitapVerisi).then((docRef) => {
                
                // --- OTOMATİK LİNK OLUŞTURMA SİHİRBAZI ---
                // ID'yi aldık, linki biz oluşturuyoruz. Senin yapmana gerek yok.
                const otomatikLink = `kitap-oku.html?id=${docRef.id}`;

                // 2. LİSTEYE EKLE (E-Kitaplarım Kısmı)
                db.collection("kitaplar").add({
                    baslik: kitapVerisi.baslik,
                    altBaslik: "Gönüller Sultanı", // Alt başlık
                    link: otomatikLink, // Linki buraya otomatik koyduk
                    renk: "linear-gradient(135deg, #f97316, #c2410c)", // Turuncu Kapak
                    sira: 9999, // En üstte dursun
                    tarih: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    
                    // 3. MAVİ KUTUYA YAPIŞTIR (Vitrin)
                    db.collection("site_ayarlari").doc("vitrin_kitap").set({
                        baslik: kitapVerisi.baslik,
                        link: otomatikLink // Linki buraya da otomatik koyduk
                    });

                    // 4. BİLGİLENDİRME
                    status.innerHTML = "✅ İŞLEM TAMAM! Kitap her yere eklendi.";
                    status.style.color = "green";
                    alert("Harika! Kitap yüklendi.\n1. Mavi Kutu güncellendi.\n2. Kitap Listesine eklendi.\n\nŞimdi ana sayfaya gidip bakabilirsin.");
                });

            }).catch((error) => {
                status.innerHTML = "❌ HATA: " + error.message;
                status.style.color = "red";
            });
        }
    </script>

ity='1'};b.onmouseleave=function(){b.style.opacity='.6'};(document.body||document.documentElement).appendChild(b)}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',kur);else kur();setInterval(kur,1500)}catch(e){}})();</script>
</body>
</html>
