<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalem Masalları — Hareketli Hikâye Atölyesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Baloo+Bhaijaan+2:wght@500;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--cork:#CFA878;--cork-d:#A97F4F;--cork-l:#E3C497;--board-ink:#2E3136;--paper:#FFFEF8;--ink:#2E3136;--orange:#F39A2B;--blue:#3F7FD1;--grass:#7DBA4A;--pink:#F6A5C0;--mint:#9ED9C8;
--ui:"Baloo 2","Baloo Bhaijaan 2",system-ui,sans-serif;--hand:"Caveat","Baloo Bhaijaan 2",cursive;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cork:#5E4630;--cork-d:#3F2E1E;--cork-l:#75583B;--board-ink:#F6EBDD}}
:root[data-theme="dark"]{--cork:#5E4630;--cork-d:#3F2E1E;--cork-l:#75583B;--board-ink:#F6EBDD}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:var(--ui);color:var(--board-ink);background-color:var(--cork);
background-image:radial-gradient(var(--cork-d) 1px,transparent 1.7px),radial-gradient(var(--cork-l) 1px,transparent 1.7px);background-size:7px 7px,11px 11px;background-position:0 0,3px 5px;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;padding:14px 22px 10px}
.brand{margin-right:auto;min-width:0}
.brand h1{margin:0;font:700 clamp(38px,5vw,56px)/.9 var(--hand);letter-spacing:.5px}
.brand .under{display:block;width:230px;height:16px;margin-top:-2px}
.brand .under path{fill:none;stroke:var(--orange);stroke-width:5;stroke-linecap:round;stroke-dasharray:320;stroke-dashoffset:320;animation:ul 1.2s .3s ease-out forwards}
@keyframes ul{to{stroke-dashoffset:0}}
.brand p{margin:2px 0 0;font-weight:600;font-size:15px;opacity:.85}
.paperbtn{background:var(--paper);color:var(--ink);border:2.5px solid var(--ink);border-radius:14px 18px 12px 20px/18px 12px 20px 14px;padding:6px 14px;font-weight:700;box-shadow:3px 4px 0 rgba(46,49,54,.25);transition:transform .15s}
.paperbtn:hover{transform:translateY(-2px) rotate(-.6deg)}
.paperbtn[aria-pressed="true"]{background:var(--orange)}
.group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.group .lbl{font-weight:700;font-size:14px}
.langs .paperbtn[aria-pressed="true"]{background:var(--blue);color:#fff}
.board{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;padding:6px 22px 26px;align-items:start}
@media (max-width:980px){.board{grid-template-columns:1fr}}
.stage-wrap{position:relative;aspect-ratio:16/9;background:var(--paper);box-shadow:0 12px 26px rgba(50,30,10,.4);transform:rotate(-.3deg);container-type:inline-size;border-radius:3px;overflow:hidden}
.stage-wrap svg{display:block;width:100%;height:100%;touch-action:manipulation}
.stage-wrap svg.drawing{touch-action:none;cursor:crosshair}
.tape{position:absolute;width:120px;height:30px;z-index:5;opacity:.78;pointer-events:none}
.tape.t1{top:-8px;left:-26px;transform:rotate(-32deg);background:var(--pink)}
.tape.t2{top:-8px;right:-26px;transform:rotate(32deg);background:var(--mint)}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.5;z-index:2}
#bubble{position:absolute;max-width:46%;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:28px 32px 26px 30px;padding:.35em .85em .45em;font:700 max(15px,2.5cqw)/1.2 var(--hand);box-shadow:4px 5px 0 rgba(46,49,54,.18);z-index:3;pointer-events:none;transform:translate(-50%,-100%)}
#bubble::after{content:"";position:absolute;left:50%;bottom:-13px;width:22px;height:22px;background:#fff;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
#bubble.below{transform:translate(-50%,0)}
#bubble.below::after{bottom:auto;top:-13px;transform:translateX(-50%) rotate(225deg)}
.ar{font-family:"Baloo Bhaijaan 2",var(--ui)!important}
.w.on{background:#FFE27A;border-radius:.2em;box-shadow:0 0 0 .08em #FFE27A}
.caption{position:relative;margin-top:16px;background:var(--paper);color:var(--ink);padding:12px 22px;min-height:84px;box-shadow:0 6px 14px rgba(50,30,10,.3);transform:rotate(.25deg)}
.caption::before{content:"";position:absolute;top:-10px;left:50%;width:90px;height:22px;background:#FFE27A;opacity:.75;transform:translateX(-50%) rotate(-2deg)}
#capText{font:700 clamp(21px,2.5vw,36px)/1.25 var(--hand)}
#capNote{margin:4px 0 0;font-size:13px;color:#9A3B1F;font-weight:600}
#capNote:empty{display:none}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:16px}
.cbtn{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:3px 4px 0 rgba(46,49,54,.3)}
.cbtn svg{width:24px;height:24px}
.cbtn.play{width:70px;height:70px;background:var(--orange)}
.cbtn.play svg{width:32px;height:32px}
#dots{display:flex;gap:8px;margin:0 6px}
#dots button{width:20px;height:20px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);padding:0}
#dots button.on{background:var(--orange)}
#dots button.done{background:#FFD9A8}
.shelf{display:flex;flex-direction:column;gap:14px}
.shelf h2{margin:0;font:700 34px/1 var(--hand)}
.shelf h3{margin:6px 0 0;font:700 24px/1 var(--hand)}
.card{position:relative;display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--paper);color:var(--ink);border:none;padding:14px 14px 12px;box-shadow:0 5px 12px rgba(50,30,10,.35);background-image:linear-gradient(transparent 27px,#F08A8A 27px,#F08A8A 29px,transparent 29px),repeating-linear-gradient(transparent 0 25px,#BFD8F0 25px 26px);background-position:0 0,0 30px;transition:transform .2s}
.card:nth-child(odd){transform:rotate(-.8deg)}.card:nth-child(even){transform:rotate(.7deg)}
.card:hover{transform:rotate(0) translateY(-3px)}
.card.on{outline:4px solid var(--orange);outline-offset:3px}
.card .pin{position:absolute;top:-7px;left:50%;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FF8F8F,#C62828);box-shadow:1px 2px 2px rgba(0,0,0,.4)}
.card .ic svg{width:54px;height:54px;flex:none}
.card b{display:block;font:700 26px/1 var(--hand)}
.card small{display:block;font-size:13px;font-weight:600;line-height:1.3;margin-top:3px}
.card small.gr{opacity:.7}
.teacher{background:var(--paper);color:var(--ink);padding:12px 16px;box-shadow:0 5px 12px rgba(50,30,10,.3);font-size:14.5px;line-height:1.45}
.teacher summary{font:700 24px var(--hand);cursor:pointer}
.teacher dt{font-weight:800;margin-top:8px}.teacher dd{margin:0}
.teacher ul{margin:2px 0 0;padding-left:18px}
.teacher .mm{margin-top:10px;font-size:12.5px;opacity:.8}
.hint{margin:0;background:var(--paper);color:var(--ink);padding:10px 14px;font-weight:600;font-size:14.5px;box-shadow:0 4px 10px rgba(50,30,10,.3)}
#crayons,#stamps,#heroes{display:flex;flex-wrap:wrap;gap:8px}
.crayon{width:40px;height:52px;border:none;background:none;padding:0;position:relative}
.crayon span{position:absolute;inset:10px 6px 0;border:2.5px solid var(--ink);border-radius:4px 4px 6px 6px}
.crayon span::before{content:"";position:absolute;left:50%;top:-14px;transform:translateX(-50%);border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:12px solid currentColor}
.crayon[aria-pressed="true"]{transform:translateY(-8px)}
.stamp{display:flex;flex-direction:column;align-items:center;width:70px;padding:6px 2px;font-size:12.5px;line-height:1.1}
.stamp .e{font-size:26px}
.big{width:100%;padding:10px;font-size:18px;background:var(--grass)!important}
.sayrow{display:flex;gap:8px}
.sayrow input{flex:1;min-width:0;font:600 16px var(--ui);padding:8px 12px;border:2.5px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
#quiz{position:absolute;inset:0;background:rgba(255,254,248,.94);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqw;z-index:4;padding:3cqw;text-align:center}
#quiz .qq{margin:0;font:700 4.3cqw/1.15 var(--hand);max-width:90%}
#quiz .qopts{display:flex;gap:2.4cqw;flex-wrap:wrap;justify-content:center}
#quiz .qo{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:22px 26px 20px 28px;padding:1.3cqw 2cqw;display:flex;flex-direction:column;align-items:center;gap:.5cqw;width:24cqw;font:700 max(14px,2.3cqw)/1.1 var(--hand);box-shadow:5px 6px 0 rgba(46,49,54,.2);transition:transform .15s}
#quiz .qo:hover{transform:translateY(-4px)}
#quiz .qe{font-size:6cqw;line-height:1}
#quiz .qo.right{background:#D8F0C4;border-color:#3E7D2E;transform:scale(1.06)}
#quiz .qo.wrong{animation:shake .4s}
#quiz .qend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
@keyframes shake{25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}
.conf{position:absolute;top:-20px;width:12px;height:18px;z-index:6;pointer-events:none;border-radius:2px}
/* SVG sahne */
.tc{font-family:var(--hand);font-weight:700;font-size:150px;fill:#2E3136;stroke:#2E3136;stroke-width:2.5}
.prop{transform-box:fill-box}
.a-float{animation:floaty 7s ease-in-out infinite alternate}@keyframes floaty{to{transform:translateX(34px)}}
.a-rain{animation:rainf .5s linear infinite}@keyframes rainf{from{transform:translateY(-10px)}to{transform:translateY(16px)}}
.a-sway{transform-origin:50% 100%;animation:sway 3.6s ease-in-out infinite alternate}@keyframes sway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
.a-shiver{animation:shiver .1s linear infinite alternate}@keyframes shiver{from{transform:translateX(-2px)}to{transform:translateX(2px)}}
.a-bounce{transform-origin:50% 100%;animation:bounce .7s ease-in-out infinite alternate}@keyframes bounce{to{transform:translateY(-16px)}}
.a-beat{transform-origin:50% 50%;animation:beat .9s ease-in-out infinite alternate}@keyframes beat{to{transform:scale(1.14)}}
.a-pulse{transform-origin:50% 50%;animation:pulse 2.4s ease-in-out infinite alternate}@keyframes pulse{to{transform:scale(1.05)}}
.a-twinkle{transform-origin:50% 50%;animation:twk 1.4s ease-in-out infinite alternate}@keyframes twk{from{transform:rotate(-8deg) scale(.92)}to{transform:rotate(8deg) scale(1.08)}}
.a-wave{transform-origin:0 100%;animation:flagw 1.4s ease-in-out infinite alternate}@keyframes flagw{to{transform:skewY(-4deg)}}
.a-fly{animation:fly 1.6s ease-in-out infinite alternate}@keyframes fly{to{transform:translate(26px,-14px)}}
.a-shimmer{animation:shim 3s ease-in-out infinite alternate}@keyframes shim{to{transform:translateX(8px)}}
.chr .arm,.chr .leg{transition:transform .28s ease}
.chr.walking .legA{animation:stepA .42s ease-in-out infinite alternate}
.chr.walking .legB{animation:stepA .42s ease-in-out infinite alternate-reverse}
.chr.walking .armA{animation:swing .42s ease-in-out infinite alternate-reverse}
.chr.walking .armB{animation:swing .42s ease-in-out infinite alternate}
.chr.walking .bodyb{animation:bob .21s ease-in-out infinite alternate}
@keyframes stepA{from{transform:rotate(24deg)}to{transform:rotate(-24deg)}}
@keyframes swing{from{transform:rotate(18deg)}to{transform:rotate(-18deg)}}
@keyframes bob{to{transform:translateY(-4px)}}
.chr.pose-hold .armA{transform:rotate(-140deg);animation:none}
.chr.pose-fwd .armA{transform:rotate(-75deg);animation:none}
.chr.pose-carry .arm{transform:rotate(-60deg);animation:none}
.chr.act-jump .bodyb{animation:jump .6s ease-out 3}@keyframes jump{0%,100%{transform:translateY(0)}45%{transform:translateY(-55px)}}
.chr.act-tired .bodyb{animation:breathe 1.6s ease-in-out infinite alternate}@keyframes breathe{to{transform:translateY(5px)}}
.chr.act-wave .armA{animation:wave .45s ease-in-out infinite alternate}@keyframes wave{from{transform:rotate(-165deg)}to{transform:rotate(-118deg)}}
.chr.act-water .wc{animation:tilt 1.1s ease-in-out infinite alternate}@keyframes tilt{to{transform:rotate(24deg)}}
.chr .acc{display:none}
.chr.has-umbrella .acc-umbrella,.chr.has-water .acc-water,.chr.has-sweat .acc-sweat{display:inline}
.chr .umb{transition:transform .5s cubic-bezier(.3,1.3,.6,1)}
.chr.has-share .umb{transform:rotate(24deg)}
.acc-sweat{animation:sweat 1s ease-in infinite}@keyframes sweat{from{transform:translateY(0);opacity:1}to{transform:translateY(14px);opacity:0}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.scarf{animation:scarf 1.1s ease-in-out infinite alternate}@keyframes scarf{from{transform:rotate(-6deg)}to{transform:rotate(9deg)}}
.paused *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.prop,.eyes,.scarf,.acc-sweat{animation:none!important}.brand .under path{animation:none;stroke-dashoffset:0}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>Kalem Masalları</h1>
    <svg class="under" viewBox="0 0 300 20" aria-hidden="true"><path d="M4 12 C60 4 120 18 180 9 S270 6 296 11"/></svg>
    <p>Barış Öğretmen'in hareketli hikâye atölyesi</p>
  </div>
  <div class="group modes" role="group" aria-label="Bölüm">
    <button class="paperbtn" data-mode="story" aria-pressed="true">Hikâyeler</button>
    <button class="paperbtn" data-mode="atelier" aria-pressed="false">Çizim atölyesi</button>
  </div>
  <div class="group langs" role="group" aria-label="Hikâye dili">
    <span class="lbl">Hikâye dili</span>
    <button class="paperbtn" data-lang="tr" aria-pressed="true">Türkçe</button>
    <button class="paperbtn" data-lang="en" aria-pressed="false">English</button>
    <button class="paperbtn" data-lang="de" aria-pressed="false">Deutsch</button>
    <button class="paperbtn ar" data-lang="ar" aria-pressed="false">العربية</button>
  </div>
  <div class="group">
    <button class="paperbtn" id="sndB" aria-pressed="true">Ses açık</button>
    <button class="paperbtn" id="spdB">Hız: normal</button>
    <button class="paperbtn" id="fsB">Tam ekran</button>
  </div>
</header>
<main class="board">
  <section>
    <div class="stage-wrap" id="stageWrap">
      <span class="tape t1"></span><span class="tape t2"></span>
      <svg id="stage" viewBox="0 0 1600 900" role="img" aria-label="Hikâye sahnesi">
        <defs id="defs"><radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop offset="70%" stop-color="#fff" stop-opacity="0"/><stop offset="100%" stop-color="#E9DFC8" stop-opacity=".7"/></radialGradient></defs>
        <rect width="1600" height="900" fill="#FFFEF8"/><rect width="1600" height="900" fill="url(#vig)"/>
        <g id="L-draw"></g><g id="L-user"></g><g id="L-chars"></g><g id="L-fx"></g>
        <g id="eraser" style="display:none"><rect x="-56" y="-30" width="112" height="60" rx="12" fill="#F6A5C0" stroke="#2E3136" stroke-width="3.5"/><path d="M8 -30 L44 -30 Q56 -30 56 -18 L56 18 Q56 30 44 30 L8 30Z" fill="#3F7FD1" stroke="#2E3136" stroke-width="3.5"/><text x="31" y="7" text-anchor="middle" font-size="18" fill="#fff" font-family="Baloo 2" font-weight="800">SİL</text></g>
        <g id="pencil" transform="translate(1760 -100) rotate(28)">
          <g id="penShadow" transform="translate(10 6)" opacity=".16"><path d="M0 0 L-24 -74 L-24 -1100 L24 -1100 L24 -74Z" fill="#000"/></g>
          <path d="M-22 -72 L-22 -1100 L22 -1100 L22 -72Z" fill="#F39A2B"/>
          <path d="M-22 -72 L-22 -1100 L-8 -1100 L-8 -72Z" fill="#F8B45A"/>
          <path d="M8 -72 L8 -1100 L22 -1100 L22 -72Z" fill="#D9801A"/>
          <path d="M-22 -72 L-22 -1100 M22 -72 L22 -1100 M-8 -80 L-8 -1100 M8 -80 L8 -1100" stroke="#2E3136" stroke-width="2.5" opacity=".85"/>
          <path d="M-22 -72 Q-15 -62 -8 -72 Q0 -62 8 -72 Q15 -62 22 -72 L7 -22 L-7 -22Z" fill="#F3D3A6" stroke="#2E3136" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M-7 -22 L0 0 L7 -22Z" fill="#3A3A3A"/>
          <text x="0" y="-300" transform="rotate(-90 0 -300)" text-anchor="middle" dominant-baseline="middle" font-family="Baloo 2" font-weight="800" font-size="19" fill="#9A560F">KALEM MASALLARI  HB</text>
        </g>
      </svg>
      <div id="grain"></div>
      <div id="bubble" hidden><div class="bt"></div></div>
      <div id="quiz" hidden></div>
    </div>
    <div class="caption"><div id="capText" aria-live="polite"></div><p id="capNote"></p></div>
    <div class="controls" id="ctrl">
      <button class="cbtn" id="prevB" aria-label="Önceki sahne"><svg viewBox="0 0 24 24"><path d="M6 5v14M19 5 9 12l10 7z" fill="#2E3136" stroke="#2E3136" stroke-width="2.5" stroke-linejoin="round"/></svg></button>
      <button class="cbtn play" id="playB" aria-label="Oynat"><svg viewBox="0 0 24 24" id="playIc"><path d="M7 4l13 8-13 8z" fill="#2E3136" stroke="#2E3136" stroke-width="2" stroke-linejoin="round"/></svg></button>
      <button class="cbtn" id="nextB" aria-label="Sonraki sahne"><svg viewBox="0 0 24 24"><path d="M18 5v14M5 5l10 7-10 7z" fill="#2E3136" stroke="#2E3136" stroke-width="2.5" stroke-linejoin="round"/></svg></button>
      <div id="dots" role="group" aria-label="Sahneler"></div>
      <button class="paperbtn" id="againB">Sahneyi tekrarla</button>
    </div>
  </section>
  <aside class="shelf" id="shelfStory">
    <h2>Hikâye seç</h2>
    <div id="cards" class="shelf"></div>
    <details class="teacher" open><summary>Öğretmen notu</summary><div id="tnote"></div></details>
  </aside>
  <aside class="shelf" id="shelfAtelier" hidden>
    <h2>Çizim atölyesi</h2>
    <p class="hint">Kâğıda bir yol çiz, sonra kahramanını o yolda yürüt. Bir damga seçip kâğıda dokunursan kalem senin için çizer.</p>
    <h3>Kalem</h3><div id="crayons"></div>
    <h3>Damgalar</h3><div id="stamps"></div>
    <h3>Kahraman</h3><div id="heroes"></div>
    <button class="paperbtn big" id="walkB">Kahramanı yolda yürüt</button>
    <div class="sayrow"><input id="sayIn" placeholder="Kahramanın ne söylesin?" aria-label="Kahramanın söyleyeceği cümle"><button class="paperbtn" id="sayB">Söylet</button></div>
    <div class="row"><button class="paperbtn" id="undoB">Geri al</button><button class="paperbtn" id="clearB">Sayfayı temizle</button></div>
  </aside>
</main>
<script>
const NS='http://www.w3.org/2000/svg',INK='#2E3136',SKIN='#F6D2B0';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function el(t,a={},p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const svg=$('#stage'),L={draw:$('#L-draw'),user:$('#L-user'),chars:$('#L-chars'),fx:$('#L-fx')};
const pencilEl=$('#pencil'),penShadow=$('#penShadow'),eraserEl=$('#eraser');
let soundOn=true,speedMul=1,curLang='tr',mode='story';
/* rastgele (tohumlu) */
let _s=1;function seed(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}_s=(h>>>0)||1;}
function rnd(){_s|=0;_s=_s+0x6D2B79F5|0;let t=Math.imul(_s^_s>>>15,1|_s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
const f1=n=>Math.round(n*10)/10;
function sk(pts,o={}){const j=o.jit??2.2;const p=pts.map(([x,y])=>[x+(rnd()-.5)*2*j,y+(rnd()-.5)*2*j]);
 if(o.straight)return'M'+p.map(q=>f1(q[0])+' '+f1(q[1])).join(' L')+(o.closed?' Z':'');
 const n=p.length,cl=!!o.closed,g=i=>cl?p[(i+n)%n]:p[Math.max(0,Math.min(n-1,i))];
 let d=`M${f1(p[0][0])} ${f1(p[0][1])}`;const last=cl?n:n-1;
 for(let i=0;i<last;i++){const a=g(i-1),b=g(i),c=g(i+1),e=g(i+2);

 await penTo(pts[0][0],pts[0][1],170,tok,{r:28,s:1});sfx.scribble(true);
 try{for(let i=1;i<pts.length;i++){const sx=PEN.x,sy=PEN.y,[tx,ty]=pts[i];await tween(70/speedMul,t=>{PEN.x=sx+(tx-sx)*t;PEN.y=sy+(ty-sy)*t+Math.sin(t*Math.PI*6)*6;setPen();},tok);}}finally{sfx.scribble(false);}}
async function drawBuilt(b,pr,tok,start=0){for(let i=start;i<b.strokes.length;i++)await drawStroke(b.strokes[i],tok);
 const big=[],small=[];for(const f of b.fills){const bb=f.getBBox();(bb.width*bb.height>6000?big:small).push(f);}
 small.forEach(f=>fadeIn(f,380));for(const f of big)await shadeFill(f,tok);if(small.length&&!big.length)await wait(220,tok);
 if(pr.anim)b.g.classList.add('a-'+pr.anim);sfx.pop();}
async function drawProp(pr,tok,layer){const b=buildProp(pr,false,layer);await drawBuilt(b,pr,tok);return b.g;}
function crumb(x,y){for(let i=0;i<3;i++){const c=el('ellipse',{cx:x+(Math.random()-.5)*40,cy:y+20,rx:5,ry:3,fill:'#F6A5C0',stroke:INK,'stroke-width':1.5},L.fx);c.animate([{transform:'translateY(0)',opacity:1},{transform:`translateY(${60+Math.random()*50}px)`,opacity:0}],{duration:700}).onfinish=()=>c.remove();}}
async function eraseProp(id,tok){const g=propEls.get(id);if(!g)return;const bb=g.getBBox();eraserEl.style.display='';
 const setE=(x,y,r)=>eraserEl.setAttribute('transform',`translate(${f1(x)} ${f1(y)}) rotate(${f1(r)})`);
 await tween(320,t=>{const e=ease(t);setE(1720+(bb.x-1720)*e,-80+(bb.y+10+80)*e,-20);},tok);
 const rows=Math.max(2,Math.min(5,Math.round(bb.height/60))),pts=[];for(let i=0;i<rows;i++){const y=bb.y+bb.height*(i+.5)/rows;pts.push(i%2?[bb.x+bb.width,y]:[bb.x,y],i%2?[bb.x,y]:[bb.x+bb.width,y]);}
 g.animate([{opacity:1},{opacity:0}],{duration:rows*2*140,fill:'forwards'});let cx=bb.x,cy=bb.y+10;sfx.rub(true);
 try{for(const[x,y]of pts){const sx=cx,sy=cy;await tween(140,t=>setE(sx+(x-sx)*t,sy+(y-sy)*t,-20+Math.sin(t*Math.PI*2)*8),tok);cx=x;cy=y;crumb(x,y);}}finally{sfx.rub(false);}
 g.remove();propEls.delete(id);await tween(260,t=>{const e=ease(t);setE(cx+(1720-cx)*e,cy+(-80-cy)*e,-20);},tok);eraserEl.style.display='none';}

function buildChar(n,html){const root=el('g',{class:'chr',id:'chr-'+n},L.chars);root.style.display='none';const pos=el('g',{},root),pop=el('g',{},pos);pop.innerHTML=html;
 CH[n]={x:-120,y:760,face:1,show:false,root,pos,pop,mc:pop.querySelector('.mc'),mo:pop.querySelector('.mo'),mi:null};}
buildChar('can',CAN);buildChar('ela',ELA);
function place(n){const c=CH[n];c.pos.setAttribute('transform',`translate(${f1(c.x)} ${f1(c.y)}) scale(${c.face*CS} ${CS})`);c.root.style.display=c.show?'':'none';}
const setCls=(n,pre,list)=>{const r=CH[n].root;[...r.classList].filter(c=>c.startsWith(pre)).forEach(c=>r.classList.remove(c));(list||[]).forEach(a=>a&&r.classList.add(pre+a));};
const setPose=(n,p)=>setCls(n,'pose-',[p]);const setAcc=(n,l)=>setCls(n,'has-',l);
function setAct(n,a){setCls(n,'act-',[]);if(a){void CH[n].root.getBoundingClientRect();CH[n].root.classList.add('act-'+a);}}
function popIn(n){const c=CH[n];c.show=true;place(n);c.pop.animate([{transform:'scale(0)'},{transform:'scale(1.15)'},{transform:'scale(1)'}],{duration:420,easing:'ease-out'});sfx.pop();}
function mouth(n,on){const c=CH[n];if(!c)return;clearInterval(c.mi);c.mc.style.display='';c.mo.style.display='none';if(on){let o=false;c.mi=setInterval(()=>{o=!o;c.mc.style.display=o?'none':'';c.mo.style.display=o?'':'none';},130);}}
async function walkTo(n,pts,tok,speed=.26){const c=CH[n],all=[[c.x,c.y],...pts],segs=[];let total=0;
 for(let i=1;i<all.length;i++){const d=Math.hypot(all[i][0]-all[i-1][0],all[i][1]-all[i-1][1]);segs.push(d);total+=d;}if(total<2)return;
 c.root.classList.add('walking');
 try{await tween(total/(speed*speedMul),t=>{let d=t*total,i=0;while(i<segs.length-1&&d>segs[i]){d-=segs[i];i++;}const a=all[i],b=all[i+1],k=segs[i]?Math.min(1,d/segs[i]):1;if(Math.abs(b[0]-a[0])>4)c.face=b[0]>a[0]?1:-1;c.x=a[0]+(b[0]-a[0])*k;c.y=a[1]+(b[1]-a[1])*k;place(n);moveBubble();},tok);}
 finally{c.root.classList.remove('walking');}}
async function carryDraw(pr,n,toX,tok){const b=buildProp(pr,false),st=b.strokes[0],m=st.main,g=st.ghost,L0=m.getTotalLength(),GL=g?g.getTotalLength():0;

 const OFF=56*CS;let lo=0,hi=L0;for(let k=0;k<22;k++){const mid=(lo+hi)/2;if(m.getPointAtLength(mid).x<toX+OFF)lo=mid;else hi=mid;}const Lt=hi;
 const C=CH[n],p0=m.getPointAtLength(0);C.show=true;C.face=1;C.x=p0.x-OFF;C.y=p0.y;setPose(n,'carry');place(n);
 PEN.x=p0.x;PEN.y=p0.y;PEN.r=2;PEN.s=.55;setPen();C.root.classList.add('walking');sfx.scribble(true);
 try{await tween(Lt/(.3*speedMul),t=>{const l=Lt*t;m.style.strokeDashoffset=L0-l;if(g)g.style.strokeDashoffset=GL*(1-l/L0);const p=m.getPointAtLength(l);PEN.x=p.x;PEN.y=p.y;setPen();C.x=p.x-OFF;C.y=p.y;place(n);},tok);}
 finally{C.root.classList.remove('walking');sfx.scribble(false);}
 setPose(n,null);await penTo(PEN.x+20,PEN.y-30,520,tok,{r:28,s:1});await drawStroke(st,tok,Lt/L0,1);await drawBuilt(b,pr,tok,1);}

const LANGS={tr:{code:'tr-TR',name:'Türkçe'},en:{code:'en-US',name:'İngilizce'},de:{code:'de-DE',name:'Almanca'},ar:{code:'ar-SA',name:'Arapça',rtl:1}};

let voices=[];const hasTTS='speechSynthesis' in window;
if(hasTTS){const lv=()=>{voices=speechSynthesis.getVoices();};lv();speechSynthesis.onvoiceschanged=lv;}
function voiceFor(l){if(!voices.length)return'default';const c=LANGS[l].code,b=c.split('-')[0];return voices.find(v=>v.lang===c)||voices.find(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith(b));}
const VOICE={narr:{pitch:1,rate:.92},can:{pitch:1.35,rate:.98},ela:{pitch:1.6,rate:1}};
function renderWords(box,text,lang){box.innerHTML='';box.dir=LANGS[lang].rtl?'rtl':'ltr';box.classList.toggle('ar',lang==='ar');const spans=[];let idx=0;
 text.split(/(\s+)/).forEach(tk=>{if(!tk)return;if(/^\s+$/.test(tk))box.appendChild(document.createTextNode(tk));else{const s=document.createElement('span');s.className='w';s.textContent=tk;s.dataset.a=idx;box.appendChild(s);spans.push(s);}idx+=tk.length;});
 return{byChar(ci){let k=-1;spans.forEach((s,j)=>{if(+s.dataset.a<=ci)k=j;});spans.forEach((s,j)=>s.classList.toggle('on',j===k));},byFrac(t){const i=Math.min(spans.length-1,Math.floor(t*spans.length));spans.forEach((s,j)=>s.classList.toggle('on',j===i));},clear(){spans.forEach(s=>s.classList.remove('on'));}};}
const setCaption=t=>renderWords($('#capText'),t,curLang);
async function speak(text,who,tok,hl){const est=(1000+text.length*65)/speedMul;const v=soundOn&&hasTTS?voiceFor(curLang):null;
 $('#capNote').textContent=(soundOn&&hasTTS&&!v)?`Bu cihazda ${LANGS[curLang].name} seslendirme bulunamadı; metin ekranda okunuyor.`:'';
 mouth(who,true);
 try{if(!v){await tween(est,t=>{if(hl)hl.byFrac(t);},tok);return;}
  await new Promise((res,rej)=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=LANGS[curLang].code;if(v!=='default')u.voice=v;const pv=VOICE[who]||VOICE.narr;u.pitch=pv.pitch;u.rate=pv.rate*(speedMul>1?1.1:speedMul<1?.9:1);
   let fin=false;const end=()=>{if(fin)return;fin=true;clearTimeout(sf);clearInterval(ck);res();};
   u.onend=end;u.onerror=end;u.onboundary=e=>{if(hl&&e.name!=='sentence')hl.byChar(e.charIndex);};
   const sf=setTimeout(end,est*2.6+4000);
   const ck=setInterval(()=>{if(tok!==RUN){fin=true;clearTimeout(sf);clearInterval(ck);speechSynthesis.cancel();rej(new Cancel());}},120);
   setTimeout(()=>speechSynthesis.speak(u),60);});}
 finally{mouth(who,false);if(hl)hl.clear();}}
let bubbleWho=null;const bubble=$('#bubble');
function moveBubble(){if(!bubbleWho)return;const c=CH[bubbleWho];const lx=Math.max(14,Math.min(86,c.x/16));const ty=(c.y-225*CS)/9;
 bubble.style.left=lx+'%';if(ty<26){bubble.classList.add('below');bubble.style.top=Math.min(80,(c.y+14)/9)+'%';}else{bubble.classList.remove('below');bubble.style.top=ty+'%';}}
function showBubble(n,text){const hl=renderWords(bubble.querySelector('.bt'),text,curLang);bubble.hidden=false;bubbleWho=n;moveBubble();
 const base=bubble.classList.contains('below')?'translate(-50%,0)':'translate(-50%,-100%)';bubble.animate([{transform:base+' scale(.6)',opacity:0},{transform:base+' scale(1)',opacity:1}],{duration:260,easing:'cubic-bezier(.3,1.4,.6,1)'});return hl;}
function hideBubble(){bubble.hidden=true;bubbleWho=null;}

/* oynatıcı */
function stopAll(){RUN++;paused=false;$('#stageWrap').classList.remove('paused');try{hasTTS&&speechSynthesis.cancel();}catch(e){}sfx.scribble(false);sfx.rub(false);hideBubble();eraserEl.style.display='none';for(const n in CH){mouth(n,false);CH[n].root.classList.remove('walking');}}
function clearStage(){L.draw.innerHTML='';L.fx.innerHTML='';propEls.clear();for(const n in CH){Object.assign(CH[n],{show:false,x:-120,y:760,face:1});setPose(n,null);setAcc(n,[]);setAct(n,null);place(n);}hideBubble();}
function applyAnims(s){for(const[id,a]of Object.entries(s.anims||{})){const g=propEls.get(id);if(!g)continue;[...g.classList].filter(c=>c.startsWith('a-')).forEach(c=>g.classList.remove(c));g.classList.add('a-'+a);}}
function restoreUpTo(k){clearStage();const sc=story().scenes;let c=0;for(let i=0;i<=k;i++)if(sc[i].clear)c=i;
 for(let j=c;j<k;j++){const s=sc[j];(s.remove||[]).forEach(id=>{propEls.get(id)?.remove();propEls.delete(id);});s.props.forEach(p=>buildProp(p,true));applyAnims(s);
  for(const n in s.chars||{}){const cs=s.chars[n],C=CH[n];if(cs.show===false){C.show=false;place(n);continue;}C.show=true;
   if(cs.at){C.x=cs.at[0];C.y=cs.at[1];}if(cs.carryTo!=null){C.x=cs.carryTo;C.y=760;}if(cs.walk){const l=cs.walk[cs.walk.length-1];C.x=l[0];C.y=l[1];}if(cs.face)C.face=cs.face;
   if('acc' in cs)setAcc(n,cs.acc);if('pose' in cs)setPose(n,cs.pose);place(n);}}
 setCaption('');}
async function pageTurn(tok){const an=[L.draw,L.chars].map(g=>g.animate([{opacity:1,transform:'translateX(0)'},{opacity:0,transform:'translateX(-60px)'}],{duration:420,easing:'ease-in',fill:'forwards'}));

async function titleCard(tok){const t=story().title[curLang],g=el('g',{},L.fx),tx=el('text',{x:800,y:430,'text-anchor':'middle','dominant-baseline':'middle',class:'tc'+(curLang==='ar'?' ar':'')},g);tx.textContent=t;
 const bb=tx.getBBox();tx.style.strokeDasharray='900';tx.style.strokeDashoffset='900';tx.style.fillOpacity=0;const hl=setCaption(t),sp=speak(t,'narr',tok,hl),rtl=curLang==='ar';
 await penTo(rtl?bb.x+bb.width:bb.x,bb.y+bb.height*.7,380,tok,{r:28,s:1});sfx.scribble(true);
 try{await tween(1600/speedMul,k=>{tx.style.strokeDashoffset=900*(1-k);tx.style.fillOpacity=Math.max(0,(k-.55)/.45);PEN.x=rtl?bb.x+bb.width*(1-k):bb.x+bb.width*k;PEN.y=bb.y+bb.height*(.55+.25*Math.sin(k*40));setPen();},tok);}finally{sfx.scribble(false);}
 await parkPen(tok);await allP([sp,wait(500,tok)]);await tween(400,k=>g.style.opacity=1-k,tok);g.remove();setCaption('');}
async function playScene(i,tok){const s=story().scenes[i],cs=s.chars||{};hideBubble();
 if(s.clear&&(L.draw.childNodes.length||Object.values(CH).some(c=>c.show)))await pageTurn(tok);
 for(const id of s.remove||[])await eraseProp(id,tok);
 if(s.carry){const n=s.carry;await carryDraw(s.props[0],n,cs[n].carryTo,tok);CH[n].face=cs[n].face||1;place(n);}
 const setup=async()=>{for(const n in cs){const c=cs[n],C=CH[n];if(c.show===false){C.show=false;place(n);continue;}
   if(!C.show){if(c.at){C.x=c.at[0];C.y=c.at[1];}if(c.face)C.face=c.face;popIn(n);await wait(280,tok);}
   if('pose' in c)setPose(n,c.pose);if('acc' in c)setAcc(n,c.acc);}};
 const walks=()=>allP(Object.entries(cs).filter(([,c])=>c.walk).map(([n,c])=>walkTo(n,c.walk,tok).then(()=>{if(c.face){CH[n].face=c.face;place(n);}})));
 if(s.walkFirst){await setup();await parkPen(tok);await walks();}
 for(const p of(s.carry?s.props.slice(1):s.props))await drawProp(p,tok);
 applyAnims(s);if(!s.walkFirst)await setup();await parkPen(tok);
 const hl=setCaption(s.narr[curLang]);await allP([speak(s.narr[curLang],'narr',tok,hl),...(s.walkFirst?[]:[walks()])]);
 for(const n in cs)if(cs[n].act)setAct(n,cs[n].act);
 if(s.say){const n=s.say.who,t=s.say[curLang];await speak(t,n,tok,showBubble(n,t));}
 await wait(500,tok);for(const n in cs){const a=cs[n].act;if(a&&a!=='tired'&&a!=='water')setAct(n,null);}}
async function runFrom(si,withTitle){stopAll();const tok=RUN;running=true;setPlayUI();hideQuiz();cur.scene=si;updDots();
 try{restoreUpTo(si);if(withTitle)await titleCard(tok);
  for(let i=si;i<story().scenes.length;i++){cur.scene=i;updDots();await playScene(i,tok);await wait(600,tok);hideBubble();}
  cur.scene=story().scenes.length;updDots();showQuiz();}
 catch(e){if(!(e instanceof Cancel))console.error(e);}
 finally{if(tok===RUN){running=false;setPlayUI();}}}

function renderShelf(){const box=$('#cards');box.innerHTML='';STORIES.forEach((s,i)=>{const b=document.createElement('button');b.className='card'+(i===cur.story?' on':'');
 b.innerHTML=`<span class="pin"></span><span class="ic">${s.icon}</span><span><b>${s.title.tr}</b><small>${s.values.join(', ')}</small><small class="gr">${s.note.kademe}</small></span>`;b.onclick=()=>{sfx.init();selectStory(i);};box.appendChild(b);});
 const n=story().note;$('#tnote').innerHTML=`<dl><dt>Kademe</dt><dd>${n.kademe}</dd><dt>Değerler</dt><dd>${n.degerler}</dd><dt>Beceriler</dt><dd>${n.beceri}</dd><dt>Sohbet soruları</dt><dd><ul>${n.sorular.map(q=>`<li>${q}</li>`).join('')}</ul></dd><dt>Sınıf etkinliği</dt><dd>${n.etkinlik}</dd></dl><p class="mm">Hikâyeler, Türkiye Yüzyılı Maarif Modeli’nin değerler çerçevesi (sabır, çalışkanlık, yardımseverlik, merhamet, sorumluluk, dostluk) gözetilerek yazıldı.</p>`;}
function selectStory(i){if(mode!=='story')setMode('story',true);cur.story=i;renderShelf();runFrom(0,true);}
async function intro(){stopAll();const tok=RUN;clearStage();renderWords($('#capText'),'Bir hikâye seç: kalem çizsin, kahramanlar konuşsun!','tr');
 try{await wait(400,tok);await carryDraw(P.ground('ig',40,1560,760),'can',560,tok);await drawProp(P.sun('isun',1400,170,58),tok);await drawProp(P.cloud('icl',430,150,1),tok);await drawProp(P.flower('ifl',760,760,'pink'),tok);
  CH.ela.x=980;CH.ela.y=760;CH.ela.face=-1;popIn('ela');await parkPen(tok);setAct('can','wave');setAct('ela','wave');}
 catch(e){if(!(e instanceof Cancel))console.error(e);}}

/* atölye */
const AT={tool:'pen',color:INK,hero:'can',items:[],busy:false,queue:Promise.resolve()};let uid=0,drawing=null,parkT=null;
const CRAY=[[INK,'Kurşun kalem'],['#F39A2B','Turuncu'],['#3F7FD1','Mavi'],['#5DAE4B','Yeşil'],['#E5484D','Kırmızı'],['#9B7BD4','Mor']];
const STAMPS=[['sun','☀️','Güneş'],['cloud','☁️','Bulut'],['tree','🌳','Ağaç'],['house','🏠','Ev'],['kitten','🐱','Kedi'],['flower','🌸','Çiçek'],['mountain','⛰️','Dağ'],['rainbow','🌈','Gökkuşağı'],['heart','❤️','Kalp'],['star','⭐','Yıldız'],['bird','🐦','Kuş'],['rain','🌧️','Yağmur']];
function stampProp(k,id,x,y){switch(k){case'sun':return P.sun(id,x,y,55);case'cloud':return P.cloud(id,x,y,.9);case'tree':return P.tree(id,x,y,.8,true);case'house':return P.house(id,x,y,.8);case'kitten':return P.kitten(id,x,y);
 case'flower':return P.flower(id,x,y,['pink','purple','red','yellow'][uid%4]);case'mountain':return P.mountain(id,x,y,420,280);case'rainbow':return P.rainbow(id,x,y,200);case'heart':return P.heart(id,x,y,1);case'star':return P.star(id,x,y,1.2);case'bird':return P.bird(id,x,y);case'rain':return P.rain(id,x-200,x+200,y-150,y+150);}}
function toolUI(){$$('#crayons .crayon').forEach(b=>b.setAttribute('aria-pressed',AT.tool==='pen'&&b.dataset.c===AT.color));$$('#stamps .stamp').forEach(b=>b.setAttribute('aria-pressed',AT.tool===b.dataset.k));$$('#heroes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.h===AT.hero));}
function buildAtelierUI(){CRAY.forEach(([c,n])=>{const b=document.createElement('button');b.className='crayon';b.dataset.c=c;b.style.color=c;b.setAttribute('aria-label',n);b.innerHTML=`<span style="background:${c}"></span>`;b.onclick=()=>{AT.tool='pen';AT.color=c;toolUI();};$('#crayons').appendChild(b);});
 STAMPS.forEach(([k,e,n])=>{const b=document.createElement('button');b.className='paperbtn stamp';b.dataset.k=k;b.innerHTML=`<span class="e">${e}</span>${n}`;b.onclick=()=>{AT.tool=k;toolUI();};$('#stamps').appendChild(b);});
 [['can','👦 Can'],['ela','👧 Ela']].forEach(([h,t])=>{const b=document.createElement('button');b.className='paperbtn';b.dataset.h=h;b.textContent=t;b.onclick=()=>{const o=AT.hero;AT.hero=h;if(o!==h){CH[o].show=false;place(o);const C=CH[h];C.x=CH[o].x;C.y=CH[o].y;C.face=CH[o].face;popIn(h);}toolUI();};$('#heroes').appendChild(b);});toolUI();}
function enterAtelier(){clearStage();L.user.innerHTML='';AT.items=[];AT.busy=false;const tok=RUN;parkPen(tok).catch(()=>{});const C=CH[AT.hero];C.x=160;C.y=800;C.face=1;popIn(AT.hero);
 renderWords($('#capText'),'Kâğıda bir yol çiz, sonra kahramanını o yolda yürüt!','tr');}
const toSvg=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());};
svg.addEventListener('pointerdown',e=>{if(mode!=='atelier')return;sfx.init();const p=toSvg(e);clearTimeout(parkT);
 if(AT.tool==='pen'){drawing={pts:[{x:p.x,y:p.y}],path:el('path',{fill:'none',stroke:AT.color,'stroke-width':6,'stroke-linecap':'round','stroke-linejoin':'round'},L.user)};svg.setPointerCapture(e.pointerId);PEN.x=p.x;PEN.y=p.y;PEN.r=28;PEN.s=1;setPen();sfx.scribble(true);}
 else{const id='u'+(++uid),pr=stampProp(AT.tool,id,p.x,p.y),tok=RUN;AT.queue=AT.queue.then(()=>drawProp(pr,tok,L.draw)).then(g=>{AT.items.push(g);parkT=setTimeout(()=>parkPen(RUN).catch(()=>{}),900);}).catch(()=>{});}});
svg.addEventListener('pointermove',e=>{if(!drawing)return;const p=toSvg(e),l=drawing.pts[drawing.pts.length-1];if(Math.hypot(p.x-l.x,p.y-l.y)<5)return;drawing.pts.push({x:p.x,y:p.y});drawing.path.setAttribute('d','M'+drawing.pts.map(q=>f1(q.x)+' '+f1(q.y)).join(' L'));PEN.x=p.x;PEN.y=p.y;setPen();});
const endDraw=()=>{if(!drawing)return;sfx.scribble(false);const d=drawing;drawing=null;if(d.pts.length<3){d.path.remove();return;}
 const r=resample(d.pts,10);d.path.setAttribute('d',sk(r.map(q=>[q.x,q.y]),{jit:0}));d.path._pts=d.pts;AT.items.push(d.path);parkT=setTimeout(()=>parkPen(RUN).catch(()=>{}),900);};
svg.addEventListener('pointerup',endDraw);svg.addEventListener('pointercancel',endDraw);
function resample(pts,step){const out=[pts[0]];let acc=0;for(let i=1;i<pts.length;i++){acc+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);if(acc>=step){out.push(pts[i]);acc=0;}}if(out[out.length-1]!==pts[pts.length-1])out.push(pts[pts.length-1]);return out;}
async function heroWalk(){const path=[...AT.items].reverse().find(x=>x._pts);if(!path){renderWords($('#capText'),'Önce kâğıda bir yol çiz, sonra yeniden dene!','tr');return;}if(AT.busy)return;AT.busy=true;
 const tok=RUN,n=AT.hero,C=CH[n],pts=resample(path._pts,14);try{hideBubble();C.x=pts[0].x;C.y=pts[0].y-3;C.face=(pts[1]||pts[0]).x>=pts[0].x?1:-1;popIn(n);await wait(350,tok);
  await walkTo(n,pts.slice(1).map(p=>[p.x,p.y-3]),tok,.32);setAct(n,'jump');const t=HERO_LINE[curLang];await speak(t,n,tok,showBubble(n,t));setAct(n,null);await wait(1200,tok);hideBubble();}
 catch(e){if(!(e instanceof Cancel))console.error(e);}finally{AT.busy=false;}}
async function heroSay(){const t=$('#sayIn').value.trim();if(!t)return;sfx.init();const n=AT.hero,tok=RUN;if(!CH[n].show)popIn(n);try{await speak(t,n,tok,showBubble(n,t));await wait(1200,tok);hideBubble();}catch(e){}}

/* modlar ve düğmeler */
function setMode(m,skipIntro){mode=m;$$('.modes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===m));$('#shelfStory').hidden=m!=='story';$('#shelfAtelier').hidden=m!=='atelier';$('#ctrl').hidden=m!=='story';svg.classList.toggle('drawing',m==='atelier');
 stopAll();hideQuiz();running=false;setPlayUI();$('#capNote').textContent='';if(m==='atelier'){L.user.innerHTML='';enterAtelier();}else{L.user.innerHTML='';if(!skipIntro)intro();}}
$$('.modes button').forEach(b=>b.onclick=()=>{sfx.init();if(b.dataset.mode!==mode)setMode(b.dataset.mode);});
$$('.langs button').forEach(b=>b.onclick=()=>{sfx.init();curLang=b.dataset.lang;$$('.langs button').forEach(x=>x.setAttribute('aria-pressed',x===b));if(mode!=='story')return;if(!quiz.hidden)showQuiz();else if(running)runFrom(Math.min(cur.scene,story().scenes.length-1),false);});
$('#playB').onclick=()=>{sfx.init();if(running)togglePause();else if(cur.scene>=story().scenes.length||!quiz.hidden)runFrom(0,true);else runFrom(cur.scene,cur.scene===0);};
$('#prevB').onclick=()=>{sfx.init();runFrom(Math.max(0,Math.min(cur.scene,story().scenes.length)-1),false);};
$('#nextB').onclick=()=>{sfx.init();const n=cur.scene+1;if(n<story().scenes.length)runFrom(n,false);};
$('#againB').onclick=()=>{sfx.init();runFrom(Math.min(cur.scene,story().scenes.length-1),false);};
$('#sndB').onclick=e=>{soundOn=!soundOn;e.target.setAttribute('aria-pressed',soundOn);e.target.textContent=soundOn?'Ses açık':'Ses kapalı';if(!soundOn&&hasTTS)speechSynthesis.cancel();sfx.scribble(false);};
const SPD=[[.75,'yavaş'],[1,'normal'],[1.4,'hızlı']];let spi=1;$('#spdB').onclick=e=>{spi=(spi+1)%3;speedMul=SPD[spi][0];e.target.textContent='Hız: '+SPD[spi][1];};
$('#fsB').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>{});};
$('#walkB').onclick=()=>{sfx.init();heroWalk();};$('#sayB').onclick=heroSay;$('#sayIn').addEventListener('keydown',e=>{if(e.key==='Enter')heroSay();});
$('#undoB').onclick=()=>{const it=AT.items.pop();if(it)it.remove();};
$('#clearB').onclick=()=>{L.user.innerHTML='';L.draw.innerHTML='';propEls.clear();AT.items=[];};
document.addEventListener('keydown',e=>{if(mode!=='story'||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;if(e.code==='Space'&&document.activeElement===document.body){e.preventDefault();$('#playB').click();}if(e.key==='ArrowRight')$('#nextB').click();if(e.key==='ArrowLeft')$('#prevB').click();});
/* kâğıt dokusu */
(()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d'),d=x.createImageData(256,256);for(let i=0;i<d.data.length;i+=4){const v=Math.random(),a=v>.72?(v-.72)*2.6:0;d.data[i]=d.data[i+1]=d.data[i+2]=255;d.data[i+3]=a*230;}x.putImageData(d,0,0);$('#grain').style.backgroundImage=`url(${c.toDataURL()})`;})();
buildAtelierUI();renderShelf();updDots();setPlayUI();intro();
</script>
</body>
</html>
