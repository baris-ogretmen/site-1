<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ortak Yazılı Hazırlık Merkezi 2026-2027</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2433;--mut:#6b7080;--line:#e6e2d8;--pri:#c8102e;--pri2:#9c0b22;--ok:#1f9d55;--warn:#d97706;--soft:#fdf1f2;--blue:#2563eb}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding-bottom:60px}
button{font-family:inherit;cursor:pointer;border:0}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header.top{background:linear-gradient(135deg,#c8102e,#8a0a1e);color:#fff;padding:22px 0 26px;border-radius:0 0 26px 26px}
header.top h1{font-size:1.45rem;font-weight:900;letter-spacing:-.3px}
header.top p{opacity:.9;font-size:.92rem;margin-top:4px}
.next{margin-top:16px;background:rgba(255,255,255,.14);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.next b{font-size:1.05rem}
.cd{display:flex;gap:6px}
.cd span{background:#fff;color:var(--pri);border-radius:10px;padding:4px 9px;font-weight:900;font-size:1rem;min-width:46px;text-align:center}
.cd small{display:block;font-size:.62rem;color:var(--mut);font-weight:700}
.tabs{display:flex;gap:8px;margin:18px 0 12px;flex-wrap:wrap}
.tab{background:var(--card);border:2px solid var(--line);color:var(--ink);padding:9px 16px;border-radius:999px;font-weight:800;font-size:.95rem}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.sub{cursor:pointer;transition:transform .12s,box-shadow .12s;position:relative}
.sub:active{transform:scale(.98)}
.sub:hover{box-shadow:0 6px 20px rgba(0,0,0,.07)}
.sub .ic{font-size:1.8rem}
.sub h3{font-size:1.08rem;font-weight:900;margin-top:4px}
.sub .dt{color:var(--mut);font-size:.88rem;font-weight:700}
.badge{display:inline-block;font-size:.72rem;font-weight:800;padding:3px 9px;border-radius:999px;background:#eef2ff;color:#3730a3;margin-top:8px}
.badge.red{background:var(--soft);color:var(--pri)}
.badge.gr{background:#e8f7ee;color:var(--ok)}
.badge.or{background:#fff4e5;color:var(--warn)}
.kalan{position:absolute;top:14px;right:14px;text-align:center;background:var(--bg);border-radius:12px;padding:4px 10px;font-weight:900;color:var(--pri)}
.kalan small{display:block;font-size:.6rem;color:var(--mut)}
.best{font-size:.8rem;color:var(--ok);font-weight:800;margin-top:6px}
.sec{margin-top:22px}
.sec h2{font-size:1.1rem;font-weight:900;margin-bottom:10px}
.info{font-size:.9rem;color:#3d4252}
.info li{margin:4px 0 4px 18px}
.back{background:none;color:var(--pri);font-weight:800;font-size:.95rem;padding:14px 0 6px}
.shead{display:flex;gap:12px;align-items:center}
.shead .ic{font-size:2.4rem}
.shead h2{font-size:1.35rem;font-weight:900;line-height:1.2}
.shead p{color:var(--mut);font-size:.88rem;font-weight:700}
.note{background:#fffbea;border:1px solid #f5e3a3;border-radius:14px;padding:11px 13px;font-size:.88rem;margin-top:12px}
.kz{margin-top:10px}
.kz .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;cursor:pointer}
.kz code{font-size:.75rem;font-weight:800;color:var(--pri);background:var(--soft);padding:2px 7px;border-radius:7px}
.kz h4{font-size:1rem;font-weight:800;margin-top:5px}
.freq{flex-shrink:0;text-align:center;font-size:.72rem;font-weight:800;color:var(--mut)}
.bar{width:64px;height:8px;background:#eee;border-radius:9px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--pri)}
.body{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.kz.open .body{display:block}
.body ul li{margin:5px 0 5px 18px;font-size:.93rem}
.qx{background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:.92rem}
.ans{display:none;margin-top:8px;background:#e8f7ee;border-radius:10px;padding:8px 10px;color:#14532d;font-size:.9rem}
.qx.show .ans{display:block}
.lnk{background:none;color:var(--blue);font-weight:800;font-size:.85rem;margin-top:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:800;font-size:.88rem;text-align:left}
.chip small{display:block;font-weight:700;color:var(--mut);font-size:.72rem}
.chip.on{border-color:var(--pri);background:var(--soft)}
.btn{background:var(--pri);color:#fff;font-weight:900;padding:12px 20px;border-radius:14px;font-size:1rem}
.btn.alt{background:var(--ink)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
table.st{width:100%;border-collapse:collapse;font-size:.8rem;margin-top:8px;background:#fff;border-radius:12px;overflow:hidden}
table.st th,table.st td{border:1px solid var(--line);padding:6px;text-align:center}
table.st th{background:var(--ink);color:#fff;font-weight:800}
table.st td:first-child{text-align:left;font-weight:800;color:var(--pri)}
.tblwrap{overflow-x:auto}
.exam .q{margin-top:14px}
.passage{background:#fff;border-left:5px solid var(--pri);border-radius:12px;padding:12px 14px;margin-top:16px;font-size:.95rem}
.passage b{display:block;text-align:center;margin-bottom:6px}
.qn{font-weight:900;color:var(--pri)}
.pt{font-size:.75rem;color:var(--mut);font-weight:800}
textarea{width:100%;min-height:90px;border:2px solid var(--line);border-radius:12px;padding:10px;font-family:inherit;font-size:.95rem;margin-top:8px;resize:vertical;background:#fff}
textarea:focus{outline:none;border-color:var(--pri)}
.timer{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;border-radius:0 0 14px 14px;padding:8px 14px;display:flex;justify-content:space-between;font-weight:900}
.scr{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.scr button{padding:7px 12px;border-radius:10px;font-weight:800;background:var(--bg);border:2px solid var(--line);font-size:.85rem}
.scr button.on.t{background:var(--ok);color:#fff;border-color:var(--ok)}
.scr button.on.y{background:var(--warn);color:#fff;border-color:var(--warn)}
.scr button.on.s{background:#94a3b8;color:#fff;border-color:#94a3b8}
.myans{background:#f1f5f9;border-radius:10px;padding:8px 10px;margin-top:8px;font-size:.88rem;white-space:pre-wrap}
.total{font-size:2.6rem;font-weight:900;color:var(--pri);text-align:center}
.calt td,.calt th{padding:8px;font-size:.88rem}
input.inp{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px;font-family:inherit;font-size:.95rem}
.scn{overflow:hidden;border-radius:14px;height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:1.5rem;line-height:1.15;border:1px solid var(--line)}
.scn .big{font-size:2.1rem;letter-spacing:2px}
.scn .mid{font-size:1.3rem;white-space:nowrap}
.scn>div{white-space:nowrap}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:10px}
.pics select{margin-top:6px;font-size:1rem;padding:4px 8px;border-radius:8px;border:2px solid var(--line);font-family:inherit}
.pvi{border:2px solid var(--line);border-radius:9px;padding:5px 8px;font-family:inherit;font-size:.95rem;max-width:100%;background:#fff}
.pvi:focus{outline:none;border-color:var(--blue)}
.pvi.ok{border-color:var(--ok);background:#e8f7ee}.pvi.no{border-color:var(--pri);background:var(--soft)}
.kk{color:var(--ok);font-weight:800;font-size:.85rem}
.pvl{margin-top:10px;line-height:2.1}
.pvt td{text-align:left!important}
footer{text-align:center;color:var(--mut);font-size:.78rem;margin-top:30px}
#print{display:none}
@media print{
 body{background:#fff;padding:0}
 #app{display:none}
 #print{display:block;font-family:"Times New Roman",serif;color:#000;font-size:12pt}
 .pg{page-break-after:always;padding:6mm 4mm}
 .pg:last-child{page-break-after:auto}
 .ph{text-align:center;font-weight:bold;font-size:12.5pt;line-height:1.35}
 .pinfo{display:flex;justify-content:space-between;border:1px solid #000;padding:6px 8px;margin:8px 0;font-size:11pt}
 .pq{margin-top:10px;page-break-inside:avoid}
 .pq .blank{height:85px;border-bottom:1px dotted #999}
 .pp{border:1px solid #000;padding:6px 8px;margin-top:10px;font-size:11pt;page-break-inside:avoid}
 .pk{margin-top:8px;font-size:11pt;page-break-inside:avoid}
 .ppics{display:flex;gap:8px;margin-top:6px;text-align:center} .ppics>div{flex:1} .ppics .scn{height:90px;font-size:15pt;border:1px solid #999;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .ptab{border-collapse:collapse;width:100%;margin-top:6px;font-size:10.5pt} .ptab td,.ptab th{border:1px solid #000;padding:4px 6px}
 .pfoot{margin-top:14px;text-align:right;font-size:10pt}
}
</style>
</head>

<div id="app"></div>
<div id="print"></div>

DATA.push({
 id:"5-fen", g:5, ders:"Fen Bilimleri", ic:"🔭", tarih:"2026-11-03", tur:"Okul geneli ortak yazılı",
 tema:"Gökyüzündeki Komşularımız ve Biz · Kuvveti Tanıyalım",
 kaz:[
 {k:"FB.5.1.2", ad:"Ay'ın özellikleri, dönme ve dolanma hareketleri",
  oz:["Ay, Dünya'nın tek doğal uydusudur; kendi ışığı yoktur, Güneş'ten aldığı ışığı yansıtır.","Ay'da hava (atmosfer) ve sıvı su yoktur; bu yüzden ses iletilmez, gece-gündüz sıcaklık farkı çok büyüktür.","Yüzeyinde göktaşı çarpmalarıyla oluşmuş çukurlar vardır: bunlara krater denir.","Ay hem kendi ekseni etrafında döner hem de Dünya etrafında dolanır; iki hareket de yaklaşık 27,3 gün sürer.","Dönme ve dolanma süreleri eşit olduğu için Dünya'dan Ay'ın hep aynı yüzünü görürüz."],
  q:[
   ["Ay'da yaşam olmamasının iki nedenini yazınız.","1) Ay'da soluyabileceğimiz hava (atmosfer) yoktur. 2) Sıvı su yoktur. (Ayrıca: gece-gündüz sıcaklık farkı çok fazladır, zararlı ışınlara karşı koruyucu tabaka yoktur.) Herhangi iki doğru neden tam puan."],
   ["Elif, Dünya'dan bakınca Ay'ın hep aynı yüzünü gördüğünü fark ediyor. Bunun nedenini Ay'ın hareketleriyle açıklayınız.","Ay'ın kendi ekseni etrafında dönme süresi ile Dünya etrafında dolanma süresi eşittir (yaklaşık 27,3 gün). Bu yüzden Ay'ın Dünya'ya dönük yüzü değişmez, hep aynı yüzünü görürüz."],
   ["Ay yüzeyinde bulunan kraterler nasıl oluşmuştur? Ay'da atmosfer olmamasının kraterlerin oluşumuyla ilişkisini açıklayınız.","Kraterler, göktaşlarının Ay yüzeyine çarpmasıyla oluşan çukurlardır. Ay'da atmosfer olmadığı için göktaşları sürtünerek yanmaz, doğrudan yüzeye çarpar ve krater oluşturur. Ayrıca rüzgâr ve su olmadığından bu izler silinmeden kalır."]
  ]},
 {k:"FB.5.1.3", ad:"Ay'ın evreleri",
  oz:["Ay'ın Dünya'dan görünen aydınlık kısmının şeklinin değişmesine Ay'ın evreleri denir.","Sıra: Yeni Ay → Hilal → İlk Dördün → Şişkin Ay → Dolunay → Şişkin Ay → Son Dördün → Hilal → Yeni Ay.","Ana evreler: Yeni Ay, İlk Dördün, Dolunay, Son Dördün.","Evrelerin bir tam turu yaklaşık 29,5 gün (bir ay) sürer.","Yeni Ay'da Ay görünmez; Dolunay'da Dünya'ya dönük yüzün tamamı aydınlıktır."],
  q:[
   ["Ay'ın ana evrelerini oluşum sırasına göre yazınız.","Yeni Ay → İlk Dördün → Dolunay → Son Dördün (→ tekrar Yeni Ay)."],
   ["Bir gece gökyüzünde Ay'ı hiç göremeyen Kerem, Ay'ın yok olduğunu düşünüyor. Kerem'in düşüncesi doğru mudur? Açıklayınız.","Doğru değildir. Ay yok olmamıştır; Yeni Ay evresindedir. Bu evrede Ay'ın Güneş ışığı alan yüzü Dünya'ya dönük olmadığından Ay'ı göremeyiz."],
   ["Ay'ın evrelerinin oluşmasının nedenini ve bir tam evre döngüsünün yaklaşık ne kadar sürdüğünü yazınız.","Ay, Dünya etrafında dolanırken Güneş'ten aydınlanan yüzünün Dünya'dan görünen kısmı değişir; bu evreleri oluşturur. Bir döngü yaklaşık 29,5 gün (yaklaşık bir ay) sürer."]
  ]},
 {k:"FB.5.1.4", ad:"Güneş, Dünya ve Ay modeli · hareketler ve hacimsel büyüklükler",
  oz:["Hacimce büyükten küçüğe: Güneş > Dünya > Ay.","Dünya kendi ekseni etrafında 24 saatte döner → gece ve gündüz oluşur.","Dünya Güneş etrafında yaklaşık 365 gün 6 saatte dolanır → 1 yıl.","Ay, Dünya etrafında dolanırken Dünya da Güneş etrafında dolanır; Ay, Dünya ile birlikte Güneş'in etrafında hareket eder.","Bir model kurarken büyüklük sırası (büyük top: Güneş, orta: Dünya, küçük: Ay) doğru seçilmelidir."],
  q:[
   ["Bir model için elinizde basketbol topu, pinpon topu ve nohut tanesi var. Bu malzemeleri Güneş, Dünya ve Ay ile eşleştiriniz ve neden böyle eşleştirdiğinizi yazınız.","Basketbol topu → Güneş, pinpon topu → Dünya, nohut → Ay. Çünkü hacimce büyüklük sıralaması Güneş > Dünya > Ay'dır."],
   ["Dünya'nın kendi ekseni etrafında dönmesi ve Güneş etrafında dolanması sonucu oluşan birer olayı yazınız.","Dönme hareketi (24 saat) → gece ve gündüzün oluşması. Dolanma hareketi (yaklaşık 365 gün 6 saat) → bir yılın oluşması (5. sınıf düzeyinde yıl kavramı; mevsimler 8. sınıfta ayrıntılandırılır)."],
   ["“Ay sadece Dünya'nın etrafında döner, Güneş'in etrafında dönmez.” ifadesi doğru mudur? Açıklayınız.","Yanlıştır. Ay, Dünya'nın etrafında dolanırken Dünya ile birlikte Güneş'in etrafında da hareket eder. Yani Ay, Dünya'yla beraber Güneş'in çevresinde dolanır."]
  ]},
 {k:"FB.5.2.1", ad:"Kuvvet ve kuvvetin büyüklüğü (dinamometre)",
  oz:["İtme ya da çekme etkisine kuvvet denir.","Kuvvet; durgun cismi hareket ettirebilir, hareketli cismi durdurabilir, yavaşlatıp hızlandırabilir, yönünü ve şeklini değiştirebilir.","Kuvvet dinamometre ile ölçülür; birimi Newton'dur (N).","Dinamometrenin içinde esnek bir yay vardır; asılan cisim ağırlaştıkça yay daha çok uzar.","Her dinamometrenin ölçebileceği en büyük değer (kapasite) farklıdır; uygun dinamometre seçilmelidir."],
  q:[
   ["Kuvvetin cisimler üzerindeki etkilerinden üç tanesini birer örnekle yazınız.","Örnekler: Hareket ettirme (duran topa vurmak), durdurma (gelen topu tutmak), yön değiştirme (topa kafa vurmak), şekil değiştirme (hamuru sıkmak), hızlandırma/yavaşlatma (bisiklete pedal çevirmek/fren yapmak). Herhangi üç doğru etki + örnek."],
   ["Kuvvet hangi araçla ölçülür, birimi nedir? Bu aracın çalışma ilkesini kısaca açıklayınız.","Dinamometre ile ölçülür; birimi Newton (N)'dur. Dinamometrenin içinde esnek bir yay bulunur; uygulanan kuvvet arttıkça yay daha fazla uzar ve ölçek üzerindeki değer okunur."],
   ["Aynı dinamometreye A cismi asıldığında yay 2 bölme, B cismi asıldığında 5 bölme uzuyor. Hangi cisme uygulanan çekim kuvveti daha büyüktür? Neden?","B cismine. Çünkü dinamometrenin yayı B asıldığında daha çok uzamıştır; yay ne kadar çok uzarsa ölçülen kuvvet o kadar büyüktür."]

 id:"5-mat", g:5, ders:"Matematik", ic:"📐", tarih:"2026-11-05", tur:"Okul geneli ortak yazılı",

 kaz:[
 {k:"MAT.5.3.1", ad:"Temel geometrik çizimler (araç ve teknoloji)",
  oz:["Nokta: konum belirtir, büyük harfle adlandırılır (A).","Doğru: iki yönde sonsuza uzanır (AB doğrusu). Işın: bir başlangıç noktası vardır, tek yönde sonsuza uzanır ([AB). Doğru parçası: iki ucu da bellidir, ölçülebilir ([AB]).","Cetvel ile doğru parçası, gönye ile dik doğrular, cetvel+gönye kaydırarak paralel doğrular çizilir.","Dik doğrular 90° açı ile kesişir; paralel doğrular hiç kesişmez."],
  q:[
   ["Doğru, ışın ve doğru parçası arasındaki farkı yazınız. Hangisinin uzunluğu ölçülebilir?","Doğru iki yönde sonsuza uzanır; ışının bir başlangıç noktası vardır ve tek yönde sonsuza uzanır; doğru parçasının iki ucu da bellidir. Uzunluğu yalnızca doğru parçasının ölçülebilir."],
   ["Defterinize birbirine paralel iki doğru ve bunlara dik bir doğru çizmek istiyorsunuz. Hangi araçları nasıl kullanırsınız? Adım adım yazınız.","Cetvelle bir doğru çizerim. Gönyeyi cetvelin kenarına yaslayıp kaydırarak gönyenin aynı kenarıyla ikinci doğruyu çizerim → paralel olur. Gönyenin dik açılı köşesini bu doğrulara yerleştirip dik kenar boyunca çizerek dik doğruyu elde ederim."],
   ["Sınıfınızda paralel ve dik doğrulara ikişer örnek veriniz.","Paralel: tahtanın üst ve alt kenarı, merdiven basamakları, defter çizgileri. Dik: kapının yan kenarı ile zemin, sıranın ayağı ile zemin, pencerenin yan ve alt kenarı. (Doğru örnekler kabul.)"]
  ]},
 {k:"MAT.5.3.2", ad:"Temel geometrik çizimlere dayalı deneyimleri yansıtma",
  oz:["Çizimi yaptıktan sonra nasıl yaptığını sözle ve yazıyla açıklayabilmek beklenir.","“Önce …, sonra …” biçiminde adımları sıralamak puan kazandırır.","Kullanılan aracı (cetvel, gönye, açıölçer, pergel) ve nedenini belirt."],
  q:[
   ["Arkadaşınız, uzunluğu 6 cm olan bir doğru parçası çizerken cetveli 1 cm'den başlatmış ve 6 cm'de bitirmiştir. Çizimdeki hatayı ve doğrusunu açıklayınız.","Cetveli 1'den başlatıp 6'da bitirince doğru parçası 5 cm olur. Doğrusu: cetvelin 0 çizgisinden başlayıp 6 cm'de bitirmek (ya da 1'den başlatıp 7'de bitirmek)."],
   ["Bir A noktasından geçen ve verilen bir d doğrusuna dik olan doğruyu nasıl çizdiğinizi adım adım anlatınız.","Gönyenin bir dik kenarını d doğrusunun üzerine yerleştiririm. Gönyeyi d boyunca kaydırarak diğer dik kenarının A noktasından geçmesini sağlarım. Bu kenar boyunca çizgiyi çekerim; oluşan doğru d'ye diktir."]
  ]},
 {k:"MAT.5.3.3", ad:"Açıları ölçme (açıölçer)",
  oz:["Açı, başlangıç noktaları ortak iki ışının oluşturduğu şekildir; ortak noktaya köşe denir.","Açılar açıölçer ile ölçülür, birimi derecedir (°).","Açıölçerin merkezi açının köşesine, 0 çizgisi açının bir kenarına yerleştirilir; diğer kenarın geçtiği değer okunur.","Dar açı: 0°–90° arası · Dik açı: 90° · Geniş açı: 90°–180° arası · Doğru açı: 180°.","İki ölçek olduğu için 0'dan başlayan ölçeği okumak gerekir."],
  q:[
   ["Açıölçerle bir açıyı ölçerken hangi adımları izlersiniz? Sırasıyla yazınız.","1) Açıölçerin merkezini açının köşesine yerleştiririm. 2) 0° çizgisini açının bir kenarıyla çakıştırırım. 3) Diğer kenarın açıölçer üzerinde geçtiği değeri, 0'dan başlayan ölçekten okurum."],
   ["Ölçüleri 35°, 90°, 120° ve 180° olan açıları türlerine göre sınıflandırınız.","35° → dar açı, 90° → dik açı, 120° → geniş açı, 180° → doğru açı."],
   ["Saat tam 3:00'te akrep ile yelkovan arasındaki açı kaç derecedir ve hangi açı türüdür? Saat 6:00'da ne olur?","Saat 3:00'te açı 90°'dir → dik açı. Saat 6:00'da akrep ve yelkovan zıt yönlerdedir, açı 180°'dir → doğru açı."]
  ]},
 {k:"MAT.5.3.4", ad:"İki veya üç doğrunun oluşturduğu açılar",
  oz:["Kesişen iki doğru 4 açı oluşturur.","Karşılıklı (ters) açılar eşittir.","Yan yana (komşu) olup bir doğru üzerinde duran iki açının toplamı 180°'dir.","Kesişen doğrulardan biri 90° oluşturuyorsa dört açı da 90°'dir (dik kesişme).","Paralel iki doğru hiç kesişmez, açı oluşturmaz."],
  q:[
   ["İki doğru kesiştiğinde oluşan açılardan birinin ölçüsü 70°'dir. Diğer üç açının ölçülerini bulunuz ve nasıl bulduğunuzu açıklayınız.","70°'lik açının karşısındaki (ters) açı da 70°'dir. Yanındaki açılar 180° − 70° = 110°'dir; bunların ikisi de 110°'dir. Açılar: 70°, 110°, 70°, 110°."],
   ["Kesişen iki doğrunun oluşturduğu açılardan biri 90° ise diğer açılar hakkında ne söylenebilir? Bu doğrulara ne ad verilir?","Diğer üç açı da 90°'dir; çünkü ters açı 90°, komşu açılar 180° − 90° = 90°'dir. Bu doğrulara dik kesişen (birbirine dik) doğrular denir."],
   ["Bir noktada kesişen üç doğru 6 açı oluşturuyor. Açılardan ikisi 50° ve 60° ise kalan açılar kaç derecedir?","Bir doğru üzerindeki üç komşu açının toplamı 180°'dir: 50° + 60° + x = 180° → x = 70°. Ters açılar eşit olduğundan açılar: 50°, 60°, 70°, 50°, 60°, 70°."]
  ]},
 {k:"MAT.5.3.5", ad:"Çokgenleri kapalı şekiller olarak yorumlama",
  oz:["Çokgen: ardışık olarak kesişen doğru parçalarının oluşturduğu kapalı şekildir.","Kenarları doğru parçası olmalı (eğri olmamalı) ve şekil kapalı olmalıdır.","Çember, daire, açık uçlu şekiller çokgen değildir.","En az 3 kenar gerekir; en az kenarlı çokgen üçgendir."],
  q:[
   ["Bir şeklin çokgen olabilmesi için hangi iki koşulu sağlaması gerekir? Çember neden çokgen değildir?","1) Kenarları doğru parçalarından oluşmalı. 2) Kapalı bir şekil olmalı (doğru parçaları uç uca birleşmeli). Çember eğri bir çizgiden oluştuğu için çokgen değildir."],
   ["En az kaç doğru parçasıyla çokgen oluşturulabilir? İki doğru parçasıyla neden çokgen oluşturulamaz?","En az 3 doğru parçası gerekir (üçgen). İki doğru parçası kapalı bir şekil oluşturamaz, uçlar birleşse bile bir alan çevrelenmez."]
  ]},
 {k:"MAT.5.3.6", ad:"Çokgenlerin özellikleri",
  oz:["Çokgenlerde kenar sayısı = köşe sayısı = iç açı sayısı.","Üçgen 3, dörtgen 4, beşgen 5, altıgen 6 kenarlıdır.","Bütün kenar uzunlukları ve açı ölçüleri eşit olan çokgene düzgün çokgen denir (eşkenar üçgen, kare…).","Kare: 4 kenarı eşit, 4 açısı 90°. Dikdörtgen: karşılıklı kenarlar eşit, 4 açısı 90°."],
  q:[
   ["Altıgenin kaç kenarı, kaç köşesi ve kaç iç açısı vardır? Bu sayılar arasındaki ilişkiyi yazınız.","6 kenar, 6 köşe, 6 iç açı. Çokgenlerde kenar, köşe ve iç açı sayıları birbirine eşittir."],
   ["Kare ile dikdörtgenin benzer ve farklı birer özelliğini yazınız.","Benzer: İkisinin de 4 kenarı vardır ve tüm açıları 90°'dir. Farklı: Karenin 4 kenarı eşittir; dikdörtgende yalnızca karşılıklı kenarlar eşittir."],
   ["“Bütün kenarları eşit olan her çokgen düzgün çokgendir.” ifadesi doğru mudur? Bir örnekle açıklayınız.","Doğru değildir. Düzgün çokgende hem kenarlar hem açılar eşit olmalıdır. Örnek: eşkenar dörtgenin kenarları eşittir ama açıları eşit değildir; bu yüzden düzgün çokgen değildir."]
  ]},
 {k:"MAT.5.3.7", ad:"Çember çiftleri ile üçgen inşası",
  oz:["Pergelle çizilen çemberin merkezi ile çember üzerindeki her nokta arası uzaklık yarıçaptır.","İki çember iki noktada kesişirse, merkezler (A, B) ile kesişim noktası (C) birleştirilerek üçgen kurulur: AC = 1. yarıçap, BC = 2. yarıçap.","İki yarıçap eşitse üçgen ikizkenar olur; yarıçaplar ve merkezler arası uzaklık eşitse eşkenar olur; üçü de farklıysa çeşitkenar olur."],
  q:[
   ["A merkezli ve B merkezli, yarıçapları 5 cm olan iki çember C noktasında kesişiyor. |AB| = 5 cm ise ABC üçgeninin kenar uzunluklarını ve türünü yazınız.","|AC| = 5 cm (A merkezli çemberin yarıçapı), |BC| = 5 cm (B merkezli çemberin yarıçapı), |AB| = 5 cm. Üç kenar eşit → eşkenar üçgen."],
   ["Merkezleri arasındaki uzaklık 6 cm, yarıçapları 4 cm ve 4 cm olan iki çemberin kesişim noktası ile merkezleri birleştirilirse nasıl bir üçgen oluşur? Neden?","Kenarlar 4 cm, 4 cm ve 6 cm olur. İki kenar eşit olduğu için ikizkenar üçgen oluşur."]
  ]}
 ],

 id:"5-sos", g:5, ders:"Sosyal Bilgiler", ic:"🌍", tarih:"2026-11-06", tur:"Okul geneli ortak yazılı",
 tema:"Birlikte Yaşamak · Evimiz Dünya",
 kaz:[
 {k:"SB.5.1.1", ad:"Gruplar ve roller",
  oz:["Birey; aile, sınıf, okul, arkadaş, spor takımı, mahalle gibi farklı gruplara dâhildir.","Her grupta farklı rollerimiz vardır: evde çocuk/kardeş, okulda öğrenci/sınıf başkanı, takımda oyuncu/kaptan.","Her rol beraberinde haklar ve sorumluluklar getirir.","Bir kişinin rolleri zamanla değişebilir (öğrenci → öğretmen, çocuk → anne/baba)."],
  q:[
   ["Dâhil olduğunuz üç grubu ve bu gruplardaki rolünüzü yazınız.","Örnek: Aile – çocuk/kardeş; Sınıf – öğrenci/sınıf başkanı; Futbol takımı – oyuncu/kaptan; İzci grubu – üye. (Grup + uygun rol eşleşmesi olan her üç cevap tam puan.)"],
   ["Ece evde abla, okulda sınıf başkanı, kulüpte satranç oyuncusudur. Ece'nin bu rollerinden ikisinin getirdiği birer sorumluluğu yazınız.","Abla: kardeşine yardım etmek, örnek olmak. Sınıf başkanı: sınıfın düzenine yardımcı olmak, öğretmenle sınıf arasında iletişim kurmak. Satranç oyuncusu: antrenmanlara düzenli katılmak, takım arkadaşlarına saygılı olmak."],
   ["Rollerimizin zamanla değişebileceğini bir örnekle açıklayınız.","Örnek: Bugün öğrenci olan biri ileride öğretmen olabilir; çocuk olan biri ileride anne/baba olur. Grupta yer aldığımız konum değiştikçe rollerimiz de değişir."]
  ]},
 {k:"SB.5.1.2", ad:"Kültürel özelliklere saygı ve birlikte yaşama",
  oz:["Ülkemizde farklı yörelerin yemekleri, kıyafetleri, şiveleri, oyunları, düğün gelenekleri farklıdır: bu bir kültürel zenginliktir.","Farklılıklara saygı; huzur, kardeşlik ve birlikte yaşamayı güçlendirir.","Ortak değerlerimiz: bayramlar, millî günler, misafirperverlik, yardımlaşma, dil, tarih.","Önyargı ve alay etmek birlikte yaşamayı zedeler."],
  q:[
   ["Sınıfınıza başka bir şehirden yeni bir arkadaş geldi. Konuşma şivesi sizden farklı. Birlikte yaşama kültürüne uygun olarak nasıl davranırsınız? İki davranış yazınız.","Şivesiyle alay etmem, onu saygıyla dinlerim; oyunlara ve gruplara davet ederim; memleketinin kültürünü merak edip sorarım; okulu tanımasına yardım ederim. (İki uygun davranış.)"],
   ["Farklı kültürel özelliklere saygı duymanın toplum hayatına iki olumlu etkisini yazınız.","Toplumda huzur ve barış artar; insanlar arasında dostluk ve kardeşlik güçlenir; kültürel zenginlik korunur; çatışma ve kırgınlıklar azalır. (İki doğru etki.)"],
   ["Yaşadığınız yöreye ait iki kültürel özellik yazınız ve bu özelliklerin korunması için neler yapılabileceğini belirtiniz.","Örnek: Yöresel yemek, halk oyunu, el sanatı, türkü, düğün geleneği. Korumak için: yaşlılardan öğrenmek, okul etkinliklerinde tanıtmak, festivallere katılmak, fotoğraf/video ile kayıt altına almak."]
  ]},
 {k:"SB.5.1.3", ad:"Yardımlaşma ve dayanışma",
  oz:["Yardımlaşma ve dayanışma toplumsal birliği güçlendirir.","Geleneksel örnekler: imece, ahilik, vakıflar, sadaka taşı, askıda ekmek, kandil-bayram ziyaretleri.","Günümüz örnekleri: AFAD, Kızılay, LÖSEV, TEMA, Yeşilay gibi kurumlar; kan bağışı; afet bölgesine yardım kampanyaları.","Okulda: kermes, kitap bağışı, kardeş okul projesi."],
  q:[
   ["İmece ve askıda ekmek uygulamalarını açıklayarak bunların toplumsal birliğe katkısını yazınız.","İmece: Köyde bir işin (ev yapımı, hasat) herkesin birlikte çalışmasıyla yapılması. Askıda ekmek: Fırına bir ekmek fazla parası bırakılıp ihtiyacı olanın alması. Katkı: İnsanlar arasında bağları ve güveni güçlendirir, ihtiyaç sahibi incinmeden desteklenir, toplumsal birlik artar."],
   ["Okulunuzda yardımlaşma ve dayanışmayı artırmak için yapılabilecek iki etkinlik öneriniz.","Örnek: İhtiyaç sahipleri için kermes, kitap/kırtasiye bağış kampanyası, köy okuluyla kardeş okul projesi, sokak hayvanları için mama toplama, yaşlılar evini ziyaret. (İki uygun öneri.)"],
   ["Bir deprem sonrasında yardımlaşma ve dayanışma faaliyetlerinde görev alan iki kurum yazınız ve sizin bir öğrenci olarak yapabileceğiniz bir katkıyı belirtiniz.","Kurumlar: AFAD, Kızılay (ayrıca AKUT, belediyeler). Öğrenci katkısı: yardım kampanyasına giysi/oyuncak bağışlamak, kardeşlik mektubu yazmak, kan bağışı için aileyi bilinçlendirmek."]
  ]},
 {k:"SB.5.2.1", ad:"Yaşadığı ilin göreceli konumu",
  oz:["Göreceli (özel) konum: bir yerin çevresindeki başka yerlere göre tanımlanmasıdır.","Örnek: “İstanbul, Marmara Denizi'nin kuzeyinde, İstanbul Boğazı'nın iki yakasında yer alır.”","Yön bulmada ana yönler (kuzey, güney, doğu, batı) ve ara yönler (kuzeydoğu, kuzeybatı…) kullanılır.","Komşu iller, denizler, göller, dağlar, boğazlar göreceli konum anlatırken kullanılır."],
  q:[
   ["Yaşadığınız ilin göreceli konumunu en az iki yer şekli veya komşu il kullanarak anlatınız.","Örnek (İstanbul): İstanbul, Marmara Denizi'nin kuzeyinde, Karadeniz'in güneyinde yer alır; batısında Tekirdağ, doğusunda Kocaeli bulunur ve İstanbul Boğazı ile ikiye ayrılır. (Kendi iline uygun, en az iki referanslı doğru anlatım.)"],
   ["Göreceli konum ile bir yerin adresini tarif etmek arasında nasıl bir benzerlik vardır? Bir örnekle açıklayınız.","İkisinde de bir yer çevresindeki bilinen yerlere göre tarif edilir. Örnek: “Okulumuz parkın karşısında, caminin yanındadır.” bir tarif; “İlimiz Marmara Denizi'nin kuzeyindedir.” göreceli konumdur."]
  ]}

DATA.push({

 tema:"Okuma · Yazma (metin anlama, söz varlığı, yazım-noktalama)",
 metin:{
  M1:{b:"Kırık Kalemtıraş", t:"Sınav sabahı Deniz, çantasını açınca kalemtıraşının ikiye ayrıldığını gördü. Kalemi de körelmişti. Yüzü kızardı, gözleri doldu. Sıra arkadaşı Ali bunu fark etti. Hiçbir şey söylemeden kendi kalemtıraşını sıranın ortasına koydu ve gülümsedi.\nDeniz o gün yazılıda bütün soruları rahatça cevapladı. Teneffüste Ali'ye teşekkür etmek istedi ama Ali çoktan bahçeye koşmuştu. Deniz, cebindeki harçlıkla yeni bir kalemtıraş aldı. Ertesi sabah onu Ali'nin sırasına bıraktı; yanına küçük bir not iliştirdi: “İyilik paylaştıkça çoğalır.”"},
  M2:{b:"Arıların Dansı", t:"Bal arıları, yiyecek bulduklarında bunu kovandaki arkadaşlarına dans ederek anlatır. Yiyecek yakındaysa arı daireler çizerek döner; buna “yuvarlak dans” denir. Yiyecek uzaktaysa arı sekiz rakamına benzeyen bir yol izler ve gövdesini sallar; buna “sallanma dansı” denir. Dansın yönü, çiçeklerin Güneş'e göre hangi tarafta olduğunu gösterir. Bilim insanları, arıların bu yolla yüzlerce metre ötedeki çiçekleri bile tarif edebildiğini belirlemiştir."}
 },
 kaz:[
 {k:"T.O.5.4", ad:"Bilinmeyen kelimenin anlamını bağlamdan tahmin etme",
  oz:["Kelimenin anlamını cümlenin geri kalanından, önceki-sonraki cümlelerden tahmin et.","Tahminini sözlükle kontrol et.","Kelime yerine kendi tahminini koyup cümle anlamlı mı diye dene."],
  q:[
   ["Metinde geçen “iliştirdi” kelimesinin anlamını cümlenin bağlamından tahmin ederek yazınız.","İliştirmek: bir şeyi başka bir şeyin yanına/üzerine tutturmak, eklemek. Deniz notu kalemtıraşın yanına koyup tutturmuştur.","M1"],
   ["Metinde geçen “körelmişti” kelimesi, kalem için hangi anlamda kullanılmıştır? Tahmininizi bir cümleyle açıklayınız.","Kalemin ucunun sivriliğini kaybetmesi, yazmayacak hâle gelmesi anlamında kullanılmıştır. Kalemtıraş kırık olduğu için açılamamıştır.","M1"]
  ]},
 {k:"T.O.5.5", ad:"Metnin yüzey anlamını belirleme (5N1K)",
  oz:["Yüzey anlam: metinde açıkça yazan bilgilerdir.","Kim? Ne? Nerede? Ne zaman? Neden? Nasıl? sorularıyla metni tara.","Cevabı metindeki cümlelere dayandır."],
  q:[
   ["Deniz'in sınav sabahı yaşadığı sorun nedir ve bu sorun nasıl çözülmüştür?","Sorun: Kalemtıraşı ikiye ayrılmış, kalemi körelmişti. Çözüm: Sıra arkadaşı Ali kendi kalemtıraşını sıranın ortasına koyarak ona yardım etti.","M1"],
   ["Bal arıları yiyeceğin yakında ve uzakta olduğunu hangi danslarla anlatır? Yazınız.","Yakındaysa “yuvarlak dans” (daireler çizerek dönme), uzaktaysa “sallanma dansı” (sekiz rakamına benzeyen yol + gövdeyi sallama).","M2"],
   ["Deniz, Ali'ye neden teneffüste teşekkür edemedi? Ertesi gün ne yaptı?","Çünkü Ali çoktan bahçeye koşmuştu. Ertesi sabah harçlığıyla aldığı yeni kalemtıraşı ve bir notu Ali'nin sırasına bıraktı.","M1"]
  ]},
 {k:"T.O.5.7", ad:"Derin anlama yönelik çıkarım yapma",
  oz:["Çıkarım: metinde açıkça yazmayan ama ipuçlarından anlaşılan anlamdır.","Duygular, karakter özellikleri, ana fikir çıkarım ile bulunur.","“Bu davranış kahramanın nasıl biri olduğunu gösterir?” sorusunu sor."],
  q:[
   ["Ali'nin “hiçbir şey söylemeden” yardım etmesi onun hakkında ne düşündürüyor? İki özellik yazınız ve gerekçelendiriniz.","Ali yardımsever ve alçakgönüllüdür: Arkadaşının zor durumunu fark etmiş, onu utandırmamak için sessizce yardım etmiş, karşılık beklememiştir (teşekkür beklemeden bahçeye koşmuştur).","M1"],
   ["Metnin ana fikrini bir cümleyle yazınız.","İyilik karşılık beklemeden yapılmalıdır; yapılan iyilik paylaştıkça çoğalır.","M1"]
  ]},
 {k:"T.O.5.21", ad:"Söz varlığını geliştirme (eş-zıt anlam, deyim, mecaz)",
  oz:["Eş anlamlı: yazılışı farklı, anlamı aynı (siyah–kara, okul–mektep).","Zıt anlamlı: anlamca karşıt (uzak–yakın, kırık–sağlam).","Deyim: genellikle mecaz anlamlı kalıplaşmış söz (yüzü kızarmak = utanmak).","Gerçek anlam: kelimenin ilk anlamı; mecaz anlam: gerçek anlamdan uzaklaşmış anlamı."],
  q:[
   ["Metinde geçen “yüzü kızardı” ve “gözleri doldu” ifadeleri Deniz'in hangi duygularını anlatmaktadır?","“Yüzü kızardı” utanma/mahcubiyet, “gözleri doldu” üzüntü, ağlamaklı olma duygusunu anlatır.","M1"],
   ["Aşağıdaki kelimelerin zıt anlamlılarını yazınız: yakın, kırık, rahat, eski.","yakın – uzak, kırık – sağlam, rahat – zor/huzursuz, eski – yeni."],

 {k:"DKAB.5.1.1", ad:"Evrendeki mükemmel düzen",
  oz:["Gece ile gündüzün birbirini izlemesi, mevsimlerin düzenli gelmesi, gezegenlerin yörüngelerinde hareketi evrendeki düzene örnektir.","İnsan vücudundaki düzen (kalp, solunum, sindirim) de mükemmel bir uyum içindedir.","Bu düzen, her şeyi bilen ve gücü yeten bir yaratıcının varlığına işarettir.","Kur'an, insanları evrendeki düzeni düşünmeye davet eder."],
  q:[
   ["Evrendeki düzene doğadan üç örnek yazınız.","Gece ile gündüzün birbirini izlemesi; mevsimlerin düzenli değişmesi; Dünya'nın Güneş etrafında, Ay'ın Dünya etrafında düzenli dolanması; suyun döngüsü; bitkilerin her bahar yeşermesi. (Üç doğru örnek.)"],
   ["“Evrendeki düzen tesadüf eseri olamaz.” düşüncesini bir benzetmeyle açıklayınız.","Örnek: Bir saatin parçalarının kendiliğinden bir araya gelip doğru çalışması mümkün değildir; onu bir saatçi yapmıştır. Evrendeki kusursuz düzen de onu yaratan ve yöneten bir yaratıcının (Allah'ın) varlığını gösterir."],
   ["İnsan vücudundaki düzene iki örnek veriniz.","Kalbin hiç durmadan kanı pompalaması; solunumun uykuda bile devam etmesi; yaraların kendiliğinden iyileşmesi; göz kapağının gözü koruması. (İki doğru örnek.)"]

  q:[
   ["Tevhid kavramını açıklayınız. Tevhidin zıttı olan kavram nedir?","Tevhid: Allah'ın bir olduğuna, eşi, benzeri ve ortağı olmadığına inanmaktır. Zıttı şirktir (Allah'a ortak koşmak)."],
   ["İhlâs Suresi'nde Allah'ın hangi özellikleri anlatılmaktadır? İki tanesini yazınız.","Allah'ın bir olduğu; hiçbir şeye muhtaç olmadığı (her şeyin O'na muhtaç olduğu); doğurmadığı ve doğmadığı; hiçbir şeyin O'na denk olmadığı. (İki doğru özellik.)"]
  ]},
 {k:"DKAB.5.1.3", ad:"Allah'ın güzel isimleri (Esmâ-i Hüsnâ)",
  oz:["Hâlık: Yaratan. Rezzâk: Rızık veren. Rahmân: Dünyada bütün canlılara merhamet eden. Rahîm: Ahirette müminlere merhamet eden.","Semî: Her şeyi işiten. Basîr: Her şeyi gören. Alîm: Her şeyi bilen. Kadîr: Gücü her şeye yeten.","Gafûr: Bağışlayan. Adl: Adaletli olan. Vedûd: Çok seven."],

DATA.push({

  oz:["Güneş'e yakından uzağa: Merkür, Venüs, Dünya, Mars, Jüpiter, Satürn, Uranüs, Neptün.","İç (karasal) gezegenler: Merkür, Venüs, Dünya, Mars → kayaç yapılı, küçük, halkasız. Asteroit kuşağı Mars ile Jüpiter arasındadır.","Dış (gaz) gezegenler: Jüpiter, Satürn, Uranüs, Neptün → büyük, gaz yapılı, halkalı, çok uydulu.","En büyük: Jüpiter · En küçük ve Güneş'e en yakın: Merkür · En sıcak: Venüs (kalın atmosfer) · Belirgin halkalar: Satürn · Kızıl gezegen: Mars."],
  q:[
   ["Gezegenleri iç ve dış gezegenler olarak iki gruba ayırınız. Gruplamayı neye göre yaptığınızı yazınız.","İç gezegenler: Merkür, Venüs, Dünya, Mars. Dış gezegenler: Jüpiter, Satürn, Uranüs, Neptün. Ölçüt: Asteroit kuşağına göre konum (iç gezegenler kuşağın Güneş tarafında) / yapı (iç gezegenler kayaç, dış gezegenler gaz yapılı)."],
   ["İç gezegenler ile dış gezegenlerin iki farklı özelliğini karşılaştırınız.","İç gezegenler kayaç (katı) yapılı, küçük, halkasız ve az uydulu/uydusuz; dış gezegenler gaz yapılı, büyük, halkalı ve çok uydulu. (İki doğru karşılaştırma.)"],
   ["Merkür Güneş'e en yakın gezegen olduğu hâlde en sıcak gezegen Venüs'tür. Bunun nedenini açıklayınız.","Venüs'ün çok kalın bir atmosferi vardır; bu atmosfer ısıyı hapseder (sera etkisi). Merkür'ün atmosferi neredeyse yoktur, ısı uzaya kaçar. Bu yüzden Venüs daha sıcaktır."]

 {k:"FB.6.1.3", ad:"Güneş ve Ay tutulması",

  q:[
   ["Güneş tutulması ve Ay tutulmasında Güneş, Dünya ve Ay'ın sıralanışını yazınız.","Güneş tutulması: Güneş – Ay – Dünya (Ay ortada). Ay tutulması: Güneş – Dünya – Ay (Dünya ortada)."],
   ["Güneş tutulması hangi Ay evresinde ve günün hangi zamanında gerçekleşir? Ay tutulması için de aynı soruyu cevaplayınız.","Güneş tutulması Yeni Ay evresinde, gündüz gerçekleşir. Ay tutulması Dolunay evresinde, gece gerçekleşir."],
   ["Güneş tutulmasını izlemek isteyen bir öğrenciye iki güvenlik önerisi yazınız.","Güneşe asla çıplak gözle veya normal güneş gözlüğüyle bakmamalı; sertifikalı özel tutulma gözlüğü/filtre kullanmalı; dürbün ve teleskopla filtresiz bakmamalı; iğne deliği yöntemiyle dolaylı gözlem yapabilir. (İki öneri.)"]

 {k:"FB.6.2.1", ad:"Aynı doğrultudaki kuvvetler ve bileşke kuvvet",
  oz:["Bir cisme etki eden kuvvetlerin yaptığı etkiyi tek başına yapan kuvvete bileşke kuvvet denir.","Aynı yönlü kuvvetler toplanır; bileşke aynı yöndedir.","Zıt yönlü kuvvetler çıkarılır; bileşke büyük kuvvetin yönündedir.","Örnek: 30 N sağa + 20 N sağa = 50 N sağa · 30 N sağa + 20 N sola = 10 N sağa."],
  q:[
   ["Bir kutuyu Ayşe 40 N, Can 25 N kuvvetle aynı yönde itiyor. Bileşke kuvvetin büyüklüğünü ve yönünü bulunuz.","Aynı yönlü kuvvetler toplanır: 40 + 25 = 65 N, Ayşe ve Can'ın ittiği yönde."],
   ["Halat çekme oyununda A takımı 300 N ile sola, B takımı 260 N ile sağa çekiyor. Bileşke kuvvetin büyüklüğünü ve yönünü bulunuz. Hangi takım kazanır?","Zıt yönlü kuvvetler çıkarılır: 300 − 260 = 40 N, sola (A takımının yönünde). A takımı kazanır."],
   ["Bir cisme sağa doğru 15 N ve 10 N, sola doğru 25 N kuvvet uygulanıyor. Bileşke kuvvet kaç N'dur? Yorumlayınız.","Sağa: 15 + 10 = 25 N; sola 25 N. Bileşke = 25 − 25 = 0 N. Kuvvetler dengelenmiştir (dengelenmiş kuvvetler)."]

 {k:"FB.6.2.2", ad:"Dengelenmiş ve dengelenmemiş kuvvetler",

  q:[
   ["Masa üzerinde duran bir kitaba etki eden kuvvetler dengelenmiş midir? Gerekçesiyle açıklayınız.","Evet, dengelenmiştir. Kitaba aşağı yönde yer çekimi, yukarı yönde masanın tepki kuvveti etki eder; bu kuvvetler eşit ve zıt yönlü olduğu için bileşke sıfırdır ve kitap durmaya devam eder."],
   ["Dengelenmemiş kuvvetlerin etkisindeki bir cisimde hangi değişiklikler gözlenebilir? İki örnekle açıklayınız.","Sürati artabilir/azalabilir veya hareket yönü değişebilir; duran cisim harekete geçebilir. Örnek: Kale direğine çarpıp yön değiştiren top; fren yapınca yavaşlayan bisiklet; ittirilen alışveriş arabasının harekete geçmesi."],
   ["Düz bir yolda sabit süratle giden bir otomobile etki eden kuvvetler hakkında ne söylenebilir? Açıklayınız.","Otomobil sabit süratle ve aynı yönde gittiğine göre kuvvetler dengelenmiştir; motorun ileri itme kuvveti ile sürtünme ve hava direnci eşittir, bileşke sıfırdır."]

 {k:"FB.6.2.3", ad:"Sürat ve hız",
  oz:["Sürat = Alınan yol ÷ Geçen süre. Yönü yoktur.","Hız = Yer değiştirme ÷ Geçen süre; büyüklüğün yanında yönü de belirtilir (ör. 60 km/h doğuya).","Birimler: m/s, km/h.","Sabit süratli hareket: eşit zaman aralıklarında eşit yol alınır."],
  q:[
   ["Bir bisikletli 600 metrelik yolu 120 saniyede alıyor. Bisikletlinin süratini hesaplayınız.","Sürat = yol / zaman = 600 m / 120 s = 5 m/s."],
   ["Sürat ile hız kavramları arasındaki farkı bir örnekle açıklayınız.","Süratte yalnızca büyüklük vardır, hızda büyüklüğün yanında yön de belirtilir. Örnek: “Araba 80 km/h ile gidiyor.” sürattir; “Araba 80 km/h ile kuzeye gidiyor.” hızdır."],

  q:[

  oz:["Fiziksel iş için cisme kuvvet uygulanmalı ve cisim kuvvet doğrultusunda yol almalıdır.","İş = Kuvvet × Yol (W = F · x). Birimi joule (J) → 1 J = 1 N · 1 m.","Kuvvet uygulanır ama cisim hareket etmezse iş yapılmaz (duvarı itmek).","Kuvvet hareket yönüne dik ise iş yapılmaz (çantayı yatay yolda taşırken tutma kuvveti).","Günlük hayattaki “iş” ile fiziksel iş farklıdır (ders çalışmak fiziksel iş değildir)."],
  q:[
   ["Bir öğrenci 20 N'luk kuvvetle bir kutuyu kuvvet doğrultusunda 5 m itiyor. Yapılan işi hesaplayınız.","İş = Kuvvet × Yol = 20 N × 5 m = 100 J."],
   ["Aşağıdaki durumlardan hangilerinde fiziksel anlamda iş yapılmıştır? Gerekçesiyle yazınız.\n1) Duvarı tüm gücüyle iten Ali\n2) Yerdeki çantayı masaya kaldıran Ece\n3) Sınava çalışan Mert","1) İş yapılmaz; kuvvet var ama duvar yer değiştirmez. 2) İş yapılır; kuvvet uygulanmış ve çanta kuvvet doğrultusunda (yukarı) yol almıştır. 3) Fiziksel anlamda iş yapılmaz; kuvvet doğrultusunda yer değiştirme yoktur."],
   ["Çantasını elinde tutarak düz bir koridorda yürüyen öğrencinin çantaya uyguladığı kuvvet iş yapar mı? Açıklayınız.","Yapmaz. Öğrenci çantaya yukarı doğru kuvvet uygular; çanta ise yatay yönde hareket eder. Kuvvet ile hareket yönü birbirine dik olduğundan bu kuvvet iş yapmaz."],
   ["Fiziksel anlamda işin bağlı olduğu iki faktörü yazınız. Kuvvet iki katına çıkarılır, yol aynı kalırsa iş nasıl değişir?","Uygulanan kuvvet ve kuvvet doğrultusunda alınan yol. Kuvvet iki katına çıkarsa (yol aynıyken) iş de iki katına çıkar."]
  ]},
 {k:"FB.7.2.2", ad:"Kinetik ve potansiyel enerji",
  oz:["Kinetik enerji: hareket enerjisi; kütle ve sürate bağlıdır. Duran cismin kinetik enerjisi sıfırdır.","Çekim potansiyel enerjisi: yükseklikten dolayı; kütle ve yüksekliğe bağlıdır.","Esneklik potansiyel enerjisi: sıkıştırılmış/gerilmiş yay, lastik, ok yayı; esneme miktarı ve maddenin cinsine bağlıdır.","Enerji birimi joule (J)."],
  q:[
   ["Aynı süratle giden bir kamyon ile bir otomobilden hangisinin kinetik enerjisi daha büyüktür? Neden?","Kamyonun. Kinetik enerji kütle ve sürate bağlıdır; süratler eşitken kütlesi daha büyük olan kamyonun kinetik enerjisi daha fazladır."],
   ["Kütleleri eşit iki saksıdan biri 2. kattaki, diğeri 5. kattaki balkonda duruyor. Hangisinin çekim potansiyel enerjisi daha fazladır? Kinetik enerjileri hakkında ne söylenebilir?","5. kattaki saksının çekim potansiyel enerjisi daha fazladır (yükseklik daha fazla). İkisi de durduğu için kinetik enerjileri sıfırdır."],
   ["Gerilmiş bir okçuluk yayında hangi enerji türü depolanmıştır? Bu enerji neye bağlıdır?","Esneklik potansiyel enerjisi. Esneklik potansiyel enerjisi yayın gerilme (esneme) miktarına ve maddenin cinsine bağlıdır."]
  ]}

  q:[

 {k:"MAT.7.1.2", ad:"Rasyonel sayıların ondalık gösterimi",
  oz:["Ondalık gösterim için pay paydaya bölünür: 3/4 = 0,75.","Sonlu ondalık: 0,25 · Devirli ondalık: 1/3 = 0,333… = 0,3̅ ; 2/11 = 0,1818… = 0,1̅8̅.","Paydası yalnızca 2 ve 5 çarpanlarından oluşan (sadeleşmiş) kesirler sonlu ondalık gösterilir.","Gerçek yaşam: para (12,50 TL), uzunluk (1,75 m), sıcaklık (−2,5 °C)."],

   ["Bir manavda 1 kg elma 3/4 kg ve 1 1/4 kg olarak iki poşete ayrılmış. Poşetlerin ağırlıklarını ondalık gösterimle yazınız ve toplamını bulunuz.","3/4 = 0,75 kg; 1 1/4 = 1,25 kg. Toplam = 2 kg."]

 {k:"MAT.7.1.3", ad:"Rasyonel sayıları karşılaştırma ve sıralama",

   ["−3/4, 0,5, −1, 2/3 sayılarını küçükten büyüğe sıralayınız.","−1 < −3/4 < 0,5 < 2/3 (0,5 < 0,666…)."],
   ["Bir haftada ölçülen sıcaklıklar: Pazartesi −2,5 °C, Salı −4 °C, Çarşamba 1,5 °C. En soğuk ve en sıcak gün hangisidir? Açıklayınız.","En soğuk: Salı (−4 °C, en küçük sayı). En sıcak: Çarşamba (1,5 °C, en büyük sayı)."],
   ["5/6 ile 7/9 kesirlerini karşılaştırınız. Nasıl karşılaştırdığınızı gösteriniz.","Paydaları 18'de eşitleriz: 5/6 = 15/18, 7/9 = 14/18. 15/18 > 14/18 → 5/6 > 7/9."]

 {k:"MAT.7.1.4", ad:"Rasyonel sayılarla gerçek yaşam problemleri",
  oz:["Toplama-çıkarma: paydalar eşitlenir. Çarpma: pay×pay / payda×payda. Bölme: ilk kesir, ikincinin ters çevrilmişiyle çarpılır.","İşaret kuralı: (+)·(−) = (−), (−)·(−) = (+).","Problemde verilen ve isteneni yaz, işlemi seç, sonucu bağlama göre yorumla."],
  q:[

   ["Sıcaklık sabah −3,5 °C idi; öğlene kadar 7,25 °C arttı, akşam 4,5 °C azaldı. Akşamki sıcaklık kaç °C'dir?","−3,5 + 7,25 = 3,75 °C; 3,75 − 4,5 = −0,75 °C."],

  q:[

  q:[
   ["Özel gereksinimli bireylerin sosyal hayata katılımını kolaylaştıran üç düzenleme yazınız.","Tekerlekli sandalye rampaları ve asansörler, görme engelliler için hissedilebilir yollar, sesli trafik ışıkları, işaret dili tercümanı, Braille alfabeli yazılar, engelli otoparkları, kaynaştırma eğitimi. (Üç doğru düzenleme.)"],

function byId(id){for(var i=0;i<DATA.length;i++)if(DATA[i].id===id)return DATA[i];return null}
function resmiSen(s){return s.sen.filter(function(x){return x.resmi})}

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

  if(q.ord){h+='<div class="ppics">';q.ord.forEach(function(k){h+='<div>'+scene(k,S.pv)+'<div>________</div></div>'});h+='</div>'}
  if(q.pic){h+='<div class="ppics">';q.pic.forEach(function(k,ii){h+='<div>'+scene(k,S.pv)+'<div>'+(ii+1)+'. ____________________</div></div>'});h+='</div>'}
  else if(q.tab){h+='<table class="ptab"><tr><th>Role in the celebration</th><th>Name</th></tr>';q.it.forEach(function(it){h+='<tr><td>'+esc(it.p)+'</td><td>____________________</td></tr>'});h+='</table>'}
  else if(q.it){q.it.forEach(function(it){h+='<div style="margin-top:6px">'+esc(it.p).replace("%%","______________")+'</div>'})}
  if(q.plan)h+='<table class="ptab"><tr><th>Time of day</th><th>'+esc(q.plan)+'\'s plan</th></tr><tr><td>In the morning</td><td>get up early, have breakfast</td></tr><tr><td>In the afternoon</td><td>come home, do homework</td></tr><tr><td>In the evening</td><td>read a book, go to bed</td></tr></table>';
  if(q.yaz)h+='<div style="margin-top:6px">.........................................................................................................<br>.........................................................................................................<br>.........................................................................................................</div>';
  h+='</div>'});
 h+='</div><div class="pg"><div class="ph">ANSWER KEY · '+esc(V.ad)+'</div><table class="ptab"><tr><th>ÖĞRENME ÇIKTISI</th><th>SORU NO</th></tr>';P.ciktilar.forEach(function(c){h+='<tr><td>'+c[0]+'. '+esc(c[1])+'</td><td style="text-align:center">'+c[2]+'</td></tr>'});h+='</table>';
 V.q.forEach(function(q){if(!q.n&&q.ord){h+='<div class="pk">1B. Soldan sağa: '+q.cev.join(" - ")+'</div>';return}h+='<div class="pk"><b>'+q.n+'.</b> ';if(q.it)h+=q.it.map(function(it,i){return (q.it.length>1?(i+1)+') ':'')+it.a.slice(0,2).join(" / ")}).join(" &nbsp; ");if(q.yaz)h+='<br>'+esc(q.yaz);h+='</div>'});
 h+='</div>';$("print").innerHTML=h;setTimeout(function(){window.print()},200);
}

/* ---------- RENDER & EVENTS ---------- */
function render(){
 $("app").innerHTML=S.view==="home"?home():subject();
 if(S.view==="home")tickCd();
 if(S.exam&&S.exam.sure&&!S.exam.bitti)tickTm();
}
function tickCd(){var e=$("cd"),ne=nextExam();if(!e||!ne)return;var ms=dt(ne.tarih)-new Date();if(ms<0)ms=0;var d=Math.floor(ms/864e5),hh=Math.floor(ms%864e5/36e5),mm=Math.floor(ms%36e5/6e4),ss=Math.floor(ms%6e4/1e3);e.innerHTML='<span>'+d+'<small>gün</small></span><span>'+hh+'<small>saat</small></span><span>'+mm+'<small>dk</small></span><span>'+ss+'<small>sn</small></span>'}
function tickTm(){var e=$("tm");if(!e||!S.exam)return;var k=Math.max(0,S.exam.bitis-Date.now());e.textContent=Math.floor(k/6e4)+":"+("0"+Math.floor(k%6e4/1e3)).slice(-2);if(k<=0){bitir()}}
setInterval(function(){if(S.view==="home")tickCd();else if(S.exam&&S.exam.sure&&!S.exam.bitti)tickTm()},1000);
function saveAns(){var t=document.querySelectorAll("textarea[data-i]");for(var i=0;i<t.length;i++)S.exam.cev[+t[i].getAttribute("data-i")]=t[i].value}
function bitir(){saveAns();S.exam.bitti=true;render();window.scrollTo(0,0)}
function basla(sure){var s=byId(S.subj);S.exam={sen:S.sen,qs:build(s,S.sen),cev:{},puan:{},bitti:false,sure:sure,bitis:Date.now()+40*6e4};render();window.scrollTo(0,0)}
function pvSet(e){if(e.target.hasAttribute("data-pk"))S.pvAns[e.target.getAttribute("data-pk")]=e.target.value}
document.addEventListener("change",pvSet);
document.addEventListener("input",function(e){pvSet(e);if(e.target.matches("textarea[data-i]"))S.exam.cev[+e.target.getAttribute("data-i")]=e.target.value});
document.addEventListener("click",function(e){
 var t=e.target.closest("[data-pv],[data-g],[data-s],[data-a],[data-t],[data-kz],[data-sh],[data-sen],[data-p]");if(!t)return;
 if(t.hasAttribute("data-pv")){S.pv=+t.getAttribute("data-pv");S.pvAns={};S.pvChk=false;S.pvShow=false;render();return}
 if(t.hasAttribute("data-g")){var g=t.getAttribute("data-g");S.grade=isNaN(+g)?g:+g;render();return}
 if(t.hasAttribute("data-s")){S.subj=t.getAttribute("data-s");S.view="subj";S.tab="konu";S.sen=0;S.exam=null;render();window.scrollTo(0,0);return}
 if(t.hasAttribute("data-t")){if(S.exam&&!S.exam.bitti&&!confirm("Devam eden denemen silinecek. Emin misin?"))return;S.tab=t.getAttribute("data-t");S.exam=null;render();return}
 if(t.hasAttribute("data-kz")){$("kz"+t.getAttribute("data-kz")).classList.toggle("open");return}
 if(t.hasAttribute("data-sh")){var q=t.closest(".qx");q.classList.toggle("show");t.textContent=q.classList.contains("show")?"Cevabı gizle":"Cevabı göster";return}
 if(t.hasAttribute("data-sen")){S.sen=+t.getAttribute("data-sen");var v=$("okul")&&$("okul").value;render();if(v&&$("okul"))$("okul").value=v;return}
 if(t.hasAttribute("data-p")){var i=+t.getAttribute("data-p");S.exam.puan[i]=t.getAttribute("data-v");var s=byId(S.subj),tot=puanla(S.exam);if(S.exam.qs.every(function(o,j){return S.exam.puan[j]})){var b=+(ls(bestKey(s.id))||0);if(tot>b)ls(bestKey(s.id),tot)}var y=window.scrollY;render();window.scrollTo(0,y);return}
 var a=t.getAttribute("data-a");
 if(a==="home"){if(S.exam&&!S.exam.bitti&&!confirm("Devam eden denemen silinecek. Emin misin?"))return;S.view="home";S.exam=null;render();window.scrollTo(0,0)}
 else if(a==="basla")basla(true);else if(a==="baslaSuresiz")basla(false);
 else if(a==="bitir"){saveAns();var bos=S.exam.qs.filter(function(o,i){return !(S.exam.cev[i]||"").trim()}).length;if(bos&&!confirm(bos+" soru boş. Yine de bitirilsin mi?"))return;bitir()}
 else if(a==="iptal"){S.exam=null;render()}
 else if(a==="yeni"){basla(S.exam.sure)}
 else if(a==="pvkontrol"){var sb=byId(S.subj);pvCheck(sb);S.pvChk=true;S.pvShow=false;render()}
 else if(a==="pvgoster"){S.pvShow=!S.pvShow;S.pvChk=false;render()}
 else if(a==="pvtemizle"){if(confirm("Tüm cevaplar silinsin mi?")){S.pvAns={};S.pvChk=false;S.pvShow=false;render()}}
 else if(a==="pvprint")printProva(byId(S.subj));
 else if(a==="pr")printExam(byId(S.subj),t.getAttribute("data-k")==="1");
});
render();
})();
</script>
</body>
</html>
