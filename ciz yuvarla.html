<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--z:1;--yesil:#22c55e;--mavi:#2f6fd6;--mor:#7c3aed;--turuncu:#f59e0b;--metin:#1e293b;--kart:#ffffff;
  --f:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#9fd4f5;font-family:var(--f);color:var(--metin);
  font-variant-numeric:lining-nums tabular-nums;user-select:none;-webkit-user-select:none;touch-action:none}
#cv{position:absolute;left:0;top:0;touch-action:none;display:block}
.ui{zoom:var(--z)}
button{font-family:var(--f);font-weight:800;cursor:pointer;border:0}
.gizli{display:none!important}

/* ÜST GÖSTERGE (yalnız gösterim) */
#hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;pointer-events:none;z-index:20}
.pill{background:rgba(255,255,255,.92);border-radius:999px;padding:7px 16px;font-weight:800;font-size:19px;box-shadow:0 3px 10px rgba(0,0,0,.12);white-space:nowrap}
#murekkepKutu{display:flex;align-items:center;gap:8px}
#murekkepBar{width:min(30vw,260px);height:16px;border-radius:99px;background:#e2e8f0;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.15)}
#murekkepDolu{height:100%;width:100%;background:linear-gradient(90deg,#3b82f6,#7c3aed);transition:width .1s}
#hudYildiz{letter-spacing:2px}

/* ALT ÇUBUK (çocuk boyu — tüm dokunmalar altta) */
#alt{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 10px calc(10px + env(safe-area-inset-bottom));z-index:20;pointer-events:none}
#alt .grup{display:flex;gap:8px;pointer-events:auto}
.db{background:rgba(255,255,255,.95);color:var(--metin);border-radius:16px;padding:10px 14px;font-size:19px;min-height:52px;
  box-shadow:0 4px 0 rgba(0,0,0,.14),0 6px 14px rgba(0,0,0,.12);display:inline-flex;align-items:center;gap:6px}
.db:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.14)}
.db.buyuk{background:var(--yesil);color:#fff;font-size:24px;padding:10px 26px;min-height:60px;box-shadow:0 5px 0 #15803d,0 8px 16px rgba(0,0,0,.18)}
.db.buyuk.dur{background:#ef4444;box-shadow:0 5px 0 #b91c1c}
.db.pasif{opacity:.45}
.db .k{font-size:16px}
@media (max-width:760px){.db .k{display:none}.db{padding:10px 12px}}

/* EKRANLAR */
.ekran{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
#menu .logo{position:absolute;top:calc(5vh + env(safe-area-inset-top));left:0;right:0;text-align:center;pointer-events:none}
.logo h1{font-family:'Baloo 2','Nunito',sans-serif;font-size:clamp(44px,8vw,86px);margin:0;color:#fff;line-height:1;
  text-shadow:0 4px 0 #1d4ed8,0 8px 18px rgba(0,0,0,.25);letter-spacing:1px}
.logo p{margin:8px 0 0;font-size:clamp(18px,2.4vw,24px);font-weight:800;color:#0f3a75;background:rgba(255,255,255,.85);display:inline-block;padding:6px 16px;border-radius:99px}
.menuKart{background:rgba(255,255,255,.94);border-radius:26px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.18);width:min(760px,100%);
  display:flex;flex-direction:column;gap:12px;align-items:center}
.ogrBilgi{font-size:18px;font-weight:800;color:#334155}
.seviyeler{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sev{background:#eef2ff;color:#3730a3;border-radius:14px;padding:10px 16px;font-size:19px;min-height:50px}
.sev.sec{background:var(--mor);color:#fff;box-shadow:0 4px 0 #5b21b6}
.anaDugmeler{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.soluk{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;opacity:.6}
.soluk button{background:transparent;color:#334155;font-size:16px;padding:8px 10px;border-radius:10px;min-height:42px}
.soluk button:hover{background:#f1f5f9}
#rozet{position:fixed;left:10px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:41;background:rgba(255,255,255,.8);font-size:14px;
  padding:5px 10px;border-radius:99px;font-weight:800;color:#166534}

/* Bölüm seçimi */
#bolumler .menuKart{max-height:calc(100vh - 40px);overflow:auto}
.bolumIzgara{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
@media (min-width:900px){.bolumIzgara{grid-template-columns:repeat(6,1fr)}}
.bk{background:linear-gradient(160deg,#60a5fa,#6d28d9);color:#fff;border-radius:18px;padding:12px 6px;min-height:104px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;box-shadow:0 5px 0 #4c1d95}
.bk b{font-size:30px;line-height:1}

function noktaAl(e){ var r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*W, (e.clientY-r.top)/r.height*H]; }
function yasakMi(p){ var n=L.n||[]; for(var i=0;i<n.length;i++){ var z=n[i]; if(p[0]>z[0]-6&&p[0]<z[0]+z[2]+6&&p[1]>z[1]-6&&p[1]<z[1]+z[3]+6) return true; } return false; }
function topYakin(p){ for(var i=0;i<L.b.length;i++){ if(Math.hypot(p[0]-L.b[i][0],p[1]-L.b[i][1])<CY.R+10) return true; } return false; }
function kalanMurekkep(){ return CY.murekkep(L)-kullanilan; }
function vurusBitir(){
  if(!aktif) return;
  if(aktif.length>=2 && CY.uzunluk(aktif)>=10){ strokes.push(aktif); }
  else kullanilan-=CY.uzunluk(aktif||[]);
  aktif=null; hudGuncelle();
  if(grup.id==='ana' && strokes.length && mod==='cizim'){ birak(); }
}
cv.addEventListener('pointerdown',function(e){
  if(mod!=='cizim'||mesgulDurum) return; e.preventDefault();
  if(grup.id==='ana' && strokes.length){ strokes=[]; kullanilan=0; }
  var p=noktaAl(e); if(yasakMi(p)){ toast('🚫 Kırmızı bölgeye çizim yapılamaz'); return; }
  if(L.tek && strokes.length>=L.tek){ toast('✏️ Bu bölümde '+L.tek+' çizgi hakkın var. ↶ Geri Al ile birini sil'); return; }
  if(kalanMurekkep()<=4){ toast('✏️ Mürekkep bitti! ↶ Geri Al ile bir çizgiyi sil'); return; }
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  aktif=[p]; hudGuncelle();
});
cv.addEventListener('pointermove',function(e){
  if(!aktif) return; e.preventDefault();
  var lst=(e.getCoalescedEvents?e.getCoalescedEvents():[e]);
  for(var i=0;i<lst.length;i++){
    var p=noktaAl(lst[i]), son=aktif[aktif.length-1], d=Math.hypot(p[0]-son[0],p[1]-son[1]);
    if(d<6) continue;
    if(yasakMi(p)){ toast('🚫 Kırmızı bölgeye çizim yapılamaz'); vurusBitir(); return; }
    if(topYakin(p)) continue;
    var kal=kalanMurekkep(); if(kal<=0){ vurusBitir(); toast('✏️ Mürekkep bitti!'); return; }
    if(d>kal){ p=[son[0]+(p[0]-son[0])*kal/d, son[1]+(p[1]-son[1])*kal/d]; d=kal; }
    aktif.push(p); kullanilan+=d;
  }
  hudGuncelle();
});
['pointerup','pointercancel','pointerleave'].forEach(function(t){ cv.addEventListener(t,function(e){ if(aktif){ e.preventDefault(); vurusBitir(); } }); });

  modalAc('<h2>v'+APP.surum+' ✓</h2><p style="font-size:17px">Tarih: '+APP.tarih+'<br>Önceki: v'+APP.onceki.surum+' · '+APP.onceki.satir+' satır · '+APP.onceki.kb+' KB<br>Şimdi: '+APP.satir+' satır · '+APP.kb+' KB (fark +'+(APP.satir-APP.onceki.satir)+')</p>'+
   '<div class="bilgiKart"><b>Yenilikler</b><br>'+APP.yenilikler.map(function(y){return '• '+y;}).join('<br>')+'</div>'+
   '<table class="modTablo">'+mk.map(function(x){ return '<tr><td>'+(x.ok?'✅':'❌')+'</td><td>'+x.m+'</td></tr>'; }).join('')+'<tr><td>'+(bolumKontrol()===54?'✅':'⚠️')+'</td><td>Bölüm verisi: '+bolumKontrol()+'/54</td></tr></table>'+
   '<div class="satir"><button class="db" onclick="surumKontrol(true)">🔄 Güncellemeleri denetle</button><button class="db buyuk" onclick="modalKapat()">Tamam</button></div>');
}
var surumDamga=null, surumSon=0;
function damgaAl(){ var u=location.href.split('#')[0].split('?')[0]+'?_v='+Date.now();
  return fetch(u,{method:'HEAD',cache:'no-store'}).then(function(r){ return r.headers.get('ETag')||r.headers.get('Last-Modified')||''; })
    .catch(function(){ return fetch(u,{cache:'no-store'}).then(function(r){ return r.headers.get('ETag')||r.headers.get('Last-Modified')||''; }); }); }
function surumKontrol(elle){
  if(!/^https?:/.test(location.protocol)){ if(elle) toast('Yerel dosyada sürüm denetimi yapılmaz'); return; }
  if(!elle && Date.now()-surumSon<15000) return; surumSon=Date.now();
  damgaAl().then(function(d){ if(!d) { if(elle) toast('✅ En güncel sürüm'); return; } if(surumDamga===null){ surumDamga=d; if(elle) toast('✅ En güncel sürüm'); return; }
    if(d!==surumDamga) $('yeniSurum').classList.remove('gizli'); else if(elle) toast('✅ En güncel sürüm'); }).catch(function(){});
}
function surumYenile(){ location.href=location.href.split('#')[0].split('?')[0]+'?_r='+Date.now(); }
window.addEventListener('focus',function(){ surumKontrol(); });
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') surumKontrol(); });
setInterval(surumKontrol,120000);

// ================= DÖNGÜ =================
var sonZ=0, birikim=0, carpmaSay=0;
function dongu(z){
  var t=z/1000, dt=Math.min(1/30,(z-sonZ)/1000||0); sonZ=z;
  if(ipucuSure>0) ipucuSure-=dt;
  if(mod==='menu'){
    if(!L || !D) demoKur();
    if(!D.bitti){ for(var i=0;i<Math.round(dt*240);i++){ CY.adim(D,1/240); if(D.bitti) break; } }
    else { demoBekle+=dt; if(demoBekle>1.2) demoKur(); }
  } else if(mod==='akis' && D){
    var n=Math.round(dt*240); for(var j=0;j<n && !D.bitti;j++) CY.adim(D,1/240);
    if(D.carpmalar.length){ var c=D.carpmalar; if(c.indexOf('yildiz')>=0){ ses('dogru'); hudGuncelle(); } else if(c.indexOf('yay')>=0) ses('yay'); else if(carpmaSay++%2===0) ses('tik'); D.carpmalar=[]; }
    if(D.bitti==='basari') basari(); else if(D.bitti) hata(D.bitti);
  } else if(D && mod==='sonuc'){ for(var k=0;k<Math.round(dt*240);k++) CY.adim(D,1/240); }
  parcaciklar.forEach(function(p){ p.vy+=900*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.t+=dt; }); parcaciklar=parcaciklar.filter(function(p){ return p.t<2.5 && p.y<H+20; });
  if(mod==='menu' && D) D.carpmalar=[];
  ciz(t);
  requestAnimationFrame(dongu);
}

document.addEventListener('keydown',function(e){
  if(mesgulDurum && e.key!=='Escape') return;
  if(e.key===' '||e.key==='Enter'){ if(mod==='cizim'||mod==='akis'){ e.preventDefault(); birakDur(); } }
  else if((e.key==='z'||e.key==='Z') && (e.ctrlKey||e.metaKey)) geriAl();
  else if(e.key==='Backspace') geriAl();
  else if(e.key==='Escape'){ if(!$('modal').classList.contains('gizli') && mod!=='sonuc') modalKapat(); else if(mod==='cizim'||mod==='akis') duraklat(); }
  else if(e.key==='h'||e.key==='H') ipucuGoster();
});
