<style>
:root{--ui:1;--ink:#1d1640;--gold:#ffc83d;--red:#ef4444;--blue:#3b82f6;--green:#22c55e;--orange:#f97316;--violet:#7c3aed}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0820;font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:lining-nums tabular-nums;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
#sahne{position:fixed;inset:0;display:block;width:100%;height:100%}
.ui{position:fixed;inset:0;pointer-events:none;zoom:var(--ui)}
.ui>*{pointer-events:auto}
.gizli{display:none!important}
button{font-family:inherit;cursor:pointer;border:0}
.logo{font-family:"Lilita One",Nunito,sans-serif;letter-spacing:.5px}

/* ---------- Üst HUD (yalnız gösterim) ---------- */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 14px 0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#hudSatir{width:100%;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cip{background:rgba(16,12,44,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:2px solid rgba(255,255,255,.18);border-radius:999px;padding:7px 14px;font-weight:900;font-size:18px;display:flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#dunyaCip{font-size:17px}
#ilerleme{display:flex;gap:4px;align-items:center}
#ilerleme i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.25);display:block}
#ilerleme i.ok{background:var(--green)}#ilerleme i.no{background:#94a3b8}#ilerleme i.su{background:var(--gold);box-shadow:0 0 0 3px rgba(255,200,61,.35)}
#soruKart{max-width:min(980px,94vw);background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(240,236,255,.97));color:var(--ink);border-radius:22px;padding:12px 20px 14px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35);border:3px solid #fff;transform-origin:top center;transition:transform .35s cubic-bezier(.2,1.4,.4,1),opacity .25s}
#soruKart.kapali{transform:translateY(-30px) scale(.9);opacity:0}
#soruUst{font-size:13px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#7c3aed;margin-bottom:2px}
#soruMetin{font-size:clamp(20px,2.6vw,32px);font-weight:900;line-height:1.2}
#ipucuMetin{margin-top:6px;font-size:17px;font-weight:800;color:#b45309;background:#fff7e0;border-radius:12px;padding:5px 10px;display:inline-block}
#sureCubuk{height:6px;border-radius:6px;background:#e5e0fb;margin-top:8px;overflow:hidden}#sureCubuk b{display:block;height:100%;width:100%;background:linear-gradient(90deg,#22c55e,#facc15,#f97316);transform-origin:left}
#bilgiBalon{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.8);opacity:0;pointer-events:none;max-width:min(720px,90vw);text-align:center;transition:all .35s cubic-bezier(.2,1.4,.4,1)}
#bilgiBalon.acik{opacity:1;transform:translate(-50%,-50%) scale(1)}
#bilgiBalon .bb-baslik{font-family:"Lilita One",Nunito,sans-serif;font-size:clamp(34px,5vw,64px);text-shadow:0 4px 0 rgba(0,0,0,.25),0 0 30px rgba(0,0,0,.35)}
#bilgiBalon .bb-metin{margin-top:8px;background:rgba(16,12,44,.78);border-radius:18px;padding:10px 16px;font-size:clamp(17px,2vw,23px);font-weight:800;line-height:1.3}
#bilgiBalon.dogru .bb-baslik{color:#5dff6e}#bilgiBalon.yanlis .bb-baslik{color:#ffcf4a}
#bilgiBalon .bb-baslik{-webkit-text-stroke:3px #1d1640;paint-order:stroke fill;white-space:nowrap}
#bilgiBalon .bb-alt{color:#ffd23f;font-weight:900;font-size:1.05em;margin-bottom:4px}

/* ---------- Alt kontroller (çocuk boyu: hep altta) ---------- */
#alt{position:fixed;left:0;right:0;bottom:0;padding:0 10px calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#siklar{display:flex;gap:10px;justify-content:center;width:100%;max-width:1100px;pointer-events:auto}
.sik{flex:1;min-height:64px;border-radius:20px;font-weight:900;font-size:clamp(19px,2.2vw,27px);color:#fff;padding:8px 10px;box-shadow:0 6px 0 rgba(0,0,0,.28),0 10px 22px rgba(0,0,0,.25);border:3px solid rgba(255,255,255,.55);transition:transform .12s,filter .2s,opacity .2s;display:flex;align-items:center;justify-content:center;gap:8px;line-height:1.1}
.sik:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.sik.secili{outline:5px solid #fff;outline-offset:2px;transform:translateY(-4px) scale(1.03)}
.sik.elendi{opacity:.28;filter:grayscale(1)}
.sik .harf{background:rgba(255,255,255,.25);border-radius:10px;padding:2px 8px;font-size:.8em}
#kontrol{display:flex;gap:8px;justify-content:center;align-items:center;width:100%;max-width:1100px;pointer-events:auto}
.yon{min-width:120px;height:58px;border-radius:18px;font-weight:900;font-size:20px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.3);border:3px solid rgba(255,255,255,.5)}
.yon:active{transform:translateY(3px)}
#solBtn{background:var(--blue)}#sagBtn{background:var(--red)}
.kucuk{height:52px;min-width:52px;padding:0 14px;border-radius:16px;background:rgba(16,12,44,.7);color:#fff;font-weight:900;font-size:17px;border:2px solid rgba(255,255,255,.25)}
.kucuk.parla{animation:parla 1s infinite}
@keyframes parla{50%{box-shadow:0 0 0 6px rgba(255,200,61,.55)}}
.bosluk{flex:1}

/* ---------- Menü ---------- */
#menu{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 18px) 14px calc(env(safe-area-inset-bottom) + 14px);background:linear-gradient(180deg,rgba(11,8,32,.55),rgba(11,8,32,0) 30%,rgba(11,8,32,0) 55%,rgba(11,8,32,.75))}
#menuBaslik{text-align:center;pointer-events:none}
#menuBaslik h1{margin:0;font-family:"Lilita One",Nunito,sans-serif;font-size:clamp(46px,8vw,104px);line-height:.95;color:#fff;text-shadow:0 6px 0 #c2410c,0 10px 30px rgba(0,0,0,.5);letter-spacing:1px}
#menuBaslik h1 span{color:var(--gold)}
#menuBaslik p{margin:8px 0 0;font-size:clamp(16px,2vw,22px);font-weight:900;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#menuAlt{width:100%;max-width:1150px;display:flex;flex-direction:column;gap:10px;align-items:center}
#dunyalar{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:100%}
.dk{position:relative;border-radius:20px;padding:10px 8px 10px;color:#fff;text-align:center;border:3px solid rgba(255,255,255,.55);box-shadow:0 6px 0 rgba(0,0,0,.3),0 12px 26px rgba(0,0,0,.3);transition:transform .15s;overflow:hidden}
.dk:hover{transform:translateY(-3px)}
.dk .ik{font-size:34px;line-height:1}.dk .ad{font-weight:900;font-size:17px;margin-top:3px;line-height:1.1}.dk .yld{font-size:15px;margin-top:3px;letter-spacing:1px}
.dk .ders{font-size:12.5px;font-weight:800;opacity:.9}
#basla{font-family:"Lilita One",Nunito,sans-serif;font-size:clamp(26px,3.2vw,40px);padding:12px 40px;border-radius:24px;background:linear-gradient(180deg,#ffd75e,#ff9f1c);color:#3b1d00;box-shadow:0 7px 0 #b45309,0 14px 30px rgba(0,0,0,.35);border:3px solid #fff3c4;animation:nabiz 1.6s infinite}
@keyframes nabiz{50%{transform:scale(1.04)}}
#menuSatir{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
#araclar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;opacity:.62}
#araclar button{background:rgba(16,12,44,.65);color:#fff;font-weight:800;font-size:14px;border-radius:12px;padding:7px 10px;border:1.5px solid rgba(255,255,255,.2)}
#surumRozet{font-size:12px;opacity:.6;font-weight:800}
#ogrCip{font-size:15px}

/* ---------- Pencereler ---------- */
.perde{position:fixed;inset:0;background:rgba(8,6,26,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
body.cocuk-boyu .perde{align-items:flex-end}
body.cocuk-alcak .pencere{max-height:50vh}
.pencere{background:#fff;color:var(--ink);border-radius:26px;padding:20px 22px;width:min(640px,100%);max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.45);border:4px solid #fff;animation:gel .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes gel{from{transform:scale(.85);opacity:0}}
.pencere h2{margin:0 0 6px;font-family:"Lilita One",Nunito,sans-serif;font-size:32px;color:#4c1d95}
.pencere p{font-weight:700;font-size:18px;line-height:1.35;margin:6px 0}
.pencere ol{font-weight:800;font-size:18px;line-height:1.45;padding-left:24px;margin:8px 0}
.pb{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.pb button{flex:1;min-width:140px;font-weight:900;font-size:19px;padding:14px;border-radius:16px;background:#ede9fe;color:#4c1d95}
.pb button.ana{background:linear-gradient(180deg,#8b5cf6,#6d28d9);color:#fff;box-shadow:0 5px 0 #4c1d95}
.sinifSec{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.sinifSec button{padding:12px 4px;border-radius:14px;font-weight:900;font-size:17px;background:#f3f0ff;color:#4c1d95;border:3px solid transparent}
.sinifSec button.sec{border-color:#7c3aed;background:#7c3aed;color:#fff}
.sonuc-yildiz{font-size:56px;letter-spacing:6px;text-align:center;margin:4px 0}
.sonuc-sat{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.sonuc-sat div{background:#f5f3ff;border-radius:16px;padding:8px 14px;font-weight:900;font-size:18px;text-align:center}
.sonuc-sat b{display:block;font-size:28px;color:#7c3aed}
#belgeKanvas{width:100%;border-radius:14px;margin-top:8px;box-shadow:0 6px 20px rgba(0,0,0,.2)}

#yonUyari{position:fixed;inset:0;z-index:60;background:#120d33;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px}
#yonUyari div{font-size:70px;animation:don 2s infinite}@keyframes don{50%{transform:rotate(90deg)}}
#yonUyari p{font-size:22px;font-weight:900}

function guncelle(dt){

      var sonraki = kapilar.filter(function(k){return !k.gecildi;})[0];

        var mesafe = sonraki.s - oyun.s;
        if(!oyun.soruAcik && mesafe <= oyun.plan.reveal && oyun.aktifKapi!==sonraki) soruGoster(sonraki);
        hedefHiz = oyun.soruAcik ? SORU_HIZ : SEYIR_HIZ;
        if(oyun.soruAcik){ var oran = clamp(mesafe/oyun.plan.reveal,0,1); $('sureCubuk').firstChild.style.transform='scaleX('+oran+')'; if(oran<0.45 && oyun.ipucuSay===0) $('ipucuBtn').classList.add('parla'); }
        if(oyun.s >= sonraki.s) kapiGec(sonraki);

    oyun.hiz = lerp(oyun.hiz, hedefHiz, yumusak(oyun.durum==='istasyon'?3:1.2, dt));
    if(oyun.durum==='oyun' && !kapilar.some(function(k){return !k.gecildi;})) oyun.hiz = Math.min(oyun.hiz, hedefHiz+0.5);
    oyun.s += oyun.hiz*dt;
    // şerit geçişi (yumuşak)
    oyun.x = lerp(oyun.x, serit[oyun.serit], yumusak(4.5, dt));
    // yıldız toplama
    yildizlar.forEach(function(y){ if(y.alindi) return; y.m.rotation.y += dt*3; y.m.position.y = 1.9+Math.sin(t*3+y.s)*0.2;
      if(Math.abs(y.s - oyun.s) < 2.4 && Math.abs(serit[y.ser]-oyun.x) < 1.6){ y.alindi = true; oyun.yildiz++; SES.yildiz(); konfeti(y.m.position.x, y.m.position.y, y.m.position.z, 24, 5, [0xffd23f,0xfff3a0]); y.m.visible=false; hudGuncelle(); } });
    parcalariIlerlet(false);
  }

  var a = tekerler.length ? tekerler[0].rotation.x : 0; biyeller.forEach(function(b){ b.position.y = 0.75 + Math.sin(-a)*0.32; b.position.z = -0.35 + Math.cos(-a)*0.32; });
  // çuf çuf + duman
  if(oyun.hiz > 0.5){ oyun.cufT += dt*oyun.hiz*0.42; if(oyun.cufT>1){ oyun.cufT=0; SES.cuf(clamp(oyun.hiz/24,0,1)); } }

  aurora.forEach(function(a,i){ a.material.uniforms.t.value = t+i*2; a.position.z = loko.position.z - 420 - i*60; a.position.x = loko.position.x; });

function yardim(){
  var p = perde('<h2>❓ Nasıl Oynanır?</h2><ol><li>Soru üstte yazar; tünel tabelalarında şıklar var.</li><li>Renkli şık düğmesine dokun ya da ◀ SOL / SAĞ ▶ ile ray değiştir.</li><li>Doğru tünel = yeni vagon + 3 yıldız (ipucuyla 2).</li><li>💡 İpucu: 1. basış ipucu yazar, 2. basış bir yanlış tüneli kapatır.</li><li>🔊 Dinle soruyu sesli okur (anaokulu ve 1-2. sınıfta kendiliğinden okur).</li></ol>'+
    '<p><b>Ekran boyutu:</b></p><div class="sinifSec" style="grid-template-columns:repeat(4,1fr)">'+[['oto','Otomatik'],['normal','Normal'],['tahta','Akıllı Tahta'],['buyuk','Büyük Tahta']].map(function(e){ return '<button data-e="'+e[0]+'" class="'+(ayar.ekran===e[0]?'sec':'')+'">'+e[1]+'</button>'; }).join('')+'</div>'+
    '<p style="font-size:14px;opacity:.7">'+APP.ad+' v'+APP.surum+' · '+APP.satir+' satır · '+APP.kb+' KB · Modüller: '+modulKontrol()+'</p>'+
    '<div class="pb"><button id="yKars">📖 Tanıtımı tekrar göster</button><button class="ana" id="yTamam">Tamam</button></div>');
  Array.prototype.forEach.call(p.querySelectorAll('[data-e]'), function(b){ b.onclick = function(){ ayar.ekran = b.dataset.e; LS.hamYaz(K_EKRAN, ayar.ekran); ekranUygula(); Array.prototype.forEach.call(p.querySelectorAll('[data-e]'), function(x){ x.classList.toggle('sec', x===b); }); }; });
  p.querySelector('#yTamam').onclick = function(){ perdeKapat(p); };
  p.querySelector('#yKars').onclick = function(){ perdeKapat(p); karsilama(); };
}
function modulKontrol(){ var m = [typeof THREE, typeof window.ZGIRIS, typeof siteyeDon, typeof qrAc, typeof belgeGoster]; var ok = m.filter(function(x){return x!=='undefined';}).length; return ok+'/'+m.length+' sağlam'; }

/* ---------------- Makinist Belgesi ---------------- */
function belgeGoster(){
  oyun.durum = 'menu'; gizle('hud', true); gizle('alt', true);
  var o = (window.ZGIRIS && ZGIRIS.ogrenci) || {ad:'Yolcu', soyad:''};
  var c = document.createElement('canvas'); c.width = 1600; c.height = 1000; var x = c.getContext('2d');
  var gr = x.createLinearGradient(0,0,1600,1000); gr.addColorStop(0,'#1e1b4b'); gr.addColorStop(1,'#4c1d95'); x.fillStyle=gr; x.fillRect(0,0,1600,1000);
  x.strokeStyle='#ffc83d'; x.lineWidth=18; x.strokeRect(40,40,1520,920); x.lineWidth=4; x.strokeRect(70,70,1460,860);
  for(var i=0;i<60;i++){ x.fillStyle='rgba(255,255,255,'+Math.random()*0.5+')'; x.beginPath(); x.arc(Math.random()*1600, Math.random()*1000, Math.random()*3, 0, 7); x.fill(); }
  x.textAlign='center'; x.fillStyle='#ffc83d'; x.font='900 64px '+FONT; x.fillText('🚂  MAKİNİST BELGESİ  🚂', 800, 200);
  x.fillStyle='#fff'; x.font='800 40px '+FONT; x.fillText('Bilgi Ekspresi ile 5 dünyayı başarıyla gezen', 800, 300);
  x.font='900 104px '+FONT; x.fillStyle='#ffffff'; x.fillText(o.ad+' '+o.soyad, 800, 440);
  x.font='800 40px '+FONT; x.fillStyle='#e9d5ff'; x.fillText(sinifAd()+' · Fen · Matematik · Türkçe · Sosyal · Kodlama', 800, 530);
  x.font='900 52px '+FONT; x.fillStyle='#ffc83d'; x.fillText('⭐ '+(ilerleme.toplamYildiz||0)+' yıldız   ·   🚃 '+(ilerleme.toplamVagon||0)+' vagon', 800, 650);
  x.font='800 34px '+FONT; x.fillStyle='#c4b5fd'; x.fillText(new Date().toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'})+'  ·  Barış Öğretmen', 800, 840);
  var p = perde('<h2>🏅 Tebrikler '+escH(o.ad)+'!</h2><p>5 dünyanın hepsini bitirdin. Artık gerçek bir Bilgi Ekspresi makinistisin!</p><img id="belgeKanvas" alt="Makinist Belgesi"><div class="pb"><button id="bIndir">⬇️ Belgeyi indir (PNG)</button><button class="ana" id="bMenu">🗺️ Menü</button></div>');
  p.querySelector('#belgeKanvas').src = c.toDataURL('image/png');
  for(var k=0;k<6;k++) setTimeout(function(){ konfeti(loko.position.x+rnd(-15,15), 20, loko.position.z+rnd(-20,5), 140, 12); SES.havaiFisek(); }, k*350);
  SES.duduk(); soyle('Tebrikler '+o.ad+'! Makinist belgeni kazandın!');
  p.querySelector('#bIndir').onclick = function(){ var a=document.createElement('a'); a.href=c.toDataURL('image/png'); a.download='makinist-belgesi-'+(o.ad||'yolcu')+'.png'; document.body.appendChild(a); a.click(); a.remove(); };
  p.querySelector('#bMenu').onclick = function(){ menuGoster(); };
}

/* ---------------- QR ile paylaş ---------------- */
function qrAc(){
  var url = (window.PAYLAS && PAYLAS.url) || location.href.split('#')[0];
  if(!/^https?:/.test(location.protocol) || /localhost|127\.0\.0\.1/.test(location.hostname)){ bildir('📲 QR için önce oyunu GitHub Pages\'e yükle.', 3500); }
  var p = perde('<h2>📲 QR ile Paylaş</h2><p>Telefonla okut, oyun açılsın!</p><div id="qrKutu" style="background:#fff;padding:16px;border-radius:16px;display:flex;justify-content:center;min-height:200px;align-items:center">Yükleniyor…</div><p style="font-size:14px;word-break:break-all;opacity:.7">'+escH(url)+'</p><div class="pb"><button id="qKop">🔗 Linki kopyala</button><button id="qPng">⬇️ PNG indir</button><button class="ana" id="qKap">Kapat</button></div>');
  p.querySelector('#qKap').onclick = function(){ perdeKapat(p); };
  p.querySelector('#qKop').onclick = function(){ (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(function(){ bildir('🔗 Link kopyalandı'); }).catch(function(){ prompt('Link:', url); }); };
  function ciz(){ try{ var q = qrcode(0,'M'); q.addData(url); q.make(); var img = q.createDataURL(8, 16); p.querySelector('#qrKutu').innerHTML = '<img src="'+img+'" style="width:min(280px,70vw);image-rendering:pixelated">'; p.querySelector('#qPng').onclick = function(){ var a=document.createElement('a'); a.href=img; a.download='bilgi-ekspresi-qr.png'; a.click(); }; }catch(e){ p.querySelector('#qrKutu').textContent='QR oluşturulamadı.'; } }
  if(window.qrcode) ciz(); else { var s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js'; s.onload=ciz; s.onerror=function(){ p.querySelector('#qrKutu').textContent='İnternet yok — QR yüklenemedi.'; }; document.head.appendChild(s); }
}
window.ZIRVE_paylasAc = qrAc;

/* ---------------- PWA + sürüm denetimi ---------------- */
function pwa(){
  try{
    var man = {name:'Bilgi Ekspresi', short_name:'Bilgi Ekspresi', start_url:location.href.split('#')[0], display:'standalone', orientation:'landscape', background_color:'#1a1446', theme_color:'#1a1446',
      icons:[{src:APP.ikon192,sizes:'192x192',type:'image/png'},{src:APP.ikon512,sizes:'512x512',type:'image/png'},{src:APP.ikon512,sizes:'512x512',type:'image/png',purpose:'maskable'}]};
    var l = document.createElement('link'); l.rel='manifest'; l.href = URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'})); document.head.appendChild(l);
    var l2 = document.createElement('link'); l2.rel='icon'; l2.sizes='512x512'; l2.href=APP.ikon512; document.head.appendChild(l2);
  }catch(e){}
}
var surumDamga = null, surumSonKontrol = 0;
function damgaAl(){
  var u = location.href.split('#')[0]; u += (u.indexOf('?')>-1?'&':'?')+'_v='+Date.now();
  return fetch(u,{method:'HEAD',cache:'no-store'}).then(function(r){ return r.headers.get('etag')||r.headers.get('last-modified'); }).catch(function(){ return null; });
}
function surumBaslat(){ if(!/^https?:/.test(location.protocol)) return; damgaAl().then(function(d){ surumDamga = d; }); setInterval(surumKontrol, 120000); window.addEventListener('focus', surumKontrol); document.addEventListener('visibilitychange', function(){ if(!document.hidden) surumKontrol(); }); }
function surumKontrol(){ if(!surumDamga || Date.now()-surumSonKontrol<15000) return; surumSonKontrol = Date.now(); damgaAl().then(function(d){ if(d && d!==surumDamga) gizle('yeniSurum', false); }); }

/* ---------------- Girdi ---------------- */
function girdiKur(){
  addEventListener('keydown', function(e){
    if(oyun.durum!=='oyun' || molada){ if((e.key==='p'||e.key==='P'||e.key==='Escape') && molada){ var b=document.querySelector('#mDevam'); if(b) b.click(); } return; }
    var k = e.key;
    if(k==='ArrowLeft'||k==='a'||k==='A'){ yonBas(-1); e.preventDefault(); }
    else if(k==='ArrowRight'||k==='d'||k==='D'){ yonBas(1); e.preventDefault(); }
    else if(k==='1'||k==='2'||k==='3'){ if(+k <= serit.length) seritSec(+k-1, true); }
    else if(k==='h'||k==='H') ipucu();
    else if(k==='l'||k==='L') dinle();
    else if(k==='p'||k==='P'||k==='Escape') molaAc();
  });
  $('solBtn').addEventListener('pointerdown', function(e){ e.preventDefault(); yonBas(-1); });
  $('sagBtn').addEventListener('pointerdown', function(e){ e.preventDefault(); yonBas(1); });
  $('ipucuBtn').onclick = ipucu; $('dinleBtn').onclick = dinle; $('molaBtn').onclick = molaAc; $('siteBtn2').onclick = siteyeDon;
  // kaydırma / dokunma (tuval)
  var bas = null;
  $('sahne').addEventListener('pointerdown', function(e){ bas = {x:e.clientX, y:e.clientY, t:Date.now()}; sesBaslat(); });
  $('sahne').addEventListener('pointerup', function(e){
    if(!bas || oyun.durum!=='oyun') { bas=null; return; }
    var dx = e.clientX-bas.x, dy = e.clientY-bas.y;
    if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) yonBas(dx>0?1:-1);
    else if(Math.abs(dx)<12 && Math.abs(dy)<12 && Date.now()-bas.t<400 && (ayar.cocuk==='0' || e.clientY > innerHeight*0.36)){
      var parca = Math.floor(e.clientX / (innerWidth/serit.length)); seritSec(clamp(parca,0,serit.length-1), true);
    }
    bas = null;
  });
  $('araclar').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return; sesBaslat(); var a = b.dataset.a;
    if(a==='yardim') yardim(); else if(a==='sinif') sinifPenceresi(); else if(a==='ses'){ sesAc(!ayar.ses); bildir(ayar.ses?'🔊 Ses açık':'🔇 Ses kapalı'); }
    else if(a==='cocuk') cocukDegistir(); else if(a==='qr') qrAc(); else if(a==='panel') ZGIRIS.panelAc(); else if(a==='site') siteyeDon();
  });
  $('basla').onclick = function(){ sesBaslat(); oyunBaslat(menuDunyaIdx()); };
  $('ysYenile').onclick = function(){ kaydet(); var u=location.href.split('#')[0]; location.href = u+(u.indexOf('?')>-1?'&':'?')+'_r='+Date.now(); };
  $('ysKapat').onclick = function(){ gizle('yeniSurum', true); };
  addEventListener('resize', boyutla); addEventListener('orientationchange', function(){ setTimeout(boyutla, 300); });
  document.addEventListener('visibilitychange', function(){ if(document.hidden && oyun.durum==='oyun') molaAc(); saat.son = performance.now(); });
}
function dinle(){ if(!oyun.soruAcik) return; sesBaslat(); var q = oyun.aktifKapi.soru, n=q.a.length; soyle(q.q+'. '+q.a.map(function(a,i){return (n===2?['Sol','Sağ']:['Sol','Orta','Sağ'])[i]+': '+a;}).join('. ')); }
function boyutla(){
  if(!renderer) return; renderer.setSize(innerWidth, innerHeight); kamera.aspect = innerWidth/innerHeight; kamera.updateProjectionMatrix(); ekranUygula();
  var dik = innerHeight > innerWidth && innerWidth < 700;
  var yu = $('yonUyari');
  if(dik && LS.ham(K_YON)!=='1'){
    if(!yu){ yu = document.createElement('div'); yu.id='yonUyari'; yu.innerHTML='<div>📱</div><p>Telefonu yan çevir, tren daha güzel görünsün!</p><button class="kucuk" id="yuGec" style="background:#7c3aed">Yine de dik oyna</button>'; document.body.appendChild(yu); yu.querySelector('#yuGec').onclick=function(){ LS.hamYaz(K_YON,'1'); yu.remove(); }; }
  } else if(yu) yu.remove();
}

/* ---------------- Başlat ---------------- */
function basla(){
  cocukOku(); cocukUygula(); ekranUygula(); pwa();
  if(typeof THREE === 'undefined'){ $('yukleniyor').innerHTML = '<div class="tren">🚂</div><div>3B motor yüklenemedi.<br>İnternet bağlantını kontrol edip sayfayı yenile.</div>'; return; }
  try{
    sahneKur(); ortakDokular(); geoKur(); propMalz(); efektKur(); lokoKur();
  }catch(e){ $('yukleniyor').innerHTML = '<div class="tren">🚂</div><div>Bu cihaz 3B grafik (WebGL) desteklemiyor olabilir.<br><small>'+escH(e.message)+'</small></div>'; return; }
  girdiKur(); boyutla();
  dunyaHazirla(0, true); oyun.durum='menu'; oyun.s = 8; oyun.ilkKare = true; gecmis=[[-300,oyun.x],[oyun.s,oyun.x]];
  dongu();
  $('yukleniyor').style.display = 'none';
  surumBaslat();
  try{ if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ if(oyun.durum==='menu' && !$('menu').classList.contains('gizli')) menuGoster(); }); }catch(e){}
  ZGIRIS.baslat({oyun:'Bilgi Ekspresi', renk:'#7c3aed'}).then(function(ogr){
    if(!ayar.sinif){
      var m = {'Anaokulu':'ana','1':'12','2':'12','3':'34','4':'34','5':'56','6':'56','7':'78','8':'78'}[ogr.sinif];
      if(m){ ayar.sinif = m; LS.hamYaz(K_SINIF, m); }
    }
    var devam = function(){ if(!ayar.sinif) sinifPenceresi(function(){ menuGoster(); }, false); else menuGoster(); };
    if(LS.ham(K_KARS)!=='1') karsilama(devam); else devam();
  });
}
window.BILGI_EKSPRESI = {vagonEkle:vagonEkle, oyun:oyun, baslat:oyunBaslat, menu:menuGoster, seritSec:seritSec, ipucu:ipucu, belge:belgeGoster, durum:function(){ return {durum:oyun.durum, s:oyun.s, soruNo:oyun.soruNo, vagon:vagonlar.length, istasyon:oyun.istasyonS, kapilar:kapilar.map(function(k){return k.s;}), dogruSik:oyun.aktifKapi?oyun.aktifKapi.soru.d:null, soruAcik:oyun.soruAcik}; }};
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', basla); else basla();
})();

</script>
