<style>
:root{--oc-font:'Nunito','Baloo 2','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;--oyun:#f59e0b}
#oc-toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);transform:translate(-50%,-20px);background:#1f2937;color:#fff;font:800 16px var(--oc-font);padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:9000;max-width:88vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#oc-toast.gor{opacity:1;transform:translate(-50%,0)}
.oc-soru-ort{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-end;justify-content:center;z-index:8000;padding:12px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
.oc-soru{zoom:var(--egt-z,1);background:#fffdf7;border-radius:26px;padding:16px 16px 18px;width:min(720px,100%);max-height:86%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);font-family:var(--oc-font);border:4px solid var(--oyun);animation:ocYuk .25s ease-out}
body.cocuk-alcak .oc-soru{max-height:50%}
@keyframes ocYuk{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.oc-soru-bas{font-weight:900;font-size:16px;color:#92400e;letter-spacing:.3px;margin-bottom:6px}
.oc-soru-met{font-weight:800;font-size:clamp(21px,3.2vmin,30px);line-height:1.3;color:#111827;font-variant-numeric:lining-nums tabular-nums;word-break:break-word}
.oc-soru-din{margin:8px 0 2px;border:0;background:#fef3c7;color:#92400e;font:800 15px var(--oc-font);padding:8px 14px;border-radius:999px;min-height:40px;cursor:pointer}
.oc-soru-sik{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
.oc-soru-sik.iki{grid-template-columns:1fr 1fr}
@media(min-width:700px){.oc-soru-sik{grid-template-columns:repeat(3,1fr)}.oc-soru-sik.iki{grid-template-columns:1fr 1fr}}
.oc-sik{border:3px solid #e5e7eb;background:#fff;border-radius:18px;min-height:62px;padding:10px 12px;font:800 clamp(19px,2.8vw,27px) var(--oc-font);color:#111827;cursor:pointer;font-variant-numeric:lining-nums tabular-nums;transition:.12s;word-break:break-word}
.oc-soru-sik.iki .oc-sik{min-height:92px;font-size:clamp(24px,4vw,40px)}
.oc-sik:active{transform:scale(.97)}
.oc-sik.dogru{background:#dcfce7;border-color:#16a34a;color:#14532d}
.oc-sik.yanlis{background:#fee2e2;border-color:#dc2626;color:#7f1d1d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#fff4e6;font-family:var(--oc-font);color:#1f2937;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
@media print{html{zoom:1!important}}
button{font-family:var(--oc-font)}
/* ---------- MENÜ ---------- */
#menu{position:fixed;inset:0;overflow:auto;background:radial-gradient(1200px 600px at 80% -10%,#ffd9a8 0,transparent 60%),radial-gradient(900px 500px at -10% 110%,#ffc9d6 0,transparent 55%),#fff4e6;display:flex;flex-direction:column}
#menu-ic{zoom:var(--egt-z,1);width:100%;max-width:1180px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;gap:14px;flex:1}
body.cocuk-boyu #menu-ic{justify-content:flex-end}
.m-bas{display:flex;align-items:center;gap:12px}
.m-logo{width:58px;height:58px;border-radius:18px;flex:none;box-shadow:0 8px 20px rgba(249,115,22,.35)}
.m-bas h1{margin:0;font-size:clamp(26px,5vmin,40px);font-weight:900;letter-spacing:-.5px;color:#7c2d12;line-height:1}
.m-bas p{margin:3px 0 0;font-weight:800;font-size:15px;color:#9a3412}
.m-yildiz{margin-left:auto;background:#fff;border-radius:999px;padding:8px 14px;font-weight:900;font-size:20px;color:#b45309;box-shadow:0 4px 12px rgba(0,0,0,.08);font-variant-numeric:tabular-nums;white-space:nowrap}
.m-selam{font-weight:800;font-size:17px;color:#7c2d12;background:rgba(255,255,255,.7);border-radius:16px;padding:10px 14px}
.m-kartlar{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:620px){.m-kartlar{grid-template-columns:1fr 1fr}}

<script>
/* ===== OYUN CEBİ ÇEKİRDEK (OC) — oyun modüllerinin kullandığı ortak API ===== */
(function(){
'use strict';
var OC = window.OC = window.OC || {};
OC.font = "'Nunito','Baloo 2','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif";
OC.oyunlar = [];
OC.oyunEkle = function(o){ OC.oyunlar.push(o); };

/* --- sınıf seviyesi (tüm ZİRVE oyunlarında ortak anahtar) --- */
OC.sinif = function(){
  var s = null; try{ s = localStorage.getItem('zirve_oyun_sinif'); }catch(e){}
  return (['ana','12','34','56','78'].indexOf(s) >= 0) ? s : '34';
};
OC.sinifAyarla = function(s){ try{ localStorage.setItem('zirve_oyun_sinif', s); }catch(e){} };

/* --- kayıt --- */
OC.kayit = function(id){ try{ var v = localStorage.getItem('oc_kayit_'+id); return v ? JSON.parse(v) : null; }catch(e){ return null; } };
OC.kaydet = function(id, o){ try{ localStorage.setItem('oc_kayit_'+id, JSON.stringify(o)); }catch(e){} };
OC.yildizToplam = function(){ try{ return parseInt(localStorage.getItem('oc_yildiz')||'0',10)||0; }catch(e){ return 0; } };
OC.yildiz = function(n){
  var t = OC.yildizToplam() + (n|0);
  try{ localStorage.setItem('oc_yildiz', String(t)); }catch(e){}
  try{ document.dispatchEvent(new CustomEvent('oc-yildiz', {detail:t})); }catch(e){}
  return t;
};

/* --- büyük sayı (Türkçe kısaltma) --- */
var BIRIM = ['', ' B', ' Mn', ' Mr', ' Tn', ' Kt', ' Kn', ' Sk', ' Sp', ' Ok', ' Nn', ' Dk'];
OC.sayiYaz = function(n){
  n = Number(n) || 0;
  if (n < 0) return '-' + OC.sayiYaz(-n);
  if (n < 1000) return String(Math.floor(n));
  var u = Math.min(BIRIM.length-1, Math.floor(Math.log10(n)/3));
  var v = n / Math.pow(1000, u);
  if (v >= 999.5 && u < BIRIM.length-1) { u++; v = v / 1000; }
  var s = v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2);
  if (s.indexOf('.') >= 0) s = s.replace(/\.?0+$/, '');
  s = s.replace('.', ',');
  return s + BIRIM[u];
};

/* --- keskin tuval: dpr'nin tam sayı katı --- */
OC.tuval = function(cv, w, h){
  w = Math.max(1, Math.round(w)); h = Math.max(1, Math.round(h));
  var z = OC.olcek();
  var sc = Math.max(1, Math.min(4, Math.ceil((window.devicePixelRatio || 1) * z - 0.01)));
  if (w*sc*h*sc > 16000000) sc = Math.max(1, Math.floor(Math.sqrt(16000000/(w*h))));
  cv.width = w*sc; cv.height = h*sc;
  cv.style.width = w+'px'; cv.style.height = h+'px';
  var ctx = cv.getContext('2d');
  ctx.setTransform(sc,0,0,sc,0,0);
  ctx.imageSmoothingEnabled = true;
  cv._sc = sc; cv._w = w; cv._h = h;
  return ctx;
};
/* tahta ölçeği (kabuk oyun kabını büyütür) ve ölçekten bağımsız işaretçi konumu */
OC._olcek = 1;
OC.olcek = function(){ return OC._olcek || 1; };
OC.nokta = function(e, el){
  var r = el.getBoundingClientRect();
  var w = el._w || el.clientWidth || r.width, h = el._h || el.clientHeight || r.height;
  return { x: (e.clientX - r.left) / (r.width||1) * w, y: (e.clientY - r.top) / (r.height||1) * h };
};

/* --- ses (WebAudio, dosyasız) --- */
var AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==='suspended'){ try{AC.resume();}catch(e){} } return AC; }
function nota(f, t0, d, tip, g){
  var a = ac(); if(!a) return;
  var o = a.createOscillator(), k = a.createGain();
  o.type = tip||'sine'; o.frequency.setValueAtTime(f, a.currentTime+t0);
  k.gain.setValueAtTime(0.0001, a.currentTime+t0);
  k.gain.exponentialRampToValueAtTime(g||0.12, a.currentTime+t0+0.012);
  k.gain.exponentialRampToValueAtTime(0.0001, a.currentTime+t0+d);
  o.connect(k); k.connect(a.destination); o.start(a.currentTime+t0); o.stop(a.currentTime+t0+d+0.03);
}
OC.sesAcik = function(){ try{ return localStorage.getItem('oc_ses') !== '0'; }catch(e){ return true; } };
OC.ses = function(tip){
  if(!OC.sesAcik()) return;
  try{
    if(tip==='tik') nota(620,0,.06,'triangle',.08);
    else if(tip==='adim') nota(300,0,.05,'sine',.05);
    else if(tip==='pop') { nota(520,0,.07,'sine',.1); nota(780,.04,.08,'sine',.08); }
    else if(tip==='para') { nota(988,0,.08,'triangle',.09); nota(1319,.07,.14,'triangle',.09); }
    else if(tip==='dogru') { nota(523,0,.12,'triangle'); nota(659,.1,.12,'triangle'); nota(784,.2,.2,'triangle'); }
    else if(tip==='yanlis') { nota(220,0,.18,'sawtooth',.06); nota(175,.14,.24,'sawtooth',.06); }
    else if(tip==='odul') { [523,659,784,1047].forEach(function(f,i){ nota(f,i*.09,.22,'triangle',.11); }); }
  }catch(e){}
};

/* --- sesli okuma --- */
OC.konus = function(m){
  if(!OC.sesAcik()) return;
  try{
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(String(m));
    u.lang = 'tr-TR'; u.rate = 0.92; u.pitch = 0.85;
    var vs = speechSynthesis.getVoices().filter(function(v){ return /^tr/i.test(v.lang); });
    var erkek = vs.filter(function(v){ return /cem|tolga|ahmet|male|erkek/i.test(v.name); })[0];
    if(erkek) u.voice = erkek; else if(vs[0]) u.voice = vs[0];
    speechSynthesis.speak(u);
  }catch(e){}
};

/* --- soru üretimi: hazır banka (OC_SORULAR) + işlem üreteci --- */
function rs(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function kar(d){ for(var i=d.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=d[i]; d[i]=d[j]; d[j]=t; } return d; }
function sikla(dogru, yanlislar, adet){
  var gor = {}; gor[String(dogru)] = 1; var y = [];
  yanlislar.forEach(function(v){ if(!gor[String(v)]){ gor[String(v)] = 1; y.push(v); } });
  var s = kar([dogru].concat(kar(y).slice(0, adet-1)));
  return { siklar: s.map(String), d: s.indexOf(dogru) };
}
function matUret(sn){
  var a,b,c,m,r;
  if(sn==='ana'){
    var N = ['🍎','⭐','🐟','🎈','🌼','🚗'][rs(0,5)];
    a = rs(1,5); do{ b = rs(1,6); }while(b===a);
    if(Math.random()<.5){ r = sikla(a,[b],2); return {s:'Kaç tane var?  '+new Array(a+1).join(N), siklar:r.siklar, d:r.d, konu:'matematik'}; }
    var az = Math.random()<.5, x = new Array(a+1).join(N), y = new Array(b+1).join(N);
    var dg = (az ? (a<b) : (a>b)) ? x : y;
    r = sikla(dg,[dg===x?y:x],2);
    return {s:'Hangisi daha '+(az?'AZ':'ÇOK')+'?', siklar:r.siklar, d:r.d, konu:'matematik'};
  }
  if(sn==='12'){
    if(Math.random()<.55){ a=rs(2,20); b=rs(1,12); c=a+b; m=a+' + '+b+' = ?'; }
    else { a=rs(6,20); b=rs(1,a-1); c=a-b; m=a+' − '+b+' = ?'; }
    r = sikla(c,[c+1,c-1,c+2,c-2,c+10].filter(function(v){return v>=0;}),3);
  } else if(sn==='34'){
    var t = rs(0,3);
    if(t===0){ a=rs(2,9); b=rs(2,9); c=a*b; m=a+' × '+b+' = ?'; r=sikla(c,[c+a,c-a,c+b,c-b,c+1],3); }
    else if(t===1){ b=rs(2,9); c=rs(2,9); a=b*c; m=a+' ÷ '+b+' = ?'; r=sikla(c,[c+1,c-1,c+2],3); }
    else if(t===2){ a=rs(120,680); b=rs(110,300); c=a+b; m=a+' + '+b+' = ?'; r=sikla(c,[c+10,c-10,c+100,c-1],3); }
    else { a=rs(300,900); b=rs(110,290); c=a-b; m=a+' − '+b+' = ?'; r=sikla(c,[c+10,c-10,c+100,c+1],3); }
  } else if(sn==='56'){
    var t2 = rs(0,3);
    if(t2===0){ a=rs(11,25); b=rs(3,9); c=a*b; m=a+' × '+b+' = ?'; r=sikla(c,[c+b,c-b,c+10,c-10],3); }
    else if(t2===1){ b=[10,20,25,50][rs(0,3)]; a=rs(2,12)*20; c=a*b/100; m=a+' sayısının %'+b+"'i kaçtır?"; r=sikla(c,[c*2,c+5,c+10,c+15],3); }
    else if(t2===2){ a=rs(2,9); b=rs(2,6); c=a*a+b; m=a+'² + '+b+' = ?'; r=sikla(c,[a*2+b,c+1,c-b,c+a],3); }
    else { a=rs(3,12); b=rs(3,12); c=2*(a+b); m='Kenarları '+a+' cm ve '+b+' cm olan dikdörtgenin çevresi kaç cm?'; r=sikla(c,[a*b,a+b,c+2,c-2],3); }
  } else {
    var t3 = rs(0,3);
    if(t3===0){ a=rs(2,9); c=rs(2,12); b=rs(1,20); m=a+'x + '+b+' = '+(a*c+b)+' ise x kaçtır?'; r=sikla(c,[c+1,c-1,c+2,c*2],3); }
    else if(t3===1){ a=rs(2,5); b=rs(2,4); c=Math.pow(a,b); m=a+' üssü '+b+' kaçtır?'; r=sikla(c,[a*b,c+a,c-a,c*a],3); }
    else if(t3===2){ c=rs(4,15); m='√'+(c*c)+' = ?'; r=sikla(c,[c+1,c-1,c+2,c*2],3); }
    else { a=-rs(2,12); b=rs(3,15); c=a+b; m='('+a+') + '+b+' = ?'; r=sikla(c,[c+2,c-2,-c,b-a].filter(function(v){return v!==c;}),3); }
  }
  return {s:m, siklar:r.siklar, d:r.d, konu:'matematik'};
}
var sonSorular = [];
OC.soru = function(konu){
  var sn = OC.sinif(), banka = (window.OC_SORULAR && window.OC_SORULAR[sn]) || [];
  var havuz = konu ? banka.filter(function(q){ return q.konu===konu; }) : banka;
  var mat = (konu==='matematik') ? .6 : (konu ? 0 : .3);
  if(!havuz.length || Math.random()<mat) return matUret(sn);
  var q, dene = 0;
  do{ q = havuz[Math.floor(Math.random()*havuz.length)]; dene++; }while(sonSorular.indexOf(q.s)>=0 && dene<12);
  sonSorular.push(q.s); if(sonSorular.length>25) sonSorular.shift();
  /* şıkları karıştır, doğru indeksini koru */
  var dogru = q.siklar[q.d], sik = kar(q.siklar.slice());
  var adet = sn==='ana' ? 2 : 3;
  if(sik.length>adet){ sik = kar([dogru].concat(sik.filter(function(x){return x!==dogru;}).slice(0,adet-1))); }
  return {s:q.s, siklar:sik, d:sik.indexOf(dogru), konu:q.konu||'genel'};
};
OC._matUret = matUret;

/* --- bildirim --- */
OC.toast = function(m){
  var t = document.getElementById('oc-toast');
  if(!t){ t = document.createElement('div'); t.id = 'oc-toast'; document.body.appendChild(t); }
  t.textContent = m; t.className = 'gor';
  clearTimeout(OC._tt); OC._tt = setTimeout(function(){ t.className = ''; }, 2200);
};

/* --- soru penceresi (alta hizalı; çocuk boyu uyumlu) --- */
OC.soruSor = function(sec){
  sec = sec || {};
  return new Promise(function(coz){
    var q = sec.soru || OC.soru(sec.konu);
    var ort = document.createElement('div'); ort.className = 'oc-soru-ort';
    var kut = document.createElement('div'); kut.className = 'oc-soru';
    var bas = document.createElement('div'); bas.className = 'oc-soru-bas'; bas.textContent = sec.baslik || '🧠 Bilgi Molası';
    var met = document.createElement('div'); met.className = 'oc-soru-met'; met.textContent = q.s;
    var din = document.createElement('button'); din.className = 'oc-soru-din'; din.type = 'button'; din.textContent = '🔊 Dinle';
    din.onclick = function(){ OC.konus(q.s); };
    var sk = document.createElement('div'); sk.className = 'oc-soru-sik' + (q.siklar.length===2 ? ' iki' : '');
    var bitti = false;
    q.siklar.forEach(function(s, i){
      var b = document.createElement('button'); b.type = 'button'; b.className = 'oc-sik'; b.textContent = s;
      b.onclick = function(){
        if(bitti) return; bitti = true;
        var dogru = (i === q.d);
        b.classList.add(dogru ? 'dogru' : 'yanlis');
        if(!dogru){ sk.children[q.d].classList.add('dogru'); }
        OC.ses(dogru ? 'dogru' : 'yanlis');
        bas.textContent = dogru ? '✅ Doğru!' : '💡 Doğru cevap: ' + q.siklar[q.d];
        setTimeout(function(){ if(ort.parentNode) ort.parentNode.removeChild(ort); coz(dogru); }, dogru ? 800 : 1700);
      };
      sk.appendChild(b);
    });
    kut.appendChild(bas); kut.appendChild(met); kut.appendChild(din); kut.appendChild(sk);
    ort.appendChild(kut); document.body.appendChild(ort);
    ['keydown','keyup'].forEach(function(ev){ ort.addEventListener(ev, function(e){ e.stopPropagation(); }); });
    if(OC.sinif()==='ana') setTimeout(function(){ OC.konus(q.s); }, 250);
  });
};

<script>
/* ===== ZGIRIS — ZİRVE zorunlu öğrenci girişi + Öğretmen Paneli (Firestore REST, SDK'sız, silme YOK) ===== */
(function(){

var AYAR = window.ZGIRIS_AYAR || { projectId:'shaped-totem-481514-c5', apiKey:'', koleksiyon:'oyun_girisleri', pin:'2026' };
var TABAN = 'https://firestore.googleapis.com/v1/projects/'+AYAR.projectId+'/databases/(default)/documents';
var OYUN = 'Oyun', ogr = null, belge = null, zamanlayici = null;
function anahtar(ilk){ return AYAR.apiKey ? (ilk?'?':'&')+'key='+encodeURIComponent(AYAR.apiKey) : ''; }
function ls(k, v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){} return null; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function cihaz(){
  var u = navigator.userAgent || '', w = screen.width||0, h = screen.height||0, dpr = window.devicePixelRatio||1;
  var dok = (navigator.maxTouchPoints||0) > 0 || ('ontouchstart' in window);
  var os = /iPhone/.test(u) ? 'iPhone' : (/iPad/.test(u) || (/Macintosh/.test(u) && dok)) ? 'iPad' : /Android/.test(u) ? 'Android' : /Windows/.test(u) ? 'Windows' : /CrOS/.test(u) ? 'Chromebook' : /Mac/.test(u) ? 'Mac' : /Linux/.test(u) ? 'Linux' : 'Bilinmiyor';
  var buyuk = Math.max(w,h), fiziksel = buyuk*dpr;
  var tur;
  if(dok && ((buyuk >= 1700 && dpr <= 1.3) || fiziksel >= 3000 && buyuk >= 1700)) tur = 'Akıllı Tahta';
  else if(os==='iPhone' || (os==='Android' && Math.min(w,h) < 600)) tur = 'Telefon';
  else if(os==='iPad' || (os==='Android')) tur = 'Tablet';
  else tur = 'Bilgisayar';
  var tar = /Edg\//.test(u) ? 'Edge' : /OPR\//.test(u) ? 'Opera' : /Chrome\//.test(u) ? 'Chrome' : /Firefox\//.test(u) ? 'Firefox' : /Safari\//.test(u) ? 'Safari' : 'Diğer';
  return { os:os, tur:tur, tarayici:tar, ekran:w+'x'+h };
}
function alanlar(o){ var f = {}; Object.keys(o).forEach(function(k){ f[k] = {stringValue:String(o[k])}; }); return {fields:f}; }
function coz(d){ var o = {}; var f = (d && d.fields) || {}; Object.keys(f).forEach(function(k){ o[k] = f[k].stringValue!==undefined ? f[k].stringValue : (f[k].timestampValue || f[k].integerValue || ''); }); return o; }

function kuyrugaEkle(k){ var q = []; try{ q = JSON.parse(ls('zirve_giris_bekleyen')||'[]'); }catch(e){} q.push(k); ls('zirve_giris_bekleyen', JSON.stringify(q.slice(-50))); }
function kuyruguGonder(){
  var q = []; try{ q = JSON.parse(ls('zirve_giris_bekleyen')||'[]'); }catch(e){}
  if(!q.length || !navigator.onLine) return;
  ls('zirve_giris_bekleyen', '[]');
  q.forEach(function(k){ fetch(TABAN+'/'+AYAR.koleksiyon+anahtar(true), {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(alanlar(k))}).then(function(r){ if(!r.ok) throw 0; }).catch(function(){ kuyrugaEkle(k); }); });
}
function kaydet(){
  var c = cihaz(), simdi = new Date().toISOString();
  var k = { ad:ogr.ad, soyad:ogr.soyad, sinif:ogr.sinif, sube:ogr.sube, oyun:OYUN, cihaz:c.tur, os:c.os, tarayici:c.tarayici, ekran:c.ekran, giris:simdi, son:simdi };
  return fetch(TABAN+'/'+AYAR.koleksiyon+anahtar(true), {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(alanlar(k))})
    .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); })
    .then(function(j){ belge = j.name; })
    .catch(function(){ kuyrugaEkle(k); });
}
function sonGoruldu(){
  if(!belge || document.hidden || !navigator.onLine) return;
  fetch('https://firestore.googleapis.com/v1/'+belge+'?updateMask.fieldPaths=son'+anahtar(false), {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(alanlar({son:new Date().toISOString()}))}).catch(function(){});
}
function durum(m){
  if(!belge || !navigator.onLine) return;
  fetch('https://firestore.googleapis.com/v1/'+belge+'?updateMask.fieldPaths=son&updateMask.fieldPaths=ilerleme'+anahtar(false), {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(alanlar({son:new Date().toISOString(), ilerleme:String(m).slice(0,80)}))}).catch(function(){});
}
function listele(){
  return fetch(TABAN+':runQuery'+anahtar(true), {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({structuredQuery:{from:[{collectionId:AYAR.koleksiyon}], orderBy:[{field:{fieldPath:'giris'}, direction:'DESCENDING'}], limit:800}})})
    .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); })
    .then(function(a){ return (a||[]).filter(function(x){ return x.document; }).map(function(x){ return coz(x.document); }); });
}

var CSS = '.zg-ort{position:fixed;inset:0;z-index:9500;background:radial-gradient(circle at 50% 20%,#3b2a63,#120c24 70%);display:flex;align-items:center;justify-content:center;padding:14px;font-family:var(--oc-font,system-ui,sans-serif);overflow:auto}'

+'.zg-filtre{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.zg-filtre input,.zg-filtre select,.zg-filtre button{border:2px solid #e5e7eb;border-radius:12px;padding:8px 10px;font:800 14px var(--oc-font,system-ui);min-height:42px;background:#fff;color:#111827}'

+'.zg-nok{display:inline-block;width:10px;height:10px;border-radius:50%;background:#d1d5db;margin-right:6px}.zg-nok.on{background:#22c55e}';
function cssEkle(){ if(document.getElementById('zg-css')) return; var s = document.createElement('style'); s.id = 'zg-css'; s.textContent = CSS; document.head.appendChild(s); }

function basHarf(s){ return s.trim().toLocaleLowerCase('tr-TR').split(/\s+/).map(function(p){ return p.charAt(0).toLocaleUpperCase('tr-TR')+p.slice(1); }).join(' '); }

function tekrar(coz2){
  var o = katman();
  o.innerHTML = '<div class="zg-kart"><h2>🎉 Tekrar hoş geldin!</h2><p style="font-size:20px;color:#111827">'+esc(ogr.ad)+' '+esc(ogr.soyad)+' · '+esc(ogr.sinif)+(ogr.sinif==='Öğretmen'?'':'-'+esc(ogr.sube))+'</p>'

function baslat(sec){
  sec = sec || {}; OYUN = sec.oyun || OYUN; RENK = sec.renk || RENK; cssEkle();
  return new Promise(function(res){
    function bitti(){
      kaydet(); kuyruguGonder();

function saat(iso){ var d = new Date(iso); if(isNaN(d)) return '-'; var p = function(n){ return (n<10?'0':'')+n; }; return p(d.getDate())+'.'+p(d.getMonth()+1)+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function panelAc(){

    };
    function sec(el, bas, d){ el.innerHTML = '<option value="">'+bas+'</option>' + d.map(function(x){ return '<option>'+esc(x)+'</option>'; }).join(''); }
    function tekil(a){ var g = {}; veri.forEach(function(k){ if(k[a]) g[k[a]] = 1; }); return Object.keys(g).sort(function(x,y){ return x.localeCompare(y,'tr',{numeric:true}); }); }
    function suz(){
      var a = q('#zg-ara').value.trim().toLocaleLowerCase('tr-TR'), fo = q('#zg-foyun').value, fs = q('#zg-fsinif').value, fc = q('#zg-fcihaz').value;
      return veri.filter(function(k){ return (!a || (k.ad+' '+k.soyad).toLocaleLowerCase('tr-TR').indexOf(a)>=0) && (!fo || k.oyun===fo) && (!fs || k.sinif===fs) && (!fc || k.cihaz===fc); });

        return '<tr><td><span class="zg-nok'+(c?' on':'')+'"></span>'+esc(k.ad)+' '+esc(k.soyad)+'</td><td>'+esc(k.sinif)+(k.sube?'-'+esc(k.sube):'')+'</td><td>'+esc(k.oyun)+'</td><td>'+esc(k.ilerleme||'')+'</td><td>'+(ik[k.cihaz]||'')+' '+esc(k.cihaz)+' · '+esc(k.os)+' · '+esc(k.tarayici)+'</td><td>'+saat(k.giris)+'</td><td>'+saat(k.son)+'</td></tr>'; }).join('') : '<tr><td colspan="7">Kayıt yok.</td></tr>';

var ZG = window.ZGIRIS = { baslat:baslat, panelAc:panelAc, durum:durum, cihaz:cihaz, ayar:AYAR, ogrenci:null };
})();

function $(i){ return document.getElementById(i); }
function ls(k, v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){} return null; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var PARAM = new URLSearchParams(location.search);

/* ---------- pencere yardımcıları ---------- */
function pencere(html){
  var o = document.createElement('div'); o.className = 'pen-ort';
  o.innerHTML = '<div class="pen">'+html+'</div>';
  o.addEventListener('pointerdown', function(e){ if(e.target === o && o.dataset.kilit !== '1') kapat(o); });
  ['keydown','keyup'].forEach(function(ev){ o.addEventListener(ev, function(e){ e.stopPropagation(); }); });
  document.body.appendChild(o); return o;
}
function kapat(o){ if(o && o.parentNode){ o.parentNode.removeChild(o); if(o._kapaninca) o._kapaninca(); } }

/* ---------- ekran modu (telefon/tablet=1, akıllı tahta≈1.35, büyük tahta≈1.6) ---------- */
var MODLAR = { tablet:1, tahta:1.35, buyuk:1.6 };
function buyukOlcek(){ var w = window.innerWidth, h = window.innerHeight; return Math.max(1.6, Math.min(3, Math.min(w/1420, h/800))); }
function otoMod(){
  var c = window.ZGIRIS.cihaz(), dpr = window.devicePixelRatio||1, w = Math.max(window.innerWidth, window.innerHeight);
  if(w*dpr >= 3000 && w >= 2500) return 'buyuk';
  if(c.tur === 'Akıllı Tahta') return 'tahta';
  return 'tablet';
}
function ekranUygula(){
  var m = ls('zirve_ekran_mod'); if(!MODLAR[m]) m = otoMod();
  var z = m === 'buyuk' ? buyukOlcek() : MODLAR[m];
  if(window.innerWidth / z < 340) z = 1;
  document.documentElement.style.setProperty('--egt-z', z);
  OC._olcek = z; $('kok').style.zoom = z;
  return m;
}
window.ZIRVE_ekranMod = { ayarla:function(m){ if(m==='oto') ls('zirve_ekran_mod', null); else ls('zirve_ekran_mod', m); ekranUygula(); }, simdi:function(){ return ls('zirve_ekran_mod') || 'oto'; } };
window.ZIRVE_ekranReset = function(){ document.documentElement.style.setProperty('--egt-z', 1); };
window.ZIRVE_ekranGeri = ekranUygula;
window.addEventListener('resize', function(){ if(!ls('zirve_ekran_mod')) ekranUygula(); cocukUygula(); });

/* ---------- çocuk boyu: 0 kapalı · 1 açık · 2 çok alçak ---------- */
function cocukDeger(){
  var p = PARAM.get('cocuk'); if(p==='0'||p==='1'||p==='2') return p;
  var v = ls('zirve_cocuk_boyu'); if(v==='0'||v==='1'||v==='2') return v;
  return (otoMod() !== 'tablet') ? '1' : '0';
}
function cocukUygula(){
  var v = cocukDeger();
  document.body.classList.toggle('cocuk-boyu', v !== '0');
  document.body.classList.toggle('cocuk-alcak', v === '2');
  var ad = {'0':'Kapalı','1':'Açık','2':'Çok alçak'}[v];
  if($('b-cocuk')) $('b-cocuk').textContent = '🧒 Çocuk boyu: ' + ad;
  return v;
}
function cocukDondur(){ var v = cocukDeger(); v = v==='0' ? '1' : v==='1' ? '2' : '0'; ls('zirve_cocuk_boyu', v); PARAM.delete('cocuk'); cocukUygula(); OC.toast('🧒 Çocuk boyu: ' + {'0':'Kapalı','1':'Açık','2':'Çok alçak'}[v]); }

/* ---------- 🏠 Siteye Dön (çıkmadan) ---------- */
function siteyeDon(){
  try{ if(aktif && aktif.durdur){ aktif.durdur(); } }catch(e){}
  try{ if(window.self !== window.top){ window.parent.postMessage({zirve:'siteyeDon'}, '*'); try{ window.top.location.href = SITE_URL; }catch(e){} return; } }catch(e){}
  try{ if(window.opener && !window.opener.closed){ window.opener.focus(); window.close(); return; } }catch(e){}
  try{ if(document.referrer && document.referrer.indexOf(SITE_URL) === 0 && history.length > 1){ history.go(aktif ? -2 : -1); return; } }catch(e){}
  location.href = SITE_URL;
}
window.ZIRVE_siteyeDon = siteyeDon;

/* ---------- menü ---------- */
var aktif = null, molaPen = null, ogrenci = null;
function koyulastir(h, o){ var n = parseInt(h.slice(1), 16), r = n>>16, g = (n>>8)&255, b = n&255; r = Math.round(r*o); g = Math.round(g*o); b = Math.round(b*o); return 'rgb('+r+','+g+','+b+')'; }
function menuCiz(){
  var k = $('m-kartlar'); k.innerHTML = '';
  OC.oyunlar.forEach(function(o){
    var b = document.createElement('button'); b.className = 'kart'; b.type = 'button';
    b.style.setProperty('--k', o.renk); b.style.setProperty('--kg', koyulastir(o.renk, .72));
    b.innerHTML = '<div class="ik">'+o.ikon+'</div><div><b>'+esc(o.ad)+'</b><span>'+esc(o.aciklama||'')+'</span>'+(o.ders ? '<i>'+esc(o.ders)+'</i>' : '')+'</div>';
    b.onclick = function(){ OC.ses('tik'); oyunAc(o); };
    k.appendChild(b);
  });
  yildizYaz(OC.yildizToplam());
  var sa = {ana:'Okul öncesi', '12':'1–2. sınıf', '34':'3–4. sınıf', '56':'5–6. sınıf', '78':'7–8. sınıf'}[OC.sinif()];
  $('m-selam').textContent = (ogrenci ? 'Merhaba ' + ogrenci.ad + '! ' : '') + 'Bir oyun seç ve başla. Sorular: ' + sa;
  $('m-surum').textContent = 'v' + APP.surum + ' ✓ · ' + APP.ad;
}
function yildizYaz(t){ $('m-yildiz').textContent = '⭐ ' + t; $('o-yz').textContent = '⭐ ' + t; }
var durumZ = null;
document.addEventListener('oc-yildiz', function(e){
  yildizYaz(e.detail);
  clearTimeout(durumZ); durumZ = setTimeout(function(){ try{ window.ZGIRIS.durum && window.ZGIRIS.durum('⭐ ' + OC.yildizToplam() + (aktif ? ' · ' + aktif.ad : '')); }catch(err){} }, 15000);
});

/* ---------- oyun aç/kapat/mola ---------- */
function oyunAc(o){
  if(aktif) return;
  aktif = o;
  document.documentElement.style.setProperty('--oyun', o.renk);
  if(o.css && !$('css-'+o.id)){ var st = document.createElement('style'); st.id = 'css-'+o.id; st.textContent = o.css; document.head.appendChild(st); }
  $('o-ad').textContent = o.ikon + ' ' + o.ad;
  $('v-ik').textContent = o.ikon; $('v-ad').textContent = o.ad; $('v-alt').textContent = '👇 Dokunulan her şey aşağıda';
  $('menu').style.display = 'none'; $('oyun').classList.add('acik');
  var kok = $('kok'); kok.innerHTML = ''; ekranUygula();
  try{ history.pushState({oc:o.id}, ''); }catch(e){}
  requestAnimationFrame(function(){
    try{ o.baslat(kok); }
    catch(err){ console.error(err); OC.toast('Oyun açılamadı. Lütfen tekrar dene.'); oyunKapat(true); }
  });
}
function oyunKapat(gecmisten){
  if(!aktif) return;
  var o = aktif;
  if(molaPen){ var mp = molaPen; molaPen = null; mp._kapaninca = null; kapat(mp); }
  try{ o.durdur(); }catch(err){ console.error(err); }
  Array.prototype.forEach.call(document.querySelectorAll('.oc-soru-ort'), function(x){ x.remove(); });
  aktif = null; $('kok').innerHTML = '';
  $('oyun').classList.remove('acik'); $('menu').style.display = 'flex';
  try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){}
  menuCiz();
  if(!gecmisten){ try{ if(history.state && history.state.oc) history.back(); }catch(e){} }
}
OC.cik = function(){ oyunKapat(false); };
window.addEventListener('popstate', function(){ if(aktif) oyunKapat(true); });
function molaAc(){
  if(!aktif || molaPen) return;
  try{ aktif.mola && aktif.mola(true); }catch(e){}
  molaPen = pencere('<h2>⏸ Mola</h2><p>'+esc(aktif.ikon+' '+aktif.ad)+' duraklatıldı.</p>'
    +'<button class="btn" data-a="devam">▶ Devam Et</button>'
    +'<button class="btn iki" data-a="menu">🎮 Oyunlara Dön</button>'
    +'<button class="btn gri kucuk" data-a="cocuk">🧒 Çocuk boyu: değiştir</button>'
    +'<button class="btn gri kucuk" data-a="ses">'+(OC.sesAcik() ? '🔊 Ses: Açık' : '🔇 Ses: Kapalı')+'</button>'
    +'<button class="btn gri kucuk" data-a="site">🏠 Siteye Dön</button>');
  molaPen._kapaninca = function(){ molaPen = null; try{ aktif && aktif.mola && aktif.mola(false); }catch(e){} };
  molaPen.addEventListener('click', function(e){
    var a = e.target && e.target.dataset && e.target.dataset.a; if(!a) return;
    if(a==='devam') kapat(molaPen);
    else if(a==='menu') oyunKapat(false);
    else if(a==='cocuk') cocukDondur();
    else if(a==='ses'){ ls('oc_ses', OC.sesAcik() ? '0' : '1'); e.target.textContent = OC.sesAcik() ? '🔊 Ses: Açık' : '🔇 Ses: Kapalı'; }
    else if(a==='site') siteyeDon();
  });
}
document.addEventListener('keydown', function(e){
  if(!aktif) return;
  if(e.key === 'Escape' || e.key === 'p' || e.key === 'P'){ if(document.querySelector('.oc-soru-ort')) return; if(molaPen) kapat(molaPen); else molaAc(); }
});
document.addEventListener('visibilitychange', function(){ if(document.hidden && aktif && !molaPen && !document.querySelector('.oc-soru-ort')) molaAc(); });

/* ---------- sınıf seçimi ---------- */
var SINIFLAR = [['ana','🧸 Okul öncesi','resimli, 2 seçenekli'],['12','1–2. sınıf','toplama, çıkarma, harfler'],['34','3–4. sınıf','çarpma, bölme, bilgi'],['56','5–6. sınıf','yüzde, alan, örüntü'],['78','7–8. sınıf','denklem, üs, kök']];
function sinifHtml(){ var s = OC.sinif(); return '<div class="sinif-sec">' + SINIFLAR.map(function(x){ return '<button data-s="'+x[0]+'" class="'+(x[0]===s?'sec':'')+'">'+x[1]+'<small>'+x[2]+'</small></button>'; }).join('') + '</div>'; }
function sinifBagla(o){ o.addEventListener('click', function(e){ var b = e.target.closest && e.target.closest('[data-s]'); if(!b) return; OC.sinifAyarla(b.dataset.s); OC.ses('tik'); Array.prototype.forEach.call(o.querySelectorAll('[data-s]'), function(x){ x.classList.toggle('sec', x === b); }); menuCiz(); }); }
function sinifAc(){ var o = pencere('<h2>🎓 Sınıf Seviyesi</h2><p>Sorular ve bölümler bu seviyeye göre gelir.</p>'+sinifHtml()+'<button class="btn" data-k>Tamam</button>'); sinifBagla(o); o.querySelector('[data-k]').onclick = function(){ kapat(o); }; }
function sinifVarsayilan(){
  if(!ogrenci) return;
  var kim = ogrenci.ad+'|'+ogrenci.soyad+'|'+ogrenci.sinif+'|'+ogrenci.sube;
  if(ls('zirve_oyun_sinif') && ls('oc_sinif_kim') === kim) return;
  ls('oc_sinif_kim', kim);
  if(ogrenci.sinif === 'Öğretmen'){ if(!ls('zirve_oyun_sinif')) OC.sinifAyarla('34'); return; }
  var s = ogrenci.sinif, n = parseInt(s, 10);
  OC.sinifAyarla(s === 'Anaokulu' ? 'ana' : n <= 2 ? '12' : n <= 4 ? '34' : n <= 6 ? '56' : '78');
}

/* ---------- karşılama / nasıl oynanır ---------- */
var KARSILAMA = { baslik:'Oyun Cebi\'ne hoş geldin!', ozet:'Dört oyun, tek cep: yolu boya, hedefi bul, fırını büyüt, lokantayı işlet. Her oyunda bilgi soruları ödül kazandırır.',
  adimlar:['Sınıf seviyeni seç (aşağıda). Sorular ona göre gelir.','Bir oyun kartına dokun. Parmakla, ekrandaki büyük düğmelerle ya da klavyeyle (ok tuşları / WASD) oynanır.','Soru gelince düşün, doğru cevaba dokun: ⭐ ve güç kazanırsın. Yanlışta ceza yok, doğrusu gösterilir.','⏸ Mola ile durdur; 🎮 Oyunlara Dön ile başka oyuna geç. İlerlemen bu cihazda saklanır.','Akıllı tahtada boyun yetişmiyorsa 🧒 Çocuk boyu düğmesi her şeyi aşağı indirir.'] };
function karsilamaAc(ilk){
  var o = pencere('<h2>👋 '+esc(KARSILAMA.baslik)+'</h2><p>'+esc(KARSILAMA.ozet)+'</p><ol>'+KARSILAMA.adimlar.map(function(a){ return '<li>'+esc(a)+'</li>'; }).join('')+'</ol><h3>Sınıf seviyesi</h3>'+sinifHtml()+'<button class="btn" data-k>'+(ilk ? '▶ Başlayalım' : 'Tamam')+'</button>');
  sinifBagla(o); o.querySelector('[data-k]').onclick = function(){ kapat(o); };
  ls('oc_karsilama_goruldu', '1');
}
window.ZIRVE_karsilamaAc = function(){ karsilamaAc(false); };

/* ---------- QR ile paylaş ---------- */
function betikYukle(src){ return new Promise(function(ok, hata){ var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = hata; document.head.appendChild(s); }); }
function qrAc(){
  var url = (window.PAYLAS && window.PAYLAS.url) || location.href.split('#')[0].split('?')[0];
  var yerel = !/^https?:/.test(url) || /localhost|127\.0\.0\.1/.test(url);
  var o = pencere('<h2>📲 QR ile Paylaş</h2><div class="qr-kutu" id="qr-kutu">Hazırlanıyor…</div><div class="adres">'+esc(url)+'</div><button class="btn kucuk" id="qr-kopya">🔗 Linki kopyala</button><button class="btn iki kucuk" id="qr-indir">⬇️ PNG indir</button><button class="btn gri kucuk" data-k>Kapat</button>');
  o.querySelector('[data-k]').onclick = function(){ kapat(o); };
  o.querySelector('#qr-kopya').onclick = function(){ (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(function(){ OC.toast('Link kopyalandı'); }).catch(function(){ OC.toast('Kopyalanamadı'); }); };
  var kutu = o.querySelector('#qr-kutu');
  if(yerel){ kutu.textContent = 'QR için önce dosyayı GitHub Pages\'e yükle; bu adres yalnız bu cihazda açılır.'; return; }
  if(!navigator.onLine){ kutu.textContent = 'QR oluşturmak için internet gerekli.'; return; }
  (window.qrcode ? Promise.resolve() : betikYukle('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js')).then(function(){
    var q = window.qrcode(0, 'M'); q.addData(url); q.make();
    var n = q.getModuleCount(), h = 8, kb = 4, cv = document.createElement('canvas'); cv.width = cv.height = (n + kb*2) * h;
    var c = cv.getContext('2d'); c.fillStyle = '#fff'; c.fillRect(0, 0, cv.width, cv.height); c.fillStyle = '#111827';
    for(var y = 0; y < n; y++) for(var x = 0; x < n; x++) if(q.isDark(y, x)) c.fillRect((x+kb)*h, (y+kb)*h, h, h);
    kutu.innerHTML = ''; kutu.appendChild(cv);
    o.querySelector('#qr-indir').onclick = function(){ var a = document.createElement('a'); a.download = 'oyun-cebi-qr.png'; a.href = cv.toDataURL('image/png'); a.click(); };
  }).catch(function(){ kutu.textContent = 'QR kütüphanesi yüklenemedi. İnterneti kontrol et.'; });
}
window.ZIRVE_paylasAc = qrAc;

/* ---------- sürüm rozeti + öz-kontrol + güncelleme uyarısı ---------- */
function modulKontrol(){
  var l = [['Öğrenci girişi (ZGIRIS)', !!(window.ZGIRIS && window.ZGIRIS.baslat)], ['Öğretmen Paneli', !!(window.ZGIRIS && window.ZGIRIS.panelAc)], ['Siteye Dön', typeof window.ZIRVE_siteyeDon === 'function'], ['Çocuk boyu', typeof cocukUygula === 'function'], ['Ekran modu', !!window.ZIRVE_ekranMod], ['QR ile Paylaş', typeof window.ZIRVE_paylasAc === 'function'], ['Karşılama', typeof window.ZIRVE_karsilamaAc === 'function'], ['Soru üreteci', typeof OC.soru === 'function'], ['Soru bankası', !!(window.OC_SORULAR && window.OC_SORULAR.ana && window.OC_SORULAR['78'])]];
  ['renkyolu','kupbahce','simit','pide'].forEach(function(id){ var o = OC.oyunlar.filter(function(x){ return x.id === id; })[0]; l.push(['Oyun: ' + (o ? o.ad : id), !!(o && typeof o.baslat === 'function' && typeof o.durdur === 'function')]); });
  return l;
}
function surumAc(){
  var l = modulKontrol(), ok = l.filter(function(x){ return x[1]; }).length;
  var soruSay = 0; try{ Object.keys(window.OC_SORULAR).forEach(function(k){ soruSay += window.OC_SORULAR[k].length; }); }catch(e){}
  var o = pencere('<h2>📦 Sürüm v'+APP.surum+'</h2><p>'+APP.tarih+' · Kod: önceki '+APP.onceki.satir+' satır → şimdi '+APP.satir+' satır · '+APP.kb+' KB</p><h3>Yenilikler</h3><ol>'+APP.yenilikler.map(function(y){ return '<li>'+esc(y)+'</li>'; }).join('')+'</ol><h3>Öz-kontrol: '+ok+'/'+l.length+' modül sağlam</h3><div class="modul-l">'+l.map(function(x){ return (x[1] ? '✅ ' : '❌ ') + esc(x[0]); }).join('<br>')+'<br>📚 Hazır soru: '+soruSay+' (+ sınırsız işlem sorusu)</div><button class="btn kucuk" id="s-denetle">🔄 Güncellemeleri Denetle</button><button class="btn gri kucuk" data-k>Kapat</button>');
  o.querySelector('[data-k]').onclick = function(){ kapat(o); };
  o.querySelector('#s-denetle').onclick = function(){ surumKontrol(true); };
}
function surumBant(){
  var l = modulKontrol(), ok = l.filter(function(x){ return x[1]; }).length, eski = ls('oc_surum');
  var b = document.createElement('div'); b.id = 'surum-bant';
  b.textContent = (eski && eski !== APP.surum) ? '🆕 v'+eski+' → v'+APP.surum+' · Kod: '+APP.onceki.satir+' → '+APP.satir+' satır · 🧪 '+ok+'/'+l.length+' modül sağlam' : '✅ v'+APP.surum+' · en güncel sürüm · 🧪 '+ok+'/'+l.length+' modül sağlam';
  b.onclick = function(){ b.remove(); }; document.body.appendChild(b); setTimeout(function(){ if(b.parentNode) b.remove(); }, 4500);
  ls('oc_surum', APP.surum);
}
var damga = null;
function damgaAl(){
  if(!/^https?:/.test(location.protocol)) return Promise.resolve(null);
  var u = location.href.split('#')[0].split('?')[0] + '?_v=' + Date.now();
  return fetch(u, {method:'HEAD', cache:'no-store'}).then(function(r){ return r.headers.get('ETag') || r.headers.get('Last-Modified'); }).catch(function(){ return null; });
}
function surumKontrol(elle){
  damgaAl().then(function(d){
    if(d && damga && d !== damga){ if(!$('yeni-surum')){ var b = document.createElement('button'); b.id = 'yeni-surum'; b.textContent = '🔴 Yeni sürüm yayınlandı · Yenile'; b.onclick = function(){ location.href = location.href.split('#')[0].split('?')[0] + '?_r=' + Date.now(); }; document.body.appendChild(b); } }
    else if(elle) OC.toast(d ? '✅ En güncel sürümdesin (v'+APP.surum+')' : 'Denetlenemedi (yalnız internette yayındayken çalışır)');
    if(d && !damga) damga = d;
  });
}
function surumBaslat(){ damgaAl().then(function(d){ damga = d; }); setInterval(function(){ if(!document.hidden) surumKontrol(false); }, 120000); window.addEventListener('focus', function(){ surumKontrol(false); }); }

/* ---------- PWA ---------- */
var kurIstemi = null;
window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); kurIstemi = e; });
function initPWA(){
  try{
    var m = { name:'Oyun Cebi · Barış Öğretmen', short_name:'Oyun Cebi', start_url:location.href.split('#')[0].split('?')[0], display:'standalone', orientation:'any', background_color:'#fff4e6', theme_color:'#f97316',
      icons:[{src:IKON.i192, sizes:'192x192', type:'image/png', purpose:'any'}, {src:IKON.i512, sizes:'512x512', type:'image/png', purpose:'any'}, {src:IKON.i512, sizes:'512x512', type:'image/png', purpose:'maskable'}] };
    var l = document.createElement('link'); l.rel = 'manifest'; l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], {type:'application/manifest+json'})); document.head.appendChild(l);
    var t = document.createElement('meta'); t.name = 'msapplication-TileImage'; t.content = IKON.i192; document.head.appendChild(t);
  }catch(e){}
}
function pwaYukle(){
  if(kurIstemi){ kurIstemi.prompt(); kurIstemi = null; return; }
  var o = pencere('<h2>📲 Bu Cihaza Yükle</h2><ol><li><b>iPhone / iPad:</b> Paylaş → Ana Ekrana Ekle (Safari, Chrome, Edge fark etmez).</li><li><b>Android:</b> ⋮ menü → Ana ekrana ekle.</li><li><b>Bilgisayar / Akıllı tahta (Chrome, Edge):</b> ⋮ menü → Yükle ya da Kısayol oluştur → pencere olarak aç.</li></ol><button class="btn gri kucuk" data-k>Kapat</button>');
  o.querySelector('[data-k]').onclick = function(){ kapat(o); };
}

/* ---------- ayarlar ---------- */
function ayarAc(){
  var em = window.ZIRVE_ekranMod.simdi(), cb = cocukDeger();
  function seg(ad, sec, d){ return '<div class="seg" data-seg="'+ad+'">' + d.map(function(x){ return '<button data-v="'+x[0]+'" class="'+(x[0]===sec?'sec':'')+'">'+x[1]+'</button>'; }).join('') + '</div>'; }
  var o = pencere('<h2>⚙️ Ayarlar</h2>'
    +'<h3>Ses</h3>'+seg('ses', OC.sesAcik() ? '1' : '0', [['1','🔊 Açık'],['0','🔇 Kapalı']])
    +'<h3>Ekran modu</h3>'+seg('ekran', em, [['oto','Oto'],['tablet','Tablet'],['tahta','Akıllı Tahta'],['buyuk','Büyük Tahta']])
    +'<h3>🧒 Çocuk boyu</h3>'+seg('cocuk', cb, [['0','Kapalı'],['1','Açık'],['2','Çok alçak']])
    +'<h3>Araçlar</h3><button class="btn iki kucuk" data-a="sinif">🎓 Sınıf Seviyesi</button><button class="btn iki kucuk" data-a="nasil">❓ Nasıl Oynanır</button><button class="btn iki kucuk" data-a="qr">📲 QR ile Paylaş</button><button class="btn iki kucuk" data-a="yukle">📲 Uygulamayı Bu Cihaza Yükle</button><button class="btn iki kucuk" data-a="panel">👩‍🏫 Öğretmen Paneli</button><button class="btn iki kucuk" data-a="surum">📦 Sürüm v'+APP.surum+' · Güncellemeleri Denetle</button>'
    +'<h3>Bu cihaz</h3><p style="font-size:14px">İlerleme yalnız bu cihazın tarayıcısında saklanır. Öğrenci adı, sınıfı ve giriş saati öğretmen panelinde görünür; başka kişisel veri toplanmaz.</p><button class="btn gri kucuk" data-a="sifirla">🧹 Bu cihazdaki oyun ilerlemesini sıfırla</button>'
    +'<button class="btn" data-k>Tamam</button>');
  o.querySelector('[data-k]').onclick = function(){ kapat(o); };
  o.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('button') : null; if(!b) return;
    var s = b.parentNode && b.parentNode.dataset ? b.parentNode.dataset.seg : null;
    if(s){
      Array.prototype.forEach.call(b.parentNode.children, function(x){ x.classList.toggle('sec', x === b); });
      if(s==='ses') ls('oc_ses', b.dataset.v);
      if(s==='ekran') window.ZIRVE_ekranMod.ayarla(b.dataset.v);
      if(s==='cocuk'){ ls('zirve_cocuk_boyu', b.dataset.v); PARAM.delete('cocuk'); cocukUygula(); }
      OC.ses('tik'); return;
    }
    var a = b.dataset.a;
    if(a==='sinif'){ kapat(o); sinifAc(); } else if(a==='nasil'){ kapat(o); karsilamaAc(false); } else if(a==='qr'){ kapat(o); qrAc(); }
    else if(a==='yukle'){ kapat(o); pwaYukle(); } else if(a==='panel'){ kapat(o); window.ZGIRIS.panelAc(); } else if(a==='surum'){ kapat(o); surumAc(); }
    else if(a==='sifirla'){
      if(b.dataset.onay !== '1'){ b.dataset.onay = '1'; b.textContent = '⚠️ Emin misin? Tekrar dokun: yıldızlar ve bölümler silinir'; return; }
      try{ Object.keys(localStorage).forEach(function(k){ if(k.indexOf('oc_kayit_') === 0 || k === 'oc_yildiz') localStorage.removeItem(k); }); }catch(err){}
      OC.toast('İlerleme sıfırlandı'); kapat(o); menuCiz();
    }
  });
}

ekranUygula(); cocukUygula(); initPWA(); menuCiz();
window.OYUN_CEBI = { APP:APP, modulKontrol:modulKontrol, oyunAc:function(id){ var o = OC.oyunlar.filter(function(x){ return x.id === id; })[0]; if(o) oyunAc(o); }, kapat:function(){ oyunKapat(false); } };
window.ZGIRIS.baslat({oyun:'Oyun Cebi', renk:'#f97316'}).then(function(o){
  ogrenci = o; sinifVarsayilan(); menuCiz(); surumBant(); surumBaslat();
  if(ls('oc_karsilama_goruldu') !== '1') karsilamaAc(true);

})();
