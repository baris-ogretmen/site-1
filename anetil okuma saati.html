<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Okuma Saati — Ses Temelli İlk Okuma Yazma</title>
<meta name="description" content="A-N-E-T-İ-L sırasıyla, saat kadranında okuyarak erken okuma-yazma sistemi.">
<meta name="theme-color" content="#2a1c12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --krem:#fbf6ee; --kart:#ffffff; --murekkep:#2b2118; --soluk:#7b6a5a; --cizgi:#eadfce;
  --altin:#e9b44c; --altin2:#f7d488; --koyu:#2a1c12; --yesil:#2f9e6f; --kirmizi:#d9534f;
  --mavi:#2f6fd0; --mor:#7a4fd0; --hece1:#d6452f; --hece2:#2f6fd0;
  --golge:0 10px 30px rgba(60,35,10,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--krem);color:var(--murekkep);font-family:Nunito,system-ui,sans-serif;min-height:100%}
body{overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:inherit}
.harfyazi{font-family:Andika,Nunito,sans-serif}
.gizli{display:none!important}
.ekran{min-height:100vh;min-height:100dvh}

/* ---------- Ortak ---------- */
.btn{border-radius:16px;padding:12px 18px;font-weight:800;font-size:16px;background:var(--koyu);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .1s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.altin{background:linear-gradient(180deg,#f3c35e,#d99a2b);color:#2a1c12}
.btn.yesil{background:var(--yesil)}
.btn.acik{background:#fff;color:var(--murekkep);border:2px solid var(--cizgi);box-shadow:none}
.btn.kucuk{padding:8px 12px;font-size:14px;border-radius:12px}
.ikonbtn{width:44px;height:44px;border-radius:14px;background:#fff;border:2px solid var(--cizgi);font-size:20px;display:inline-flex;align-items:center;justify-content:center}
.kart{background:var(--kart);border-radius:22px;box-shadow:var(--golge);padding:18px}
.ust{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(251,246,238,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--cizgi)}
.ust h1{font-size:19px;margin:0;flex:1;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kap{max-width:1000px;margin:0 auto;padding:16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--koyu);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:9999;box-shadow:var(--golge);max-width:90vw;text-align:center;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.modal-arka{position:fixed;inset:0;background:rgba(30,20,10,.55);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:24px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{margin:0 0 10px;font-size:22px}
.etiket{font-size:13px;font-weight:800;color:var(--soluk);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px}
.satir{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.girdi{width:100%;padding:13px 14px;border-radius:14px;border:2px solid var(--cizgi);font-size:17px;background:#fff;color:var(--murekkep)}
.girdi:focus{outline:none;border-color:var(--altin)}
.secim{display:flex;gap:6px;flex-wrap:wrap}
.secim button{padding:9px 13px;border-radius:12px;background:#fff;border:2px solid var(--cizgi);font-weight:800;font-size:14px;color:var(--murekkep)}
.secim button.aktif{background:var(--koyu);color:#fff;border-color:var(--koyu)}
.not{font-size:14px;color:var(--soluk);line-height:1.5}

/* ---------- Giriş ---------- */
#scrGiris{background:radial-gradient(ellipse at 50% 0%,#5a3b22 0%,#2a1c12 60%,#1a110a 100%);color:#fff;display:flex;align-items:center;justify-content:center;padding:20px}
.giris-kutu{width:100%;max-width:440px;text-align:center}
.logo-saat{width:150px;height:150px;margin:0 auto 10px;position:relative}
.giris-kutu h1{font-size:34px;margin:6px 0 2px;font-weight:900;letter-spacing:.01em}
.giris-kutu h1 span{color:var(--altin)}
.giris-kutu p.alt{margin:0 0 20px;opacity:.8;font-size:15px}
.giris-form{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:18px;text-align:left;backdrop-filter:blur(6px)}
.giris-form .girdi{background:rgba(255,255,255,.95)}
.giris-form label{font-weight:800;font-size:14px;opacity:.9;display:block;margin:10px 0 6px}
.son-ogr{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.son-ogr button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px}
.giris-alt{margin-top:16px;display:flex;justify-content:center;gap:10px}
.giris-alt button{background:transparent;color:rgba(255,255,255,.7);font-weight:700;font-size:14px;padding:8px}

/* ---------- Harita ---------- */
.ogr-bilgi{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.avatar{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#f3c35e,#d98a2b);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#2a1c12}
.ilerleme-cubuk{height:12px;border-radius:99px;background:#efe5d6;overflow:hidden;margin-top:6px}
.ilerleme-cubuk i{display:block;height:100%;background:linear-gradient(90deg,#f3c35e,#2f9e6f);border-radius:99px;transition:width .6s}
.grup{margin:18px 0}
.grup-bas{display:flex;align-items:baseline;gap:10px;margin:0 4px 10px}
.grup-bas b{font-size:17px;font-weight:900}
.grup-bas span{font-size:13px;color:var(--soluk);font-weight:700;letter-spacing:.1em}
.harfler{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.harf-kart{position:relative;background:#fff;border-radius:22px;padding:12px 6px 10px;box-shadow:var(--golge);text-align:center;border:3px solid transparent;transition:transform .15s}
.harf-kart:active{transform:scale(.96)}
.harf-kart .h{font-family:Andika,sans-serif;font-size:42px;line-height:1.1;font-weight:700}
.harf-kart .yildiz{font-size:12px;letter-spacing:1px;margin-top:4px;min-height:16px}
.harf-kart.tamam{border-color:var(--yesil)}
.harf-kart.sirada{border-color:var(--altin);animation:nabiz 1.8s infinite}
.harf-kart.kilit{opacity:.45}
.harf-kart .no{position:absolute;top:6px;left:9px;font-size:11px;font-weight:800;color:var(--soluk)}
@keyframes nabiz{0%,100%{box-shadow:0 0 0 0 rgba(233,180,76,.5)}50%{box-shadow:0 0 0 10px rgba(233,180,76,0)}}

/* ---------- Ders ---------- */
.sekmeler{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;scrollbar-width:none;background:var(--krem);position:sticky;top:69px;z-index:15}
.sekmeler::-webkit-scrollbar{display:none}
.sekme{flex:0 0 auto;padding:10px 14px;border-radius:14px;background:#fff;border:2px solid var(--cizgi);font-weight:800;font-size:14px;color:var(--murekkep);display:flex;align-items:center;gap:6px}
.sekme.aktif{background:var(--koyu);color:#fff;border-color:var(--koyu)}
.sekme .ok{color:var(--yesil);font-size:13px}
.sekme.aktif .ok{color:#8ff0c4}
.baslik-harf{font-family:Andika,sans-serif;font-weight:700}

/* Ses */
.ses-sahne{text-align:center}
.ses-emoji{font-size:96px;line-height:1;margin:6px 0;animation:salla 3s ease-in-out infinite}
@keyframes salla{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.dev-harf{font-family:Andika,sans-serif;font-size:min(34vw,170px);line-height:1;font-weight:700;display:flex;justify-content:center;gap:.25em}
.dev-harf span:first-child{color:var(--hece1)}
.dev-harf span:last-child{color:var(--hece2)}
.oyku{font-size:20px;line-height:1.5;max-width:560px;margin:10px auto;font-weight:700}
.oyku b{color:var(--hece1);font-family:Andika,sans-serif;font-size:26px}
.ipucu{display:inline-flex;gap:8px;align-items:center;background:#fff6e2;border:2px dashed var(--altin);border-radius:14px;padding:10px 14px;font-weight:700;color:#7a5410;margin:6px}
.buyuk-btnlar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.buyuk-btnlar .btn{font-size:18px;padding:16px 22px}
.dalga{display:flex;gap:4px;justify-content:center;height:40px;align-items:center;margin:6px}
.dalga i{width:6px;border-radius:4px;background:var(--altin);height:8px}
.dalga.aktif i{animation:dalga .9s ease-in-out infinite}
.dalga i:nth-child(2){animation-delay:.1s}.dalga i:nth-child(3){animation-delay:.2s}.dalga i:nth-child(4){animation-delay:.3s}.dalga i:nth-child(5){animation-delay:.4s}
@keyframes dalga{0%,100%{height:8px}50%{height:36px}}

/* Yaz */
.yaz-alan{display:flex;flex-direction:column;align-items:center;gap:12px}
.yaz-cerceve{position:relative;width:min(92vw,440px);aspect-ratio:1/1;background:#fff;border-radius:24px;box-shadow:var(--golge);overflow:hidden;touch-action:none}
.yaz-cerceve canvas{position:absolute;inset:0;width:100%;height:100%}
.yaz-sonuc{font-weight:900;font-size:20px;min-height:28px}
.renkler{display:flex;gap:8px}
.renkler button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--cizgi)}
.renkler button.aktif{box-shadow:0 0 0 3px var(--koyu)}

/* ---------- SAAT ---------- */
.saat-dis{position:relative;border-radius:28px;overflow:hidden;margin:0 auto;max-width:760px;
  background:
   radial-gradient(circle at 20% 15%,rgba(255,214,150,.35),transparent 35%),
   radial-gradient(circle at 85% 30%,rgba(120,200,160,.25),transparent 30%),
   radial-gradient(circle at 50% 110%,rgba(30,90,60,.55),transparent 55%),
   linear-gradient(180deg,#8a6240 0%,#5b3e27 40%,#3a2717 100%);
  box-shadow:0 20px 50px rgba(40,20,5,.35)}
.saat-dis::before{content:"";position:absolute;inset:0;background:
   repeating-linear-gradient(90deg,rgba(255,230,190,.10) 0 38px,transparent 38px 120px);
   filter:blur(10px);pointer-events:none}
.bokeh{position:absolute;border-radius:50%;background:rgba(255,220,160,.25);filter:blur(6px);pointer-events:none;animation:suz 9s ease-in-out infinite}
@keyframes suz{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.saat-sahne{--S:min(94vw,68vh,640px);position:relative;width:var(--S);aspect-ratio:1/1;margin:0 auto}
.saat-sahne svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ibre{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:99px;transition:transform .9s cubic-bezier(.5,1.6,.45,1);pointer-events:none}
.ibre.yelkovan{width:1.1%;height:27%;background:linear-gradient(180deg,#fff,#f4efe6);box-shadow:0 0 6px rgba(0,0,0,.4)}
.ibre.akrep{width:1.6%;height:14%;background:linear-gradient(180deg,#ffe29a,#d7a23a);box-shadow:0 0 6px rgba(0,0,0,.4)}
.ibre.yelkovan::after{content:"";position:absolute;left:50%;top:-1%;width:240%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:#fff}
.merkez-nokta{position:absolute;left:50%;top:50%;width:3.6%;aspect-ratio:1;border-radius:50%;background:#fff;border:3px solid #d7a23a;transform:translate(-50%,-50%);z-index:4}
.merkez-harf{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:Andika,sans-serif;font-weight:700;color:rgba(255,236,190,.22);font-size:calc(var(--S)*.17);line-height:1;pointer-events:none;transition:all .5s}
.merkez-harf.birlesim{z-index:5;width:calc(var(--S)*.29);height:calc(var(--S)*.29);border-radius:50%;background:radial-gradient(circle,rgba(50,30,12,.92),rgba(50,30,12,.75));display:flex;align-items:center;justify-content:center;color:#ffe7a8;font-size:calc(var(--S)*.1);text-shadow:0 0 22px rgba(255,190,70,.9);white-space:nowrap}
.merkez-harf.birlesim span{display:inline-block;margin:0 .45em;transition:margin .55s cubic-bezier(.5,1.6,.45,1)}
.merkez-harf.birlesim span.u{color:#ffc2b5}.merkez-harf.birlesim span.s{color:#bcd6ff}
.merkez-harf.birles span{margin:0}
.merkez-harf.birles span.u,.merkez-harf.birles span.s{color:#ffd77a}
.tam-bar{display:none}
.saat-dis.tam{position:fixed;inset:0;z-index:450;max-width:none;border-radius:0;display:flex;flex-direction:column;justify-content:center}
.saat-dis.tam .saat-sahne{--S:min(96vw,76vh)}
.saat-dis.tam .tam-bar{display:flex;position:absolute;right:14px;bottom:14px;gap:8px;z-index:8}
.tam-bar button{width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.45);color:#ffd77a;font-size:22px;border:1px solid rgba(255,215,122,.5)}
.det-kutular{display:flex;gap:10px;justify-content:center;margin:18px 0}
.det-kutular button{width:min(28vw,130px);aspect-ratio:1;border-radius:22px;background:#fff;box-shadow:var(--golge);border:4px solid var(--cizgi);font-weight:900;font-size:16px;color:var(--murekkep);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.det-kutular button i{font-style:normal;font-size:clamp(14px,4.4vw,24px);white-space:nowrap}
.det-kutular button.dogru{border-color:var(--yesil);background:#eafaf2;animation:zipla .5s}
.det-kutular button.yanlis{border-color:var(--kirmizi);animation:titre .4s}
.det-kelime{font-family:Andika,sans-serif;font-weight:700;font-size:clamp(40px,11vw,70px);text-align:center;letter-spacing:.06em}
.det-kelime .gz{color:var(--hece1);text-decoration:underline 4px var(--altin);text-underline-offset:8px}
.karne{background:#fff;border-radius:16px;box-shadow:var(--golge);padding:22px;max-width:780px;margin:0 auto}
.karne-bas{text-align:center;border-bottom:3px double #c9a24a;padding-bottom:10px;margin-bottom:14px}
.karne-bas h2{margin:4px 0;font-size:26px}
.karne-ozet{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.karne-ozet div{background:#fbf6ee;border-radius:14px;padding:10px;text-align:center;font-weight:800;font-size:13px;color:var(--soluk)}
.karne-ozet b{display:block;font-size:26px;color:var(--murekkep)}
.karne-harfler{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
.karne-harfler div{border:2px solid var(--cizgi);border-radius:12px;text-align:center;padding:4px 2px}
.karne-harfler div.t{border-color:var(--yesil);background:#f0faf5}
.karne-harfler div.y{border-color:var(--altin);background:#fff8e8}
.karne-harfler b{font-family:Andika,sans-serif;font-size:22px;display:block}
.karne-harfler small{font-size:10px;letter-spacing:-1px;color:#d99a2b}
@media print{ .karne{box-shadow:none;max-width:none} }
.merkez-harf.parla{color:#ffe7a8;text-shadow:0 0 30px rgba(255,200,90,.9);transform:translate(-50%,-50%) scale(1.15)}
.yuva{position:absolute;transform:translate(-50%,-50%) scale(.6);font-family:Andika,sans-serif;font-weight:700;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.65);opacity:0;transition:opacity .45s,transform .45s,color .45s;white-space:nowrap;cursor:pointer;padding:2px 6px;border-radius:10px;pointer-events:auto;line-height:1.1}
.yuva.gorun{opacity:1;transform:translate(-50%,-50%) scale(1)}
.yuva.simdi{color:#ffd77a;transform:translate(-50%,-50%) scale(1.28);text-shadow:0 0 18px rgba(255,190,70,.95),0 2px 6px rgba(0,0,0,.6)}
.yuva.hece{font-size:calc(var(--S)*.052)}
.yuva.kelime{font-size:calc(var(--S)*.043)}
.yuva .h1{color:#ffb3a3}.yuva .h2{color:#a9cbff}
.yuva.simdi .h1,.yuva.simdi .h2{color:#ffd77a}
.cumle-alan{position:relative;padding:4px 16px 18px;text-align:center;min-height:60px}
.cumle{font-family:Andika,sans-serif;font-weight:700;color:rgba(255,255,255,.75);font-size:clamp(20px,4.6vw,32px);margin:6px 0;opacity:0;transform:translateY(8px);transition:all .5s;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.cumle.gorun{opacity:1;transform:none}
.cumle.simdi{color:#ffd77a;text-shadow:0 0 16px rgba(255,190,70,.8),0 2px 6px rgba(0,0,0,.5)}
.cumle .k{display:inline-block;margin:0 .14em;transition:color .2s}
.cumle .k.on{color:#fff;text-decoration:underline 3px #ffd77a;text-underline-offset:6px}
.saat-bilgi{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;z-index:5;pointer-events:none}
.faz-etiket{background:rgba(0,0,0,.35);color:#ffe7a8;font-weight:800;font-size:13px;border-radius:999px;padding:6px 12px;letter-spacing:.04em;border:1px solid rgba(255,220,150,.35)}
.saat-kontrol{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:14px auto 0;max-width:760px}
.saat-kontrol .btn{padding:12px 16px}
.oynat-btn{width:64px;height:64px;border-radius:50%!important;font-size:26px;padding:0!important}

/* Oyunlar */
.oyun-kartlar{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.oyun-kart{background:#fff;border-radius:22px;padding:18px;box-shadow:var(--golge);text-align:left;display:flex;gap:14px;align-items:center;border:3px solid transparent}
.oyun-kart .ik{font-size:44px}
.oyun-kart b{font-size:18px;display:block}
.oyun-kart small{color:var(--soluk);font-weight:700;font-size:13px;line-height:1.35;display:block;margin-top:2px}
.oyun-kart.bitti{border-color:var(--yesil)}
.oyun-ust{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.oyun-ust .tur{margin-left:auto;font-weight:900;color:var(--soluk)}
.soru-baslik{text-align:center;font-size:22px;font-weight:900;margin:6px 0 14px}
.soru-baslik .harfyazi{color:var(--hece1);font-size:32px}
.secenekler{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:520px;margin:0 auto}
.secenek{background:#fff;border-radius:24px;padding:18px 8px;box-shadow:var(--golge);font-size:64px;border:4px solid transparent;transition:transform .15s}
.secenek small{display:block;font-size:20px;font-family:Andika,sans-serif;font-weight:700;color:var(--murekkep);min-height:26px}
.secenek.dogru{border-color:var(--yesil);background:#eafaf2;animation:zipla .5s}
.secenek.yanlis{border-color:var(--kirmizi);animation:titre .4s}
@keyframes zipla{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes titre{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.mini-saat{position:relative;width:min(90vw,420px);aspect-ratio:1;margin:0 auto;border-radius:50%;background:radial-gradient(circle,#5b3e27 0%,#3a2717 70%);box-shadow:0 0 0 8px #f3e6d0,0 0 0 10px #d7a23a,var(--golge)}
.mini-saat .ibre.yelkovan{height:30%}
.mini-hece{position:absolute;transform:translate(-50%,-50%);background:#fff;color:var(--murekkep);font-family:Andika,sans-serif;font-weight:700;font-size:clamp(20px,5.5vw,30px);padding:6px 12px;border-radius:14px;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:all .3s}
.mini-hece.alindi{opacity:.25;transform:translate(-50%,-50%) scale(.8)}
.mini-hece.yanlis{animation:titre .4s;background:#ffd9d6}
.hedef-kelime{display:flex;gap:8px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.hedef-kelime span{min-width:70px;padding:8px 12px;border-bottom:4px solid var(--altin);font-family:Andika,sans-serif;font-weight:700;font-size:34px;text-align:center;min-height:56px}
.harf-tas{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0}

/* Türkçe heceleme: VCV → V-CV, VCCV → VC-CV */
function hecele(w){
  const s = kucuk(w); const idx=[];
  for(let i=0;i<s.length;i++) if(SESLI.includes(s[i])) idx.push(i);
  if(idx.length<=1) return [w];
  const kes=[0];
  for(let k=0;k<idx.length-1;k++){ const a=idx[k], b=idx[k+1]; kes.push(b-a-1<=0 ? b : b-1); }
  kes.push(w.length);
  const out=[]; for(let i=0;i<kes.length-1;i++) out.push(w.slice(kes[i],kes[i+1]));
  return out;
}

/* Hece üretimi: yeni harf + bilinen sesler */
function heceler(h){
  const bil = bilinenler(h); const V = bil.filter(c=>SESLI.includes(c)); const C = bil.filter(c=>!SESLI.includes(c));
  const set = new Set(); const ekle = x => { if(!x.startsWith('ğ')) set.add(x); };
  if(SESLI.includes(h)){
    ekle(h);
    C.forEach(c=>{ ekle(c+h); ekle(h+c); });
    C.forEach(c=>C.forEach(d=>{ if(set.size<16) ekle(c+h+d); }));
  } else {
    V.forEach(v=>ekle(h+v)); V.forEach(v=>ekle(v+h));
    V.forEach(v=>C.forEach(c=>{ if(c!==h){ ekle(h+v+c); ekle(c+v+h); } }));
    if(C.length===1) V.forEach(v=>ekle(h+v+h));
  }
  let a=[...set];
  if(a.length<3){ a = [h, buyuk(h), h+h].filter(x=>!x.startsWith('ğ') || x===h); }
  return a.slice(0,12);
}

}

/* --- PCM → WAV --- */
function pcmWav(b64, rate=24000){
  const bin=atob(b64); const len=bin.length; const buf=new ArrayBuffer(44+len); const v=new DataView(buf);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF');v.setUint32(4,36+len,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,len,true);
  const u8=new Uint8Array(buf,44); for(let i=0;i<len;i++) u8[i]=bin.charCodeAt(i);
  return new Blob([buf],{type:'audio/wav'});
}

  return `Birinci sınıf öğrencilerine okuyan sıcak bir erkek öğretmen gibi, yavaş ve anlaşılır oku. Sadece şunu söyle: "${metin}"`;
}
let TTS_MODEL = oku('os_tts_model', null);
async function geminiSesUret(metin, tur){
  const keys = anahtarlar(); if(!keys.length) return null;
  const modeller = [TTS_MODEL, 'gemini-2.5-flash-preview-tts', 'gemini-2.5-pro-preview-tts'].filter(Boolean);
  for(const m of [...new Set(modeller)]){
    for(const k of keys){
      if(keySaglik(k)==='gecersiz') continue;
      try{
        const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(k)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:ttsMetni(metin,tur)}]}],generationConfig:{responseModalities:['AUDIO'],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:AYAR.geminiSes}}}}})});
        if(r.status===429){ keySaglikYaz(k,'kota'); continue; }
        if(r.status===400||r.status===403){ const t=await r.text(); if(/API key|PERMISSION|invalid/i.test(t)) keySaglikYaz(k,'gecersiz'); continue; }
        if(r.status===404) break;
        if(!r.ok) continue;
        const j = await r.json(); const p = j?.candidates?.[0]?.content?.parts?.find(x=>x.inlineData);
        if(!p) continue;
        const rate = +(/rate=(\d+)/.exec(p.inlineData.mimeType||'')||[])[1] || 24000;
        const blob = pcmWav(p.inlineData.data, rate);
        keySaglikYaz(k,'ok'); if(TTS_MODEL!==m){ TTS_MODEL=m; yaz('os_tts_model',m); }
        await IDB.set(geminiSesKey(metin,tur), blob);
        return blob;
      }catch(e){ continue; }
    }
  }
  return null;
}

function keySaglikYaz(k,d){ const s=oku('zirve_keysaglik',{}); s[k]=d; yaz('zirve_keysaglik',s); }
async function anahtarTest(k){
  try{ const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(k)}`);
    if(r.ok){ keySaglikYaz(k,'ok'); const j=await r.json(); const tts=(j.models||[]).map(m=>m.name.replace('models/','')).filter(n=>/tts/.test(n)); const iyi=tts.find(n=>/2\.5-flash/.test(n))||tts[0]; if(iyi){TTS_MODEL=iyi; yaz('os_tts_model',iyi);} return 'ok'; }
    if(r.status===429){ keySaglikYaz(k,'kota'); return 'kota'; }
    keySaglikYaz(k,'gecersiz'); return 'gecersiz';
  }catch(e){ return 'ag'; }
}
const MODEL_SIRA = ['gemini-2.5-flash','gemini-2.5-flash-lite','gemini-2.0-flash','gemini-flash-latest'];
async function geminiMetin(prompt){
  const keys = anahtarlar(); if(!keys.length) throw new Error('Önce Ayarlar’dan bir Gemini anahtarı ekleyin.');
  let son='';
  for(const m of MODEL_SIRA){ for(const k of keys){
    if(keySaglik(k)==='gecersiz') continue;
    try{
      const body={contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:.9}};
      if(/2\.5/.test(m)) body.generationConfig.thinkingConfig={thinkingBudget:0};
      let r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(k)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(r.status===400){ delete body.generationConfig.thinkingConfig; r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(k)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }
      if(r.status===429){ keySaglikYaz(k,'kota'); son='Kota doldu (429) — sıradaki anahtar deneniyor.'; continue; }
      if(r.status===404){ son='Model bulunamadı (404).'; break; }
      if(r.status===403){ keySaglikYaz(k,'gecersiz'); son='Anahtar geçersiz veya yetkisiz (403).'; continue; }
      if(r.status===503){ son='Google sunucusu yoğun (503).'; continue; }
      if(!r.ok){ son='Hata '+r.status; continue; }
      const j=await r.json(); keySaglikYaz(k,'ok');
      return (j?.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
    }catch(e){ son='İnternet bağlantısı yok gibi görünüyor.'; }
  }}
  throw new Error(son||'Yapay zekâya ulaşılamadı.');
}

function scriptYukle(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function bulutHazir(){
  if(!FIREBASE_CONFIG) return null; if(FS) return FS;

function yazSekme(c){
  const h=HARF; let hal='kucuk', renk='#2f6fd0';
  c.innerHTML = `<div class="yaz-alan">
    <div class="secim" id="yazHal"><button data-v="kucuk" class="aktif">Küçük ${h}</button><button data-v="buyuk">Büyük ${buyuk(h)}</button><button data-v="hece">Hece</button></div>

    <div class="renkler" id="renkler">${['#2f6fd0','#d6452f','#2f9e6f','#7a4fd0','#2b2118'].map((r,i)=>`<button style="background:${r}" data-r="${r}" class="${i?'':'aktif'}"></button>`).join('')}</div>

    </div>
    <p class="not" style="text-align:center;max-width:460px">Dik temel harf. Önce yukarıdan aşağıya, sonra yuvarlak; parmak ucu kâğıttan kalkmadan. Yeşil nokta başlangıç yeridir.</p>
  </div>`;
  const cer=$('#yazCer'), rb=$('#cvRehber'), cz=$('#cvCiz');
  let W=0, basari=0, hece='';
  function boyut(){ const r=cer.getBoundingClientRect(); if(!r.width) return; const d=devicePixelRatio||1; [rb,cz].forEach(cv=>{ cv.width=r.width*d; cv.height=r.height*d; }); W=r.width; rehber(); }
  function metin(){ if(hal==='buyuk') return buyuk(h); if(hal==='hece') return hece; return h; }
  function fontAyar(ctx, t){ const d=devicePixelRatio||1; let fs = W*(t.length>1?.62/Math.max(1,t.length*.62):.72); fs=Math.min(fs,W*.72); ctx.font=`700 ${fs*d}px Andika, sans-serif`; ctx.textAlign='center'; ctx.textBaseline='alphabetic'; return fs*d; }
  function rehber(){
    const ctx=rb.getContext('2d'), d=devicePixelRatio||1, w=rb.width, hh=rb.height; ctx.clearRect(0,0,w,hh);
    const taban=hh*.72, ust=hh*.22, orta=hh*.47;
    ctx.strokeStyle='#e6d9c4'; ctx.lineWidth=2*d; [ust,orta,taban].forEach((y,i)=>{ ctx.setLineDash(i===1?[8*d,8*d]:[]); ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); });
    ctx.setLineDash([]); ctx.strokeStyle='#f2a7a0'; ctx.beginPath(); ctx.moveTo(0,hh*.86); ctx.lineTo(w,hh*.86); ctx.stroke();
    const t=metin(); fontAyar(ctx,t);
    ctx.fillStyle='#f1ece4'; ctx.fillText(t,w/2,taban);
    ctx.setLineDash([3*d,7*d]); ctx.lineCap='round'; ctx.strokeStyle='#b9a68a'; ctx.lineWidth=3*d; ctx.strokeText(t,w/2,taban); ctx.setLineDash([]);
    // başlangıç noktası: harfin en üst sol pikseli
    const img=ctx.getImageData(0,0,w,hh).data; let bul=null;
    outer: for(let y=0;y<hh;y+=2*d){ for(let x=0;x<w;x+=2*d){ const i=(Math.floor(y)*w+Math.floor(x))*4; if(img[i]<200 && img[i+3]>0){ bul=[x,y]; break outer; } } }
    if(bul){ ctx.fillStyle='#2f9e6f'; ctx.beginPath(); ctx.arc(bul[0],bul[1]+4*d,9*d,0,7); ctx.fill(); }
  }
  const czx=cz.getContext('2d'); let ciz=false, son=null;
  function nokta(e){ const r=cz.getBoundingClientRect(), d=devicePixelRatio||1; return [(e.clientX-r.left)*d,(e.clientY-r.top)*d]; }
  cz.addEventListener('pointerdown',e=>{ ciz=true; son=nokta(e); cz.setPointerCapture(e.pointerId); });
  cz.addEventListener('pointermove',e=>{ if(!ciz) return; const p=nokta(e), d=devicePixelRatio||1; czx.strokeStyle=renk; czx.lineWidth=W*.055*d; czx.lineCap='round'; czx.lineJoin='round'; czx.beginPath(); czx.moveTo(...son); czx.lineTo(...p); czx.stroke(); son=p; });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>cz.addEventListener(ev,()=>ciz=false));
  function kontrol(){
    const d=devicePixelRatio||1, w=cz.width, hh=cz.height, t=metin();
    const off=document.createElement('canvas'); off.width=w; off.height=hh; const o=off.getContext('2d'); fontAyar(o,t); o.fillStyle='#000'; o.fillText(t,w/2,hh*.72);
    const gen=document.createElement('canvas'); gen.width=w; gen.height=hh; const g=gen.getContext('2d'); fontAyar(g,t); g.lineWidth=W*.09*d; g.lineJoin='round'; g.strokeStyle='#000'; g.fillStyle='#000'; g.fillText(t,w/2,hh*.72); g.strokeText(t,w/2,hh*.72);
    const L=o.getImageData(0,0,w,hh).data, G=g.getImageData(0,0,w,hh).data, U=czx.getImageData(0,0,w,hh).data;
    let harfPx=0, kapsanan=0, kullPx=0, disari=0; const adim=3;
    for(let y=0;y<hh;y+=adim) for(let x=0;x<w;x+=adim){ const i=(y*w+x)*4; const l=L[i+3]>128, u=U[i+3]>40, gg=G[i+3]>128; if(l){harfPx++; if(u) kapsanan++;} if(u){kullPx++; if(!gg) disari++;} }
    const kap = harfPx? kapsanan/harfPx : 0, dis = kullPx? disari/kullPx : 1;
    return {kap, dis};
  }
  $('#yazKontrol').onclick=()=>{ const {kap,dis}=kontrol(); const s=$('#yazSonuc');
    if(kap>.55 && dis<.35){ basari++; s.innerHTML=`🌟 Harika! %${Math.round(kap*100)} üzerinden geçtin.`; s.style.color='var(--yesil)'; zil(); if(basari>=2 || hal!=='kucuk') adimTamam(h,'yaz'); else s.innerHTML+=' Bir kez daha yaz, yıldızı kap!'; setTimeout(()=>czx.clearRect(0,0,cz.width,cz.height),1200); }
    else if(kap<=.55){ s.innerHTML=`Biraz daha! Noktalı yolun %${Math.round(kap*100)} kadarını yazdın. Tüm çizgilerin üstünden geç.`; s.style.color='#b7791f'; }
    else { s.innerHTML='Çizgilerin dışına taştık 🙂 Noktalı yolun üstünde kalmaya çalış.'; s.style.color='#b7791f'; }
  };

/* Kulak Dedektifi — sesin kelimedeki yeri (başta / ortada / sonda) */
function sesYeri(w,h){ const k=kucuk(w); const i=k.indexOf(h); if(i<0 || k.indexOf(h,i+1)>=0) return null; return i===0?'bas':(i===k.length-1?'son':'orta'); }
function oyunDed(c,o){
  const h=HARF;
  const resimli = Object.values(RESIM).flat().filter(([,w])=>sesYeri(w,h)).map(([e,w])=>[e,w]);
  const okunur = kelimeler(h).filter(w=>sesYeri(w,h) && w.length>=2).map(w=>[RESIM_KELIME[w]||'',w]);
  let havuz=[]; const gor=new Set(); [...okunur,...resimli].forEach(x=>{ if(!gor.has(x[1])){ gor.add(x[1]); havuz.push(x); } });
  // her yerden örnek olsun
  const gruplu={bas:[],orta:[],son:[]}; havuz.forEach(x=>gruplu[sesYeri(x[1],h)].push(x));
  let sec=[]; for(let k=0;k<3;k++) ['bas','orta','son'].forEach(y=>{ const a=karistir(gruplu[y]); if(a[k]) sec.push(a[k]); });
  sec=karistir(sec).slice(0,6);
  if(sec.length<3){ c.innerHTML=oyunIskelet(o,0,0)+'<div class="kart"><p>Bu ses için yeterli kelime yok; birkaç ses sonra dedektiflik başlıyor! 🕵️</p></div>'; return; }
  const TUR=sec.length; let tur=0;
  c.innerHTML=oyunIskelet(o,1,TUR);
  function soru(){
    const [em,w]=sec[tur]; tur++; $('#oTur').textContent=`${tur}/${TUR}`; const yer=sesYeri(w,h);
    $('#oAlan').innerHTML=`<div class="soru-baslik"><span class="harfyazi">/${h}/</span> sesi nerede? <button class="btn kucuk acik" id="dDinle">🔊</button></div>
      ${em?`<div style="text-align:center;font-size:76px;line-height:1">${em}</div>`:''}
      <div class="det-kelime" id="dKel">${uygun(w,bilinenler(h))||!em?esc(w):'<span style="opacity:.35">? ? ?</span>'}</div>
      <div class="det-kutular">
        <button data-y="bas"><i>🟡⚪⚪</i>Başta</button>
        <button data-y="orta"><i>⚪🟡⚪</i>Ortada</button>
        <button data-y="son"><i>⚪⚪🟡</i>Sonda</button>
      </div>`;
    $('#dDinle').onclick=()=>konus(w,'kelime'); setTimeout(()=>konus(w,'kelime'),250);
    $$('.det-kutular button').forEach(b=>b.onclick=async()=>{
      if(b.dataset.y===yer){ b.classList.add('dogru'); zil(); $$('.det-kutular button').forEach(x=>x.disabled=true);
        const i=kucuk(w).indexOf(h); $('#dKel').innerHTML=esc(w.slice(0,i))+`<span class="gz">${esc(w[i])}</span>`+esc(w.slice(i+1));
        await konus(h,'ses'); await bekle(900); tur<TUR?soru():bitir(); }
      else { b.classList.add('yanlis'); setTimeout(()=>b.classList.remove('yanlis'),450); }
    });
  }
  function bitir(){ $('#oAlan').innerHTML=`<div class="kart" style="text-align:center"><div style="font-size:70px">🕵️</div><h2>Usta dedektif!</h2><p class="not">${TUR} kelimede sesin yerini buldun.</p></div>`; oyunBitti('ded'); }
  soru();
}

function akiciSekme(c){

  if(havuz.length<3){ const hs=heceler(h); havuz.push(...karistir(hs)); }

    <div class="akici-sayac"><span>⏱️ <span id="akSure">0</span> sn</span><span>✔ <span id="akD">0</span></span><span>✖ <span id="akY">0</span></span><span id="akKalan">${havuz.length} kelime</span></div>

      <button class="btn gizli" id="akYanlis" style="font-size:24px;min-width:110px;background:var(--kirmizi)">✖</button>
    </div></div>`;
  let i=0, d=0, y=0, t0=0, iv=null;
  function goster(){ const w=havuz[i]; $('#akKart').innerHTML = heceHTML(w) + (yeni.has(w)?'':''); $('#akKalan').textContent=`${havuz.length-i} kelime`; }
  function ileri(ok){ ok?d++:y++; $('#akD').textContent=d; $('#akY').textContent=y; i++; tik(); if(i>=havuz.length) bitir(); else goster(); }
  function bitir(){ clearInterval(iv); const sn=Math.max(1,(Date.now()-t0)/1000); const dk=Math.round(d/sn*60);
    $('#akKart').innerHTML=`<div style="font-family:Nunito;font-size:28px;line-height:1.4">🌟 ${d} doğru · ${y} tekrar<br><b style="font-size:44px;color:var(--yesil)">${dk} kelime/dk</b></div>`;
    $('#akDogru').classList.add('gizli'); $('#akYanlis').classList.add('gizli'); $('#akBasla').classList.remove('gizli'); $('#akBasla').textContent='↻ Yeniden';
    if(d>=Math.ceil(havuz.length*.6)){ const eski=ilerleme(h).akici; adimTamam(h,'akici',{dk:Math.max(dk,eski?.dk||0)}); }
    else toast('Biraz daha çalışalım, %60 doğru okuyunca yıldız geliyor 💪');
  }
  $('#akBasla').onclick=()=>{ i=0;d=0;y=0; $('#akD').textContent=0; $('#akY').textContent=0; t0=Date.now(); clearInterval(iv); iv=setInterval(()=>{ const e=$('#akSure'); if(!e){clearInterval(iv);return;} e.textContent=Math.round((Date.now()-t0)/1000); },500);
    $('#akBasla').classList.add('gizli'); $('#akDogru').classList.remove('gizli'); $('#akYanlis').classList.remove('gizli'); goster(); };
  $('#akDogru').onclick=()=>ileri(true); $('#akYanlis').onclick=()=>ileri(false);

    ${resimler.length?`<div class="yz-bolum">4) ${h==='ğ'?'İçinde':'Başında'} “${h}” sesi olan resimleri daire içine al.</div><div class="yz-resimler">${resimler.map(([e])=>`<span>${e}</span>`).join('')}</div>`:''}

        cevap.split(/\n+/).map(s=>s.replace(/^[\d\-\*\.\)\s]+/,'').trim()).filter(s=>s && uygun(s,bil) && icerir(s,h)).forEach(s=>{ if(!iyi.includes(s)) iyi.push(s); });

function yazdir(html){ const a=$('#yazdirAlan'); a.innerHTML=html; setTimeout(()=>{ window.print(); },250); }

/* ---------- Okuma Karnesi (veliye) ---------- */
function karneVeri(o){
  const s=siraListe(); const il=o.ilerleme||{};
  const yz=h=>PUAN_ADIMLARI.filter(a=>il[h]&&il[h][a]).length;
  const tamam=s.filter(h=>yz(h)>=4); const sir=s.find(h=>yz(h)<4);
  const ak=Math.max(0,...Object.values(il).map(p=>p.akici?.dk||0));
  const yildiz=s.reduce((t,h)=>t+yz(h),0);
  const grup=SIRALAR[AYAR.sira].gruplar.findIndex(g=>g.includes(sir||s[s.length-1]))+1;
  return {s,yz,tamam,sir,ak,yildiz,grup};
}
function karneHTML(o){
  const v=karneVeri(o); const tarih=new Date().toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'});
  const oran=v.tamam.length/v.s.length;
  const yorum = oran>=1 ? 'Tüm sesleri tamamladı; artık akıcı okuma ve anlama çalışmalarıyla devam ediyoruz. 🎓'
    : oran>=.6 ? 'Okumayı söktü sayılır! Heceleri birleştirerek kelime ve cümleleri okuyabiliyor. Her gün kısa metinlerle akıcılığı artıralım.'
    : oran>=.2 ? 'Sesleri birleştirmeye ve ilk kelimeleri okumaya başladı. Evde heceleri parmakla takip ederek okumak çok faydalı olur.'
    : 'Seslerle tanışma aşamasında. Harflerin adını değil sesini söyleyerek birlikte oyun oynayabilirsiniz.';
  return `<div class="karne yz-sayfa">
    <div class="karne-bas"><div style="font-size:44px">🕰️</div><h2>Okuma Saati Karnesi</h2><div class="not">${tarih}</div></div>
    <div class="satir" style="justify-content:space-between;font-weight:900;font-size:18px"><span>${esc(o.ad)}</span><span>${esc(o.sinif)}</span></div>
    <div class="karne-ozet">
      <div><b>${v.tamam.length}/${v.s.length}</b>öğrenilen ses</div>
      <div><b>${v.yildiz} ★</b>toplam yıldız</div>
      <div><b>${v.ak||'—'}</b>kelime/dakika</div>
      <div><b class="harfyazi">${v.sir?buyuk(v.sir)+v.sir:'🏁'}</b>şu anki ses (${v.grup}. grup)</div>
    </div>
    <div class="etiket">Ses ses ilerleme (${SIRALAR[AYAR.sira].ad})</div>
    <div class="karne-harfler">${v.s.map(h=>{ const y=v.yz(h); return `<div class="${y>=4?'t':(y?'y':'')}"><b>${buyuk(h)}${h}</b><small>${'★'.repeat(y)}${'☆'.repeat(5-y)}</small></div>`; }).join('')}</div>
    <div class="yz-not" style="margin-top:14px"><b>Öğretmen görüşü:</b> ${yorum}</div>
    <div class="satir" style="justify-content:space-between;margin-top:26px;font-size:13px;font-weight:800"><span>Öğretmen: ______________________</span><span>Veli: ______________________</span></div>
  </div>`;
}
function karneMetni(o){ const v=karneVeri(o); return `🕰️ *Okuma Saati Karnesi*\n👧 ${o.ad} · ${o.sinif}\n\n✅ Öğrenilen ses: *${v.tamam.length}/${v.s.length}*\n⭐ Toplam yıldız: *${v.yildiz}*\n⚡ Akıcılık: *${v.ak||0} kelime/dk*\n🔤 Şu an çalıştığı ses: *${v.sir?buyuk(v.sir)+v.sir:'hepsi tamam 🏁'}*\n\nÖğrendiği sesler: ${v.tamam.join(' ')}`; }
function karneAc(o){
  if(!o) return;
  const m=modal(`<div id="karneIc">${karneHTML(o)}</div><div class="satir" style="justify-content:center;margin-top:14px"><button class="btn altin" id="krYaz">🖨️ Yazdır / PDF</button><button class="btn yesil" id="krWa">📤 WhatsApp</button><button class="btn acik" id="krKop">📋 Kopyala</button><button class="btn acik" id="krKapat">Kapat</button></div>`);
  m.style.maxWidth='820px';
  $('#krYaz',m).onclick=()=>yazdir(karneHTML(o));
  $('#krWa',m).onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent(karneMetni(o)),'_blank');
  $('#krKop',m).onclick=()=>navigator.clipboard?.writeText(karneMetni(o).replace(/\*/g,'')).then(()=>toast('Kopyalandı ✔'));
  $('#krKapat',m).onclick=()=>m.parentElement.remove();
}

}

/* Tahta Stüdyosu (sınıf araçları) */
let TAHTA=null;
function tahtaAc(){
  if(TAHTA){ tahtaKapat(); return; }
  const kat=document.createElement('div'); kat.id='tahta'; kat.innerHTML='<canvas></canvas>'; document.body.appendChild(kat);
  const cv=kat.querySelector('canvas'), ctx=cv.getContext('2d'); const d=devicePixelRatio||1; cv.width=innerWidth*d; cv.height=innerHeight*d;
  const bar=document.createElement('div'); bar.className='tahta-bar';
  const araclar=[['kalem','🖍️'],['silgi','🧽'],['temizle','🗑️'],['spot','🔦'],['perde','🎭'],['serit','📏'],['damga','⭐'],['sayac','⏱️'],['aferin','🎉'],['kapat','✖']];
  bar.innerHTML=araclar.map(([k,i])=>`<button data-a="${k}" title="${k}">${i}</button>`).join(''); document.body.appendChild(bar);
  TAHTA={kat,bar,mod:null};
  let ciz=false, son=null;
  const nk=e=>[e.clientX*d,e.clientY*d];
  kat.addEventListener('pointerdown',e=>{ if(TAHTA.mod==='damga'){ const s=document.createElement('div'); s.className='damga'; s.textContent=karistir(['⭐','🌟','👍','💯','🏅'])[0]; s.style.left=e.clientX+'px'; s.style.top=e.clientY+'px'; document.body.appendChild(s); TAHTA.damgalar=(TAHTA.damgalar||[]).concat(s); return; } ciz=true; son=nk(e); });
  kat.addEventListener('pointermove',e=>{ if(!ciz) return; const p=nk(e); ctx.globalCompositeOperation = TAHTA.mod==='silgi'?'destination-out':'source-over'; ctx.strokeStyle='#e33'; ctx.lineWidth=(TAHTA.mod==='silgi'?40:6)*d; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(...son); ctx.lineTo(...p); ctx.stroke(); son=p; });
  addEventListener('pointerup',()=>ciz=false);
  const spotHareket=e=>{ const s=$('#spot'); if(s){ s.style.setProperty('--x',e.clientX+'px'); s.style.setProperty('--y',e.clientY+'px'); } };
  addEventListener('pointermove',spotHareket);
  bar.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const a=b.dataset.a;
    if(a==='kapat') return tahtaKapat();
    if(a==='temizle'){ ctx.clearRect(0,0,cv.width,cv.height); (TAHTA.damgalar||[]).forEach(x=>x.remove()); TAHTA.damgalar=[]; return; }
    if(a==='aferin') return aferin();
    if(a==='spot'){ const s=$('#spot'); if(s){ s.remove(); b.classList.remove('aktif'); } else { const n=document.createElement('div'); n.id='spot'; document.body.appendChild(n); b.classList.add('aktif'); } return; }
    if(a==='perde'){ const s=$('#perde'); if(s){ s.remove(); b.classList.remove('aktif'); } else { const n=document.createElement('div'); n.id='perde'; document.body.appendChild(n); b.classList.add('aktif'); let surukle=false; n.onpointerdown=e=>{surukle=true;n.setPointerCapture(e.pointerId);}; n.onpointermove=e=>{ if(surukle) n.style.height=Math.max(40,e.clientY)+'px'; }; n.onpointerup=()=>surukle=false; } return; }
    if(a==='serit'){ const s=$('#serit'); if(s){ s.remove(); b.classList.remove('aktif'); } else { const n=document.createElement('div'); n.id='serit'; document.body.appendChild(n); b.classList.add('aktif'); const mv=e=>{ if(!$('#serit')){ removeEventListener('pointermove',mv); return; } n.style.top=(e.clientY-45)+'px'; }; addEventListener('pointermove',mv); } return; }
    if(a==='sayac'){ const s=$('#sayac'); if(s){ clearInterval(s._t); s.remove(); b.classList.remove('aktif'); return; } const dk=+prompt('Kaç dakika?','3'); if(!dk) return; let kal=dk*60; const n=document.createElement('div'); n.id='sayac'; document.body.appendChild(n); b.classList.add('aktif'); const yz=()=>n.textContent=`${Math.floor(kal/60)}:${String(kal%60).padStart(2,'0')}`; yz(); n._t=setInterval(()=>{ kal--; yz(); if(kal<=0){ clearInterval(n._t); zil(); n.textContent='⏰ Süre!'; } },1000); return; }
    // kalem / silgi / damga
    if(TAHTA.mod===a){ TAHTA.mod=null; kat.classList.remove('ciz'); bar.querySelectorAll('button').forEach(x=>{ if(['kalem','silgi','damga'].includes(x.dataset.a)) x.classList.remove('aktif'); }); }
    else { TAHTA.mod=a; kat.classList.add('ciz'); bar.querySelectorAll('button').forEach(x=>{ if(['kalem','silgi','damga'].includes(x.dataset.a)) x.classList.toggle('aktif',x===b); }); }
  });
}
function tahtaKapat(){ if(!TAHTA) return; TAHTA.kat.remove(); TAHTA.bar.remove(); (TAHTA.damgalar||[]).forEach(x=>x.remove()); ['#spot','#perde','#serit','#sayac'].forEach(s=>{ const e=$(s); if(e){ clearInterval(e._t); e.remove(); } }); TAHTA=null; }

  if(AYAR.araclar.tahta){ ekle('yzTahta','🖍️ Tahta','right:12px;bottom:'+y+'px',tahtaAc); y+=44; }
  if(AYAR.araclar.qr){ ekle('yzQR','📲 QR','right:12px;bottom:'+y+'px',qrAc); y+=44; }
  if(AYAR.araclar.ekran){ ekle('yzEkran','📺 mod','right:12px;bottom:'+y+'px',()=>{ const s=['oto','tablet','tahta','buyuk']; AYAR.ekranMod=s[(s.indexOf(AYAR.ekranMod)+1)%4]; ayarKaydet(); ekranUyum(); toast('Ekran: '+({oto:'Otomatik',tablet:'Tablet',tahta:'Akıllı Tahta',buyuk:'Büyük Tahta'})[AYAR.ekranMod]); }); y+=44; }
  if(AYAR.araclar.yardim){ ekle('yzYardim','?','right:12px;bottom:'+y+'px;width:36px;padding:7px 0',()=>karsilama(true)); }
}
window.ZIRVE_kontrolleriGeriGetir=()=>{ Object.keys(AYAR.araclar).forEach(k=>AYAR.araclar[k]=true); ayarKaydet(); araclariCiz(); };

/* İlk açılış karşılama */
function karsilama(zorla){
  if(!zorla && oku('zirve_karsilama_goruldu',false)) return;
  const m=modal(`<div style="text-align:center"><div style="font-size:60px">🕰️</div><h2>Okuma Saati’ne hoş geldiniz!</h2><p class="not">Ses temelli cümle yöntemiyle, saat kadranında okuyarak erken ve kalıcı okuma-yazma.</p></div>
    <div class="karsila-adim"><i>1</i><div><b>Öğrenci girişi:</b> Çocuk adını-soyadını ve sınıfını yazar; ilerlemesi kaydedilir.</div></div>
    <div class="karsila-adim"><i>2</i><div><b>A-N-E-T-İ-L sırası:</b> İlk grup A, N, E, T, İ, L; sonra O-R-M-U-K-Ü, I-Y-S-D-Z-Ç, B-G-Ş-C-P-H, Ö-V-Ğ-F-J. <b>Her harfte 6 adım:</b> Sesi hisset → Yaz → Saatte oku (sesler birleşip hece olur) → 5 oyun → Akıcı okuma → Etkinlik sayfası. Velilere 📜 Karne gönderilebilir.</div></div>
    <div class="karsila-adim"><i>3</i><div><b>Saatte oku:</b> İbre döner; heceler iç halkaya, kelimeler dış halkaya, cümleler alta altın renkte yerleşir. Yalnızca öğrenilmiş seslerle kelime gelir.</div></div>
    <div class="karsila-adim"><i>4</i><div><b>Erkek ses:</b> Öğretmen Paneli → Kayıt Stüdyosu’ndan kendi sesinizi kaydedin ya da Ayarlar’a <b>Gemini API anahtarı</b> ekleyin (<a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">ücretsiz al</a>).</div></div>
    <div class="karsila-adim"><i>5</i><div><b>Araçlar:</b> Tahta Stüdyosu, QR ve ekran modu Ayarlar ⚙️ → 🧰 Araçlar’da.</div></div>
    <div style="text-align:center;margin-top:12px"><button class="btn altin" id="kBasla">Başlayalım ⏱️</button></div>`);
  $('#kBasla',m).onclick=()=>{ yaz('zirve_karsilama_goruldu',true); m.parentElement.remove(); };
}
