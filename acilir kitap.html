<style>
:root{
  --zemin:#3b2416; --kart:#fffaf0; --murekkep:#2b1d14; --soluk:#7a6656;
  --ana:#7c3aed; --ana2:#5b21b6; --sari:#fbbf24; --yesil:#16a34a; --kirmizi:#dc2626;
  --golge:0 .6rem 1.6rem rgba(0,0,0,.28);
  --font:'Nunito','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--zemin);color:var(--murekkep);font-family:var(--font);font-variant-numeric:lining-nums tabular-nums;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block;outline:none}
button{font-family:var(--font);font-weight:800;cursor:pointer;border:0;color:inherit}
.gizli{display:none!important}

/* ÜST: yalnız gösterim */
#ust{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + .6rem) 1rem .6rem;display:flex;align-items:center;gap:.6rem;pointer-events:none;z-index:20}
.cip{background:rgba(255,250,240,.92);border-radius:999px;padding:.45rem 1rem;font-weight:900;font-size:1.05rem;box-shadow:0 .2rem .6rem rgba(0,0,0,.2);display:flex;align-items:center;gap:.45rem;white-space:nowrap}
#sayfaCip small{font-weight:800;color:var(--soluk)}
#ust .bosluk{flex:1}
#rozetler{letter-spacing:.1rem}
#anlati{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 3.7rem);transform:translateX(-50%);max-width:min(46rem,92vw);background:rgba(255,250,240,.95);border-radius:1.2rem;padding:.7rem 1.2rem;font-size:1.2rem;font-weight:800;line-height:1.35;text-align:center;box-shadow:var(--golge);z-index:19;pointer-events:none;transition:opacity .5s,transform .5s}
#anlati.kapali{opacity:0;transform:translate(-50%,-.6rem)}

/* ALT ÇUBUK: tüm dokunulan kontroller */
#alt{position:fixed;left:0;right:0;bottom:0;padding:.6rem .8rem calc(env(safe-area-inset-bottom) + .7rem);display:flex;align-items:center;justify-content:center;gap:.55rem;z-index:30;flex-wrap:wrap}
.dug{background:var(--kart);border-radius:1.1rem;min-height:3.6rem;min-width:3.6rem;padding:0 1rem;font-size:1.15rem;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;box-shadow:0 .3rem 0 rgba(0,0,0,.25),0 .5rem 1rem rgba(0,0,0,.2);transition:transform .08s}
.dug:active{transform:translateY(.2rem);box-shadow:0 .1rem 0 rgba(0,0,0,.25)}
.dug.buyuk{font-size:1.5rem;min-height:4.4rem;padding:0 1.6rem}
.dug.mor{background:var(--ana);color:#fff}
.dug.sari{background:var(--sari)}
.dug.yesil{background:#22c55e;color:#fff}
.dug.ok{font-size:1.7rem;min-width:4.2rem}
.dug[disabled]{opacity:.4;pointer-events:none}
.modSec{display:inline-flex;background:rgba(30,16,8,.55);border-radius:1.3rem;padding:.25rem;gap:.25rem}
.modSec .dug{box-shadow:none;background:transparent;color:#fff}
.modSec .dug.secili{background:var(--kart);color:var(--murekkep);box-shadow:0 .2rem 0 rgba(0,0,0,.2)}

/* Bilgi kartı ve görev paneli (altta) */
.altpanel{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 5.4rem);transform:translateX(-50%);width:min(44rem,94vw);background:var(--kart);border-radius:1.5rem;box-shadow:var(--golge);padding:1rem 1.2rem;z-index:25;animation:yuksel .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes yuksel{from{transform:translate(-50%,2rem);opacity:0}to{transform:translate(-50%,0);opacity:1}}
#kart{display:flex;gap:1rem;align-items:center}
#kartEmoji{font-size:3.6rem;line-height:1;flex:0 0 auto;filter:drop-shadow(0 .2rem .2rem rgba(0,0,0,.2))}
#kartAd{font-size:1.6rem;font-weight:900;margin:0 0 .2rem}
#kartMetin{font-size:1.2rem;font-weight:700;line-height:1.4;margin:0}
#kart .sag{display:flex;flex-direction:column;gap:.4rem;margin-left:auto}
#gorev .ust{display:flex;align-items:center;gap:.7rem}
#gorevSoru{font-size:1.5rem;font-weight:900;line-height:1.3;flex:1}
#gorevNot{font-size:1.05rem;font-weight:800;color:var(--soluk);margin-top:.25rem}
#gorevSiklar{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.8rem;justify-content:center}
#gorevSiklar .dug{font-size:1.35rem;min-height:3.8rem;flex:1 1 9rem;background:#f3e8ff;box-shadow:0 .3rem 0 #c4b5fd}
#gorevSiklar .dug.dogru{background:#bbf7d0;box-shadow:0 .3rem 0 #22c55e}
#gorevSiklar .dug.yanlis{background:#fecaca;box-shadow:0 .3rem 0 #ef4444;animation:salla .35s}
@keyframes salla{25%{transform:translateX(-.4rem)}75%{transform:translateX(.4rem)}}
#gorevNoktalar{display:flex;gap:.35rem}
#gorevNoktalar i{width:.85rem;height:.85rem;border-radius:50%;background:#e7dccb;display:block}
#gorevNoktalar i.tamam{background:var(--sari)}
#gorevNoktalar i.simdi{background:var(--ana)}
.saatDijital{font-size:1.6rem;letter-spacing:.05rem}

/* Kaplamalar */
.kaplama{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:1rem;background:rgba(30,16,8,.55);backdrop-filter:blur(3px)}
.pencere{background:var(--kart);border-radius:1.6rem;box-shadow:var(--golge);padding:1.4rem 1.6rem;width:min(40rem,96vw);max-height:92vh;overflow:auto;touch-action:pan-y}
.pencere h2{margin:0 0 .6rem;font-size:1.8rem;font-weight:900}
.pencere p,.pencere li{font-size:1.15rem;font-weight:700;line-height:1.45}
.pencere ol{padding-left:1.4rem;margin:.4rem 0 1rem}
.satir{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-top:1rem}

/* Başlık menüsü */
#menu{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;pointer-events:none}
#menu .baslik{margin-top:calc(env(safe-area-inset-top) + .7rem);text-align:center;color:#fff7e6;text-shadow:0 .3rem 1rem rgba(0,0,0,.45)}
#menu .baslik h1{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(2.2rem,5.5vw,4rem);margin:0;line-height:1.05}
#menu .baslik p{font-size:1.25rem;font-weight:800;margin:.4rem 0 0;opacity:.92}
#menu .altgrup{margin-top:auto;margin-bottom:calc(env(safe-area-inset-bottom) + 1.2rem);display:flex;flex-direction:column;align-items:center;gap:.8rem;pointer-events:auto}
#menu .soluklar{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
#menu .soluklar .dug{opacity:.72;min-height:3rem;font-size:1rem;background:rgba(255,250,240,.85)}
#ogrenciCip{background:rgba(30,16,8,.7);color:#fff7e6;font-weight:800;font-size:1.05rem;padding:.35rem .9rem;border-radius:999px}
#ogrenciCip:empty{display:none}
#surumRozet{position:fixed;left:.8rem;top:calc(env(safe-area-inset-top) + .7rem);z-index:41;background:rgba(255,250,240,.75);border-radius:999px;padding:.3rem .8rem;font-size:.9rem;font-weight:900;pointer-events:auto}
.sayfaSec{display:grid;grid-template-columns:repeat(auto-fill,minmax(9rem,1fr));gap:.7rem;margin-top:.6rem}
.sayfaSec .dug{flex-direction:column;min-height:6.2rem;font-size:1.05rem;padding:.6rem}
.sayfaSec .dug b{font-size:2.2rem}
.sinifSec .dug{min-width:12rem}

    return veri.filter(function(x){return (!a||(x.ad+' '+x.soyad).toLocaleLowerCase('tr-TR').indexOf(a)>=0)&&(!o||x.oyun===o)&&(!s||x.sinif===s)&&(!c||x.cihaz===c);});
  }
  function ciz(){
    var l=suz(), simdi=Date.now(), bugun=new Date().toDateString();
    var farkli={},cih={},on=0,bg=0;
    l.forEach(function(x){farkli[x.ad+'|'+x.soyad+'|'+x.sinif+'|'+x.sube]=1;cih[x.cihaz]=(cih[x.cihaz]||0)+1;if(simdi-new Date(x.son)<300000)on++;if(new Date(x.giris).toDateString()===bugun)bg++;});
    var ik={'Telefon':'📱','Tablet':'📲','Bilgisayar':'💻','Akıllı Tahta':'🖥️'};
    $('zgOz').innerHTML='<div><b>'+l.length+'</b><span>Toplam giriş</span></div><div><b>'+Object.keys(farkli).length+'</b><span>Farklı öğrenci</span></div><div><b>'+on+'</b><span>Şu an oyunda</span></div><div><b>'+bg+'</b><span>Bugün</span></div>'+
      Object.keys(cih).map(function(c){return '<div><b>'+(ik[c]||'🔹')+' '+cih[c]+'</b><span>'+esc(c)+'</span></div>';}).join('');
    $('zgTb').innerHTML=l.length?l.map(function(x){var onl=simdi-new Date(x.son)<300000;return '<tr><td>'+(onl?'<span class="zg-on"></span>':'')+esc(x.ad)+' '+esc(x.soyad)+'</td><td>'+esc(x.sinif)+'-'+esc(x.sube)+'</td><td>'+esc(x.oyun)+'</td><td>'+(ik[x.cihaz]||'')+' '+esc(x.cihaz)+'<br><small>'+esc(x.os)+' · '+esc(x.tarayici)+'</small></td><td>'+tarihYaz(x.giris)+'</td><td>'+tarihYaz(x.son)+'</td></tr>';}).join(''):'<tr><td colspan="6">Kayıt yok.</td></tr>';
  }
  function secenek(id,alan){var s=$(id),v={};veri.forEach(function(x){if(x[alan])v[x[alan]]=1;});Object.keys(v).sort().forEach(function(x){var o=document.createElement('option');o.textContent=x;s.appendChild(o);});}
  function yukle(){
    $('zgTb').innerHTML='<tr><td colspan="6">Yükleniyor…</td></tr>';
    listele().then(function(a){veri=a.sort(function(p,q){return new Date(q.giris)-new Date(p.giris);});['zgFO','zgFS','zgFC'].forEach(function(id){var s=$(id);while(s.options.length>1)s.remove(1);});secenek('zgFO','oyun');secenek('zgFS','sinif');secenek('zgFC','cihaz');ciz();})
      .catch(function(e){$('zgTb').innerHTML='<tr><td colspan="6">Liste alınamadı (internet / izin): '+esc(e.message)+'</td></tr>';});
  }

    var t=['Ad\tSoyad\tSınıf\tŞube\tOyun\tCihaz\tOS\tTarayıcı\tEkran\tGiriş\tSon'].concat(suz().map(function(x){return [x.ad,x.soyad,x.sinif,x.sube,x.oyun,x.cihaz,x.os,x.tarayici,x.ekran,tarihYaz(x.giris),tarihYaz(x.son)].join('\t');})).join('\n');
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){$('zgKop').textContent='✅ Kopyalandı';},function(){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');$('zgKop').textContent='✅ Kopyalandı';}catch(e){}ta.remove();});
  };
  yukle();
}

const $=id=>document.getElementById(id);
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,String(v));}catch(e){return null;}}
const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const karistir=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const easeOutBack=t=>{const c1=1.5,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const easeInOut=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeInCubic=t=>t*t*t;

/* ---------- Ekran ölçeği (akıllı tahta) ---------- */
function ekranOlcek(){
  const c=window.ZGIRIS?ZGIRIS.cihaz():{tur:'Bilgisayar'};
  const vw=innerWidth,vh=innerHeight;
  let s=clamp(Math.min(vw/1100,vh/720),.68,1);
  if(c.tur==='Akıllı Tahta'){const fiz=Math.max(screen.width,screen.height)*(devicePixelRatio||1);s=fiz>=3000?1.6:1.35;}
  else if(Math.min(vw,vh)>=1000&&Math.max(vw,vh)>=1700)s=1.15;
  document.documentElement.style.fontSize=(16*s)+'px';
  document.documentElement.style.setProperty('--egt-z','1');
}
ekranOlcek();

let trSes=null;
function sesSec(){try{const v=speechSynthesis.getVoices();trSes=v.find(x=>/^tr/i.test(x.lang)&&/Google|Yelda|Emel|Neural|Online/i.test(x.name))||v.find(x=>/^tr/i.test(x.lang))||null;}catch(e){}}
if('speechSynthesis' in window){sesSec();speechSynthesis.onvoiceschanged=sesSec;}
function konus(t){
  if(!S.ses||!('speechSynthesis' in window)||!t)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';if(trSes)u.voice=trSes;u.rate=.92;u.pitch=1.08;speechSynthesis.speak(u);}catch(e){}
}
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function bip(f,d,tip,v,f2){const a=ac();if(!a||!S.ses)return;const o=a.createOscillator(),g=a.createGain();o.type=tip||'sine';o.frequency.setValueAtTime(f,a.currentTime);if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+d);g.gain.setValueAtTime(v||.15,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d+.02);}
function hisirti(d){const a=ac();if(!a||!S.ses)return;const n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++){const t=i/n;c[i]=(Math.random()*2-1)*Math.sin(Math.PI*t)*.5;}const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type='bandpass';f.frequency.value=2400;f.Q.value=.7;g.gain.value=.35;s.buffer=b;s.connect(f);f.connect(g);g.connect(a.destination);s.start();}
const SFX={boing:()=>{bip(260,.18,'sine',.16,720);setTimeout(()=>bip(720,.2,'sine',.1,380),150);},wuu:()=>{bip(300,.5,'triangle',.08,1100);hisirti(.35);},parilti:()=>[0,70,140,210].forEach((d,i)=>setTimeout(()=>bip(1046*Math.pow(1.26,i),.18,'triangle',.07),d)),titre:()=>{for(let i=0;i<4;i++)setTimeout(()=>bip(420+i*30,.08,'square',.04),i*70);},

  yanlis:()=>bip(240,.25,'sine',.13,170),sayfa:()=>hisirti(.45),dokun:()=>bip(rnd(700,900),.08,'sine',.08)};

/* =================== THREE.JS SAHNE =================== */
let R,SCN,CAM,HEMI,GUNES,NOKTA,KITAP,SOL,SIRT,SAYFA_SAG,SAYFA_SOL,YAPRAK,YAPRAK_ON,YAPRAK_ARKA;
const W=10,D=8,T=.5;
const SAHNELER=[];
const TEX={};
const zaman={t:0};
let kam={yaw:0,pitch:.98,dist:24,hedef:new THREE.Vector3(5,0,0)}, kamHedef=null;

function M(c,o){return new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.88,metalness:0,flatShading:true},o||{}));}
function mesh(g,m,x,y,z){const o=new THREE.Mesh(g,m);o.position.set(x||0,y||0,z||0);o.castShadow=true;o.receiveShadow=true;return o;}
function cvTex(w,h,ciz,rep){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');ciz(g,w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=R?Math.min(8,R.capabilities.getMaxAnisotropy()):1;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;}t.userData={c,g};return t;}
const EMOJI_FONT='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif';
function stickerTex(e){
  if(TEX['st'+e])return TEX['st'+e];
  const P=256;
  const t=cvTex(P,P,(g)=>{
    const a=document.createElement('canvas');a.width=a.height=P;const ag=a.getContext('2d');
    ag.font=(P*.66)+'px '+EMOJI_FONT;ag.textAlign='center';ag.textBaseline='middle';ag.fillText(e,P/2,P*.54);
    const s=document.createElement('canvas');s.width=s.height=P;const sg=s.getContext('2d');sg.drawImage(a,0,0);sg.globalCompositeOperation='source-in';sg.fillStyle='#fffdf6';sg.fillRect(0,0,P,P);
    const r=P*.035;for(let i=0;i<16;i++){const an=i/16*Math.PI*2;g.drawImage(s,Math.cos(an)*r,Math.sin(an)*r);}
    g.drawImage(a,0,0);
  });
  TEX['st'+e]=t;return t;
}
function sticker(e,s){
  s*=1.3;const t=stickerTex(e);
  const mat=new THREE.MeshStandardMaterial({map:t,alphaTest:.5,side:THREE.DoubleSide,roughness:.8});
  const g=new THREE.PlaneGeometry(s,s);g.translate(0,s/2,0);
  const m=new THREE.Mesh(g,mat);m.castShadow=true;
  m.customDepthMaterial=new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking,map:t,alphaTest:.5});
  return m;
}

/* --- Sayfa ve arka plan dokuları --- */
function kagit(g,w,h,renk){g.fillStyle=renk||'#f7efdf';g.fillRect(0,0,w,h);for(let i=0;i<2600;i++){g.fillStyle='rgba(120,90,50,'+(Math.random()*.05)+')';g.fillRect(Math.random()*w,Math.random()*h,1.5,1.5);}}
function konfetiNokta(g,w,h,n){const r=['#ef4444','#f59e0b','#22c55e','#3b82f6','#a855f7','#ec4899'];for(let i=0;i<n;i++){g.fillStyle=r[i%r.length];g.save();g.translate(Math.random()*w,Math.random()*h);g.rotate(Math.random()*3);g.fillRect(-4,-2,8,4);g.restore();}}
function cimen(g,x,y,w,h,r1,r2){g.fillStyle=r1;g.beginPath();g.moveTo(x,y+h);const n=Math.ceil(w/40);for(let i=0;i<=n;i++){const xx=x+i*w/n;g.quadraticCurveTo(xx-w/n/2,y-10,xx,y+8);}g.lineTo(x+w,y+h);g.closePath();g.fill();if(r2){for(let i=0;i<w/14;i++){g.fillStyle=r2;g.fillRect(x+Math.random()*w,y+20+Math.random()*(h-30),3,10);}}}
function sayfaCiz(tema,yan){ // yan: 'sol'|'sag' ; tuval sol kenarı: sol sayfada dış kenar, sağ sayfada sırt
  return cvTex(1024,820,(g,w,h)=>{
    kagit(g,w,h);

function hareketUygula(u){
  const h=u.hareket,ic=u.ic;if(!h)return;
  const k=(zaman.t-h.bas)/h.sure;
  if(k>=1){ic.position.set(0,0,0);ic.rotation.set(0,0,0);u.hareket=null;return;}
  const P=Math.PI;let x=0,y=0,rz=0,ry=0,sc=1;
  switch(h.tip){
    case 'zipla':y=Math.sin(P*k)*1.1;rz=Math.sin(2*P*k)*.12;break;
    case 'zipla2':y=Math.sin(P*k)*2.3;rz=Math.sin(2*P*k)*.35;break;
    case 'don':ry=easeInOut(k)*2*P;y=Math.sin(P*k)*.3;break;
    case 'don2':ry=easeInOut(k)*4*P;break;
    case 'salla':rz=Math.sin(k*P*6)*.2*(1-k);break;
    case 'uc':y=Math.sin(P*k)*2.2;x=Math.sin(2*P*k)*1.4;rz=-Math.cos(2*P*k)*.3;break;
    case 'buyu':sc=1+Math.sin(P*k)*.35;break;
    case 'kos':x=Math.sin(2*P*k)*1.6;y=Math.abs(Math.sin(10*P*k))*.12;break;
    case 'yuksel':y=Math.sin(P*k)*3;rz=Math.sin(4*P*k)*.15;break;
    case 'cik':y=Math.sin(P*k)*.9;ry=Math.sin(P*k)*.6;break;
  }
  ic.position.set(x,y,0);ic.rotation.set(0,ry,rz);if(sc!==1)ic.scale.multiplyScalar(sc);
}

  const ustM=M(0xf7efdf);
  // sağ blok
  KITAP.add(mesh(new THREE.BoxGeometry(W+.4,.12,D+.6),kapakMat,(W+.4)/2,-T+.06,0));
  KITAP.add(mesh(new THREE.BoxGeometry(W,T-.12,D),[kenarM,kenarM,ustM,ustM,kenarM,kenarM],W/2,-(T-.12)/2,0));

  SAYFA_SOL=new THREE.Mesh(sayfaGeo(true),new THREE.MeshStandardMaterial({roughness:.95}));SAYFA_SOL.position.set(0,.004,0);SAYFA_SOL.receiveShadow=true;SOL.add(SAYFA_SOL);
  SIRT=mesh(new THREE.BoxGeometry(.16,1,D+.6),kapakMat,0,0,0);KITAP.add(SIRT);
  // kurdele
  const kd=mesh(new THREE.BoxGeometry(.4,.02,2.2),M(0xf5b82e),.6,-T+.01,D/2+1.2);KITAP.add(kd);

  YAPRAK_ON=new THREE.MeshStandardMaterial({roughness:.95,side:THREE.FrontSide});

  YAPRAK=new THREE.Group();const y1=new THREE.Mesh(yg,YAPRAK_ON),y2=new THREE.Mesh(yg,YAPRAK_ARKA);y1.castShadow=y2.castShadow=true;YAPRAK.add(y1,y2);YAPRAK.userData.geo=yg;YAPRAK.userData.u=[];
  const p=yg.attributes.position;for(let i=0;i<p.count;i++)YAPRAK.userData.u.push(p.getX(i));

function sayfaGeo(sol){const g=new THREE.PlaneGeometry(W-.1,D-.1);g.rotateX(-Math.PI/2);g.translate(sol?-(W-.1)/2:(W-.1)/2,0,0);return g;}
function kitapAciklik(k){ // 0 kapalı, 1 açık
  SOL.rotation.z=-Math.PI*(1-k);
  const kap=1-k;SIRT.scale.y=.12+2*T*kap;SIRT.position.set(-.08*(1-kap),-T+.06+(T-.06)*kap,0);SIRT.position.y=(-T)+(SIRT.scale.y)/2;

function yaprakBuk(t,ileri){ // t:0..1
  const g=YAPRAK.userData.geo,p=g.attributes.position,us=YAPRAK.userData.u;
  const N=28,du=W/N;const a=(ileri?t:1-t)*Math.PI;const lag=Math.sin(Math.PI*t)*.9*(ileri?1:-1);
  const xs=[0],ys=[0];let x=0,y=0;
  for(let i=1;i<=N;i++){let th=a-lag*(i/N);th=clamp(th,0,Math.PI);x+=Math.cos(th)*du;y+=Math.sin(th)*du;xs.push(x);ys.push(y);}
  for(let i=0;i<p.count;i++){const k=Math.round(us[i]/du);p.setX(i,xs[k]);p.setY(i,ys[k]+.03);}
  p.needsUpdate=true;g.computeVertexNormals();
}

/* --- Kamera --- */
const KAM_KAPALI={yaw:0,pitch:1.12,hedef:new THREE.Vector3(5,0,.3),pay:1.0};
const KAM_ACIK={yaw:0,pitch:.6,hedef:new THREE.Vector3(0,1.55,-.2),pay:1.0};
let kamDurum={yaw:0,pitch:1.12,hedef:KAM_KAPALI.hedef.clone(),acik:0},kamTw=null,kullaniciYaw=0,kullaniciPitch=0;
function kamUzaklik(acik){
  const asp=CAM.aspect,vf=CAM.fov*Math.PI/180,hf=2*Math.atan(Math.tan(vf/2)*asp);
  const genis=acik?21.6:12.5, yuk=acik?10.5:10.2;
  return Math.max((genis/2)/Math.tan(hf/2),(yuk/2)/Math.tan(vf/2))*1.02;
}
function kamGit(acik,sure){const a=acik?KAM_ACIK:KAM_KAPALI;kamTw={bas:zaman.t,sure:sure||1.4,from:{yaw:kamDurum.yaw,pitch:kamDurum.pitch,hedef:kamDurum.hedef.clone(),acik:kamDurum.acik},to:{yaw:a.yaw,pitch:a.pitch,hedef:a.hedef.clone(),acik:acik?1:0}};}
function kamGuncelle(){
  if(kamTw){const k=easeInOut(clamp((zaman.t-kamTw.bas)/kamTw.sure,0,1));const f=kamTw.from,t=kamTw.to;
    kamDurum.yaw=f.yaw+(t.yaw-f.yaw)*k;kamDurum.pitch=f.pitch+(t.pitch-f.pitch)*k;kamDurum.hedef.lerpVectors(f.hedef,t.hedef,k);kamDurum.acik=f.acik+(t.acik-f.acik)*k;if(k>=1)kamTw=null;}
  const yaw=kamDurum.yaw+kullaniciYaw,pit=clamp(kamDurum.pitch+kullaniciPitch,.35,1.35);
  const d=kamUzaklik(false)*(1-kamDurum.acik)+kamUzaklik(true)*kamDurum.acik;
  const h=kamDurum.hedef;
  CAM.position.set(h.x+Math.sin(yaw)*Math.cos(pit)*d,h.y+Math.sin(pit)*d,h.z+Math.cos(yaw)*Math.cos(pit)*d);
  CAM.lookAt(h);
}
function boyutla(){
  const w=innerWidth,h=innerHeight;R.setSize(w,h,false);CAM.aspect=w/h;
  // alt çubuk ve üst bilgi için görüntüyü hafif yukarı kaydır
  const ofs=Math.round(h*.06);CAM.setViewOffset(w,h,0,ofs,w,h);CAM.updateProjectionMatrix();
  ekranOlcek();konfetiBoyut();
}

let sonZ=performance.now();
function dongu(){
  requestAnimationFrame(dongu);
  const n=performance.now(),dt=Math.min(.25,(n-sonZ)/1000);sonZ=n;zaman.t+=dt;
  // ışık geçişi
  ['hi','di','ni'].forEach(k=>isikSimdi[k]+=(isikHedef[k]-isikSimdi[k])*Math.min(1,dt*2.5));
  ['hs','hg','dc','bg'].forEach(k=>isikSimdi[k]=renkLerp(isikSimdi[k],isikHedef[k],Math.min(1,dt*2.5)));
  HEMI.color.setHex(isikSimdi.hs);HEMI.groundColor.setHex(isikSimdi.hg);HEMI.intensity=isikSimdi.hi;GUNES.color.setHex(isikSimdi.dc);GUNES.intensity=isikSimdi.di;NOKTA.intensity=isikSimdi.ni;SCN.background.setHex(isikSimdi.bg);
  if(kitapTw){const k=easeInOut(clamp((zaman.t-kitapTw.bas)/kitapTw.sure,0,1));kitapAciklik(kitapTw.from+(kitapTw.to-kitapTw.from)*k);if(k>=1)kitapTw=null;}
  if(yaprakTw){const k=clamp((zaman.t-yaprakTw.bas)/yaprakTw.sure,0,1);yaprakBuk(easeInOut(k),yaprakTw.ileri);if(k>=1){YAPRAK.visible=false;const f=yaprakTw.bitti;yaprakTw=null;f&&f();}}
  popGuncelle();
  SAHNELER.forEach(sc=>{if(sc.grup.visible)sc.anim.forEach(f=>f(zaman.t,dt));});
  if(saatGoster.gercek&&Math.floor(zaman.t)%20===0&&saatTex){const d=new Date();if(saatGoster.h!==d.getHours()||saatGoster.m!==d.getMinutes()){saatGoster.h=d.getHours();saatGoster.m=d.getMinutes();saatCiz(saatGoster.h,saatGoster.m);}}
  parcaGuncelle(dt);

const ray=new THREE.Raycaster(),fare=new THREE.Vector2();

cv.addEventListener('pointermove',e=>{if(!surukle.aktif||e.pointerId!==surukle.id)return;const dx=e.clientX-surukle.x,dy=e.clientY-surukle.y;surukle.x=e.clientX;surukle.y=e.clientY;surukle.hareket+=Math.abs(dx)+Math.abs(dy);

function dokun(x,y){
  if(!S.acik){if(!$('menu').classList.contains('gizli')&&!S.mesgul)kitabiAc(S.ilr.son||0);return;}
  if(S.mesgul)return;
  const r=cv.getBoundingClientRect();fare.set((x-r.left)/r.width*2-1,-((y-r.top)/r.height)*2+1);
  ray.setFromCamera(fare,CAM);
  const sc=SAHNELER[S.sayfa];const hed=[];sc.grup.traverse(o=>{if(o.isMesh&&o.userData.itemId&&o.visible)hed.push(o);});
  const k=ray.intersectObjects(hed,false).find(h=>{let o=h.object;while(o){if(o.visible===false)return false;o=o.parent;}return h.object.material.alphaTest?alfaVar(h):true;});
  if(!k)return;
  const id=k.object.userData.itemId;let p=k.object;while(p&&!(p.userData&&p.userData.ic))p=p.parent;
  if(p)p.userData.zip=zaman.t;
  canlandir(id,p,k.point);
  nesneSecildi(id,p);
}
function alfaVar(h){ // çıkartmanın şeffaf kısmına dokunulduysa sayma
  const mp=h.object.material.map;if(!mp||!h.uv||!mp.userData||!mp.userData.g)return true;
  const c=mp.userData.c;const px=Math.floor(h.uv.x*c.width),py=Math.floor((1-h.uv.y)*c.height);
  try{return mp.userData.g.getImageData(clamp(px,0,c.width-1),clamp(py,0,c.height-1),1,1).data[3]>40;}catch(e){return true;}
}

const kf=$('konfeti'),kg=kf.getContext('2d');let parcalar=[],kSC=1;
function konfetiBoyut(){kSC=Math.min(2,devicePixelRatio||1);kf.width=Math.round(innerWidth*kSC);kf.height=Math.round(innerHeight*kSC);}
function konfeti(n){const r=['#ef4444','#f59e0b','#22c55e','#3b82f6','#a855f7','#ec4899','#facc15'];for(let i=0;i<n;i++)parcalar.push({x:innerWidth/2+rnd(-200,200),y:innerHeight*.55,vx:rnd(-6,6),vy:rnd(-13,-5),r:rnd(0,6),vr:rnd(-.3,.3),c:r[i%r.length],w:rnd(6,11),h:rnd(4,7),o:1});}
function konfetiCiz(dt){if(!parcalar.length){if(kf._dolu){kg.setTransform(1,0,0,1,0,0);kg.clearRect(0,0,kf.width,kf.height);kf._dolu=false;}return;}
  kg.setTransform(kSC,0,0,kSC,0,0);kg.clearRect(0,0,innerWidth,innerHeight);kf._dolu=true;
  parcalar.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.o-=.006;kg.save();kg.globalAlpha=Math.max(0,p.o);kg.translate(p.x,p.y);kg.rotate(p.r);kg.fillStyle=p.c;kg.fillRect(-p.w/2,-p.h/2,p.w,p.h);kg.restore();});
  parcalar=parcalar.filter(p=>p.y<innerHeight+30&&p.o>0);}

function sinifAc(){pencere('<h2>🎓 Sınıf Seviyesi</h2><p>Görevler bu seviyeye göre hazırlanır.</p><div class="satir sinifSec" style="flex-direction:column;align-items:center">'+['ana','12','34'].map(v=>'<button class="dug buyuk '+(S.seviye===v?'secili':'')+'" data-v="'+v+'">'+({ana:'🧸 Anaokulu','12':'✏️ 1-2. Sınıf','34':'📘 3-4. Sınıf'})[v]+'</button>').join('')+'</div>');
  document.querySelectorAll('.sinifSec .dug').forEach(b=>b.onclick=()=>{S.seviye=b.dataset.v;ls('zirve_oyun_sinif',S.seviye);pencereKapat();toast('🎓 '+SEVIYE_AD[S.seviye]);menuGoster();if(S.acik&&S.mod==='gorev')gorevBaslat();});}
function sayfalarAc(){pencere('<h2>🗂️ Sayfalar</h2><div class="sayfaSec">'+SAYFALAR.map((s,i)=>'<button class="dug" data-i="'+i+'"><b>'+s.rozet+'</b>'+(i+1)+'. '+s.ad+(S.ilr.rozet[s.id]?' ✅':'')+'</button>').join('')+'</div><div class="satir"><button class="dug" onclick="pencereKapat()">Kapat</button></div>');
  document.querySelectorAll('.sayfaSec .dug').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;pencereKapat();$('duraklat').classList.add('gizli');if(S.acik)sayfaGit(i);else kitabiAc(i);});}
function surumAc(){
  const ok=MODULLER.filter(m=>{try{return m[1]();}catch(e){return false;}}).length;
  pencere('<h2>📦 Sürüm v'+APP.surum+'</h2><p class="mdl">Tarih: '+APP.tarih+'</p><p class="mdl">Önceki: v'+APP.onceki.surum+' · '+APP.onceki.satir+' satır · '+APP.onceki.kb+' KB</p><p class="mdl">Şimdiki: v'+APP.surum+' · '+APP.satir+' satır · '+APP.kb+' KB (fark +'+(APP.satir-APP.onceki.satir)+' satır)</p><p><b>Yenilikler</b></p><ul>'+APP.yenilikler.map(y=>'<li class="mdl">'+y+'</li>').join('')+'</ul><p><b>🧪 Modüller: '+ok+'/'+MODULLER.length+'</b></p>'+MODULLER.map(m=>{let v=false;try{v=m[1]();}catch(e){}return '<p class="mdl">'+(v?'✅':'❌')+' '+m[0]+'</p>';}).join('')+'<div class="satir"><button class="dug" id="sDenetle">🔄 Güncellemeleri Denetle</button><button class="dug mor" onclick="pencereKapat()">Kapat</button></div>');
  $('sDenetle').onclick=async()=>{const d=await damgaAl();if(!d){toast('Bu cihazda denetlenemedi (yerel dosya ya da internet yok).');return;}if(surumDamga&&d!==surumDamga)$('yeniSurum').classList.remove('gizli');else toast('✅ En güncel sürümdesin.');};
}

/* --- QR ile paylaş --- */
function qrYukle(){return new Promise((ok,no)=>{if(window.qrcode)return ok();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';s.onload=()=>ok();s.onerror=no;document.head.appendChild(s);});}
function paylasAc(){
  const u=(window.PAYLAS&&PAYLAS.url)||location.href.split('#')[0];
  if(!/^https?:/.test(location.protocol)||/localhost|127\.0\.0\.1/.test(location.hostname)){pencere('<h2>📲 QR ile paylaş</h2><p>QR kodu oluşturmak için önce dosyayı GitHub Pages\'e (sitene) yükle; sonra bu düğme sitedeki adresin QR kodunu üretir.</p><div class="satir"><button class="dug mor" onclick="pencereKapat()">Tamam</button></div>');return;}
  pencere('<h2>📲 QR ile paylaş</h2><div style="text-align:center"><div class="qrKutu"><canvas id="qrC" width="300" height="300"></canvas></div><p class="adres">'+u.replace(/</g,'&lt;')+'</p></div><div class="satir"><button class="dug" id="qKop">🔗 Linki kopyala</button><button class="dug" id="qPng">⬇️ PNG indir</button><button class="dug mor" onclick="pencereKapat()">Kapat</button></div>');
  $('qKop').onclick=()=>{(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('🔗 Link kopyalandı'),()=>toast('Kopyalanamadı'));};
  qrYukle().then(()=>{const q=qrcode(0,'M');q.addData(u);q.make();const n=q.getModuleCount(),c=$('qrC'),g=c.getContext('2d'),m=4,sz=Math.floor(300/(n+m*2));c.width=c.height=sz*(n+m*2);g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.fillStyle='#111';for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))g.fillRect((k+m)*sz,(r+m)*sz,sz,sz);
    $('qPng').onclick=()=>{const a=document.createElement('a');a.download='acilir-kitap-qr.png';a.href=c.toDataURL('image/png');a.click();};})
  .catch(()=>toast('QR kütüphanesi yüklenemedi (internet?)'));
}
window.ZIRVE_paylasAc=paylasAc;

/* --- Siteye Dön --- */
function siteyeDon(){
  try{ilerlemeKaydet();}catch(e){}
  try{if(window.self!==window.top){window.parent.postMessage({zirve:'siteyeDon'},'*');try{window.top.location.href=SITE_URL;}catch(e){}return;}}catch(e){}
  try{if(window.opener&&!window.opener.closed){window.opener.focus();window.close();setTimeout(()=>{location.href=SITE_URL;},400);return;}}catch(e){}
  if(document.referrer&&document.referrer.indexOf(SITE_URL)===0&&history.length>1){history.back();return;}
  location.href=SITE_URL;
}
window.ZIRVE_siteyeDon=siteyeDon;

/* --- Sürüm denetimi (ETag) --- */
let surumDamga=null;
async function damgaAl(){
  if(!/^https?:/.test(location.protocol))return null;const u=location.href.split('#')[0];const ek=(u.indexOf('?')>=0?'&':'?')+'_v='+Date.now();
  try{let r=await fetch(u+ek,{method:'HEAD',cache:'no-store'});if(!r.ok)r=await fetch(u+ek,{cache:'no-store'});return r.headers.get('etag')||r.headers.get('last-modified');}catch(e){return null;}
}
async function surumBaslat(){surumDamga=await damgaAl();setInterval(surumKontrol,120000);addEventListener('focus',surumKontrol);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')surumKontrol();});}
let sonKontrol=0;
async function surumKontrol(){if(Date.now()-sonKontrol<15000||!surumDamga)return;sonKontrol=Date.now();const d=await damgaAl();if(d&&d!==surumDamga)$('yeniSurum').classList.remove('gizli');}
$('ysYenile').onclick=()=>{const u=location.href.split('#')[0];location.href=u+(u.indexOf('?')>=0?'&':'?')+'_r='+Date.now();};
$('ysKapat').onclick=()=>$('yeniSurum').classList.add('gizli');

/* --- PWA --- */
function initPWA(){
  try{const man={name:APP.ad,short_name:'Açılır Kitap',start_url:location.href.split('#')[0],display:'standalone',orientation:'landscape',background_color:'#3b2416',theme_color:'#3b2416',
    icons:[{src:ICON192,sizes:'192x192',type:'image/png'},{src:ICON512,sizes:'512x512',type:'image/png'},{src:ICON512,sizes:'512x512',type:'image/png',purpose:'maskable'}]};
    const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));document.head.appendChild(l);
    const i5=document.createElement('link');i5.rel='icon';i5.sizes='512x512';i5.href=ICON512;document.head.appendChild(i5);}catch(e){}
}

/* --- Yan çevir uyarısı --- */
let yanGecildi=false;
function yanCevirKontrol(){
  const tel=window.ZGIRIS&&ZGIRIS.cihaz().tur==='Telefon';
  const dik=innerHeight>innerWidth*1.1;
  let el=$('yanCevir');
  if(tel&&dik&&!yanGecildi){if(!el){el=document.createElement('div');el.id='yanCevir';el.className='kaplama';el.style.zIndex=99;el.innerHTML='<div class="pencere" style="text-align:center"><div style="font-size:4rem">📱↪️</div><h2>Telefonu yan çevir</h2><p>Kitap yatay ekranda çok daha güzel görünür.</p><div class="satir"><button class="dug" id="yanGec">Yine de devam et</button></div></div>';document.body.appendChild(el);$('yanGec').onclick=()=>{yanGecildi=true;el.remove();};}}
  else if(el)el.remove();
}

/* --- Modül öz-kontrolü --- */
const MODULLER=[['Three.js 3B motor',()=>typeof THREE!=='undefined'&&!!R],['ZGIRIS öğrenci girişi',()=>!!window.ZGIRIS&&typeof ZGIRIS.baslat==='function'],['Öğretmen Paneli',()=>typeof ZGIRIS.panelAc==='function'],
  ['Siteye Dön',()=>typeof window.ZIRVE_siteyeDon==='function'],['QR ile paylaş',()=>typeof window.ZIRVE_paylasAc==='function'],['5 sahne',()=>SAHNELER.length===5],
  ['Görev motoru',()=>typeof gorevBaslat==='function'],['Sesli anlatım',()=>'speechSynthesis' in window],['Saat kadranı',()=>!!saatTex],['İlerleme kaydı',()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');return true;}catch(e){return false;}}]];

/* --- Düğmeler --- */
function bagla(){
  $('acDug').onclick=()=>kitabiAc(S.ilr.son||0);
  $('sayfalarDug').onclick=sayfalarAc;
  $('mSite').onclick=siteyeDon;$('mYardim').onclick=yardimAc;$('mSinif').onclick=sinifAc;$('mQr').onclick=paylasAc;$('mOgretmen').onclick=()=>ZGIRIS.panelAc();
  $('surumRozet').onclick=surumAc;
  $('aSite').onclick=siteyeDon;
  $('aMenu').onclick=()=>{$('dSurum').textContent='v'+APP.surum+' · '+SEVIYE_AD[S.seviye];$('duraklat').classList.remove('gizli');};
  $('aGeri').onclick=()=>sayfaGit(S.sayfa-1);$('aIleri').onclick=()=>sayfaGit(S.sayfa+1);
  $('modKesfet').onclick=()=>modSec('kesfet');$('modGorev').onclick=()=>modSec('gorev');
  $('aSes').onclick=()=>{S.ses=!S.ses;ls('acilir_ses',S.ses?'1':'0');$('aSes').textContent=S.ses?'🔊':'🔇';if(!S.ses)try{speechSynthesis.cancel();}catch(e){}toast(S.ses?'🔊 Ses açık':'🔇 Ses kapalı');};
  $('aSes').textContent=S.ses?'🔊':'🔇';
  $('kartKapat').onclick=kartKapat;$('kartSes').onclick=()=>konus($('kart').dataset.ses);
  $('gorevSes').onclick=()=>konus($('gorev').dataset.ses);
  $('dDevam').onclick=()=>$('duraklat').classList.add('gizli');
  $('dSayfalar').onclick=sayfalarAc;$('dSinif').onclick=()=>{$('duraklat').classList.add('gizli');sinifAc();};
  $('dKapat').onclick=()=>{$('duraklat').classList.add('gizli');kitabiKapat();};
  $('dSite').onclick=siteyeDon;$('dOgretmen').onclick=()=>ZGIRIS.panelAc();
  addEventListener('keydown',e=>{
    if(document.querySelector('.zg-k'))return;
    if(e.key==='ArrowRight')sayfaGit(S.sayfa+1);else if(e.key==='ArrowLeft')sayfaGit(S.sayfa-1);
    else if(e.key===' '||e.key==='Enter'){if(!S.acik&&!$('menu').classList.contains('gizli'))kitabiAc(S.ilr.son||0);}
    else if(e.key==='Escape'){if(!$('kaplamaGenel').classList.contains('gizli'))pencereKapat();else if(S.acik)$('aMenu').click();}
  });
}

/* =================== BAŞLAT =================== */
async function baslat(){
  if(typeof THREE==='undefined'){$('yukMetin').innerHTML='3B motor yüklenemedi.<br>İnternet bağlantını kontrol edip sayfayı yenile.';return;}
  try{await Promise.race([Promise.all(['900 64px Nunito','800 34px Nunito','italic 600 46px Fraunces'].map(f=>document.fonts.load(f))),new Promise(r=>setTimeout(r,2500))]);}catch(e){}
  try{sahneKur();}catch(e){console.error(e);$('yukMetin').textContent='Grafik başlatılamadı: '+e.message;return;}
  bagla();initPWA();dongu();yanCevirKontrol();
  $('yukleniyor').classList.add('gizli');
  ZGIRIS.baslat({oyun:APP.ad,renk:'#7c3aed'}).then(o=>{
    if(!seviyeOku()&&o){const s=o.sinif;S.seviye=s==='Anaokulu'?'ana':(s==='1'||s==='2'?'12':'34');ls('zirve_oyun_sinif',S.seviye);}
    menuGoster();
    const ok=MODULLER.filter(m=>{try{return m[1]();}catch(e){return false;}}).length;
    $('surumRozet').textContent='v'+APP.surum+' ✓';
    const once=ls('acilir_surum');ls('acilir_surum',APP.surum);
    toast(once&&once!==APP.surum?('🆕 v'+once+' → v'+APP.surum+' · 🧪 '+ok+'/'+MODULLER.length+' modül sağlam'):('✅ v'+APP.surum+' · '+(once?'en güncel sürüm':'ilk sürüm')+' · 🧪 '+ok+'/'+MODULLER.length+' modül sağlam'),3800);
    if(!ls('zirve_acilir_karsilama'))setTimeout(karsilamaAc,600);
  });
  surumBaslat();
}
if(document.readyState==='complete')baslat();else addEventListener('load',baslat);
</script>
