<title>Zihin Hattı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Lexend:wght@300..600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 3B beyin ağı tam ekran arka planda; üstte metro hattı haritası, solda durak paneli, altta yolculuk kontrolü. Tek koyu tema (akıllı tahtaya yansıtma için bilinçli seçim). */
:root{
  --ink:#0a0f24; --ink2:#121a3d; --panel:rgba(13,19,46,.82); --line:rgba(170,185,255,.16);
  --fg:#eef1ff; --mute:#a3acd6;
  --amber:#ffb547; --cyan:#45d4e6; --lilac:#b49bff; --mint:#5fe3a1; --coral:#ff7a6b;
  --lc:#ffd27a;
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Lexend','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html{font-size:clamp(15px,.55vw + 11px,21px)}
html,body{height:100%}
body{background:radial-gradient(120% 90% at 75% 40%,#1a2458 0%,var(--ink) 60%) var(--ink);color:var(--fg);font-family:var(--f-body);font-size:1rem;line-height:1.55;overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.app{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lc);outline-offset:3px}

/* üst bar + metro haritası */
.top{display:flex;align-items:center;gap:14px;padding:12px 16px 6px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.05rem;letter-spacing:-.01em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand i{width:14px;height:14px;border-radius:50%;border:3px solid var(--lc);display:inline-block;transition:border-color .6s}
.map{flex:1;min-width:0;display:flex;align-items:center;overflow-x:auto;scrollbar-width:none;padding:6px 2px}
.map::-webkit-scrollbar{display:none}
.stop{position:relative;flex:0 0 auto;width:38px;height:30px;border:0;background:none;cursor:pointer;padding:0}
.stop::before{content:"";position:absolute;top:50%;left:0;right:0;height:5px;margin-top:-2.5px;background:var(--c);opacity:.45}
.stop:first-child::before{left:50%}.stop:last-child::before{right:50%}
.stop span{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--ink);border:3px solid var(--c);transition:transform .3s,background .3s,box-shadow .3s}
.stop.done span{background:var(--c)}
.stop.on span{background:var(--c);transform:scale(1.45);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 30%,transparent),0 0 18px var(--c)}
.stop:hover span{transform:scale(1.3)}

/* ana panel */
main{min-height:0;display:flex;padding:6px 16px;overflow:hidden}
.panel{width:min(640px,100%);max-height:100%;overflow-y:auto;overscroll-behavior:contain;background:var(--panel);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:24px;padding:clamp(18px,2.2vw,30px);align-self:flex-start;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.panel.enter{animation:enter .55s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{transform:translateY(14px);opacity:.35}to{transform:none;opacity:1}}
.sign{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);flex-wrap:wrap}
.sign .dot{width:12px;height:12px;border-radius:50%;background:var(--lc);box-shadow:0 0 12px var(--lc)}
.sign b{color:var(--lc);font-weight:600}
.sign .sno{margin-left:auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:clamp(3rem,8vw,6rem);line-height:.92;letter-spacing:-.035em;font-weight:800;margin:.25em 0 .2em}
h1 em{font-style:normal;color:var(--lc)}
h2{font-size:clamp(1.75rem,3.4vw,2.6rem);line-height:1.02;letter-spacing:-.025em;font-weight:800;margin:.45em 0 .35em}
.lead{font-size:1.06rem;color:#dfe3fb;max-width:62ch;margin:0 0 1.1em}
.lead strong{color:var(--lc);font-weight:600}
.widget{display:flex;flex-direction:column;gap:14px}
.tiny{font-size:.78rem;color:var(--mute);margin:0}
.lbl{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.center{justify-content:center}
.btn{--b:var(--lc);border:0;border-radius:999px;padding:.62em 1.15em;background:var(--b);color:#0a0f24;font-weight:600;cursor:pointer;transition:transform .15s,filter .15s;font-size:.92rem}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--b)}
.btn[disabled]{opacity:.4;cursor:default;transform:none}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;align-self:flex-start}
.seg button{border:0;background:none;border-radius:999px;padding:.4em .9em;cursor:pointer;color:var(--mute);font-size:.85rem}
.seg button.on{background:var(--lc);color:#0a0f24;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:none;border-radius:999px;padding:.35em .8em;font-size:.82rem;cursor:pointer;color:var(--mute)}
.chips button.on{border-color:var(--lc);color:var(--fg);background:color-mix(in srgb,var(--lc) 18%,transparent)}
.cvwrap{border:1px solid var(--line);border-radius:16px;background:rgba(6,10,28,.55);padding:6px}
canvas.cv,.cvwrap canvas{display:block;width:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.86rem;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.legend b{color:var(--fg);font-variant-numeric:tabular-nums}
.box{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:rgba(6,10,28,.45)}

/* kanıt kutusu */
.ev{margin-top:20px;padding-top:16px;border-top:1px dashed var(--line)}
.evh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.evh b{font-size:.92rem}
.evh .evt{margin-left:auto;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.sig{display:inline-flex;align-items:flex-end;gap:3px;height:16px}
.sig i{width:5px;border-radius:2px;background:rgba(255,255,255,.15)}
.sig i:nth-child(1){height:6px}.sig i:nth-child(2){height:11px}.sig i:nth-child(3){height:16px}
.sig i.on{background:var(--sc)}
.ev p{margin:0;font-size:.88rem;color:#cfd4ef;max-width:65ch}
.ev .refs{margin-top:6px;font-size:.74rem;color:var(--mute);font-family:var(--f-mono)}
details.note{margin-top:14px;font-size:.85rem;color:var(--mute)}
details.note summary{cursor:pointer;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
details.note p{margin:.5em 0 0}

/* alt bar */
.bottom{display:flex;align-items:center;gap:10px;padding:8px 16px 14px}
.bottom .cnt{font-family:var(--f-mono);font-size:.8rem;color:var(--mute);font-variant-numeric:tabular-nums}
.bottom .spacer{flex:1}
.navb{border:1px solid var(--line);background:rgba(13,19,46,.7);border-radius:999px;padding:.55em 1.1em;cursor:pointer;font-weight:600;font-size:.9rem}
.navb.main{background:var(--lc);color:#0a0f24;border-color:transparent}
.navb[disabled]{opacity:.35;cursor:default}

/* kapak */
.lines{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.ln{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:rgba(6,10,28,.4);cursor:pointer;text-align:left}
.ln i{flex:0 0 14px;height:14px;border-radius:50%;margin-top:4px;border:3px solid var(--c)}
.ln b{display:block;font-size:.9rem}.ln small{color:var(--mute);font-size:.76rem;line-height:1.35;display:block}
.ln:hover{border-color:var(--c)}

/* odak */
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:560px){.split{grid-template-columns:minmax(0,1fr)}}
.checks{display:flex;flex-direction:column;gap:6px}
.chk{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;border:1px solid var(--line);cursor:pointer;font-size:.9rem}
.chk input{width:18px;height:18px;accent-color:var(--lc);flex:0 0 auto}
.chk:has(input:checked){border-color:var(--lc);background:color-mix(in srgb,var(--lc) 12%,transparent)}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;width:0;background:var(--lc);transition:width .4s}
.timer{display:flex;flex-direction:column;align-items:center;gap:10px}
.ring{position:relative;width:min(190px,60vw);aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .rb{stroke:rgba(255,255,255,.08)}
.ring .rf{stroke:var(--lc);stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.ring .tc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18%}
.ring .tc b{font-family:var(--f-mono);font-size:2rem;font-variant-numeric:tabular-nums}
.ring .tc span{font-size:.72rem;color:var(--mute);line-height:1.25}

/* leitner */
.boxes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bx{border:1px solid var(--line);border-radius:14px;padding:8px 10px;text-align:center;transition:border-color .3s,background .3s}
.bx b{display:block;font-family:var(--f-display);font-size:1.6rem;line-height:1.1}
.bx span{font-size:.8rem}.bx small{display:block;color:var(--mute);font-size:.7rem}
.bx.hit{border-color:var(--lc);background:color-mix(in srgb,var(--lc) 15%,transparent)}
.card3d{position:relative;height:190px;perspective:900px;cursor:pointer}
.cf{position:absolute;inset:0;border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;justify-content:center;gap:6px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .6s cubic-bezier(.2,.7,.2,1);border:1px solid var(--line)}
.cf small{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--lc)}
.cf p{margin:0;font-family:var(--f-display);font-size:1.3rem;line-height:1.2;font-weight:700}
.cf em{font-style:normal;font-size:.78rem;color:var(--mute)}
.front{background:linear-gradient(150deg,#1c2660,#111836)}
.back{background:linear-gradient(150deg,color-mix(in srgb,var(--lc) 35%,#111836),#111836);transform:rotateY(180deg)}
.card3d.flip .front{transform:rotateY(-180deg)}.card3d.flip .back{transform:rotateY(0)}

/* hafıza sarayı */
.scene{position:relative;height:280px;perspective:820px;overflow:hidden;border-radius:18px;border:1px solid var(--line);background:radial-gradient(80% 70% at 50% 35%,#202b66,#0b1130)}
.room{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;transform:scale(var(--s,1)) rotateX(-17deg) rotateY(var(--ry,20deg));transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}
.fc{position:absolute;left:0;top:0;transform-style:preserve-3d}
.fc.floor{width:330px;height:290px;margin:-145px 0 0 -165px;transform:translateY(88px) rotateX(90deg);background:repeating-linear-gradient(0deg,transparent 0 28px,color-mix(in srgb,var(--lc) 22%,transparent) 28px 29px),repeating-linear-gradient(90deg,transparent 0 28px,color-mix(in srgb,var(--lc) 22%,transparent) 28px 29px),rgba(20,28,70,.9)}
.fc.wall{background:linear-gradient(180deg,rgba(40,52,120,.85),rgba(24,32,80,.9));border:1px solid rgba(170,185,255,.18)}
.fc.back{width:330px;height:176px;margin:-88px 0 0 -165px;transform:translateZ(-145px)}
.fc.left{width:290px;height:176px;margin:-88px 0 0 -145px;transform:translateX(-165px) rotateY(90deg)}
.fc.right{width:290px;height:176px;margin:-88px 0 0 -145px;transform:translateX(165px) rotateY(-90deg)}
.door{position:absolute;left:58%;bottom:0;width:62px;height:120px;background:#3a2a55;border:2px solid rgba(255,255,255,.25);border-bottom:0;border-radius:6px 6px 0 0}
.door::after{content:"";position:absolute;right:8px;top:55%;width:7px;height:7px;border-radius:50%;background:var(--amber)}
.win{position:absolute;left:28%;top:22%;width:96px;height:66px;border:3px solid rgba(255,255,255,.35);background:linear-gradient(180deg,#7fd3ff55,#ffd27a33);border-radius:4px}
.win::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:rgba(255,255,255,.35)}
.tv{position:absolute;left:38%;top:26%;width:94px;height:56px;background:#05081a;border:3px solid #4a5590;border-radius:6px;box-shadow:0 0 22px color-mix(in srgb,var(--lc) 35%,transparent)}
.lo{position:absolute;left:0;top:0;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}
.lo .pin{transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:auto}
.lo .num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.85rem;background:var(--ink);border:3px solid var(--lc);transition:transform .3s,background .3s,color .3s}
.lo .nm{font-size:.66rem;background:rgba(10,15,36,.85);padding:2px 7px;border-radius:999px;white-space:nowrap;color:var(--mute)}
.lo.on .num{background:var(--lc);color:#0a0f24;transform:scale(1.35);box-shadow:0 0 20px var(--lc)}
.lo.ok .num{background:var(--mint);border-color:var(--mint);color:#0a0f24}
.pinfo{min-height:96px}
.pinfo h3{font-size:1.25rem;margin-bottom:4px}
.pinfo h3 small{font-family:var(--f-mono);font-size:.7rem;color:var(--mute);font-weight:400;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.pinfo p{margin:0;color:#dfe3fb}

/* anahtar kelime */
.kw{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.kc{position:relative;height:150px;perspective:700px;cursor:pointer;border:0;background:none;padding:0;text-align:left}
.kc .cf{padding:12px 14px;border-radius:14px}
.kc .cf p{font-size:1.15rem}
.kc .back p{font-size:.86rem;font-family:var(--f-body);font-weight:400;line-height:1.35}
.kc.flip .front{transform:rotateY(-180deg)}.kc.flip .back{transform:rotateY(0)}
.form3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:6px}
@media (max-width:560px){.form3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
input[type=text],textarea{font:inherit;font-size:.88rem;color:var(--fg);background:rgba(6,10,28,.6);border:1px solid var(--line);border-radius:10px;padding:.55em .7em;min-width:0;width:100%}
input[type=text]:focus,textarea:focus{border-color:var(--lc);outline:none}

/* karışık */
.tiles{display:flex;gap:4px;flex-wrap:wrap}
.tiles span{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.82rem;color:#0a0f24;animation:pop .4s backwards}
@keyframes pop{from{transform:scale(.6) translateY(6px)}}
.q{font-family:var(--f-display);font-size:1.25rem;font-weight:700;line-height:1.25}
.fb{font-size:.9rem;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05)}
.fb.ok{border-left:3px solid var(--mint)}.fb.no{border-left:3px solid var(--coral)}

/* neden zinciri */
.steps{display:flex;flex-direction:column;gap:10px;position:relative}
.st{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;animation:enter .45s}
.st .n{width:30px;height:30px;border-radius:50%;border:3px solid var(--lc);display:grid;place-items:center;font-family:var(--f-mono);font-size:.8rem;font-weight:600}
.st .qq{font-weight:600;margin:4px 0 6px}
.st .ans{font-size:.9rem;color:#dfe3fb;background:color-mix(in srgb,var(--lc) 12%,transparent);border-radius:12px;padding:10px 12px}

/* uyku */
.night{position:relative;height:46px;border-radius:12px;background:linear-gradient(90deg,#2a2f6a,#0b1030 30%,#0b1030 70%,#3a3f7a);overflow:hidden;border:1px solid var(--line)}
.night .sl{position:absolute;top:6px;bottom:6px;border-radius:8px;background:var(--lc);transition:left .3s,width .3s;opacity:.85}
.night .tk{position:absolute;bottom:2px;font-family:var(--f-mono);font-size:.62rem;color:var(--mute);transform:translateX(-50%)}
input[type=range]{width:100%;accent-color:var(--lc)}
.big{font-family:var(--f-display);font-size:2.4rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}

/* nefes */
.breath{position:relative;height:240px;display:grid;place-items:center}
.orb{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff8,var(--lc) 45%,color-mix(in srgb,var(--lc) 20%,transparent) 75%);box-shadow:0 0 60px color-mix(in srgb,var(--lc) 50%,transparent);transition:transform 5s ease-in-out}
.orb.in{transform:scale(2.2)}
.breath .bt{position:absolute;font-family:var(--f-display);font-weight:800;font-size:1.4rem;color:#0a0f24;pointer-events:none}
.reap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
@media (max-width:520px){.reap{grid-template-columns:minmax(0,1fr)}}
.reap div{border-radius:14px;padding:12px;font-size:.9rem;border:1px solid var(--line)}
.reap .old{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--coral)}
.reap .new{border-color:var(--mint);background:color-mix(in srgb,var(--mint) 10%,transparent)}

/* hata */
.er{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:14px}
.er b{font-size:.92rem}.er small{display:block;color:var(--mute);font-size:.76rem}
.er .hb{grid-column:1/-1;height:6px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden}
.er .hb i{display:block;height:100%;background:var(--lc);transition:width .4s}
.ctr{display:flex;align-items:center;gap:6px}
.ctr button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer;font-size:1.05rem;line-height:1}
.ctr span{min-width:22px;text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.er.top1{border-color:var(--lc);background:color-mix(in srgb,var(--lc) 10%,transparent)}

/* efsane */
.myth{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.myth p{margin:0;font-weight:600}
.myth .row button{font-size:.82rem;padding:.45em .9em}
.myth.r-ok{border-color:var(--mint)}.myth.r-no{border-color:var(--coral)}

/* plan */
.pledge{border-radius:20px;padding:20px;background:linear-gradient(140deg,#202a6b,#121a3d);border:1px solid var(--line);position:relative;overflow:hidden}
.pledge::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:14px solid color-mix(in srgb,var(--lc) 35%,transparent)}
.pledge h3{font-size:1.5rem;margin-bottom:6px}
.pledge ol{margin:.4em 0 0;padding-left:1.2em}
.pledge li{margin:.2em 0}
.techs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.refs-list{font-size:.78rem;color:var(--mute);columns:2 260px;column-gap:20px;margin:0;padding-left:1.1em}
.refs-list li{break-inside:avoid;margin-bottom:.35em}
details.src summary{cursor:pointer;font-weight:600}

@media (max-width:700px){
  .top{padding-top:10px}
  .brand span{display:none}
  main{padding:4px 10px}
  .panel{border-radius:20px;background:rgba(13,19,46,.88)}
  .bottom{padding:8px 10px 12px}
  .fsb{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01s!important}
}
</style>

<canvas id="bg" aria-hidden="true"></canvas>
<div class="app">
  <header class="top">
    <div class="brand"><i></i><span>Zihin Hattı</span></div>
    <nav class="map" id="map" aria-label="Duraklar"></nav>
  </header>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const LINES={
  kalkis:{n:'Kalkış',c:'#ffd27a'},
  odak:{n:'Odak Hattı',c:'#ffb547'},
  hafiza:{n:'Hafıza Hattı',c:'#45d4e6'},
  anlama:{n:'Anlama Hattı',c:'#b49bff'},
  beden:{n:'Beden Hattı',c:'#5fe3a1'},
  sinav:{n:'Sınav Hattı',c:'#ff7a6b'}
};
const LV={g:['Güçlü kanıt',3,'#5fe3a1'],o:['Orta kanıt',2,'#ffb547'],s:['Sınırlı / tartışmalı',1,'#ff7a6b'],i:['Etiketler nasıl okunur?',0,'#eef1ff']};

/* ---------- yardımcılar ---------- */
let reg={iv:[],rs:[],tok:0};
const every=(fn,ms)=>{reg.iv.push(setInterval(fn,ms))};
const later=(fn,ms)=>{reg.iv.push(setTimeout(fn,ms))};
const onResize=fn=>reg.rs.push(fn);
function clearReg(){reg.iv.forEach(id=>{clearInterval(id);clearTimeout(id)});reg={iv:[],rs:[],tok:reg.tok+1}}
function anim(fn){const t=reg.tok;const f=now=>{if(t!==reg.tok)return;if(fn(now)!==false)requestAnimationFrame(f)};requestAnimationFrame(f)}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem('zh_'+k));localStorage.setItem('zh_'+k,JSON.stringify(v))}catch(e){return null}}
function setupCanvas(cv,h){const dpr=Math.min(2,window.devicePixelRatio||1);const w=Math.max(200,cv.clientWidth||cv.parentElement.clientWidth-12);cv.width=w*dpr;cv.height=h*dpr;cv.style.height=h+'px';const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);return{ctx,w,h}}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const MUTE='#a3acd6',GRID='rgba(170,185,255,.14)';

/* ---------- 0 kapak ---------- */
function wCover(el){
  const L=[['odak','Bölünmeden, derin çalışmak'],['hafiza','Unutmayı yavaşlatmak, hatırlamak'],['anlama','Ezber değil, gerçekten anlamak'],['beden','Uyku, hareket, nefes'],['sinav','Deneme, hata, sınav anı']];
  el.innerHTML=`<div class="lines">${L.map(([k,t])=>`<button class="ln" data-l="${k}" style="--c:${LINES[k].c}"><i></i><span><b>${LINES[k].n}</b><small>${t}</small></span></button>`).join('')}</div>
  <div class="row"><button class="btn" id="go1">Yolculuğa başla</button><span class="tiny">Akıllı tahtada ← → tuşlarıyla, telefonda kaydırarak ilerle.</span></div>`;
  $('#go1',el).onclick=()=>go(1);
  $$('.ln',el).forEach(b=>b.onclick=()=>{const i=S.findIndex(s=>s.line===b.dataset.l);go(i)});
}

/* ---------- 1 dikkat kalıntısı ---------- */
function wResidue(el){
  el.innerHTML=`<div class="row"><button class="btn" id="rA" style="--b:#ff7a6b">Bildirimler açık</button><button class="btn" id="rB" style="--b:#5fe3a1">Telefon başka odada</button></div>
  <div class="cvwrap"><canvas id="rc"></canvas></div>
  <div class="legend"><span><i style="background:#ff7a6b"></i>Bildirimler açık · derin odak: <b id="rAo">—</b></span><span><i style="background:#5fe3a1"></i>Telefon uzakta · derin odak: <b id="rBo">—</b></span></div>
  <p class="tiny">45 dakikalık çalışmanın temsili modeli: her bildirimde odak düşer ve yavaşça yeniden ısınır. Rakamlar ölçüm değil, fikri göstermek için.</p>`;
  const cv=$('#rc',el);let C=setupCanvas(cv,210);const runs={};
  const model=on=>{const it=on?[8,17,27,36]:[];const p=[];let f=.2;for(let m=0;m<=45.001;m+=.25){if(it.some(t=>Math.abs(t-m)<.12))f=.18;f+=(.93-f)*.05;p.push([m,f])}return p};
  function draw(){const{ctx,w,h}=C;ctx.clearRect(0,0,w,h);const L=30,R=10,T=14,B=24;const X=m=>L+(w-L-R)*m/45,Y=f=>T+(h-T-B)*(1-f);
    ctx.font='11px "JetBrains Mono",monospace';ctx.lineWidth=1;
    for(let m=0;m<=45;m+=15){ctx.strokeStyle=GRID;ctx.beginPath();ctx.moveTo(X(m),T);ctx.lineTo(X(m),h-B);ctx.stroke();ctx.fillStyle=MUTE;ctx.textAlign=m===45?'right':m?'center':'left';ctx.fillText(m+' dk',X(m),h-7)}
    ctx.setLineDash([4,4]);ctx.strokeStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.moveTo(L,Y(.75));ctx.lineTo(w-R,Y(.75));ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#dfe3fb';ctx.textAlign='left';ctx.fillText('derin odak',L+4,Y(.75)-6);
    ctx.save();ctx.translate(12,h/2);ctx.rotate(-Math.PI/2);ctx.textAlign='center';ctx.fillStyle=MUTE;ctx.fillText('odak',0,0);ctx.restore();
    for(const k in runs){const r=runs[k];const n=Math.floor(r.p.length*r.t);if(n<2)continue;ctx.strokeStyle=r.c;ctx.lineWidth=2.6;ctx.beginPath();for(let i=0;i<n;i++){const[m,f]=r.p[i];i?ctx.lineTo(X(m),Y(f)):ctx.moveTo(X(m),Y(f))}ctx.stroke();
      if(r.on){r.it.forEach(t=>{if(t<=45*r.t){ctx.fillStyle=r.c;ctx.beginPath();ctx.arc(X(t),Y(.12),4,0,7);ctx.fill()}})}}
    if(runs.a){ctx.fillStyle='#ff7a6b';ctx.textAlign='left';ctx.fillText('● bildirim',L+4,Y(.04))}
  }
  function run(k,on,c,out){const p=model(on);runs[k]={p,t:0,c,on,it:[8,17,27,36]};const deep=p.filter(q=>q[1]>.75).length*.25;$(out,el).textContent='…';const t0=performance.now();
    anim(now=>{runs[k].t=Math.min(1,(now-t0)/2400);draw();if(runs[k].t>=1){$(out,el).textContent=Math.round(deep)+' dk';return false}})}
  $('#rA',el).onclick=()=>run('a',1,'#ff7a6b','#rAo');$('#rB',el).onclick=()=>run('b',0,'#5fe3a1','#rBo');
  draw();onResize(()=>{C=setupCanvas(cv,210);draw()});
}

/* ---------- 2 odak bloğu ---------- */
function wFocus(el){
  const items=['Telefon başka odada ya da kapalı','Masada yalnızca bu dersin malzemesi','Hedef yazılı: “30 paragraf sorusu”','Su, kalem ve müsvedde hazır'];
  el.innerHTML=`<div class="split"><div><div class="lbl">Kalkış kontrolü</div><div class="checks">${items.map((t,i)=>`<label class="chk"><input type="checkbox" id="fc${i}"><span>${t}</span></label>`).join('')}</div><div class="bar"><i id="fcB"></i></div><p class="tiny" id="fcT">0 / 4 hazır</p></div>
  <div class="timer"><div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" class="rb"/><circle cx="60" cy="60" r="52" class="rf" id="tR"/></svg><div class="tc"><b id="tN">25:00</b><span id="tL">Odak bloğu</span></div></div>
  <div class="seg" id="tSeg" style="align-self:center"><button data-m="25" class="on">25 dk</button><button data-m="40">40 dk</button><button data-m="50">50 dk</button></div>
  <div class="row center"><button class="btn" id="tGo">Başlat</button><button class="btn ghost" id="tRs">Sıfırla</button></div></div></div>
  <p class="tiny">Blok bitince mola: 25 ve 40 dakikada 5, 50 dakikada 10 dakika. Molada ekrana bakma; kalk, su iç, pencereden dışarı bak.</p>`;
  const upd=()=>{const n=items.filter((_,i)=>$('#fc'+i,el).checked).length;$('#fcB',el).style.width=n*25+'%';$('#fcT',el).textContent=n===4?'Hazırsın. Zamanlayıcıyı başlat.':n+' / 4 hazır'};
  items.forEach((_,i)=>$('#fc'+i,el).onchange=upd);
  let len=25,phase='odak',left=len*60,end=0,running=false;const CIR=2*Math.PI*52;const ring=$('#tR',el);ring.style.strokeDasharray=CIR;
  const brk=()=>len>=50?10:5;const go=$('#tGo',el);
  function show(){const tot=(phase==='odak'?len:brk())*60;const s=Math.ceil(left);$('#tN',el).textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');ring.style.strokeDashoffset=CIR*(1-left/tot);$('#tL',el).textContent=phase==='odak'?'Odak bloğu':'Mola zamanı';ring.style.stroke=phase==='odak'?'var(--lc)':'#5fe3a1'}
  function tick(){if(!running)return;left=Math.max(0,(end-Date.now())/1000);if(left<=0){if(phase==='odak'){phase='mola';left=brk()*60;end=Date.now()+left*1000}else{running=false;phase='odak';left=len*60;go.textContent='Yeni blok'}}show()}
  every(tick,250);
  go.onclick=()=>{running=!running;if(running){end=Date.now()+left*1000;go.textContent='Duraklat'}else go.textContent='Devam et'};
  const reset=()=>{running=false;phase='odak';left=len*60;go.textContent='Başlat';show()};
  $('#tRs',el).onclick=reset;
  $$('#tSeg button',el).forEach(b=>b.onclick=()=>{$$('#tSeg button',el).forEach(x=>x.classList.toggle('on',x===b));len=+b.dataset.m;reset()});
  show();
}

/* ---------- 3 unutma eğrisi ---------- */
function wCurve(el){
  const days=[1,3,7,14,21,27,29];const P={none:[],cram:[27,29],spaced:[1,3,7,14,21,27]};let sel=new Set(P.spaced);
  el.innerHTML=`<div class="seg" id="cP"><button data-p="none">Hiç tekrar yok</button><button data-p="cram">Son günlere yığma</button><button data-p="spaced" class="on">Aralıklı tekrar</button></div>
  <div class="cvwrap"><canvas id="cc"></canvas></div>
  <div><div class="lbl">Tekrar günleri · dokun, ekle ya da çıkar</div><div class="chips" id="cD">${days.map(d=>`<button data-d="${d}">${d}. gün</button>`).join('')}</div></div>
  <div class="legend"><span>Sınav günü (30. gün): <b id="cE">—</b></span><span>Sınavdan 15 gün sonra: <b id="cL">—</b></span></div>
  <p class="tiny">Temsili model: her tekrar bilgiyi tazeler ve sonraki unutmayı yavaşlatır. Gerçek oranlar konuya ve kişiye göre değişir; burada önemli olan eğrilerin şekli.</p>`;
  const cv=$('#cc',el);let C=setupCanvas(cv,220);
  function curve(){const rev=[...sel].sort((a,b)=>a-b);let S=1.4,last=0;const ev=[];for(const d of rev){const r=Math.exp(-(d-last)/S);S*=1.3+1.7*(1-r)*(r>.15?1:.3);last=d;ev.push([d,S])}
    return t=>{let s=1.4,l=0;for(const[d,ss]of ev){if(d<=t){s=ss;l=d}}return Math.exp(-(t-l)/s)}}
  let prog=1,R=curve();
  function draw(){const{ctx,w,h}=C;ctx.clearRect(0,0,w,h);const L=34,Rt=12,T=16,B=24,X=d=>L+(w-L-Rt)*d/45,Y=r=>T+(h-T-B)*(1-r);
    ctx.font='11px "JetBrains Mono",monospace';ctx.lineWidth=1;
    [0,.5,1].forEach(r=>{ctx.strokeStyle=GRID;ctx.beginPath();ctx.moveTo(L,Y(r));ctx.lineTo(w-Rt,Y(r));ctx.stroke();ctx.fillStyle=MUTE;ctx.textAlign='right';ctx.fillText(Math.round(r*100)+'%',L-5,Y(r)+4)});
    [0,15,30,45].forEach(d=>{ctx.fillStyle=MUTE;ctx.textAlign=d===45?'right':d?'center':'left';ctx.fillText(d+'. gün',X(d),h-7)});
    ctx.strokeStyle='#ff7a6b';ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(X(30),T-6);ctx.lineTo(X(30),h-B);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#ff7a6b';ctx.textAlign='center';ctx.fillText('SINAV',X(30),T-4+8);
    const end=45*prog;const col=getComputedStyle(document.documentElement).getPropertyValue('--lc').trim()||'#45d4e6';
    ctx.beginPath();ctx.moveTo(X(0),Y(0));for(let t=0;t<=end;t+=.05)ctx.lineTo(X(t),Y(R(t)));ctx.lineTo(X(end),Y(0));ctx.closePath();ctx.fillStyle=col+'2a';ctx.fill();
    ctx.beginPath();for(let t=0;t<=end;t+=.05){t?ctx.lineTo(X(t),Y(R(t))):ctx.moveTo(X(t),Y(R(t)))}ctx.strokeStyle=col;ctx.lineWidth=2.6;ctx.stroke();
    [...sel].forEach(d=>{if(d<=end){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(X(d),Y(1),4,0,7);ctx.fill()}});
  }
  function upd(){R=curve();$$('#cD button',el).forEach(b=>b.classList.toggle('on',sel.has(+b.dataset.d)));$('#cE',el).textContent=Math.round(R(30)*100)+'%';$('#cL',el).textContent=Math.round(R(45)*100)+'%';
    prog=0;const t0=performance.now();anim(now=>{prog=Math.min(1,(now-t0)/1100);draw();return prog<1})}
  $$('#cP button',el).forEach(b=>b.onclick=()=>{$$('#cP button',el).forEach(x=>x.classList.toggle('on',x===b));sel=new Set(P[b.dataset.p]);upd()});
  $$('#cD button',el).forEach(b=>b.onclick=()=>{const d=+b.dataset.d;sel.has(d)?sel.delete(d):sel.add(d);$$('#cP button',el).forEach(x=>x.classList.remove('on'));upd()});
  upd();onResize(()=>{C=setupCanvas(cv,220);draw()});
}

/* ---------- 4 geri çağırma / leitner ---------- */
const CARDS=[
 ['Fen Bilimleri','DNA’nın yapı birimi nedir?','Nükleotit'],
 ['Fen Bilimleri','Mevsimlerin oluşmasının iki nedeni nedir?','Dünya’nın eksen eğikliği ve Güneş etrafında dolanması'],
 ['İnkılap Tarihi','TBMM hangi tarihte açıldı?','23 Nisan 1920'],
 ['İnkılap Tarihi','Mustafa Kemal Samsun’a hangi tarihte çıktı?','19 Mayıs 1919'],
 ['Türkçe','Mecaz anlam nedir?','Sözcüğün gerçek anlamından uzaklaşarak kazandığı yeni anlam'],
 ['Matematik','√50 hangi iki ardışık tam sayı arasındadır?','7 ile 8 (49 < 50 < 64)'],
 ['Matematik','2⁻³ kaçtır?','1/8'],
 ['İngilizce','“Chop” ne demek?','Doğramak']];
function wLeitner(el){
  let box=store('leitner');if(!Array.isArray(box)||box.length!==CARDS.length)box=CARDS.map(()=>1);let idx=-1;
  el.innerHTML=`<div class="boxes">${[1,2,3].map(b=>`<div class="bx" id="bx${b}"><b>0</b><span>Kutu ${b}</span><small>${['her gün','2 günde bir','haftada bir'][b-1]}</small></div>`).join('')}</div>
  <div class="card3d" id="lc" role="button" tabindex="0" aria-label="Kartı çevir"><div class="cf front"><small id="lS"></small><p id="lQ"></p><em>Önce cevabı aklından söyle, sonra kartı çevir.</em></div><div class="cf back"><small>Cevap</small><p id="lA"></p></div></div>
  <div class="row center" id="lB"></div>`;
  const card=$('#lc',el),btns=$('#lB',el);
  function counts(hit){[1,2,3].forEach(b=>{const x=$('#bx'+b,el);$('b',x).textContent=box.filter(v=>v===b).length;x.classList.toggle('hit',b===hit)})}
  function next(){const min=Math.min(...box);if(min===3){card.classList.remove('flip');$('#lS',el).textContent='Tebrikler';$('#lQ',el).textContent='Bütün kartlar 3. kutuda.';btns.innerHTML='<button class="btn ghost" id="lR">Baştan başla</button>';$('#lR',el).onclick=()=>{box=CARDS.map(()=>1);store('leitner',box);counts();next()};return}
    const c=box.map((b,i)=>b===min&&i!==idx?i:-1).filter(i=>i>=0);idx=c.length?c[Math.floor(Math.random()*c.length)]:idx;
    card.classList.remove('flip');later(()=>{$('#lS',el).textContent=CARDS[idx][0]+' · Kutu '+box[idx];$('#lQ',el).textContent=CARDS[idx][1];$('#lA',el).textContent=CARDS[idx][2]},200);
    btns.innerHTML='<button class="btn" id="lF">Kartı çevir</button>';$('#lF',el).onclick=flip}
  function flip(){if(card.classList.contains('flip')||Math.min(...box)===3)return;card.classList.add('flip');
    btns.innerHTML='<button class="btn" style="--b:#ff7a6b" id="lN">Bilemedim → Kutu 1</button><button class="btn" style="--b:#5fe3a1" id="lY">Bildim → ileri</button>';
    $('#lN',el).onclick=()=>rate(false);$('#lY',el).onclick=()=>rate(true)}
  function rate(ok){box[idx]=ok?Math.min(3,box[idx]+1):1;store('leitner',box);counts(box[idx]);next()}
  card.onclick=flip;card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};
  counts();next();
}

/* ---------- 5 hafıza sarayı ---------- */
const LOCI=[
 {n:'Kapı',i:'Cumhuriyetçilik',t:'Kapının önünde bir seçim sandığı var. İçeri girmek için oyunu atman gerekiyor.',p:[-163,20,70],ry:42},
 {n:'Ayakkabılık',i:'Milliyetçilik',t:'Ayakkabılığın üstünde kocaman bir Türk bayrağı katlı duruyor; ayakkabılar ona hazır ol vaziyetinde.',p:[-150,60,-40],ry:30},
 {n:'Koltuk',i:'Halkçılık',t:'Koltukta çiftçi, doktor ve öğrenci omuz omuza oturuyor. Kimseye ayrıcalık yok, herkes eşit sıkışık.',p:[-60,64,-118],ry:14},
 {n:'Televizyon',i:'Devletçilik',t:'Ekranda devletin kurduğu dev bir fabrikanın açılışı var; bacalardan konfeti çıkıyor.',p:[20,-12,-143],ry:-4},
 {n:'Mutfak masası',i:'Laiklik',t:'Masada iki ayrı tabak var: biri din işleri, biri devlet işleri. Çatallar asla birbirine karışmıyor.',p:[118,64,-70],ry:-24},
 {n:'Pencere',i:'İnkılapçılık',t:'Pencereden eski bir at arabası çıkıp gidiyor, yerine ışıl ışıl yeni bir tren giriyor.',p:[163,-18,40],ry:-42}];
function wPalace(el){
  el.innerHTML=`<div class="scene" id="sc"><div class="room" id="rm">
   <div class="fc floor"></div>
   <div class="fc wall back"><div class="tv"></div></div>
   <div class="fc wall left"><div class="door"></div></div>
   <div class="fc wall right"><div class="win"></div></div>
   ${LOCI.map((l,i)=>`<div class="lo" data-i="${i}"><div class="pin"><span class="num">${i+1}</span><span class="nm">${l.n}</span></div></div>`).join('')}
  </div></div>
  <div class="box pinfo" id="pi"><h3><small>Örnek: Atatürk ilkeleri · 8. sınıf</small>Evinde 6 durak var</h3><p>Yürüyüşe başla. Her durakta bir ilkeyi tuhaf ve canlı bir sahneye dönüştüreceğiz. Sahne ne kadar tuhafsa o kadar akılda kalır.</p></div>
  <div class="row" id="pB"><button class="btn" id="pW">Yürüyüşe başla</button><button class="btn ghost" id="pT">Kendini test et</button></div>`;
  const sc=$('#sc',el),rm=$('#rm',el),los=$$('.lo',el),info=$('#pi',el),pb=$('#pB',el);let cur=-1,ry=20;
  function place(){const s=Math.min(1,(sc.clientWidth-20)/440);rm.style.setProperty('--s',s);rm.style.setProperty('--ry',ry+'deg');
    los.forEach((lo,i)=>{const[x,y,z]=LOCI[i].p;lo.style.transform=`translate3d(${x}px,${y}px,${z}px) rotateY(${-ry}deg) rotateX(17deg)`})}
  function at(i){cur=i;ry=LOCI[i].ry;place();los.forEach((l,k)=>l.classList.toggle('on',k===i));const L=LOCI[i];
    info.innerHTML=`<h3><small>Durak ${i+1} · ${L.n}</small>${L.i}</h3><p>${L.t}</p>`;
    pb.innerHTML=`<button class="btn ghost" id="pP" ${i?'':'disabled'}>← Geri</button><button class="btn" id="pN">${i<5?'Sonraki durak →':'Şimdi kendini test et'}</button>`;
    $('#pP',el).onclick=()=>at(i-1);$('#pN',el).onclick=()=>i<5?at(i+1):test()}
  function test(){ry=20;place();los.forEach(l=>l.classList.remove('on','ok'));let step=0;const ch=shuffle(LOCI.map(l=>l.i));
    info.innerHTML=`<h3><small>Test</small>Evinde yürü: 1. duraktan başla</h3><p>Her durakta ne vardı? İlkeleri yürüyüş sırasıyla seç.</p>`;
    pb.innerHTML=`<div class="chips" id="pc">${ch.map(c=>`<button>${c}</button>`).join('')}</div>`;
    $$('#pc button',el).forEach(b=>b.onclick=()=>{if(b.textContent===LOCI[step].i){b.disabled=true;b.classList.add('on');los[step].classList.add('ok');step++;
      if(step===6){info.innerHTML=`<h3><small>Sonuç</small>Altısını da sırayla hatırladın</h3><p>Şimdi aynı yöntemi kendi evinle dene: Kurtuluş Savaşı cepheleri, kongreler ya da fen terimleri için yeni bir rota kur.</p>`;pb.innerHTML='<button class="btn ghost" id="pW2">Yürüyüşü tekrarla</button>';$('#pW2',el).onclick=()=>at(0)}
      else info.querySelector('h3').lastChild.textContent=`Doğru. Şimdi ${step+1}. durak: ${LOCI[step].n}`}
     else{b.animate([{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'none'}],{duration:250});info.querySelector('p').textContent=`${LOCI[step].n} durağını hayal et. Orada ne görüyordun?`}})}

addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1);else if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1)});
let tx=0,ty=0;panel.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
panel.addEventListener('touchend',e=>{if(e.target.closest('.widget'))return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>70&&Math.abs(dy)<45)go(cur+(dx<0?1:-1))},{passive:true});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>reg.rs.forEach(f=>f()),150)});
const h=/^#d(\d+)$/.exec(location.hash||'');go(h?+h[1]:0);
})();
</script>
