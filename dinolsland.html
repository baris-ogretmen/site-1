<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7fd0ff">
<title>Dino Island — English for Kids</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#7fd0ff;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
/* ===== Dino Island learning overlay ===== */
html .pk-tl, html .pk-tool { display: none !important; }
.ln-bar { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--pad) + var(--sab)); display: flex; gap: calc(var(--u)*.55); pointer-events: auto; z-index: 6; transition: opacity .3s, transform .3s; max-width: calc(100vw - 16px); }
.ln-st { --c: #ff8a3d; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; width: calc(var(--u)*4.6); height: calc(var(--u)*5.2); border: 0; border-radius: calc(var(--u)*1.4); cursor: pointer;
  background: linear-gradient(180deg, #fffdf6, #fff1d6); box-shadow: inset 0 0 0 calc(var(--u)*.18) var(--c), 0 calc(var(--u)*.3) 0 color-mix(in srgb, var(--c) 70%, #000), 0 calc(var(--u)*.5) calc(var(--u)*1) rgba(0,0,0,.2); transition: transform .15s; touch-action: manipulation; }
.ln-st:active { transform: translateY(3px) scale(.94); }
.ln-st .ln-ic .emo { font-size: calc(var(--u)*2.1); display: block; animation: lnBob 2.6s ease-in-out infinite; }
.ln-st:nth-child(2) .emo { animation-delay: -.4s } .ln-st:nth-child(3) .emo { animation-delay: -.8s } .ln-st:nth-child(4) .emo { animation-delay: -1.2s } .ln-st:nth-child(5) .emo { animation-delay: -1.6s } .ln-st:nth-child(6) .emo { animation-delay: -2s }
.ln-st .ln-lb { font: 800 calc(var(--u)*.78)/1 var(--fd); color: var(--c); margin-top: calc(var(--u)*.25); }
.ln-st .ln-dots { font-size: calc(var(--u)*.6); color: #ffc21a; letter-spacing: .05em; margin-top: calc(var(--u)*.2); line-height: 1; }
.ln-st .ln-dots i { color: #e9dcc0; font-style: normal; }
@keyframes lnBob { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-4px) rotate(4deg); } }
html.ln-active .ln-bar, html.ln-busy .ln-bar, #pk.busy .ln-bar { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(30px); }
html.ln-active .pk-menus, html.ln-active .pk-act, html.ln-active .pk-prompt { opacity: 0 !important; pointer-events: none !important; }
/* move action button above the station bar */
.pk-br { bottom: calc(var(--pad) + var(--sab) + var(--u)*6.2) !important; }
.ln-word { --c: #ff8a3d; position: absolute; left: 50%; top: calc(var(--pad) + var(--sat) + var(--u)*4.6); transform: translateX(-50%) scale(.6); opacity: 0; pointer-events: none; z-index: 7;
  min-width: calc(var(--u)*12); max-width: min(92vw, calc(var(--u)*30)); padding: calc(var(--u)*.7) calc(var(--u)*1.4) calc(var(--u)*.8); text-align: center; border-radius: calc(var(--u)*1.6);
  background: linear-gradient(180deg, #fffdf6, #fff1d6); box-shadow: inset 0 0 0 calc(var(--u)*.2) var(--c), 0 calc(var(--u)*.35) 0 rgba(120,80,30,.35), 0 calc(var(--u)*.6) calc(var(--u)*1.4) rgba(0,0,0,.2); transition: opacity .25s, transform .3s cubic-bezier(.2,1.6,.4,1); }
.ln-word.on { opacity: 1; transform: translateX(-50%) scale(1); }
.ln-word.pop { animation: lnPop .45s cubic-bezier(.2,1.8,.4,1); }
@keyframes lnPop { 0% { transform: translateX(-50%) scale(.75); } 100% { transform: translateX(-50%) scale(1); } }
.ln-big { font: 900 calc(var(--u)*3.4)/1 var(--fd); color: var(--c); text-shadow: 0 3px 0 rgba(0,0,0,.12); }
.ln-big .emo { font-size: .85em; }
.ln-w { font: 900 calc(var(--u)*1.75)/1.1 var(--fd); color: #4a2f1c; margin-top: calc(var(--u)*.15); }
.ln-tr { font: 700 calc(var(--u)*.9)/1.2 var(--fb); color: #a07a58; margin-top: calc(var(--u)*.3); }
html.ln-notr .ln-tr { display: none; }
.ln-count { position: absolute; left: 50%; transform: translateX(-50%); top: calc(var(--pad) + var(--sat) + var(--u)*.4); display: none; gap: calc(var(--u)*.35); z-index: 8; pointer-events: none; flex-wrap: wrap; justify-content: center; max-width: 92vw; }
.ln-count.on { display: flex; }
.ln-count span { display: grid; place-items: center; width: calc(var(--u)*2.3); height: calc(var(--u)*2.3); border-radius: 50%; background: #fff8e8; color: #c9b08a; font: 900 calc(var(--u)*1.2)/1 var(--fd); box-shadow: inset 0 0 0 3px #ead6ad, 0 3px 0 rgba(0,0,0,.12); transition: all .3s cubic-bezier(.2,1.8,.4,1); }
.ln-count span.lit { background: #ff8a3d; color: #fff; box-shadow: inset 0 0 0 3px #fff, 0 3px 0 #c2571a; transform: scale(1.18); }
.ln-count span.lit:nth-child(2) { background: #f2c12e } .ln-count span.lit:nth-child(3) { background: #5cbf4f } .ln-count span.lit:nth-child(4) { background: #3fb6e8 } .ln-count span.lit:nth-child(5) { background: #a066e0 }
.ln-count span.lit:nth-child(6) { background: #ef6fae } .ln-count span.lit:nth-child(7) { background: #3cc2a8 } .ln-count span.lit:nth-child(8) { background: #e0703a } .ln-count span.lit:nth-child(9) { background: #5a7be0 } .ln-count span.lit:nth-child(10) { background: #ef5a5a }
.ln-choices { position: absolute; left: 50%; bottom: calc(var(--pad) + var(--sab) + var(--u)*.6); transform: translateX(-50%); display: none; gap: calc(var(--u)*.8); z-index: 8; pointer-events: auto; }
.ln-choices.on { display: flex; animation: lnUp .4s cubic-bezier(.2,1.6,.4,1); }
@keyframes lnUp { from { transform: translate(-50%, 40px); opacity: 0; } }
.ln-ch { display: flex; flex-direction: column; align-items: center; justify-content: center; width: calc(var(--u)*6); height: calc(var(--u)*6.4); border: 0; border-radius: calc(var(--u)*1.5); cursor: pointer; background: linear-gradient(180deg, #fffdf6, #fff1d6); box-shadow: inset 0 0 0 calc(var(--u)*.2) #a066e0, 0 calc(var(--u)*.35) 0 #6d3fae, 0 calc(var(--u)*.6) calc(var(--u)*1.2) rgba(0,0,0,.2); touch-action: manipulation; transition: transform .15s; }
.ln-ch .emo { font-size: calc(var(--u)*3); }
.ln-ch b { font: 900 calc(var(--u)*1)/1 var(--fd); color: #6d3fae; margin-top: calc(var(--u)*.3); }
.ln-ch:active { transform: scale(.93); }
.ln-ch.ok { box-shadow: inset 0 0 0 calc(var(--u)*.3) #5cbf4f, 0 calc(var(--u)*.35) 0 #3f9c36; transform: scale(1.08); }
.ln-ch.no { animation: lnShake .45s; }
@keyframes lnShake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
.ln-exit, .ln-repeat { position: absolute; top: calc(var(--pad) + var(--sat)); width: calc(var(--u)*3); height: calc(var(--u)*3); border: 0; border-radius: 50%; cursor: pointer; z-index: 9; display: none; place-items: center;
  font: 900 calc(var(--u)*1.4)/1 var(--fd); color: #fff; touch-action: manipulation; pointer-events: auto; }
.ln-exit { left: calc(var(--pad) + var(--sal)); background: #ef5a5a; box-shadow: inset 0 0 0 3px #fff, 0 4px 0 #b83a3a; }
.ln-repeat { left: calc(var(--pad) + var(--sal) + var(--u)*3.6); background: #3fb6e8; box-shadow: inset 0 0 0 3px #fff, 0 4px 0 #2381ad; }
.ln-repeat .emo { font-size: calc(var(--u)*1.4); }
html.ln-active .ln-exit, html.ln-active .ln-repeat { display: grid; }
.ln-trbtn { position: absolute; top: calc(var(--pad) + var(--sat)); left: calc(var(--pad) + var(--sal)); display: flex; align-items: center; gap: .4em; padding: .45em .9em; border: 0; border-radius: 99px; cursor: pointer; pointer-events: auto; z-index: 6;
  background: rgba(255,248,232,.92); color: #6b4a30; font: 700 calc(var(--u)*.72)/1 var(--fb); box-shadow: inset 0 0 0 2px #ead6ad, 0 3px 0 rgba(0,0,0,.1); }
.ln-trbtn .emo { font-size: 1.3em; }
html.ln-active .ln-trbtn { display: none; }
.ln-sb-top { font: 800 calc(var(--u)*1)/1.2 var(--fd); color: #6b4a30; margin-bottom: calc(var(--u)*.8); }
.ln-sb { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(var(--u)*4.4), 1fr)); gap: calc(var(--u)*.55); }
.ln-sk { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 0; border-radius: calc(var(--u)*1); background: #fff; box-shadow: inset 0 0 0 2px #ead6ad, 0 3px 0 rgba(0,0,0,.08); cursor: pointer; font: 900 calc(var(--u)*1.6)/1 var(--fd); color: #d9c6a2; }
.ln-sk .emo { font-size: calc(var(--u)*2.2); }
.ln-sk small { font: 800 calc(var(--u)*.62)/1 var(--fb); color: #8b6a4f; margin-top: .3em; }
.ln-sk.lock { background: #f6ecd7; }
.ln-sk.bop { animation: lnPop2 .4s cubic-bezier(.2,1.8,.4,1); }
@keyframes lnPop2 { 0% { transform: scale(.8); } 100% { transform: scale(1); } }
.ln-sb-hint { font: 600 calc(var(--u)*.75)/1.4 var(--fb); color: #a07a58; margin-top: calc(var(--u)*.9); }
@media (max-width: 560px) {
  .ln-bar { gap: 5px; }
  .ln-st { width: calc((100vw - 16px - 25px) / 6); height: calc((100vw - 16px - 25px) / 6 * 1.18); border-radius: 14px; }
  .ln-st .ln-ic .emo { font-size: 26px; } .ln-st .ln-lb { font-size: 10px; } .ln-st .ln-dots { font-size: 8px; }
  .ln-ch { width: 27vw; height: 29vw; } .ln-ch .emo { font-size: 13vw; }
  .ln-trbtn span:not(.emo) { display: none; }
}

/* ============================================================================
   50_ui.css — PAPATYA KOYU arayüzü (UI agent)
   ----------------------------------------------------------------------------
   REUSABLE CLASSES (use these inside menus you register with G.ui.registerMenu):
     .pk-panel          cream paper panel (rounded, soft lip shadow)
     .pk-btn            pill button (cream, chunky 3D lip, press animation)
     .pk-btn-primary    + green "go" button        .pk-btn-sun  yellow   .pk-btn-coral  red/pink
     .pk-btn[disabled] / .pk-btn.off   greyed out
     .pk-card           small white card for an item/shop entry (hover lift, .sel = selected)
     .pk-grid           responsive auto-fill grid of .pk-card (min ~7.5u)
     .pk-badge          round count/notification badge (top-right absolute when inside .pk-card)
     .pk-price          "120 🌰" price chip
     .pk-section        section heading with leaf underline
     .pk-tabs/.pk-tab   pill tab row (.on = active)
     .pk-bar > i        progress bar (set i style width:%)
     .pk-chip           tiny category chip
     .pk-empty          friendly empty-state box
   Size unit: var(--u) (≈16px phone … 30px 4K board). Fonts: var(--fd) display, var(--fb) body.
   ========================================================================== */
#pk {
  --u: clamp(16px, calc(0.55vw + 0.72vh + 4px), 30px);
  --fd: 'Baloo 2', 'Nunito', 'Varela Round', 'Quicksand', ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --fb: 'Nunito', 'Baloo 2', 'Varela Round', ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --cream: #fff8e8; --cream2: #fcefd2; --cream3: #f4e2bb; --line: #ead6ad;
  --ink: #5a3b26; --ink2: #8b6a4f; --ink3: #b59a7e;
  --leaf: #62c44c; --leaf2: #3f9c36; --leafl: #d9f3c9;
  --sun: #ffd23e; --sun2: #e7a516; --sunl: #fff1b8;
  --coral: #ff7d6b; --coral2: #d9503f; --berry: #ec6a9a; --sky: #4fc3ef; --sky2: #2894c5; --night: #4a4f9a;
  --sat: env(safe-area-inset-top, 0px); --sar: env(safe-area-inset-right, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px);
  --pad: calc(var(--u) * 0.9);
  position: fixed; inset: 0; pointer-events: none; z-index: 10;
  font-family: var(--fb); color: var(--ink); font-size: var(--u); line-height: 1.3;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
}
#pk * { box-sizing: border-box; }
#pk button { font-family: inherit; color: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
#pk .emo { font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', 'Twemoji Mozilla', sans-serif; font-weight: 400; line-height: 1; }
#pk.hideui .pk-hud, #pk.hideui .pk-prompt, #pk.hideui .pk-act, #pk.hideui .pk-toasts, #pk.hideui .pk-bubbles { display: none !important; }

/* ---------------------------------------------------------------- shared look */
.pk-panel {
  background:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,.55) 0 1px, transparent 1.5px) 0 0 / 11px 11px,
    radial-gradient(circle at 70% 80%, rgba(214,180,120,.13) 0 1px, transparent 1.6px) 0 0 / 17px 17px,
    linear-gradient(180deg, var(--cream) 0%, var(--cream2) 100%);
  border: calc(var(--u) * .2) solid #fffdf6;
  border-radius: calc(var(--u) * 1.6);
  box-shadow: 0 0 0 calc(var(--u) * .14) var(--line), 0 calc(var(--u) * .5) 0 calc(var(--u) * .14) #dcc195, 0 calc(var(--u) * 1) calc(var(--u) * 2.4) rgba(70, 45, 20, .32);
}
.pk-btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: .4em;
  min-height: max(48px, calc(var(--u) * 2.7)); padding: 0 calc(var(--u) * 1.2);
  font: 800 var(--u)/1 var(--fd); letter-spacing: .01em; color: var(--ink);
  background: linear-gradient(180deg, #fffefa, #fbefd6); border: 0; border-radius: 999px; cursor: pointer;
  box-shadow: inset 0 0 0 calc(var(--u) * .12) rgba(214, 186, 140, .65), 0 calc(var(--u) * .28) 0 #d8bd8f, 0 calc(var(--u) * .45) calc(var(--u) * .6) rgba(90, 60, 30, .18);
  transition: transform .12s cubic-bezier(.3,1.6,.5,1), box-shadow .12s, filter .15s; white-space: nowrap; pointer-events: auto;
}
.pk-btn:hover { transform: translateY(-2px); filter: brightness(1.03); }
.pk-btn:active, .pk-btn.press { transform: translateY(calc(var(--u) * .22)); box-shadow: inset 0 0 0 calc(var(--u) * .12) rgba(214,186,140,.65), 0 calc(var(--u) * .06) 0 #d8bd8f; }
.pk-btn:focus-visible { outline: calc(var(--u) * .2) solid var(--sky); outline-offset: 3px; }
.pk-btn-primary { color: #fff; text-shadow: 0 2px 0 rgba(30, 90, 20, .35); background: linear-gradient(180deg, #8ee06f, var(--leaf) 55%, #55b742); box-shadow: inset 0 calc(var(--u)*.14) 0 rgba(255,255,255,.35), 0 calc(var(--u) * .28) 0 var(--leaf2), 0 calc(var(--u) * .45) calc(var(--u) * .6) rgba(40, 90, 20, .3); }
.pk-btn-primary:active { box-shadow: 0 calc(var(--u) * .06) 0 var(--leaf2); }
.pk-btn-sun { color: #6b4300; text-shadow: 0 1px 0 rgba(255,255,255,.5); background: linear-gradient(180deg, #ffe68a, var(--sun) 60%, #ffc61f); box-shadow: inset 0 calc(var(--u)*.14) 0 rgba(255,255,255,.45), 0 calc(var(--u) * .28) 0 var(--sun2), 0 calc(var(--u) * .45) calc(var(--u) * .6) rgba(120, 80, 0, .28); }
.pk-btn-sun:active { box-shadow: 0 calc(var(--u) * .06) 0 var(--sun2); }
.pk-btn-coral { color: #fff; text-shadow: 0 2px 0 rgba(120,30,20,.3); background: linear-gradient(180deg, #ffa293, var(--coral) 60%, #f76a57); box-shadow: inset 0 calc(var(--u)*.14) 0 rgba(255,255,255,.3), 0 calc(var(--u) * .28) 0 var(--coral2), 0 calc(var(--u) * .45) calc(var(--u) * .6) rgba(120, 40, 20, .28); }
.pk-btn-coral:active { box-shadow: 0 calc(var(--u) * .06) 0 var(--coral2); }
.pk-btn[disabled], .pk-btn.off { filter: grayscale(.85) opacity(.6); cursor: default; transform: none !important; }
.pk-btn .emo { font-size: 1.25em; }
.pk-card {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u)*.2);
  padding: calc(var(--u) * .6) calc(var(--u) * .4); background: #fffdf8; border-radius: calc(var(--u) * 1);
  box-shadow: inset 0 0 0 calc(var(--u)*.12) #f0e0bf, 0 calc(var(--u)*.22) 0 #e6d1a6; cursor: pointer; pointer-events: auto;
  transition: transform .15s cubic-bezier(.3,1.6,.5,1), box-shadow .15s; text-align: center;
}
.pk-card:hover { transform: translateY(-3px) rotate(-.6deg); }
.pk-card.sel { box-shadow: inset 0 0 0 calc(var(--u)*.2) var(--leaf), 0 calc(var(--u)*.22) 0 var(--leaf2), 0 0 0 calc(var(--u)*.3) rgba(98,196,76,.25); background: #f6ffef; }
.pk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(var(--u) * 7.2), 1fr)); gap: calc(var(--u) * .7); }
.pk-badge {
  display: inline-flex; align-items: center; justify-content: center; min-width: calc(var(--u)*1.45); height: calc(var(--u)*1.45); padding: 0 .35em;
  font: 800 calc(var(--u)*.85)/1 var(--fd); color: #fff; background: var(--coral); border-radius: 999px; box-shadow: 0 0 0 calc(var(--u)*.14) #fff, 0 2px 4px rgba(0,0,0,.2);
}
.pk-card > .pk-badge { position: absolute; top: calc(var(--u)*-.35); right: calc(var(--u)*-.35); }
.pk-price { display: inline-flex; align-items: center; gap: .25em; padding: .15em .6em; font: 800 calc(var(--u)*.9)/1.2 var(--fd); color: #7a4d10; background: var(--sunl); border-radius: 999px; box-shadow: inset 0 0 0 2px #f6dc8a; white-space: nowrap; }
.pk-section { display: flex; align-items: center; gap: .5em; margin: calc(var(--u)*.9) 0 calc(var(--u)*.6); font: 800 calc(var(--u)*1.1)/1.1 var(--fd); color: var(--ink); }
.pk-section::after { content: ''; flex: 1; height: calc(var(--u)*.22); border-radius: 9px; background: repeating-linear-gradient(90deg, var(--leafl) 0 calc(var(--u)*.7), transparent 0 calc(var(--u)*1)); }
.pk-tabs { display: flex; gap: calc(var(--u)*.45); overflow-x: auto; padding: calc(var(--u)*.2) calc(var(--u)*.1) calc(var(--u)*.55); scrollbar-width: none; touch-action: pan-x; }
.pk-tabs::-webkit-scrollbar { display: none; }
.pk-tab { flex: none; display: inline-flex; align-items: center; gap: .35em; min-height: max(48px, calc(var(--u)*2.5)); padding: 0 calc(var(--u)*.9); font: 800 calc(var(--u)*.95)/1 var(--fd); color: var(--ink2); background: rgba(255,255,255,.6); border: 0; border-radius: 999px; box-shadow: inset 0 0 0 2px var(--line); cursor: pointer; pointer-events: auto; transition: all .15s; }
.pk-tab.on { color: #fff; background: var(--acc, var(--leaf)); box-shadow: 0 calc(var(--u)*.2) 0 rgba(0,0,0,.15); transform: translateY(-1px); }
.pk-bar { position: relative; height: calc(var(--u)*.7); border-radius: 99px; background: rgba(140, 100, 50, .14); overflow: hidden; box-shadow: inset 0 2px 0 rgba(0,0,0,.06); }
.pk-bar > i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: linear-gradient(180deg, #9be37e, var(--leaf)); box-shadow: inset 0 -2px 0 rgba(0,0,0,.1); transition: width .6s cubic-bezier(.2,1.2,.4,1); }
.pk-chip { display: inline-flex; align-items: center; gap: .3em; padding: .2em .65em; font: 800 calc(var(--u)*.8)/1.2 var(--fb); color: var(--ink2); background: rgba(255,255,255,.75); border-radius: 99px; box-shadow: inset 0 0 0 2px var(--line); }
.pk-empty { padding: calc(var(--u)*2) var(--u); text-align: center; color: var(--ink2); font-weight: 800; background: rgba(255,255,255,.5); border-radius: calc(var(--u)*1.2); border: 3px dashed var(--line); }
.pk-empty .emo { display: block; font-size: calc(var(--u)*3); margin-bottom: .3em; }

/* ---------------------------------------------------------------- title */
.pk-title {
  position: fixed; inset: 0; pointer-events: auto; z-index: 50; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: linear-gradient(180deg, #74cdf7 0%, #a9e3ff 46%, #e3f7ff 78%, #fff6d8 100%);
  transition: background 1.2s ease, opacity .6s ease, transform .6s ease;
}
.pk-title::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 60% 45% at 50% 38%, rgba(255,255,255,.55), transparent 70%); pointer-events: none; transition: opacity 1s; }
.pk-title.ready { background: linear-gradient(180deg, rgba(110,200,250,.62) 0%, rgba(160,220,255,.25) 40%, rgba(255,255,255,0) 62%, rgba(60,40,20,.28) 100%); }
.pk-title.ready::before { opacity: .55; }
.pk-title.out { opacity: 0; pointer-events: none; }
.pk-title.out .pk-logo { transform: translateY(-30vh) scale(.8); }
.pk-title.picker-mode { background: linear-gradient(90deg, rgba(255,250,235,0) 35%, rgba(60,40,20,.12) 100%); }

// Patches three.js' project_vertex chunk so EVERY built-in material bends away
// with distance from the camera, like the classic cozy-village camera.
// Shadow depth passes (DEPTH_PACKING / DISTANCE) are NOT bent, so shadow lookups

THREE.ShaderChunk.project_vertex = /* glsl */`
vec4 mvPosition = vec4( transformed, 1.0 );
#ifdef USE_BATCHING
  mvPosition = batchingMatrix * mvPosition;
#endif
#ifdef USE_INSTANCING
  mvPosition = instanceMatrix * mvPosition;
#endif

  { float bd = max( -mvPosition.z - ${G.BEND.start.toFixed(2)}, 0.0 ); mvPosition.y -= bd * bd * ${G.BEND.k.toFixed(5)}; }

// ---------------------------------------------------------------- post-processing
{

W.paths = [
  [[0, 2], [8, 3], [14, 3]],
  [[0, 2], [-8, 8], [-17, 10]],
  [[0, 2], [-12, -2], [-24, -4]],
  [[0, 2], [-6, -8], [-11, -14]],
  [[0, 2], [5, -7], [8, -13]],
  [[0, 2], [-4, -14], [-6, -24], [-6, -35]],
  [[14, 3], [24, -2], [30.4, -6.5], [38, -7], [45, -5]],
  [[0, 2], [3, 14], [11, 25]],
  [[-8, 8], [-20, 18], [-28, 23]],
  [[0, 2], [2, 18], [4, 36], [6, 52]],
  [[24, -2], [36, 8], [47.5, 15.6], [55, 24]],
];
W.pathWidth = 1.7;

function distToSeg(px, pz, ax, az, bx, bz) {
  const dx = bx - ax, dz = bz - az; const l2 = dx * dx + dz * dz;
  let t = l2 ? ((px - ax) * dx + (pz - az) * dz) / l2 : 0; t = G.clamp(t, 0, 1);
  const qx = ax + dx * t - px, qz = az + dz * t - pz; return Math.sqrt(qx * qx + qz * qz);
}
function distToPolyline(px, pz, pts) { let d = 1e9; for (let i = 0; i < pts.length - 1; i++) d = Math.min(d, distToSeg(px, pz, pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1])); return d; }
G.distToSeg = distToSeg; G.distToPolyline = distToPolyline;

// island coast distance (positive = inland)
W.coastDist = (x, z) => {
  const a = Math.atan2(z, x);
  const edge = 64 + 5 * Math.sin(a * 3 + 0.7) + 4 * Math.sin(a * 5 - 1.3) + 5 * G.fbm(Math.cos(a) * 1.4 + 3, Math.sin(a) * 1.4 + 7, 3);
  // stretch island a bit wider east-west and push south beach out
  const r = Math.sqrt((x * 0.92) ** 2 + (z * (z > 0 ? 0.93 : 1.0)) ** 2);
  return edge - r;
};
// plateau mask 0..1 (north area)
W.plateauBoundaryZ = (x) => -27.5 + 2.2 * Math.sin(x * 0.11 + 1.0) + 1.5 * G.noise2(x * 0.07, 4.2);
W.rampAt = (x, z) => {
  for (const r of W.ramps) {
    const lx = x - r.x, lz = z - r.z; const along = lx * r.dirX + lz * r.dirZ; const side = Math.abs(lx * r.dirZ - lz * r.dirX);
    if (side < r.width / 2 + 1.2 && along > -r.len / 2 - 1 && along < r.len / 2 + 1) {
      return { t: G.clamp((along + r.len / 2) / r.len, 0, 1), side, inner: side < r.width / 2 };
    }
  }
  return null;
};
// raw terrain (no water carving)
W._landHeight = (x, z) => {
  const c = W.coastDist(x, z);
  if (c < 0) return Math.max(-4, -0.4 + c * 0.22);
  let h = G.lerp(-0.4, W.BEACH_Y, G.smooth(0, 3.5, c));
  h = G.lerp(h, W.GROUND_Y, G.smooth(5.5, 10, c));
  h += 0.12 * G.fbm(x * 0.06, z * 0.06, 3) * G.smooth(8, 14, c);
  // plateau
  const bz = W.plateauBoundaryZ(x);
  const inland = G.smooth(9, 13, c);
  let p = G.smooth(bz + 0.35, bz - 0.35, z) * inland; // steep cliff (~0.7 wide)
  const rp = W.rampAt(x, z);
  if (rp && inland > 0.5) {
    const want = G.smooth(0, 1, rp.t);
    const blend = G.smooth(rp.side > 0 ? W.ramps[0].width / 2 + 1.2 : 0, W.ramps[0].width / 2, rp.side);
    p = G.lerp(p, want * inland, blend);
  }
  h += p * (W.PLATEAU_Y - W.GROUND_Y);
  // gentle plateau undulation
  h += p * 0.1 * G.fbm(x * 0.09 + 9, z * 0.09, 2);
  return h;
};
W.waterAt = (x, z) => {
  // returns {surfaceY, depthFactor 0..1, kind} for river/pond, or null
  const dr = distToPolyline(x, z, W.river.points);
  if (dr < W.river.width + 0.6) return { surfaceY: W.river.surfaceY, d: dr, w: W.river.width, kind: 'river' };
  for (const p of W.ponds) { const d = Math.hypot(x - p.x, z - p.z); if (d < p.r + 0.6) return { surfaceY: p.surfaceY, d, w: p.r, kind: 'pond', pond: p }; }
  return null;
};
W.heightAt = (x, z) => {
  let h = W._landHeight(x, z);
  const dr = distToPolyline(x, z, W.river.points);
  const rw = W.river.width;
  if (dr < rw + 1.4 && h > 0.3) {
    const bed = W.river.surfaceY - 0.75 + 0.25 * G.smooth(0, rw, dr);
    h = G.lerp(h, Math.min(h, bed), G.smooth(rw + 1.3, rw - 0.3, dr));
  }
  for (const p of W.ponds) {
    const d = Math.hypot(x - p.x, z - p.z);
    if (d < p.r + 1.5) { const bed = p.surfaceY - 0.9 + 0.5 * G.smooth(0, p.r, d); h = G.lerp(h, Math.min(h, bed), G.smooth(p.r + 1.4, p.r - 0.4, d)); }
  }
  return h;
};
W.normalAt = (x, z, out = new THREE.Vector3()) => {
  const e = 0.25; const hL = W.heightAt(x - e, z), hR = W.heightAt(x + e, z), hD = W.heightAt(x, z - e), hU = W.heightAt(x, z + e);
  return out.set(hL - hR, 2 * e, hD - hU).normalize();
};
W.pathDist = (x, z) => { let d = 1e9; for (const p of W.paths) d = Math.min(d, distToPolyline(x, z, p)); return d; };
// surface type for texturing/spawning: 'sea' 'water' 'sand' 'grass' 'path' 'cliff' 'plaza'
W.typeAt = (x, z) => {
  const c = W.coastDist(x, z);
  if (c < 0.2) return 'sea';
  const w = W.waterAt(x, z); if (w && w.d < w.w - 0.2) return 'water';
  if (c < 6.5) return 'sand';
  const n = W.normalAt(x, z); if (n.y < 0.72) return 'cliff';
  if (Math.hypot(x - W.places.plaza.x, z - W.places.plaza.z) < W.places.plaza.r) return 'plaza';
  if (W.pathDist(x, z) < W.pathWidth * 0.55) return 'path';
  return 'grass';
};
W.bridgeAt = (x, z) => {
  for (const b of W.bridges) {
    const ca = Math.cos(b.angle), sa = Math.sin(b.angle); const lx = x - b.x, lz = z - b.z;
    const along = lx * ca + lz * sa, side = -lx * sa + lz * ca; // bridge runs along its local x
    if (Math.abs(along) < b.len / 2 && Math.abs(side) < b.width / 2) {
      const t = along / (b.len / 2); return { b, y: W.GROUND_Y + 0.25 + 0.35 * (1 - t * t) };
    }
  }
  return null;
};
// walking height (bridges override terrain)
W.walkHeight = (x, z) => { const br = W.bridgeAt(x, z); return br ? Math.max(br.y, W.heightAt(x, z)) : W.heightAt(x, z); };
W.isWalkable = (x, z, fromY) => {
  if (W.bridgeAt(x, z)) return true;
  const c = W.coastDist(x, z); if (c < 1.0) return false;
  const h = W.heightAt(x, z);
  const w = W.waterAt(x, z); if (w && h < w.surfaceY - 0.15) return false;
  if (fromY !== undefined && Math.abs(h - fromY) > 0.55) return false; // cliffs
  return true;
};
// reserved spots other modules must keep clear of decorations (x,z,r)
W.reserved = [];
W.reserve = (x, z, r) => W.reserved.push({ x, z, r });
W.isFree = (x, z, r = 0) => {
  for (const s of W.reserved) if (Math.hypot(x - s.x, z - s.z) < s.r + r) return false;
  if (W.pathDist(x, z) < W.pathWidth + r) return false;
  if (W.bridgeAt(x, z)) return false;
  if (W.rampAt(x, z)) return false;
  return true;
};
W.reserve(W.places.plaza.x, W.places.plaza.z, W.places.plaza.r + 1);
W.reserve(W.places.shop.x, W.places.shop.z, 7);
W.reserve(W.places.playerHouse.x, W.places.playerHouse.z, 6);
W.places.villagerHouses.forEach(h => W.reserve(h.x, h.z, 5.2));
W.reserve(W.places.pier.x, W.places.pier.z - 4, 4);
W.reserve(W.waterfall.x, W.waterfall.z, 4);

// ---------------------------------------------------------------- colliders (circles + optional boxes)
G.colliders = {
  list: [],
  add(x, z, r, tag) { const c = { x, z, r, tag, on: true }; this.list.push(c); return c; },
  addBox(x, z, hw, hd, rot = 0, tag) { const c = { box: true, x, z, hw, hd, rot, tag, on: true }; this.list.push(c); return c; },
  remove(c) { const i = this.list.indexOf(c); if (i >= 0) this.list.splice(i, 1); },
  // push point (x,z) with radius r out of colliders; returns [x,z]
  resolve(x, z, r) {
    for (const c of this.list) {
      if (!c.on) continue;
      if (c.box) {
        const ca = Math.cos(c.rot), sa = Math.sin(c.rot); const lx = (x - c.x) * ca + (z - c.z) * sa, lz = -(x - c.x) * sa + (z - c.z) * ca;
        const qx = G.clamp(lx, -c.hw, c.hw), qz = G.clamp(lz, -c.hd, c.hd); const dx = lx - qx, dz = lz - qz; const d = Math.hypot(dx, dz);
        if (d < r) { let nx, nz, pen; if (d > 1e-4) { nx = dx / d; nz = dz / d; pen = r - d; } else { const ox = c.hw - Math.abs(lx), oz = c.hd - Math.abs(lz); if (ox < oz) { nx = Math.sign(lx) || 1; nz = 0; pen = ox + r; } else { nx = 0; nz = Math.sign(lz) || 1; pen = oz + r; } }
          const wx = nx * ca - nz * sa, wz = nx * sa + nz * ca; x += wx * pen; z += wz * pen; }
      } else {
        const dx = x - c.x, dz = z - c.z; const d = Math.hypot(dx, dz); const m = c.r + r;
        if (d < m && d > 1e-5) { x = c.x + dx / d * m; z = c.z + dz / d * m; }
      }
    }
    return [x, z];
  },
};

// ---------------------------------------------------------------- interactables
// add({x,z, r=1.6, label:'Konuş', icon:'💬', priority=0, getPos?:()=>({x,z}), enabled?:()=>bool, onInteract(G)})
G.interact = {
  list: [], current: null,
  add(o) { o.r ??= 1.7; o.priority ??= 0; this.list.push(o); return o; },
  remove(o) { const i = this.list.indexOf(o); if (i >= 0) this.list.splice(i, 1); if (this.current === o) this.current = null; },
  update() {
    const p = G.player.pos; let best = null, bs = 1e9;
    if (!G.state.busy) for (const o of this.list) {
      if (o.enabled && !o.enabled()) continue;
      const q = o.getPos ? o.getPos() : o; const d = Math.hypot(q.x - p.x, q.z - p.z);
      if (d > o.r) continue;
      // prefer things in front of the player
      const fx = Math.sin(G.player.facing), fz = Math.cos(G.player.facing);
      const dot = d > 0.01 ? ((q.x - p.x) * fx + (q.z - p.z) * fz) / d : 1;
      const s = d - dot * 0.8 - o.priority;
      if (s < bs) { bs = s; best = o; }
    }
    if (best !== this.current) { this.current = best; G.emit('interact:focus', best); }
  },
  trigger() { const o = this.current; if (o && !G.state.busy) { try { o.onInteract(G); } catch (e) { console.error(e); } } },
};

// ---------------------------------------------------------------- items + inventory
G.items = {
  defs: {},
  // define({id, name, icon (emoji), price (sell), category:'meyve'|'çiçek'|'böcek'|'balık'|'mobilya'|'malzeme'|'kıyafet'|'özel', desc})
  define(d) { this.defs[d.id] = d; return d; },
  get(id) { return this.defs[id]; },
};
G.inv = {
  MAX_SLOTS: 20,
  get coins() { return G.save.get('coins', 300); },
  set coins(v) { G.save.set('coins', Math.max(0, Math.floor(v))); G.emit('coins', this.coins); },
  get items() { return G.save.get('inv', {}); },
  count(id) { return this.items[id] || 0; },
  slotsUsed() { return Object.keys(this.items).length; },
  canAdd(id) { return this.items[id] || this.slotsUsed() < this.MAX_SLOTS; },
  add(id, n = 1) {
    if (!this.canAdd(id)) { G.emit('inv:full', id); return false; }
    const it = { ...this.items }; it[id] = (it[id] || 0) + n; G.save.set('inv', it);
    const seen = G.save.get('seen', {}); if (!seen[id]) { seen[id] = Date.now(); G.save.set('seen', seen); G.emit('collect:new', id); }
    G.emit('inv:add', id, n); G.emit('inv', it); return true;
  },
  remove(id, n = 1) { const it = { ...this.items }; if ((it[id] || 0) < n) return false; it[id] -= n; if (it[id] <= 0) delete it[id]; G.save.set('inv', it); G.emit('inv', it); return true; },
};

// ---------------------------------------------------------------- time (real-world clock by default)
G.time = {
  override: G.params.has('h') ? parseFloat(G.params.get('h')) : null,
  speed: 1, hour: 12, day: 0, elapsed: 0,
  update(dt) {
    this.elapsed += dt;
    if (this.override !== null) this.hour = this.override;
    else { const d = new Date(); this.hour = d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600; }
    this.day = Math.floor(Date.now() / 864e5);
    this.isNight = this.hour < 6 || this.hour >= 19.5;
  },
  set(h) { this.override = h; },
};

// ---------------------------------------------------------------- game state
G.state = { started: false, busy: false, paused: false }; // busy: dialog/menu/minigame open → player frozen

// ---------------------------------------------------------------- input
G.updaters = [];
G.input = { x: 0, z: 0, run: false, keys: {}, joy: { active: false, x: 0, z: 0 } };
addEventListener('keydown', e => {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  G.input.keys[e.code] = true;
  if (['Space', 'KeyE', 'Enter'].includes(e.code)) { e.preventDefault(); G.emit('key:action', e.code); if (!G.state.busy && G.state.started) G.interact.trigger(); }
  if (e.code === 'Escape' || e.code === 'KeyI' || e.code === 'Tab') { e.preventDefault(); G.emit('key:menu', e.code); }
});
addEventListener('keyup', e => { G.input.keys[e.code] = false; });
addEventListener('blur', () => { G.input.keys = {}; });
G.input.update = () => {
  const k = G.input.keys; let x = 0, z = 0;
  if (k.KeyA || k.ArrowLeft) x -= 1; if (k.KeyD || k.ArrowRight) x += 1;
  if (k.KeyW || k.ArrowUp) z -= 1; if (k.KeyS || k.ArrowDown) z += 1;
  let run = !!(k.ShiftLeft || k.ShiftRight);
  if (G.input.joy.active) { x = G.input.joy.x; z = G.input.joy.z; run = Math.hypot(x, z) > 0.85; }
  const l = Math.hypot(x, z); if (l > 1) { x /= l; z /= l; }
  G.input.x = x; G.input.z = z; G.input.run = run;
};
// Pointer input for every device:
//  • touch/pen: drag = floating joystick, quick tap = walk there / interact, two fingers = pinch zoom
//  • mouse (PC, and smart boards that report touch as mouse): click = walk there / interact,
//    press & hold = keep walking towards the pointer, wheel = zoom
{
  const joy = document.createElement('div'); joy.id = 'joy'; joy.innerHTML = '<div id="joy-knob"></div>'; document.body.appendChild(joy);
  const knob = joy.querySelector('#joy-knob');
  const R = () => G.device === 'board' ? 90 : G.device === 'tablet' ? 70 : 56;
  const touches = new Map(); // pointerId -> {x,y,sx,sy,t}
  let joyId = null, pinch = null, mouse = null;
  G.clickTarget = null;
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  function groundAt(cx, cy) {
    const r = canvas.getBoundingClientRect();
    ndc.set((cx - r.left) / r.width * 2 - 1, -(cy - r.top) / r.height * 2 + 1); ray.setFromCamera(ndc, camera);
    const o = ray.ray.origin, d = ray.ray.direction;
    for (let t = 2; t < 140; t += 0.25) { const x = o.x + d.x * t, z = o.z + d.z * t, y = o.y + d.y * t; if (y <= W.walkHeight(x, z)) return { x, z }; }
    return null;
  }
  function walkTo(cx, cy, allowInteract = true) {
    const g = groundAt(cx, cy); if (!g) return;
    let it = null;
    if (allowInteract) { let bd = G.device === 'phone' ? 1.6 : 1.3; for (const q of G.interact.list) { if (q.enabled && !q.enabled()) continue; const p = q.getPos ? q.getPos() : q; const d = Math.hypot(p.x - g.x, p.z - g.z); if (d < bd) { bd = d; it = q; } } }
    G.clickTarget = { x: g.x, z: g.z, it }; G.emit('click:ground', g.x, g.z);
  }
  G.walkTo = walkTo;
  const canPlay = () => G.state.started && !G.state.busy;
  canvas.addEventListener('pointerdown', e => {
    if (!canPlay()) return;
    if (e.pointerType === 'mouse') {
      if (e.button !== 0) return;
      mouse = { x: e.clientX, y: e.clientY, t: performance.now(), hold: false };
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      return;
    }
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: performance.now() });
    if (touches.size === 2) { // start pinch, cancel joystick
      endJoy(); const [p1, p2] = [...touches.values()]; pinch = { d: Math.hypot(p1.x - p2.x, p1.y - p2.y), dist: G.cam.dist };
    } else if (touches.size === 1) {
      joyId = e.pointerId; joy.classList.remove('rest'); joy.style.left = e.clientX + 'px'; joy.style.top = e.clientY + 'px';
      G.input.joy.x = G.input.joy.z = 0;
    }
  });
  addEventListener('pointermove', e => {
    if (mouse && e.pointerType === 'mouse') { mouse.x = e.clientX; mouse.y = e.clientY; return; }
    const tp = touches.get(e.pointerId); if (!tp) return; tp.x = e.clientX; tp.y = e.clientY;
    if (pinch && touches.size >= 2) { const [p1, p2] = [...touches.values()]; const d = Math.hypot(p1.x - p2.x, p1.y - p2.y); G.cam.dist = G.clamp(pinch.dist * pinch.d / Math.max(20, d), G.cam.minDist, G.cam.maxDist); return; }
    if (e.pointerId === joyId) {
      let dx = e.clientX - tp.sx, dy = e.clientY - tp.sy; const l = Math.hypot(dx, dy); const r = R();
      if (l > 10 && !G.input.joy.active) { G.input.joy.active = true; joy.classList.add('on'); G.clickTarget = null; }
      if (l > r) { dx *= r / l; dy *= r / l; }
      knob.style.transform = `translate(${dx}px,${dy}px)`; G.input.joy.x = dx / r; G.input.joy.z = dy / r;
    }
  });
  function endJoy() { joyId = null; joy.classList.remove('on'); knob.style.transform = ''; G.input.joy.active = false; G.input.joy.x = G.input.joy.z = 0; restJoy(); }
  // touch devices: the stick rests visibly at bottom-left so kids know where to drag
  function restJoy() {
    if (!G.isTouch || joyId !== null) return;
    const show = G.state.started && !G.state.busy;
    const rad = joy.offsetWidth / 2 || 66, h = window.visualViewport?.height || innerHeight;
    joy.style.left = (rad + 22 + (G.device === 'board' ? 20 : 0)) + 'px';
    joy.style.top = (h - (G.viewInset?.bottom || 0) - rad - (G.device === 'phone' ? 34 : 44)) + 'px';
    joy.classList.toggle('rest', show);
  }
  G.on('start', restJoy); G.on('resize', restJoy); G.on('viewinset', restJoy);
  { let lastBusy = null; G.updaters.push(() => { if (G.state.busy !== lastBusy) { lastBusy = G.state.busy; restJoy(); } }); }
  const end = e => {
    if (mouse && e.pointerType === 'mouse') {
      const m = mouse; mouse = null; G.input.mouseHold = null;
      if (!m.hold && canPlay() && performance.now() - m.t < 450) walkTo(e.clientX, e.clientY);
      else if (m.hold) G.clickTarget = null;
      return;
    }
    const tp = touches.get(e.pointerId); if (!tp) return; touches.delete(e.pointerId);
    if (e.pointerId === joyId) {
      const moved = Math.hypot(tp.x - tp.sx, tp.y - tp.sy);
      const wasJoy = G.input.joy.active; endJoy();
      if (!wasJoy && moved < 14 && performance.now() - tp.t < 400 && canPlay() && e.type === 'pointerup') walkTo(e.clientX, e.clientY);
    }
    if (touches.size < 2) pinch = null;

  addEventListener('pointerup', end); addEventListener('pointercancel', end);
  // mouse press & hold → follow the pointer
  G.updaters.push(() => {
    if (!mouse || !canPlay()) return;
    if (!mouse.hold && performance.now() - mouse.t > 260) mouse.hold = true;
    if (mouse.hold) { const g = groundAt(mouse.x, mouse.y); if (g) { const d = Math.hypot(g.x - G.player.pos.x, g.z - G.player.pos.z); G.clickTarget = d > 0.6 ? { x: g.x, z: g.z, it: null, hold: true } : null; } }
  });
  canvas.addEventListener('wheel', e => { e.preventDefault(); G.cam.dist = G.clamp(G.cam.dist + Math.sign(e.deltaY) * 2, G.cam.minDist, G.cam.maxDist); }, { passive: false });
  // keyboard zoom (+/-) for PCs and boards with keyboards
  addEventListener('keydown', e => { if (e.key === '+' || e.key === '=') G.cam.dist = G.clamp(G.cam.dist - 2, G.cam.minDist, G.cam.maxDist); if (e.key === '-') G.cam.dist = G.clamp(G.cam.dist + 2, G.cam.minDist, G.cam.maxDist); });
}

// ---------------------------------------------------------------- player
// The creatures module (30_creatures.js) supplies the visual model via
// G.player.setModel(group, animateFn(state, dt, t, speed01)).
G.player = {
  pos: new THREE.Vector3(W.places.spawn.x, 0, W.places.spawn.z),
  vel: new THREE.Vector3(), facing: Math.PI, speed: 0, radius: 0.45,
  WALK: 4.2, RUN: 7.4, state: 'idle', root: new THREE.Group(), model: null, anim: null,
  action: null, // {name, t, dur} — e.g. 'shake','pick','fish','net','dig','wave','celebrate'

// HEIGHT TEXTURE (sea depth / shore) + GRASS MASK
// ============================================================================

      if (dens > 0) for (const s of res) { const dd = Math.hypot(x - s.x, z - s.z); if (dd < s.r) { dens *= sm(s.r * 0.55, s.r * 0.95, dd); if (dens <= 0) break; } }

      dens *= 0.55 + 0.6 * nS(x * 0.04, z * 0.04, 1);

    d[k * 4 + 2] = Math.round(NCg[k] * 255); d[k * 4 + 3] = Math.round(AOg[k] * 255);

}

// ============================================================================
// SEA
// ============================================================================
let sea;

// ============================================================================
// RIVER + PONDS
// ============================================================================
const WATER_COLOR = /* glsl */`

float streak = smoothstep(0.62, 0.74, s1*0.55 + s2*0.45) * smoothstep(0.08, 0.5, spd);
float bankF = (1.0 - smoothstep(0.0, 0.1 + 0.12*s2, dep));

float g2 = texture2D(tNoise, vWP.xz*0.93 - vec2(-uTime*0.04, fl*0.05)).b;

{ vec2 ga = texture2D(tNoise, vec2(lp.x*0.12, (lp.y - fl*1.2)*0.12)).rg - 0.5; vec2 gb = texture2D(tNoise, vec2(lp.x*0.35, (lp.y - fl*1.8)*0.3)).gb - 0.5;

// ============================================================================
// WATERFALL (sheet + foam pool + mist)

function buildWaterfall() {

  g.setIndex(idx); g.computeVertexNormals();

  m.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, U);

    Object.assign(sh.uniforms, U);

}

// SKY DOME + DAY/NIGHT
// ============================================================================
const SKYU = {

  vertexShader: `varying vec3 vDir; void main(){ vDir = position; vec3 transformed = position;
    #include <project_vertex>

  fragmentShader: `uniform vec3 uTop, uHor, uBot, uSunD, uSunC, uMoonD, uCloudCol, uCloudSh; uniform float uStars, uCloudAmt, uTime; uniform sampler2D tNoise; varying vec3 vDir;

    const N = Math.round(b.len / 0.42);

      const lx = -b.len / 2 + i * b.len / N; const t = lx / (b.len / 2); const y = W.GROUND_Y + 0.25 + 0.35 * (1 - t * t);
      const slope = Math.atan(-0.7 * t / (b.len / 2)) ;
      F.add(RB(0.38, 0.12, b.width, 0.03), i % 3 === 0 ? C.woodL : i % 3 === 1 ? 0xb5855a : 0xa87a50, lx, y - 0.06, 0, 0, 0, -slope);
    }
    // under beams + rails
    for (const s of [-1, 1]) {
      for (let i = 0; i <= 6; i++) {
        const lx = -b.len / 2 + 0.3 + i * (b.len - 0.6) / 6; const t = lx / (b.len / 2); const y = W.GROUND_Y + 0.25 + 0.35 * (1 - t * t);
        F.add(CY(0.08, 0.09, 1.0, 8), C.woodD, lx, y + 0.45, s * (b.width / 2 - 0.05));

          F.add(CY(0.055, 0.055, len, 8), C.woodL, mx, my + 0.85, s * (b.width / 2 - 0.05), 0, 0, ang - Math.PI / 2);

// ===== 20_flora.js =====
{
// ============================================================================
// 20_flora.js — FLORA: meyve ağaçları, palmiyeler, çamlar, çiçekli ağaçlar, çalılar,
// çiçekler, eğrelti otları, mantarlar, sazlar, nilüferler, kumsal otları,
// rüzgar (vertex shader), ağaç sallama + meyve/çiçek toplama.
// Everything instanced; placement uses a seeded rng so the island is identical every load.
// ============================================================================
const T = THREE, W = G.world;
const QF = G.quality === 'high' ? 1 : G.quality === 'medium' ? 0.6 : 0.36;
const DAY_MS = 864e5;
const today = () => Math.floor(Date.now() / DAY_MS);
const v3 = (x, y, z) => new T.Vector3(x, y, z);
const ZERO = new T.Matrix4().makeScale(0, 0, 0);
const dummy = new T.Object3D();
const TAU = Math.PI * 2;

// ---------------------------------------------------------------- shared wind / light uniforms
const U = {
  uTime: { value: 0 },
  uWind: { value: new T.Vector3(0.94, 0.34, 1) }, // xy = dir (world xz), z = strength
  uPush: { value: new T.Vector3(0, -99, 0) },
  uRimCol: { value: new T.Color(0.2, 0.18, 0.1) },
  uTransCol: { value: new T.Color(0.3, 0.3, 0.1) },
  uSunV: { value: new T.Vector3(0, 1, 0) },
};

// approximate 3D noise from the core 2D simplex
function n3(x, y, z) {
  return (G.noise2(x + y * 0.71, z - y * 0.37) + G.noise2(y + z * 0.53 + 17.1, x - z * 0.29) + G.noise2(z + x * 0.61 - 9.3, y + x * 0.43 + 5.5)) / 3;
}

// ---------------------------------------------------------------- shader patch
const VHEAD = /* glsl */`
attribute vec4 aTree; attribute vec2 aLeaf;
uniform float uTime; uniform vec3 uWind; uniform vec3 uPush; uniform float uBend; uniform float uFlutter;
varying float vLeafF; varying vec3 vWPos;
`;
const vBody = (flex) => /* glsl */`
vec3 transformed = vec3( position );
{
  mat4 IM = mat4(1.0);
  #ifdef USE_INSTANCING
    IM = instanceMatrix;
  #endif
  vec4 wp = IM * vec4(position, 1.0);
  vec3 ip = IM[3].xyz;
  float h = max(wp.y - aTree.z, 0.0);
  vec2 wd = uWind.xy;
  float wave = dot(ip.xz, wd) * 0.07 - uTime * 1.05;
  float gust = smoothstep(0.15, 1.0, 0.5 + 0.42 * sin(wave) + 0.25 * sin(dot(ip.xz, vec2(-wd.y, wd.x)) * 0.13 + uTime * 0.41));
  float str = uWind.z * (0.3 + gust);
  float osc = sin(uTime * 1.7 + aTree.w) * 0.6 + sin(uTime * 2.9 + aTree.w * 2.3) * 0.25;
  float hb = h * h * uBend;
  vec3 off = vec3(wd.x, 0.0, wd.y) * (str * 0.55 + osc * str * 0.5) * hb;
  float fl = aLeaf.y * uFlutter * str * min(h, 3.0);
  off += fl * vec3(sin(uTime * 5.3 + wp.x * 2.1 + wp.z * 1.3), 0.6 * sin(uTime * 6.1 + wp.y * 2.7 + wp.x), cos(uTime * 4.7 + wp.z * 2.3 + wp.y * 1.1));
  off.xz += aTree.xy * h * h;
  ${flex ? `
  {
    vec2 dp = wp.xz - uPush.xz; float dl = length(dp);
    float pf = (1.0 - smoothstep(0.2, 0.95, dl)) * step(abs(wp.y - uPush.y), 1.6) * min(h * 1.6, 1.0);

}

  const PINES = [0x2f8a56, 0x3a985c, 0x2a8058, 0x3f9a50];
  const BLOSSOM = [0xff9cc6, 0xffb6d5, 0xffc7dc, 0xf58fbf];
  const PALMS = [0x5cb33c, 0x6bbd40, 0x52a83a];
  const tmpQ = new T.Vector3();

const puffs = []; let puffMesh;
function puff(x, y, z) { const p = puffs.find(p => p.life <= 0); if (!p) return; p.x = x + (R() - 0.5) * 0.2; p.y = y + 0.05; p.z = z + (R() - 0.5) * 0.2; p.life = 1; p.s = 0.12 + R() * 0.08; }
function animate(rig, state, dt, t, sp01, action, isPlayer) {
  const { legs, arms, torso, head, body } = rig; const moving = state === 'walk' || state === 'run';
  const speed = isPlayer ? G.player.speed : rig.speed || 0;
  const prevPh = rig.phase; rig.phase += dt * (moving ? 3.2 + speed * 1.2 : 0);
  const ph = rig.phase; const amp = moving ? Math.min(1, speed / 3) * (state === 'run' ? 1.0 : 0.7) : 0;
  rig.amp = G.damp(rig.amp || 0, amp, 12, dt); const a = rig.amp;

  legs[0].rotation.x = Math.sin(ph) * 0.85 * a; legs[1].rotation.x = -Math.sin(ph) * 0.85 * a;
  bodyY = Math.abs(Math.sin(ph)) * 0.07 * a; lean = a * (state === 'run' ? 0.22 : 0.08);
  squash = 1 + Math.cos(ph * 2) * 0.03 * a;

  const br = Math.sin(t * 2.1 + (rig.seed || 0)) * 0.5 + 0.5;
  if (!moving) { squash = 1 + br * 0.022; headZ = Math.sin(t * 0.7 + (rig.seed || 0)) * 0.05; rig.lookT -= dt; if (rig.lookT < -4) rig.lookT = 2 + R() * 4; headX = 0; }
  const look = !moving && rig.lookT < 0 && rig.lookT > -2 ? Math.sin((-rig.lookT) / 2 * Math.PI) * 0.5 * (rig.seed % 2 ? 1 : -1) : 0;
  // actions
  if (action) {
    const k = G.clamp(action.t / action.dur, 0, 1); const s = Math.sin(k * Math.PI);
    switch (action.name) {
      case 'shake': armL = armR = -1.3 * s; lean = 0.15 * s; armLz = 0.1; armRz = -0.1; body.position.x = Math.sin(action.t * 40) * 0.03 * s; break;
      case 'pick': lean = 0.6 * s; bodyY = -0.18 * s; armR = -1.2 * s; armL = -0.4 * s; legs[0].rotation.x = -0.5 * s; legs[1].rotation.x = -0.2 * s; break;
      case 'fish': armR = -1.5 + 0.9 * Math.min(1, k * 4) * (k < 0.3 ? -1 : 0.6); armL = -0.6; break;
      case 'net': armR = -2.6 + 2.8 * k; armL = -0.3; lean = 0.2 * s; break;
      case 'dig': armR = armL = -1.6 + Math.sin(k * Math.PI * 3) * 0.9; lean = 0.35; break;
      case 'wave': armR = Math.PI * 0.95; armRz = -0.4 + Math.sin(action.t * 14) * 0.35; break;
      case 'eat': armR = -2.2 * s; headX = 0.15 * s; break;
      case 'celebrate': bodyY = Math.abs(Math.sin(k * Math.PI * 2)) * 0.45; armL = armR = Math.PI * 0.92; armLz = 0.35; armRz = -0.35; squash = 1 + Math.sin(k * Math.PI * 4) * 0.06; break;
    }
  }

  torso.rotation.x = lean; head.rotation.x = -lean * 0.5 + headX; head.rotation.z = headZ; head.rotation.y = G.damp(head.rotation.y, look + (rig.headYaw || 0), 6, dt);
  arms[0].rotation.x = G.damp(arms[0].rotation.x, armL, 16, dt); arms[1].rotation.x = G.damp(arms[1].rotation.x, armR, 16, dt);
  arms[0].rotation.z = G.damp(arms[0].rotation.z, armLz, 12, dt); arms[1].rotation.z = G.damp(arms[1].rotation.z, armRz, 12, dt);
  body.scale.set(rig.o.height * (2 - squash) ** 0.5, rig.o.height * squash, rig.o.height * (2 - squash) ** 0.5);
  if (rig.tail) rig.tail.rotation.z = Math.sin(t * (moving ? 9 : 2.5)) * 0.25;

  }
}

function dinoAnim(state, dt, t, sp, action) {

  if (action) {
    const k = G.clamp(action.t / action.dur, 0, 1);
    if (action.name === 'clap') { const c = Math.abs(Math.sin(action.t * 9)); rig.arms[0].rotation.set(-1.35, 0, 0.25 + 0.75 * c); rig.arms[1].rotation.set(-1.35, 0, -0.25 - 0.75 * c); }
    if (action.name === 'stomp') { const s = Math.sin(action.t * 9); rig.legs[0].rotation.x = Math.max(0, s) * -0.9; rig.legs[1].rotation.x = Math.max(0, -s) * -0.9; rig.body.position.y = Math.abs(s) * 0.08; rig.arms[0].rotation.z = 0.6; rig.arms[1].rotation.z = -0.6; }
    if (action.name === 'nod') { rig.head.rotation.x = Math.sin(action.t * 10) * 0.32; }
    if (action.name === 'spin') { G.player.facing = spinT + k * Math.PI * 2; rig.arms[0].rotation.z = 1.1; rig.arms[1].rotation.z = -1.1; }

}

// ---------------------------------------------------------------- activity engine
let cur = null; const ray = new T.Raycaster(), ndc = new T.Vector2();
const TSCALE = 1.25;
const targets = []; // {obj, key, base:Vector3, ph, alive}
function clearTargets() { for (const t of targets) { t.obj.parent?.remove(t.obj); } targets.length = 0; }
function layout(n, A, y0, rows = 1) {
  const aspect = G.camera.aspect; const span = G.clamp(aspect * 5.6, 3.6, 7.6);
  const per = Math.ceil(n / rows); const out = [];
  for (let i = 0; i < n; i++) {
    const row = Math.floor(i / per), col = i % per; const cnt = Math.min(per, n - row * per);
    const dx = cnt > 1 ? (col - (cnt - 1) / 2) * Math.min(2.1, span / Math.max(1, cnt - 1 + 0.6)) : 0;
    out.push(new T.Vector3(A.x + dx, y0 + (rows - 1 - row) * 1.45, A.z - Math.abs(dx) * 0.12));
  }
  return out;
}
function addTarget(obj, key, pos, scale = 1) {
  obj.position.copy(pos); obj.scale.setScalar(0.001); G.scene.add(obj);
  const t = { obj, key, base: pos.clone(), ph: R() * 6, alive: true, s: scale * TSCALE, grow: 0, wob: 0, spin: 0 };
  targets.push(t); return t;
}
function pickTarget(e) {
  const r = G.renderer.domElement.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1); ray.setFromCamera(ndc, G.camera);
  // generous screen-space picking: nearest target centre to the ray
  let best = null, bd = 1e9;
  for (const t of targets) { if (!t.alive) continue; const d = ray.ray.distanceToPoint(t.obj.position.clone().add(new T.Vector3(0, -0.12, 0))); const lim = 0.95 * t.s; if (d < lim && d < bd) { bd = d; best = t; } }
  return best;
}
function onCanvasDown(e) { if (!cur || !cur.onTap) return; const t = pickTarget(e); if (t) { e.stopPropagation(); cur.onTap(t); } }

// confetti
let confetti; const conf = [];
function buildConfetti() {
  const N = 140; confetti = new T.InstancedMesh(new T.PlaneGeometry(0.12, 0.2), new T.MeshBasicMaterial({ side: T.DoubleSide }), N); confetti.frustumCulled = false; G.scene.add(confetti);
  const cols = [0xef5a5a, 0xffd34d, 0x5cbf4f, 0x3fb6e8, 0xa066e0, 0xff8fa3]; const c = new T.Color();
  for (let i = 0; i < N; i++) { conf.push({ life: 0, p: new T.Vector3(), v: new T.Vector3(), r: R() * 6 }); confetti.setColorAt(i, c.setHex(cols[i % cols.length])); }
}
function burst(pos, n = 70) { let k = 0; for (const p of conf) { if (k >= n) break; if (p.life > 0) continue; p.life = 2 + R(); p.p.copy(pos); p.v.set((R() - 0.5) * 7, 4 + R() * 5, (R() - 0.5) * 7); k++; } }
const _o = new T.Object3D();
function updateConfetti(dt, t) { if (!confetti) return; conf.forEach((p, i) => { if (p.life > 0) { p.life -= dt; p.v.y -= 9 * dt; p.v.multiplyScalar(1 - dt * 1.2); p.p.addScaledVector(p.v, dt); _o.position.copy(p.p); _o.rotation.set(t * 5 + p.r, t * 3 + p.r * 2, 0); _o.scale.setScalar(Math.min(1, p.life)); } else _o.scale.setScalar(0); _o.updateMatrix(); confetti.setMatrixAt(i, _o.matrix); }); confetti.instanceMatrix.needsUpdate = true; }

async function praise(t) { G.audio.sfx('success'); if (t) burst(t.obj.position, 30); G.player.playAction(pick(['celebrate', 'clap', 'jump']), 1.0); }

// one "find the X" round. items: [{key, make(), say, tr, big}] ; target key
function findRound(A, items, targetKey, promptFn, nameOf, y0 = null) {
  return new Promise(resolve => {
    clearTargets(); const y = y0 ?? (W.heightAt(A.x, A.z) + 1.5);
    const pos = layout(items.length, A, y);
    items.forEach((it, i) => addTarget(it.make(), it.key, pos[i], it.scale || 1));
    const tgt = items.find(i => i.key === targetKey);
    const prompt = promptFn(tgt); cur.lastPrompt = prompt.say;
    showWord(prompt.big, prompt.word, prompt.tr, { color: prompt.color });
    Speech.say(prompt.say);
    let tries = 0;
    cur.onTap = async t => {
      if (cur.locked) return; cur.locked = true;
      if (t.key === targetKey) {
        t.spin = 1; G.audio.sfx('pop'); const it = items.find(i => i.key === t.key);
        showWord(it.big ?? prompt.big, it.word, it.tr, { color: prompt.color });
        P.addStars(1); praise(t);
        await Speech.say(`${it.say}! ${pick(PRAISE)}`);
        cur.locked = false; cur.onTap = null; resolve(true);
      } else {
        tries++; t.wob = 1; G.audio.sfx('thud'); const it = items.find(i => i.key === t.key);
        await Speech.say(tries >= 2 ? `That's ${nameOf(it)}. Find ${nameOf(tgt)}!` : `Oops! That's ${nameOf(it)}. Try again!`);
        if (tries >= 3) { const good = targets.find(x => x.key === targetKey); if (good) good.hint = 1; }
        cur.locked = false;
      }
    };
    cur.abortHook = () => resolve(false);
  });
}
// counting round: tap every object, Dino counts out loud
function countRound(A, n, kind) {
  return new Promise(resolve => {
    clearTargets(); const y = W.heightAt(A.x, A.z) + 1.4; const rows = n > 5 ? 2 : 1;
    const pos = layout(n, A, y, rows);
    for (let i = 0; i < n; i++) addTarget(kind.make(), 'c' + i, pos[i], 0.85);
    ui.count.innerHTML = Array.from({ length: n }, (_, i) => `<span>${i + 1}</span>`).join(''); ui.count.classList.add('on');
    const plural = kind.plural; cur.lastPrompt = `Let's count the ${plural}! Tap them!`;
    showWord('🤔', `How many ${plural}?`, `Kaç tane ${kind.tr} var?`); Speech.say(cur.lastPrompt);
    let c = 0;
    cur.onTap = async t => {
      if (cur.locked || t.counted) return; t.counted = true; c++;
      t.spin = 1; t.glow = 1; G.audio.sfx('coin'); burst(t.obj.position, 10);
      ui.count.children[c - 1]?.classList.add('lit');
      showWord(String(c), NUM_WORDS[c].replace(/^./, m => m.toUpperCase()), NUM_TR[c], { color: NUM_COL[c] });
      if (c < n) { Speech.say(NUM_WORDS[c] + '!', { rate: 0.95 }); return; }
      cur.locked = true; await Speech.say(NUM_WORDS[c] + '!');
      await wait(0.2); showWord(String(n), `${NUM_WORDS[n].replace(/^./, m => m.toUpperCase())} ${n === 1 ? kind.one : plural}!`, `${NUM_TR[n]} ${kind.tr}`, { color: NUM_COL[n] });
      P.addStars(1); praise(null); burst(new T.Vector3(A.x, y + 1, A.z), 40);
      // replay the count together, like a song
      const words = []; for (let i = 1; i <= n; i++) words.push(NUM_WORDS[i]);
      await Speech.say(`${words.join(', ')}! ${NUM_WORDS[n]} ${n === 1 ? kind.one : plural}! ${pick(PRAISE)}`);
      ui.count.classList.remove('on'); cur.locked = false; cur.onTap = null; resolve(true);
    };
    cur.abortHook = () => resolve(false);
  });
}
// action round (Dance): picture buttons
function actionRound(keys, target) {
  return new Promise(resolve => {
    clearTargets(); const a = ACTIONS[target]; cur.lastPrompt = a.en;
    showWord('🎵', a.en, a.tr); Speech.say(`Can you ${a.en.toLowerCase().replace('!', '')}? Tap the picture!`);

    let tries = 0;

      e.stopPropagation(); if (cur.locked) return; cur.locked = true; const k = b.dataset.k;

    }); });
    cur.abortHook = () => { ui.choices.classList.remove('on'); resolve(false); };
  });
}

const ROUNDS = 5;
const KINDS_COUNT = [
  { make: FRUITS.apple.make, plural: 'apples', one: 'apple', tr: 'elma' },
  { make: () => balloon(pick([0xe53935, 0x1e88e5, 0xfdd835, 0x43a047, 0xf06292])), plural: 'balloons', one: 'balloon', tr: 'balon' },
  { make: () => shapeMesh('star', 0xffc93c), plural: 'stars', one: 'star', tr: 'yıldız' },
  { make: FRUITS.orange.make, plural: 'oranges', one: 'orange', tr: 'portakal' },
];
const art = w => /^[aeiou]/i.test(w) ? 'an ' + w : 'a ' + w;
const Act = {
  async numbers(A, lvl) {
    const max = [3, 5, 10][lvl];
    for (let r = 0; r < ROUNDS && !cur.aborted; r++) {
      if (r % 2 === 0) { const n = 1 + Math.floor(R() * max); await countRound(A, n, pick(KINDS_COUNT)); }
      else {
        const target = 1 + Math.floor(R() * max); const opts = shuffle([target, ...shuffle([...Array(max + (max < 4 ? 1 : 0)).keys()].map(i => i + 1).filter(i => i !== target)).slice(0, lvl === 0 ? 1 : 2)]);
        await findRound(A, opts.map(n => ({ key: n, make: () => numberBlock(n), say: NUM_WORDS[n], word: NUM_WORDS[n].replace(/^./, m => m.toUpperCase()), tr: NUM_TR[n], big: String(n) })), target,
          t => ({ say: `Find number ${NUM_WORDS[t.key]}!`, word: `Find ${NUM_WORDS[t.key]}!`, big: String(t.key), tr: `${NUM_TR[t.key]} rakamını bul`, color: NUM_COL[t.key] }), it => `number ${NUM_WORDS[it.key]}`);
      }
    }
  },
  async shapes(A, lvl) {
    const pool = Object.keys(SHAPES).slice(0, [4, 6, 8][lvl]);
    for (let r = 0; r < ROUNDS && !cur.aborted; r++) {
      const target = pick(pool); const opts = shuffle([target, ...shuffle(pool.filter(k => k !== target)).slice(0, lvl === 0 ? 1 : 2)]);
      const cols = shuffle(SHAPE_COLS);
      await findRound(A, opts.map((k, i) => ({ key: k, make: () => shapeMesh(k, cols[i]), say: k, word: k.replace(/^./, m => m.toUpperCase()), tr: SHAPES[k].tr, big: '' })), target,
        t => ({ say: `Where is the ${t.key}?`, word: `Find the ${t.key}!`, tr: `${SHAPES[t.key].tr} hangisi?` }), it => art(it.key));
    }
  },
  async colors(A, lvl) {
    const pool = Object.keys(COLORS).slice(0, [4, 7, 10][lvl]);
    for (let r = 0; r < ROUNDS && !cur.aborted; r++) {
      const target = pick(pool); const opts = shuffle([target, ...shuffle(pool.filter(k => k !== target)).slice(0, lvl === 0 ? 1 : 2)]);
      await findRound(A, opts.map(k => ({ key: k, make: () => balloon(COLORS[k].c), say: k, word: k.replace(/^./, m => m.toUpperCase()), tr: COLORS[k].tr, big: '🎈' })), target,
        t => ({ say: `Pop the ${t.key} balloon!`, word: `Pop the ${t.key} balloon!`, big: '🎈', tr: `${COLORS[t.key].tr} balonu patlat`, color: '#' + COLORS[t.key].c.toString(16).padStart(6, '0') }), it => it.key, W.heightAt(A.x, A.z) + 1.9);
    }
  },
  async animals(A, lvl) {

      <button class="pk-btn pk-btn-sun pk-ok">Harika! ${emo('✨')}</button></div>`;
    root.appendChild(m);
    sfx(isNew || rar >= 3 ? 'fanfare' : 'success');
    const t0 = performance.now();
    const close = () => { if (performance.now() - t0 < 380) return; modalKey = null; sfx('ui'); m.classList.add('bye'); setTimeout(() => m.remove(), 230); resolve(); };
    m.querySelector('.pk-ok').addEventListener('click', e => { e.stopPropagation(); close(); });
    m.addEventListener('click', e => { if (e.target === m) close(); });
    modalKey = e => { if (['Space', 'Enter', 'KeyE', 'Escape'].includes(e.code)) close(); };
    setTimeout(() => m.querySelector('.pk-ok')?.focus({ preventScroll: true }), 50);
  });
}
UI.itemGet = (id, n = 1) => enqueue('item', () => runItemGet(id, n));

// ---------------------------------------------------------------- confirm
function runConfirm(text, opts = {}) {
  return new Promise(resolve => {
    const m = h('div', 'pk-modal');
    m.innerHTML = `<div class="pk-panel pk-conf">${emo(opts.icon || '🤔', 'big')}<p>${esc(text)}</p><div class="pk-row"><button class="pk-btn pk-no">${esc(opts.no || 'Hayır')}</button><button class="pk-btn ${opts.danger ? 'pk-btn-coral' : 'pk-btn-primary'} pk-yes kf">${esc(opts.yes || 'Evet')}</button></div></div>`;
    root.appendChild(m); sfx('open');
    let sel = 1; const yes = m.querySelector('.pk-yes'), no = m.querySelector('.pk-no');
    const mark = () => { yes.classList.toggle('kf', sel === 1); no.classList.toggle('kf', sel === 0); };
    const done = v => { modalKey = null; sfx(v ? 'pop' : 'ui'); m.classList.add('bye'); setTimeout(() => m.remove(), 230); resolve(v); };
    yes.addEventListener('click', e => { e.stopPropagation(); done(true); });
    no.addEventListener('click', e => { e.stopPropagation(); done(false); });
    m.addEventListener('click', e => { if (e.target === m) done(false); });
    modalKey = e => {
      if (['ArrowLeft', 'ArrowRight', 'KeyA', 'KeyD', 'Tab'].includes(e.code)) { e.preventDefault(); sel = 1 - sel; mark(); sfx('ui'); }
      else if (['Space', 'Enter', 'KeyE'].includes(e.code)) done(sel === 1);
      else if (e.code === 'Escape') done(false);
    };
  });
}
UI.confirm = (text, opts) => enqueue('confirm', () => runConfirm(text, opts || {}));
UI.bubble = (getter, content, secs = 2.5) => addBubble(getter, String(content ?? ''), secs, [...String(content)].length <= 2 ? 'emote big' : '');
UI.emote = (getter, emoji) => addBubble(getter, emoji, 1.8, 'emote');

// ============================================================================
// MENUS
// ============================================================================
UI._menus = {};
let menuLayer = null, menuId = null, menuCloseT = null;
UI.registerMenu = (id, def) => { UI._menus[id] = { order: 50, icon: '•', ...def }; renderMenuButtons(); if (menuId === id) UI.openMenu(id); };
UI.openMenu = id => {
  const def = UI._menus[id]; if (!def) return;
  clearTimeout(menuCloseT);
  const fresh = !menuLayer;
  if (fresh) { menuLayer = h('div', 'pk-menu-layer'); root.appendChild(menuLayer); menuLayer.addEventListener('click', e => { if (e.target === menuLayer) UI.closeMenu(); }); }
  menuLayer.classList.remove('bye');
  const c = def.color || MENU_COL[id] || ['#62c44c', '#3f9c36'];
  const switching = !fresh && menuId !== id;
  menuId = id; holdBusy('menu'); clearBadge(id);
  menuLayer.innerHTML = `<div class="pk-panel pk-sheet" style="--acc:${c[0]};--acc2:${c[1]}" role="dialog" aria-label="${esc(def.title)}"><div class="pk-sheet-head"><div class="pk-hi">${emo(def.icon)}</div><h2>${esc(def.title)}</h2><div class="pk-extra"></div><button class="pk-x" aria-label="Kapat">✕</button></div><div class="pk-sheet-body"></div></div>`;
  if (switching) menuLayer.querySelector('.pk-sheet').style.animation = 'pkFade .2s ease both';
  menuLayer.querySelector('.pk-x').addEventListener('click', e => { e.stopPropagation(); UI.closeMenu(); });
  const body = menuLayer.querySelector('.pk-sheet-body');
  try { def.render(body); } catch (e) { console.error('[menu ' + id + ']', e); body.innerHTML = `<div class="pk-empty">${emo('🙈')}Bu sayfa şu an açılamadı.</div>`; }
  if (fresh || switching) sfx('open');
  if (id === 'shop' && A.mood !== 'shop') music.setMood('shop');
  G.emit('menu:open', id);
};
UI.closeMenu = () => {
  if (!menuLayer) return; const L = menuLayer, id = menuId; menuLayer = null; menuId = null;
  L.classList.add('bye'); menuCloseT = setTimeout(() => L.remove(), 230);
  sfx('close'); releaseBusy('menu');
  if (A.mood === 'shop') deriveMood(true);
  if (id === 'koleksiyon') G.save.set('ui.colSeenAt', Date.now());
  G.emit('menu:close', id);
};
UI.refreshMenu = id => { if (menuLayer && menuId === (id || menuId)) { const body = menuLayer.querySelector('.pk-sheet-body'); const st = body.scrollTop; try { UI._menus[menuId].render(body); } catch (e) { console.error(e); } body.scrollTop = st; } };
UI.isMenuOpen = () => !!menuLayer;
UI.currentMenu = () => menuId;
G.on('key:menu', code => {
  if (qRunning || !G.state.started) return;
  const ids = Object.entries(UI._menus).filter(([i, d]) => d.hud !== false && i !== 'shop').sort((a, b) => (a[1].order ?? 50) - (b[1].order ?? 50)).map(e => e[0]);
  if (menuLayer) {
    if (code === 'Tab' && menuId !== 'shop' && ids.length > 1) { sfx('ui'); UI.openMenu(ids[(ids.indexOf(menuId) + 1) % ids.length]); }
    else UI.closeMenu();
    return;
  }
  if (G.state.busy) return;
  if (code === 'Escape') UI.openMenu(UI._menus.ayarlar ? 'ayarlar' : ids[0]);
  else if (code === 'KeyI' || code === 'Tab') UI.openMenu(UI._menus.cep ? 'cep' : ids[0]);
});

// ---------------------------------------------------------------- Cep (pocket)
let cepSel = null;
const CAT_TR = { meyve: 'Meyve', 'çiçek': 'Çiçek', 'böcek': 'Böcek', 'balık': 'Balık', deniz: 'Deniz', fosil: 'Fosil', mobilya: 'Mobilya', malzeme: 'Malzeme', alet: 'Alet', 'özel': 'Özel', 'kıyafet': 'Kıyafet' };
function renderCep(el) {
  const inv = G.inv.items, ids = Object.keys(inv); if (cepSel && !inv[cepSel]) cepSel = null; if (!cepSel && ids.length) cepSel = ids[0];
  const slots = []; for (let i = 0; i < G.inv.MAX_SLOTS; i++) { const id = ids[i]; const d = id && (G.items.get(id) || { icon: '❔', name: id });
    slots.push(id ? `<button class="pk-slot ${id === cepSel ? 'sel' : ''}" data-id="${esc(id)}" aria-label="${esc(d.name)}">${emo(d.icon)}${inv[id] > 1 ? `<span class="pk-badge">${inv[id]}</span>` : ''}</button>` : '<div class="pk-slot empty"></div>'); }
  const tl = typeof G.tools.list === 'function' ? G.tools.list() : null;
  const tools = tl && tl.some(t => t.owned) ? `<div class="pk-section">${emo('🧰')} Aletlerin</div><div class="pk-tools">${tl.map(t => `<button class="pk-toolchip ${t.equipped ? 'on' : ''} ${t.owned ? '' : 'lock'}" data-tool="${t.id}" ${t.owned ? '' : 'disabled'}>${emo(t.icon)}${esc(t.name)}${!G.isTouch ? ` <span class="pk-kbd">${G.tools.ids?.indexOf(t.id) + 1 || ''}</span>` : ''}</button>`).join('')}</div>` : '';
  const d = cepSel && (G.items.get(cepSel) || { icon: '❔', name: cepSel });
  let acts = []; if (cepSel) { try { acts = G.gameplay?.itemActions ? G.gameplay.itemActions(cepSel) || [] : [{ label: 'Bırak', icon: '👐', fn: () => { G.inv.remove(cepSel, 1); UI.toast(`${d.name} bıraktın.`, d.icon); } }]; } catch (e) { console.error(e); } }
  const detail = d ? `<div class="pk-detail"><div class="pk-dico">${emo(d.icon)}</div><h3>${esc(d.name)}</h3><div class="pk-meta"><span class="pk-chip">${esc(CAT_TR[d.category] || 'Eşya')}</span><span class="pk-chip">× ${inv[cepSel]}</span>${d.price ? `<span class="pk-price">${fmt(d.price)} ${emo('🌰')}</span>` : ''}</div><p>${esc(d.desc || 'Cebinde duruyor.')}</p><div class="pk-acts">${acts.map((a, i) => `<button class="pk-btn ${i === 0 ? 'pk-btn-primary' : ''}" data-act="${i}">${a.icon ? emo(a.icon) : ''} ${esc(a.label)}</button>`).join('')}</div></div>`
    : `<div class="pk-detail"><div class="pk-dico">${emo('🎒')}</div><h3>Cebin boş</h3><p>Ağaçları salla, kumsalda kabuk topla, balık tut — bulduğun her şey buraya gelir!</p></div>`;
  el.innerHTML = `<div class="pk-cep"><div><div class="pk-cep-top"><span class="pk-price" style="font-size:calc(var(--u)*1.05)">${emo('🌰')} ${fmt(G.inv.coins)} Palamut</span><span class="pk-sp"></span><span class="pk-chip">${emo('🎒')} ${ids.length} / ${G.inv.MAX_SLOTS}</span></div><div class="pk-slots">${slots.join('')}</div>${tools}</div>${detail}</div>`;
  el.querySelectorAll('.pk-slot[data-id]').forEach(b => b.addEventListener('click', () => { cepSel = b.dataset.id; sfx('blip'); renderCep(el); }));
  el.querySelectorAll('[data-tool]').forEach(b => b.addEventListener('click', () => { G.tools.equip(G.tools.equipped === b.dataset.tool ? null : b.dataset.tool); renderCep(el); }));
  el.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', async () => {
    const a = acts[+b.dataset.act]; if (!a) return; sfx('ui');
    const closeAfter = /Yerleştir|Ek|Patlat|Üfle|Çal|Giy|Çıkar|Aç/.test(a.label);
    if (closeAfter) UI.closeMenu();
    try { await a.fn?.(); } catch (e) { console.error(e); }
    if (!closeAfter && menuId === 'cep') UI.refreshMenu('cep');
  }));
}
G.on('inv', () => { if (menuId === 'cep') UI.refreshMenu('cep'); });
G.on('coins', () => { if (menuId === 'cep') UI.refreshMenu('cep'); });
G.on('tool:equip', () => { if (menuId === 'cep') UI.refreshMenu('cep'); });

// ---------------------------------------------------------------- Koleksiyon
const FALLBACK_CATS = [['balık', 'Balıklar', '🐟'], ['böcek', 'Böcekler', '🦋'], ['deniz', 'Deniz Hazineleri', '🐚'], ['fosil', 'Fosiller', '🦴'], ['meyve', 'Meyveler', '🍎'], ['çiçek', 'Çiçekler', '🌼'], ['mobilya', 'Mobilyalar', '🪑']];
function collectionData() {
  if (G.gameplay?.collection) { try { const c = G.gameplay.collection(); if (Array.isArray(c) && c.length) return c; } catch (e) { console.error(e); } }
  const seen = G.save.get('seen', {}); const defs = Object.values(G.items.defs);
  return FALLBACK_CATS.map(([cat, title, icon]) => { const items = defs.filter(d => d.category === cat).sort((a, b) => (a.rarity || 1) - (b.rarity || 1) || (a.price || 0) - (b.price || 0)).map(d => ({ id: d.id, name: d.name, icon: d.icon, found: !!seen[d.id], rarity: d.rarity || 1, price: d.price, desc: d.desc || '', where: d.where || '', hours: d.hours || '' })); return { id: cat, title, icon, items, found: items.filter(i => i.found).length, total: items.length }; }).filter(c => c.total);
}
let colTab = null, colSel = null;
const CAT_COL = { 'balık': ['#4cb8ea', '#2689bd'], 'böcek': ['#8bcf4a', '#5a9d22'], deniz: ['#ff9db2', '#e0607f'], fosil: ['#c9a27a', '#97704a'], meyve: ['#ff8a5c', '#e05a2c'], 'çiçek': ['#f6c33c', '#d79c10'], mobilya: ['#b58ae6', '#8659c2'] };
function renderCol(el) {
  const cols = collectionData();
  if (!cols.length) { el.innerHTML = `<div class="pk-empty">${emo('📖')}Defterin henüz boş. Keşfetmeye başla!</div>`; return; }
  if (!cols.find(c => c.id === colTab)) colTab = cols[0].id;
  const c = cols.find(x => x.id === colTab);
  const found = cols.reduce((a, x) => a + x.found, 0), total = cols.reduce((a, x) => a + x.total, 0), pct = total ? Math.round(found / total * 100) : 0;
  const seen = G.save.get('seen', {}), since = G.save.get('ui.colSeenAt', 0);
  const msg = pct >= 100 ? 'İnanılmaz! Defterin tamamen doldu! 🏆' : pct >= 60 ? 'Harika gidiyorsun, az kaldı!' : pct >= 25 ? 'Defterin dolmaya başladı!' : 'Her yeni buluş buraya kaydedilir.';
  if (colSel && !c.items.find(i => i.id === colSel)) colSel = null;
  const sel = colSel && c.items.find(i => i.id === colSel);
  const acc = CAT_COL[c.id] || ['#62c44c', '#3f9c36'];
  el.innerHTML = `<div class="pk-col-hero"><div class="pk-ring" style="--p:${pct}"><b>%${pct}</b></div><div><h3>${found} / ${total} keşfedildi</h3><p>${msg}</p></div></div>
    <div class="pk-tabs pk-col-tabs">${cols.map(x => { const p = x.total ? Math.round(x.found / x.total * 100) : 0; const ac = CAT_COL[x.id] || ['#62c44c']; return `<button class="pk-tab ${x.id === colTab ? 'on' : ''}" data-tab="${esc(x.id)}" style="--acc:${ac[0]}"><span class="pk-tt">${emo(x.icon)} ${esc(x.title)} <small>${x.found}/${x.total}</small></span><span class="pk-bar"><i style="width:${p}%"></i></span></button>`; }).join('')}</div>
    <div class="pk-grid pk-col-grid">${c.items.map((it, i) => `<div class="pk-card pk-col-card ${it.found ? '' : 'no'} ${it.found && seen[it.id] > since && since ? 'fresh' : ''} ${it.id === colSel ? 'sel' : ''}" data-ci="${esc(it.id)}"><span class="pk-num">#${String(i + 1).padStart(2, '0')}</span>${emo(it.icon)}<div class="pk-cn">${it.found ? esc(it.name) : '???'}</div><div class="pk-st">${'★'.repeat(G.clamp(it.rarity || 1, 1, 5))}</div></div>`).join('')}</div>
    <div class="pk-col-info" style="--acc:${acc[0]}">${sel ? (sel.found
      ? `<div class="pk-dico">${emo(sel.icon)}</div><div><h4>${esc(sel.name)}</h4><p>${esc(sel.desc || '')}</p><div class="pk-meta">${sel.where ? `<span class="pk-chip">${emo('📍')} ${esc(sel.where)}</span>` : ''}${sel.hours ? `<span class="pk-chip">${emo('🕒')} ${esc(sel.hours)}</span>` : ''}${sel.price ? `<span class="pk-price">${fmt(sel.price)} ${emo('🌰')}</span>` : ''}</div></div>`
      : `<div class="pk-dico" style="filter:grayscale(1);opacity:.5">${emo('❔')}</div><div><h4>Henüz bulunmadı</h4><p>${sel.where ? `İpucu: ${esc(sel.where)} civarına bir bak!` : 'Adayı keşfetmeye devam et, belki karşına çıkar!'}</p>${sel.hours ? `<div class="pk-meta"><span class="pk-chip">${emo('🕒')} ${esc(sel.hours)}</span></div>` : ''}</div>`)
      : `<div class="pk-dico">${emo(c.icon)}</div><div><h4>${esc(c.title)} · ${c.found}/${c.total}</h4><p>Bir karta dokun, hakkında bilgi gör.</p></div>`}</div>`;
  el.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { colTab = b.dataset.tab; colSel = null; sfx('ui'); renderCol(el); el.scrollTop = 0; }));
  el.querySelectorAll('[data-ci]').forEach(b => b.addEventListener('click', () => { colSel = colSel === b.dataset.ci ? null : b.dataset.ci; sfx('blip'); renderCol(el); }));
  const on = el.querySelector('.pk-tab.on'); on?.scrollIntoView?.({ block: 'nearest', inline: 'nearest' });
}

// ---------------------------------------------------------------- Ayarlar
function renderSettings(el) {
  const s = settings(); const q = G.quality;
  el.innerHTML = `<div class="pk-set">
    <div class="pk-row-set">${emo('🎵')}<b>Müzik</b><input class="pk-range" type="range" min="0" max="100" value="${Math.round(s.music * 100)}" data-k="music" aria-label="Müzik sesi"></div>
    <div class="pk-row-set">${emo('🔔')}<b>Efektler</b><input class="pk-range" type="range" min="0" max="100" value="${Math.round(s.sfx * 100)}" data-k="sfx" aria-label="Efekt sesi"></div>
    <div class="pk-row-set">${emo('🖼️')}<b>Görüntü kalitesi</b><div class="pk-seg">${[['high', 'Yüksek'], ['medium', 'Orta'], ['low', 'Hızlı']].map(([k, l]) => `<button data-q="${k}" class="${q === k ? 'on' : ''}">${l}</button>`).join('')}</div></div>
    ${document.documentElement.requestFullscreen ? `<div class="pk-row-set">${emo('📺')}<b>Tam ekran</b><button class="pk-btn" data-fs>${document.fullscreenElement ? 'Kapat' : 'Aç'}</button></div>` : ''}
    <div class="pk-section">${emo('🎮')} Nasıl oynanır?</div>
    <div class="pk-help">${G.isTouch
      ? `<div>${emo('👆')} Ekrana dokunup sürükle: yürü</div><div>${emo('🟢')} Yeşil düğme: konuş / topla</div><div>${emo('🎒')} Menü düğmeleri: cep, defter</div><div>${emo('✋')} Alet düğmesi: alet değiştir</div>`
      : `<div><span class="pk-kbd">W A S D</span> yürü · <span class="pk-kbd">Shift</span> koş</div><div><span class="pk-kbd">E</span> / <span class="pk-kbd">Boşluk</span> konuş, topla</div><div><span class="pk-kbd">I</span> cep · <span class="pk-kbd">Tab</span> menüler</div><div><span class="pk-kbd">1-4</span> / <span class="pk-kbd">Q</span> alet seç</div><div>${emo('🖱️')} Tıkla: oraya yürü</div><div><span class="pk-kbd">Esc</span> kapat</div>`}</div>
    <div class="pk-section">${emo('🧹')} Kayıt</div>
    <div class="pk-row-set">${emo('💾')}<b>Oyunun kendiliğinden kaydedilir.</b><button class="pk-btn pk-btn-coral" data-reset>Baştan başla</button></div>
    <div class="pk-credits"><b>Dino Island 🦖</b>0–6 yaş için İngilizce oyun paketi: rakamlar, şekiller, renkler, hayvanlar, meyveler, hareketler.<br>Bütün çizimler, müzikler ve sesler kodla üretildi.</div>
  </div>`;
  el.querySelectorAll('.pk-range').forEach(r => {
    const paint = () => r.style.setProperty('--v', r.value + '%'); paint();
    r.addEventListener('input', () => { paint(); setSetting(r.dataset.k, r.value / 100); applyVolumes(); });
    r.addEventListener('change', () => { if (r.dataset.k === 'sfx') sfx('coin'); });
  });
  el.querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', async () => {
    if (b.dataset.q === G.quality) return;
    if (!(await UI.confirm('Kalite değişince oyun yeniden yüklenecek. Tamam mı?', { icon: '🖼️' }))) return;
    G.save.set('ui.quality', b.dataset.q); G.save.persist?.(); const u = new URL(location.href); u.searchParams.delete('q'); u.searchParams.delete('fresh'); location.href = u.toString();
  }));
  el.querySelector('[data-fs]')?.addEventListener('click', () => { if (document.fullscreenElement) document.exitFullscreen?.(); else document.documentElement.requestFullscreen?.().catch(() => {}); setTimeout(() => UI.refreshMenu('ayarlar'), 300); });
  el.querySelector('[data-reset]').addEventListener('click', async () => {
    if (!(await UI.confirm('Bütün eşyaların, Palamutların ve koleksiyonun silinsin mi?', { icon: '😮', yes: 'Evet, sil', danger: true }))) return;
    if (!(await UI.confirm('Emin misin? Bu geri alınamaz!', { icon: '⚠️', yes: 'Evet, baştan başla', no: 'Vazgeç', danger: true }))) return;
    G.save.reset(); G.save.persist = () => {}; try { localStorage.removeItem('papatya_koyu_v1'); } catch (e) {} location.reload();
  });
}
UI.registerMenu('cep', { title: 'Cebim', short: 'Cep', icon: '🎒', order: 10, render: renderCep });
UI.registerMenu('koleksiyon', { title: 'Koleksiyon Defteri', short: 'Defter', icon: '📖', order: 30, render: renderCol });
UI.registerMenu('ayarlar', { title: 'Ayarlar', icon: '⚙️', order: 90, render: renderSettings });

// ============================================================================
// MOODS (day / evening / night) — 'daypart' event or derived from the clock
// ============================================================================
let gotDaypart = false;
function moodForHour(hr) { return hr >= 6 && hr < 17.5 ? 'day' : hr >= 17.5 && hr < 20.5 ? 'evening' : 'night'; }
function deriveMood(force) { if (A.mood === 'shop' && !force) return; if (menuId === 'shop') return; music.setMood(moodForHour(G.time.hour)); }
G.on('daypart', p => { gotDaypart = true; if (A.mood === 'shop' || menuId === 'shop') return; const m = { sabah: 'day', 'gündüz': 'day', 'akşam': 'evening', gece: 'night' }[p]; if (m) music.setMood(m); });
setInterval(() => { if (!gotDaypart && A.playing) deriveMood(false); }, 5000);

// ============================================================================
// PUBLIC API + MODULE
// ============================================================================
Object.assign(G.ui, UI);
G.ui = Object.assign(G.ui, UI);
G.register('ui', {
  priority: 5,
  init() {
    Object.assign(MOODS.day, {}); A.mood = moodForHour(G.time.hour); music.mood = A.mood; Object.assign(CUR, MOODS[A.mood]);
    if (!P.has('autostart')) buildTitle();
    G.on('start', () => {
      hud.classList.add('on'); updateTool(); renderMenuButtons(); lastClock = '';
      if (title && !title._pressed) { title._pressed = true; beginGame(); }
      // re-apply picked base look for slots not driven by worn clothes
      const look = G.save.get('ui.look', {}), worn = G.save.get('gp.look', {}), lo = G.creatures?.lookOptions;
      if (lo && look) for (const s in look) if (!worn[s] && lo[s]?.[look[s]] != null) { const o = optOf(lo[s][look[s]], look[s]); try { G.creatures.setLook?.(s, o.id, o.color, null); } catch (e) {} }
    });
  },
  update(dt) {
    G.camera.updateMatrixWorld();
    root.classList.toggle('busy', !!G.state.busy);
    if (G.state.started) { updateClock(); updateCoins(dt); updatePrompt(); }
    updateBubbles(dt); ambienceUpdate(dt);
  },
});

}

G.boot();
