<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zihin Köprüsü</title>
<meta name="description" content="Bilimsel temelli dikkat ve hafıza oyun dünyası — Barış Öğretmen">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ec;--card:#ffffff;--ink:#1f2a33;--mut:#6b7480;--pri:#2c6e72;--pri2:#e3efee;--acc:#e59a2f;--acc2:#fcefd9;--ok:#2f9a58;--ok2:#e2f4e8;--bad:#d1495b;--bad2:#fbe4e7;--line:#e6e0d4;--sh:0 6px 20px rgba(31,42,51,.07);--r:20px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13191d;--card:#1c252b;--ink:#eef2f3;--mut:#9aa6ae;--pri:#5fb3b3;--pri2:#20373a;--acc:#f0b04f;--acc2:#3a2f1e;--ok:#4cc27b;--ok2:#1d3527;--bad:#ef6f80;--bad2:#3d2026;--line:#2b363d;--sh:0 6px 20px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#13191d;--card:#1c252b;--ink:#eef2f3;--mut:#9aa6ae;--pri:#5fb3b3;--pri2:#20373a;--acc:#f0b04f;--acc2:#3a2f1e;--ok:#4cc27b;--ok2:#1d3527;--bad:#ef6f80;--bad2:#3d2026;--line:#2b363d;--sh:0 6px 20px rgba(0,0,0,.3)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}
body{padding-bottom:84px;overscroll-behavior:none}
#app{max-width:560px;margin:0 auto;padding:16px}
h1,h2,h3{margin:.2em 0 .4em;line-height:1.25}
h1{font-size:1.55rem;font-weight:900}h2{font-size:1.25rem;font-weight:800}h3{font-size:1.05rem;font-weight:800}
p{margin:.4em 0}
.mut{color:var(--mut)}.small{font-size:.86rem}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin:0 0 14px;border:1px solid var(--line)}
.btn{appearance:none;border:0;border-radius:14px;padding:12px 18px;font:inherit;font-weight:800;cursor:pointer;background:var(--pri2);color:var(--pri);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--pri);color:#fff}
.btn.acc{background:var(--acc);color:#2b1d06}
.btn.big{width:100%;padding:16px;font-size:1.1rem}
.btn.ghost{background:transparent;color:var(--mut);padding:8px 10px}
.btn:disabled{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.05rem}
.brand .lg{width:34px;height:34px;border-radius:11px;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:1.1rem}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--pri2);color:var(--pri);font-weight:800;font-size:.9rem;border:0;font-family:inherit;cursor:pointer}
.chip.on{background:var(--pri);color:#fff}
input[type=text],textarea{width:100%;font:inherit;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
label.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;cursor:pointer}
label.chk input{width:22px;height:22px;margin-top:2px;accent-color:var(--pri);flex:none}
.grp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 4px}
.grp button{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:12px 6px;font:inherit;color:var(--ink);cursor:pointer}
.grp button b{display:block;font-size:1.6rem}
.grp button.on{border-color:var(--pri);background:var(--pri2)}
/* home */
.hero{background:linear-gradient(135deg,var(--pri),#3d8a7a);color:#fff;border:0}
.hero .mut{color:rgba(255,255,255,.8)}
.daybig{font-size:2.6rem;font-weight:900;line-height:1}
.bar{height:10px;background:rgba(255,255,255,.25);border-radius:9px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px}
.steps{list-style:none;padding:0;margin:6px 0 14px}
.steps li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.steps li:last-child{border:0}
.steps .ic{width:40px;height:40px;border-radius:13px;background:var(--pri2);display:grid;place-items:center;font-size:1.25rem;flex:none}
.steps .ok .ic{background:var(--ok2)}
.steps .st{margin-left:auto;font-weight:900;color:var(--ok)}
.tip{background:var(--acc2);border-color:transparent}
/* nav */
nav.bn{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.bn .in{display:flex;max-width:560px;width:100%}
nav.bn button{flex:1;background:none;border:0;font:inherit;color:var(--mut);font-size:.74rem;font-weight:800;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bn button span{font-size:1.35rem}
nav.bn button.on{color:var(--pri)}
nav.bn.hide{display:none}
/* game */
.gtop{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.gtop .gt{font-weight:900;flex:1}
.lvl{font-size:.8rem;font-weight:800;background:var(--acc2);color:var(--acc);padding:4px 10px;border-radius:999px}
.dots{display:flex;gap:6px;justify-content:center;margin:0 0 12px}
.dots i{width:9px;height:9px;border-radius:9px;background:var(--line)}
.dots i.d{background:var(--ok)}.dots i.c{background:var(--acc);width:24px}
.intro{text-align:center}
.bigic{font-size:3.6rem;line-height:1.1}
.skill{color:var(--pri);font-weight:800}
.how{background:var(--bg);border-radius:16px;padding:12px;margin:12px 0 16px;font-size:1.05rem}
.how .e{font-size:2rem;vertical-align:middle}
.cd{font-size:6rem;font-weight:900;text-align:center;color:var(--pri);padding:60px 0;animation:pop .6s}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
.hud{display:flex;justify-content:space-between;font-weight:800;color:var(--mut);margin-bottom:8px}
.zone{background:var(--card);border:2px solid var(--line);border-radius:26px;height:min(58vh,420px);display:grid;place-items:center;user-select:none;touch-action:manipulation;cursor:pointer}
.stim{font-size:7rem;opacity:0;transform:scale(.6);transition:all .12s}
.stim.show{opacity:1;transform:scale(1)}
.stim.pop{transform:scale(1.25)}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.hint{text-align:center;color:var(--mut);font-size:.85rem}
.grid{display:grid;gap:8px;user-select:none}
.cell{aspect-ratio:1;background:var(--card);border:2px solid var(--line);border-radius:16px;display:grid;place-items:center;font-size:clamp(1.4rem,7vw,2.4rem);cursor:pointer;transition:background .15s,transform .1s;touch-action:manipulation}
.cell:active{transform:scale(.95)}
.cell.found{background:var(--ok2);border-color:var(--ok)}
.cell.wrong{background:var(--bad2);border-color:var(--bad)}
.cell.lit{background:var(--acc);border-color:var(--acc);box-shadow:0 0 22px var(--acc)}
.cell.tap{background:var(--pri);border-color:var(--pri)}
.cell.cover{background:var(--pri2);color:var(--pri);font-size:1.4rem}
.target{text-align:center;font-weight:800;margin-bottom:10px}
.target .e{font-size:2.4rem;vertical-align:middle}
.msg{text-align:center;font-weight:900;font-size:1.2rem;min-height:1.8em;margin:6px 0 10px}
.word{font-size:3rem;font-weight:900;letter-spacing:.04em}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
.choices button{height:86px;border-radius:22px;border:3px solid var(--line);background:var(--card);font-size:2.6rem;cursor:pointer;touch-action:manipulation}
.choices button.col{border:0}
.stage{min-height:200px;display:grid;place-items:center}
.res{text-align:center}
.stars{font-size:2.8rem;color:var(--acc);letter-spacing:4px}
.stars .off{color:var(--line)}
.up{color:var(--ok);font-weight:800}
.det{background:var(--bg);border-radius:14px;padding:10px;font-size:.92rem}
.timebar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:6px 0 12px}
.timebar i{display:block;height:100%;background:var(--pri);width:100%}
/* breath */
.breath{display:grid;place-items:center;height:300px}
.ball{width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8fd3cf,var(--pri));transition:transform 4s ease-in-out;box-shadow:0 10px 40px rgba(44,110,114,.35)}
.ball.in{transform:scale(2.1)}
/* bridge */
.bridge{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;align-items:end;margin:10px 0 6px}
.bridge div{text-align:center;font-size:.7rem;font-weight:800;color:var(--mut)}
.bridge b{display:block;margin:0 auto 4px;width:100%;border-radius:10px 10px 4px 4px;background:var(--pri2);color:var(--pri);font-size:1rem;padding:6px 0}
.bridge div:last-child b{background:var(--acc);color:#2b1d06}
.flash{min-height:180px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.flash .q{font-size:1.35rem;font-weight:800}
.flash .a{font-size:1.25rem;color:var(--ok);font-weight:800;margin-top:12px;padding-top:12px;border-top:2px dashed var(--line)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.rate button{border:0;border-radius:16px;padding:12px 4px;font:inherit;font-weight:800;cursor:pointer}
.rate .r1{background:var(--ok2);color:var(--ok)}.rate .r2{background:var(--acc2);color:var(--acc)}.rate .r3{background:var(--bad2);color:var(--bad)}
.rate span{display:block;font-size:1.7rem}
.clist .it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.clist .it:last-child{border:0}
.clist .bx{font-size:.72rem;font-weight:900;padding:3px 8px;border-radius:999px;background:var(--pri2);color:var(--pri);white-space:nowrap}
/* progress */
.cal{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.cal div{aspect-ratio:1;border-radius:12px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:.85rem;color:var(--mut)}
.cal div.d{background:var(--ok);color:#fff;border-color:var(--ok)}
.cal div.t{border:2px solid var(--acc);color:var(--acc)}
.lvtab{width:100%;border-collapse:collapse;font-size:.92rem}
.lvtab td{padding:8px 4px;border-bottom:1px solid var(--line)}
.lvtab td:last-child{text-align:right;font-weight:800;color:var(--pri)}
.scale{display:flex;gap:6px;margin:6px 0 12px}
.scale button{flex:1;padding:10px 0;border-radius:12px;border:2px solid var(--line);background:var(--card);font:inherit;font-weight:900;color:var(--ink);cursor:pointer}
.scale button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
/* guide */
details.g{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:0 0 10px;box-shadow:var(--sh)}
details.g summary{padding:16px 18px;font-weight:800;cursor:pointer;list-style:none;display:flex;gap:10px;align-items:center}
details.g summary::-webkit-details-marker{display:none}
details.g summary::after{content:"＋";margin-left:auto;color:var(--pri)}
details.g[open] summary::after{content:"－"}
details.g .gb{padding:0 18px 16px}
details.g ul{padding-left:20px;margin:.4em 0}
details.g li{margin:.3em 0}
.sig{font-weight:800;color:var(--pri)}
.note{border-left:4px solid var(--acc);background:var(--acc2);padding:10px 12px;border-radius:10px;margin:10px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal .card{width:100%;max-width:440px;max-height:86vh;overflow:auto}
.center{text-align:center}
.foot{text-align:center;color:var(--mut);font-size:.8rem;margin:18px 0 6px}
.foot a{color:var(--pri)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-20px;font-style:normal;font-size:1.6rem;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.player{display:flex;gap:14px;align-items:center}
.av{width:62px;height:62px;border-radius:20px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:2.2rem;flex:none}
.world{margin:20px 0 10px;display:flex;gap:10px;align-items:center}
.world .wi{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:1.4rem;flex:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 12px;box-shadow:var(--sh);cursor:pointer;text-align:left;font:inherit;color:var(--ink);position:relative;transition:transform .08s}
.tile:active{transform:scale(.97)}
.tile .ti{font-size:2.3rem;line-height:1.1}
.tile b{display:block;margin-top:6px;font-size:.96rem;line-height:1.25}
.tile .ts{color:var(--acc);font-size:.85rem;letter-spacing:1px}
.tile .tl{position:absolute;top:9px;right:10px;font-size:.68rem;font-weight:800;color:var(--mut)}
.tile.wide{grid-column:span 2;display:flex;gap:12px;align-items:center}
.tiles.t3{grid-template-columns:repeat(3,1fr)}.tiles.t3 .tile{padding:12px 8px}.tiles.t3 .tl{display:none}
.fishrow{display:flex;gap:2px;justify-content:center;align-items:center}
.fish{width:54px;height:34px}.fish.big{width:72px;height:46px}
.shp{margin:auto}.shp.circle{border-radius:50%}.shp.tri{clip-path:polygon(50% 0,100% 100%,0 100%)}
.rulebar{text-align:center;font-weight:900;font-size:1.25rem;padding:8px;border-radius:14px;margin-bottom:6px}
.keyp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px;margin:10px auto 0}
.keyp button{height:58px;border-radius:16px;border:2px solid var(--line);background:var(--card);font:inherit;font-size:1.5rem;font-weight:900;color:var(--ink);cursor:pointer}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{text-align:center;padding:10px 4px;border-radius:14px;background:var(--bg);font-size:.74rem;font-weight:800;line-height:1.25}
.badge span{display:block;font-size:1.8rem;margin-bottom:2px}
.badge.off{opacity:.35;filter:grayscale(1)}
.avs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.avs button{font-size:1.6rem;width:46px;height:46px;border-radius:14px;border:2px solid var(--line);background:var(--card);cursor:pointer}
.avs button.on{border-color:var(--pri);background:var(--pri2)}
@media print{nav.bn,.noprint{display:none!important}body{background:#fff;padding:0}details.g{box-shadow:none}details.g .gb{display:block}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="bn hide" id="nav"><div class="in">
<button data-v="home"><span>🎮</span>Oyunlar</button>
<button data-v="program"><span>🗺️</span>30 Gün</button>
<button data-v="bridge"><span>🌉</span>Köprü</button>
<button data-v="progress"><span>📈</span>Gelişim</button>
<button data-v="guide"><span>📖</span>Rehber</button>
</div></nav>
<script>
"use strict";
/* ================= TEMEL ================= */
const KEY='zihinKoprusu_v1';
let DB={profiles:[],active:null,sound:true};
try{const raw=localStorage.getItem(KEY);if(raw)DB=Object.assign(DB,JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
function P(){return DB.profiles.find(p=>p.id===DB.active)||null}
const $=s=>document.querySelector(s);
const app=()=>document.getElementById('app');
let TIMERS=[];
function later(fn,ms){const id=setTimeout(fn,ms);TIMERS.push(id);return id}
function every(fn,ms){const id=setInterval(fn,ms);TIMERS.push(id);return id}
function stopAll(){TIMERS.forEach(i=>{clearTimeout(i);clearInterval(i)});TIMERS=[]}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function rnd(n){return Math.floor(Math.random()*n)}
function pick(a){return a[rnd(a.length)]}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return fmt(new Date())}
function addDays(ds,n){const d=new Date(ds+'T12:00:00');d.setDate(d.getDate()+n);return fmt(d)}
function trDate(ds){const d=new Date(ds+'T12:00:00');return d.toLocaleDateString('tr-TR',{day:'numeric',month:'long'})}
function adapt(l,acc,max){max=max||20;return acc>=.85?Math.min(max,l+1):acc<.6?Math.max(0,l-1):l}
function uid(){return Date.now().toString(36)+rnd(1e6).toString(36)}
/* ses (yalnızca efekt, konuşma sesi yok) */
let AC=null;
function beep(f,d,type,v){if(!DB.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;const t=AC.currentTime;g.gain.setValueAtTime(v||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
const SFX={ok(){beep(660,.1);setTimeout(()=>beep(880,.12),80)},bad(){beep(200,.22,'triangle',.1)},tick(){beep(520,.07)},lit(i){beep(330+i*40,.25,'sine',.07)},win(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.18),i*120))},soft(){beep(440,.08,'sine',.04)}};

const GROUPS={minik:{ad:'Minik',yas:'4–6 yaş',ic:'🐣'},kasif:{ad:'Kâşif',yas:'7–10 yaş',ic:'🧭'},usta:{ad:'Usta',yas:'11–14 yaş',ic:'🏔️'}};
const ATT=['yildiz','balik','hedef','tuzak','nobetci','kart'];
const MEM={minik:['isik','degisti','talimat','saray','kimnerede','ari','sayi'],kasif:['isik','degisti','zincir','talimat','saray','ari','sayi','kimnerede'],usta:['isik','zincir','degisti','saray','talimat','ari','sayi','kimnerede']};
const WORLDS=[
 {ic:'🌲',ad:'Odak Ormanı',ac:'Dikkati toplama ve sürdürme',col:'#d9f0e1',g:['yildiz','hedef','balik','nobetci']},
 {ic:'🗼',ad:'Kontrol Kulesi',ac:'Dur-düşün, esneklik, unutmama',col:'#fbe4e7',g:['tuzak','kart','ari']},
 {ic:'🏰',ad:'Hafıza Kalesi',ac:'Çalışma belleği',col:'#e3efee',g:['isik','kimnerede','degisti','zincir','talimat']},
 {ic:'🎓',ad:'Hafıza Teknikleri Okulu',ac:'Bilgiyi kalıcı yapan şampiyon yöntemleri',col:'#fcefd9',g:['saray','sayi']}
];
function allGames(g){return WORLDS.flatMap(w=>w.g).filter(k=>!(g==='minik'&&k==='zincir'))}
const AVS=['🦊','🐼','🦁','🐯','🐸','🦄','🐙','🐧','🚀','🤖','🦖','🐝'];
const RANKS=[[0,'Çırak','🌱'],[20,'Gözcü','🔭'],[60,'Kâşif','🧭'],[120,'Usta','🛡️'],[220,'Bilge','🦉'],[360,'Efsane','👑']];
function rank(st){let r=RANKS[0],nx=RANKS[1];for(let i=0;i<RANKS.length;i++){if(st>=RANKS[i][0]){r=RANKS[i];nx=RANKS[i+1]||null}}return{r,nx}}
function starsOf(a){return a>=.9?3:a>=.7?2:1}
const STEPS=[
 {k:'nefes',ic:'🫧',ad:'Odak Nefesi',ac:'1 dk · zihni sakinleştirir'},
 {k:'dikkat',ic:'🎯',ad:'Dikkat Oyunu',ac:'3 dk · odak kası'},
 {k:'hafiza',ic:'🧠',ad:'Hafıza Oyunu',ac:'3 dk · çalışma belleği'},
 {k:'kopru',ic:'🌉',ad:'Hafıza Köprüsü',ac:'3–5 dk · okulda öğrendiği kalıcı olsun'},
 {k:'hareket',ic:'🤸',ad:'Hareket + Öğretmen Ol',ac:'2 dk · ekransız'}
];

GAMES.yildiz={title:'Yıldız Avcısı',icon:'⭐',kind:'dikkat',skill:'Dürtü kontrolü: “dur ve düşün” becerisi',
 start:()=>0,show:l=>l+1,

 run(area,g,lvl,done){

  const base={minik:1300,kasif:1000,usta:850}[g];const dur=Math.max(420,Math.round(base*Math.pow(.93,lvl)));
  let tr=shuffle(Array.from({length:N},(_,i)=>i<nGo));if(!tr[0]){const j=tr.indexOf(true);tr[0]=true;tr[j]=false}

  area.innerHTML=`<div class="hud"><span id="hp">0/${N}</span><span>${s[0]} dokun · ${s[1]} bekle</span></div><div class="zone" id="zone"><div class="stim" id="stim"></div></div>`;
  const zone=area.querySelector('#zone'),stim=area.querySelector('#stim'),hp=area.querySelector('#hp');
  zone.onpointerdown=e=>{e.preventDefault();if(cur===null||resp)return;resp=true;if(cur){hit++;stim.classList.add('pop');SFX.ok()}else{fa++;zone.classList.add('shake');SFX.bad();later(()=>zone.classList.remove('shake'),360)}};
  function next(){if(i>=N)return fin();cur=tr[i];resp=false;stim.className='stim show';stim.textContent=cur?s[0]:s[1];hp.textContent=(i+1)+'/'+N;
   later(()=>{if(!resp){if(cur)miss++;else cr++}stim.className='stim';cur=null;i++;later(next,420+rnd(450))},dur)}
  function fin(){const acc=(hit+cr)/N;done({acc,lvl:adapt(lvl,acc),detail:`Doğru dokunuş: <b>${hit}</b> · Sabırla bekledi: <b>${cr}</b><br>Aceleci dokunuş: <b>${fa}</b> · Kaçan: <b>${miss}</b>`})}

 }};

GAMES.hedef={title:'Hedef Avı',icon:'🔍',kind:'dikkat',skill:'Seçici dikkat: kalabalıkta doğruyu bulma',

 run(area,g,lvl,done){
  const FAM=[['🍎','🍅','🍒','🍓'],['🐟','🐠','🐡','🐬'],['🚗','🚕','🚙','🚓'],['🐶','🐱','🐹','🐰'],['🌸','🌺','🌷','🌹'],['⚽','🏀','🏐','🎾'],['🐸','🐢','🦎','🐊'],['😀','😃','😄','😁']];

   const fams=g==='usta'?FAM:FAM.slice(0,7);const fam=pick(fams);const tg=pick(fam);const sim=fam.filter(x=>x!==tg);
   const tot=cols*cols;const nT=Math.min(2+rnd(3),Math.floor(tot/3));const simShare=Math.min(.92,.25+lvl*.08);

   area.querySelectorAll('.cell').forEach(c=>c.onpointerdown=ev=>{ev.preventDefault();if(c.classList.contains('found'))return;const e=arr[+c.dataset.i];

  }

GAMES.isik={title:'Işık Yolu',icon:'💡',kind:'hafiza',skill:'Görsel-uzamsal çalışma belleği',
 start:g=>g==='minik'?2:3,show:l=>l+' ışık',
 how(g){return `<p>Kutular sırayla yanacak. <b>İyice izle.</b></p><p>Sonra <b>aynı sırayla</b> dokun.</p>`+(g==='usta'?`<p class="note small">Bazı turlarda <b>“TERSTEN”</b> yazacak: o zaman sondan başa doğru dokun!</p>`:'')},
 run(area,g,lvl,done){
  const cols=g==='usta'?4:3,tot=cols*cols,T=g==='minik'?6:8,on=g==='minik'?800:650;const minS=this.start(g);
  let span=lvl,t=0,okC=0,best=0,streakOk=0,streakBad=0,inp=[],exp=[],acc0=false,back=false;
  area.innerHTML=`<div class="hud"><span id="hp"></span><span id="sp"></span></div><div class="msg" id="ms"></div><div class="grid" id="gr" style="grid-template-columns:repeat(${cols},1fr);max-width:${cols*92}px;margin:0 auto">${Array.from({length:tot},(_,i)=>`<div class="cell" data-i="${i}"></div>`).join('')}</div>`;
  const cells=[...area.querySelectorAll('.cell')],ms=area.querySelector('#ms');
  cells.forEach(c=>c.onpointerdown=e=>{e.preventDefault();if(!acc0)return;const k=+c.dataset.i;c.classList.add('tap');setTimeout(()=>c.classList.remove('tap'),200);SFX.lit(k);inp.push(k);
   const j=inp.length-1;if(inp[j]!==exp[j]){acc0=false;fail();return}if(inp.length===exp.length){acc0=false;succ()}});
  function trial(){if(t>=T)return fin();t++;area.querySelector('#hp').textContent='Tur '+t+'/'+T;area.querySelector('#sp').textContent=span+' ışık';
   back=g==='usta'&&t%2===0;ms.innerHTML=back?'👀 İzle… sonra <span style="color:var(--acc)">TERSTEN</span>':'👀 İzle…';ms.style.color='var(--ink)';
   const seq=[];while(seq.length<span){const k=rnd(tot);if(seq[seq.length-1]!==k)seq.push(k)}
   exp=back?seq.slice().reverse():seq.slice();inp=[];
   seq.forEach((k,j)=>{later(()=>{cells[k].classList.add('lit');SFX.lit(k)},600+j*(on+250));later(()=>cells[k].classList.remove('lit'),600+j*(on+250)+on)});
   later(()=>{ms.innerHTML=back?'✋ Sıra sende — <span style="color:var(--acc)">TERSTEN!</span>':'✋ Sıra sende!';acc0=true},600+span*(on+250))}
  function succ(){okC++;best=Math.max(best,span);SFX.ok();ms.textContent='Harika! ✓';ms.style.color='var(--ok)';streakOk++;streakBad=0;if(streakOk>=2){span=Math.min(9,span+1);streakOk=0}later(trial,900)}
  function fail(){SFX.bad();area.querySelector('#gr').classList.add('shake');later(()=>area.querySelector('#gr').classList.remove('shake'),360);ms.textContent='Olsun, tekrar deneyelim!';ms.style.color='var(--bad)';streakBad++;streakOk=0;if(streakBad>=2){span=Math.max(minS,span-1);streakBad=0}later(trial,1100)}
  function fin(){const nl=Math.max(minS,Math.min(span,Math.max(best,lvl)));done({acc:okC/T,lvl:nl,detail:`Doğru tur: <b>${okC}/${T}</b><br>En uzun doğru dizi: <b>${best||'-'} ışık</b>`})}
  later(trial,400);
 }};

GAMES.kimnerede={title:'Kim Nerede?',icon:'🗺️',kind:'hafiza',skill:'Görsel bellek: nesne ve yerini hatırlama',
 start:()=>0,show:l=>l+1,
 how:()=>`<p>Kutularda resimler göreceksin. <b>Nerede olduklarını aklında tut.</b></p><p>Sonra kapanacaklar. Sorulan resmin yerine dokun!</p>`,
 run(area,g,lvl,done){
  const POOL=['🐶','🍎','🚗','⚽','🌙','🎈','🐸','🍦','📚','🎸','🦋','🧸','🍉','🚀','🌻','🐢'];
  const b={minik:3,kasif:4,usta:5}[g],mx={minik:6,kasif:8,usta:10}[g];const n=Math.min(mx,b+Math.floor(lvl/2));
  const cols=g==='usta'?4:3,rows=Math.max(2,Math.ceil((n+3)/cols)),tot=cols*rows;
  const R=3;let r=0,ok=0,asked=0;
  function round(){
   if(r>=R)return fin();r++;
   const items=shuffle(POOL).slice(0,n);const pos=shuffle([...Array(tot).keys()]).slice(0,n);const map={};items.forEach((e,k)=>map[pos[k]]=e);
   const study=(g==='minik'?1600:1200)+n*(g==='minik'?1100:800);
   area.innerHTML=`<div class="hud"><span>Tur ${r}/${R}</span><span>${n} resim</span></div><div class="msg" id="ms">👀 Aklında tut!</div><div class="timebar"><i id="tb"></i></div><div class="grid" style="grid-template-columns:repeat(${cols},1fr)">${Array.from({length:tot},(_,i)=>`<div class="cell" data-i="${i}">${map[i]||''}</div>`).join('')}</div>`;
   const tb=area.querySelector('#tb');void tb.offsetWidth;tb.style.transition=`width ${study}ms linear`;tb.style.width='0%';
   later(()=>ask(items,pos,map),study);
  }
  function ask(items,pos,map){
   const cells=[...area.querySelectorAll('.cell')];cells.forEach(c=>{c.textContent='❔';c.classList.add('cover')});area.querySelector('.timebar').style.visibility='hidden';
   const order=shuffle(items.map((e,k)=>k));let q=0,busy=false;const ms=area.querySelector('#ms');
   function show(){if(q>=order.length){later(round,700);return}ms.innerHTML=`<span style="font-size:2rem;vertical-align:middle">${items[order[q]]}</span> neredeydi?`;ms.style.color='var(--ink)'}
   cells.forEach(c=>c.onpointerdown=e=>{e.preventDefault();if(busy||q>=order.length||!c.classList.contains('cover'))return;const k=order[q],right=pos[k];asked++;const i=+c.dataset.i;
    const rc=cells[right];rc.textContent=items[k];rc.classList.remove('cover');
    if(i===right){ok++;rc.classList.add('found');SFX.ok();q++;show()}
    else{busy=true;c.classList.add('wrong','shake');rc.classList.add('lit');SFX.bad();later(()=>{c.classList.remove('wrong','shake');rc.classList.remove('lit');rc.classList.add('found');busy=false;q++;show()},900)}});
   show();
  }
  function fin(){const acc=ok/Math.max(1,asked);done({acc,lvl:adapt(lvl,acc),detail:`Doğru yer: <b>${ok}/${asked}</b> · Bir seferde <b>${n}</b> resim`})}
  round();
 }};
/* 7 — Akıl Zinciri (N-geri, çalışma belleği güncelleme) */
GAMES.zincir={title:'Akıl Zinciri',icon:'🔗',kind:'hafiza',skill:'Çalışma belleği: aklında tut ve güncelle',

 how(g){return g==='usta'?`<p>Şekiller tek tek gelecek. Gelen şekil <b>İKİ ÖNCEKİ</b> ile aynıysa <b>AYNI</b>’ya bas.</p><p style="font-size:1.6rem">🔺 🔵 <b>🔺</b> ← AYNI!</p>`:`<p>Şekiller tek tek gelecek. Gelen şekil <b>bir önceki</b> ile aynıysa <b>AYNI</b>’ya bas.</p><p style="font-size:1.6rem">🔵 <b>🔵</b> ← AYNI!</p>`},
 run(area,g,lvl,done){
  const S=['🔺','🔵','🟩','⭐','🟣','🔶'];const n=g==='usta'?2:1,N=22+n;const iv=g==='usta'?Math.max(1600,2800-lvl*80):Math.max(1700,2600-lvl*80);
  const seq=[];for(let k=0;k<N;k++){if(k>=n&&Math.random()<.32)seq.push(seq[k-n]);else{let x;do{x=pick(S)}while(k>=n&&x===seq[k-n]);seq.push(x)}}
  let i=-1,hit=0,fa=0,miss=0,cr=0,resp=false;
  area.innerHTML=`<div class="hud"><span id="hp"></span><span>${n===2?'2 önceki':'1 önceki'} ile karşılaştır</span></div><div class="zone" style="height:min(42vh,300px);cursor:default"><div class="stim" id="stim"></div></div><button class="btn acc big" id="same" style="margin-top:14px;font-size:1.4rem">AYNI ✋</button>`;
  const stim=area.querySelector('#stim'),hp=area.querySelector('#hp'),btn=area.querySelector('#same');
  btn.onpointerdown=e=>{e.preventDefault();if(i<n||resp)return;resp=true;if(seq[i]===seq[i-n]){hit++;SFX.ok();btn.style.background='var(--ok)'}else{fa++;SFX.bad();btn.style.background='var(--bad)'}later(()=>btn.style.background='',300)};
  function score(){if(i>=n&&!resp){if(seq[i]===seq[i-n])miss++;else cr++}}

GAMES.ari={title:'Arı Postası',icon:'🐝',kind:'hafiza',skill:'İleriye dönük bellek: yapacağını unutmama',
 start:()=>0,show:l=>l+1,

 run(area,g,lvl,done){

  const st=area.querySelector('#st'),tb=area.querySelector('#tb'),ms=area.querySelector('#ms');
  area.querySelectorAll('[data-v]').forEach(b=>b.onpointerdown=e=>{e.preventDefault();if(ans===null)return;const good=b.dataset.v===ans,wasP=ans==='P';ans=null;
   if(good){if(wasP){pm++;ms.textContent='🐝 Arıyı unutmadın! ✓'}else{ok++;ms.textContent='✓'}ms.style.color='var(--ok)';SFX.ok()}
   else{ms.textContent=wasP?'Arı geldiğinde zile basacaktın!':'Yanlış kutu';ms.style.color='var(--bad)';SFX.bad()}stopAll();later(next,450)});
  function next(){if(i>=N)return fin();const it=seq[i];i++;area.querySelector('#hp').textContent=i+'/'+N;st.textContent=it[1];ans=it[0];
   tb.style.transition='none';tb.style.width='100%';void tb.offsetWidth;tb.style.transition=`width ${lim}ms linear`;tb.style.width='0%';
   later(()=>{if(ans!==null){const wasP=ans==='P';ans=null;ms.textContent=wasP?'🐝 Arıyı kaçırdın!':'Biraz daha hızlı!';ms.style.color=wasP?'var(--bad)':'var(--acc)';SFX.soft();later(next,450)}},lim)}
  function fin(){const oa=ok/(N-nP),pa=pm/nP,acc=.5*oa+.5*pa;done({acc,lvl:adapt(lvl,acc),detail:`Ayırma doğruluğu: <b>%${Math.round(oa*100)}</b><br>🐝 Hatırlanan görev: <b>${pm}/${nP}</b>`})}

function result(G,res,old,onFinish,replay,warn,s){

function confetti(){const c=document.createElement('div');c.className='confetti';const E=['⭐','🌟','✨','🎉','💫'];for(let i=0;i<22;i++){const e=document.createElement('i');e.textContent=pick(E);e.style.left=rnd(100)+'%';e.style.animationDelay=(Math.random()*.8)+'s';c.appendChild(e)}document.body.appendChild(c);setTimeout(()=>c.remove(),3400)}

/* ================= PROGRAM / OTURUM ================= */
function sessions(p){return p.sessions||(p.sessions={})}
function doneCount(p){return Object.values(sessions(p)).filter(s=>s.done).length}
function todaySession(p){const S=sessions(p),t=today();if(!S[t])S[t]={day:doneCount(p)+1,steps:{},done:false};return S[t]}
function streak(p){const S=sessions(p);let d=today();if(!(S[d]&&S[d].done))d=addDays(d,-1);let n=0;while(S[d]&&S[d].done){n++;d=addDays(d,-1)}return n}
function plan(p,day){const g=p.group,m=MEM[g];return{att:ATT[(day-1)%ATT.length],mem:m[(day-1)%m.length]}}
function dueCards(p){const t=today();return (p.cards||[]).filter(c=>c.due<=t)}
function stepDots(s,cur){return `<div class="dots">${STEPS.map(st=>`<i class="${s.steps[st.k]?'d':st.k===cur?'c':''}"></i>`).join('')}</div>`}

function runSession(only){
 const p=P(),s=todaySession(p);save();
 const nx=only?STEPS.find(st=>st.k===only):STEPS.find(st=>!s.steps[st.k]);
 if(!nx){finishSession();return}
 const pl=plan(p,s.day);const dots=stepDots(s,nx.k);
 const cont=()=>{if(!s.done&&STEPS.every(x=>s.steps[x.k])){finishSession();return}if(only)go('program');else runSession()};
 const out=()=>go('program');
 if(nx.k==='nefes')breath(dots,()=>{s.steps.nefes=1;save();cont()},out);
 if(nx.k==='dikkat')playGame(pl.att,dots,r=>{if(!r)return out();s.steps.dikkat={k:pl.att,a:Math.round(r.acc*100)};save();cont()});
 if(nx.k==='hafiza')playGame(pl.mem,dots,r=>{if(!r)return out();s.steps.hafiza={k:pl.mem,a:Math.round(r.acc*100)};save();cont()});
 if(nx.k==='kopru')bridgeFlow(dots,true,()=>{s.steps.kopru=1;save();cont()},out);
 if(nx.k==='hareket')moveStep(dots,()=>{s.steps.hareket=1;save();cont()},out);
}
function finishSession(){
 const p=P(),s=todaySession(p);const first=!s.done;s.done=true;save();stopAll();nav(false);window.scrollTo(0,0);

 <p class="mut">Seri: <b>${streak(p)} gün</b> üst üste 🔥</p></div>

}

document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
function go(v){stopAll();VIEW=v;window.scrollTo(0,0);if(!P()){setup();return}
 ({home,program,bridge:bridgeView,progress,guide})[v]();nav(true)}
function topBar(){const p=P(),g=GROUPS[p.group];return `<div class="top"><div class="brand"><div class="lg">🌉</div>Zihin Köprüsü</div><button class="chip" id="pf">${p.av||g.ic} ${esc(p.name)} ▾</button></div>`}
function bindTop(){$('#pf').onclick=profiles}
const foot=`<div class="foot">Hazırlayan: <b>Barış Öğretmen</b> · Özel Eğitim Uzman Öğretici · Eğitim Koçu<br><a href="https://baris-ogretmen.github.io/site-1/" target="_blank" rel="noopener">baris-ogretmen.github.io/site-1</a></div>`;

function setup(isAdd){
 nav(false);let grp='kasif',av=AVS[0];
 app().innerHTML=`<div class="top"><div class="brand"><div class="lg">🌉</div>Zihin Köprüsü</div>${isAdd?'<button class="btn ghost" id="cx">Vazgeç</button>':''}</div>
 ${isAdd?'':`<div class="card hero"><h1>Dikkat ve hafıza oyun dünyası</h1><p class="mut">Bilimsel temelli 14 oyun, hafıza teknikleri okulu ve okulda öğrenileni kalıcı yapan Hafıza Köprüsü. İstersen 30 günlük maceraya da katıl!</p></div>`}
 <div class="card"><h2>${isAdd?'Yeni çocuk ekle':'Hadi tanışalım'}</h2>
 <input type="text" id="nm" placeholder="Çocuğun adı" maxlength="24">
 <p style="margin-top:14px;font-weight:800">Kahramanını seç</p><div class="avs">${AVS.map((a,i)=>`<button data-a="${a}" class="${i===0?'on':''}">${a}</button>`).join('')}</div>
 <p style="margin-top:14px;font-weight:800">Yaş grubu</p>
 <div class="grp">${Object.entries(GROUPS).map(([k,v])=>`<button data-g="${k}" class="${k===grp?'on':''}"><b>${v.ic}</b>${v.ad}<br><span class="mut small">${v.yas}</span></button>`).join('')}</div>
 ${isAdd?'':`<div class="note small"><b>Ekran Süresi Sözleşmesi</b><br>Bu program çocuğunuzun ekran süresini artırmak için değil, o süreyi bilinçli ve amaçlı kullanmak için hazırlandı.</div>
 <label class="chk"><input type="checkbox" id="ag"><span class="small">Ekran süresinin <b>denetimi ve sorumluluğunun bende</b> olduğunu biliyorum. Günlük oyun süresini çocuğumla birlikte belirleyip takip edeceğim; yatmadan önceki 1 saat içinde kullanmayacağız. Bu programın tıbbi bir tanı ya da tedavi olmadığını biliyorum.</span></label>`}
 <button class="btn pri big" id="go">${isAdd?'Ekle':'Programı Başlat 🚀'}</button></div>${isAdd?'':foot}`;
 document.querySelectorAll('.grp button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.grp button').forEach(x=>x.classList.remove('on'));b.classList.add('on');grp=b.dataset.g});
 document.querySelectorAll('.avs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.avs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');av=b.dataset.a});
 if($('#cx'))$('#cx').onclick=()=>go('home');
 $('#go').onclick=()=>{const n=$('#nm').value.trim();if(!n){$('#nm').focus();$('#nm').classList.add('shake');setTimeout(()=>$('#nm').classList.remove('shake'),400);return}
  if(!isAdd&&!$('#ag').checked){$('label.chk').classList.add('shake');setTimeout(()=>$('label.chk').classList.remove('shake'),400);return}
  const p={id:uid(),name:n,av:av,group:grp,created:today(),sessions:{},levels:{},first:{},cards:[],surveys:{},hist:[]};DB.profiles.push(p);DB.active=p.id;save();VIEW='home';go('home')};
}

function profiles(){
 const m=document.createElement('div');m.className='modal';
 m.innerHTML=`<div class="card"><h2>Çocuklar</h2>${DB.profiles.map(p=>`<div class="clist"><div class="it"><span style="font-size:1.5rem">${GROUPS[p.group].ic}</span><div class="grow"><b>${esc(p.name)}</b><br><span class="mut small">${GROUPS[p.group].ad} · ${doneCount(p)}/30 gün</span></div>${p.id===DB.active?'<span class="bx">Seçili</span>':`<button class="btn" data-id="${p.id}">Seç</button>`}</div></div>`).join('')}
 <p class="small" style="font-weight:800;margin:12px 0 4px">Seçili çocuğun yaş grubu</p><div class="row wrap">${Object.entries(GROUPS).map(([k,v])=>`<button class="chip${P().group===k?' on':''}" data-gr="${k}">${v.ic} ${v.ad}</button>`).join('')}</div>
 <button class="btn big" id="ad" style="margin-top:10px">+ Kardeş / çocuk ekle</button>
 <div class="row" style="margin-top:12px"><button class="btn grow" id="snd">${DB.sound?'🔊 Ses açık':'🔇 Ses kapalı'}</button><button class="btn ghost" id="cl">Kapat</button></div></div>`;
 document.body.appendChild(m);
 m.onclick=e=>{if(e.target===m)m.remove()};
 m.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{DB.active=b.dataset.id;save();m.remove();go(VIEW)});
 m.querySelector('#ad').onclick=()=>{m.remove();setup(true)};
 m.querySelectorAll('[data-gr]').forEach(b=>b.onclick=()=>{P().group=b.dataset.gr;save();m.remove();go(VIEW)});
 m.querySelector('#snd').onclick=e=>{DB.sound=!DB.sound;save();e.target.textContent=DB.sound?'🔊 Ses açık':'🔇 Ses kapalı'};
 m.querySelector('#cl').onclick=()=>m.remove();
}

function surveyWeek(p){const w=Math.min(4,Math.floor(doneCount(p)/7));return(p.surveys||{})[w]?null:w}
const SQ=['Bir işe odaklanıp sürdürebiliyor','Öğrendiğini ertesi gün hatırlıyor','Verilen talimatları eksiksiz takip ediyor','Ödev ya da etkinlik başında oturabiliyor'];

function tile(k,p){const G=GAMES[k],b=(p.best||{})[k]||0,l=p.levels&&p.levels[k]!=null?p.levels[k]:G.start(p.group);
 return `<button class="tile" data-play="${k}"><span class="tl">Sv ${G.show(l)}</span><div class="ti">${G.icon}</div><b>${gameTitle(k,p.group)}</b><div class="ts">${'★'.repeat(b)}<span style="color:var(--line)">${'★'.repeat(3-b)}</span></div></button>`}
function badges(p){const pl=p.plays||{},cs=p.cards||[],all=allGames(p.group);const w=i=>WORLDS[i].g.filter(k=>all.includes(k)).every(k=>pl[k]);
 return [['🎮','İlk Adım','İlk oyununu oynadın',Object.keys(pl).length>0],['🌲','Orman Kâşifi','Odak Ormanı’nın tüm oyunları',w(0)],['🗼','Kule Bekçisi','Kontrol Kulesi’nin tüm oyunları',w(1)],
  ['🏰','Kale Fatihi','Hafıza Kalesi’nin tüm oyunları',w(2)],['🎓','Teknik Ustası','Hafıza Teknikleri Okulu',w(3)],['🌟','Üç Yıldız','Bir oyunda 3 yıldız',Object.values(p.best||{}).some(v=>v>=3)],
  ['🌉','Köprü Kurucu','10 kart ekledin',cs.length>=10],['🏯','Kale Muhafızı','Bir kart Kale’ye ulaştı',cs.some(c=>c.box===6)],['🔥','7 Gün Seri','7 gün üst üste macera',streak(p)>=7],
  ['⭐','Yıldız Avcısı','100 yıldız',(p.stars||0)>=100],['👑','Efsane','360 yıldız',(p.stars||0)>=360],['🏅','30 Gün Kahramanı','30 günlük macerayı bitirdin',doneCount(p)>=30]]}
function home(){
 const p=P(),st=p.stars||0,rk=rank(st),r=rk.r,nx=rk.nx,dueN=dueCards(p).length,dc=doneCount(p),mins=Math.round(((p.time||{})[today()]||0)/60);
 const all=allGames(p.group),seed=+today().replace(/-/g,'');const pl=p.plays||{};
 const sug=all.slice().sort((a,b)=>(pl[a]||0)-(pl[b]||0)||((seed*(a.length+7)+a.charCodeAt(0))%17)-((seed*(b.length+7)+b.charCodeAt(0))%17)).slice(0,3);
 app().innerHTML=`${topBar()}
 <div class="card hero"><div class="player"><div class="av">${p.av||GROUPS[p.group].ic}</div><div class="grow"><div class="mut small">${r[2]} ${r[1].toLocaleUpperCase('tr')}</div><div style="font-size:1.4rem;font-weight:900">${esc(p.name)}</div><div class="small">⭐ ${st} yıldız · ⏱️ bugün ${mins} dk</div></div></div>
 <div class="bar"><i style="width:${nx?Math.min(100,(st-r[0])/(nx[0]-r[0])*100):100}%"></i></div><div class="mut small">${nx?`${nx[2]} ${nx[1]} rütbesine ${nx[0]-st} yıldız kaldı`:'En yüksek rütbedesin! 👑'}</div></div>
 <h3>🎲 Bugün senin için</h3><div class="tiles t3">${sug.map(k=>tile(k,p)).join('')}</div>
 <div class="tiles" style="margin-top:12px">
  <button class="tile wide" data-go="program"><div class="ti">🗺️</div><div class="grow"><b style="margin:0">30 Günlük Macera</b><div class="mut small">${dc?Math.min(dc,30)+'/30 gün tamam · isteğe bağlı':'İsteğe bağlı günlük program · 15 dk'}</div></div></button>
  <button class="tile" data-go="bridge"><div class="ti">🌉</div><b>Hafıza Köprüsü</b><div class="mut small">${dueN?dueN+' kart bekliyor':'Okulda öğrendiğini kalıcı yap'}</div></button>
  <button class="tile" data-go="calm"><div class="ti">🫧</div><b>Sakin Köşe</b><div class="mut small">1 dk odak nefesi</div></button>
 </div>
 ${WORLDS.map(w=>{const ks=w.g.filter(k=>all.includes(k));return `<div class="world"><div class="wi" style="background:${w.col}">${w.ic}</div><div><h3 style="margin:0">${w.ad}</h3><div class="mut small">${w.ac}</div></div></div><div class="tiles">${ks.map(k=>tile(k,p)).join('')}</div>`}).join('')}
 ${foot}`;
 bindTop();
 document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>playGame(b.dataset.play,'',()=>go('home')));
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const v=b.dataset.go;if(v==='calm')breath('',()=>go('home'),()=>go('home'));else go(v)});
}

function program(){
 const p=P(),S=sessions(p),t=today(),s=S[t],dc=doneCount(p),done=s&&s.done;
 const day=done?s.day:dc+1;const pl=plan(p,day);const sv=surveyWeek(p);const dueN=dueCards(p).length;
 const stepInfo=k=>k==='dikkat'?gameTitle(pl.att,p.group):k==='hafiza'?gameTitle(pl.mem,p.group):k==='kopru'?(dueN?dueN+' kart tekrar bekliyor':'Bugün öğrenileni ekle'):null;
 app().innerHTML=`${topBar()}
 <div class="card hero"><div class="row"><div class="grow"><div class="mut small">30 GÜNLÜK MACERA · GÜN</div><div class="daybig">${Math.min(day,30)}<span style="font-size:1.1rem;opacity:.8"> / 30</span></div></div><div style="text-align:right"><div style="font-size:1.8rem">🔥 ${streak(p)}</div><div class="mut small">gün seri</div></div></div>
 <div class="bar"><i style="width:${Math.min(100,dc/30*100)}%"></i></div><div class="mut small">${dc>=30?'30 gün tamamlandı! Dilerseniz devam edebilirsiniz.':(30-dc)+' gün kaldı · isteğe bağlı program'}</div></div>
 ${sv!==null?`<div class="card tip"><h3>📋 Haftalık veli gözlemi (1 dk)</h3><p class="small">${sv===0?'Başlangıçta çocuğunuzu bir değerlendirin; 4 hafta sonra farkı birlikte göreceğiz.':'Bu haftaki gözleminizi kaydedin.'}</p><button class="btn acc" id="sv">Gözlemi Doldur</button></div>`:''}
 <div class="card"><h2>${done?'Bugünkü macera tamam ✓':'Bugünün macerası'}</h2><p class="mut small">Sırayla gidebilir ya da istediğin adıma dokunabilirsin.</p>
 <ul class="steps">${STEPS.map(st=>{const ok=s&&s.steps[st.k];const inf=stepInfo(st.k);return `<li class="${ok?'ok':''}" data-step="${st.k}" style="cursor:pointer"><div class="ic">${st.ic}</div><div><b>${st.ad}</b><div class="mut small">${inf?inf+' · ':''}${st.ac}</div></div><span class="st" style="${ok?'':'color:var(--mut)'}">${ok?'✓':'›'}</span></li>`}).join('')}</ul>
 ${done?`<p class="mut">Bugünlük macera tamam. Az ama her gün, beyin için en güçlü formüldür. 🌙</p>`:`<button class="btn pri big" id="st">${s&&Object.keys(s.steps).length?'Kaldığın Yerden Devam ➜':'Maceraya Başla ➜'}</button>`}</div>
 <div class="card tip"><h3>${TIPS[(day-1)%TIPS.length][0]} Günün Hafıza Sırrı</h3><p>${TIPS[(day-1)%TIPS.length][1]}</p></div>
 <div class="card"><h3>ℹ️ Bu modül nedir?</h3><p class="small mut">30 Günlük Macera isteğe bağlıdır. Her gün yaklaşık 15 dakikalık dengeli bir rutin sunar: nefes, dikkat, hafıza, köprü ve ekransız bir final. Düzenli bir alışkanlık isteyen aileler için idealdir. Dilerseniz yalnızca Oyunlar bölümünden serbestçe de oynayabilirsiniz.</p></div>${foot}`;
 bindTop();
 if($('#st'))$('#st').onclick=()=>runSession();
 if($('#sv'))$('#sv').onclick=()=>survey(sv);
 document.querySelectorAll('[data-step]').forEach(li=>li.onclick=()=>runSession(li.dataset.step));
}

function survey(w){
 const p=P();const a=[0,0,0,0];
 const m=document.createElement('div');m.className='modal';
 m.innerHTML=`<div class="card"><h2>📋 ${w+1}. gözlem</h2><p class="mut small">Son bir haftayı düşünerek işaretleyin. <b>1 = çok zorlanıyor</b>, <b>5 = hiç zorlanmıyor</b>.</p>
 ${SQ.map((q,i)=>`<p style="font-weight:800;margin-top:12px">${q}</p><div class="scale" data-q="${i}">${[1,2,3,4,5].map(v=>`<button data-v="${v}">${v}</button>`).join('')}</div>`).join('')}
 <button class="btn pri big" id="ok" disabled>Kaydet</button><p class="center"><button class="btn ghost" id="cl">Sonra</button></p></div>`;
 document.body.appendChild(m);
 m.querySelectorAll('.scale').forEach(sc=>sc.querySelectorAll('button').forEach(b=>b.onclick=()=>{sc.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');a[+sc.dataset.q]=+b.dataset.v;m.querySelector('#ok').disabled=a.includes(0)}));
 m.querySelector('#ok').onclick=()=>{p.surveys=p.surveys||{};p.surveys[w]={d:today(),a:a.slice()};save();m.remove();go(VIEW)};
 m.querySelector('#cl').onclick=()=>m.remove();
}

function bridgeView(){
 const p=P(),cs=(p.cards||[]).slice().sort((a,b)=>a.due<b.due?-1:1),dueN=dueCards(p).length,kale=cs.filter(c=>c.box===6).length;
 app().innerHTML=`${topBar()}
 <div class="card"><h2>🌉 Hafıza Köprüsü</h2><p class="mut small">Her kart, doğru hatırlandıkça bir durak ilerler. Kale’ye ulaşan bilgi artık uzun süreli bellekte güvende demektir.</p>
 ${bridgeVisual(p)}
 <div class="row" style="margin-top:12px"><div class="grow"><b>${cs.length}</b> kart · <b>${kale}</b> kalede 🏰</div></div>
 ${dueN?`<button class="btn pri big" id="rv" style="margin-top:12px">Şimdi tekrar et (${dueN})</button>`:`<p class="mut">Bugün tekrar bekleyen kart yok. 👍</p>`}
 <button class="btn big" id="ad" style="margin-top:8px">+ Yeni bilgi ekle</button></div>
 <div class="card"><h3>Kartlar</h3><div class="clist">${cs.length?cs.map(c=>`<div class="it"><div class="grow"><b>${esc(c.f)}</b><div class="mut small">${esc(c.b)}</div><div class="mut small">${esc(c.s)} · sonraki tekrar: ${c.due<=today()?'<b style="color:var(--acc)">bugün</b>':trDate(c.due)}</div></div><span class="bx">${BOXN[c.box-1]}</span><button class="btn ghost" data-del="${c.id}" aria-label="Sil">🗑</button></div>`).join(''):'<p class="mut">Henüz kart yok. İlk kartı ekleyin!</p>'}</div></div>${foot}`;
 bindTop();
 if($('#rv'))$('#rv').onclick=()=>bridgeFlow('',false,()=>go('bridge'),()=>go('bridge'));
 $('#ad').onclick=bridgeAddOnly;
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Bu kart silinsin mi?')){p.cards=p.cards.filter(c=>c.id!==b.dataset.del);save();bridgeView()}});
}
function bridgeAddOnly(){bridgeFlow('',false,()=>go('bridge'),()=>go('bridge'),true)}

function lineChart(vals){
 if(vals.length<2)return '<p class="mut small">Grafik için en az 2 gün gerekli.</p>';
 const W=320,H=130,pad=22;const x=i=>pad+i*(W-pad*2)/(vals.length-1),y=v=>H-pad-(v/100)*(H-pad*2);
 const pts=vals.map((v,i)=>x(i)+','+y(v)).join(' ');
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Günlük doğruluk grafiği">${[0,50,100].map(v=>`<line x1="${pad}" x2="${W-pad}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="2" y="${y(v)+4}" font-size="9" fill="var(--mut)">${v}</text>`).join('')}<polyline points="${pts}" fill="none" stroke="var(--pri)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="var(--acc)"/>`).join('')}</svg>`;
}
function progress(){
 const p=P(),S=sessions(p),dates=Object.keys(S).filter(d=>S[d].done).sort(),dc=dates.length;
 const vals=dates.map(d=>{const s=S[d].steps;const a=[s.dikkat&&s.dikkat.a,s.hafiza&&s.hafiza.a].filter(v=>v!=null);return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0}).slice(-30);
 const keys=allGames(p.group);const sv=p.surveys||{};const ws=Object.keys(sv).map(Number).sort();
 const avg=w=>(sv[w].a.reduce((a,b)=>a+b,0)/4);
 const cs=p.cards||[];
 app().innerHTML=`${topBar()}
 <div class="card"><h2>📅 30 Günlük Yol</h2><div class="cal">${Array.from({length:30},(_,i)=>`<div class="${i<dc?'d':i===dc?'t':''}">${i<dc?'✓':i+1}</div>`).join('')}</div>
 <p class="mut small" style="margin-top:8px">Tamamlanan: <b>${dc}</b> gün · Seri: <b>${streak(p)}</b> gün 🔥</p></div>
 <div class="card"><h2>🎯 Günlük doğruluk</h2>${lineChart(vals)}<p class="mut small">Oyunlar kendini ayarlar: çocuk başardıkça zorlaşır. Bu yüzden doğruluk %70–85 arasında dalgalanır; asıl gelişimi aşağıdaki <b>seviyelerde</b> görürsünüz.</p></div>
 <div class="card"><h2>📈 Beceri seviyeleri</h2><table class="lvtab">${keys.map(k=>{const G=GAMES[k],f=p.first&&p.first[k],l=p.levels&&p.levels[k];return `<tr><td>${G.icon} ${gameTitle(k,p.group)}<div class="mut small">${G.skill}</div></td><td>${f==null?'<span class="mut">henüz yok</span>':G.show(f)+' → '+G.show(l)}</td></tr>`}).join('')}</table></div>
 <div class="card"><h2>🏅 Rozetler</h2><div class="badges">${badges(p).map(b=>`<div class="badge${b[3]?'':' off'}" title="${b[2]}"><span>${b[0]}</span>${b[1]}</div>`).join('')}</div><p class="mut small" style="margin-top:8px">Toplam ⭐ ${p.stars||0} yıldız · ${rank(p.stars||0).r[2]} ${rank(p.stars||0).r[1]}</p></div>
 <div class="card"><h2>🌉 Köprü özeti</h2>${bridgeVisual(p)}<p class="small">Toplam <b>${cs.length}</b> kart · Uzun süreli belleğe yerleşen (Kale): <b>${cs.filter(c=>c.box===6).length}</b></p></div>
 <div class="card"><h2>📋 Veli gözlemleri</h2>${ws.length?`<table class="lvtab">${SQ.map((q,i)=>`<tr><td>${q}</td><td>${ws.map(w=>sv[w].a[i]).join(' → ')}</td></tr>`).join('')}<tr><td><b>Ortalama</b></td><td>${ws.map(w=>avg(w).toFixed(1)).join(' → ')}</td></tr></table>${ws.length>1?`<p class="small" style="margin-top:8px">${avg(ws[ws.length-1])>avg(ws[0])?'🌱 Gözlemlerinizde olumlu bir değişim var. Rutine devam!':'Gelişim her çocukta farklı hızda olur. Rutini, uykuyu ve hareketi korumaya devam edin.'}</p>`:''}`:'<p class="mut">Henüz gözlem girilmedi. Ana sayfadaki haftalık gözlem kartından başlayabilirsiniz.</p>'}</div>
 <div class="card noprint"><h3>⚙️ Ayarlar</h3><div class="row wrap"><button class="btn" id="pr">🖨️ Gelişim raporunu yazdır</button><button class="btn ghost" id="rs" style="color:var(--bad)">Bu çocuğun verilerini sıfırla</button></div></div>${foot}`;
 bindTop();
 $('#pr').onclick=()=>window.print();
 $('#rs').onclick=()=>{if(confirm(p.name+' için tüm ilerleme ve kartlar silinecek. Emin misiniz?')){DB.profiles=DB.profiles.filter(x=>x.id!==p.id);DB.active=DB.profiles[0]?DB.profiles[0].id:null;save();go('home')}};
}

function guide(){
 app().innerHTML=`${topBar()}
 <div class="card hero"><h1>Veli Rehberi</h1><p class="mut">Bu programı neden, nasıl ve ne kadar kullanacağınızı anlatan kısa bir kılavuz.</p></div>
 <details class="g" open><summary>💌 Değerli Veli</summary><div class="gb">
 <p>Çocuğum dikkatini toplayamıyor, bugün öğrendiğini yarın unutuyor… Bu cümleleri çok sık duyuyorum ve endişenizi çok iyi anlıyorum.</p>
 <p>İyi haber şu: Hafıza ve dikkat, sabit özellikler değil; doğru alışkanlıklarla güçlenebilen beceriler. <b>Zihin Köprüsü</b>, bilişsel psikoloji araştırmalarında en sağlam kanıta sahip yöntemleri, çocuğunuzun yaşına uygun kısa bir günlük rutine dönüştürür.</p>
 <p>Sizden tek ricam: <b>30 gün boyunca, her gün, yaklaşık 15 dakika</b>, çocuğunuzun yanında olun. Az ama düzenli olan, çok ama düzensiz olandan her zaman daha etkilidir.</p>
 <p class="sig">Barış Öğretmen<br><span class="mut small">Özel eğitim alanında 11 yıl uzman öğretici · Eğitim koçu</span></p></div></details>
 <details class="g"><summary>🧠 Neden “bugün öğrenip yarın unutuyor”?</summary><div class="gb">
 <p>Bu, aslında beynin doğal çalışma biçimi. Psikolog Ebbinghaus’un <b>unutma eğrisi</b> çalışmaları, yeni öğrenilen bir bilginin büyük kısmının, tekrar edilmezse ilk günler içinde hızla silindiğini gösterir. Yani sorun çoğu zaman çocukta değil, bilginin <b>tekrar edilme biçimindedir</b>.</p>
 <p>Bilginin kısa süreli bellekten uzun süreli belleğe geçmesini sağlayan üç güçlü anahtar vardır:</p>
 <ul><li><b>Geri getirme pratiği:</b> Bilgiyi tekrar okumak yerine, kitabı kapatıp aklından hatırlamaya çalışmak. Her hatırlama denemesi, o bilgiye giden yolu güçlendirir.</li>
 <li><b>Aralıklı tekrar:</b> Aynı bilgiyi tek seferde 10 kez değil; 1 gün, birkaç gün, 1 hafta sonra gibi giderek açılan aralıklarla hatırlamak.</li>
 <li><b>Uyku:</b> Gün içinde öğrenilenler, uyku sırasında pekiştirilir. Düzenli ve yeterli uyku, hafızanın kayıt saatidir.</li></ul>
 <p><b>Hafıza Köprüsü</b> bölümü tam olarak bunu yapar: Okulda öğrenilen bilgiyi karta dönüştürür ve 1, 2, 4, 7, 15 ve 30 gün sonra çocuğunuzun karşısına otomatik olarak çıkarır. Unutulan kart başa döner; hatırlanan kart “Kale”ye doğru ilerler.</p></div></details>
 <details class="g"><summary>🎮 Oyunlar neyi çalıştırır? (bilimsel temeller)</summary><div class="gb">
 <p>Her oyun, bilişsel psikoloji ve gelişim araştırmalarında kullanılan bir görevden uyarlandı. Zorluk, çocuğun başarısına göre <b>kendiliğinden ayarlanır</b>: başardıkça zorlaşır, zorlandıkça kolaylaşır.</p>
 <h3>🌲 Odak Ormanı — dikkat</h3>
 <ul><li><b>⭐ Yıldız Avcısı</b> — “Git/Dur” görevi: aceleci tepkiyi frenleme.</li>
 <li><b>🔍 Hedef Avı</b> — Görsel tarama: kalabalıkta aranan bilgiyi bulma.</li>
 <li><b>🐠 Balık Sürüsü</b> — Flanker görevi (çocuklar için Dikkat Ağı Testi’nde de balıklar kullanılır): çevredeki karmaşayı görmezden gelme.</li>
 <li><b>🦉 Gece Nöbetçisi</b> — Sürekli performans görevi mantığı: sıkıcı anlarda bile uyanık kalma.</li></ul>
 <h3>🗼 Kontrol Kulesi — öz denetim ve esneklik</h3>
 <ul><li><b>🎨 Renk Tuzağı / Gece-Gündüz</b> — Stroop etkisi: otomatik gelen yanlış cevabı durdurma.</li>
 <li><b>🃏 Kart Ustası</b> — Boyut Değiştirmeli Kart Sıralama (DCCS): çocuklarda bilişsel esnekliği ölçmek için en yaygın kullanılan görevlerden biri. Kural değişince zihnin yeni kurala geçebilmesi.</li>
 <li><b>🐝 Arı Postası</b> — İleriye dönük bellek: “Ödevini götürmeyi, kitabını almayı unutma” gibi gelecekte yapılacak işleri hatırlama.</li></ul>
 <h3>🏰 Hafıza Kalesi — çalışma belleği</h3>
 <ul><li><b>💡 Işık Yolu</b> — Corsi blokları: görsel-uzamsal bellek.</li>
 <li><b>🗺️ Kim Nerede?</b> — Nesne-konum belleği.</li>
 <li><b>👁️ Ne Değişti?</b> — Değişim fark etme: sahneyi aklında fotoğraflama.</li>
 <li><b>🔗 Akıl Zinciri</b> — N-geri görevi: bilgiyi aklında tutup sürekli güncelleme (7 yaş ve üzeri).</li>
 <li><b>📋 Talimat Ustası</b> — Çok adımlı talimat takibi. Çalışma belleği zayıf çocukların sınıfta en çok zorlandığı alan budur: “Defterini aç, 12. sayfayı bul, 3. soruyu çöz.”</li></ul>
 <h3>🎓 Hafıza Teknikleri Okulu — kalıcı öğrenme</h3>
 <ul><li><b>🏛️ Akıl Sarayı</b> — Yer yöntemi: Antik çağdan beri bilinen ve bugün hafıza şampiyonlarının kullandığı teknik. Çocuk, bilgileri evinin odalarına yerleştirmeyi öğrenir; bu tekniği derslerde de kullanabilir.</li>
 <li><b>🔢 Sayı Zinciri</b> — Gruplama (parçalama): Kısa süreli belleğin sınırlı kapasitesini, bilgiyi gruplara ayırarak genişletme.</li>
 <li><b>🌉 Hafıza Köprüsü</b> — Aralıklı geri getirme: Okulda öğrenilen bilgiyi kalıcı hâle getirmenin en güçlü yolu.</li></ul>
 <p>Her oyun bir “Seviye” gösterir. Gelişim sekmesinde ilk seviye ile şimdiki seviyeyi karşılaştırabilirsiniz.</p>
<div class="note small"><b>Dürüst bir not:</b> Araştırmalar, ekran oyunlarının tek başına “mucize” etkisi olmadığını gösteriyor. Bu programın gücü; oyunların, aralıklı tekrar, uyku, hareket ve ebeveyn katılımıyla <b>birlikte</b> kullanılmasından gelir. Bu yüzden ekransız adımları atlamayın.</div></div></details>
 <details class="g"><summary>📱 Ekran süresi: sorumluluk ve öneriler</summary><div class="gb">
 <p>Bu program ekran süresini artırmak için değil, zaten verilen ekran süresini <b>amaçlı ve bilinçli</b> kullanmak için hazırlandı. Ekran süresinin denetimi ve sorumluluğu tamamen sizdedir.</p>
 <ul><li>Günlük önerimiz <b>15–20 dakika</b>. Ana ekranda bugünkü oyun süresi görünür; 20 dakika dolunca uygulama mola önerir.</li>
 <li>Oturumu <b>çocuğunuzun yanında</b> yapın. Sizin varlığınız, oyunu bir aile ritüeline dönüştürür.</li>
 <li><b>Yatmadan önceki 1 saat</b> ekran kullanmayın; ekran ışığı ve heyecan uykuyu geciktirebilir.</li>
 <li>Her gün <b>aynı saatte</b> yapın (ör. okul dönüşü atıştırmalıktan sonra). Rutin, dikkatin en iyi dostudur.</li>
 <li>Dünya Sağlık Örgütü, 2–4 yaş çocuklar için günlük ekran süresinin <b>1 saati geçmemesini</b> önerir. Okul öncesi çocuklarda bu programın 15 dakikası, o günkü toplam süreye dahildir.</li>
 <li>Uygulamada katı bir süre kilidi yoktur; sınırı siz belirlersiniz. Süreyi oyuna başlamadan önce çocuğunuzla konuşup birlikte kararlaştırın.</li></ul></div></details>
 <details class="g"><summary>🌙 Ekransız destek: uyku, hareket, ev düzeni</summary><div class="gb">
 <ul><li><b>Uyku:</b> 3–5 yaş için gece-gündüz toplam 10–13 saat; 6–12 yaş için 9–12 saat; 13 yaş ve üzeri için 8–10 saat uyku önerilir. Uykusuz bir beyin ne dikkat edebilir ne de öğrendiğini kaydedebilir.</li>
 <li><b>Hareket:</b> Okul çağındaki çocuklar için günde ortalama 60 dakika hareketli oyun önerilir. Bahçe, bisiklet, ip atlama… hepsi dikkat için yatırımdır.</li>
 <li><b>Kısa ve tek talimat:</b> “Odana git, çantanı hazırla, dişini fırçala” yerine bir talimat verin; tamamlanınca diğerine geçin. Gerekirse çocuğunuza talimatı tekrar ettirin.</li>
 <li><b>Ödev ortamı:</b> Sessiz bir köşe, masada yalnızca o ders, telefon ve tablet başka odada.</li>
 <li><b>Çalışma blokları:</b> Yaşa göre 10–25 dakika çalışma, ardından 5 dakika hareketli mola.</li>
 <li><b>“Ne öğrendin?” yerine:</b> “Bugün öğretmenin sana en ilginç ne anlattı?” diye sorun ve cevabı Köprü’ye kart olarak ekleyin.</li></ul></div></details>
 <details class="g"><summary>🗺️ Serbest oyun ve 30 Günlük Macera</summary><div class="gb">
 <p>Tüm oyunlar ana ekranda <b>serbestçe</b> oynanabilir: Çocuk istediği oyunu seçer, yıldız toplar, rütbe atlar, rozet kazanır. Düzenli bir rutin isteyen aileler için <b>30 Günlük Macera</b> isteğe bağlı bir modüldür; adımları istediğiniz sırayla yapabilirsiniz:</p>
 <ol><li><b>Odak Nefesi (1 dk):</b> Zihni sakinleştirir, oyuna hazırlar.</li>
 <li><b>Dikkat Oyunu (≈3 dk):</b> Her gün farklı bir dikkat becerisi.</li>
 <li><b>Hafıza Oyunu (≈3 dk):</b> Çalışma belleği antrenmanı.</li>
 <li><b>Hafıza Köprüsü (3–5 dk):</b> Vadesi gelen kartları hatırlama + bugün okulda öğrenilenleri ekleme. <i>Programın kalbi burasıdır.</i></li>
 <li><b>Hareket + Öğretmen Ol (2 dk, ekransız):</b> Çocuk, öğrendiği bir şeyi size anlatır. Bir bilgiyi anlatabilmek, onu en derin şekilde öğrenmektir.</li></ol>
 <p>Her hafta başında <b>1 dakikalık veli gözlemi</b> istenir. 4 hafta sonunda ilk haftayla karşılaştırarak değişimi birlikte görürsünüz. Tüm veriler yalnızca bu cihazda saklanır; hiçbir yere gönderilmez.</p></div></details>
 <details class="g"><summary>🩺 Ne zaman bir uzmana başvurmalıyım?</summary><div class="gb">
 <p>Her dikkat dağınıklığı bir bozukluk değildir; çoğu zaman yaşa, uykuya, ekran alışkanlıklarına ve ortama bağlıdır. Ancak aşağıdaki durumlarda bir <b>çocuk ve ergen ruh sağlığı uzmanına</b> ya da <b>Rehberlik ve Araştırma Merkezi’ne (RAM)</b> başvurmanızı öneririm:</p>
 <ul><li>Dikkat sorunları, aşırı hareketlilik veya dürtüsellik <b>hem evde hem okulda</b> görülüyor ve uzun süredir (aylardır) devam ediyorsa,</li>
 <li>Akademik başarıyı, arkadaşlık ilişkilerini veya aile hayatını belirgin şekilde zorluyorsa,</li>
 <li>Okuma, yazma veya matematikte yaşıtlarından belirgin bir geride kalma varsa,</li>
 <li>Uyku düzensizliği, sürekli yorgunluk, işitme ya da görme ile ilgili şüpheler varsa.</li></ul>
 <div class="note small">Bu program <b>tıbbi bir tanı ya da tedavi aracı değildir</b>; DEHB gibi durumlarda uzman desteğinin ve uzmanın önerdiği tedavinin yerini tutmaz. Ancak her çocuk için güvenle uygulanabilecek, destekleyici bir alışkanlık programıdır.</div></div></details>
 <details class="g"><summary>❓ Sık sorulan sorular</summary><div class="gb">
 <p><b>Bir gün kaçırırsak ne olur?</b><br>Hiçbir şey; kaldığınız günden devam edersiniz. Köprü kartları da bekler. Önemli olan pes etmemek.</p>
 <p><b>Çocuğum oyunda zorlanıp üzülüyor.</b><br>Oyunlar çocuk zorlandığında kendiliğinden kolaylaşır. Sonuca değil emeğe övgü verin: “Çok dikkatli baktın!”</p>
 <p><b>Köprüye ne tür bilgiler eklemeliyim?</b><br>Kısa, tek cevaplı bilgiler en iyisidir: bir kelimenin anlamı, bir çarpım, bir kavramın tanımı, bir tarih. Uzun konuları küçük kartlara bölün.</p>
 <p><b>Kardeşler birlikte kullanabilir mi?</b><br>Evet. Üstteki isim düğmesinden her çocuk için ayrı profil açabilirsiniz.</p>
 <p><b>Veriler nerede saklanıyor?</b><br>Yalnızca bu cihazın tarayıcısında. Tarayıcı verilerini silerseniz ilerleme de silinir.</p></div></details>
