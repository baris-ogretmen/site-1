<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MatAkış — Gör, Dokun, Oyna Matematik</title>
<meta name="description" content="Okul öncesinden LGS'ye görsel, animasyonlu ve oyunlaştırılmış matematik atölyesi.">
<meta name="theme-color" content="#f5efe3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --zemin:#f5efe3; --zemin2:#efe7d6; --kart:#fffdf8; --yazi:#22324a; --soluk:#6b7688; --cizgi:#e4dccb;
  --teal:#2f9e8f; --turuncu:#e8763a; --lacivert:#2d4b7c; --gri:#9aa3ad; --sari:#f2b33d; --mor:#7b61b5; --kirmizi:#e05252; --yesil:#43a85a; --mavi:#3a86d6;
  --golge:0 10px 30px -12px rgba(40,50,70,.25), 0 2px 6px rgba(40,50,70,.06);
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--yazi);background:var(--zemin);
  background-image:repeating-linear-gradient(-30deg,rgba(120,100,70,.045) 0 2px,transparent 2px 22px);min-height:100vh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select{font-family:inherit}
.gizli{display:none!important}

/* ÜST BAR */
.ust{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));
  background:rgba(245,239,227,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--cizgi)}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;letter-spacing:.5px;cursor:pointer;user-select:none}
.logo small{display:block;font-size:10px;font-weight:800;color:var(--soluk);letter-spacing:2px;margin-top:-3px}
.ust .bosluk{flex:1}
.pil{display:flex;align-items:center;gap:6px;background:var(--kart);border:1px solid var(--cizgi);border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;white-space:nowrap}
.ikon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--cizgi);background:var(--kart);font-size:18px;display:grid;place-items:center;flex:none}
.ikon-btn.soluk{opacity:.55}
.ikon-btn:active{transform:scale(.94)}
@media (max-width:560px){.pil.kul{display:none}.logo small{display:none}}

main{max-width:1180px;margin:0 auto;padding:16px 16px 90px}

/* ANA SAYFA */
.hero{position:relative;border-radius:26px;padding:26px 24px;background:linear-gradient(135deg,#fffaf0,#f3e9d6);border:1px solid var(--cizgi);box-shadow:var(--golge);overflow:hidden;display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:center}
.hero h1{margin:0 0 6px;font-size:clamp(26px,4.4vw,44px);line-height:1.05;font-weight:900}
.hero h1 .r1{color:var(--teal)} .hero h1 .r2{color:var(--turuncu)} .hero h1 .r3{color:var(--lacivert)}
.hero p{margin:0 0 14px;color:var(--soluk);font-weight:700;font-size:15px;max-width:520px}
.hero .formul{font-weight:900;font-size:22px;letter-spacing:1px;margin-bottom:10px}
.hero .formul .a{color:var(--teal)} .hero .formul .b{color:var(--turuncu)} .hero .formul .c{color:var(--lacivert)}
.hero svg{width:100%;height:auto;max-height:260px}
.hero-btns{display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero svg{max-height:190px;order:-1}}

.btn{border:none;border-radius:14px;padding:12px 18px;font-weight:800;font-size:15px;background:var(--lacivert);color:#fff;box-shadow:0 4px 0 #1b3054;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1b3054}
.btn.teal{background:var(--teal);box-shadow:0 4px 0 #1f7368}.btn.teal:active{box-shadow:0 1px 0 #1f7368}
.btn.tur{background:var(--turuncu);box-shadow:0 4px 0 #b4551f}.btn.tur:active{box-shadow:0 1px 0 #b4551f}
.btn.acik{background:var(--kart);color:var(--yazi);border:1px solid var(--cizgi);box-shadow:0 4px 0 var(--cizgi)}
.btn.kucuk{padding:8px 12px;font-size:13px;border-radius:11px}
.btn:disabled{opacity:.45;pointer-events:none}

.bolum-baslik{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 2px 10px;flex-wrap:wrap}
.bolum-baslik h2{margin:0;font-size:20px;font-weight:900}
.cipler{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.cipler::-webkit-scrollbar{display:none}
.cip{flex:none;border:1px solid var(--cizgi);background:var(--kart);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;color:var(--soluk)}
.cip.aktif{background:var(--yazi);color:#fff;border-color:var(--yazi)}

.izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.mkart{position:relative;background:var(--kart);border:1px solid var(--cizgi);border-radius:var(--r);box-shadow:var(--golge);overflow:hidden;cursor:pointer;transition:transform .15s, box-shadow .15s;text-align:left;padding:0;display:flex;flex-direction:column}
.mkart:hover{transform:translateY(-3px)}
.mkart:active{transform:scale(.98)}
.mkart .resim{height:118px;display:grid;place-items:center;position:relative}
.mkart .resim svg{width:100%;height:100%}
.mkart .govde{padding:12px 14px 14px}
.mkart h3{margin:0 0 3px;font-size:17px;font-weight:900}
.mkart p{margin:0;color:var(--soluk);font-size:13px;font-weight:700;line-height:1.35}
.mkart .alt{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.sinif-et{font-size:11px;font-weight:900;letter-spacing:.5px;padding:4px 8px;border-radius:8px;background:var(--zemin2);color:var(--soluk)}
.yildizlar{font-size:14px;letter-spacing:1px;color:#d9cfbb}.yildizlar b{color:var(--sari);font-weight:400}
.mkart.ozel{grid-column:span 2}
.mkart.ozel .resim{height:170px}
.rozet-yeni{position:absolute;top:10px;left:10px;background:var(--turuncu);color:#fff;font-size:11px;font-weight:900;padding:4px 9px;border-radius:999px;z-index:2}
@media (max-width:520px){.mkart.ozel{grid-column:span 1}.izgara{grid-template-columns:1fr 1fr;gap:10px}.mkart .resim{height:92px}.mkart.ozel{grid-column:span 2}.mkart h3{font-size:15px}.mkart p{font-size:12px}}

/* MODÜL SAYFASI */
.mbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.mbar h2{margin:0;font-size:22px;font-weight:900;display:flex;align-items:center;gap:8px}
.sekmeler{display:flex;gap:6px;background:var(--zemin2);padding:5px;border-radius:14px;margin-left:auto}
.sekme{border:none;background:transparent;border-radius:10px;padding:8px 14px;font-weight:800;font-size:14px;color:var(--soluk)}
.sekme.aktif{background:var(--kart);color:var(--yazi);box-shadow:0 2px 6px rgba(0,0,0,.08)}
@media (max-width:640px){.sekmeler{margin-left:0;width:100%}.sekme{flex:1;padding:8px 6px}}

.duzen{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
@media (max-width:900px){.duzen{grid-template-columns:1fr}}
.sahne-kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:22px;box-shadow:var(--golge);overflow:hidden;position:relative}
.sahne-ust{display:flex;gap:6px;padding:10px 10px 0;flex-wrap:wrap}
.sahne-kutu{position:relative;width:100%}
.sahne-kutu svg.sahne{display:block;width:100%;height:auto;max-height:66vh;touch-action:none;user-select:none;-webkit-user-select:none}
.anlatim{margin:0 12px 12px;padding:12px 14px;border-radius:14px;background:var(--zemin);font-weight:800;font-size:16px;line-height:1.45;min-height:50px;transition:opacity .25s}
.anlatim .f{font-weight:900;white-space:nowrap}
.kontrol{background:var(--kart);border:1px solid var(--cizgi);border-radius:22px;box-shadow:var(--golge);padding:14px;display:flex;flex-direction:column;gap:12px}
.kontrol h4{margin:0;font-size:13px;letter-spacing:1px;color:var(--soluk);font-weight:900;text-transform:uppercase}
.kd{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.kd label{font-weight:800;font-size:14px}
.kd output{font-weight:900;font-size:16px;min-width:34px;text-align:right}
.kd input{grid-column:1/-1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:var(--zemin2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--kc,var(--lacivert));margin-top:-9px;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:var(--zemin2)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--kc,var(--lacivert));border:3px solid #fff}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;border:1px solid var(--cizgi);background:var(--kart);border-radius:11px;padding:8px 10px;font-weight:800;font-size:13px;color:var(--soluk)}
.seg button.aktif{background:var(--yazi);border-color:var(--yazi);color:#fff}
.satir{display:flex;gap:8px;flex-wrap:wrap}
.satir .btn{flex:1 1 auto}
.adim{display:flex;align-items:center;gap:8px;justify-content:space-between}
.adim label{font-weight:800;font-size:14px}
.adim .k{display:flex;align-items:center;gap:6px}
.adim button{width:36px;height:36px;border-radius:10px;border:1px solid var(--cizgi);background:var(--zemin);font-size:20px;font-weight:900}
.adim b{min-width:30px;text-align:center;font-size:18px}
.bilgi{background:var(--zemin);border-radius:14px;padding:12px;font-weight:700;font-size:14px;line-height:1.5}
.bilgi b{font-weight:900}
.buyuk-formul{font-size:22px;font-weight:900;text-align:center;letter-spacing:.5px;line-height:1.5}
.kesir{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 2px;font-weight:900}
.kesir>span:first-child{border-bottom:2px solid currentColor;padding:0 3px 2px}
.kesir>span:last-child{padding:2px 3px 0}
.rt{color:var(--teal)}.ro{color:var(--turuncu)}.rl{color:var(--lacivert)}.rk{color:var(--kirmizi)}.ry{color:var(--yesil)}.rm{color:var(--mor)}.rs{color:#c88a10}

/* OYUN */
.oyun{max-width:880px;margin:0 auto}
.seviye-sec{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:10px 0}
.seviye-sec button{border:1px solid var(--cizgi);background:var(--kart);border-radius:20px;padding:20px 10px;box-shadow:var(--golge);font-weight:900;font-size:18px}
.seviye-sec button span{display:block;font-size:34px;margin-bottom:6px}
.seviye-sec button small{display:block;font-size:12px;color:var(--soluk);font-weight:700;margin-top:4px}
.okart{background:var(--kart);border:1px solid var(--cizgi);border-radius:24px;box-shadow:var(--golge);padding:18px;position:relative}
.ust-bilgi{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.noktalar{display:flex;gap:5px;flex-wrap:wrap}
.noktalar i{width:12px;height:12px;border-radius:50%;background:var(--zemin2);display:block}
.noktalar i.d{background:var(--teal)}.noktalar i.y{background:var(--kirmizi)}.noktalar i.s{outline:3px solid var(--sari);outline-offset:1px}
.soru-metin{font-size:clamp(18px,2.6vw,24px);font-weight:900;line-height:1.4;margin:6px 0 10px}
.soru-gorsel svg{display:block;width:100%;height:auto;max-height:300px}
.secenekler{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.secenek{border:2px solid var(--cizgi);background:var(--kart);border-radius:16px;padding:14px 10px;font-size:20px;font-weight:900;min-height:64px;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 4px 0 var(--cizgi);transition:transform .08s}
.secenek:active{transform:translateY(3px);box-shadow:0 1px 0 var(--cizgi)}
.secenek .harf{font-size:12px;color:var(--soluk);margin-right:4px}
.secenek.dogru{background:#e3f6ef;border-color:var(--teal);box-shadow:0 4px 0 var(--teal)}
.secenek.yanlis{background:#fde8e6;border-color:var(--kirmizi);box-shadow:0 4px 0 var(--kirmizi);animation:salla .35s}
.secenek[disabled]{cursor:default}
@keyframes salla{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.geri-bildirim{margin-top:14px;border-radius:16px;padding:12px 14px;font-weight:800}
.geri-bildirim.iyi{background:#e3f6ef;color:#1f6f63}.geri-bildirim.kotu{background:#fde8e6;color:#9b2f2f}
.cozum-kutu{margin-top:12px;border:2px dashed var(--cizgi);border-radius:18px;padding:10px;background:var(--zemin)}
.cozum-kutu h4{margin:2px 4px 8px;font-size:14px;font-weight:900;color:var(--lacivert)}
.cozum-kutu svg{display:block;width:100%;height:auto;max-height:340px}
.cozum-metin{font-weight:800;font-size:15px;line-height:1.6;padding:6px 6px 2px}
.sonuc{text-align:center;padding:26px 10px}
.sonuc .yb{font-size:56px;letter-spacing:6px}
.sonuc h2{margin:6px 0;font-size:30px;font-weight:900}
.seri{font-weight:900;color:var(--turuncu)}

/* MODAL */
.modal-arka{position:fixed;inset:0;background:rgba(25,32,45,.45);z-index:200;display:grid;place-items:center;padding:16px;animation:belir .2s}
.modal{background:var(--kart);border-radius:24px;max-width:560px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.4);padding:20px;position:relative}
.modal h3{margin:0 0 12px;font-size:22px;font-weight:900}
.modal .kapat{position:absolute;top:12px;right:12px}
.modal .grup{border-top:1px solid var(--cizgi);padding-top:12px;margin-top:12px}
.modal .grup h5{margin:0 0 8px;font-size:12px;letter-spacing:1.5px;color:var(--soluk);font-weight:900}
.ayar-satir{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;font-weight:800}
.anahtar{width:52px;height:30px;border-radius:999px;background:var(--zemin2);border:none;position:relative;flex:none}
.anahtar::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.anahtar.acik{background:var(--teal)}.anahtar.acik::after{left:25px}
.alan{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--cizgi);font-size:16px;font-weight:700;background:#fff;color:var(--yazi)}
@keyframes belir{from{opacity:0}to{opacity:1}}
.tablo{width:100%;border-collapse:collapse;font-size:13px}
.tablo th,.tablo td{padding:7px 6px;border-bottom:1px solid var(--cizgi);text-align:left}
.tablo th{font-weight:900;color:var(--soluk);font-size:11px;letter-spacing:1px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--yazi);color:#fff;padding:12px 18px;border-radius:14px;font-weight:800;z-index:400;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:belir .2s;max-width:90vw;text-align:center}
#konfeti{position:fixed;inset:0;pointer-events:none;z-index:300}

/* KARŞILAMA / GİRİŞ */
.karsila .adimlar{display:grid;gap:10px;margin:14px 0}
.karsila .adimlar div{display:flex;gap:12px;align-items:center;background:var(--zemin);border-radius:14px;padding:10px 12px;font-weight:800;font-size:14px}
.karsila .adimlar span{font-size:26px}
.giris-ekran{min-height:calc(100vh - 80px);display:grid;place-items:center}

/* TAHTA ARAÇLARI */
#tahtaTuval{position:fixed;inset:0;z-index:150;pointer-events:none}
#tahtaTuval.aktif{pointer-events:auto;cursor:crosshair}
.tahta-cubuk{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:160;display:flex;gap:4px;background:var(--kart);border:1px solid var(--cizgi);border-radius:16px;padding:6px;box-shadow:var(--golge);max-width:96vw;overflow-x:auto}
.tahta-cubuk button{flex:none;width:42px;height:42px;border-radius:11px;border:none;background:transparent;font-size:19px}
.tahta-cubuk button.aktif{background:var(--zemin2)}
.tahta-cubuk .renk{width:24px;height:24px;border-radius:50%;align-self:center;border:3px solid #fff;box-shadow:0 0 0 1px var(--cizgi)}
.spot{position:fixed;inset:0;z-index:155;pointer-events:none}
.perde{position:fixed;left:0;right:0;top:0;z-index:155;background:#22324a;display:flex;align-items:flex-end;justify-content:center;touch-action:none}
.perde .tutamak{background:var(--sari);color:#22324a;font-weight:900;padding:6px 16px;border-radius:12px 12px 0 0;margin-bottom:-1px;cursor:ns-resize}
.sayac{position:fixed;top:80px;right:16px;z-index:165;background:var(--kart);border:1px solid var(--cizgi);border-radius:18px;padding:10px 14px;box-shadow:var(--golge);text-align:center;font-weight:900}
.sayac .zaman{font-size:34px;font-variant-numeric:tabular-nums}
.aferin{position:fixed;inset:0;z-index:310;display:grid;place-items:center;pointer-events:none}
.aferin div{font-size:clamp(50px,10vw,120px);font-weight:900;color:var(--turuncu);text-shadow:0 6px 0 #fff,0 10px 30px rgba(0,0,0,.2);animation:zipla .9s}
@keyframes zipla{0%{transform:scale(.2);opacity:0}50%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
.ekran-pil{position:fixed;left:10px;bottom:10px;z-index:120;opacity:.5;font-size:12px}

/* BASKI */
#baski{display:none}
body.baskida .app,body.baskida .ust{display:none!important}
body.baskida #baski{display:block;background:#fff;color:#000;padding:20px;max-width:800px;margin:0 auto}
#baski h1{font-size:22px;margin:0 0 4px}
#baski .bs{border:1px solid #ccc;border-radius:12px;padding:10px 12px;margin:10px 0;page-break-inside:avoid;break-inside:avoid}
#baski .bs svg{max-width:360px;max-height:200px;display:block}
#baski .cevap-satir{border-bottom:1px dotted #999;height:26px;margin-top:6px}
#baski .sayfa-kir{page-break-before:always;break-before:page}
.baski-ust{display:flex;gap:10px;margin-bottom:12px}
@media print{.baski-ust{display:none!important} html{zoom:1!important} body{background:#fff!important}}

/* SVG ortak */
svg text{font-family:'Nunito',system-ui,sans-serif}
.etk{paint-order:stroke;stroke:#fffdf8;stroke-width:4px;stroke-linejoin:round}
.tikla{cursor:pointer}
.parla{animation:parla 1s infinite alternate}
@keyframes parla{from{opacity:.55}to{opacity:1}}
.akis{stroke-dasharray:10 8;animation:akis .5s linear infinite}
@keyframes akis{to{stroke-dashoffset:-18}}

/* ===== PARA ÜSTÜ USTASI ===== */
.pu-kap{max-width:760px;margin:0 auto}
.pu-menu,.pu-son{background:linear-gradient(180deg,#fff8ea,#fdeccd);border:1px solid #ecd6ad;border-radius:26px;box-shadow:var(--golge);padding:22px;display:flex;flex-direction:column;gap:10px;text-align:center;position:relative;overflow:hidden}
.pu-menu::before,.pu-son::before{content:'';position:absolute;width:260px;height:260px;border-radius:50%;background:#ffd96a55;top:-120px;left:-90px}
.pu-menu::after,.pu-son::after{content:'';position:absolute;width:200px;height:200px;border-radius:50%;background:#7fd6c855;bottom:-90px;right:-70px}
.pu-menu>*,.pu-son>*{position:relative;z-index:1}
.pu-logo{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0}
.pu-coin{width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a0,#e2b84a 60%,#b98a1f);display:grid;place-items:center;font-size:40px;font-weight:900;color:#7a5410;box-shadow:inset 0 -6px 0 #a87812,0 8px 20px #b98a1f55;animation:pu-don 4s ease-in-out infinite}
@keyframes pu-don{0%,100%{transform:rotateY(0)}50%{transform:rotateY(180deg)}}
.pu-b1{font-size:40px;font-weight:900;line-height:1;color:#e8763a;text-shadow:0 3px 0 #fff,0 5px 0 #c9602a33;text-align:left}

  ozet: 'Matematiği ezberlemek yok: <b>görerek, dokunarak, oynayarak</b> öğreniyoruz. Okul öncesinden LGS\'ye kadar 24 atölye.',
  adimlar: [['👀', '<b>Keşfet:</b> Kaydırıcılarla oyna, ▶ düğmesiyle animasyonu izle.'], ['💧', '<b>Havuz Laboratuvarı:</b> Muslukları aç, LED\'ler sırayla yansın, havuz dolunca buzzer ötsün.'], ['📐', '<b>Pisagor Atölyesi:</b> Cam karolar dökülsün, kaysın, parçalansın: üç kanıt!'], ['💰', '<b>Para Üstü Ustası:</b> Kasada öde, para üstü en az parça olsun — 60 saniyelik yarış!'], ['⬡', '<b>Şekil Kapısı:</b> Düşen şekli döndür, doğru delikten geçir!'], ['🎮', '<b>Oyun:</b> 10 soru, her doğruya ⭐, yanlışta görsel çözüm.'], ['🖍️', '<b>Tahta araçları:</b> Kalem, lazer, spot, perde, zamanlayıcı — akıllı tahtada ders anlat.']]
};
function karsilamaAc() {
  modalAc(KARSILAMA.baslik, (m, kap) => {
    m.classList.add('karsila'); H('p', { style: 'font-weight:700;color:var(--soluk);margin:0' }, m, KARSILAMA.ozet);
    const ad = H('div', { class: 'adimlar' }, m); KARSILAMA.adimlar.forEach(([e, t]) => H('div', {}, ad, `<span>${e}</span><div>${t}</div>`));
    const b = UI.dugme(m, 'Başlayalım! 🚀', () => { LS.set('karsilama', 1); try { localStorage.setItem('zirve_karsilama_goruldu', '1'); } catch (e) { } kap(); }, 'btn teal'); b.style.width = '100%';
  });
}

/* --- Ayarlar --- */
function ayarlarAc() {
  modalAc('⚙️ Ayarlar', (m, kap) => {
    const sat = (t, acik, fn) => { const r = H('div', { class: 'ayar-satir' }, m); H('span', {}, r, t); const b = H('button', { class: 'anahtar' + (acik ? ' acik' : '') }, r); b.onclick = () => { const v = !b.classList.contains('acik'); b.classList.toggle('acik', v); fn(v); }; };
    sat('🔊 Sesler', Durum.ses, v => { Durum.ses = v; LS.set('ses', v); });
    sat('🧊 3B cam görünüm', Durum.iso, v => { Durum.iso = v; LS.set('iso', v); if (aktifModul) yonlendir(); });
    const g1 = H('div', { class: 'grup' }, m); H('h5', {}, g1, '🧰 ARAÇLAR');
    const s1 = H('div', { class: 'satir' }, g1);
    UI.dugme(s1, '🖍️ Tahta araçları', () => { kap(); Tahta.ac(); }, 'btn acik kucuk');
    UI.dugme(s1, '📲 QR ile paylaş', () => { kap(); paylasAc(); }, 'btn acik kucuk');
    UI.dugme(s1, '❓ Tanıtım', () => { kap(); karsilamaAc(); }, 'btn acik kucuk');
    UI.dugme(s1, '📺 Ekran: ' + Ekran.ad(), e => { Ekran.dongu(); e.target.textContent = '📺 Ekran: ' + Ekran.ad(); }, 'btn acik kucuk');
    const r2 = H('div', { class: 'ayar-satir' }, g1); H('span', { style: 'font-size:14px' }, r2, '📺 Ekran modu rozetini göster'); const eb = H('button', { class: 'anahtar' + (LS.get('ekranPil', false) ? ' acik' : '') }, r2); eb.onclick = () => { const v = !eb.classList.contains('acik'); eb.classList.toggle('acik', v); LS.set('ekranPil', v); Ekran.pil(); };
    const g2 = H('div', { class: 'grup' }, m); H('h5', {}, g2, '👤 ÖĞRENCİ');
    H('div', { style: 'font-weight:800;margin-bottom:8px' }, g2, Durum.kullanici ? `${Durum.kullanici.ad} · ${Durum.kullanici.sinif} · ⭐ ${Durum.xp}` : '—');
    const s2 = H('div', { class: 'satir' }, g2);
    UI.dugme(s2, '🔁 Öğrenci değiştir', () => { Durum.kullanici = null; LS.set('kullanici', null); Durum.xp = 0; LS.set('xp', 0); Durum.yildiz = {}; LS.set('yildiz', {}); ustGuncelle(); kap(); git('#'); }, 'btn acik kucuk');
    UI.dugme(s2, '👨‍🏫 Öğretmen paneli', () => { kap(); ogretmenPaneli(); }, 'btn kucuk');
    H('div', { style: 'margin-top:14px;font-size:12px;color:var(--soluk);font-weight:700;text-align:center' }, m, `MatAkış · sürüm ${SURUM} · Barış Öğretmen`);
  });
}

/* --- Öğretmen paneli --- */
function ogretmenPaneli() {
  modalAc('👨‍🏫 Öğretmen Paneli', (m) => {
    const giris = H('div', {}, m);
    H('p', { style: 'font-weight:700;color:var(--soluk);margin:0 0 8px' }, giris, 'Panel şifresi:');
    const inp = H('input', { class: 'alan', type: 'password', inputmode: 'numeric', placeholder: 'Şifre' }, giris);
    const b = UI.dugme(giris, 'Aç', () => { if (inp.value === OGRETMEN_SIFRE) { giris.remove(); goster(); } else { inp.value = ''; toast('Şifre yanlış'); } }, 'btn teal'); b.style.cssText = 'width:100%;margin-top:8px';
    inp.onkeydown = e => { if (e.key === 'Enter') b.click(); };
    async function goster() {
      const ust = H('div', { class: 'satir' }, m); const ara = H('input', { class: 'alan', placeholder: '🔍 Ad veya sınıf ara' }, ust);
      const bilgi = H('div', { style: 'font-weight:800;font-size:13px;color:var(--soluk);margin:8px 0' }, m, bulutHazir() ? '☁️ Bulut bağlanıyor...' : '📱 Kayıtlar bu cihazdan. (Tüm cihazları tek panelde görmek için koddaki FIREBASE_AYAR doldurulur.)');
      const tb = H('div', { style: 'overflow:auto;max-height:52vh' }, m);
      let veri = LS.get('kayitlar', []).slice();
      if (bulutHazir()) { try { const db = await bulut(); if (db) { const s = await db.collection(BULUT_KOLEKSIYON).orderBy('zaman', 'desc').limit(500).get(); const bv = s.docs.map(d => d.data()); veri = bv; bilgi.textContent = `☁️ Bulut: ${bv.length} kayıt (tüm cihazlar)`; } } catch (e) { bilgi.textContent = '⚠️ Buluta ulaşılamadı, bu cihazın kayıtları gösteriliyor.'; } }
      veri.sort((a, b) => b.zaman - a.zaman);
      const ciz = () => {
        const q = ara.value.toLocaleLowerCase('tr'); const f = veri.filter(k => !q || (k.ad + ' ' + k.sinif).toLocaleLowerCase('tr').includes(q));
        const kisi = new Set(f.map(k => k.ad + '|' + k.sinif)).size;
        tb.innerHTML = `<div style="font-weight:900;margin-bottom:6px">${kisi} öğrenci · ${f.filter(k => k.tip === 'oyun').length} oyun</div><table class="tablo"><tr><th>AD SOYAD</th><th>SINIF</th><th>İŞLEM</th><th>SONUÇ</th><th>CİHAZ</th><th>ZAMAN</th></tr>` +
          f.slice(0, 400).map(k => `<tr><td>${k.ad}</td><td>${k.sinif}</td><td>${k.tip === 'giris' ? '🚪 Giriş' : '🎮 ' + (k.modul || '')}</td><td>${k.tip === 'oyun' ? `✅${k.dogru} ❌${k.yanlis}` : ''}</td><td>${k.cihaz || ''}</td><td>${new Date(k.zaman).toLocaleString('tr-TR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</td></tr>`).join('') + '</table>';
      };
      ara.oninput = ciz; ciz();
      const s = H('div', { class: 'satir', style: 'margin-top:10px' }, m);
      UI.dugme(s, '📋 Kopyala', () => { const t = 'Ad Soyad\tSınıf\tİşlem\tDoğru\tYanlış\tCihaz\tZaman\n' + veri.map(k => [k.ad, k.sinif, k.tip === 'giris' ? 'Giriş' : k.modul, k.dogru ?? '', k.yanlis ?? '', k.cihaz, new Date(k.zaman).toLocaleString('tr-TR')].join('\t')).join('\n'); navigator.clipboard?.writeText(t).then(() => toast('Kopyalandı ✅'), () => toast('Kopyalanamadı')); }, 'btn acik kucuk');
    }
  });
}

/* --- QR ile paylaş --- */
function paylasAc() {
  modalAc('📲 QR ile Paylaş', async m => {
    const url = location.href.split('#')[0];
    H('p', { style: 'font-weight:700;color:var(--soluk);margin:0 0 10px' }, m, 'Öğrenciler telefon kamerasıyla okutup MatAkış\'ı açabilir.');
    const k = H('div', { style: 'background:#fff;border-radius:16px;padding:16px;display:grid;place-items:center;min-height:240px;border:1px solid var(--cizgi)' }, m, 'QR hazırlanıyor...');
    if (location.protocol === 'file:') H('div', { class: 'bilgi', style: 'margin-top:8px' }, m, '⚠️ Dosya bilgisayardan açılmış. QR\'ın çalışması için siteye yüklenmiş bağlantıyı kullan.');
    const s = H('div', { class: 'satir', style: 'margin-top:10px' }, m);
    UI.dugme(s, '🔗 Bağlantıyı kopyala', () => navigator.clipboard?.writeText(url).then(() => toast('Kopyalandı ✅')), 'btn acik kucuk');
    try {
      if (!window.qrcode) await scriptYukle('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js');
      const qr = qrcode(0, 'M'); qr.addData(url); qr.make(); k.innerHTML = qr.createSvgTag({ cellSize: 6, margin: 2 });
      UI.dugme(s, '⬇️ PNG indir', () => { const img = new Image(); img.onload = () => { const c = document.createElement('canvas'); c.width = c.height = 600; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, 600, 600); x.drawImage(img, 0, 0, 600, 600); const a = document.createElement('a'); a.download = 'MatAkis_QR.png'; a.href = c.toDataURL('image/png'); a.click(); }; img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(k.innerHTML); }, 'btn teal kucuk');
    } catch (e) { k.textContent = 'QR yüklenemedi (internet bağlantısını kontrol et).'; }
  });
}
window.ZIRVE_paylasAc = paylasAc;

/* --- Cihaz / Ekran Uyumu --- */
const Ekran = {
  modlar: [['oto', 'Otomatik'], ['tab', 'Tablet'], ['tahta', 'Akıllı Tahta'], ['buyuk', 'Büyük Tahta']],
  mod: LS.get('ekranMod', 'oto'),
  ad() { return this.modlar.find(m => m[0] === this.mod)[1]; },
  olcek() { if (this.mod === 'tab') return 1; if (this.mod === 'tahta') return 1.35; if (this.mod === 'buyuk') return 1.6; const w = screen.width, tc = navigator.maxTouchPoints > 0, d = devicePixelRatio || 1; if (w >= 3000 && d <= 1.5) return 1.6; if (tc && w >= 1800 && d <= 1.25) return 1.35; return 1; },
  uygula() { document.documentElement.style.zoom = this.olcek() === 1 ? '' : this.olcek(); this.pil(); },
  dongu() { const i = this.modlar.findIndex(m => m[0] === this.mod); this.mod = this.modlar[(i + 1) % this.modlar.length][0]; LS.set('ekranMod', this.mod); this.uygula(); toast('📺 ' + this.ad()); },
  pil() { let p = $('#ekranPil'); if (!LS.get('ekranPil', false)) { if (p) p.remove(); return; } if (!p) { p = H('button', { id: 'ekranPil', class: 'pil ekran-pil' }, document.body); p.onclick = () => this.dongu(); } p.textContent = '📺 ' + this.ad(); }
};
window.ZIRVE_ekranReset = () => { document.documentElement.style.zoom = ''; };
window.ZIRVE_ekranGeri = () => Ekran.uygula();

/* --- Tahta Araçları (kalem, çizgi, daire, lazer, spot, perde, zamanlayıcı, aferin, damga) --- */
const Tahta = (() => {
  let acik = false, arac = 'kalem', renk = R.kir, cubuk, cv, ctx, ciziyor = false, bas = null, anlik = null, lazerIz = [], spotEl = null, perdeEl = null, sayacEl = null, spotR = 140;
  function boyut() { const d = devicePixelRatio || 1; const img = cv.width ? ctx.getImageData(0, 0, cv.width, cv.height) : null; cv.width = innerWidth * d; cv.height = innerHeight * d; cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px'; ctx.setTransform(d, 0, 0, d, 0, 0); if (img) ctx.putImageData(img, 0, 0); }
  function ac() {
    if (acik) return; acik = true; cv = $('#tahtaTuval'); ctx = cv.getContext('2d'); boyut(); addEventListener('resize', boyut);
    cubuk = H('div', { class: 'tahta-cubuk' }, document.body);
    const btn = (e, id, t, fn) => { const b = H('button', { title: t }, cubuk, e); b.dataset.id = id; b.onclick = () => { Ses.tik(); fn ? fn() : sec(id); }; return b; };
    btn('✋', 'el', 'Sayfayı kullan'); btn('🖊️', 'kalem', 'Kalem'); btn('📏', 'cizgi', 'Düz çizgi'); btn('⭕', 'daire', 'Daire'); btn('⬜', 'kare', 'Kare'); btn('🔴', 'lazer', 'Lazer'); btn('⭐', 'damga', 'Damga');
    [R.kir, R.mavi, R.yes, '#111'].forEach(c => { const b = H('button', { class: 'renk', style: `background:${c}` }, cubuk); b.onclick = () => { renk = c; Ses.tik(); }; });
    btn('🔦', 'spot', 'Spot ışığı', spotAc); btn('🙈', 'perde', 'Perde', perdeAc); btn('⏱️', 'sayac', 'Zamanlayıcı', sayacAc); btn('👏', 'aferin', 'Aferin', aferin); btn('🧽', 'sil', 'Temizle', () => ctx.clearRect(0, 0, cv.width, cv.height)); btn('✖', 'kapat', 'Kapat', kapat);
    sec('el');
    cv.onpointerdown = e => { ciziyor = true; bas = [e.clientX, e.clientY]; if (arac !== 'kalem' && arac !== 'lazer') anlik = ctx.getImageData(0, 0, cv.width, cv.height); if (arac === 'damga') { ctx.font = '48px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(sec2(['⭐', '👏', '✅', '🌟', '💯']), e.clientX, e.clientY); Ses.pop(); ciziyor = false; } ctx.beginPath(); ctx.moveTo(e.clientX, e.clientY); };
    cv.onpointermove = e => {
      if (arac === 'lazer') { lazerIz.push([e.clientX, e.clientY, performance.now()]); return; }
      if (!ciziyor) return; ctx.strokeStyle = renk; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      if (arac === 'kalem') { ctx.lineTo(e.clientX, e.clientY); ctx.stroke(); return; }
      ctx.putImageData(anlik, 0, 0); ctx.beginPath(); const [x0, y0] = bas, x1 = e.clientX, y1 = e.clientY;
      if (arac === 'cizgi') { ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); } if (arac === 'daire') { ctx.arc(x0, y0, Math.hypot(x1 - x0, y1 - y0), 0, Math.PI * 2); } if (arac === 'kare') ctx.rect(x0, y0, x1 - x0, y1 - y0); ctx.stroke();
    };
    addEventListener('pointerup', () => { ciziyor = false; });
    lazerDongu();
  }
  const sec2 = a => a[Math.floor(Math.random() * a.length)];
  function sec(id) { arac = id; cubuk.querySelectorAll('button[data-id]').forEach(b => b.classList.toggle('aktif', b.dataset.id === id)); cv.classList.toggle('aktif', id !== 'el'); }
  function lazerDongu() { if (!acik) return; const now = performance.now(); lazerIz = lazerIz.filter(p => now - p[2] < 500); if (arac === 'lazer' || lazerIz.length) { const d = $('#konfeti'); if (!d) return; } const c2 = $('#konfeti'); if (lazerIz.length) { c2.width = innerWidth; c2.height = innerHeight; const x = c2.getContext('2d'); x.clearRect(0, 0, c2.width, c2.height); for (let i = 1; i < lazerIz.length; i++) { const a = lazerIz[i - 1], b = lazerIz[i]; x.strokeStyle = `rgba(255,40,40,${1 - (now - b[2]) / 500})`; x.lineWidth = 8; x.lineCap = 'round'; x.beginPath(); x.moveTo(a[0], a[1]); x.lineTo(b[0], b[1]); x.stroke(); } } requestAnimationFrame(lazerDongu); }
  function spotAc() {
    if (spotEl) { spotEl.remove(); spotEl = null; return; }
    spotEl = H('div', { class: 'spot' }, document.body); let px = innerWidth / 2, py = innerHeight / 2;
    const ciz = () => spotEl && (spotEl.style.background = `radial-gradient(circle ${spotR}px at ${px}px ${py}px, transparent 0 ${spotR - 4}px, rgba(0,0,0,.82) ${spotR}px)`);
    const mv = e => { px = e.clientX; py = e.clientY; ciz(); }; addEventListener('pointermove', mv); ciz();
    const tk = e => { if (!spotEl) { removeEventListener('wheel', tk); return; } spotR = Math.max(60, Math.min(400, spotR - e.deltaY * .3)); ciz(); }; addEventListener('wheel', tk, { passive: true });
    toast('🔦 Spot açık · fare tekerleği ile boyut · tekrar 🔦 ile kapat');
  }
  function perdeAc() {
    if (perdeEl) { perdeEl.remove(); perdeEl = null; return; }
    perdeEl = H('div', { class: 'perde', style: `height:${innerHeight * .5}px` }, document.body); const t = H('div', { class: 'tutamak' }, perdeEl, '⇕ Perdeyi sürükle');
    t.onpointerdown = e => { e.preventDefault(); const mv = ev => { perdeEl.style.height = Math.max(30, Math.min(innerHeight, ev.clientY + 14)) + 'px'; }; const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); }; addEventListener('pointermove', mv); addEventListener('pointerup', up); };
  }
  function sayacAc() {
    if (sayacEl) { sayacEl.remove(); sayacEl = null; return; }
    sayacEl = H('div', { class: 'sayac' }, document.body); const z = H('div', { class: 'zaman' }, sayacEl, '00:00'); const s = H('div', { class: 'satir' }, sayacEl); let kalan = 0, tm = null;
    const yaz2 = () => z.textContent = `${String(Math.floor(kalan / 60)).padStart(2, '0')}:${String(kalan % 60).padStart(2, '0')}`;
    [1, 3, 5, 10].forEach(dk => UI.dugme(s, dk + 'dk', () => { kalan = dk * 60; yaz2(); clearInterval(tm); tm = setInterval(() => { kalan--; yaz2(); if (kalan <= 0) { clearInterval(tm); [0, 250, 500, 750].forEach(t => setTimeout(() => Ses.bip(), t)); z.style.color = R.kir; toast('⏰ Süre doldu!'); } }, 1000); z.style.color = ''; }, 'btn acik kucuk'));
  }
  function aferin() { const a = H('div', { class: 'aferin' }, document.body, `<div>${sec2(['Aferin! 👏', 'Harika! 🌟', 'Süper! 🚀', 'Bravo! 🎉'])}</div>`); Ses.zafer(); Konfeti.patla(160); setTimeout(() => a.remove(), 1800); }
  function kapat() { acik = false; cubuk.remove(); cv.classList.remove('aktif'); ctx.clearRect(0, 0, cv.width, cv.height); [spotEl, perdeEl, sayacEl].forEach(e => e && e.remove()); spotEl = perdeEl = sayacEl = null; }
  return { ac, kapat, get acik() { return acik; } };
})();

/* --- Bağlantı uyarısı --- */
addEventListener('offline', () => toast('📡 İnternet bağlantısı koptu. Atölyeler çalışmaya devam eder.'));
addEventListener('online', () => toast('✅ İnternet geri geldi.'));

/* =========================================================
   BAŞLAT
   ========================================================= */
(function baslat() {
  MODULLER.sort((a, b) => (a.sira || 99) - (b.sira || 99));
  $('#logo').onclick = () => git('#');
  $('#ayarBtn').onclick = () => { Ses.tik(); ayarlarAc(); };
  $('#yardimBtn').onclick = () => { Ses.tik(); karsilamaAc(); };
  $('#tahtaBtn').onclick = () => { Ses.tik(); Tahta.acik ? Tahta.kapat() : Tahta.ac(); };
  document.addEventListener('pointerdown', () => Ses.ac(), { once: true });
  const _siv = Element.prototype.scrollIntoView; Element.prototype.scrollIntoView = function (o) { if (o && typeof o === 'object') o = { ...o, block: o.block === 'nearest' ? 'nearest' : 'start' }; return _siv.call(this, o); };
  Ekran.uygula(); ustGuncelle(); yonlendir();
  if (Durum.kullanici && !LS.get('karsilama', 0)) setTimeout(karsilamaAc, 400);
})();

</script>
