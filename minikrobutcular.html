<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Minik Robotçular</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#fff8ec;--ink:#2b2350;--soft:#7a6fa8;--pri:#7c4dff;--pink:#ff5c93;--yel:#ffc93c;--grn:#2ec4b6;--blu:#3a86ff;--org:#ff8a3d;--card:#fff;--sh:0 6px 0 rgba(43,35,80,.12),0 10px 24px rgba(43,35,80,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Baloo 2',system-ui,sans-serif;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:0}
.hide{display:none!important}
/* ===== Başlangıç ===== */
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:20px;background:radial-gradient(circle at 20% 20%,#ffe1ef,transparent 40%),radial-gradient(circle at 80% 70%,#dff6ff,transparent 45%),var(--bg);z-index:50;text-align:center}
#start h1{font-size:clamp(34px,6vw,72px);margin:0;line-height:1;color:var(--pri)}
#start p{margin:0;color:var(--soft);font-size:clamp(16px,2vw,22px)}
.startBtns{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.bigBtn{background:var(--card);border-radius:28px;padding:22px 30px;font-size:clamp(20px,2.4vw,30px);font-weight:800;color:var(--ink);box-shadow:var(--sh);min-width:250px}
.bigBtn small{display:block;font-weight:500;font-size:15px;color:var(--soft)}
.bigBtn .e{font-size:54px;display:block}
.bigBtn:active{transform:translateY(4px)}
/* ===== TAHTA ===== */
#board{position:fixed;inset:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px}
.logo{font-weight:800;font-size:clamp(20px,2.2vw,32px);color:var(--pri);white-space:nowrap}
.logo span{color:var(--pink)}
.tabs{display:flex;gap:8px;flex:1;justify-content:center;flex-wrap:wrap}
.tab{background:var(--card);border-radius:18px;padding:8px 18px;font-size:clamp(15px,1.5vw,22px);font-weight:700;color:var(--ink);box-shadow:0 4px 0 rgba(43,35,80,.12)}
.tab.on{background:var(--pri);color:#fff}
.pill{background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px;box-shadow:0 4px 0 rgba(43,35,80,.1);white-space:nowrap;display:flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;background:#ccc}
.dot.ok{background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.25)}
.iconBtn{background:var(--card);border-radius:14px;width:46px;height:46px;font-size:24px;box-shadow:0 4px 0 rgba(43,35,80,.1)}
.main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 16px;position:relative}
.panel{width:100%;height:100%;display:flex;gap:14px;align-items:center;justify-content:center}
/* ızgara */
.grid{position:relative;aspect-ratio:9/5;width:min(100%,calc((100vh - 220px)*1.8));border-radius:28px;box-shadow:var(--sh);background:#c8f2d6}
.cells{border-radius:28px;overflow:hidden}
.cells{position:absolute;inset:0;display:grid}
.cell{border:2px dashed rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;font-size:min(7vh,4.2vw)}
.cell.a{background:#bfeccc}.cell.b{background:#d4f7de}
.av{position:absolute;display:flex;align-items:flex-end;justify-content:center;transition:left .6s cubic-bezier(.34,1.4,.6,1),top .6s cubic-bezier(.34,1.4,.6,1);z-index:3}
.avIn{position:relative;width:84%;height:94%;display:flex;flex-direction:column;align-items:center;transition:transform .45s}
.ant{width:4px;height:9%;background:#555;position:relative;margin-bottom:-2px}
.ant:after{content:'';position:absolute;top:-8px;left:-6px;width:16px;height:16px;border-radius:50%;background:var(--c,var(--pink));animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}
.head{height:58%;aspect-ratio:1;border-radius:50%;overflow:hidden;border:5px solid var(--c,var(--pri));background:#fff;z-index:2;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.head img{width:100%;height:100%;object-fit:cover;display:block}
.head .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:200%}
.bod{width:52%;height:20%;margin-top:-6%;background:var(--c,var(--pri));border-radius:30% 30% 22% 22%;position:relative;display:flex;align-items:center;justify-content:center;gap:8%}
.bod i{width:14%;aspect-ratio:1;border-radius:50%;background:#fff;opacity:.85}
.bod:before,.bod:after{content:'';position:absolute;top:18%;width:20%;height:62%;background:var(--c,var(--pri));border-radius:10px;filter:brightness(.88)}
.bod:before{left:-17%;transform:rotate(18deg)}.bod:after{right:-17%;transform:rotate(-18deg)}
.legs{display:flex;gap:16%;width:40%;justify-content:center;height:7%}
.legs b{width:28%;height:100%;background:#444;border-radius:0 0 6px 6px}
.nm{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);background:#fff;border-radius:999px;padding:0 10px;font-weight:800;font-size:clamp(11px,1.35vw,20px);white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.12);z-index:4}
.av.act .head{box-shadow:0 0 0 6px #fff,0 0 0 11px var(--yel),0 6px 18px rgba(0,0,0,.25)}
.av.act:before{content:'⬇';position:absolute;top:-66%;left:50%;transform:translateX(-50%);font-size:clamp(16px,2.6vw,38px);color:var(--pink);animation:bob 0.9s infinite;z-index:5}
@keyframes bob{50%{transform:translate(-50%,-25%)}}
.av.walk .avIn{animation:walk .6s}
@keyframes walk{25%{transform:translateY(-8%) rotate(-6deg)}75%{transform:translateY(-8%) rotate(6deg)}}
.av.jump .avIn{animation:jump .8s}
@keyframes jump{40%{transform:translateY(-75%) scale(1.05)}70%{transform:translateY(0) scaleY(.85)}}
.av.spin .avIn{animation:spin .9s}
@keyframes spin{to{transform:rotate(360deg)}}
.av.dance .avIn{animation:dance 1.6s}
@keyframes dance{0%,100%{transform:none}15%{transform:rotate(-16deg) translateY(-6%)}30%{transform:rotate(16deg)}45%{transform:rotate(-16deg) translateY(-6%)}60%{transform:rotate(16deg)}75%{transform:scale(1.15)}}
.av.bump .avIn{animation:bump .5s}
@keyframes bump{20%,60%{transform:translateX(-10%)}40%,80%{transform:translateX(10%)}}
.av.pulse .avIn{animation:pulse .7s}
@keyframes pulse{50%{transform:scale(1.18)}}
.pop{position:absolute;top:0;left:50%;font-size:clamp(22px,4vw,60px);animation:pop 1.3s forwards;pointer-events:none;z-index:9}
@keyframes pop{0%{transform:translate(-50%,0) scale(.3);opacity:0}25%{transform:translate(-50%,-60%) scale(1.2);opacity:1}100%{transform:translate(-50%,-160%) scale(1);opacity:0}}
/* yan kumanda */
.side{display:flex;flex-direction:column;gap:10px;align-items:center}
.dpad{display:grid;grid-template-columns:repeat(3,clamp(52px,6vw,84px));grid-template-rows:repeat(3,clamp(52px,6vw,84px));gap:6px}
.dbtn{border-radius:20px;font-size:clamp(26px,3vw,42px);background:var(--card);box-shadow:var(--sh);color:var(--ink)}
.dbtn:active,.act-btn:active{transform:translateY(4px);box-shadow:none}
.dbtn.u{grid-area:1/2}.dbtn.l{grid-area:2/1}.dbtn.r{grid-area:2/3}.dbtn.d{grid-area:3/2}.dbtn.c{grid-area:2/2;background:var(--yel)}
.acts{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;width:100%}
.act-btn{border-radius:16px;padding:6px 4px;background:var(--card);box-shadow:0 4px 0 rgba(43,35,80,.12);font-size:clamp(13px,1.2vw,18px);font-weight:700;color:var(--ink)}
.act-btn b{display:block;font-size:clamp(20px,2.2vw,32px);line-height:1.1}
/* öğrenci şeridi */
.strip{display:flex;gap:10px;padding:8px 16px 12px;overflow-x:auto;align-items:center;min-height:96px}
.chip{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;background:var(--card);border-radius:20px;padding:6px 10px 4px;box-shadow:0 4px 0 rgba(43,35,80,.1);min-width:80px;position:relative}
.chip img,.chip .ph{width:54px;height:54px;border-radius:50%;object-fit:cover;border:3px solid var(--c,var(--pri));display:flex;align-items:center;justify-content:center;font-size:28px;background:#fff}
.chip span{font-weight:700;font-size:15px;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.on{background:var(--yel)}
.chip.off{opacity:.45}
.chip em{position:absolute;top:-6px;right:-4px;background:var(--pink);color:#fff;font-style:normal;border-radius:999px;font-size:12px;padding:0 6px;font-weight:800}
.empty{color:var(--soft);font-weight:700;font-size:18px;padding:0 10px}
/* kodlama */
.codeWrap{display:flex;flex-direction:column;gap:10px;width:100%;height:100%;align-items:center;justify-content:center}
.codeRow{display:flex;gap:14px;align-items:center;width:min(100%,calc((100vh - 220px)*1.8 + 240px))}
.codeBar{flex:1;min-height:80px;background:var(--card);border-radius:22px;box-shadow:var(--sh);display:flex;gap:8px;padding:10px;flex-wrap:wrap;align-items:center}
.cCard{width:58px;height:58px;border-radius:14px;background:var(--blu);color:#fff;font-size:32px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.cCard.run{background:var(--pink);transform:scale(1.15)}
.cCard.done{opacity:.45}
.pal{display:flex;gap:8px;flex-wrap:wrap}
.pBtn{width:64px;height:64px;border-radius:18px;font-size:32px;background:var(--blu);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.pBtn.g{background:var(--grn)}.pBtn.r{background:var(--org)}.pBtn.y{background:var(--yel);color:var(--ink)}
.lvlTag{font-weight:800;font-size:20px;background:var(--card);border-radius:14px;padding:4px 14px;box-shadow:0 4px 0 rgba(43,35,80,.1)}
.wall{font-size:min(7vh,4.2vw)}
.goal{animation:pulse 1.2s infinite}
/* zeka */
.zMenu{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:16px;width:min(100%,1100px)}
.zCard{background:var(--card);border-radius:26px;box-shadow:var(--sh);padding:16px 10px;text-align:center;font-weight:800;font-size:clamp(17px,1.7vw,24px);color:var(--ink)}
.zCard b{display:block;font-size:clamp(40px,5vw,70px);line-height:1.2}
.zCard small{display:block;font-weight:500;color:var(--soft);font-size:14px}
.zGame{display:flex;flex-direction:column;align-items:center;gap:2vh;width:100%;height:100%;justify-content:center}
.zQ{font-size:clamp(24px,3.4vw,50px);font-weight:800;text-align:center;display:flex;align-items:center;gap:14px}
.zQ img{width:clamp(50px,6vw,90px);height:clamp(50px,6vw,90px);border-radius:50%;object-fit:cover;border:4px solid var(--yel)}
.zShow{background:var(--card);border-radius:28px;box-shadow:var(--sh);padding:2vh 3vw;display:flex;gap:1.4vw;align-items:center;justify-content:center;flex-wrap:wrap;font-size:clamp(40px,6.5vw,100px);min-height:16vh;max-width:96%}
.zOpts{display:flex;gap:2.4vw;flex-wrap:wrap;justify-content:center}
.zOpt{background:var(--card);border-radius:28px;box-shadow:var(--sh);min-width:clamp(100px,13vw,200px);min-height:clamp(100px,13vw,200px);font-size:clamp(46px,7vw,110px);display:flex;align-items:center;justify-content:center;color:var(--ink);font-weight:800;padding:8px 16px;gap:6px;flex-wrap:wrap}
.zOpt.ok{background:#c8f7d6}.zOpt.no{animation:bump .5s;background:#ffd6d6}
.shadow{filter:brightness(0);opacity:.75}
.blob{width:clamp(80px,10vw,150px);height:clamp(80px,10vw,150px);border-radius:30%}
.memo{display:grid;gap:1.2vw;grid-template-columns:repeat(var(--n),clamp(90px,11vw,160px))}
.mc{aspect-ratio:1;border-radius:22px;background:linear-gradient(135deg,var(--pri),var(--pink));box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;font-size:clamp(40px,5vw,80px);color:#fff;overflow:hidden}
.mc.open,.mc.got{background:#fff}
.mc img{width:100%;height:100%;object-fit:cover}
.mc.got{outline:6px solid var(--grn)}
.backBtn{background:var(--card);border-radius:16px;padding:8px 18px;font-size:18px;font-weight:800;box-shadow:0 4px 0 rgba(43,35,80,.1);color:var(--ink)}
/* sınıf */
.clsWrap{width:min(100%,1200px);height:100%;display:flex;flex-direction:column;gap:12px;padding-top:6px}
.clsBar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.clsBar select,.clsBar input{font-family:inherit;font-size:18px;border-radius:14px;border:3px solid #e6defa;padding:6px 12px;background:#fff;color:var(--ink)}
.stGrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;align-content:start;padding:6px 4px 20px}
.stC{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:12px;text-align:center;position:relative}
.stC img,.stC .ph{width:90px;height:90px;border-radius:50%;object-fit:cover;border:4px solid var(--c,var(--pri));margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:44px}
.stC .n{font-weight:800;font-size:19px;margin-top:4px}
.stC .s{color:var(--org);font-weight:800}
.stC .row{display:flex;gap:6px;justify-content:center;margin-top:6px}
.mini{border-radius:10px;padding:2px 10px;font-size:14px;font-weight:700;background:#f1ecff;color:var(--ink)}
.mini.del{background:#ffe0e6}
.btnP{background:var(--pri);color:#fff;border-radius:14px;padding:8px 16px;font-size:17px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.15)}
/* modal & efekt */
.modal{position:fixed;inset:0;background:rgba(43,35,80,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.mBox{background:#fff;border-radius:28px;padding:22px;max-width:520px;width:100%;text-align:center;box-shadow:var(--sh);max-height:94vh;overflow:auto}
.mBox h2{margin:0 0 6px;color:var(--pri)}
#qr{display:flex;justify-content:center;margin:12px 0}
#qr img,#qr canvas{border:10px solid #fff;border-radius:12px}
.codeBig{font-size:56px;font-weight:800;letter-spacing:10px;color:var(--pink)}
#welcome{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:70;background:rgba(124,77,255,.85);color:#fff;text-align:center}
#welcome img{width:min(46vh,70vw);height:min(46vh,70vw);border-radius:50%;object-fit:cover;border:12px solid #fff;box-shadow:0 0 0 14px var(--yel);animation:wIn 1s cubic-bezier(.34,1.56,.64,1)}
#welcome h1{font-size:clamp(34px,6vw,90px);margin:18px 0 0;animation:wIn 1.2s}
@keyframes wIn{0%{transform:scale(0) rotate(-30deg)}100%{transform:none}}
#toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:16px;font-weight:700;z-index:80;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.conf{position:fixed;top:-40px;font-size:34px;z-index:75;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}
.big{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:74;pointer-events:none;font-size:clamp(50px,9vw,150px);font-weight:800;color:var(--pink);text-shadow:0 6px 0 #fff,0 10px 30px rgba(0,0,0,.25);animation:wIn .7s}
.mic.on{background:var(--pink);color:#fff;animation:pulse 1s infinite}
/* ===== TELEFON ===== */
#phone{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.pTop{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 6px}
.pTop .logo{font-size:22px}
.pBody{flex:1;overflow:auto;padding:8px 14px 100px}
.pNav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(6,1fr);background:#fff;box-shadow:0 -4px 20px rgba(0,0,0,.08);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.pNav button{background:none;font-size:13px;font-weight:700;color:var(--soft);padding:4px 0;border-radius:14px}
.pNav button b{display:block;font-size:26px}
.pNav button.on{background:#f1ecff;color:var(--pri)}
.pCard{background:#fff;border-radius:24px;box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.pCard h3{margin:0 0 8px;font-size:20px}
.pIn{width:100%;font-family:inherit;font-size:20px;border-radius:16px;border:3px solid #e6defa;padding:10px 14px;margin-bottom:10px;color:var(--ink);background:#fff}
.pRow{display:flex;gap:10px}
.pBtn2{flex:1;background:var(--blu);color:#fff;border-radius:18px;padding:14px 6px;font-size:18px;font-weight:800;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.pBtn2.g{background:var(--grn)}.pBtn2.p{background:var(--pink)}.pBtn2.y{background:var(--yel);color:var(--ink)}.pBtn2.o{background:var(--org)}
.pBtn2:disabled{opacity:.4}
.pBtn2:active{transform:translateY(4px);box-shadow:none}
.crop{width:230px;height:230px;border-radius:50%;margin:6px auto 10px;overflow:hidden;border:6px solid var(--pri);background:#f3f0ff;display:flex;align-items:center;justify-content:center;font-size:70px}
.crop canvas{width:100%;height:100%}
.pRange{width:100%;margin:2px 0 8px}
.pChips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px}
.pChips .chip{min-width:72px}
.pChips .chip img,.pChips .chip .ph{width:46px;height:46px}
.pDpad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,92px);gap:10px;margin:6px 0 12px}
.pDpad button{border-radius:24px;font-size:44px;background:#fff;box-shadow:var(--sh);color:var(--ink)}
.pDpad button:active{transform:translateY(4px);box-shadow:none;background:var(--yel)}
.pActs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pActs button{background:#fff;border-radius:18px;box-shadow:0 4px 0 rgba(43,35,80,.12);padding:8px 2px;font-weight:700;font-size:13px;color:var(--ink)}
.pActs button b{display:block;font-size:30px}
.pActs button:active{background:var(--yel)}
.pZ{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pZ button{background:#fff;border-radius:20px;box-shadow:0 4px 0 rgba(43,35,80,.12);padding:12px 4px;font-weight:800;font-size:16px;color:var(--ink)}
.pZ button b{display:block;font-size:36px}
.conBox{text-align:center;padding:30px 10px}
.conBox input{font-size:40px;text-align:center;letter-spacing:10px;width:220px}
.stat{font-size:14px;font-weight:700;color:var(--soft);display:flex;align-items:center;gap:6px}
@media (max-width:900px){.zMenu{grid-template-columns:repeat(2,1fr)}.side{display:none}}
/* ===== Kıyafetli kukla + canlı takip ===== */
.avIn.doll{position:absolute;left:-10%;bottom:5%;width:120%;height:150%;transform-origin:50% 100%;display:block}
.avIn.doll canvas{width:100%;height:100%;display:block}
.av.act .avIn.doll{filter:drop-shadow(0 0 5px #ffc93c) drop-shadow(0 0 2px #ffc93c)}
.av.ghost{opacity:0!important}
#liveCv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}
.liveTag{position:absolute;top:10px;left:14px;background:#e11d48;color:#fff;border-radius:999px;padding:2px 12px;font-weight:800;font-size:clamp(12px,1.3vw,18px);z-index:9;animation:blink 1.4s infinite;pointer-events:none}
#liveMini{position:fixed;right:18px;bottom:110px;width:160px;height:216px;background:#fff;border-radius:22px;box-shadow:var(--sh);z-index:30;padding:6px}
#liveMini canvas{width:100%;height:100%;display:block}
#liveMini .liveTag{top:6px;left:8px;font-size:12px}
.gFlash{position:fixed;top:12%;left:50%;transform:translateX(-50%);font-size:clamp(60px,10vw,150px);z-index:73;pointer-events:none;animation:wIn .45s}
.sayBox{position:fixed;left:50%;top:10%;transform:translateX(-50%);background:#fff;border-radius:28px;padding:14px 30px;font-size:clamp(24px,3.6vw,58px);font-weight:800;color:var(--pri);box-shadow:var(--sh);z-index:76;text-align:center;max-width:90vw;pointer-events:none}
#welcome canvas{height:min(56vh,80vw);width:auto;animation:wIn 1s cubic-bezier(.34,1.56,.64,1)}
#welcome h1{margin:6px 0 0}
.dollPrev{display:flex;gap:10px;align-items:center;justify-content:center;margin:4px 0 8px}

 .yonBar .yBtn{font-size:11px;padding:4px 8px}.yonTask{font-size:18px;min-height:44px}.yonPad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px)}
 .codeRow{flex-wrap:wrap;gap:6px}.pBtn{width:46px;height:46px;font-size:22px}.cCard{width:40px;height:40px;font-size:22px}.lvlTag{font-size:14px}
 .mkWrap,.prWrap{grid-template-columns:1fr;overflow:auto}.prItem{grid-row:auto}.repBox{flex-direction:column;height:auto}.repSide{width:auto}.snBox{height:42%!important}
 #liveMini{width:100px;height:140px}#bcBox{width:140px;height:105px;bottom:76px}#zrFloat{bottom:76px}.zrPill{font-size:11px}.dpad{display:none}
 .zQ{font-size:20px}.zOpt{min-width:84px;min-height:84px;font-size:40px}.zShow{font-size:36px}.clsBar select,.clsBar input{font-size:14px}}
@media (max-height:520px){.top{padding:4px 8px}.strip{min-height:56px}.tab{padding:4px 8px}}
</style>
</head>
<body>

<!-- BAŞLANGIÇ -->
<div id="start" class="hide">
  <div style="font-size:90px;line-height:1">🤖</div>
  <h1>Minik Robotçular</h1>
  <p>Okul Öncesi Robotik · Kodlama · Akıl Zeka</p>
  <div class="startBtns">
    <button class="bigBtn" onclick="chooseRole('board')"><span class="e">🖥️</span>Akıllı Tahta<small>Bu cihaz sınıf tahtası</small></button>
    <button class="bigBtn" onclick="chooseRole('phone')"><span class="e">📱</span>Öğretmen Kumandası<small>Bu cihaz benim telefonum</small></button>
  </div>
</div>

<!-- TAHTA -->
<div id="board" class="hide">
  <div class="top">
    <div class="logo">🤖 Minik <span>Robotçular</span></div>
    <div class="tabs">
      <button class="tab on" data-t="sahne" onclick="setTab('sahne')">🎭 Hareket Sahnesi</button>
      <button class="tab" data-t="yon" onclick="setTab('yon')">🧭 Yön Macerası</button>
      <button class="tab" data-t="arena" onclick="setTab('arena')">❄️ Arena</button>
      <button class="tab" data-t="kodla" onclick="setTab('kodla')">🧩 Kodlama Macerası</button>
      <button class="tab" data-t="zeka" onclick="setTab('zeka')">🧠 Akıl Zeka</button>
      <button class="tab" data-t="sinif" onclick="setTab('sinif')">👥 Sınıfım</button>
    </div>
    <button class="pill" id="liveBtn" onclick="toggleLiveMode()" title="Canlı kamera modu">🪞 Canlı Ayna</button>
    <button class="iconBtn mic" id="micBtn" title="Sesli komut" onclick="toggleMic()">🎤</button>
    <button class="pill" onclick="showQR()"><span class="dot" id="conDot"></span><span id="conTxt">Bağlanıyor…</span></button>
  </div>
  <div class="main">
    <!-- Sahne -->
    <div class="panel" id="p-sahne">
      <div class="grid" id="stage"><div class="cells" id="stageCells"></div></div>
      <div class="side">
        <div class="dpad">
          <button class="dbtn u" onclick="cmd('yukari')">⬆️</button>
          <button class="dbtn l" onclick="cmd('sol')">⬅️</button>
          <button class="dbtn c" onclick="cmd('zipla')">🦘</button>
          <button class="dbtn r" onclick="cmd('sag')">➡️</button>
          <button class="dbtn d" onclick="cmd('asagi')">⬇️</button>
        </div>
        <div class="acts">
          <button class="act-btn" onclick="cmd('don')"><b>🔄</b>Dön</button>
          <button class="act-btn" onclick="cmd('dans')"><b>💃</b>Dans</button>
          <button class="act-btn" onclick="cmd('alkis')"><b>👏</b>Alkış</button>
          <button class="act-btn" onclick="cmd('salla')"><b>👋</b>Merhaba</button>
          <button class="act-btn" onclick="cmd('buyu')"><b>🐘</b>Büyü</button>
          <button class="act-btn" onclick="cmd('kucul')"><b>🐭</b>Küçül</button>
          <button class="act-btn" onclick="cmd('baslangic')"><b>🏠</b>Yerine</button>
          <button class="act-btn" onclick="randomPick()"><b>🎲</b>Sıra Kimde</button>
        </div>
      </div>
    </div>
    <!-- Yön -->
    <div class="panel hide" id="p-yon"></div>
    <div class="panel hide" id="p-arena"></div>
    <!-- Kodlama -->
    <div class="panel hide" id="p-kodla">
      <div class="codeWrap">
        <div class="codeRow">
          <span class="lvlTag" id="lvlTag">Bölüm 1</span>
          <button class="backBtn" onclick="lvlStep(-1)">◀</button>
          <button class="backBtn" onclick="lvlStep(1)">▶</button>
          <span style="flex:1;font-weight:800;font-size:clamp(16px,1.8vw,26px);text-align:center" id="lvlHint"></span>
        </div>
        <div class="grid" id="cgrid" style="width:min(100%,calc((100vh - 330px)*1.8))"><div class="cells" id="cCells"></div></div>
        <div class="codeRow">
          <div class="pal">
            <button class="pBtn" onclick="codeAdd('yukari')">⬆️</button>
            <button class="pBtn" onclick="codeAdd('asagi')">⬇️</button>
            <button class="pBtn" onclick="codeAdd('sol')">⬅️</button>
            <button class="pBtn" onclick="codeAdd('sag')">➡️</button>
          </div>
          <div class="codeBar" id="codeBar"></div>
          <div class="pal">
            <button class="pBtn r" title="Geri al" onclick="codeUndo()">↩️</button>
            <button class="pBtn y" title="Baştan" onclick="codeClear()">🗑️</button>
            <button class="pBtn g" title="Çalıştır" onclick="codeRun()">▶️</button>
          </div>
        </div>
      </div>
    </div>
    <!-- Zeka -->
    <div class="panel hide" id="p-zeka"></div>
    <!-- Sınıf -->
    <div class="panel hide" id="p-sinif">
      <div class="clsWrap">
        <div class="clsBar">
          <b style="font-size:20px">Sınıf:</b>
          <select id="clsSel" onchange="switchClass(this.value)"></select>
          <button class="btnP" onclick="newClass()">➕ Yeni Sınıf</button>
          <span style="flex:1"></span>
          <button class="btnP" style="background:var(--grn)" onclick="document.getElementById('boardFile').click()">🖼️ Tahtadan Fotoğraf Ekle</button>
          <button class="btnP" style="background:var(--pink)" onclick="showQR()">📱 Telefonu Bağla</button>
          <label class="mini" style="padding:6px 12px;font-size:15px"><input type="checkbox" id="mirrorChk" onchange="db.mirror=this.checked;save()"> ↔️ Ayna modu</label>
          <input type="file" id="boardFile" accept="image/*" class="hide" onchange="boardFilePicked(this)">
        </div>
        <div class="stGrid" id="stGrid"></div>
      </div>
    </div>
  </div>
  <div class="strip" id="strip"></div>
</div>

<!-- TELEFON -->
<div id="phone" class="hide">
  <div class="pTop"><div class="logo">🤖 Kumanda</div><div style="display:flex;align-items:center;gap:8px"><div class="stat"><span class="dot" id="pDot"></span><span id="pStat">Bağlı değil</span></div><button class="mini" style="padding:6px 10px;font-size:13px" onclick="pChangeBoard()">🔄 Tahta</button></div></div>
  <div class="pBody" id="pBody"></div>
  <div class="pNav" id="pNav">
    <button class="on" data-p="foto" onclick="pTab('foto')"><b>📸</b>Öğrenci</button>
    <button data-p="canli" onclick="pTab('canli')"><b>📹</b>Canlı</button>
    <button data-p="yon" onclick="pTab('yon')"><b>🧭</b>Yön</button>
    <button data-p="kumanda" onclick="pTab('kumanda')"><b>🎮</b>Kumanda</button>
    <button data-p="kod" onclick="pTab('kod')"><b>🧩</b>Kodla</button>
    <button data-p="zeka" onclick="pTab('zeka')"><b>🧠</b>Zeka</button>
  </div>
</div>

<div id="toast"></div>

<script>
/* ================= ORTAK ================= */
const COLS=9, ROWS=5, PREFIX='minikrobot-bo-';
const COLORS=['#7c4dff','#ff5c93','#3a86ff','#2ec4b6','#ff8a3d','#e0a800','#8e44ad','#16a34a','#e11d48','#0891b2'];
const $=s=>document.querySelector(s);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('⚠️ Hafıza doldu! Sınıfım bölümünden eski öğrencileri silin.');return false}}};
let toastT;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2600)}
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const firstName=n=>String(n||'').trim();

/* ses */
let AC;function beep(f=520,d=.12,type='sine',v=.18,delay=0){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const sfx={step(){beep(660,.08,'square',.08);beep(880,.08,'square',.08,.08)},ok(){[523,659,784,1046].forEach((f,i)=>beep(f,.18,'triangle',.2,i*.11))},no(){beep(200,.25,'sawtooth',.12);beep(150,.3,'sawtooth',.12,.15)},pop(){beep(900,.1,'sine',.15);beep(1300,.1,'sine',.12,.06)},jump(){const t=0;for(let i=0;i<6;i++)beep(400+i*120,.06,'square',.08,i*.04)}};
let trVoice=null;function loadVoice(){try{const v=speechSynthesis.getVoices();trVoice=v.find(x=>/tr/i.test(x.lang))||null}catch(e){}}
try{speechSynthesis.onvoiceschanged=loadVoice;loadVoice()}catch(e){}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';if(trVoice)u.voice=trVoice;u.rate=.95;u.pitch=1.15;speechSynthesis.speak(u)}catch(e){}}
function confetti(n=40){const em=['⭐','🎉','🌟','🎈','💫','🍭','🎊'];for(let i=0;i<n;i++){const d=document.createElement('div');d.className='conf';d.textContent=pick(em);d.style.left=Math.random()*100+'vw';d.style.animationDuration=(1.8+Math.random()*1.8)+'s';d.style.animationDelay=(Math.random()*.5)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),4200)}}
function bigText(t,ms=1500){const d=document.createElement('div');d.className='big';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),ms)}

/* fotoğrafı kare kırp + küçült */
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
function cropTo(img,size,zoom=1,offY=0){const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');const s=Math.min(img.width,img.height)/zoom;const cx=img.width/2,cy=img.height/2+offY*(img.height-s)/2;const sx=Math.max(0,Math.min(img.width-s,cx-s/2)),sy=Math.max(0,Math.min(img.height-s,cy-s/2));x.fillStyle='#fff';x.fillRect(0,0,size,size);x.drawImage(img,sx,sy,s,s,0,0,size,size);return c}
async function makeThumb(dataUrl,size=72){try{const i=await loadImg(dataUrl);return cropTo(i,size).toDataURL('image/jpeg',.7)}catch(e){return ''}}

/* ================= ROL ================= */
const hashCode=(location.hash.match(/k=(\d{4})/)||[])[1];
function chooseRole(r){LS.set('mr_role',r);$('#start').classList.add('hide');r==='board'?initBoard():initPhone()}
window.addEventListener('load',()=>{if(hashCode){LS.set('mr_role','phone');try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}initPhone(hashCode);return}const r=LS.get('mr_role',null);if(r==='board')initBoard();else if(r==='phone')initPhone();else $('#start').classList.remove('hide')});

/* ================= TAHTA ================= */
let db, peer=null, conns=[], tab='sahne', pos={}, active=null, onStage=new Set();
function save(){const ok=LS.set('mr_db',db);broadcastRoster();return ok}
function clsStudents(){return db.students.filter(s=>s.cls===db.cur)}
function stu(id){return db.students.find(s=>s.id===id)}
function colorOf(s){return COLORS[(db.students.indexOf(s)+COLORS.length)%COLORS.length]}
function faceHTML(s,cls='head'){return s&&s.photo?`<img src="${s.photo}" alt="">`:`<div class="ph">🤖</div>`}

function initBoard(){
  db=LS.get('mr_db',null)||{classes:['Papatyalar'],cur:'Papatyalar',students:[],code:null,mirror:false,lvl:0};
  if(!db.code){db.code=String(1000+rnd(9000))}
  db.lvl=db.lvl||0;
  LS.set('mr_db',db);
  $('#board').classList.remove('hide');
  $('#mirrorChk').checked=!!db.mirror;
  buildCells($('#stageCells'),false);
  clsStudents().forEach(s=>onStage.add(s.id));
  layoutStage();renderAll();
  startPeer();
  document.addEventListener('keydown',e=>{const m={ArrowRight:'sag',ArrowLeft:'sol',ArrowUp:'yukari',ArrowDown:'asagi',' ':'zipla'}[e.key];if(m&&tab==='sahne'){e.preventDefault();cmd(m)}else if(m&&tab==='kodla'&&m!=='zipla'){e.preventDefault();codeAdd(m)}});
}
function buildCells(el,big){el.style.gridTemplateColumns=`repeat(${COLS},1fr)`;el.style.gridTemplateRows=`repeat(${ROWS},1fr)`;let h='';for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)h+=`<div class="cell ${(x+y)%2?'a':'b'}" data-x="${x}" data-y="${y}"></div>`;el.innerHTML=h}
function renderAll(){renderStrip();renderStage();if(tab==='sinif')renderClass();if(tab==='kodla')renderLevel();}

/* --- sahne --- */
function freeCell(){const used=new Set(Object.values(pos).map(p=>p.x+','+p.y));const order=[];for(let y of [2,1,3,0,4])for(let x=1;x<COLS-1;x++)order.push([x,y]);for(const [x,y] of order)if(!used.has(x+','+y))return{x,y};return{x:rnd(COLS),y:rnd(ROWS)}}
function layoutStage(){Object.keys(pos).forEach(id=>{if(!onStage.has(id))delete pos[id]});const ids=[...onStage];const n=ids.length;ids.forEach((id,i)=>{if(!pos[id]){const c=freeCell();pos[id]={x:c.x,y:c.y,s:1,home:{x:c.x,y:c.y}}}});if(active&&!onStage.has(active))active=null;if(!active&&ids.length)active=ids[0]}
function renderStage(){
  const st=$('#stage');st.querySelectorAll('.av').forEach(a=>{if(!onStage.has(a.dataset.id)||!stu(a.dataset.id))a.remove()});
  if(!onStage.size&&!st.querySelector('.emptyStage')){const d=document.createElement('div');d.className='emptyStage';d.style.cssText='position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:clamp(18px,2.4vw,34px);font-weight:800;color:#2b2350;text-align:center;z-index:2';d.innerHTML='📱 Telefondan öğrencinin fotoğrafını çekip gönderin<br><small style="font-size:60%;color:#7a6fa8">ya da sağ üstteki bağlantı düğmesine dokunun</small>';st.appendChild(d)}
  if(onStage.size)st.querySelectorAll('.emptyStage').forEach(e=>e.remove());
  onStage.forEach(id=>{const s=stu(id);if(!s)return;let a=st.querySelector(`.av[data-id="${id}"]`);if(!a){a=document.createElement('div');a.className='av';a.dataset.id=id;a.innerHTML=avatarInner(s);hydrateDolls(a);a.onclick=()=>{setActive(id)};st.appendChild(a)}
    const p=pos[id];a.style.left=(p.x*100/COLS)+'%';a.style.top=(p.y*100/ROWS)+'%';a.style.width=(100/COLS)+'%';a.style.height=(100/ROWS)+'%';a.style.setProperty('--c',colorOf(s));a.querySelector('.avIn').style.transform=`scale(${p.s})`;a.style.zIndex=id===active?6:3;a.classList.toggle('act',id===active)});
}
function avatarInner(s){return `<div class="avIn"><div class="ant"></div><div class="head">${faceHTML(s)}</div><div class="bod"><i></i><i></i></div><div class="legs"><b></b><b></b></div></div><div class="nm">${esc(firstName(s.name))}</div>`}
function animate(id,cls,ms=900,root='#stage'){const a=$(root).querySelector(`.av[data-id="${id}"]`);if(!a)return;a.classList.remove(cls);void a.offsetWidth;a.classList.add(cls);setTimeout(()=>a.classList.remove(cls),ms)}
function popEmoji(id,em,root='#stage'){const a=$(root).querySelector(`.av[data-id="${id}"]`);if(!a)return;const s=document.createElement('span');s.className='pop';s.textContent=em;a.appendChild(s);setTimeout(()=>s.remove(),1300)}
function setActive(id,speak=true){if(!stu(id))return;if(!onStage.has(id)){onStage.add(id);layoutStage()}active=id;renderStage();renderStrip();sfx.pop();if(speak)say(firstName(stu(id).name)+', sıra sende!');broadcastRoster();if(tab==='kodla')renderLevel()}
const DIR={sag:[1,0,'sağa'],sol:[-1,0,'sola'],yukari:[0,-1,'yukarı'],asagi:[0,1,'aşağı']};
function cmd(c,id,raw){
  if(tab==='yon'&&YMAP[c]){yInput(YMAP[c]);return}
  if(tab==='kodla'&&DIR[c]){codeAdd(c);return}
  if(tab!=='sahne')setTab('sahne');
  id=id||active;const s=stu(id);if(!s){toast('Önce bir öğrenci seçin 👇');return}
  if(id!==active)setActive(id,false);
  const p=pos[id];if(!p)return;const n=firstName(s.name);
  if(db.mirror&&!raw&&(c==='sag'||c==='sol'))c=c==='sag'?'sol':'sag';
  if(DIR[c]){const [dx,dy,w]=DIR[c];const nx=p.x+dx,ny=p.y+dy;
    if(nx<0||ny<0||nx>=COLS||ny>=ROWS){animate(id,'bump',500);sfx.no();say(n+', orada duvar var!');return}
    p.x=nx;p.y=ny;renderStage();animate(id,'walk',650);sfx.step();say(n+' '+w+' gitti');return}
  if(c==='zipla'){animate(id,'jump',800);sfx.jump();popEmoji(id,'⭐');say(n+' zıpladı!')}
  else if(c==='don'){animate(id,'spin',900);sfx.pop();say(n+' döndü!')}
  else if(c==='dans'){animate(id,'dance',1600);[523,659,784,659,523,784].forEach((f,i)=>beep(f,.15,'triangle',.15,i*.22));popEmoji(id,'🎵');say(n+' dans ediyor!')}
  else if(c==='alkis'){animate(id,'pulse',700);popEmoji(id,'👏');for(let i=0;i<4;i++)beep(1800,.03,'square',.12,i*.13);say(n+' için alkışlar!')}
  else if(c==='salla'){animate(id,'pulse',700);popEmoji(id,'👋');sfx.pop();say('Merhaba '+n+'!')}
  else if(c==='buyu'){p.s=Math.min(1.45,p.s+.2);renderStage();sfx.jump();popEmoji(id,'🐘');say(n+' büyüdü!')}
  else if(c==='kucul'){p.s=Math.max(.6,p.s-.2);renderStage();beep(900,.1);beep(600,.1,'sine',.15,.1);popEmoji(id,'🐭');say(n+' küçüldü!')}
  else if(c==='baslangic'){p.x=p.home.x;p.y=p.home.y;p.s=1;renderStage();animate(id,'walk',650);say(n+' yerine döndü')}
  else if(c==='yildiz'){giveStar(id)}
}
function giveStar(id){const s=stu(id);if(!s)return;s.stars=(s.stars||0)+1;save();renderStrip();popEmoji(id,'⭐');}
function randomPick(){const ids=[...onStage];if(!ids.length)return;let i=0;const t=setInterval(()=>{setActive(ids[i++%ids.length],false);beep(500+i*30,.05,'square',.08);if(i>ids.length+8+rnd(ids.length)){clearInterval(t);const s=stu(active);confetti(20);say('Sıra '+firstName(s.name)+' de!')}},140)}

/* --- şerit --- */
function renderStrip(){const list=clsStudents();const el=$('#strip');if(!list.length){el.innerHTML=`<span class="empty">👥 ${esc(db.cur)} sınıfında henüz öğrenci yok — telefonla fotoğraf çekip gönderin.</span>`;return}
  el.innerHTML=`<span class="empty" style="font-size:15px">${esc(db.cur)}:</span>`+list.map(s=>`<div class="chip ${s.id===active?'on':''} ${onStage.has(s.id)?'':'off'}" style="--c:${colorOf(s)}" onclick="setActive('${s.id}')">${s.photo?`<img src="${s.photo}">`:'<div class="ph">🤖</div>'}<span>${esc(firstName(s.name))}</span>${s.stars?`<em>⭐${s.stars}</em>`:''}</div>`).join('')}

/* --- sekmeler --- */
function setTab(t){tab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));['sahne','yon','arena','kodla','zeka','sinif'].forEach(x=>$('#p-'+x).classList.toggle('hide',x!==t));if(t==='sinif')renderClass();if(t==='kodla')renderLevel();if(t==='zeka')zMenu();if(t==='sahne')renderStage();broadcastRoster()}

/* --- öğrenci ekleme --- */
async function addStudent(name,photo,cls,parts){
  name=String(name||'').trim().slice(0,30)||'Robot';
  if(cls&&!db.classes.includes(cls)){db.classes.push(cls)}
  if(cls&&cls!==db.cur)switchClass(cls,true);
  let s=db.students.find(x=>x.cls===db.cur&&x.name.toLocaleLowerCase('tr')===name.toLocaleLowerCase('tr'));

/* --- bağlantı (PeerJS) --- */
function setCon(){const n=conns.filter(c=>c.open).length;$('#conDot').classList.toggle('ok',n>0);$('#conTxt').textContent=peer&&!peer.disconnected?(n?`📱 ${n} telefon bağlı · ${db.code}`:`Kod: ${db.code}`):(window.Peer?'Bağlanıyor…':'İnternet yok')}
function startPeer(){
  if(!window.Peer){setCon();toast('Telefon bağlantısı için internet gerekli. Tahtadan kullanmaya devam edebilirsiniz.');return}
  try{peer=new Peer(PREFIX+db.code,{debug:0})}catch(e){setCon();return}
  peer.on('open',()=>{setCon()});
  peer.on('connection',c=>{conns.push(c);c.on('open',()=>{setCon();sendRoster(c);toast('📱 Telefon bağlandı!');sfx.pop()});c.on('data',d=>handleMsg(d,c));c.on('close',()=>{conns=conns.filter(x=>x!==c);setCon()});c.on('error',()=>{})});
  peer.on('disconnected',()=>{setCon();setTimeout(()=>{try{peer.reconnect()}catch(e){}},2000)});
  peer.on('error',e=>{if(e.type==='unavailable-id'){db.code=String(1000+rnd(9000));LS.set('mr_db',db);try{peer.destroy()}catch(x){}setTimeout(startPeer,500)}else if(e.type==='network'||e.type==='server-error'||e.type==='socket-error'){setCon();setTimeout(()=>{try{peer.destroy()}catch(x){}startPeer()},5000)}});
}
function rosterMsg(){return{t:'roster',cls:db.cur,classes:db.classes,active,tab,list:clsStudents().map(s=>({id:s.id,name:s.name,thumb:s.thumb||'',stars:s.stars||0,on:onStage.has(s.id),col:s.parts&&s.parts.col&&s.parts.col.shirt?{shirt:s.parts.col.shirt,pants:s.parts.col.pants||null}:null}))}}
function sendRoster(c){try{c.open&&c.send(rosterMsg())}catch(e){}}
function broadcastRoster(){if(!conns.length)return;const m=rosterMsg();conns.forEach(c=>{try{c.open&&c.send(m)}catch(e){}})}
function handleMsg(d,c){if(!d||!d.t)return;
  if(d.t==='add'){if(d.photo&&String(d.photo).startsWith('data:image'))addStudent(d.name,d.photo,d.cls,cleanParts(d.parts));try{c.send({t:'added',name:d.name})}catch(e){}}
  else if(d.t==='cmd')cmd(d.c,d.id);
  else if(d.t==='sel'){setActive(d.id,!d.auto);if(d.auto&&stu(d.id)){sayBox('📹 Kamerada: '+firstName(stu(d.id).name));if(tab!=='yon')say('Kamerada '+firstName(stu(d.id).name))}}
  else if(d.t==='tab')setTab(d.v);
  else if(d.t==='cls'){if(db.classes.includes(d.v))switchClass(d.v)}
  else if(d.t==='newcls'){const v=String(d.v||'').trim();if(v){if(!db.classes.includes(v))db.classes.push(v);switchClass(v);save()}}
  else if(d.t==='random'){setTab('sahne');randomPick()}
  else if(d.t==='code'){if(tab!=='kodla')setTab('kodla');({add:()=>codeAdd(d.v),undo:codeUndo,clear:codeClear,run:codeRun,next:()=>lvlStep(1),prev:()=>lvlStep(-1)})[d.a]?.()}
  else if(d.t==='zeka'){if(tab!=='zeka')setTab('zeka');if(d.g==='menu')zMenu();else if(d.g==='next'){if(zCur)zStart(zCur)}else zStart(d.g)}
  else if(d.t==='star'){giveStar(d.id||active);say('Aferin '+firstName((stu(d.id||active)||{}).name)+'! Bir yıldız kazandın!');confetti(25)}
  else if(d.t==='hello')sendRoster(c);
  else extMsg(d,c);
}
function showQR(){const url=location.origin+location.pathname+'#k='+db.code;const local=location.protocol==='file:';
  const m=document.createElement('div');m.className='modal';m.onclick=e=>{if(e.target===m)m.remove()};
  m.innerHTML=`<div class="mBox"><h2>📱 Telefonu Bağla</h2><p style="margin:0">Telefonun kamerasıyla bu kodu okutun</p><div id="qr"></div><div>ya da telefonda bu sayfayı açıp <b>Öğretmen Kumandası</b>'na kodu yazın:</div><div class="codeBig">${db.code}</div>${local?'<p style="color:#e11d48;font-weight:700">⚠️ Dosya bilgisayardan açılmış. QR kodun çalışması için dosyayı sitenize yükleyip oradan açın.</p>':''}<button class="btnP" onclick="this.closest('.modal').remove()">Tamam</button></div>`;
  document.body.appendChild(m);try{new QRCode(m.querySelector('#qr'),{text:url,width:230,height:230,correctLevel:QRCode.CorrectLevel.M})}catch(e){m.querySelector('#qr').innerHTML='<small>QR oluşturulamadı (internet gerekli)</small>'}}

let rec=null,recOn=false;
function toggleMic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Bu tarayıcı sesli komutu desteklemiyor (Chrome deneyin).');return}
  if(recOn){recOn=false;try{rec.stop()}catch(e){}$('#micBtn').classList.remove('on');return}
  rec=new SR();rec.lang='tr-TR';rec.continuous=true;rec.interimResults=false;
  rec.onresult=e=>{const t=e.results[e.results.length-1][0].transcript;voiceCmd(t)};
  rec.onend=()=>{if(recOn)try{rec.start()}catch(e){}};rec.onerror=ev=>{if(ev.error==='not-allowed'){recOn=false;$('#micBtn').classList.remove('on');toast('Mikrofon izni verilmedi.')}};
  try{rec.start();recOn=true;$('#micBtn').classList.add('on');toast('🎤 Dinliyorum: "Selim sağa git" deyin')}catch(e){}}
function voiceCmd(t){t=t.toLocaleLowerCase('tr');toast('🎤 '+t);
  const st=clsStudents().slice().sort((a,b)=>b.name.length-a.name.length).find(s=>{const n=s.name.toLocaleLowerCase('tr');return t.includes(n)||n.split(/\s+/).some(w=>w.length>2&&t.includes(w))});
  if(st&&st.id!==active)setActive(st.id,false);
  const map=[['sağ','sag'],['sol','sol'],['yukarı','yukari'],['ileri','yukari'],['aşağı','asagi'],['geri','asagi'],['zıpla','zipla'],['dön','don'],['dans','dans'],['alkış','alkis'],['salla','salla'],['merhaba','salla'],['büyü','buyu'],['küçül','kucul'],['yerine','baslangic']];
  const words=t.split(/\s+/);const found=[];
  words.forEach(w=>{const m=map.find(([k])=>w.startsWith(k));if(m)found.push(m[1])});
  if(!found.length&&st){say(firstName(st.name)+', sıra sende!');return}
  found.slice(0,4).forEach((c,i)=>setTimeout(()=>cmd(c),i*700));
}

let code=[],running=false,cpos=null;
function lvl(){return LEVELS[db.lvl%LEVELS.length]}
function renderLevel(){const L=lvl();buildCells($('#cCells'));const cells=$('#cCells').children;
  L.w.forEach(([x,y],k)=>{cells[y*COLS+x].innerHTML=`<span class="wall">${k%3===2?'🪨':'🌳'}</span>`});
  cells[L.g[1]*COLS+L.g[0]].innerHTML=`<span class="goal">${L.i}</span>`;
  $('#lvlTag').textContent='Bölüm '+(db.lvl+1)+' / '+LEVELS.length;$('#lvlHint').textContent=L.h;
  if(!running){cpos={x:L.s[0],y:L.s[1]};}
  const g=$('#cgrid');g.querySelectorAll('.av').forEach(a=>a.remove());
  const s=stu(active)||{id:'robot',name:'Robot'};const a=document.createElement('div');a.className='av act';a.dataset.id=s.id;a.innerHTML=avatarInner(s);hydrateDolls(a);a.style.setProperty('--c',stu(active)?colorOf(s):'#7c4dff');a.style.width=(100/COLS)+'%';a.style.height=(100/ROWS)+'%';g.appendChild(a);placeC();renderCode()}
function placeC(){const a=$('#cgrid').querySelector('.av');if(!a)return;a.style.left=(cpos.x*100/COLS)+'%';a.style.top=(cpos.y*100/ROWS)+'%'}
const ARW={sag:'➡️',sol:'⬅️',yukari:'⬆️',asagi:'⬇️'};
function renderCode(hi=-1){$('#codeBar').innerHTML=code.length?code.map((c,i)=>`<div class="cCard ${i===hi?'run':''} ${hi>=0&&i<hi?'done':''}">${ARW[c]}</div>`).join(''):'<span class="empty">Okları buraya diz, sonra ▶️ Çalıştır!</span>';broadcastCode()}
function broadcastCode(){if(!conns.length)return;const m={t:'codeState',code,lvl:db.lvl+1,hint:lvl().h};conns.forEach(c=>{try{c.open&&c.send(m)}catch(e){}})}
function codeAdd(c){if(running||!ARW[c])return;if(code.length>=18){toast('En fazla 18 adım!');return}code.push(c);sfx.pop();renderCode();say({sag:'sağ',sol:'sol',yukari:'yukarı',asagi:'aşağı'}[c])}
function codeUndo(){if(running)return;code.pop();renderCode()}
function codeClear(){if(running)return;code=[];const L=lvl();cpos={x:L.s[0],y:L.s[1]};placeC();renderCode()}
function lvlStep(d){if(running)return;db.lvl=(db.lvl+d+LEVELS.length)%LEVELS.length;LS.set('mr_db',db);code=[];renderLevel()}
async function codeRun(){if(running)return;if(!code.length){say('Önce okları dizelim!');return}
  running=true;const L=lvl();cpos={x:L.s[0],y:L.s[1]};placeC();const s=stu(active);const n=s?firstName(s.name):'Robot';const id=s?s.id:'robot';
  await wait(400);
  for(let i=0;i<code.length;i++){renderCode(i);const [dx,dy]=DIR[code[i]];const nx=cpos.x+dx,ny=cpos.y+dy;
    const blocked=nx<0||ny<0||nx>=COLS||ny>=ROWS||L.w.some(([x,y])=>x===nx&&y===ny);
    if(blocked){animate(id,'bump',500,'#cgrid');sfx.no();say('Eyvah! '+n+' çarptı. Tekrar deneyelim!');await wait(1500);running=false;cpos={x:L.s[0],y:L.s[1]};placeC();renderCode();return}
    cpos={x:nx,y:ny};placeC();animate(id,'walk',650,'#cgrid');sfx.step();await wait(750);
    if(nx===L.g[0]&&ny===L.g[1])break}
  if(cpos.x===L.g[0]&&cpos.y===L.g[1]){sfx.ok();confetti(60);bigText('Harika! 🎉');animate(id,'dance',1600,'#cgrid');say('Aferin '+n+'! Görevi başardın!');if(s)giveStar(s.id);await wait(2600);running=false;code=[];db.lvl=(db.lvl+1)%LEVELS.length;LS.set('mr_db',db);renderLevel()}
  else{sfx.no();say('Hedefe biraz kaldı! Bir ok daha ekleyelim mi?');await wait(1500);running=false;renderCode()}}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

let pPeer=null,pConn=null,pCode=null,roster={list:[],classes:[],cls:'',active:null},pCur='foto',pImg=null,pZoom=1.1,pOff=-.3,codeState={code:[],lvl:1,hint:''};

function pChips(){return roster.list.length?`<div class="pChips">${roster.list.map(s=>`<div class="chip ${s.id===roster.active?'on':''}" onclick="send({t:'sel',id:'${s.id}'})">${s.thumb?`<img src="${s.thumb}">`:'<div class="ph">🤖</div>'}<span>${esc(firstName(s.name))}</span>${s.stars?`<em>⭐${s.stars}</em>`:''}</div>`).join('')}</div>`:'<p class="empty" style="font-size:15px">Önce 📸 Öğrenci sekmesinden fotoğraf gönderin.</p>'}

    <div class="pDpad"><span></span><button onclick="send({t:'code',a:'add',v:'yukari'})">⬆️</button><span></span><button onclick="send({t:'code',a:'add',v:'sol'})">⬅️</button><button style="background:var(--grn);font-size:38px" onclick="send({t:'code',a:'run'})">▶️</button><button onclick="send({t:'code',a:'add',v:'sag'})">➡️</button><span></span><button onclick="send({t:'code',a:'add',v:'asagi'})">⬇️</button><span></span></div>
    <div class="pRow"><button class="pBtn2 o" onclick="send({t:'code',a:'undo'})">↩️ Geri Al</button><button class="pBtn2 y" onclick="send({t:'code',a:'clear'})">🗑️ Temizle</button></div>
    <div class="pRow" style="margin-top:10px"><button class="pBtn2" onclick="send({t:'code',a:'prev'})">◀ Önceki</button><button class="pBtn2" onclick="send({t:'code',a:'next'})">Sonraki ▶</button></div>`}
  else if(pCur==='zeka'){B.innerHTML=`${pChips()}<div class="pZ">${ZGAMES.map(g=>`<button onclick="send({t:'zeka',g:'${g.k}'})"><b>${g.e}</b>${g.t}</button>`).join('')}</div>
    <div class="pRow" style="margin-top:12px"><button class="pBtn2 g" onclick="send({t:'zeka',g:'next'})">🔄 Yeni Soru</button><button class="pBtn2 y" onclick="send({t:'star'})">⭐ Yıldız</button></div><p class="empty" style="font-size:14px;text-align:center">Çocuk cevabı tahtaya dokunarak verir.</p>`}
}
async function pPicked(inp){const f=inp.files[0];inp.value='';if(!f)return;try{pImg=await loadImg(URL.createObjectURL(f));pZoom=1.1;pOff=-.3;const nm=document.getElementById('pName').value;pRender();document.getElementById('pName').value=nm}catch(e){toast('Fotoğraf açılamadı')}}

  if(!pImg)return;const photo=cropTo(pImg,360,pZoom,pOff).toDataURL('image/jpeg',.82);const cls=document.getElementById('pCls').value;

<script>
/* =====================================================================
   KIYAFETLİ KUKLA AVATAR + CANLI HAREKET TAKİBİ (telefon kamerası)
   ===================================================================== */
const MP_BASE='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MP_MODEL='https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';
const KP={nose:0,eyeL:2,eyeR:5,ls:11,rs:12,le:13,re:14,lw:15,rw:16,lh:23,rh:24,lk:25,rk:26,la:27,ra:28};
const KN=Object.keys(KP);
const DEF={nose:[0,-1.42],eyeL:[-.1,-1.5],eyeR:[.1,-1.5],ls:[-.42,-1],rs:[.42,-1],le:[-.58,-.5],re:[.58,-.5],lw:[-.64,0],rw:[.64,0],lh:[-.24,0],rh:[.24,0],lk:[-.25,.92],rk:[.25,.92],la:[-.26,1.82],ra:[.26,1.82]};
function defPose(){const o={};KN.forEach(k=>o[k]={x:DEF[k][0],y:DEF[k][1],v:1});return o}
/* parça: [başlangıç, bitiş, genişlik(T), üst pay, alt pay, doku-genişlik, doku-yükseklik] */
const SEGS={lua:['ls','le',.25,.15,.08,44,96],lla:['le','lw',.21,.08,.14,40,96],rua:['rs','re',.25,.15,.08,44,96],rla:['re','rw',.21,.08,.14,40,96],lul:['lh','lk',.34,.1,.06,56,110],lll:['lk','la',.28,.06,.06,46,110],rul:['rh','rk',.34,.1,.06,56,110],rll:['rk','ra',.28,.06,.06,46,110]};
const TEXKEYS=['torso',...Object.keys(SEGS)];
const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const r3=v=>Math.round(v*1000)/1000, r2=v=>Math.round(v*100)/100;

/* ---------- MediaPipe yükleme ---------- */
let mpMod=null,mpFiles=null,mpVid=null,mpImg=null;
async function mpLoad(){if(!mpMod){mpMod=await import(MP_BASE+'/vision_bundle.mjs');mpFiles=await mpMod.FilesetResolver.forVisionTasks(MP_BASE+'/wasm')}return mpMod}
async function mpCreate(mode){await mpLoad();const mk=d=>mpMod.PoseLandmarker.createFromOptions(mpFiles,{baseOptions:{modelAssetPath:MP_MODEL,delegate:d},runningMode:mode,numPoses:1,minPoseDetectionConfidence:.5,minPosePresenceConfidence:.5,minTrackingConfidence:.5});try{return await mk('GPU')}catch(e){return await mk('CPU')}}
function getImgLM(){if(!mpImg)mpImg=mpCreate('IMAGE').catch(e=>{mpImg=null;throw e});return mpImg}
function getVidLM(){if(!mpVid)mpVid=mpCreate('VIDEO').catch(e=>{mpVid=null;throw e});return mpVid}

/* ---------- fotoğraftan kıyafet çıkarma ---------- */
function cropSeg(src,a,b,wpx,pt,pb,ow,oh){const c=document.createElement('canvas');c.width=ow;c.height=oh;const x=c.getContext('2d');const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);x.fillStyle='#e5e7eb';x.fillRect(0,0,ow,oh);x.translate(ow/2,0);x.scale(ow/wpx,oh/(len*(1+pt+pb)));x.translate(0,len*pt);x.rotate(Math.PI/2-ang);x.translate(-a.x,-a.y);x.drawImage(src,0,0);return c}
function sampleColor(cv,x,y,r){r=Math.max(2,Math.round(r));const X=Math.round(clamp(x-r,0,cv.width-1)),Y=Math.round(clamp(y-r,0,cv.height-1));const w=Math.max(1,Math.min(cv.width-X,2*r)),h=Math.max(1,Math.min(cv.height-Y,2*r));try{const d=cv.getContext('2d').getImageData(X,Y,w,h).data;let R=0,G=0,B=0,n=0;for(let i=0;i<d.length;i+=4){R+=d[i];G+=d[i+1];B+=d[i+2];n++}return '#'+[R,G,B].map(v=>Math.round(v/n).toString(16).padStart(2,'0')).join('')}catch(e){return null}}
async function processPhoto(img){
  const sc=Math.min(1,1100/Math.max(img.width,img.height));const W=Math.round(img.width*sc),H=Math.round(img.height*sc);
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;cv.getContext('2d').drawImage(img,0,0,W,H);
  let lm=null;try{const L=await getImgLM();const r=L.detect(cv);lm=r&&r.landmarks&&r.landmarks[0]}catch(e){console.warn('poz',e)}
  return lm?analyzePose(cv,lm):null}
function analyzePose(cv,lm){const W=cv.width,H=cv.height;
  const P={};KN.forEach(k=>{const p=lm[KP[k]];P[k]={x:p.x*W,y:p.y*H,v:p.visibility==null?1:p.visibility}});
  const ear=[7,8].map(i=>lm[i]?{x:lm[i].x*W,y:lm[i].y*H,v:lm[i].visibility==null?1:lm[i].visibility}:null);
  const inside=p=>p.x>=-2&&p.x<=W+2&&p.y>=-2&&p.y<=H+2;
  const ok=k=>P[k].v>.5&&inside(P[k]);
  if(!(ok('ls')&&ok('rs')&&ok('nose')))return null;
  const sm=mid(P.ls,P.rs),sw=dist(P.ls,P.rs);if(sw<20)return null;
  const hip=ok('lh')&&ok('rh');const hm=hip?mid(P.lh,P.rh):{x:sm.x,y:sm.y+sw*1.2};const T=Math.max(dist(sm,hm),sw*.6);
  const earD=(ear[0]&&ear[1]&&ear[0].v>.5&&ear[1].v>.5)?dist(ear[0],ear[1]):sw*.5;
  const side=Math.max(earD*1.75,sw*.62,T*.55);
  const head={cx:P.nose.x,cy:P.nose.y-side*.1,side};
  const hw=hip?dist(P.lh,P.rh):sw*.7;
  const tw=clamp(Math.max(sw,hw*1.3)/T*1.12,.75,1.7);
  const cvs={},col={};
  col.skin=sampleColor(cv,P.nose.x,P.nose.y+side*.08,side*.06)||'#f2c6a0';
  col.shirt=sampleColor(cv,sm.x,sm.y+T*.35,T*.1)||'#7c4dff';col.sleeve=col.shirt;
  cvs.torso=cropSeg(cv,sm,hm,tw*T,.14,.1,110,138);
  Object.entries(SEGS).forEach(([k,[a,b,w,pt,pb,ow,oh]])=>{if(ok(a)&&ok(b))cvs[k]=cropSeg(cv,P[a],P[b],w*T,pt,pb,ow,oh)});
  if(hip){const pp={x:hm.x,y:hm.y+T*.18};if(inside(pp))col.pants=sampleColor(cv,pp.x,pp.y,T*.08)}
  col.pants=col.pants||'#3b4a7a';
  ['l','r'].forEach(sd=>{const a=P[sd+'a'],k=P[sd+'k'];if(ok(sd+'a')&&ok(sd+'k')){const p={x:a.x+(a.x-k.x)*.12,y:a.y+(a.y-k.y)*.12};if(inside(p))col['shoe'+sd]=sampleColor(cv,p.x,p.y,T*.05)}});
  col.shoe=col.shoel||col.shoer||'#374151';delete col.shoel;delete col.shoer;
  const full=['lk','rk','la','ra'].every(ok);
  return {cv,P,T,head,parts:{hr:side/T,tw,col},cvs,full}}
function headCrop(A,zoom=1,off=0,size=300){const side=A.head.side/zoom,cx=A.head.cx,cy=A.head.cy+off*A.head.side*.5;const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,size,size);x.drawImage(A.cv,cx-side/2,cy-side/2,side,side,0,0,size,size);return c}
function packParts(A){const tex={};Object.entries(A.cvs).forEach(([k,c])=>tex[k]=c.toDataURL('image/jpeg',.78));return {hr:r3(A.parts.hr),tw:r3(A.parts.tw),col:A.parts.col,tex}}
function cleanParts(p){if(!p||typeof p!=='object')return null;const o={hr:clamp(+p.hr||1,.4,1.8),tw:clamp(+p.tw||1,.6,1.8),col:{},tex:{}};
  const c=p.col||{};['skin','shirt','sleeve','pants','shoe'].forEach(k=>{if(/^#[0-9a-f]{6}$/i.test(c[k]||''))o.col[k]=c[k]});
  const t=p.tex||{};TEXKEYS.forEach(k=>{if(typeof t[k]==='string'&&t[k].startsWith('data:image/')&&t[k].length<200000)o.tex[k]=t[k]});return o}

/* ---------- kukla çizimi ---------- */
function rr(x,X,Y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}
function drawPuppet(x,parts,tx,P,cx,hy,T,robo,name,o){
  tx=tx||{};const has=!!(parts&&parts.col);const C=has?parts.col:{};
  const sleeve=C.sleeve||robo,pants=C.pants||'#4b5563',skin=C.skin||'#d1d5db',shoe=C.shoe||'#374151',shirt=C.shirt||robo;
  const S=k=>({x:cx+P[k].x*T,y:hy+P[k].y*T});

  ['l','r'].forEach(sd=>{const W=S(sd+'w'),E=S(sd+'e');const d=Math.hypot(W.x-E.x,W.y-E.y)||1;x.beginPath();x.arc(W.x+(W.x-E.x)/d*T*.08,W.y+(W.y-E.y)/d*T*.08,T*.1,0,7);x.fillStyle=skin;x.fill();x.lineWidth=Math.max(1,T*.03);x.strokeStyle='rgba(43,35,80,.45)';x.stroke()});
  if(o&&o.bands){[['r','#e63946'],['l','#3a86ff']].forEach(([sd,c])=>{const W=S(sd+'w'),E=S(sd+'e');const d=Math.hypot(W.x-E.x,W.y-E.y)||1;const bx=W.x-(W.x-E.x)/d*T*.06,by=W.y-(W.y-E.y)/d*T*.06;x.save();x.translate(bx,by);x.rotate(Math.atan2(W.y-E.y,W.x-E.x)-Math.PI/2);x.fillStyle=c;x.beginPath();rr(x,-T*.14,-T*.05,T*.28,T*.1,T*.04);x.fill();x.strokeStyle='#fff';x.lineWidth=Math.max(1,T*.02);x.stroke();x.restore()})}
  // kafa
  const N=S('nose');let tilt=0;if(P.eyeL.v>.4&&P.eyeR.v>.4){const a=S('eyeL'),b=S('eyeR');tilt=Math.atan2(b.y-a.y,b.x-a.x);if(Math.abs(tilt)>Math.PI/2)tilt+=tilt>0?-Math.PI:Math.PI;tilt=clamp(tilt,-.6,.6)}

  x.beginPath();x.arc(0,-r-T*.3,T*.085,0,7);x.fillStyle=robo;x.fill();

  x.beginPath();x.arc(0,0,r,0,Math.PI*2);x.save();x.clip();

}

function lvNodes(){if(!lv.video){lv.video=document.createElement('video');lv.video.setAttribute('playsinline','');lv.video.setAttribute('webkit-playsinline','');lv.video.muted=true;lv.video.autoplay=true;lv.video.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover';lv.cv=document.createElement('canvas');lv.cv.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none'}
  const h=document.getElementById('lvHost');if(h&&lv.run){h.textContent='';h.appendChild(lv.video);h.appendChild(lv.cv);const m=lv.facing==='user'?'scaleX(-1)':'none';lv.video.style.transform=m;lv.cv.style.transform=m;lv.video.play().catch(()=>{})}}

async function lvStart(){if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){lvSetMsg('⚠️ Kamera için sayfa https ile açılmalı');return}

  lvNodes();lv.video.srcObject=lv.stream;lv.run=true;lvNodes();lv.base=null;lv.baseAcc=[];lv.lastTs=-1;lv.cal=null;

  const b=document.getElementById('lvBtn');if(b)b.textContent='⏹ Durdur';lvSetMsg('👀 Çocuğu arıyorum…');requestAnimationFrame(lvLoop)}
function lvStop(){lv.run=false;try{lv.stream&&lv.stream.getTracks().forEach(t=>t.stop())}catch(e){}lv.stream=null;try{lv.wake&&lv.wake.release()}catch(e){}lv.wake=null;sendQ({t:'camoff'});lvSetMsg('Kamera kapalı');const b=document.getElementById('lvBtn');if(b)b.textContent='▶️ Kamerayı Aç';const h=document.getElementById('lvHost');if(h)h.innerHTML='📹'}

const SK=[['ls','rs'],['ls','le'],['le','lw'],['rs','re'],['re','rw'],['ls','lh'],['rs','rh'],['lh','rh'],['lh','lk'],['lk','la'],['rh','rk'],['rk','ra']];
function lvDrawSk(x,P,col,vw){x.lineWidth=Math.max(3,vw/90);x.strokeStyle=col;x.lineCap='round';SK.forEach(([a,b])=>{if(P[a].v>.4&&P[b].v>.4){x.beginPath();x.moveTo(P[a].x,P[a].y);x.lineTo(P[b].x,P[b].y);x.stroke()}});x.fillStyle='#fff';KN.forEach(k=>{if(P[k].v>.4){x.beginPath();x.arc(P[k].x,P[k].y,Math.max(3,vw/110),0,7);x.fill()}})}
const avgBase=a=>({x:a.reduce((s,o)=>s+o.x,0)/a.length,y:a.reduce((s,o)=>s+o.y,0)/a.length,T:a.reduce((s,o)=>s+o.T,0)/a.length,sw:Math.max(1,a.reduce((s,o)=>s+o.sw,0)/a.length)});
function lvLoop(){if(!lv.run)return;requestAnimationFrame(lvLoop);const v=lv.video;if(!v||v.readyState<2||!v.videoWidth)return;if(v.currentTime===lv.lastTs)return;lv.lastTs=v.currentTime;
  let r;try{r=lv.lm.detectForVideo(v,performance.now())}catch(e){return}
  const vw=v.videoWidth,vh=v.videoHeight,cv=lv.cv;if(cv.width!==vw||cv.height!==vh){cv.width=vw;cv.height=vh}const x=cv.getContext('2d');x.clearRect(0,0,vw,vh);
  const lm=r&&r.landmarks&&r.landmarks[0];if(!lm){if(++lv.miss>20)lvSetMsg('👀 Çocuk görünmüyor');return}lv.miss=0;
  const P={};KN.forEach(k=>{const p=lm[KP[k]];P[k]={x:p.x*vw,y:p.y*vh,v:p.visibility==null?1:p.visibility}});
  if(P.ls.v<.5||P.rs.v<.5||P.lh.v<.4||P.rh.v<.4){lvDrawSk(x,P,'#ff5c93',vw);lvSetMsg('🙋 Omuzlar ve bel görünmeli, biraz geri çekilin');return}
  const sm=mid(P.ls,P.rs),hm=mid(P.lh,P.rh),T=dist(sm,hm),sw=dist(P.ls,P.rs);if(T<8)return;
  lvDrawSk(x,P,'#2ec4b6',vw);
  if(lv.cal)lvCalStep(P,sm,hm,T,sw);
  if(!lv.base){lv.baseAcc.push({x:hm.x,y:hm.y,T,sw});if(lv.baseAcc.length>=15){lv.base=avgBase(lv.baseAcc);if(!lv.cal)lvSetMsg('✅ Takip ediliyor, tahtaya bakın!')}return}
  lvAutoId(v,P,sm,hm,T);
  const f=lv.flip?-1:1,out=[];KN.forEach(k=>{out.push(r3((P[k].x-hm.x)/T*f),r3((P[k].y-hm.y)/T),r2(P[k].v))});
  const ox=(hm.x-lv.base.x)/lv.base.sw*f,oy=(lv.base.y-hm.y)/lv.base.T;
  const now=performance.now();if(now-lv.lastSend>55){lv.lastSend=now;sendQ({t:'pose',p:out,ox:r3(ox),oy:r3(oy),sc:r3(T/lv.base.T)})}}
function curName(){const s=roster.list.find(x=>x.id===roster.active);return s?firstName(s.name)+', ':''}
function lvSay(t){lvSetMsg(t);sendQ({t:'say',txt:t})}
function lvCalib(){if(!lv.run){toast('Önce kamerayı açın');return}lv.cal={st:'center',n:0,acc:[],t0:performance.now()};lvSay(curName()+'ortaya geç ve kıpırdamadan dur!')}
function lvCalStep(P,sm,hm,T,sw){const c=lv.cal,now=performance.now();
  if(c.st==='center'){if(now-c.t0<2000)return;c.acc.push({x:hm.x,y:hm.y,T,sw});if(c.acc.length>=25){lv.base=avgBase(c.acc);c.st='hand';c.t0=now;c.n=0;lvSay(curName()+'şimdi SAĞ elini havaya kaldır! ✋')}}
  else if(c.st==='hand'){if(now-c.t0<1200)return;const up=w=>P[w].v>.4&&P[w].y<P.nose.y;const lu=up('lw'),ru=up('rw');
    if(lu!==ru){if(++c.n>=8){const w=lu?P.lw:P.rw;lv.flip=(w.x-sm.x)<0;LS.set('mr_flip',lv.flip);lv.cal=null;lvSay('Harika! Kalibrasyon tamam ✅');if(navigator.vibrate)navigator.vibrate([80,60,80])}}else c.n=0;
    if(lv.cal&&now-c.t0>15000){lv.cal=null;lvSay('Sağ el görülemedi, kalibrasyonu tekrar deneyin')}}}

<script>

/* ---------- panel ---------- */
function yonBuild(){const P=$('#p-yon');if(P.dataset.built)return;P.dataset.built=1;
 P.innerHTML=`<div class="yonBar">

  </div>

    <span></span><button style="background:${YDIR.geri.c}" onclick="yInput('geri')"><b>⬇️</b>GERİ</button><span></span>

   <div class="yonAns hide" id="yonBody"><button style="background:#16a34a" onclick="yBodyManual(true)">✅ Doğru yaptı</button><button style="background:#e11d48" onclick="yBodyManual(false)">❌ Karıştırdı</button><button style="background:#7c4dff" onclick="yNext()">⏭ Yeni komut</button></div>
  </div>`;
 document.addEventListener('keydown',e=>{if(tab!=='yon')return;const m={ArrowRight:'sag',ArrowLeft:'sol',ArrowUp:'ileri',ArrowDown:'geri'}[e.key];if(m){e.preventDefault();e.stopImmediatePropagation();yInput(m)}},true)}

 for(let t=0;t<80&&!steps;t++){let x=Y.ax,z=Y.az,st=[];
  if(!L.k){const d=pick(L.d);const n=Math.random()<.35?2:1;for(let i=0;i<n;i++)st.push(d)}

 else{html=`${esc(n)}, ${st.map((d,i)=>(i===0?'önce ':i===st.length-1?'sonra ':'')+wSpan(d)).join(', ')} git, ${it[0]} ${it[2]} al!`;sp=`${n}, `+st.map((d,i)=>(i===0?'önce ':i===st.length-1?'sonra ':'')+YDIR[d].go.toLocaleLowerCase('tr')).join(', ')+` git, ${it[2]} al!`}

  const sm=avg(sh),hm=avg(hp),T=dist(sm,hm),sw=sh.length===2?dist(P.ls,P.rs):T*.6;if(T<8)return;

/* kalibrasyon: ortada dur → 1 adım İLERİ → geri gel → 1 adım SAĞA → geri gel */
function lvCalib(){if(!lv.run){toast('Önce kamerayı açın');return}lv.cal={st:'center',t0:performance.now(),acc:[],tries:0};lvSay(curName()+'ortaya geç ve kıpırdamadan dur!')}
function lvCal2(hm,T,sw){const c=lv.cal,now=performance.now(),el=now-c.t0;const n=curName();

    if(c.acc.length>=10){const m=[c.acc.reduce((s,a)=>s+a[0],0)/c.acc.length,c.acc.reduce((s,a)=>s+a[1],0)/c.acc.length];c[c.st]=m;c.acc=[];c.st=c.st==='ileri'?'back1':'back2';c.t0=now;lvSay(n+'şimdi eski yerine geri dön.')}
    else if(el>9000){c.acc=[];c.t0=now;if(++c.tries>2){lv.cal=null;lvSay('Adım görülemedi. Telefonu çocuğun tamamını görecek yere koyup tekrar deneyin.');return}lvSay(n+'biraz daha büyük bir adım at! '+(c.st==='ileri'?'İLERİ ⬆️':'SAĞA ➡️'))}return}
  if(c.st==='back1'||c.st==='back2'){if(el<1500)return;if(mag<.4||el>5000){if(c.st==='back1'){c.st='sag';c.t0=now;lvSay(n+'şimdi bir adım SAĞA at ve dur! ➡️ (kırmızı bileklik tarafı)')}else lvCalFinish()}}}
function lvCalFinish(){const c=lv.cal;lv.cal=null;const s=c.sag,i=c.ileri;if(!s||!i){lvSay('Kalibrasyon tamamlanamadı, tekrar deneyin');return}

/* ---------- TELEFON: arayüz eklemeleri ---------- */

function genMaze(C,R){const w=[...Array(R)].map(()=>[...Array(C)].map(()=>({t:1,r:1,b:1,l:1,v:0})));const st=[[0,0]];w[0][0].v=1;
  while(st.length){const [x,y]=st[st.length-1];const nb=[[0,-1,'t','b'],[1,0,'r','l'],[0,1,'b','t'],[-1,0,'l','r']].map(([dx,dy,a,b])=>[x+dx,y+dy,a,b]).filter(([nx,ny])=>nx>=0&&ny>=0&&nx<C&&ny<R&&!w[ny][nx].v);
    if(!nb.length){st.pop();continue}const [nx,ny,a,b]=pick(nb);w[y][x][a]=0;w[ny][nx][b]=0;w[ny][nx].v=1;st.push([nx,ny])}return w}
NEWG.labirent=function(){const L=[[4,3],[5,3],[5,4],[6,4],[7,5],[8,5],[9,6]][Math.min(G.lv.labirent||0,6)];const [C,R]=L;const goal=pick(['🍎','⭐','🍌','🎁','🏆','🍦']);

  MZ={C,R,w:genMaze(C,R),px:0,py:0,trail:[[0,0]],goal,img,bump:0,done:false};
  const cv=$('#mzCv');const draw=()=>{if(!MZ||!document.body.contains(cv))return;const W=A.clientWidth,H=A.clientHeight,dpr=Math.min(2,devicePixelRatio||1);if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);

function pts(f,n=160){return [...Array(n+1)].map((_,i)=>f(i/n))}
const TRACE=[
 {n:'düz çizgi',a:'düz çizgiyi',e:'➖',f:()=>pts(t=>[.08+.84*t,.5])},
 {n:'dik çizgi',a:'dik çizgiyi',e:'⬇️',sq:1,f:()=>pts(t=>[.5,.08+.84*t])},
 {n:'eğik çizgi',a:'eğik çizgiyi',e:'↘️',sq:1,f:()=>pts(t=>[.12+.76*t,.12+.76*t])},
 {n:'zikzak',a:'zikzakı',e:'⚡',f:()=>pts(t=>{const k=t*6,i=Math.floor(k),f=k-i;return [.06+.88*t,i%2?.25+.5*f:.75-.5*f]})},
 {n:'dalga',a:'dalgayı',e:'🌊',f:()=>pts(t=>[.06+.88*t,.5+.25*Math.sin(t*Math.PI*4)])},
 {n:'daire',a:'daireyi',e:'⭕',sq:1,f:()=>pts(t=>[.5+.4*Math.cos(-Math.PI/2+t*Math.PI*2),.5+.4*Math.sin(-Math.PI/2+t*Math.PI*2)])},
 {n:'kare',a:'kareyi',e:'⬜',sq:1,f:()=>pts(t=>{const s=t*4,i=Math.min(3,Math.floor(s)),f=s-i;return [[.12+.76*f,.12],[.88,.12+.76*f],[.88-.76*f,.88],[.12,.88-.76*f]][i]})},
 {n:'üçgen',a:'üçgeni',e:'🔺',sq:1,f:()=>pts(t=>{const P=[[.5,.1],[.9,.88],[.1,.88],[.5,.1]];const s=t*3,i=Math.min(2,Math.floor(s)),f=s-i;return [P[i][0]+(P[i+1][0]-P[i][0])*f,P[i][1]+(P[i+1][1]-P[i][1])*f]})},
 {n:'merdiven',a:'merdiveni',e:'🪜',f:()=>pts(t=>{const k=t*8,i=Math.floor(Math.min(k,7.999)),f=k-i,st=Math.floor(i/2);return i%2?[.1+.2*st+.2,.85-.18*st-.18*f]:[.1+.2*st+.2*f,.85-.18*st]})},
 {n:'spiral',a:'spirali',e:'🌀',sq:1,f:()=>pts(t=>{const a=t*Math.PI*5,r=.06+.36*t;return [.5+r*Math.cos(a),.5+r*Math.sin(a)]},260)}];

function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dayRec(s){if(!s)return null;s.days=s.days||{};const k=dayKey();return s.days[k]=s.days[k]||{a:{},st:0,dir:{}}}

  const D=dayRec(s);const a=D.a[k]=D.a[k]||[0,0];if(win)a[1]++;else a[0]++;LS.set('mr_db',db)}
const _giveStar8=giveStar;giveStar=function(id){_giveStar8(id);const s=stu(id);const D=dayRec(s);if(D){D.st++;LS.set('mr_db',db)}};

function poolBank(pool,qs){return qs.map(([q,l,sh])=>{const c=pool.find(p=>p[1]===l);return [q,c,pool.filter(p=>p[1]!==l),sh]})}
function sortGame(k,S){const nb=S.bins.length,per=nb>=4?2:nb===3?2:3;const A=gShell(`${gPre()}${S.t} Doğru yere sürükle!`);

      if(tgt===bi){el.dataset.lock=1;el.style.position='static';el.style.width=el.style.height=(sz*.78)+'px';el.style.fontSize=(sz*.54)+'px';$('#snB'+bi).querySelector('.snIn').appendChild(el);sfx.ok();got++;if(got===items.length){gUp(k);gWin(`Hepsini doğru yerleştirdin${gName()?' '+gName():''}!`,()=>zStart(k))}}
      else{if(tgt>=0){sfx.no();say(S.hint||'Hmm, bir daha düşün!')}el.style.transition='left .3s,top .3s';el.style.left=ox+'px';el.style.top=oy+'px';setTimeout(()=>el.style.transition='',320)}})});

<script>

   📅 HAFTALIK BÜLTEN (anaokulu v10)

   Yapay zekâ anahtarı (Gemini) varsa fotoğraf otomatik okunur ve o haftaya özel sorular üretilir.

const blMon=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x};

function blKInfo(id){const [k,p]=id.split(':');if(k==='renk')return {ad:p==='*'?'Renk Avı':'Renk: '+p.toLocaleUpperCase('tr'),e:'🎨'};if(k==='sayi')return {ad:p==='*'?'Sayılar':p+' Sayısı',e:'🔢'};if(k==='zit')return {ad:p.split('-').map(x=>x.charAt(0).toLocaleUpperCase('tr')+x.slice(1)).join(' – '),e:'⚖️'};if(k==='ai')return {ad:'Yapay Zekâ Soruları',e:'🤖'};const c=KAVM[id];return c?{ad:c.ad,e:c.e}:{ad:id,e:'⭐'}}

function blSayi(n){if(!n||n==='*')n=RN0(1,10);n=+n;const em=pick(['🍎','⭐','🐞','🎈','🐟','🌼']);const m=rnd(3);

    const em=p==='büyük-küçük'?pick(['🐘','🍎','🧸','⚽']):null;const o=shuffle([A,B]).map(v=>({v,h:p==='büyük-küçük'?`<span style="font-size:${v===A?'1.15em':'.45em'}">${em}</span>`:sv(v)}));

  const L=ZITL[p]||ZITL[B+'-'+A],R=ZITR[p]||ZITR[B+'-'+A];if(!L){blQ(KBANK.duyu,lbl);return}const key=ZITL[p]?p:B+'-'+A;const [kA,kB]=key.split('-');const yes=ask===kA?L:R,no=ask===kA?R:L;const a=pick(yes);
  quiz(`${gPre()}hangisi ${ask.toLocaleUpperCase('tr')}?`,shuffle([a,...shuffle(no).slice(0,2)]).map(o=>({v:o[1],h:opE(o)})),a[1],blChip(lbl)+'<span style="font-size:.6em">⚖️</span>');say(`${gPre()}hangisi ${ask}?`)}

const BL_PROMPT=y=>`Sen bir anaokulu öğretmeni asistanısın. Sana bir okul öncesi HAFTALIK BÜLTEN (plan) veriliyor. Bilgileri çıkar ve 4-6 yaş çocuklar için soru üret.
SADECE geçerli JSON döndür, başka hiçbir şey yazma. Biçim:
{"baslik":"","pazartesi":"YYYY-MM-DD veya boş","gunler":[{"gun":"Pazartesi","konu":"","etkinlikler":[""],"kavramlar":[""],"sorular":[{"s":"","d":["emoji","etiket"],"y":[["emoji","etiket"],["emoji","etiket"]]}]}],"veli_notu":""}
Kurallar: Tam 5 gün (Pazartesi-Cuma) sırayla. Tarih görselde varsa "pazartesi" alanına ${y} yılına göre yaz. "kavramlar": renkler (ör. mavi), sayılar (ör. 3 sayısı), zıt kavramlar (ör. uzun-kısa, kalın-ince), duyular, mevsim, bayram gibi kısa kelimeler. Her gün için 5 soru: çok kısa, tek cümle, çocuk dilinde, o günün konusuyla ilgili; "d" doğru seçenek, "y" iki yanlış seçenek; her seçenekte TEK emoji ve 1-3 kelimelik Türkçe etiket; etiketler birbirinden farklı; korkutucu içerik yok. "veli_notu": velilere evde yapabilecekleri 1-2 cümlelik öneri.`;
async function blAICall(parts){const keys=blKeys();if(!keys.length)throw new Error('Anahtar yok');let model=LS.get('mr_ai_model','gemini-2.5-flash')||'gemini-2.5-flash';const models=[model,'gemini-2.5-flash','gemini-2.0-flash'].filter((v,i,a)=>a.indexOf(v)===i);let last='';
  for(const md of models)for(const k of keys){try{const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(md)}:generateContent?key=${encodeURIComponent(k)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts}],generationConfig:{responseMimeType:'application/json',temperature:.4}})});
    if(r.status===404){last='Model bulunamadı: '+md;break}if(!r.ok){last='Hata '+r.status;continue}const j=await r.json();const t=j?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('')||'';const s=t.slice(t.indexOf('{'),t.lastIndexOf('}')+1);return JSON.parse(s)}catch(e){last=e.message||String(e)}}throw new Error(last||'Yanıt alınamadı')}
async function blAIRun(){const w=BL.edit;if(!w)return;const st=$('#blAIst'),bt=$('#blAIbtn');if(bt)bt.disabled=true;if(st)st.textContent='⏳ Bülten okunuyor… (10-30 sn)';
  try{const parts=[{text:BL_PROMPT(new Date().getFullYear())}];if(w.img)parts.push({inline_data:{mime_type:'image/jpeg',data:w.img.split(',')[1]}});const tx=$('#blTxt');if(tx&&tx.value)parts.push({text:'Bülten metni:\n'+tx.value});
    const J=await blAICall(parts);blApplyAI(J);if(st)st.textContent='✅ Okundu! Kontrol edip 💾 Kaydet\'e basın.';sfx.ok&&sfx.ok()}catch(e){if(st)st.textContent='⚠️ Okunamadı ('+e.message+'). Konuları elle yazabilirsiniz.'}finally{if(bt)bt.disabled=false}}
function blApplyAI(J){const w=BL.edit;if(!J||!Array.isArray(J.gunler))throw new Error('Biçim hatalı');w.ai=true;
  const sanitizeO=o=>Array.isArray(o)&&o.length>=2?[String(o[0]).slice(0,8),String(o[1]).slice(0,40)]:null;
  J.gunler.slice(0,5).forEach((g,i)=>{const sor=(g.sorular||[]).map(q=>{const d=sanitizeO(q.d),y=(q.y||[]).map(sanitizeO).filter(Boolean).filter(o=>d&&o[1]!==d[1]);return q.s&&d&&y.length?[String(q.s).slice(0,140),d,y.slice(0,3)]:null}).filter(Boolean);
    w.gunler[i]=Object.assign(w.gunler[i]||{},{konu:String(g.konu||'').slice(0,80),etk:(g.etkinlikler||[]).map(s=>String(s).slice(0,80)).slice(0,6),kavramlar:(g.kavramlar||[]).map(s=>String(s).slice(0,40)).slice(0,8),sorular:sor});
    const K=$('#blK'+i),E=$('#blE'+i);if(K)K.value=w.gunler[i].konu;if(E)E.value=w.gunler[i].etk.join('\n');blPrev(i)});
  if(J.baslik&&$('#blB'))$('#blB').value=String(J.baslik).slice(0,90);if(/^\d{4}-\d\d-\d\d$/.test(J.pazartesi||'')&&$('#blD'))$('#blD').value=blIso(blMon(blDate(J.pazartesi)));if(J.veli_notu&&$('#blN'))$('#blN').value=String(J.veli_notu).slice(0,300)}

function blVeli(){const w=blCur();if(!w)return;const b=blDate(w.bas);const s=stu(active);
